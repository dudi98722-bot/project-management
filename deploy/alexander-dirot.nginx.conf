server {
    server_name alexander-dirot.dudi-ananalytics.com;
    client_max_body_size 60M;

    root /var/www/alexander-dirot;
    index index.html;

    # כותרות אבטחה. הקובץ מוכלל שוב בתוך ה-location של ה-html, כי
    # add_header מקומי מבטל את כל מה שירש מה-server.
    include /etc/nginx/snippets/alexander-dirot-headers.conf;

    # קבצי גיבוי ובילדים ישנים לא מוגשים לעולם, גם אם נשכחו בתיקייה
    location ~* \.(bak|prev|old|orig|save|swp|tmp)(\.[^/]*)?$ { deny all; }
    location ~* \.html\.[^/]+$ { deny all; }
    location ~ /\.(git|env|ht) { deny all; }

    # השירות הישן שישב ב-/api כבוי ומנוטרל. הכתובת עונה 404 במפורש.
    location = /api { return 404; }
    location /api/ { return 404; }

    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/alexander-dirot-headers.conf;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alexander-dirot.dudi-ananalytics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexander-dirot.dudi-ananalytics.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = alexander-dirot.dudi-ananalytics.com) { return 301 https://$host$request_uri; }
    listen 80;
    server_name alexander-dirot.dudi-ananalytics.com;
    return 404;
}
