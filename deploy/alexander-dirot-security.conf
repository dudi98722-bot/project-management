# ============================================================
#  כותרות אבטחה ל-alexander-dirot.dudi-ananalytics.com
#  מותקן ב: /etc/nginx/snippets/alexander-dirot-headers.conf
#  ------------------------------------------------------------
#  חשוב: ב-nginx, add_header בתוך location מבטל את כל ה-add_header
#  שירש מה-server. לכן הקובץ הזה מוכלל גם ברמת ה-server וגם בתוך
#  ה-location של קבצי ה-html (שם יש add_header משלו ל-Cache-Control).
#
#  CSP: כל קוד האפליקציה הוא סקריפט inline יחיד בתוך ה-HTML, ולכן
#  'unsafe-inline' הכרחי לסקריפטים. מה שה-CSP כן נותן: חסימת טעינת
#  סקריפט חיצוני, וחסימת הוצאת מידע לשרת זר (connect/img/form) — גם אם
#  ייכנס קוד זר לדף, הוא לא יוכל לשלוח את הנתונים החוצה.
#  מותר רק מה שהאפליקציה באמת טוענת: Apps Script, גופני גוגל,
#  ותצוגת קבצים מדרייב. משאב חיצוני חדש מחייב עדכון כאן.
# ============================================================
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://drive.google.com https://*.googleusercontent.com https://*.google.com; media-src 'self' blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com; frame-src https://drive.google.com https://docs.google.com; frame-ancestors 'self'; form-action 'none'; base-uri 'self'; object-src 'none'" always;
