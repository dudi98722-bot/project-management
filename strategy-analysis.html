<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת ניתוח אסטרטגי — שיטת זילבר</title>
<style>
:root{
  --bg:#0f1525; --panel:#161e33; --panel2:#1d2740; --card:#1a2238; --line:#2a375a;
  --txt:#eaf0ff; --muted:#9fb0d6; --soft:#7e8fbb;
  --pri:#5b8cff; --pri2:#3f6fe0; --teal:#2dd4bf; --amber:#fbbf24; --rose:#fb7185; --green:#34d399;
  --good:#34d399; --mid:#fbbf24; --bad:#fb7185;
  --shadow:0 10px 30px rgba(0,0,0,.35); --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Heebo','Assistant','Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#0c1220,#0f1525 40%);color:var(--txt);min-height:100vh;font-size:15px;line-height:1.55}
a{color:var(--pri)}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(13,18,32,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .inr{max-width:1180px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:.2px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--teal));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 14px rgba(91,140,255,.4)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--soft);letter-spacing:0}
.nav{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
.nav button:hover{background:var(--panel2);color:var(--txt)}
.nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}

h1,h2,h3{margin:0 0 6px}
.page-h{margin:26px 0 6px;font-size:26px;font-weight:800}
.page-sub{color:var(--muted);margin:0 0 22px;font-size:14px}

/* buttons */
.btn{background:var(--pri);color:#fff;border:0;border-radius:11px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{background:var(--pri2);transform:translateY(-1px)}
.btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--card)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.danger:hover{background:rgba(251,113,133,.12)}

/* cards / grid */
.grid{display:grid;gap:16px}
.clients-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ccard{background:linear-gradient(160deg,var(--card),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.ccard:hover{border-color:var(--pri);transform:translateY(-3px);box-shadow:var(--shadow)}
.ccard .nm{font-size:18px;font-weight:800;margin-bottom:2px}
.ccard .bz{color:var(--muted);font-size:13px;margin-bottom:14px}
.ccard .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--soft)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill.s-new{background:rgba(91,140,255,.16);color:#9cb8ff}
.pill.s-diag{background:rgba(251,191,36,.16);color:#fcd66b}
.pill.s-strat{background:rgba(45,212,191,.16);color:#5fe9d8}
.pill.s-done{background:rgba(52,211,153,.16);color:#6ee7b7}
.prog{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:12px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--teal))}
.add-card{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;border:2px dashed var(--line);color:var(--muted);min-height:150px;background:transparent}
.add-card:hover{border-color:var(--pri);color:var(--txt)}
.add-card .plus{width:46px;height:46px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:26px}

/* client workbench */
.cwrap{display:grid;grid-template-columns:248px 1fr;gap:22px;margin-top:18px;align-items:start}
.stepper{position:sticky;top:74px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px;display:flex;flex-direction:column;gap:3px}
.step{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;border:0;background:transparent;text-align:start;width:100%}
.step:hover{background:var(--panel2);color:var(--txt)}
.step.on{background:var(--pri);color:#fff}
.step .n{width:25px;height:25px;border-radius:50%;background:var(--panel2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex-shrink:0}
.step.on .n{background:rgba(255,255,255,.25);color:#fff}
.step .ck{margin-inline-start:auto;color:var(--green);font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-height:400px}
.panel h2{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}
.panel .lead{color:var(--muted);font-size:13.5px;margin:0 0 20px;padding-bottom:14px;border-bottom:1px solid var(--line)}

/* fields */
.fld{margin-bottom:16px}
.fld>label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.fld .hint{color:var(--soft);font-size:12.5px;font-weight:400;margin-top:2px}
input[type=text],input[type=tel],input[type=number],input[type=date],textarea,select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);
  padding:10px 12px;font-size:14px;font-family:inherit;outline:none;transition:.15s}
textarea{resize:vertical;min-height:74px;line-height:1.6}
input:focus,textarea:focus,select:focus{border-color:var(--pri);background:#1a2238}
select{cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:760px){.row2,.row3{grid-template-columns:1fr}}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;transition:.12s;user-select:none}
.chip:hover{border-color:var(--pri);color:var(--txt)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* reference / accordion */
.ref{margin:6px 0 18px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel2)}
.ref>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--teal);list-style:none;display:flex;align-items:center;gap:8px}
.ref>summary::-webkit-details-marker{display:none}
.ref>summary:before{content:'📘'}
.ref[open]>summary{border-bottom:1px solid var(--line)}
.ref .rbody{padding:13px 16px;font-size:13px;color:var(--muted);line-height:1.7}
.ref .rbody b{color:var(--txt)}
.ref .rbody ul{margin:6px 0;padding-inline-start:20px}
.ref .rbody li{margin:3px 0}

.qbank{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px 4px;margin-bottom:8px}
.qbank .qh{font-weight:700;font-size:13px;color:var(--amber);padding:8px 12px}
.qrow{display:flex;gap:9px;align-items:flex-start;padding:7px 12px;font-size:13px;border-top:1px solid var(--line);color:var(--muted)}
.qrow .qp{color:var(--soft);font-size:11.5px}

/* AEM meters */
.aem-box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}
.aem-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.aem-row .lbl{width:62px;font-weight:700;font-size:13px}
.aem-row input[type=range]{flex:1;accent-color:var(--pri)}
.aem-row .val{width:42px;text-align:center;font-weight:800;color:var(--pri)}
.aem-result{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.aem-tag{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:12.5px;flex:1;min-width:150px}
.aem-tag b{display:block;font-size:14px;margin-bottom:3px}
.sumbadge{display:inline-block;font-size:12px;color:var(--soft);margin-inline-start:8px}

/* 9 types grid */
.t9{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.t9 .tt{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.t9 .tt .tn{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.t9 .tt input[type=range]{width:100%;accent-color:var(--teal);margin-top:7px}
.t9 .tt .sc{font-weight:800;color:var(--teal);font-size:13px}
.t9 .tt .imp{font-size:11.5px;color:var(--soft);margin-top:5px;display:none}
.t9 .tt.hot{border-color:var(--teal)}
.t9 .tt.hot .imp{display:block}

/* forces */
.force-cat{margin-bottom:8px}
.force-cat>summary{cursor:pointer;font-weight:700;font-size:14px;padding:10px 0;display:flex;align-items:center;gap:9px;list-style:none}
.force-cat>summary::-webkit-details-marker{display:none}
.force-cat>summary:before{content:'▼';font-size:10px;color:var(--soft);transition:.2s}
.force-cat:not([open])>summary:before{transform:rotate(-90deg)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel2);font-size:13px}
.frow .fq{flex:1}
.frow .fq small{display:block;color:var(--soft);font-size:11px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-shrink:0}
.seg button{background:var(--card);border:0;color:var(--muted);padding:6px 10px;font-size:12px;cursor:pointer;font-weight:600;border-inline-start:1px solid var(--line)}
.seg button:first-child{border:0}
.seg button.pos.on{background:var(--good);color:#06281d}
.seg button.neu.on{background:var(--soft);color:#10182b}
.seg button.neg.on{background:var(--bad);color:#3a0d18}
.score-banner{display:flex;align-items:center;gap:16px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:14px 0}
.score-ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0}

/* repeater list */
.litem{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;position:relative}
.litem .del{position:absolute;top:10px;left:10px;background:transparent;border:0;color:var(--bad);cursor:pointer;font-size:17px}
.litem h4{margin:0 0 10px;font-size:14px;color:var(--teal)}
.addbtn{background:transparent;border:1.5px dashed var(--line);color:var(--muted);border-radius:10px;padding:9px;width:100%;cursor:pointer;font-weight:600;font-size:13px}
.addbtn:hover{border-color:var(--pri);color:var(--txt)}

/* whys */
.why{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.why .wn{width:30px;height:30px;flex-shrink:0;border-radius:8px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--amber);font-size:13px}

/* methodology */
.meth-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.meth-tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:600;font-size:13px}
.meth-tabs button.on{background:var(--teal);color:#06281d;border-color:var(--teal)}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.mcard h3{font-size:16px;color:var(--pri);margin-bottom:8px}
.mcard p,.mcard li{color:var(--muted);font-size:13.5px}
.mcard ul{padding-inline-start:20px}

/* report */
.report{background:#fff;color:#1a2236;border-radius:14px;padding:42px 46px;box-shadow:var(--shadow);font-size:14px;line-height:1.7}
.report h1{color:#16203a;font-size:28px;border-bottom:3px solid #5b8cff;padding-bottom:10px;margin-bottom:4px}
.report .r-meta{color:#64748b;font-size:13px;margin-bottom:24px}
.report h2{color:#2a3a66;font-size:18px;margin:26px 0 8px;padding-inline-start:11px;border-inline-start:4px solid #2dd4bf}
.report .r-block{background:#f5f8ff;border:1px solid #e3ebfa;border-radius:10px;padding:14px 16px;margin-bottom:10px;white-space:pre-wrap}
.report .r-empty{color:#94a3b8;font-style:italic}
.report .r-kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;margin:8px 0}
.report .r-kv .k{font-weight:700;color:#475569}
.report .r-tags span{display:inline-block;background:#eef4ff;border:1px solid #d6e2fb;color:#2a3a66;border-radius:16px;padding:3px 11px;font-size:12.5px;margin:3px 4px 3px 0}
.report .r-foot{margin-top:34px;padding-top:16px;border-top:1px solid #e2e8f0;color:#64748b;font-size:12px}
.report .r-strat{background:linear-gradient(135deg,#eef4ff,#e9fbf7);border:1px solid #cfe0fb;border-radius:12px;padding:18px 20px;text-align:center;margin:10px 0}
.report .r-strat b{font-size:20px;color:#16203a;display:block}

.empty-state{text-align:center;padding:70px 20px;color:var(--muted)}
.empty-state .ico{font-size:54px;margin-bottom:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--pri);color:var(--txt);padding:12px 22px;border-radius:12px;box-shadow:var(--shadow);z-index:100;font-weight:600;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;bottom:34px}
.muted{color:var(--muted)}
.tiny{font-size:12px;color:var(--soft)}
.sec-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}

@media print{
  body{background:#fff}
  .top,.stepper,.no-print,.sec-actions{display:none!important}
  .cwrap{display:block}
  .report{box-shadow:none;border-radius:0;padding:0}
  .wrap{padding:0}
}
@media(max-width:880px){.cwrap{grid-template-columns:1fr}.stepper{position:static;flex-direction:row;overflow-x:auto}.step .ck,.step span.tl{display:none}}
</style>
</head>
<body>
<div class="top"><div class="inr">
  <div class="brand"><div class="logo">🧭</div><div>ניתוח אסטרטגי<small>שיטת זילבר · הכשרת יועצים עסקיים</small></div></div>
  <div class="nav" id="nav"></div>
</div></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   מערכת ניתוח אסטרטגי — שיטת זילבר
   בסיס הידע (KB) מזוקק מתוך פרוטוקולי הקורס:
   פרוטוקול תחילת תהליך, פרוטוקול אסטרטגיה, 9 הטיפוסים, אבחון אמן/יזם/מנהל
   ============================================================ */
const KB = {
  triggerTypes:['כאב / תסכול','השראה / פתרון','אירוע חיים','פחד','שאיפה','רגולציה / חוק','יחסים'],

  visibleReasons:['הקמה / רכישה / סיום','רווחיות / תזרים / כספים','שיווק / מכירות / בידול / תחרות',
    'ניהול / תפעול / אסטרטגיה','עובדים / האצלה / מבנה ארגוני','שותפות / בני זוג / מתחים','עומס / שחיקה / תקיעות של בעל העסק'],

  aem:{
    artist:{name:'אמן',ico:'🎨',essence:'מחובר למוצר, למקצועיות ולדיוק. רואה את העסק דרך עיני המקצוע.',
      strengths:'מצוינות, ייחודיות וחיבור עמוק למהות.',
      weaknesses:'קושי במכירות, בניהול אנשים, ובהפיכת הכישרון האישי למערכת עסקית רחבה.',
      says:'"חשוב לי שזה יהיה טוב" · "אני לא מסוגל להוציא משהו לא ברמה" · "קשה לי עם כל המסביב"'},
    entrepreneur:{name:'יזם',ico:'🚀',essence:'חי רעיונות, הזדמנויות ופריצות דרך. חושב בגדול וצופה פני עתיד.',
      strengths:'חזון, תעוזה, זיהוי הזדמנויות ויכולת הנעת תהליכים.',
      weaknesses:'פיזור, חוסר יציבות, קושי בסדר ובהתמדה (נטייה להתחיל ולא לסיים).',
      says:'"אני חייב תנועה" · "אני רואה כל הזמן אפשרויות" · "יש לי מלא רעיונות" · "אני טוב בלפתוח דברים"'},
    manager:{name:'מנהל',ico:'📊',essence:'אוהב סדר, שגרה, מדידה ובקרה. רוצה שהדברים יעבדו "לפי הספר".',
      strengths:'שיטתיות, ארגון, יישום ובניית מערכות יציבות.',
      weaknesses:'חוסר ביצירתיות ובתשוקה לפריצה, זהירות יתר וקושי עם חוסר ודאות.',
      says:'"אני חייב סדר" · "בלי מעקב שום דבר לא קורה" · "אני רוצה לראות מספרים"'}
  },

  types9:[
    {k:'technical',n:'הטכני / הטכנולוגי',high:'מחובר לקרקע, צריך לראות מציאות מול העיניים, לגעת ולחוש. עושה עבודה מצוינת בתחומו.',low:'איש תיאוריה ולא מעש, לא אוהב ללכלך ידיים.',imp:'חזק בעצם העשייה — חלש ביזמות ובניהול.'},
    {k:'scientist',n:'המדען / החוקר',high:'אוהב ללמוד ולהחכים, יודע המון על תחומו, שואף להבין עד הסוף.',low:'לא אוהב לחקור; לומד רק בשטח ולא מהוראות.',imp:'סכנה: לשקוע בלימוד ולא לבצע.'},
    {k:'field',n:'איש השטח / הטבע',high:'אוהב גיוון, מרחב ותנועה; לא יכול לעשות כל יום אותו דבר.',low:'אוהב את הפינה שלו, שונא נסיעות והפתעות.',imp:'יתקשה בניהול ובשגרה — צריך תחום עם גיוון.'},

  strategy:{ownerAnswers:'',repeatingWords:'',professionalValue:'',personalValue:'',differentiation:'',oneSentence:'',businessModel:'',economicCheck:'',checklist:[]},

/* nested get/set by path */
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setP(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}

/* ===================== STATE / ROUTER ===================== */
let S={view:'clients',cid:null,stage:'overview',meth:'process'};
const $=s=>document.querySelector(s);
function cur(){return DB.clients.find(c=>c.id===S.cid)}
function go(view,extra){S.view=view;Object.assign(S,extra||{});render()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900)}
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  $('#nav').innerHTML=[['clients','לקוחות'],['methodology','מתודולוגיה'],['settings','הגדרות']]
    .map(([v,l])=>`<button class="${S.view===v?'on':''}" data-go="${v}">${l}</button>`).join('');
  const app=$('#app');
  if(S.view==='clients')app.innerHTML=viewClients();
  else if(S.view==='client')app.innerHTML=viewClient();
  else if(S.view==='methodology')app.innerHTML=viewMethodology();
  else if(S.view==='settings')app.innerHTML=viewSettings();
  window.scrollTo(0,0);
}

/* ===================== VIEW: CLIENTS ===================== */
function completeness(c){
  const checks=[
    c.intake.trigger||c.intake.visibleProblem,
    (c.owner.aem.artist!==33||c.owner.aem.entrepreneur!==33)||c.owner.strengths,
    Object.keys(c.industry.ratings).length>=4,
    c.customer.interviews.length>0||c.customer.journey.trigger,
    c.root.primaryRoot||c.root.sixRoots.length,
    c.strategy.oneSentence||c.strategy.differentiation,
    c.goals.top,
    c.decision.type
  ];
  return Math.round(checks.filter(Boolean).length/checks.length*100);
}
const STATUS={new:['חדש','s-new'],diag:['באבחון','s-diag'],strat:['גיבוש אסטרטגיה','s-strat'],done:['הושלם','s-done']};
function viewClients(){
  const cs=DB.clients.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  let cards=cs.map(c=>{const st=STATUS[c.status]||STATUS.new;const pr=completeness(c);
    return `<div class="ccard" data-open="${c.id}">
      <div class="nm">${esc(c.name)||'ללא שם'}</div>
      <div class="bz">${esc(c.business)||'—'}</div>
      <div class="meta"><span class="pill ${st[1]}">${st[0]}</span><span>${pr}% הושלם</span></div>
      <div class="prog"><i style="width:${pr}%"></i></div>
    </div>`}).join('');
  return `<h1 class="page-h">תיקי לקוחות</h1>
    <p class="page-sub">כל לקוח עובר את התהליך המלא לפי שיטת זילבר — מאבחון ועד דוח אסטרטגי.</p>
    <div class="grid clients-grid">
      <div class="ccard add-card" data-new="1"><div class="plus">+</div><b>לקוח חדש</b></div>
      ${cards}
    </div>`;
}

/* ===================== VIEW: CLIENT WORKBENCH ===================== */
function viewClient(){
  const c=cur();if(!c)return go('clients'),'';
  const steps=STAGES.map(s=>{const done=stageDone(c,s.k);
    return `<button class="step ${S.stage===s.k?'on':''}" data-stage="${s.k}">
      <span class="n">${s.ic}</span><span class="tl">${s.n}</span>${done?'<span class="ck">✔</span>':''}</button>`}).join('');
  return `<div style="display:flex;align-items:center;gap:12px;margin:22px 0 4px">
      <button class="btn ghost sm" data-go="clients">‹ לכל הלקוחות</button>
      <div><div style="font-size:22px;font-weight:800">${esc(c.name)||'לקוח חדש'}</div>
      <div class="tiny">${esc(c.business)||''}</div></div>
    </div>
    <div class="cwrap"><div class="stepper">${steps}</div><div class="panel">${stageHTML(c,S.stage)}</div></div>`;
}
function stageDone(c,k){
  switch(k){
    case'intake':return!!(c.intake.trigger||c.intake.visibleProblem);
    case'owner':return!!(c.owner.strengths||c.owner.aem.artist!==33||c.owner.aem.entrepreneur!==33);
    case'industry':return Object.keys(c.industry.ratings).length>=4;
    case'customer':return c.customer.interviews.length>0||!!c.customer.journey.trigger;
    case'root':return!!c.root.primaryRoot;
    case'strategy':return!!(c.strategy.oneSentence||c.strategy.differentiation);
    case'goals':return!!c.goals.top;
    case'decision':return!!c.decision.type;
    default:return false;
  }
}

/* ---------- field helpers ---------- */
function fld(label,path,o){o=o||{};const v=esc(getP(cur(),path));
  const hint=o.hint?`<div class="hint">${o.hint}</div>`:'';
  if(o.ta)return `<div class="fld"><label>${label}</label><textarea data-bind="${path}" rows="${o.rows||3}" placeholder="${o.ph||''}">${v}</textarea>${hint}</div>`;
  return `<div class="fld"><label>${label}</label><input type="${o.type||'text'}" data-bind="${path}" value="${v}" placeholder="${o.ph||''}">${hint}</div>`;
}
function sel(label,path,opts,o){o=o||{};const cv=getP(cur(),path);
  const os=['<option value="">— בחר —</option>'].concat(opts.map(x=>{const val=typeof x==='object'?x.k:x,lab=typeof x==='object'?x.n:x;
    return `<option value="${esc(val)}" ${cv==val?'selected':''}>${esc(lab)}</option>`})).join('');
  return `<div class="fld"><label>${label}</label><select data-bind="${path}">${os}</select>${o.hint?`<div class="hint">${o.hint}</div>`:''}</div>`;
}
function chips(label,path,opts,multi){const cv=getP(cur(),path)||(multi?[]:'');
  const ch=opts.map(x=>{const val=typeof x==='object'?(x.k||x.n):x,lab=typeof x==='object'?x.n:x;
    const on=multi?cv.indexOf(val)>=0:cv==val;
    return `<span class="chip ${on?'on':''}" data-chip="${path}" data-val="${esc(val)}" data-multi="${multi?1:0}">${esc(lab)}</span>`}).join('');
  return `<div class="fld"><label>${label}</label><div class="chips">${ch}</div></div>`;
}
function refBox(title,html){return `<details class="ref"><summary>${title}</summary><div class="rbody">${html}</div></details>`}
function qBank(title,items){return `<div class="qbank"><div class="qh">${title}</div>`+
  items.map(it=>typeof it==='object'?`<div class="qrow"><div><div>${esc(it.q)}</div>${it.p?`<div class="qp">↳ ${esc(it.p)}</div>`:''}</div></div>`:`<div class="qrow">${esc(it)}</div>`).join('')+`</div>`}

/* ===================== COMPUTED ===================== */
function aemDominant(c){const a=c.owner.aem;const sum=a.artist+a.entrepreneur+a.manager||1;
  const arr=[['artist',a.artist],['entrepreneur',a.entrepreneur],['manager',a.manager]].sort((x,y)=>y[1]-x[1]);
  if(arr[0][1]===33&&arr[1][1]===33)return null;
  const key=arr[0][0];return{key,name:KB.aem[key].name,ico:KB.aem[key].ico,pct:Math.round(arr[0][1]/sum*100)}}
function top9(c){const e=Object.entries(c.owner.types9||{}).filter(([k,v])=>v>=7).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return e.map(([k])=>KB.types9.find(t=>t.k===k).n).join(', ')}
function attractiveness(c){const total=KB.forces.reduce((n,cat)=>n+cat.items.length,0);
  const vals=Object.values(c.industry.ratings);const rated=vals.length;
  const pos=vals.filter(v=>v==1).length,neg=vals.filter(v=>v==-1).length;
  const score=vals.reduce((s,v)=>s+Number(v),0);
  const pct=rated?Math.round((score+rated)/(rated*2)*100):0;
  const label=pct>=66?'תחום אטרקטיבי':pct>=40?'תחום בינוני':'תחום מאתגר';
  return{total,rated,pos,neg,pct,label}}

function rb(v){return v?`<div class="r-block">${esc(v)}</div>`:`<div class="r-block r-empty">— לא תועד —</div>`}
function rlist(arr){const f=(arr||[]).filter(x=>x&&x.trim());return f.length?'<div class="r-block">'+f.map(x=>'• '+esc(x)).join('<br>')+'</div>':'<div class="r-block r-empty">— לא תועד —</div>'}

  if(el=cl('[data-open]'))return go('client',{cid:el.dataset.open,stage:'overview'});
  if(el=cl('[data-stage]')){S.stage=el.dataset.stage;return render()}
  if(el=cl('[data-del]')){if(confirm('למחוק את התיק לצמיתות?')){DB.clients=DB.clients.filter(c=>c.id!==el.dataset.del);saveNow();return go('clients')}return}
  if(el=cl('[data-meth]')){S.meth=el.dataset.meth;$('#methbody').innerHTML=methBody(S.meth);
    document.querySelectorAll('[data-meth]').forEach(b=>b.classList.toggle('on',b.dataset.meth===S.meth));return}
  if(el=cl('[data-chip]')){toggleChip(el);return}
  if(el=cl('.seg button')){const seg=el.parentElement;const key=seg.dataset.force;const v=Number(el.dataset.fv);
    const c=cur();if(c.industry.ratings[key]===v){delete c.industry.ratings[key]}else{c.industry.ratings[key]=v}
    c.updatedAt=Date.now();save();
    seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',Number(b.dataset.fv)===c.industry.ratings[key]));
    $('#attr-banner').innerHTML=attrBannerHTML(attractiveness(c));return}
  if(el=cl('[data-add]')){addItem(el.dataset.add,el.dataset.tpl);return}
  if(el=cl('[data-rm]')){const arr=getP(cur(),el.dataset.rm);arr.splice(Number(el.dataset.i),1);cur().updatedAt=Date.now();saveNow();return render()}
  if(el=cl('[data-saveset]')){DB.settings.consultant=$('#set-consultant').value;DB.settings.disclaimer=$('#set-disclaimer').value;saveNow();return toast('ההגדרות נשמרו')}
  if(el=cl('[data-export]'))return doExport();
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.bind!=null){const c=cur();if(!c)return;
    let v=el.value;if(el.type==='range')v=Number(v);
    setP(c,el.dataset.bind,v);c.updatedAt=Date.now();save();
    if(el.dataset.aem)updateAem(c);
    if(el.dataset.t9)updateT9(el.dataset.t9,c);
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='impf'&&el.files[0])doImport(el.files[0]);
  if(el.dataset&&el.dataset.bind!=null&&el.tagName==='SELECT'){const c=cur();if(c){setP(c,el.dataset.bind,el.value);c.updatedAt=Date.now();save()}}
});
function toggleChip(el){const c=cur();const path=el.dataset.chip,val=el.dataset.val,multi=el.dataset.multi==='1';
  if(multi){let arr=getP(c,path);if(!Array.isArray(arr)){arr=[];setP(c,path,arr)}
    const num=/^\d+$/.test(val)?Number(val):val;const idx=arr.findIndex(x=>x==num);
    if(idx>=0)arr.splice(idx,1);else arr.push(num);el.classList.toggle('on')}
  else{const cur0=getP(c,path);const nv=cur0==val?'':val;setP(c,path,nv);
    el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.val===nv))}
  c.updatedAt=Date.now();save();
}
function addItem(path,tpl){const c=cur();let arr=getP(c,path);if(!Array.isArray(arr)){arr=[];setP(c,path,arr)}
  arr.push(tpl==='interview'?{name:'',type:'',why:'',special:'',fit:''}:'');c.updatedAt=Date.now();saveNow();render()}
function updateAem(c){const a=c.owner.aem;const sum=a.artist+a.entrepreneur+a.manager;
  ['artist','entrepreneur','manager'].forEach(k=>{const el=document.getElementById('aemv-'+k);if(el)el.textContent=a[k]});
  const s=document.getElementById('aemsum');if(s)s.textContent='סה״כ '+sum+'%'}
function updateT9(k,c){const v=c.owner.types9[k]||0;const sc=document.getElementById('t9sc-'+k);if(sc)sc.textContent=v;
  const tt=document.getElementById('t9-'+k);if(tt)tt.classList.toggle('hot',v>=7)}

/* ===================== BACKUP ===================== */
function doExport(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='zilber-strategy-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('גיבוי יוצא')}
function doImport(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
  if(!d.clients)throw 0;if(confirm('לייבא ולהחליף את כל הנתונים הקיימים?')){DB=d;DB.settings=Object.assign(defDB().settings,DB.settings||{});saveNow();toast('הנתונים יובאו');go('clients')}}
  catch(e){toast('קובץ לא תקין')}};r.readAsText(file)}

render();
</script>
</body>
</html>
