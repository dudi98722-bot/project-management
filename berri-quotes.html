<meta charset="utf-8">
<title>BERRI — CRM הצעות מחיר</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%230F1642'/%3E%3Crect x='12' y='14' width='24' height='8' rx='1.5' fill='%23CC6A29'/%3E%3Crect x='12' y='26' width='12' height='8' rx='1.5' fill='%23fff'/%3E%3Crect x='28' y='26' width='24' height='8' rx='1.5' fill='%23CC6A29'/%3E%3Crect x='12' y='38' width='24' height='8' rx='1.5' fill='%23CC6A29'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#0F1642; --navy-2:#1B2560; --orange:#CC6A29; --orange-d:#B25A20; --orange-l:#FBEEE4;
  --bg:#f5f6fa; --panel:#fff; --ink:#1c2130; --muted:#6b7280; --line:#e4e7ee;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --danger:#b91c1c; --danger-bg:#fee2e2;
  --info:#1d4ed8; --info-bg:#dbeafe;
  --shadow:0 1px 3px rgba(15,22,66,.08),0 1px 2px rgba(15,22,66,.05);
  --shadow-l:0 10px 30px rgba(15,22,66,.13);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);direction:rtl;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #cfd6f5;border-color:var(--navy-2)}
textarea{resize:vertical;line-height:1.6}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:700}
.hidden{display:none!important}
h1,h2,h3,h4{margin:0}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#c8cddd;border-radius:8px;border:3px solid var(--bg)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,var(--navy),var(--navy-2));color:#fff;display:flex;align-items:center;gap:14px;padding:9px 16px;box-shadow:var(--shadow)}
.brandmark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:.3px}
.brandmark .bx{display:grid;gap:2px;width:26px}
.brandmark .bx i{display:block;height:5px;border-radius:1px;background:var(--orange)}
.brandmark .bx i:nth-child(2){background:#fff;width:60%}
.brandmark small{font-weight:600;font-size:11px;opacity:.75;display:block;letter-spacing:0}
.topbar .sp{flex:1}
.topbar .tb-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;padding:7px 13px;border-radius:8px;font-weight:700;font-size:13px}
.topbar .tb-btn:hover{background:rgba(255,255,255,.2)}
.topbar .tb-btn.primary{background:var(--orange);border-color:var(--orange)}
.topbar .tb-btn.primary:hover{background:var(--orange-d)}

/* ---------- nav ---------- */
.nav{display:flex;gap:5px;flex-wrap:wrap;background:var(--panel);padding:7px 16px;border-bottom:1px solid var(--line);position:sticky;top:51px;z-index:30}
.nav-item{padding:7px 15px;border-radius:999px;font-weight:700;color:var(--muted);font-size:14px;border:0;background:none}
.nav-item:hover{background:#eef0f7;color:var(--navy)}
.nav-item.active{background:var(--navy);color:#fff}

/* ---------- layout ---------- */
.content{max-width:1240px;margin:18px auto 60px;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card > header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfcfe}
.card > header h3{font-size:15.5px;font-weight:800;color:var(--navy)}
.card > header .sp{flex:1}
.card .body{padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f4f6fb;border-color:#cbd2e4}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.p:hover{background:var(--navy-2)}
.btn.o{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn.o:hover{background:var(--orange-d)}
.btn.d{color:var(--danger);border-color:#f3c9c9}
.btn.d:hover{background:var(--danger-bg)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.gh{border-color:transparent;background:transparent;color:var(--muted)}
.btn.gh:hover{background:#eef0f7;color:var(--navy)}
.iconbtn{border:0;background:transparent;color:var(--muted);font-size:16px;padding:4px 7px;border-radius:6px;line-height:1}
.iconbtn:hover{background:#eef0f7;color:var(--navy)}
.iconbtn.d:hover{background:var(--danger-bg);color:var(--danger)}

/* ---------- chips / badges ---------- */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.b-draft{background:#eef0f7;color:#4b5563}
.b-sent{background:var(--info-bg);color:var(--info)}
.b-nego{background:var(--warn-bg);color:var(--warn)}
.b-won{background:var(--ok-bg);color:var(--ok)}
.b-work{background:var(--orange-l);color:var(--orange-d)}
.b-done{background:#e0e7ff;color:#3730a3}
.b-lost{background:var(--danger-bg);color:var(--danger)}

/* ---------- KPI ---------- */
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--orange)}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:25px;font-weight:800;color:var(--navy);margin-top:3px;letter-spacing:-.5px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.ok:after{background:var(--ok)} .kpi.info:after{background:var(--info)} .kpi.navy:after{background:var(--navy)}

/* ---------- tables ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{text-align:right;font-size:12.5px;color:var(--muted);font-weight:800;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fbfcfe}
table.tbl td{padding:9px 10px;border-bottom:1px solid #f0f2f7;vertical-align:middle}
table.tbl tbody tr:hover{background:#fafbfe}
table.tbl td.num,table.tbl th.num{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:38px 16px;font-size:14px}
.empty b{display:block;color:var(--navy);font-size:16px;margin-bottom:5px}

/* ---------- picker (clause / spec libraries) ---------- */
.pick{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:10px;background:#fff}
.pick > .h{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#fbfcfe;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.pick > .h .t{font-weight:800;color:var(--navy);font-size:14px;flex:1}
.pick > .h .c{font-size:12px;color:var(--muted);font-weight:700}
.pick > .h .arw{color:var(--muted);transition:transform .15s}
.pick.open > .h .arw{transform:rotate(90deg)}
.pick > .b{padding:6px 8px;display:none}
.pick.open > .b{display:block}
.opt{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:8px;line-height:1.5}
.opt:hover{background:#f7f8fc}
.opt input[type=checkbox]{width:17px;height:17px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--orange);cursor:pointer}
.opt .tx{flex:1;font-size:13.5px}
.opt.on{background:#fdf7f2}
.opt.on .tx{color:var(--ink)}
.opt .tag{font-size:11px;font-weight:800;color:var(--orange-d);background:var(--orange-l);padding:1px 7px;border-radius:999px;margin-inline-start:6px}

/* sortable rows */
.srow{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff}
.srow .hnd{cursor:grab;color:#b9c0d4;font-size:15px;padding:3px 2px;flex:0 0 auto;user-select:none}
.srow.drag{opacity:.45;border-style:dashed}
.srow .ltr{flex:0 0 auto;width:26px;text-align:center;font-weight:800;color:var(--orange-d);font-size:13px;padding-top:6px}
.srow textarea{border-color:transparent;padding:5px 7px;background:#fbfcfe}
.srow textarea:focus{border-color:var(--navy-2);background:#fff}

/* stage bar */
.bar{height:8px;border-radius:99px;background:#eef0f7;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#e0954f)}
.bar.ok > i{background:linear-gradient(90deg,#16a34a,#4ade80)}
.bar.over > i{background:linear-gradient(90deg,#dc2626,#f87171)}

/* toast */
#toast{position:fixed;bottom:22px;inset-inline-start:22px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow-l);font-size:13.5px;font-weight:600;animation:tin .2s ease}
.toast.ok{background:#15803d}.toast.err{background:#b91c1c}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* modal */
.mask{position:fixed;inset:0;background:rgba(15,22,66,.42);z-index:150;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:15px;box-shadow:var(--shadow-l);width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal > header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal > header h3{font-size:16px;font-weight:800;color:var(--navy);flex:1}
.modal > .mb{padding:18px;overflow:auto}
.modal > footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-start;background:#fbfcfe}

.hint{font-size:12.5px;color:var(--muted);background:#f7f8fc;border-inline-start:3px solid var(--orange);padding:8px 11px;border-radius:7px;margin-bottom:12px}
.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.sum.tot{border-top:2px solid var(--navy);margin-top:6px;padding-top:9px;font-weight:800;font-size:17px;color:var(--navy)}
</style>

<style>
/* ================= DOCUMENT (preview + print) ================= */
#doc{background:#fff;color:#000;direction:rtl}
/* עמוד = טבלה, כדי שהלוגו והפוטר יחזרו בכל עמוד מודפס (thead/tfoot חוזרים בהדפסה) */
.sheet{width:210mm;min-height:297mm;margin:0 auto 14px;background:#fff;box-shadow:var(--shadow-l);font-size:11.2pt;line-height:1.5}
table.pg{width:100%;border-collapse:collapse}
table.pg > thead > tr > td,
table.pg > tbody > tr > td,
table.pg > tfoot > tr > td{padding:0;vertical-align:top;border:0}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2.2pt solid var(--orange);padding:8mm 18mm 3mm;margin-bottom:5mm}
.hdr img{height:15mm}
.hdr .co{text-align:start;font-size:8.5pt;color:#333;line-height:1.4}
.cnt{padding:0 18mm 6mm}
.cnt.wm{background-repeat:repeat;background-size:150px 60px}
.ftr{border-top:1.6pt solid var(--orange);margin:4mm 18mm 0;padding:2.5mm 0 8mm;display:flex;justify-content:center;gap:14px;font-size:8.5pt;color:#444}

.doc-bsd{text-align:center;font-size:11pt;margin-bottom:2mm}
.doc-title{text-align:center;font-size:16pt;font-weight:800;color:var(--navy);margin:4mm 0 5mm;letter-spacing:-.3px}
.doc-title small{display:block;font-size:10pt;font-weight:600;color:var(--orange-d);letter-spacing:2px;margin-top:1mm}
.doc-h{font-size:12.5pt;font-weight:800;color:var(--navy);border-bottom:1.4pt solid var(--orange);padding-bottom:1.4mm;margin:6mm 0 3mm;display:flex;align-items:center;gap:6px}
.doc-h .n{background:var(--orange);color:#fff;width:6.5mm;height:6.5mm;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9pt;flex:0 0 auto}
.doc-p{margin:0 0 2mm;text-align:justify}
.doc-cl{margin:0 0 2.2mm;display:flex;gap:2.5mm;text-align:justify}
.doc-cl .l{font-weight:800;color:var(--navy);flex:0 0 auto;min-width:7mm}
.doc-sub{margin:1.5mm 0 1.5mm 0;padding-inline-start:9mm;display:flex;gap:2mm}
.doc-ul{margin:0 0 2mm;padding:0;list-style:none}
.doc-ul li{position:relative;padding-inline-start:5.5mm;margin-bottom:.9mm}
.doc-ul li:before{content:"";position:absolute;inset-inline-start:0;top:2.3mm;width:2.1mm;height:2.1mm;background:var(--orange);border-radius:.4mm}
.doc-tbl{width:100%;border-collapse:collapse;font-size:10pt;margin:2mm 0 3mm}
.doc-tbl th{background:var(--navy);color:#fff;padding:2mm 2.5mm;text-align:right;font-weight:700;font-size:9.5pt}
.doc-tbl td{border:.6pt solid #ccd0dd;padding:1.9mm 2.5mm}
.doc-tbl tr:nth-child(even) td{background:#fafbfe}
.doc-tbl td.num{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc-tbl tfoot td{background:var(--orange-l)!important;font-weight:800;color:var(--navy);border-top:1.4pt solid var(--orange)}
.doc-box{border:1pt solid var(--orange);background:#fffdfb;border-radius:2mm;padding:3mm 4mm;margin:3mm 0}
.doc-box .bt{font-weight:800;color:var(--navy);margin-bottom:1.5mm;font-size:11pt}
.doc-tot{background:var(--navy);color:#fff;border-radius:2mm;padding:3.5mm 5mm;margin:4mm 0;display:flex;justify-content:space-between;align-items:center}
.doc-tot .lb{font-size:11pt;font-weight:600;opacity:.9}
.doc-tot .vl{font-size:17pt;font-weight:800;letter-spacing:-.5px}
.doc-tot .wd{font-size:8.8pt;opacity:.8;font-weight:400}
.doc-sig{display:flex;justify-content:space-between;gap:14mm;margin-top:12mm}
.doc-sig > div{flex:1;text-align:center}
.doc-sig .ln{border-top:1pt solid #333;margin-top:14mm;padding-top:1.5mm;font-size:10pt;font-weight:700}
.doc-note{font-size:9.2pt;color:#555;font-style:italic;margin-top:1.5mm}
.pagebreak{page-break-before:always;break-before:page}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .noprint,.topbar,.nav{display:none!important}
  .content{max-width:none;margin:0;padding:0}
  .card{border:0;box-shadow:none;margin:0}
  .card .body{padding:0}
  .sheet{box-shadow:none;margin:0;width:auto;min-height:0;page-break-after:always}
  .sheet:last-child{page-break-after:auto}
  thead.rep{display:table-header-group}
  tfoot.rep{display:table-footer-group}
  .doc-tbl{page-break-inside:auto}
  .doc-tbl tr{page-break-inside:avoid}
  .doc-h,.doc-sig{page-break-inside:avoid}
  .doc-tot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:820px){.sheet{width:auto;padding:20mm 8mm}}
</style>

  <div class="sp"></div>

</div>

/* ---------- מאגר שלבי תשלום ---------- */
const DEF_STAGES = ["מקדמה","ביסוס לעמודים","קונסטרוקציה ברזל","קירות וגגות להרחבות",

 "חשמל לבן","אינסטלציה לבן","רובה ופינישים","מסירת מפתח"];

 {t:"התקנת גוף תאורה סטנדרטי (לא כולל הגוף)", p:80}, {t:"לוח חשמל חדש", p:5000}

<script>
/* ================= אחסון ================= */
const KEY = "berri_quotes_v1";
let DB = null;

function blankDB(){
  return { co:{...DEF_CO}, seq:1, quotes:[],
           lib:{ clauses:clone(DEF_CLAUSES), spec:clone(DEF_SPEC),
                 stages:[...DEF_STAGES], white:[...DEF_WHITE], elec:clone(DEF_ELEC) } };
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    DB = raw ? JSON.parse(raw) : blankDB();
  }catch(e){ DB = blankDB(); }
  // מיזוג ברירות מחדל חסרות (שדרוגי גרסה)
  DB.co   = {...DEF_CO, ...(DB.co||{})};
  DB.lib  = DB.lib || {};
  if(!DB.lib.clauses || !DB.lib.clauses.length) DB.lib.clauses = clone(DEF_CLAUSES);
  if(!DB.lib.spec    || !DB.lib.spec.length)    DB.lib.spec    = clone(DEF_SPEC);
  if(!DB.lib.stages  || !DB.lib.stages.length)  DB.lib.stages  = [...DEF_STAGES];
  if(!DB.lib.white   || !DB.lib.white.length)   DB.lib.white   = [...DEF_WHITE];
  if(!DB.lib.elec    || !DB.lib.elec.length)    DB.lib.elec    = clone(DEF_ELEC);
  DB.quotes = DB.quotes || []; DB.seq = DB.seq || 1;
}
let saveT=null;
function save(now){
  clearTimeout(saveT);
  const go = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
                   catch(e){ toast("שגיאת שמירה — ייתכן שהאחסון מלא","err"); } };
  now ? go() : (saveT = setTimeout(go, 350));
}

/* ================= עזרים ================= */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2,10);
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function nf(n){ return (Number(n)||0).toLocaleString("he-IL"); }
function money(n){ return "₪" + nf(Math.round(Number(n)||0)); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }

function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast" + (kind?" "+kind:"");
  el.textContent = msg;
  $("#toast").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s";
                   setTimeout(()=>el.remove(),300); }, 2600);
}

/* ---------- אותיות עבריות לסעיפים (א,ב..י,יא,..כ,כא..) ---------- */
function hebLetter(i){          // i מ-1
  const ones=["","א","ב","ג","ד","ה","ו","ז","ח","ט"];
  const tens=["","י","כ","ל","מ","נ","ס","ע","פ","צ"];
  if(i<=0) return "";
  if(i>=100) return String(i);
  let t=Math.floor(i/10), o=i%10, s;
  if(t===1&&o===5) s="טו"; else if(t===1&&o===6) s="טז";
  else s = tens[t]+ones[o];
  return s;
}

/* ---------- מספר למילים בעברית ---------- */
function hebWords(n){
  n = Math.round(Math.abs(Number(n)||0));
  if(n===0) return "אפס";
  const f1=["","אחת","שתיים","שלוש","ארבע","חמש","שש","שבע","שמונה","תשע"];
  const f10=["","עשר","עשרים","שלושים","ארבעים","חמישים","שישים","שבעים","שמונים","תשעים"];
  const f11=["עשר","אחת עשרה","שתים עשרה","שלוש עשרה","ארבע עשרה","חמש עשרה",
             "שש עשרה","שבע עשרה","שמונה עשרה","תשע עשרה"];
  const h=["","מאה","מאתיים","שלוש מאות","ארבע מאות","חמש מאות","שש מאות",
           "שבע מאות","שמונה מאות","תשע מאות"];
  // ו' מופיעה רק לפני הרכיב האחרון: 385 → "שלוש מאות שמונים וחמש"
  function upTo999(x){
    const c=[]; const hu=Math.floor(x/100), rem=x%100;
    if(hu) c.push(h[hu]);
    if(rem){
      if(rem<10) c.push(f1[rem]);
      else if(rem<20) c.push(f11[rem-10]);
      else{ const t=Math.floor(rem/10), o=rem%10;
            c.push(f10[t]); if(o) c.push(f1[o]); }
    }
    return c.length>1 ? c.slice(0,-1).join(" ")+" ו"+c.slice(-1) : c.join("");
  }
  const out=[];
  const mil=Math.floor(n/1000000), th=Math.floor((n%1000000)/1000), r=n%1000;
  if(mil) out.push(mil===1?"מיליון":(mil===2?"שני מיליון":upTo999(mil)+" מיליון"));
  if(th)  out.push(th===1?"אלף":(th===2?"אלפיים":upTo999(th)+" אלף"));
  if(r)   out.push(upTo999(r));
  return out.length>1 ? out.slice(0,-1).join(" ")+" ו"+out.slice(-1) : out.join(" ");
}

/* ================= מודל הצעה ================= */
function newQuote(){
  const q = {
    id: uid(),
    num: DB.seq++,
    status: "draft",
    created: todayISO(),
    updated: todayISO(),
    date: todayISO(),
    client:{ name:"", address:"", city:"", floor:"", id1:"", id2:"", phone:"", email:"" },
    proj:{ title:"", kind:"שיפוץ כללי", desc:"", duration:"3 חודשים",
           arbiter:"", warranty:"12 חודשים", valid:"30 יום" },
    clauses: DB.lib.clauses.map(c => ({ ...c })),
    spec: DB.lib.spec.map(s => ({
      id:s.id, t:s.t, on:!!s.on,
      items: s.items.map(x => ({ id:uid(), t:x, on:!!s.on }))
    })),
    price:{ items:[{ id:uid(), t:"עבודות כמפורט במפרט", amount:0, note:"" }],
            vat:false, discount:0 },
    elec:{ on:false, rows: DB.lib.elec.map(e=>({id:uid(), t:e.t, p:e.p, qty:0})),
           note:"במידה ותרצו הגדלת כוח / תלת פאזי — יתומחר בנפרד" },
    stages: [],
    white:{ on:true, items: DB.lib.white.map(w=>({id:uid(), t:w, on:true})) },
    notes:"",
    sections:{ recitals:true, clauses:true, sig:true, stages:true, spec:true,
               white:true, elec:false, notes:false }
  };
  return q;
}

/* ---------- חישובים ---------- */
function priceBase(q){ return (q.price.items||[]).reduce((a,i)=>a+(Number(i.amount)||0),0); }
function elecTotal(q){
  if(!q.elec || !q.elec.on) return 0;
  return (q.elec.rows||[]).reduce((a,r)=>a+((Number(r.p)||0)*(Number(r.qty)||0)),0);
}
function subTotal(q){ return priceBase(q) + elecTotal(q) - (Number(q.price.discount)||0); }
function vatAmt(q){ return q.price.vat ? subTotal(q)*(Number(DB.co.vatRate)||0)/100 : 0; }
function grandTotal(q){ return subTotal(q) + vatAmt(q); }
function stagesSum(q){ return (q.stages||[]).reduce((a,s)=>a+(Number(s.amount)||0),0); }
function stagesPaid(q){ return (q.stages||[]).filter(s=>s.paid)
                          .reduce((a,s)=>a+(Number(s.amount)||0),0); }

/* ---------- מילוי משתנים בטקסט סעיף ---------- */
function fillVars(txt, q){
  const t = subTotal(q);
  return String(txt)
    .replace(/\{\{AMOUNT\}\}/g, money(t))
    .replace(/\{\{AMOUNT_WORDS\}\}/g, hebWords(t) + " ₪")
    .replace(/\{\{DURATION\}\}/g, q.proj.duration || "____")
    .replace(/\{\{ARBITER\}\}/g, q.proj.arbiter || "____________")
    .replace(/\{\{WARRANTY\}\}/g, q.proj.warranty || "____")
    .replace(/\{\{VALID\}\}/g, q.proj.valid || "____")
    .replace(/\{\{CLIENT\}\}/g, q.client.name || "____")
    .replace(/\{\{ADDRESS\}\}/g, [q.client.address, q.client.city].filter(Boolean).join(" ") || "____")
    .replace(/\{\{FLOOR\}\}/g, q.proj.floor || q.client.floor || "____");
}

/* ---------- מצב אפליקציה ---------- */
let TAB = "dash";
let CUR = null;          // מזהה הצעה בעריכה
function curQ(){ return DB.quotes.find(q=>q.id===CUR) || null; }
function touch(q){ q.updated = todayISO(); save(); }
</script>

<script>
/* ================= ניווט ================= */
const TABS = [
  {k:"dash",  t:"לוח בקרה"},
  {k:"list",  t:"הצעות מחיר"},
  {k:"edit",  t:"עורך ההצעה"},
  {k:"doc",   t:"תצוגה והדפסה"},
  {k:"lib",   t:"מאגר סעיפים"},
  {k:"set",   t:"הגדרות"}
];
function renderNav(){
  $("#nav").innerHTML = TABS.map(t=>{
    const dis = (t.k==="edit"||t.k==="doc") && !CUR;
    return `<button class="nav-item ${TAB===t.k?"active":""}" data-tab="${t.k}"
             ${dis?'style="opacity:.4"':''}>${t.t}</button>`;
  }).join("");
}
function go(tab){
  if((tab==="edit"||tab==="doc") && !CUR){ toast("בחר או צור הצעה קודם"); tab="list"; }
  TAB = tab; renderNav(); render(); window.scrollTo(0,0);
}
function render(){
  const h = { dash:viewDash, list:viewList, edit:viewEdit,
              doc:viewDoc, lib:viewLib, set:viewSet }[TAB];
  $("#app").innerHTML = h ? h() : "";
  if(TAB==="edit") wireEdit();
  if(TAB==="list") wireList();
  if(TAB==="lib")  wireLib();
  if(TAB==="set")  wireSet();
  if(TAB==="doc")  wireDoc();
}

/* ================= לוח בקרה ================= */
function viewDash(){
  const qs = DB.quotes;
  const open = qs.filter(q=>OPEN_ST.includes(q.status));
  const won  = qs.filter(q=>["won","work","done"].includes(q.status));
  const lost = qs.filter(q=>q.status==="lost");
  const pipeline = open.reduce((a,q)=>a+grandTotal(q),0);
  const wonSum   = won.reduce((a,q)=>a+grandTotal(q),0);
  const decided  = won.length + lost.length;
  const winRate  = decided ? Math.round(won.length/decided*100) : 0;
  const avg      = qs.length ? Math.round(qs.reduce((a,q)=>a+grandTotal(q),0)/qs.length) : 0;
  const collected = won.reduce((a,q)=>a+stagesPaid(q),0);
  const owed      = won.reduce((a,q)=>a+Math.max(0,stagesSum(q)-stagesPaid(q)),0);

  const byStatus = Object.keys(STATUS).map(k=>({
    k, ...STATUS[k], n:qs.filter(q=>q.status===k).length,
    v:qs.filter(q=>q.status===k).reduce((a,q)=>a+grandTotal(q),0)
  }));
  const maxV = Math.max(1, ...byStatus.map(s=>s.v));

  const recent = [...qs].sort((a,b)=>(b.updated||"").localeCompare(a.updated||"")).slice(0,6);

  return `
  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi"><div class="k">בצנרת (הצעות פתוחות)</div><div class="v">${money(pipeline)}</div>
      <div class="s">${open.length} הצעות ממתינות</div></div>
    <div class="kpi ok"><div class="k">נחתם</div><div class="v">${money(wonSum)}</div>
      <div class="s">${won.length} פרויקטים</div></div>
    <div class="kpi info"><div class="k">אחוז סגירה</div><div class="v">${winRate}%</div>
      <div class="s">${won.length} מתוך ${decided} שהוכרעו</div></div>
    <div class="kpi navy"><div class="k">הצעה ממוצעת</div><div class="v">${money(avg)}</div>
      <div class="s">${qs.length} הצעות סה״כ</div></div>
  </div>

  <div class="grid g2">
    <div class="card">
      <header><h3>מצב גבייה — פרויקטים חתומים</h3></header>
      <div class="body">
        <div class="sum"><span>נגבה עד כה</span><b style="color:var(--ok)">${money(collected)}</b></div>
        <div class="sum"><span>יתרה לגבייה</span><b style="color:var(--orange-d)">${money(owed)}</b></div>
        <div class="sum tot"><span>סה״כ בשלבי תשלום</span><span>${money(collected+owed)}</span></div>
        <div class="bar ${collected>=collected+owed&&collected>0?'ok':''}" style="margin-top:10px">
          <i style="width:${(collected+owed)?Math.min(100,collected/(collected+owed)*100):0}%"></i></div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">
          ${(collected+owed)?Math.round(collected/(collected+owed)*100):0}% מהתשלומים נגבו</div>
      </div>
    </div>

    <div class="card">
      <header><h3>פילוח לפי סטטוס</h3></header>
      <div class="body">
        ${byStatus.filter(s=>s.n).map(s=>`
          <div style="margin-bottom:11px">
            <div class="row" style="justify-content:space-between;margin-bottom:4px">
              <span class="badge ${s.c}">${s.t}</span>
              <span style="font-size:13px;color:var(--muted)">
                <b style="color:var(--ink)">${s.n}</b> · ${money(s.v)}</span>
            </div>
            <div class="bar"><i style="width:${s.v/maxV*100}%"></i></div>
          </div>`).join("") || `<div class="empty">אין עדיין הצעות</div>`}
      </div>
    </div>
  </div>

  <div class="card">
    <header><h3>עודכן לאחרונה</h3><div class="sp"></div>
      <button class="btn sm" onclick="go('list')">לכל ההצעות</button></header>
    <div class="body" style="padding:0">
      ${recent.length ? `<table class="tbl"><thead><tr>
        <th>מס׳</th><th>לקוח</th><th>פרויקט</th><th>סטטוס</th>
        <th class="num">סכום</th><th>עודכן</th><th></th></tr></thead><tbody>
        ${recent.map(q=>`<tr>
          <td style="color:var(--muted);font-weight:700">#${q.num}</td>
          <td><b>${esc(q.client.name)||"—"}</b></td>
          <td>${esc(q.proj.title)||esc(q.proj.kind)||"—"}</td>
          <td><span class="badge ${STATUS[q.status].c}">${STATUS[q.status].t}</span></td>
          <td class="num"><b>${money(grandTotal(q))}</b></td>
          <td style="color:var(--muted);font-size:13px">${fmtDate(q.updated)}</td>
          <td style="text-align:left"><button class="btn sm" onclick="openQ('${q.id}')">פתח</button></td>
        </tr>`).join("")}</tbody></table>`
      : `<div class="empty"><b>עוד לא נוצרו הצעות מחיר</b>
           לחץ על "+ הצעה חדשה" כדי להתחיל
           <div style="margin-top:14px"><button class="btn o" onclick="createQ()">+ הצעה חדשה</button></div></div>`}
    </div>
  </div>`;
}

/* ================= רשימת הצעות ================= */
let LF = { q:"", st:"" };
function viewList(){
  const f = DB.quotes.filter(q=>{
    if(LF.st && q.status!==LF.st) return false;
    if(LF.q){
      const s = (q.client.name+" "+q.client.address+" "+q.client.city+" "+
                 q.proj.title+" #"+q.num).toLowerCase();
      if(!s.includes(LF.q.toLowerCase())) return false;

  return `

      <div class="sp"></div>

             style="width:250px">
      <select id="fst" style="width:160px">
        <option value="">כל הסטטוסים</option>
        ${Object.entries(STATUS).map(([k,v])=>
          `<option value="${k}" ${LF.st===k?"selected":""}>${v.t}</option>`).join("")}
      </select>
      <button class="btn o" onclick="createQ()">+ חדשה</button>
    </header>

            <button class="iconbtn d" title="מחיקה" onclick="delQ('${q.id}')">✕</button>
          </td></tr>`;}).join("")}</tbody></table>`
      : `<div class="empty"><b>לא נמצאו הצעות</b>${LF.q||LF.st?"נסה לשנות את הסינון":"צור הצעה ראשונה כדי להתחיל"}</div>`}
    </div>

}
function wireList(){
  const fq=$("#fq"); if(fq) fq.oninput = e=>{ LF.q=e.target.value; const p=e.target.selectionStart;
    render(); const n=$("#fq"); if(n){n.focus(); n.setSelectionRange(p,p);} };
  const fs=$("#fst"); if(fs) fs.onchange = e=>{ LF.st=e.target.value; render(); };
}

/* ---------- פעולות על הצעה ---------- */
function createQ(){
  const q = newQuote();
  DB.quotes.push(q); CUR = q.id; save(true);
  toast("נוצרה הצעה #"+q.num, "ok"); go("edit");
}
function openQ(id){ CUR=id; go("edit"); }
function openDoc(id){ CUR=id; go("doc"); }
function dupQ(id){
  const s = DB.quotes.find(q=>q.id===id); if(!s) return;
  const c = clone(s);
  c.id=uid(); c.num=DB.seq++; c.status="draft";
  c.created=c.updated=c.date=todayISO();
  DB.quotes.push(c); save(true); toast("שוכפל כהצעה #"+c.num,"ok"); render();
}
function delQ(id){
  const q = DB.quotes.find(x=>x.id===id); if(!q) return;
  confirmBox(`למחוק את הצעה #${q.num}${q.client.name?" — "+q.client.name:""}?`,
    "הפעולה אינה הפיכה.", ()=>{
      DB.quotes = DB.quotes.filter(x=>x.id!==id);
      if(CUR===id) CUR=null;
      save(true); toast("ההצעה נמחקה"); renderNav(); render();
    });
}

/* ---------- מודאלים ---------- */
function confirmBox(title, sub, ok){
  $("#modalHost").innerHTML = `
   <div class="mask" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:430px">
      <header><h3>${esc(title)}</h3></header>
      <div class="mb" style="color:var(--muted);font-size:14px">${esc(sub||"")}</div>
      <footer><button class="btn d" id="mOk">אישור</button>
              <button class="btn" onclick="closeModal()">ביטול</button></footer>
    </div></div>`;
  $("#mOk").onclick = ()=>{ closeModal(); ok(); };
}
function closeModal(){ $("#modalHost").innerHTML=""; }
</script>

/* ---------- 2. סעיפים ---------- */
function secClauses(q){
  const groups = [...new Set(q.clauses.map(c=>c.g))];

        <b>{{DURATION}}</b> משך · <b>{{ARBITER}}</b> בורר · <b>{{WARRANTY}}</b> אחריות ·
        <b>{{CLIENT}}</b> לקוח · <b>{{ADDRESS}}</b> כתובת</div>

        return `<div class="pick ${on?"open":""}">
          <div class="h" onclick="this.parentNode.classList.toggle('open')">
            <span class="arw">›</span><span class="t">${esc(g)}</span>
            <span class="c">${on}/${cs.length}</span></div>
          <div class="b">
            ${cs.map(c=>`
              <div class="opt ${c.on?"on":""}">

                <div class="tx">
                  <div style="font-weight:700;color:var(--navy);margin-bottom:3px">
                    ${esc(c.t)}${c.sub?`<span class="tag">תת-סעיף</span>`:""}

                  <textarea data-clx="${c.id}" rows="2"

                    style="margin:4px 8px 8px">+ הוסף שורה</button>

function addSpecCat(){
  const q=curQ();

  touch(q); render();

function rmSpecCat(id){ const q=curQ(); q.spec=q.spec.filter(s=>s.id!==id); touch(q); render(); }
function addSpecItem(sid){
  const q=curQ(); const s=q.spec.find(x=>x.id===sid); if(!s) return;

function rmSpecItem(sid,iid){
  const q=curQ(); const s=q.spec.find(x=>x.id===sid); if(!s) return;
  s.items = s.items.filter(i=>i.id!==iid); touch(q); render();
}

/* ---------- 5. נספח תשלומים ---------- */
function secStages(q){
  const sum=stagesSum(q), tot=subTotal(q), paid=stagesPaid(q);
  const diff = tot - sum;
  const st = Math.abs(diff)<1 ? "ok" : (diff<0 ? "over" : "");
  return `
  <div class="card"><header><h3>נספח תשלומים</h3><div class="sp"></div>
    <button class="btn sm" onclick="stagesFromSpec()">בנה משלבים נבחרים</button>
    <button class="btn sm" onclick="stagesSpread()">פזר שווה</button>
    <button class="btn sm o" onclick="addStage()">+ שלב</button></header>
    <div class="body">
      <div class="grid g3" style="margin-bottom:14px">
        <div class="kpi navy"><div class="k">סה״כ ההצעה</div><div class="v">${money(tot)}</div></div>
        <div class="kpi ${st==='ok'?'ok':''}"><div class="k">סה״כ שלבים</div>
          <div class="v">${money(sum)}</div>
          <div class="s">${Math.abs(diff)<1?"תואם לסכום ההצעה ✓"
            :(diff>0?`חסרים ${money(diff)}`:`חריגה של ${money(-diff)}`)}</div></div>
        <div class="kpi ok"><div class="k">שולם</div><div class="v">${money(paid)}</div>
          <div class="s">${sum?Math.round(paid/sum*100):0}% מהשלבים</div></div>
      </div>
      <div class="bar ${st}" style="margin-bottom:14px"><i style="width:${tot?Math.min(100,sum/tot*100):0}%"></i></div>

      ${q.stages.length ? `<table class="tbl"><thead><tr>
        <th style="width:34px"></th><th>שלב</th><th class="num" style="width:140px">סכום</th>
        <th style="width:145px">תאריך</th><th style="width:80px">שולם</th>
        <th>הערה</th><th style="width:40px"></th></tr></thead><tbody>
        ${q.stages.map((s,ix)=>`<tr>
          <td style="color:var(--muted);font-weight:700;text-align:center">${ix+1}</td>
          <td><input list="stagenames" data-st="${ix}|name" value="${esc(s.name)}"></td>
          <td><input type="number" data-st="${ix}|amount" value="${s.amount||""}" style="text-align:left"></td>
          <td><input type="date" data-st="${ix}|date" value="${esc(s.date||"")}"></td>
          <td style="text-align:center">
            <input type="checkbox" data-st="${ix}|paid" ${s.paid?"checked":""}
                   style="width:18px;height:18px;accent-color:var(--ok)"></td>
          <td><input data-st="${ix}|note" value="${esc(s.note||"")}" placeholder="—"></td>
          <td><button class="iconbtn d" onclick="rmStage(${ix})">✕</button></td></tr>`).join("")}
        </tbody><tfoot><tr style="background:#fbfcfe">
          <td></td><td><b>סה״כ</b></td><td class="num"><b>${money(sum)}</b></td>
          <td colspan="4"></td></tr></tfoot></table>
        <datalist id="stagenames">${DB.lib.stages.map(s=>`<option>${esc(s)}</option>`).join("")}</datalist>`
      : `<div class="empty"><b>עדיין לא הוגדרו שלבי תשלום</b>
          "בנה משלבים נבחרים" ייצור שלבים לפי פרקי המפרט שסימנת</div>
         <datalist id="stagenames">${DB.lib.stages.map(s=>`<option>${esc(s)}</option>`).join("")}</datalist>`}
    </div></div>`;
}
function addStage(){ const q=curQ(); q.stages.push({name:"",amount:0,date:"",paid:false,note:""}); touch(q); render(); }
function rmStage(ix){ const q=curQ(); q.stages.splice(ix,1); touch(q); render(); }
function stagesFromSpec(){
  const q=curQ();
  const map={ "s-bis":"ביסוס לעמודים","s-tps":"קונסטרוקציה ויציקה","s-msg":"קונסטרוקציה ברזל",
    "s-hrs":"הריסה","s-bna":"בנייה","s-hsm":"חשמל","s-ins":"אינסטלציה","s-tch":"טיח חוץ",
    "s-tpn":"טיח פנים","s-itm":"איטום חדרי רחצה","s-itg":"איטום גג","s-btn":"ביטון",
    "s-gbs":"גבס","s-rtz":"ריצוף","s-spk":"שפכטל וצבע","s-gmr":"אינסטלציה לבן",
    "s-gmh":"חשמל לבן","s-sof":"רובה ופינישים","s-shn":"עבודות שונות","s-tsh":"תשתיות" };
  const names = ["מקדמה", ...q.spec.filter(s=>s.on).map(s=>map[s.id]||s.t)];
  if(names.length<2){ toast("סמן קודם פרקים במפרט העבודה"); return; }
  q.stages = names.map(n=>({name:n,amount:0,date:"",paid:false,note:""}));
  touch(q); toast(`נוצרו ${names.length} שלבים`,"ok"); render();
}
function stagesSpread(){
  const q=curQ();
  if(!q.stages.length){ toast("הוסף שלבים קודם"); return; }
  const tot = subTotal(q);
  if(!tot){ toast("הזן קודם סכום בתמחור"); return; }
  const n=q.stages.length;
  // מעגלים לאלפים; בסכומים קטנים נופלים לחלוקה רגילה כדי לא לאפס שלבים
  let per = Math.floor(tot/n/1000)*1000;
  if(per<=0) per = Math.floor(tot/n);
  q.stages.forEach(s=>s.amount=per);
  q.stages[n-1].amount = tot - per*(n-1);
  touch(q); toast("הסכום פוזר בין השלבים","ok"); render();
}

/* ---------- חיווט העורך ---------- */
function setPath(o,path,v){
  const p=path.split("."); let t=o;
  for(let i=0;i<p.length-1;i++) t=t[p[i]];
  t[p[p.length-1]]=v;
}
function wireEdit(){
  const q=curQ(); if(!q) return;

  $$("[data-esec]").forEach(b=> b.onclick=()=>{ ESEC=b.dataset.esec; render(); });
  const stx=$("#eStatus");
  if(stx) stx.onchange=e=>{ q.status=e.target.value; touch(q); render(); };

  // שדות טקסט כלליים
  $$("[data-f]").forEach(el=>{
    const path=el.dataset.f;
    const ev = el.tagName==="SELECT" ? "change" : "input";
    el.addEventListener(ev, e=>{
      let v=e.target.value;
      if(path==="price.vat") v = v==="1";
      else if(path==="price.discount") v = Number(v)||0;
      setPath(q,path,v); touch(q);
      if(path==="price.vat"||path==="price.discount") render();
    });
  });
  // מקטעי מסמך
  $$("[data-sec]").forEach(el=> el.onchange=e=>{
    q.sections[el.dataset.sec]=e.target.checked; touch(q);
    el.closest(".opt")?.classList.toggle("on", e.target.checked);
  });
  // סעיפים
  $$("[data-cl]").forEach(el=> el.onchange=e=>{
    const c=q.clauses.find(x=>x.id===el.dataset.cl); if(!c) return;
    c.on=e.target.checked; touch(q);
    el.closest(".opt")?.classList.toggle("on", c.on);
  });
  $$("[data-clx]").forEach(el=> el.oninput=e=>{
    const c=q.clauses.find(x=>x.id===el.dataset.clx); if(c){ c.x=e.target.value; touch(q); }
  });
  // מפרט
  $$("[data-sp]").forEach(el=> el.onchange=e=>{
    const s=q.spec.find(x=>x.id===el.dataset.sp); if(!s) return;
    s.on=e.target.checked; touch(q); render();
  });
  $$("[data-spi]").forEach(el=> el.onchange=e=>{
    const [sid,iid]=el.dataset.spi.split("|");
    const s=q.spec.find(x=>x.id===sid); const i=s&&s.items.find(y=>y.id===iid);
    if(i){ i.on=e.target.checked; touch(q); el.closest(".opt")?.classList.toggle("on", i.on); }
  });
  $$("[data-spt]").forEach(el=> el.oninput=e=>{
    const [sid,iid]=el.dataset.spt.split("|");
    const s=q.spec.find(x=>x.id===sid); const i=s&&s.items.find(y=>y.id===iid);
    if(i){ i.t=e.target.value; touch(q); }
  });
  // תמחור
  $$("[data-pi]").forEach(el=> el.oninput=e=>{
    const [id,f]=el.dataset.pi.split("|");
    const it=q.price.items.find(x=>x.id===id); if(!it) return;
    it[f] = f==="amount" ? (Number(e.target.value)||0) : e.target.value;
    touch(q); if(f==="amount") refreshSums();
  });
  const eon=$("[data-elon]");
  if(eon) eon.onchange=e=>{ q.elec.on=e.target.checked; touch(q); render(); };
  $$("[data-er]").forEach(el=> el.oninput=e=>{
    const [id,f]=el.dataset.er.split("|");
    const r=q.elec.rows.find(x=>x.id===id); if(!r) return;
    r[f] = (f==="p"||f==="qty") ? (Number(e.target.value)||0) : e.target.value;
    touch(q); if(f!=="t") render();
  });
  // שלבים
  $$("[data-st]").forEach(el=>{
    const [ix,f]=el.dataset.st.split("|");
    const ev = el.type==="checkbox" ? "change" : "input";
    el.addEventListener(ev, e=>{
      const s=q.stages[Number(ix)]; if(!s) return;
      s[f] = f==="paid" ? e.target.checked : (f==="amount" ? (Number(e.target.value)||0) : e.target.value);
      touch(q); if(f==="amount"||f==="paid") refreshSums();
    });
  });
  // חומר לבן
  $$("[data-wh]").forEach(el=> el.onchange=e=>{
    const w=q.white.items.find(x=>x.id===el.dataset.wh); if(!w) return;
    w.on=e.target.checked; touch(q); el.closest(".opt")?.classList.toggle("on", w.on);
  });
  $$("[data-wht]").forEach(el=> el.oninput=e=>{
    const w=q.white.items.find(x=>x.id===el.dataset.wht); if(w){ w.t=e.target.value; touch(q); }
  });
}
let sumT=null;
function refreshSums(){ clearTimeout(sumT); sumT=setTimeout(()=>render(), 600); }
</script>

  }

  if(S.clauses){
    const on = q.clauses.filter(x=>x.on);
    let n=0, subN=0;
    p1 += on.map(cl=>{
      const tx = fillVars(cl.x, q);
      if(cl.sub){ subN++; return `<div class="doc-sub"><span class="l">${subN})</span><span>${esc(tx)}</span></div>`; }
      subN=0; n++;
      return `<div class="doc-cl"><span class="l">${hebLetter(n)}.</span><span>${esc(tx)}</span></div>`;
    }).join("");
  }

  // סכום
  const sub=subTotal(q), vat=vatAmt(q), tot=grandTotal(q);
  p1 += `<div class="doc-tot">
    <div><div class="lb">סה״כ התמורה${q.price.vat?" (כולל מע״מ)":""}</div>
      <div class="wd">${hebWords(tot)} ₪${q.price.vat?"":" — לא כולל מע\"מ"}</div></div>
    <div class="vl">${money(tot)}</div></div>`;

  if(q.price.items.filter(i=>i.amount).length>1 || vat || q.price.discount){
    p1 += `<table class="doc-tbl"><thead><tr><th>סעיף</th><th class="num" style="width:32mm">סכום</th></tr></thead><tbody>
      ${q.price.items.filter(i=>i.amount).map(i=>
        `<tr><td>${esc(i.t)}${i.note?`<div style="font-size:8.5pt;color:#666">${esc(i.note)}</div>`:""}</td>
         <td class="num">${money(i.amount)}</td></tr>`).join("")}
      ${elecTotal(q)?`<tr><td>עבודות חשמל לפי נקודות</td><td class="num">${money(elecTotal(q))}</td></tr>`:""}
      ${q.price.discount?`<tr><td>הנחה</td><td class="num">−${money(q.price.discount)}</td></tr>`:""}
      ${vat?`<tr><td>סה״כ לפני מע״מ</td><td class="num">${money(sub)}</td></tr>
             <tr><td>מע״מ ${c.vatRate}%</td><td class="num">${money(vat)}</td></tr>`:""}
      </tbody><tfoot><tr><td>סה״כ</td><td class="num">${money(tot)}</td></tr></tfoot></table>`;
  }

  if(S.notes && q.notes.trim()){
    p1 += `<div class="doc-box"><div class="bt">הערות</div>
      ${esc(q.notes).split("\n").filter(l=>l.trim()).map(l=>`<div class="doc-p">${l}</div>`).join("")}</div>`;
  }

  if(S.sig){
    p1 += `<div class="doc-p" style="margin-top:5mm;font-weight:700">ולראיה באו הצדדים על החתום:</div>
      <div class="doc-sig">
        <div><div class="ln">המזמין — "הלקוח"</div></div>
        <div><div class="ln">"המבצע"</div></div></div>
      <div class="doc-note">התשלום המצוין לעיל ישולם ל"מבצע" בתחילת כל שלב משלבי העבודה.
        ${q.price.vat?"":"המחיר אינו כולל מע\"מ."}</div>`;
  }
  pages.push(sheet(p1));

  /* ---------- עמוד: נספח תשלומים ---------- */
  if(S.stages && q.stages.length){
    const sum=stagesSum(q);
    let p = `<div class="doc-title" style="font-size:14pt">נספח תשלומים
      <small>${esc(q.proj.title||q.client.name)}</small></div>
      <div class="doc-p" style="text-align:center;color:#555;font-size:10pt">
        כל תשלום ישולם בתחילת כל שלב · המחיר אינו כולל מע״מ</div>
      <table class="doc-tbl"><thead><tr>
        <th style="width:10mm">#</th><th>שלב</th><th class="num" style="width:28mm">סכום</th>
        <th style="width:26mm">תאריך</th><th style="width:34mm">חתימה</th></tr></thead><tbody>
        ${q.stages.map((s,i)=>`<tr>
          <td style="text-align:center;color:#666">${i+1}</td>
          <td><b>${esc(s.name)||"—"}</b>${s.note?`<div style="font-size:8.5pt;color:#666">${esc(s.note)}</div>`:""}</td>
          <td class="num">${money(s.amount)}</td>
          <td style="text-align:center;color:#999">${s.date?fmtDate(s.date):""}</td>
          <td></td></tr>`).join("")}
      </tbody><tfoot><tr><td colspan="2">סה״כ</td><td class="num">${money(sum)}</td>
        <td colspan="2"></td></tr></tfoot></table>
      <div class="doc-note">כל האמור לעיל הוא בכפוף למה שסוכם בנספח לחוזה.</div>`;
    pages.push(sheet(p));
  }

  /* ---------- עמוד: מפרט עבודה ---------- */
  if(S.spec && q.spec.some(s=>s.on && s.items.some(i=>i.on))){
    let p = `<div class="doc-bsd">בס״ד</div>
      <div class="doc-title" style="font-size:14pt">מפרט העבודה
        <small>המצורף לחוזה — ${esc(q.proj.title||q.client.name)}</small></div>`;
    if(q.proj.desc.trim()){
      p += `<div class="doc-box"><div class="bt">תיאור העבודה</div>
        <div class="doc-p">${esc(q.proj.desc)}</div></div>`;
    }
    let n=0;
    p += q.spec.filter(s=>s.on && s.items.some(i=>i.on)).map(s=>{
      n++;
      return `<div class="doc-h"><span class="n">${n}</span>${esc(s.t)}</div>
        <ul class="doc-ul">${s.items.filter(i=>i.on&&i.t.trim())
          .map(i=>`<li>${esc(i.t)}</li>`).join("")}</ul>`;
    }).join("");

    if(q.elec.on && q.elec.rows.some(r=>r.qty)){
      p += `<div class="doc-h"><span class="n">${++n}</span>מחירון חשמל לפי נקודה</div>
        <table class="doc-tbl"><thead><tr><th>סוג</th><th class="num" style="width:24mm">מחיר ליח׳</th>
          <th class="num" style="width:20mm">כמות</th><th class="num" style="width:26mm">סה״כ</th></tr></thead><tbody>
          ${q.elec.rows.filter(r=>r.qty).map(r=>`<tr><td>${esc(r.t)}</td>
            <td class="num">${money(r.p)}</td><td class="num">${r.qty}</td>
            <td class="num">${money(r.p*r.qty)}</td></tr>`).join("")}
        </tbody><tfoot><tr><td colspan="3">סה״כ חשמל</td>
          <td class="num">${money(elecTotal(q))}</td></tr></tfoot></table>
        ${q.elec.note?`<div class="doc-note">${esc(q.elec.note)}</div>`:""}`;
    }

    p += `<div class="doc-tot" style="margin-top:6mm">
      <div><div class="lb">המחיר לעבודה וחומר שחור</div>
        <div class="wd">כולל עבודה ברמה טובה וכל בעלי המקצוע הנדרשים · אינו כולל מע״מ</div></div>
      <div class="vl">${money(sub)}</div></div>`;
    pages.push(sheet(p));
  }

  /* ---------- עמוד: חומר לבן ---------- */
  if(S.white && q.white.on!==false && q.white.items.some(w=>w.on&&w.t.trim())){
    let p = `<div class="doc-title" style="font-size:14pt">רשימת חומר לבן
      <small>שמחוץ לחומר שחור — על חשבון הלקוח</small></div>
      <div class="doc-box"><div class="bt">הפריטים הבאים אינם כלולים במחיר</div>
        <div class="doc-p" style="color:#555;font-size:10pt">
          המבצע אחראי להרכבתם, למעט פריטים שאינם בתחום בעלי המקצוע של המבצע.</div></div>
      <div style="columns:2;column-gap:10mm">
        <ul class="doc-ul">${q.white.items.filter(w=>w.on&&w.t.trim())
          .map(w=>`<li style="break-inside:avoid">${esc(w.t)}</li>`).join("")}</ul></div>`;
    if(S.sig){
      p += `<div class="doc-sig" style="margin-top:16mm">
        <div><div class="ln">המזמין — "הלקוח"</div></div>
        <div><div class="ln">"המבצע"</div></div></div>`;
    }
    pages.push(sheet(p));
  }

  return pages.join("");
}

function viewDoc(){
  const q=curQ(); if(!q) return `<div class="empty"><b>לא נבחרה הצעה</b></div>`;
  return `
  <div class="card noprint"><header>
    <h3>הצעה #${q.num} — ${esc(q.client.name)||"ללא שם"}</h3>
    <span class="badge ${STATUS[q.status].c}">${STATUS[q.status].t}</span>
    <div class="sp"></div>
    <button class="btn" onclick="go('edit')">חזרה לעריכה</button>
    <button class="btn" id="btnWa">שלח בוואטסאפ</button>
    <button class="btn o" onclick="window.print()">הדפסה / PDF</button>
  </header>
  <div class="body" style="background:#eceef5;padding:16px" id="docWrap"></div></div>`;
}
function wireDoc(){
  const q=curQ(); if(!q) return;
  $("#docWrap").innerHTML = docHTML(q);
  const wa=$("#btnWa");
  if(wa) wa.onclick=()=>{
    const lines=[`*${DB.co.name}*`,`הצעת מחיר #${q.num}`,""];
    if(q.client.name) lines.push(`לכבוד: ${q.client.name}`);
    if(q.proj.title) lines.push(`פרויקט: ${q.proj.title}`);
    lines.push(`סוג עבודה: ${q.proj.kind}`);
    lines.push("", `*סה"כ: ${money(grandTotal(q))}*${q.price.vat?" (כולל מע\"מ)":' (לא כולל מע"מ)'}`);
    if(q.proj.duration) lines.push(`משך משוער: ${q.proj.duration}`);
    if(q.stages.length) lines.push("", `נספח תשלומים: ${q.stages.length} שלבים`);
    lines.push("", DB.co.phone, DB.co.slogan);
    const phone = (q.client.phone||"").replace(/\D/g,"").replace(/^0/,"972");
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(lines.join("\n"))}`;
    window.open(url,"_blank");
  };
}
</script>

<script>
/* ================= מאגר סעיפים ================= */
let LIBT = "clauses";
function viewLib(){
  const tabs=[["clauses","סעיפים משפטיים"],["spec","מפרטי עבודה"],
              ["stages","שלבי תשלום"],["white","חומר לבן"],["elec","מחירון חשמל"]];
  return `
  <div class="card"><header><h3>מאגר ברירת מחדל</h3><div class="sp"></div>
    <span style="font-size:12.5px;color:var(--muted)">שינויים כאן משפיעים על הצעות <b>חדשות</b> בלבד</span>
  </header>
  <div class="body" style="padding:10px 16px;border-bottom:1px solid var(--line);background:#fbfcfe">
    <div class="row" style="gap:6px">${tabs.map(([k,t])=>
      `<button class="nav-item ${LIBT===k?"active":""}" data-libt="${k}"
        style="font-size:13.5px;padding:6px 13px">${t}</button>`).join("")}</div>
  </div></div>
  ${ {clauses:libClauses, spec:libSpec, stages:libStages,
      white:libWhite, elec:libElec}[LIBT]() }`;
}
function libClauses(){
  const gs=[...new Set(DB.lib.clauses.map(c=>c.g))];
  return `<div class="card"><header><h3>סעיפים משפטיים</h3><div class="sp"></div>
    <button class="btn sm o" onclick="libAddClause()">+ סעיף</button>
    <button class="btn sm" onclick="libReset('clauses')">שחזר ברירת מחדל</button></header>
    <div class="body">
      <div class="hint">"פעיל כברירת מחדל" קובע אם הסעיף יסומן אוטומטית בהצעה חדשה.</div>
      ${gs.map(g=>`<div class="pick open"><div class="h"
        onclick="this.parentNode.classList.toggle('open')">
        <span class="arw">›</span><span class="t">${esc(g)}</span>
        <span class="c">${DB.lib.clauses.filter(c=>c.g===g).length}</span></div>
        <div class="b">${DB.lib.clauses.filter(c=>c.g===g).map(c=>`
          <div class="srow">
            <div style="flex:1">
              <div class="row" style="gap:6px;margin-bottom:5px">
                <input data-lc="${c.id}|t" value="${esc(c.t)}"
                       style="flex:1;font-weight:700;font-size:13px">
                <label class="opt" style="padding:0;margin:0;white-space:nowrap">
                  <input type="checkbox" data-lc="${c.id}|on" ${c.on?"checked":""}>
                  <span class="tx" style="font-size:12px">פעיל כברירת מחדל</span></label>
                <button class="iconbtn d" onclick="libRmClause('${c.id}')">✕</button>
              </div>
              <textarea data-lc="${c.id}|x" rows="2" style="font-size:13px">${esc(c.x)}</textarea>
            </div></div>`).join("")}</div></div>`).join("")}
    </div></div>`;
}
function libSpec(){
  return `<div class="card"><header><h3>מפרטי עבודה</h3><div class="sp"></div>
    <button class="btn sm o" onclick="libAddSpec()">+ פרק</button>
    <button class="btn sm" onclick="libReset('spec')">שחזר ברירת מחדל</button></header>
    <div class="body">${DB.lib.spec.map(s=>`
      <div class="pick"><div class="h">
        <span class="arw" onclick="this.parentNode.parentNode.classList.toggle('open')">›</span>
        <input data-ls="${s.id}|t" value="${esc(s.t)}" style="flex:1;font-weight:700;font-size:13.5px">
        <label class="opt" style="padding:0;margin:0;white-space:nowrap">
          <input type="checkbox" data-ls="${s.id}|on" ${s.on?"checked":""}>
          <span class="tx" style="font-size:12px">ברירת מחדל</span></label>
        <span class="c">${s.items.length}</span>
        <button class="iconbtn d" onclick="libRmSpec('${s.id}')">✕</button></div>
        <div class="b">
          <textarea data-lsi="${s.id}" rows="${Math.min(14,s.items.length+1)}"
            style="font-size:13px" placeholder="שורה אחת לכל סעיף">${esc(s.items.join("\n"))}</textarea>
          <div style="font-size:11.5px;color:var(--muted);padding:4px 2px">שורה אחת = סעיף אחד</div>
        </div></div>`).join("")}
    </div></div>`;
}
function libStages(){
  return `<div class="card"><header><h3>שלבי תשלום</h3><div class="sp"></div>
    <button class="btn sm" onclick="libReset('stages')">שחזר ברירת מחדל</button></header>
    <div class="body">
      <div class="hint">רשימת ההשלמה האוטומטית בעת בניית נספח תשלומים. שורה אחת לכל שלב.</div>
      <textarea data-llist="stages" rows="14">${esc(DB.lib.stages.join("\n"))}</textarea>
    </div></div>`;
}
function libWhite(){
  return `<div class="card"><header><h3>רשימת חומר לבן</h3><div class="sp"></div>
    <button class="btn sm" onclick="libReset('white')">שחזר ברירת מחדל</button></header>
    <div class="body">
      <div class="hint">פריטים שאינם כלולים במחיר. שורה אחת לכל פריט.</div>
      <textarea data-llist="white" rows="14">${esc(DB.lib.white.join("\n"))}</textarea>
    </div></div>`;
}
function libElec(){
  return `<div class="card"><header><h3>מחירון חשמל לפי נקודה</h3><div class="sp"></div>
    <button class="btn sm o" onclick="libAddElec()">+ שורה</button>
    <button class="btn sm" onclick="libReset('elec')">שחזר ברירת מחדל</button></header>
    <div class="body"><table class="tbl"><thead><tr><th>סוג נקודה</th>
      <th class="num" style="width:130px">מחיר (₪)</th><th style="width:40px"></th></tr></thead><tbody>
      ${DB.lib.elec.map((e,i)=>`<tr>
        <td><input data-le="${i}|t" value="${esc(e.t)}"></td>
        <td><input type="number" data-le="${i}|p" value="${e.p}" style="text-align:left"></td>
        <td><button class="iconbtn d" onclick="libRmElec(${i})">✕</button></td></tr>`).join("")}
    </tbody></table></div></div>`;
}
function wireLib(){
  $$("[data-libt]").forEach(b=> b.onclick=()=>{ LIBT=b.dataset.libt; render(); });
  $$("[data-lc]").forEach(el=>{
    const [id,f]=el.dataset.lc.split("|");
    const ev = el.type==="checkbox"?"change":"input";
    el.addEventListener(ev, e=>{
      const c=DB.lib.clauses.find(x=>x.id===id); if(!c) return;
      c[f] = f==="on" ? e.target.checked : e.target.value; save();
    });
  });
  $$("[data-ls]").forEach(el=>{
    const [id,f]=el.dataset.ls.split("|");
    const ev = el.type==="checkbox"?"change":"input";
    el.addEventListener(ev, e=>{
      const s=DB.lib.spec.find(x=>x.id===id); if(!s) return;
      s[f] = f==="on" ? e.target.checked : e.target.value; save();
    });
  });
  $$("[data-lsi]").forEach(el=> el.oninput=e=>{
    const s=DB.lib.spec.find(x=>x.id===el.dataset.lsi); if(!s) return;
    s.items = e.target.value.split("\n").map(x=>x.trim()).filter(Boolean); save();
  });
  $$("[data-llist]").forEach(el=> el.oninput=e=>{
    DB.lib[el.dataset.llist] = e.target.value.split("\n").map(x=>x.trim()).filter(Boolean); save();
  });
  $$("[data-le]").forEach(el=>{
    const [i,f]=el.dataset.le.split("|");
    el.oninput=e=>{ const r=DB.lib.elec[Number(i)]; if(!r) return;
      r[f] = f==="p" ? (Number(e.target.value)||0) : e.target.value; save(); };
  });
}
function libAddClause(){ DB.lib.clauses.push({id:"L"+uid(),g:"כללי",t:"סעיף חדש",on:false,x:""}); save(true); render(); }
function libRmClause(id){ DB.lib.clauses=DB.lib.clauses.filter(c=>c.id!==id); save(true); render(); }
function libAddSpec(){ DB.lib.spec.push({id:"L"+uid(),t:"פרק חדש",on:false,items:[]}); save(true); render(); }
function libRmSpec(id){ DB.lib.spec=DB.lib.spec.filter(s=>s.id!==id); save(true); render(); }
function libAddElec(){ DB.lib.elec.push({t:"",p:0}); save(true); render(); }
function libRmElec(i){ DB.lib.elec.splice(i,1); save(true); render(); }
function libReset(k){
  confirmBox("לשחזר ברירת מחדל?","המאגר הנוכחי יוחלף. הצעות קיימות לא יושפעו.",()=>{
    DB.lib[k] = k==="clauses"?clone(DEF_CLAUSES) : k==="spec"?clone(DEF_SPEC)
              : k==="stages"?[...DEF_STAGES] : k==="white"?[...DEF_WHITE] : clone(DEF_ELEC);
    save(true); toast("שוחזר","ok"); render();
  });
}

/* ================= הגדרות ================= */

  const c=DB.co;
  return `
  <div class="card"><header><h3>פרטי החברה</h3></header><div class="body">
    <div class="grid g3">
      <div><label>שם החברה</label><input data-co="name" value="${esc(c.name)}"></div>

      <div><label>ת.ז. / ח.פ.</label><input data-co="taxId" value="${esc(c.taxId)}"></div>
      <div><label>טלפון</label><input data-co="phone" value="${esc(c.phone)}"></div>
      <div><label>דוא״ל</label><input data-co="email" value="${esc(c.email)}"></div>
      <div><label>כתובת</label><input data-co="address" value="${esc(c.address)}"></div>
      <div><label>סלוגן</label><input data-co="slogan" value="${esc(c.slogan)}"></div>
      <div><label>כותרת המסמך</label><input data-co="docTitle" value="${esc(c.docTitle)}"></div>

    </div>
  </div></div>

  <div class="card"><header><h3>לוגו ונייר מכתבים</h3></header><div class="body">
    <div class="row" style="align-items:flex-start;gap:20px">
      <div style="flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff">
        ${c.logo?`<img src="${c.logo}" style="height:56px;display:block">`
                :`<div style="color:var(--muted);font-size:13px">אין לוגו</div>`}
      </div>
      <div style="flex:1">
        <div class="row"><button class="btn" onclick="$('#logoIn').click()">החלף לוגו</button>
          ${c.logo?`<button class="btn d" onclick="rmLogo()">הסר</button>`:""}</div>
        <label class="opt ${c.watermark?"on":""}" style="margin-top:10px;max-width:280px">
          <input type="checkbox" data-co="watermark" ${c.watermark?"checked":""}>
          <span class="tx">סימן מים ברקע המסמך</span></label>
        <div style="font-size:12.5px;color:var(--muted);margin-top:8px">
          הלוגו מוטמע בקובץ ומופיע בראש כל עמוד מודפס.</div>
      </div>
    </div>
  </div></div>

  <div class="card"><header><h3>נתונים</h3></header><div class="body">
    <div class="row">
      <button class="btn p" onclick="backup()">ייצוא גיבוי (JSON)</button>
      <button class="btn" onclick="$('#fileIn').click()">ייבוא מגיבוי</button>
      <div class="sp" style="flex:1"></div>
      <button class="btn d" onclick="wipe()">מחיקת כל הנתונים</button>
    </div>
    <div class="hint" style="margin-top:12px">
      הנתונים נשמרים מקומית בדפדפן זה בלבד (localStorage).
      מומלץ לייצא גיבוי מדי פעם. כרגע: <b>${DB.quotes.length}</b> הצעות.
    </div>
  </div></div>`;
}
function wireSet(){
  $$("[data-co]").forEach(el=>{
    const f=el.dataset.co, ev = el.type==="checkbox"?"change":"input";
    el.addEventListener(ev, e=>{
      DB.co[f] = el.type==="checkbox" ? e.target.checked
               : (f==="vatRate" ? (Number(e.target.value)||0) : e.target.value);
      save();
    });
  });
}
function rmLogo(){ DB.co.logo=""; save(true); render(); }
function wipe(){
  confirmBox("למחוק את כל הנתונים?","כל ההצעות והמאגרים יימחקו לצמיתות. ודא שיש לך גיבוי.",()=>{
    localStorage.removeItem(KEY); DB=blankDB(); CUR=null; save(true);
    toast("הנתונים נמחקו"); go("dash");
  });
}
function backup(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`berri-quotes-${todayISO()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("הגיבוי הורד","ok");
}

/* ================= אתחול ================= */
function boot(){
  load();
  renderNav(); render();

  $("#nav").onclick = e=>{ const b=e.target.closest("[data-tab]"); if(b) go(b.dataset.tab); };
  $("#btnNew").onclick = createQ;
  $("#btnBackup").onclick = backup;
  $("#btnRestore").onclick = ()=> $("#fileIn").click();

  $("#fileIn").onchange = e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload = ()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.quotes) throw 0;
        confirmBox("לייבא את הגיבוי?",
          `הקובץ מכיל ${d.quotes.length} הצעות. הנתונים הנוכחיים יוחלפו.`,()=>{
          // סדר קריטי: כותבים את הקובץ המיובא לאחסון ורק אז load() מנרמל אותו.
          // קריאה ל-load() לפני הכתיבה הייתה דורסת את המיובא בנתונים הישנים.
          localStorage.setItem(KEY, JSON.stringify(d));
          load();
          CUR=null; toast(`יובאו ${DB.quotes.length} הצעות`,"ok"); go("dash");
        });
      }catch(err){ toast("קובץ גיבוי לא תקין","err"); }
      e.target.value="";
    };
    r.readAsText(f);
  };
  $("#logoIn").onchange = e=>{
    const f=e.target.files[0]; if(!f) return;
    if(f.size > 900000){ toast("הקובץ גדול מדי (עד 900KB)","err"); e.target.value=""; return; }
    const r=new FileReader();
    r.onload=()=>{ DB.co.logo=r.result; save(true); toast("הלוגו עודכן","ok"); render(); e.target.value=""; };
    r.readAsDataURL(f);
  };

  document.addEventListener("keydown", e=>{
    if(e.key==="Escape") closeModal();
    if((e.ctrlKey||e.metaKey) && e.key==="s"){ e.preventDefault(); save(true); toast("נשמר","ok"); }
    if((e.ctrlKey||e.metaKey) && e.key==="p" && TAB!=="doc" && CUR){ e.preventDefault(); go("doc"); }
  });
  window.addEventListener("beforeunload", ()=> save(true));
}
boot();
</script>
