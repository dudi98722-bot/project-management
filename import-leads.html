const API_KEY = 'masger_api_url';
let apiUrl = localStorage.getItem(API_KEY) || '';
window.onload = () => {
  const f = document.getElementById('apiUrlField');
  if (apiUrl) f.value = apiUrl;
};

function log(msg, cls='inf') {
  const d = document.createElement('div');
  d.className = cls; d.textContent = msg;
  const el = document.getElementById('log');
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

async function apiPost(body) {
  const res = await fetch(apiUrl, { method:'POST', body: JSON.stringify(body) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'שגיאה');
  return json.data;
}

async function startImport() {
  const field = document.getElementById('apiUrlField');
  if (field && field.value.trim()) {
    apiUrl = field.value.trim();
    localStorage.setItem(API_KEY, apiUrl);
  }
  if (!apiUrl) {
    alert('נא להדביק את ה-URL של Apps Script');
    return;
  }
  document.getElementById('urlSection').style.display = 'none';
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'מייבא...';
  let ok = 0, fail = 0;
  for (let i = 0; i < PROJECTS.length; i++) {
    const p = PROJECTS[i];
    document.getElementById('statusText').textContent = 'מייבא ' + (i+1) + ' / ' + PROJECTS.length + ': ' + p.name;
    document.getElementById('bar').style.width = ((i+1)/PROJECTS.length*100)+'%';
    try {
      await apiPost({ action:'upsert', collection:'projects', id:p.id, data:p });
      log('✓ ' + p.name + (p.phone?' | '+p.phone:''), 'ok');
      ok++;
    } catch(e) {
      log('✗ ' + p.name + ' — ' + e.message, 'err');
      fail++;
    }
    await new Promise(r => setTimeout(r, 300));
  }
  document.getElementById('statusText').textContent = 'סיום! ' + ok + ' הצליחו, ' + fail + ' נכשלו';
  btn.textContent = fail===0 ? '✓ הייבוא הושלם בהצלחה! לחץ לפתיחת CRM' : ('⚠️ ' + fail + ' שגיאות — לחץ לפתיחת CRM');
  btn.className = 'btn ' + (fail===0?'success':'');
  btn.disabled = false;
  btn.onclick = () => window.location.href = 'crm-masger.html';
}
</script>
</body>
</html>
