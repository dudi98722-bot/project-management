<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM ייעוץ שינה</title>
<style>
  :root{
    --bg:#f4f2fb; --card:#fff; --ink:#2c2740; --muted:#8a86a0; --accent:#7c6cf0;
    --accent2:#a48bf0; --line:#e7e3f3; --ok:#3fb27f; --warn:#e0a93f; --new:#5a8df0; --req:#e06a8b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg)}
  /* ---- login ---- */
  #login{position:fixed;inset:0;background:linear-gradient(135deg,#eef2fb,#f6eefb);
    display:flex;align-items:center;justify-content:center;z-index:50}
  #login .box{background:#fff;border-radius:20px;padding:36px 30px;width:330px;text-align:center;
    box-shadow:0 16px 40px rgba(124,108,240,.22)}
  #login .moon{font-size:42px}
  #login h2{margin:8px 0 22px;color:var(--accent)}
  #login input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px;margin-bottom:12px;font-size:15px}
  #login button{width:100%;border:none;border-radius:11px;padding:13px;font-size:16px;font-weight:700;color:#fff;
    cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  #loginErr{color:var(--req);font-size:13px;min-height:18px;margin-top:8px}
  /* ---- app ---- */
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;
    align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  header .logo{font-size:24px}
  header h1{font-size:18px;margin:0;flex:1}
  header .who{color:var(--muted);font-size:13px}
  header button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13px}
  .bar{display:flex;gap:12px;padding:16px 22px;flex-wrap:wrap;align-items:center}
  .bar input.search{flex:1;min-width:200px;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;font-size:15px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;min-width:78px}
  .stat b{display:block;font-size:20px;color:var(--accent)}
  .stat span{font-size:11.5px;color:var(--muted)}
  .filters{display:flex;gap:8px;padding:0 22px 8px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
  .chip.on{border-color:var(--accent);background:#f3f0ff;color:var(--accent);font-weight:600}
  .list{padding:8px 22px 40px;display:grid;gap:12px}
  .row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;
    display:flex;align-items:center;gap:14px;transition:.12s}
  .row:hover{box-shadow:0 6px 16px rgba(60,50,110,.1);transform:translateY(-1px)}
  .row .av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:20px;background:#f3f0ff}
  .row .main{flex:1;min-width:0}
  .row .main b{font-size:15.5px}
  .row .main div{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:11.5px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
  .b-new{background:#e8f0ff;color:var(--new)} .b-in_progress{background:#fdf3e1;color:var(--warn)} .b-done{background:#e7f7ef;color:var(--ok)}
  .empty{text-align:center;color:var(--muted);padding:50px 20px}
  /* ---- detail modal ---- */
  .ov{position:fixed;inset:0;background:rgba(44,39,64,.45);display:none;align-items:flex-start;
    justify-content:center;z-index:30;padding:22px 14px;overflow:auto}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:20px;max-width:780px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .mhead{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:22px 24px;
    border-radius:20px 20px 0 0;display:flex;align-items:flex-start;gap:14px}
  .mhead .x{margin-inline-start:auto;cursor:pointer;font-size:24px;line-height:1;opacity:.9}
  .mhead h2{margin:0 0 4px;font-size:21px} .mhead .sub{opacity:.92;font-size:13.5px}
  .mtools{display:flex;gap:8px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .mtools select,.mtools button{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;background:#fff}
  .mtools .del{margin-inline-start:auto;color:var(--req);border-color:#f3d4de}
  .mbody{padding:8px 24px 24px}
  .dsec{margin-top:20px}
  .dsec h3{display:flex;gap:8px;align-items:center;font-size:16px;color:var(--accent);margin:0 0 8px;
    padding-bottom:8px;border-bottom:2px solid var(--line)}
  .da{margin:11px 0}
  .da .ql{font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:3px;line-height:1.4}
  .da .av2{font-size:14.5px;color:#444;line-height:1.6;white-space:pre-wrap;background:#faf9ff;border-radius:9px;padding:8px 11px;border:1px solid var(--line)}
  .da .av2.empty2{color:#bbb;font-style:italic}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:#f3f0ff;color:var(--accent);border-radius:8px;padding:5px 10px;font-size:13px}
  .flag{background:#fdeef2;color:var(--req)}
  table.gview{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:4px}
  table.gview td{padding:6px 8px;border-bottom:1px solid var(--line)}
  table.gview td.l{font-weight:600;width:55%}
  .bars{display:inline-flex;gap:3px;vertical-align:middle}
  .bars i{width:13px;height:13px;border-radius:3px;background:#ece8f8;display:inline-block}
  .bars i.f{background:var(--accent)}
  .notes textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px;font-size:14px;min-height:70px;font-family:inherit}
  .notes button{margin-top:8px;border:none;background:var(--accent);color:#fff;border-radius:9px;padding:9px 18px;cursor:pointer;font-weight:600}
  .savehint{color:var(--ok);font-size:13px;margin-inline-start:10px;display:none}
  @media(max-width:560px){.bar,.list,.filters{padding-inline:14px}.mbody,.mtools,.mhead{padding-inline:16px}}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="box">
    <div class="moon">🌙</div>
    <h2>CRM ייעוץ שינה</h2>
    <input id="u" placeholder="שם משתמש" autocomplete="username">
    <input id="p" type="password" placeholder="סיסמה" autocomplete="current-password">
    <button id="loginBtn">כניסה</button>
    <div id="loginErr"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none">
  <header>
    <span class="logo">🌙</span>
    <h1>ניהול לקוחות – ייעוץ שינה</h1>
    <span class="who" id="who"></span>
    <button id="logout">יציאה</button>
  </header>

  <div class="bar">
    <input class="search" id="search" placeholder="חיפוש לפי שם הורים / ילד / טלפון...">
    <div class="stat"><b id="stTotal">0</b><span>סה"כ</span></div>
    <div class="stat"><b id="stNew">0</b><span>חדשים</span></div>
    <div class="stat"><b id="stProg">0</b><span>בטיפול</span></div>
  </div>
  <div class="filters">
    <div class="chip on" data-f="all">הכל</div>
    <div class="chip" data-f="new">חדש</div>
    <div class="chip" data-f="in_progress">בטיפול</div>
    <div class="chip" data-f="done">הסתיים</div>
  </div>
  <div class="list" id="list"></div>
</div>

<!-- ===== DETAIL ===== -->
<div class="ov" id="ov">
  <div class="modal">
    <div class="mhead">
      <div>
        <h2 id="dTitle"></h2>
        <div class="sub" id="dSub"></div>
      </div>
      <span class="x" id="closeBtn">×</span>
    </div>
    <div class="mtools">
      <label style="font-size:13px;color:var(--muted)">סטטוס:</label>
      <select id="dStatus">
        <option value="new">חדש</option>
        <option value="in_progress">בטיפול</option>
        <option value="done">הסתיים</option>
      </select>
      <span class="savehint" id="statusHint">נשמר ✓</span>
      <button class="del" id="delBtn">מחיקה</button>
    </div>
    <div class="mbody" id="dBody"></div>
  </div>
</div>

<script src="schema.js"></script>
<script>
(function(){
  var API = location.origin + '/api';
  var TK = function(){ return sessionStorage.getItem('sleep_token')||''; };
  var rows=[], filter='all', current=null;

  function af(path,opts){
    opts=opts||{}; opts.headers=opts.headers||{};
    if(TK()) opts.headers['Authorization']='Bearer '+TK();
    if(opts.body&&typeof opts.body!=='string'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body);}
    return fetch(API+path,opts).then(function(r){
      if(r.status===401&&TK()){sessionStorage.removeItem('sleep_token');location.reload();}
      return r;
    });
  }
  function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML;}

  // ---- login ----
  function doLogin(){
    var u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
    var err=document.getElementById('loginErr'); err.textContent='מאמת...';
    fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
    .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
    .then(function(res){
      if(!res.ok){err.textContent=res.d.error||'פרטים שגויים';document.getElementById('p').value='';return;}
      sessionStorage.setItem('sleep_token',res.d.token);
      sessionStorage.setItem('sleep_user',res.d.user.username);
      start();
    }).catch(function(){err.textContent='שגיאת חיבור לשרת';});
  }
  document.getElementById('loginBtn').onclick=doLogin;
  document.getElementById('p').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  document.getElementById('logout').onclick=function(){sessionStorage.clear();location.reload();};

  function start(){
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('who').textContent=sessionStorage.getItem('sleep_user')||'';
    load();
  }

  function load(){
    af('/submissions').then(function(r){return r.json();}).then(function(d){
      rows=Array.isArray(d)?d:[]; render();
    }).catch(function(){});
  }

  // ---- list ----
  document.getElementById('search').addEventListener('input',render);
  document.querySelectorAll('.chip').forEach(function(c){
    c.onclick=function(){document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
      c.classList.add('on');filter=c.getAttribute('data-f');render();};
  });
  var STLBL={new:'חדש',in_progress:'בטיפול',done:'הסתיים'};

  function render(){
    var q=(document.getElementById('search').value||'').trim().toLowerCase();
    var n=rows.length, nNew=rows.filter(function(r){return r.status==='new';}).length;
    var nProg=rows.filter(function(r){return r.status==='in_progress';}).length;
    document.getElementById('stTotal').textContent=n;
    document.getElementById('stNew').textContent=nNew;
    document.getElementById('stProg').textContent=nProg;
    var data=rows.filter(function(r){
      if(filter!=='all'&&r.status!==filter) return false;
      if(!q) return true;
      return ((r.parents_names||'')+' '+(r.child_name||'')+' '+(r.phone||'')).toLowerCase().indexOf(q)>=0;
    });
    var list=document.getElementById('list');
    if(!data.length){list.innerHTML='<div class="empty">אין פניות להצגה</div>';return;}
    list.innerHTML='';
    data.forEach(function(r){
      var el=document.createElement('div'); el.className='row'; el.onclick=function(){openDetail(r.id);};
      var d=r.created_at?new Date(r.created_at).toLocaleDateString('he-IL'):'';
      el.innerHTML='<div class="av">👶</div><div class="main"><b>'+esc(r.parents_names||'ללא שם')+'</b>'+
        '<div>'+esc(r.child_name||'')+'</div><div>'+esc(r.main_difficulty||'')+'</div></div>'+
        '<div style="text-align:left"><span class="badge b-'+r.status+'">'+STLBL[r.status]+'</span>'+
        '<div style="font-size:11.5px;color:var(--muted);margin-top:6px">'+d+'</div></div>';
      list.appendChild(el);
    });
  }

  // ---- detail ----
  function openDetail(id){
    af('/submissions/'+id).then(function(r){return r.json();}).then(function(r){
      current=r; var a=r.answers||{};
      document.getElementById('dTitle').textContent=r.parents_names||'פנייה';
      document.getElementById('dSub').textContent=(r.child_name||'')+
        (r.created_at?'  ·  התקבל '+new Date(r.created_at).toLocaleDateString('he-IL'):'');
      document.getElementById('dStatus').value=r.status;
      var body=document.getElementById('dBody'); body.innerHTML='';
      window.SLEEP_SCHEMA.forEach(function(sec){
        var ds=document.createElement('div'); ds.className='dsec';
        ds.innerHTML='<h3><span>'+sec.icon+'</span><span>'+esc(sec.section)+'</span></h3>';
        sec.fields.forEach(function(f){
          var v=a[f.key], html='';
          if(f.type==='grid'){
            html='<table class="gview">';
            f.rows.forEach(function(rw){
              var val=v&&v[rw.key]?v[rw.key]:0, bars='';
              for(var i=1;i<=5;i++){bars+='<i class="'+(i<=val?'f':'')+'"></i>';}
              html+='<tr><td class="l">'+esc(rw.label)+'</td><td><span class="bars">'+bars+'</span> '+(val?val+'/5':'-')+'</td></tr>';
            });
            html+='</table>';
          } else if(f.type==='checkbox'){
            var arr=Array.isArray(v)?v.filter(Boolean):[];
            if(arr.length){ html='<div class="tags">'+arr.map(function(o){
              var isFlag=(f.flags&&f.options.indexOf(o)>=0&&f.flags.indexOf(f.options.indexOf(o))>=0);
              return '<span class="tag '+(isFlag?'flag':'')+'">'+esc(o)+'</span>';
            }).join('')+'</div>'; }
            else { html='<div class="av2 empty2">לא נבחר</div>'; }
          } else {
            var txt=(v==null||v==='')?'':String(v);
            html='<div class="av2'+(txt?'':' empty2')+'">'+(txt?esc(txt):'לא מולא')+'</div>';
          }
          var da=document.createElement('div'); da.className='da';
          da.innerHTML='<div class="ql">'+esc(f.label)+'</div>'+html;
          ds.appendChild(da);
        });
        body.appendChild(ds);
      });
      // private notes
      var notes=document.createElement('div'); notes.className='dsec notes';
      notes.innerHTML='<h3><span>📝</span><span>הערות פרטיות (היועצת בלבד)</span></h3>'+
        '<textarea id="dNotes">'+esc(r.notes||'')+'</textarea><br>'+
        '<button id="saveNotes">שמירת הערות</button><span class="savehint" id="notesHint">נשמר ✓</span>';
      body.appendChild(notes);
      document.getElementById('saveNotes').onclick=saveNotes;
      document.getElementById('ov').classList.add('show');
      document.querySelector('.modal').scrollTop=0;
    });
  }
  function patch(fields,hintId){
    return af('/submissions/'+current.id,{method:'PUT',body:fields}).then(function(r){return r.json();}).then(function(u){
      current=u||current;
      var idx=rows.findIndex(function(x){return x.id===current.id;});
      if(idx>=0){rows[idx].status=current.status;rows[idx].notes=current.notes;}
      render();
      if(hintId){var h=document.getElementById(hintId);if(h){h.style.display='inline';setTimeout(function(){h.style.display='none';},1500);}}
    });
  }
  document.getElementById('dStatus').onchange=function(){patch({status:this.value},'statusHint');};
  function saveNotes(){patch({notes:document.getElementById('dNotes').value},'notesHint');}
  document.getElementById('delBtn').onclick=function(){
    if(!confirm('למחוק את הפנייה לצמיתות?')) return;
    af('/submissions/'+current.id,{method:'DELETE'}).then(function(){
      rows=rows.filter(function(x){return x.id!==current.id;});
      closeDetail(); render();
    });
  };
  function closeDetail(){document.getElementById('ov').classList.remove('show');current=null;}
  document.getElementById('closeBtn').onclick=closeDetail;
  document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)closeDetail();});

  // ---- boot ----
  if(TK()) start();
})();
</script>
</body>
</html>
