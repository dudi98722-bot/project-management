/* נגיעה על כרטיס — מה אפשר לעשות איתו */
function cardActions(tk, id){
  if(!isManager()) return;
  var rows = TABLES[tk].rows().filter(function(r){ return r.id === id; });
  if(!rows.length) return;
  var r = rows[0], title, edit, del;

  if(tk === 'dep' || tk === 'wd'){
    var kind = TABLES[tk].kind;
    title = fmtDate(r.date) + ' · ' + money(r.amount);
    edit  = "closeModal();entryModal('" + kind + "','" + id + "')";
    del   = "closeModal();askDeleteEntry('" + kind + "','" + id + "')";
  } else if(tk === 'cat'){
    title = r.name;
    edit  = "closeModal();catModal('" + id + "')";
    del   = "closeModal();askDeleteCat('" + id + "')";
  } else {
    title = r.fullName;
    edit  = "closeModal();userModal('" + id + "')";
    del   = (r.id === S.user.id) ? '' : "closeModal();askDeleteUser('" + id + "')";
  }

  var inv = '';
  if(tk === 'wd' && hasInvoice()){        /* הפעולה הנפוצה ביותר — ראשונה ברשימה */
    inv = '<button class="sheet-item" onclick="' + "closeModal();toggleInvoice('" + id + "')" + '">' +
          '<span class="ic">🧾</span>' +
          (r.invoice ? 'סמן שחסרה חשבונית' : 'סמן שהתקבלה חשבונית') + '</button>';
  }
  haptic(6);
  openModal(modalBox(title,
    '<div class="sheet-list">' + inv +
      '<button class="sheet-item" onclick="' + edit + '">' +
        '<span class="ic">✏️</span>עריכה</button>' +
      (del ? '<button class="sheet-item" style="color:var(--red)" onclick="' + del + '">' +
        '<span class="ic">🗑️</span>' +
        (tk === 'usr' ? 'השבתה' : 'מחיקה') + '</button>' : '') +
    '</div>', ''));
}

/* ---------- גרירת גיליון ---------- */
function attachSheetDrag(box, scrim){
  if(!box) return;
  var head = box;                 /* גוררים מהמסגרת, לא מהתוכן שנגלל */
  var H = box.getBoundingClientRect().height || window.innerHeight * 0.6;
  var y = H, anim = null, dragging = false, grabY = 0, hist = [];

  function paint(v){
    y = v;
    box.style.transform = 'translate3d(0,' + v + 'px,0)';
    if(scrim) scrim.style.background =
      'rgba(26,26,26,' + (0.45 * Math.max(0, Math.min(1, 1 - v / H))).toFixed(3) + ')';
  }
  /* כשהדפדפן לא מצייר (לשונית ברקע, מסך כבוי) אין פריימים כלל —
     במצב כזה פותחים את הגיליון מיד, כדי שלא יישאר תקוע מחוץ למסך */
  if(document.hidden || reduceMotion()){
    paint(0);
  } else {
    paint(H);
    anim = spring(H, 0, { damping: 0.8, response: 0.3 }, paint);
    setTimeout(function(){
      if(!dragging && y > 1){ if(anim) anim.stop(); paint(0); }
    }, 700);
  }

  function down(e){
    if(e.target.closest('button,input,select,textarea,a,.modal-body')) return;
    if(anim){ anim.stop(); anim = null; }        /* תופסים את התנועה איפה שהיא */
    dragging = true;
    grabY = e.clientY - y;                        /* שומרים את נקודת האחיזה */
    hist = [{ t: performance.now(), y: e.clientY }];
    try{ head.setPointerCapture(e.pointerId); }catch(err){}
  }
  function move(e){
    if(!dragging) return;
    var d = e.clientY - grabY;
    if(d < 0) d = -rubber(-d, H);                 /* התנגדות כלפי מעלה */
    paint(d);
    hist.push({ t: performance.now(), y: e.clientY });
    if(hist.length > 6) hist.shift();
  }
  function up(){
    if(!dragging) return;
    dragging = false;
    var v = 0;
    if(hist.length > 1){
      var a = hist[0], b = hist[hist.length - 1], dt = (b.t - a.t) / 1000;
      if(dt > 0) v = (b.y - a.y) / dt;
    }
    if(y + project(v) > H * 0.4){
      haptic(8);
      var done = false, fin = function(){ if(!done){ done = true; closeModal(); } };
      anim = spring(y, H, { damping: 1, response: 0.26, velocity: v }, paint, fin);
      setTimeout(fin, 500);          /* הסגירה קורית גם אם האנימציה לא רצה */
    } else {
      /* חזרה למקום אחרי תנופה — קצת קפיצה, כי הייתה תנועה פיזית */
      anim = spring(y, 0, { damping: 0.8, response: 0.3, velocity: v }, paint);
    }
  }
  head.addEventListener('pointerdown', down);
  head.addEventListener('pointermove', move);
  head.addEventListener('pointerup', up);
  head.addEventListener('pointercancel', up);
}
