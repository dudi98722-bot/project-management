<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מטבעות געלדמאן — להדפסה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&family=Heebo:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rubik', sans-serif;
    background: #f0f2f5;
    color: #222;
    padding: 20px;
  }

  /* ===== סרגל שליטה (לא מודפס) ===== */
  .toolbar {
    max-width: 900px;
    margin: 0 auto 24px;
    background: #fff;
    border-radius: 18px;
    padding: 22px 26px;
    box-shadow: 0 6px 24px rgba(0,0,0,.08);
    text-align: center;
  }
  .toolbar h1 { font-family: 'Heebo'; font-size: 30px; color: #222; margin-bottom: 6px; }
  .toolbar p { color: #666; font-size: 15px; margin-bottom: 16px; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    border: none; cursor: pointer; font-family: 'Rubik'; font-weight: 600;
    font-size: 15px; padding: 12px 24px; border-radius: 12px; transition: .15s;
  }
  .btn-print { background: #222; color: #fff; }
  .btn-print:hover { background: #000; transform: translateY(-1px); }
  .btn-ghost { background: #eee; color: #444; }
  .btn-ghost:hover { background: #e2e2e2; }

  /* ===== עמוד ההדפסה ===== */
  .sheet {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.08);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    justify-items: center;
  }

  /* ===== המטבע ===== */
  .coin { width: 150px; height: 150px; }
  .coin svg { width: 100%; height: 100%; display: block; }

  /* מרווח ריווח בין קבוצות ערכים */
  .value-label {
    grid-column: 1 / -1;
    text-align: right;
    font-family: 'Heebo';
    font-weight: 900;
    font-size: 17px;
    color: #999;
    margin: 14px 4px 2px;
    border-bottom: 2px dashed #ddd;
    padding-bottom: 4px;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .sheet { box-shadow: none; max-width: 100%; padding: 8mm; border-radius: 0; }
    .grid { gap: 10px; }
    .coin { width: 42mm; height: 42mm; }
    .value-label { color: #bbb; }
    @page { margin: 8mm; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <h1>🪙 מטבעות געלדמאן</h1>
    <p>מבצע התנהגות טובה לחופש — הדפיסו, גזרו וחלקו!</p>
    <div class="btns">
      <button class="btn btn-print" onclick="window.print()">🖨️ הדפסה</button>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="grid" id="grid"></div>
  </div>

<script>
/* הגדרת שלושה סוגי מטבעות לפי ערך — הכל שחור-לבן */
const INK = '#111';
const TYPES = [
  { value: '1',  label: 'געלדמאן · ערך 1',  copies: 8 },
  { value: '5',  label: 'געלדמאן · ערך 5',  copies: 6 },
  { value: '10', label: 'געלדמאן · ערך 10', copies: 6 },
];

/* ===== געלדי — קמע קטן וקליט: מטבע קורץ עם אגודל למעלה (מרחב מקומי ~0..100) ===== */
function geldiMascot(s, sw) {
  sw = sw || 2.7;
  const w = k => (sw * k).toFixed(2);
  return `
    <!-- זרוע שמאל מורמת עם אגודל -->
    <path d="M27,62 C17,60 12,52 15,44" fill="none" stroke="${s}" stroke-width="${w(1.4)}" stroke-linecap="round"/>
    <circle cx="14" cy="41" r="5.5" fill="#fff" stroke="${s}" stroke-width="${w(1.1)}"/>
    <path d="M14,36 L14,28" fill="none" stroke="${s}" stroke-width="${w(1.3)}" stroke-linecap="round"/>
    <!-- זרוע ימין על המותן -->
    <path d="M73,62 C83,62 87,68 85,75" fill="none" stroke="${s}" stroke-width="${w(1.4)}" stroke-linecap="round"/>
    <!-- רגליים ונעליים -->
    <path d="M41,84 L39,95 M59,84 L61,95" fill="none" stroke="${s}" stroke-width="${w(1.4)}" stroke-linecap="round"/>
    <path d="M32,96 C35,91 41,91 40,95 Z M68,96 C65,91 59,91 60,95 Z" fill="#fff" stroke="${s}" stroke-width="${w(1)}" stroke-linejoin="round"/>
    <!-- גוף = מטבע -->
    <circle cx="50" cy="55" r="30" fill="#fff" stroke="${s}" stroke-width="${w(1.3)}"/>
    <circle cx="50" cy="55" r="24" fill="none" stroke="${s}" stroke-width="${w(0.4)}" stroke-dasharray="2 3" opacity="0.45"/>
    <!-- כובע -->
    <ellipse cx="50" cy="29" rx="30" ry="5" fill="${s}"/>
    <path d="M37,29 L39,16 C43,11 57,11 61,16 L63,29 Z" fill="${s}"/>
    <!-- עיניים: אחת פקוחה ואחת קורצת -->
    <circle cx="41" cy="51" r="3.4" fill="${s}"/>
    <path d="M54,51 C57,48 62,48 65,51" fill="none" stroke="${s}" stroke-width="${w(1.1)}" stroke-linecap="round"/>
    <!-- חיוך גדול -->
    <path d="M38,60 C44,71 56,71 62,60" fill="none" stroke="${s}" stroke-width="${w(1.2)}" stroke-linecap="round"/>
    <!-- לחיים -->
    <circle cx="33" cy="60" r="2.6" fill="${s}" opacity="0.3"/>
    <circle cx="67" cy="60" r="2.6" fill="${s}" opacity="0.3"/>`;
}

/* מחולל SVG של מטבע — עם הקמע געלדי */
function coinSVG(t) {
  return `
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- שפה חיצונית -->
    <circle cx="100" cy="100" r="94" fill="#fff" stroke="${INK}" stroke-width="5"/>
    <!-- טבעת פנימית מנוקדת -->
    <circle cx="100" cy="100" r="82" fill="none" stroke="${INK}" stroke-width="2" stroke-dasharray="3 4" opacity=".55"/>
    <!-- שם המבצע -->
    <text x="100" y="33" text-anchor="middle" font-family="Heebo, sans-serif" font-weight="900" font-size="18" fill="${INK}">געלדמאן</text>
    <!-- הקמע געלדי -->
    <g transform="translate(55.3,38) scale(0.95)">${geldiMascot(INK, 2.7)}</g>
    <!-- הערך בתג -->
    <circle cx="100" cy="172" r="18" fill="${INK}"/>
    <text x="100" y="180" text-anchor="middle" font-family="Heebo, sans-serif" font-weight="900" font-size="21" fill="#fff">${t.value}</text>
  </svg>`;
}

/* בניית הגריד */
function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  TYPES.forEach(t => {
    const lbl = document.createElement('div');
    lbl.className = 'value-label';
    lbl.textContent = t.label;
    grid.appendChild(lbl);
    for (let i = 0; i < t.copies; i++) {
      const d = document.createElement('div');
      d.className = 'coin';
      d.innerHTML = coinSVG(t);
      grid.appendChild(d);
    }
  });
}
render();
</script>
</body>
</html>
