<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת אבחון גרפולוגי — ישראל הפטקה</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✒️</text></svg>">
<style>
  :root{
    --bg:#eef1f6; --panel:#ffffff; --ink:#1f2733; --muted:#6b7688;
    --brand:#2b3a67; --brand2:#3f5694; --accent:#0e8a6e; --accent-soft:#e3f4ef;
    --warn:#c2410c; --warn-soft:#fff1e8; --danger:#b91c1c; --good:#15803d;
    --line:#e2e6ee; --chip:#eef2fb; --shadow:0 6px 22px rgba(28,40,70,.10);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI","Assistant","Heebo",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--brand2)}
  .hidden{display:none!important}

  header.top{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
  header.top .logo{font-size:26px}
  header.top h1{font-size:18px;margin:0;font-weight:700}
  header.top .sub{font-size:12px;opacity:.85;margin-top:1px}
  header.top .spacer{flex:1}
  nav.tabs{display:flex;gap:4px;background:#fff;padding:6px 14px;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:40;flex-wrap:wrap;box-shadow:0 2px 8px rgba(28,40,70,.04)}
  nav.tabs button{background:transparent;border:none;padding:9px 16px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px}
  nav.tabs button.active{background:var(--brand);color:#fff}
  nav.tabs button:hover:not(.active){background:var(--chip);color:var(--brand)}
  main{padding:18px;max-width:1320px;margin:0 auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:17px;color:var(--brand);display:flex;align-items:center;gap:8px}
  .card h3{margin:16px 0 8px;font-size:14.5px;color:var(--brand2)}
  .card h3:first-child{margin-top:0}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .grid{display:grid;gap:12px}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
  label.fld input,label.fld select,label.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  label.fld textarea{min-height:70px;resize:vertical;line-height:1.6}
  .btn{background:var(--brand);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px}
  .btn:hover{background:var(--brand2)}
  .btn.accent{background:var(--accent)}.btn.accent:hover{filter:brightness(1.08)}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--chip)}
  .btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
  .btn.danger{background:var(--danger)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--brand);font-size:12px;font-weight:700}
  .muted{color:var(--muted)}
  .right{margin-inline-start:auto}
  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  table.tbl th,table.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
  table.tbl th{background:var(--chip);color:var(--brand);font-weight:700}
  table.tbl tr:nth-child(even) td{background:#fafbfe}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;margin:1px}
  .empty{text-align:center;color:var(--muted);padding:36px 10px}
  .empty .big{font-size:40px;opacity:.5}
  .hr{height:1px;background:var(--line);margin:14px 0}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:800;color:var(--brand)}
  .stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
  .stat.accent .n{color:var(--accent)}

  .case-card{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:9px;cursor:pointer;transition:.12s}
  .case-card:hover{border-color:var(--brand2);box-shadow:var(--shadow);transform:translateY(-1px)}
  .case-card .av{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
  .case-card .nm{font-weight:700}
  .case-card .meta{font-size:12.5px;color:var(--muted)}
  .status-badge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}

  /* step nav */
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow)}
  .steps button{flex:1;min-width:96px;background:transparent;border:none;padding:9px 8px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13px;position:relative}
  .steps button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-inline-start:5px;vertical-align:middle}
  .steps button.done .dot{background:var(--accent)}
  .steps button.active{background:var(--brand);color:#fff}
  .steps button:hover:not(.active){background:var(--chip);color:var(--brand)}

  .wb{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
  @media(max-width:1000px){.wb{grid-template-columns:1fr}}
  .catalog .group{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .catalog .group>summary{padding:10px 13px;background:var(--chip);font-weight:700;color:var(--brand);cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
  .catalog .group>summary::-webkit-details-marker{display:none}
  .catalog .cat{padding:6px 10px 10px}
  .catalog .cat .catname{font-weight:700;font-size:13px;color:var(--brand2);margin:6px 0 4px}
  .catalog .var{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:3px 0;font-size:13px;line-height:1.45}
  .catalog .var:hover{background:var(--accent-soft);border-color:var(--accent)}
  .catalog .var .vt{font-weight:700;color:var(--ink)}
  .catalog .var .vm{color:var(--muted);font-size:12px}
  .sel-sign{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .sel-sign.prominent{border-inline-start:5px solid var(--accent);background:#f6fbf9}
  .sel-sign.doubt{border-inline-start:5px solid var(--warn);background:#fff8f3}
  .sel-sign .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sel-sign .sh .cat{font-size:11px;font-weight:700;color:var(--brand2);background:var(--chip);border-radius:6px;padding:1px 8px}
  .sel-sign .sh .vr{font-weight:700}
  .sel-sign .mn{font-size:13px;color:#374151;margin:6px 0}
  .toggle{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--muted)}
  .toggle.on-acc{background:var(--accent);color:#fff;border-color:var(--accent)}
  .toggle.on-warn{background:var(--warn);color:#fff;border-color:var(--warn)}
  .sidebar .bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
  .sidebar .bar-row .lbl{width:96px;flex:none;font-weight:600}
  .sidebar .bar{flex:1;height:14px;background:var(--chip);border-radius:7px;overflow:hidden}
  .sidebar .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--accent))}
  .sidebar .bar-row .v{width:24px;text-align:center;font-weight:800;color:var(--brand)}
  .trait{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 11px;margin:3px;font-size:12.5px;font-weight:700}
  .trait small{opacity:.7;font-weight:600}
  .chipbtn{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;margin:3px;font-size:12.5px;cursor:pointer}
  .chipbtn:hover{background:var(--accent-soft);border-color:var(--accent)}

  /* checklists */
  .check{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:5px 0;background:#fff}
  .check input{margin-top:3px}
  .check.on{background:var(--warn-soft);border-color:var(--warn)}
  .check.ok{background:var(--accent-soft);border-color:var(--accent)}
  .lvl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .lvl select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;min-width:140px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--brand);color:#fff}

  /* images */
  .imgs{display:flex;gap:10px;flex-wrap:wrap}
  .imgthumb{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:150px;height:150px;background:#f4f6fb}
  .imgthumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
  .imgthumb .x{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-weight:800}
  .viewer{position:fixed;inset:0;background:rgba(15,20,35,.9);z-index:120;display:grid;place-items:center}
  .viewer img{max-width:92vw;max-height:82vh;transition:transform .15s}
  .viewer .vc{position:absolute;top:14px;left:14px;display:flex;gap:8px}

  #reportDoc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:34px 40px;max-width:840px;margin:0 auto;box-shadow:var(--shadow);line-height:1.85}
  #reportDoc h1{text-align:center;font-size:22px;color:var(--brand);margin:0 0 4px}
  #reportDoc .bsd{text-align:center;font-size:13px;color:var(--muted)}
  #reportDoc .secttl{color:var(--brand);border-bottom:2px solid var(--accent);padding-bottom:3px;margin:20px 0 7px;font-size:16px}
  #reportDoc table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  #reportDoc table th,#reportDoc table td{border:1px solid #cdd4e2;padding:6px 8px;text-align:right;vertical-align:top}
  #reportDoc table th{background:#eef2fb;color:var(--brand)}
  #reportDoc .disc{font-size:12px;color:#555;background:#f6f7fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:18px}
  .kb-search{position:sticky;top:108px;z-index:5}
  .modal-bg{position:fixed;inset:0;background:rgba(20,28,48,.45);display:grid;place-items:center;z-index:100;padding:16px}
  .modal{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff;z-index:2}
  .modal .mbody{padding:18px 20px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-weight:600;z-index:200;box-shadow:var(--shadow);opacity:0;transition:.25s}
  .toast.show{opacity:1}
  .match-good{color:var(--good);font-weight:700}.match-part{color:var(--warn);font-weight:700}.match-gap{color:var(--danger);font-weight:700}
  @media print{
    header.top,nav.tabs,#reportTools,.steps,.no-print{display:none!important}
    body{background:#fff}main{padding:0;max-width:none}
    #reportDoc{box-shadow:none;border:none;max-width:none;margin:0;padding:0}
  }
</style>
</head>
<body>
<header class="top">
  <div class="logo">✒️</div>
  <div>
    <h1>מערכת אבחון גרפולוגי</h1>
    <div class="sub" id="hdrSub">פלטפורמה מקצועית לניהול תהליך אבחון גרפולוגי מלא</div>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost sm" id="btnExport">גיבוי ↧</button>
  <button class="btn ghost sm" id="btnImport">שחזור ↥</button>
</header>

<nav class="tabs" id="tabs">
  <button data-view="dashboard" class="active">לוח בקרה</button>
  <button data-view="cases">תיקים וארכיון</button>
  <button data-view="workspace" id="tabWs" disabled>תיק פעיל</button>
  <button data-view="comparison">השוואת מועמדים</button>
  <button data-view="kb">מאגר הידע</button>
  <button data-view="settings">הגדרות</button>
</nav>

<main id="app"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" class="hidden">
<input type="file" id="imgInput" accept="image/*" multiple class="hidden">

<script>

ים, מקטלג אנשים ומוגבל בתקשורת איתם. חולשות מביכות אותו. יכולתו הארגונית טובה ותפיסתו מציאותית ופרקטית. זקוק לעמדת כוח ושליטה ונהנה להטביע את חותמו. אך אינו גמיש בדעותיו, שיפוטו נוקשה ודרישותיו מחמירות. מנסה להחיל את עקרונותיו גם על הסובבים אותו. במקרים קיצוניים הופך לפאנאטי, חסר פשרות ועריץ בעבודתו או בביתו. אצל טיפוס זה הרגש הינו צורת התפקוד הנחותה ועל כן קשה לו להבין את החשיבות שאנשים מייחסים לעולמם הרגשי. יתרה מכך, הוא אינו מודע לרגש שלו עצמו. רגישות מופרזת עשויה להביאו לידי ציניות ומרירות. במקרים קיצוניים עלולים רגשותיו המודחקים להתפרץ החוצה באלימות ובמצבי רוח בלתי רציונליים. כשהמסייעות חלשות החשיבה נוקשה עם פחות פתיחות לרעיונות ודעות השונים משלו. המקצועות המתאימים לו הם כאלו מפיקים תועלת מניתוח אנליטי ושליטה על כמות רבה של אינפורמציה, כגון: מחקר, עריכת-דין, כלכלה, עתונאות."}, {"main": "חשיבה", "attitude": "חישה", "meaning": "טיפוס פרקטי וענייני. גישתו מעשית ויעילה. ממוקד ביצירת עובדות חדשות בשטח, באמצעות כללי פעולה ברורים. שילוב של ניתוח אנליטי עם קליטה חושית המסייעת לו להתמקד בהווה ובאיסוף אינפורמציה. לדוגמא: אנשי הפקה, אדמיניסטרטורים, מנהלי עבודה. הוא זקוק לתוצאות מהירות ואין לו זמן לחוסר יעילות. מקבל החלטות במהירות ואינו חושש לגלות נוקשות כשצריך. בקרב בני טיפוס זה נמצאים אנשי עסקים, רואי חשבון, עורכי דין ואף מורים ומרצים. השתלבות במערכות מסודרות הפועלות על פי כללים ברורים מאפשרים לבני טיפוס זה השתלבות בארגונים כגון הצבא והמשטרה."}, {"main": "חשיבה", "attitude": "אינטואיציה", "meaning": "אדם הגיוני ובעל תושייה. האינטואיציה מכוונת את החשיבה אל העתיד, כלומר מאפשרת לראות ולהבין מה גלום במצבים שונים, מעבר למה שנראה בהווה. להבדיל מהחושב המוחצן + חישה, הפועל על בסיס התיאוריות המוכרות לו, הרי שטיפוס זה שואף להרחבת אופקיו עם פתיחות לרעיונות חדשים. פתיחות זו הופכת אותו לנוח יותר לבריות וסובלני למגוון רחב של דעות וגישות. בשל כך הוא מסוגל לאלתר פתרונות מתאימים לבעיות שונות. מבחינה מקצועית מוצא עצמו טיפוס זה בתחומים כמו תכנות מחשבים, עבודות מחקר והנדסה, אך גם בכיוון המופשט יותר של חקר היסטורי, פילוסופיה ופסיכולוגיה."}, {"main": "חשיבה", "attitude": "", "meaning": "טיפוס המושפע בעיקר מתיאוריות ומרעיונות מופשטים. אין לו עניין במציאות עצמה ובסביבתו והוא אדיש יותר לסביבה החיצונית והחברתית. לכן המעגל החברתי שלו מצומצם. הוא נתפס הרבה פעמים כאדם סגור וקר. אדישותו מהווה עבורו הגנה מפני העולם החיצון. הוא לא מעוניין ביישום רעיונותיו בפועל, אלא יותר בשיטה וברעיון. הוא אינו מעשי, מפתח תיאוריות מתוך רעיונותיו האישיים ואוסף עובדות כדי לבסס את השקפותיו. מצטייר כבעל חשיבה מקורית ותעוזה, משום שאינו נרתע מלבטא את רעיונותיו, גם אם הם מהפכניים או לא מקובלים. לעומת זאת, בכל נושא שאינו קשור לתחומי עיסוקו הספציפיים, הוא מגלה עניין, ידע והבנה מועטים. נתפס כשחצן אינטלקטואלי וכבעל דעות קדומות, גם כשהוא משתדל לנהוג בנימוס וקורקטיות. מתקשה להבין שאחרים פועלים אחרת ממנו. בשל כך, מגלה עניין מועט בבני אדם ואם כבר, תוך כפיית דעותיו באופן עקשני. הוא אהוד יותר על הקרובים לו ופחות על המעגל החברתי הרחב, אשר אינו מצליח לחדור אליו. אך גם במעגל החברתי הקרוב לו, הוא עשוי להתגלות כשתלטן חסר התחשבות, קשה לריצוי ובעל מזג רע. המקצועות המתאימים לו עומדים בהגדרת הפרופסור המפוזר, הבקיא, המגלה ידע רב ועסוק בפתרון בעיות מחקריות, ניסוייות, מתמטיות ופילוסופיות."}, {"main": "חשיבה", "attitude": "חישה", "meaning": "החישה כמסייעת ראשונה מוסיפה פן מציאותי לטיפוס. השימוש האקטיבי בחושים הופך אותו לריאלי ופרקטי יותר. עקב כך הוא מסוגל לקלוט את המציאות באופן מעמיק ובעין חדה. הוא מבחין היטב בפרטים (חישה,) ומנתח את משמעותם באופן יעיל ושיטתי (חשיבה) . גם כאן, הוא עשוי להיתקל במגבלות החשיבה - הצורך הכפייתי בהכרת כלל הנתונים ועיבודם לפני נקיטת עמדה ופעולה. על כן, נוטה לדחות את החלטותיו עד לרגע האחרון. כמו כן, כיוון שהרגש היא צורת התפקוד הנחותה שלו, הוא מעדיף עיסוק בפרטים ובנתונים על-פני פעילות עם אנשים. מצטיין בדרך-כלל בתחומים טכניים כגון, תעופה, נהיגה או חקלאות מתקדמת, כמו גם הנדסת מכשירים וניסוי מעבדה. אפשר למצוא אותו גם במקצועות העוסקים במספרים ונתונים – חוק, כלכלה, ראיית חשבון וכדומה. בעבודתו הוא רציני ומחויב ועושה את המוטל עליו בשקט, ביסודיות ובנאמנות."}, {"main": "חשיבה", "attitude": "אינטואיציה", "meaning": "נמשך לעיסוק במדעים עיוניים. כחשיבה מופנם, כאמור, הוא מעדיף את הרעיון על הפעולה והמימוש, אולם האינטואיציה חושפת בפניו את האפשרויות הטמונות בתיאוריה ואת האופנים השונים שבו עשוי רעיון להתפתח. חשיבתו מופשטת וממוקדת ויכולתו לצפות את תוצאות התיאוריה שלו, בשילוב מקוריותו וסקרנותו האינטלקטואלית, מסייעות לו מאוד. הוא אינו טוב בעבודת צוות, מופנם, שקט וסגור, אך נהנה לעומת זאת לבטא את רעיונותיו כשהם ממוקדים בתחום עיסוקו. הוא מעדיף לעבוד לבד, בקצב שלו, ועל פי סדרי העדיפויות שקבע בעצמו. לכן מתאים למדעים מדויקים כגון פיסיקה ומתמטיקה, אך גם למחקר בתחום המשפטים, פילוסופיה וכלכלה, ספרות והיסטוריה. זהו איש אקדמיה מובהק."}, {"main": "רגש", "attitude": "", "meaning": "טיפוס נשי בדרך-כלל. טיפוסים המגיבים בהתרגשות מוחצנת. בד\"כ דבקים במוסכמות ונמנעים מחשיבה ביקורתית. אוהבי חברה, זקוקים למסגרת ופוחדים מבדידות. כתוצאה מכך עלולים לפתח תלות. טיפוס הרגש המוחצן קובע את איכות רגשותיו בהסתמך על תפיסות חברתיות, מקובלות חברתית, והגדרתו את עצמו כחלק מהחברה בה הוא מתפקד. זהו איש המותגים – הוא בוחר את חבריו, חפציו ועיסוקו על בסיס התפיסה המקובלת במעגל ההשתייכות שלו ובהתאם למעמד החברתי של חבריו, ומיקומו ההיררכי של עיסוקם. בשל כך הוא עשוי להתעלם מחלקים פחות נעימים באישיותו ובאישיות חבריו. זהו טיפוס פעיל, משתלב ויוזם. לרוב סימפטי ומלא חן. אוירה הרמונית חשובה ביותר עבורו. מארח טוב, חבר קשוב ונאמן, סתגלן ופעיל בתיווך ופישור חברתי, לומד במהירות את המנהגים והכללים של המקום אליו הוא מזדמן. נהנה ממעורבות והשתייכות לארגונים שמזדהה עם מטרתם ומוכן להשקיע מאמץ רב בהפעלה, הנעה והשפעה. יודע להתלהב ולהלהיב אחרים. לעיתים נראה כי אינו עקבי ומשנה דעתו בהתאם לנסיבות. אולם זה מקנה לו גמישות, יכולת שכנוע והשפעה. דעת הקהל חשובה לו מאוד, ועל כן הוא מושפע מביקורת. ביקורת רעה עשויה לגרום לו לדיכאון חסר פרופורציה. הערכת אירועים ונסיבות נעשית באופן סובייקטיבי כאשר החשיבה הנחותה ממלאת תפקיד זעום בהערכה ושיפוט. אין כמעט התייחסות לעובדות ונתונים אלא לתחושות. חשיבה מופשטת רחוקה ממנו עוד יותר ולכן תפיסתו לעיתים ילדותית ולא מפותחת. דפוס החשיבה, ככל שהוא יותר מודחק, כך הוא מקבל צורה יותר פרימיטיבית, סטריאוטיפית וצינית. הוא מצטיין בעיסוקים עם אנשים, כגון, דיפלומטיה, הוראה ותקשורת, מכירות ויחסי ציבור. כשהמסייעות חלשות מדי ולא מאזנות את הרגש הוא מקבל אפיון היסטרי. דיבורו צעקני, דרמטי ומצבי רוחו מתחלפים."}, {"main": "רגש", "attitude": "חישה", "meaning": "טיפוס מציאותי ופרקטי. החושים מסייעים לו בקליטת המציאות. יכול להתאים לעבודה שגרתית ומגוונת כאחד. בכל מקרה הוא מעדיף עבודה בחברת אנשים. ביצועיסט, מסודר ודייקן. פועל על פי כללים ועקרונות מקובלים. יכול להתאים למקצועות כמו: אירוח, מלונאות, מינהל ציבורי, סוכן נסיעות ותיווך נדל\"ן. מודעות חברתית וערנותו לקיפוח חברתי מכוונים אותו לפעילות קהילתית כגון, עבודה סוציאלית, מקצועות סיעודיים, חינוך מיוחד וכו.' הסתמכותו על החושים ועיבוד הנתונים באופן רגשי, גורמים לו להפנים טוב יותר גירויים חברתיים – רגשיים."}, {"main": "רגש", "attitude": "אינטואיציה", "meaning": "בעל כושר מילולי מפותח, הבנה והבעת דקויות. סקרנותו גבוהה והוא פתוח מחשבתית ורעיונית. יכולת שכנוע וכושר ביטוי סוחף מאפשרים עיסוק בתחומים הדורשים עמידה מול קהל וכן, פסיכולוגיה ויעוץ חינוכי בשל התובנות שמספקת האינטואיציה והגישה האמפתית הרגשית. מתאים גם למקצועות פרה-רפואיים כמו טיפול סיעודי, דיאטטיקה ופיזיותרפיה. גרפולוגים רבים משתייכים לטיפוס זה."}, {"main": "רגש", "attitude": "", "meaning": "מושפע מהאמוציות שלו, מעולמו הפנימי, בעל דמיון מפותח. פחות מושפע מהעולם החיצוני והמציאות. לעיתים נמנע ממגע, אינו מתקרב לזולת, עלול להיתפס בטעות כחסר רגש. שקט ומאופק, שונא גילויים חיצוניים של רגש. נמנים ביניהם הרבה מוסיקאים ואומנים. הסתגלותו איטית ומאופקת, נראה הרבה פעמים קר, מתנשא, מלנכולי ומסויג. השיפוט שלו סובייקטיבי הוא מופנם ומתקשה לשתף. אינו נוטה לשיחות נפש ומסתייג מחשיפת רגשותיו. את עצמו, כמו את העולם החיצוני, הוא שופט על פי ערכים ואידיאלים נוקשים ומחמירים ודרישותיו בהתאם. מפגין כלפי חוץ אדישות שמסווה את הסערות המתחוללות מתחת לפני השטח. באופן פרדוקסאלי, ככל שנוצר בהם ריגוש רב יותר, כך הם מפגינים יותר אדישות וקור כלפי חוץ. גם האמונה בדו קיום הרמוני ורגוע, המאפיינת אותם, אינה מסייעת להם להיפתח או להפגין נחמדות כלפי זרים. כמופנמים אחרים הם נאמנים לאלו שעברו את סף הביקורת הנוקשה שלהם ומוכנים למעשי הקרבה וגבורה בעבורם (אך בעלבונם יהפכו את אותן עוצמות לכוח נוקם ואכזרי.) אינם מנסים לשנות את תדמיתם, ולרוב, משלימים עם היותם בלתי מובנים ולא פופולאריים חברתית. כשהמסייעות חלשות עשוי להיות הרגש המופנם נוקמני ונוטר טינה, אכזרי וטרגי."}, {"main": "רגש", "attitude": "חישה", "meaning": "החישה היא האמצעי המגשר והמחבר בין המופנמות וחומרת הערכים הרגשיים לבין העולם החיצון. היא הופכת אותו לנוח יותר לבריות וקרוב יותר לאנשים. החישה אף מסייעת לו ליהנות, להתאים עצמו לסביבה ולהתקרב פיזית להרמוניה אותה הוא מחפש. צירוף זה מוביל אותם לאהבת אסטטיקה, אמנות וחיות ולעיסוק בחומר. בן טיפוס זה, מחפש את שביל הזהב שבין הסדר והכללים החיוניים לתפקודו ובין רגישותו, אהבת היופי ויכולת האבחנה בפרטי פרטים. הוא נאמן וזקוק למעורבות ובעל זיכרון טוב. המקצועות המתאימים לו יהיו אלו המשלבים בין יכולותיו וצרכיו, כגון, אדריכלות, צורפות או נגרות, וגם ספרנות, הנהלת חשבונות ותפקידים אחרים הדורשים סדר וארגון. כמו-כן, מקצועות סיעודיים, רפואיים, קלינאי תקשורת ומרפאים אלטרנטיביים."}, {"main": "רגש", "attitude": "אינטואיציה", "meaning": "טיפוס זה הוא סקרן ועצמאי. הוא נמשך ללימודים ועצמאי בפרויקטים שלוקח על עצמו (גם אם לא תמיד יעריך נכונה את יכולותיו – סובייקטיבי כאמור.) השילוב של אינטואיציה ורגש עלול לגרום להזנחת החלק החומרי של החיים. בין טיפוסים אלו נמצא יועצים, אומנים, מורים ועיתונאים וכן, פסיכולוגים, עובדי שיקום וחוקרים בתחומי אומנות מדעי החברה."}, {"main": "חישה", "attitude": "", "meaning": "מטרת חייו היא הנאה. הוא נוח לבריות, בעל טעם טוב, אינו נצמד לאידיאלים, אוהב יופי, מסב את תשומת לבו ללבושו ולמראהו החיצוני, נהנה מאוכל, פרקטי וביצועיסט. הוא ריאליסט קיצוני, לא נוטה לעצב השקפות או לעסוק בחוויות רגשיות לעומק. העולם הפנימי נראה לו חסר עניין. הוא מעשי, עובדתי ומציאותי. גם סקרן, ער ומתעניין בסביבתו. חושיו מספקים לו שלל אינפורמציה ובשל המוחצנות שלו הוא מעניק חשיבות לדברים הסובבים אותו. הוא מצטיין בפתרון בעיות ובתפקוד תחת מצבי לחץ, בהתמודדות עם משימות קונקרטיות של \"כאן ועכשיו.\" מתחמק, כמו כל מוחצן, מלהיכנס למניעים ולסיבות פנימיים ונפשיים. הוא מתענג על מה שקולטים חושיו – אוכל, מוסיקה, ריקוד, אסטטיקה. אופן ורמת הנהנתנות שלו תלויים ברמתו האישית. לרוב, הוא פועל על בסיס מסורת או כללים חברתיים מקובלים (מוחצן) שכן הוא נהנה מהשתייכות ומוכן להתאים את עצמו תוך יצירת אוירה חברתית, נעימה ונוחה. ערנותו לגירויים הסובבים אותו והעניין שהוא מגלה גורמים לו להעריך עצמו כרגיש (גם אם לא תמיד זו האמת) למרות התבוננותו הפנימית המוגבלת. כיוון שצורת התפקוד הנחותה אצלו היא האינטואיציה, הוא לא קשוב לתובנות שצצות או הארות, אלא מושפע מהתפרצויות בלתי רצוניות של האינטואיציה שיכולות להתבטא בחשדות לא מוסברים או בנהייה אחרי כתות מוזרות. כשהוא סובל מבעיה נפשית הוא יתעקש להעניק לה הסבר פיזיולוגי. הוא סולד מחיפוש אחר מניעים שקשורים בעולם הרגשי והלתת-מודע. ללא מסייעות עשוי החישה המוחצן להיות גס רוח וחסר עידון, נהנתן באופן מוגזם, אינטרסנט ואופורטוניסט."}, {"main": "חישה", "attitude": "חשיבה", "meaning": "איש שטח מהיר החלטה, האוסף כמות נכבדה של נתונים (חישה) ומעבד אותם סיסטמתית ואובייקטיבית (חשיבה) תוך התחשבות בעקרונות וכללים הנוגעים לעניין (מוחצנות.) הוא נהנה מחברת אנשים ומעדיף עבודה בצוות. נמצא רבים מבני טיפוס זה בעבודות הנדסה, בילוש, משפטים ושמאות. משיכה ליופי ונהנתנות יכולה להוביל אותו למקצועות כגון מלונאות, מסעדנות, תיירות ונופש וכן, ייצור מזון ומשקאות, בניה, צורפות ואומנויות פלסטיות אחרות."}, {"main": "חישה", "attitude": "רגש", "meaning": "טיפוס המאופיין כאדם סימפטי, סובלני, פתוח ונוח וגם פעיל ומתעניין. לרוב אמפתי ורגיש. מגיע להישגים בעבודות בהן יש להתבסס על עובדות קונקרטיות, מעשיות ושימוש בחכמת חיים תוך פעלתנות מרובה והסתגלות גמישה. אמנים, שחקנים, וספורטאים נמנים על טיפוס זה, כשהצד הרגשי מפותח יותר, נמצא אותם גם בתחומי ההוראה, הרפואה, השיקום והתקשורת. הם ניחנים בזיכרון טוב ואבחנה לפרטים דקים ועל כן מתאימים גם למקצועות כמו מחקר לשוני ועריכה, הנה\"ח וגם מכונאות. כאשר הפן האסטטי מפותח הם נוטים גם לתחומי היופי והעיצוב וגם קונדיטורים, שפים ובעלי מסעדות."}, {"main": "חישה", "attitude": "", "meaning": "טיפוס זה קולט אמנם את העולם החיצוני בחושיו, יותר מטיפוסי הרגש והחשיבה המופנמים, אך מפרש אותו בהתאם לתחושותיו ורגשותיו. זהו אדם המעוניין בחושניות עצמה, מאוהב באהבה, ועם זאת פגיע מאוד וילדותי. יש ביניהם אנשים אניני טעם ורומנטיים, והתפיסה החושית שלהם מעצימה את רגישותם באמצעות ערנותם לצלילים, לטעמים, ליופי. אירועים וגירויים מטביעים את חותמם בבני הטיפוס הזה, באמצעות תגובה רגשית פנימית ובחיי דמיון פעילים, ופרשנותו אישית וייחודית. הוא אחראי ויסודי. מקבל החלטותיו על-סמך איסוף נתונים מדוקדק. מתחייב, נחוש וממוקד ושומר על יציבות ועקביות בפעילותו. זקוק להגדרות ברורות ובהירות ושומר על נהלים, תוך העדפת שיגרה ושמרנות. אלתורים ומפגשים עם חומר חדש או אנשים זרים גורמים לו אי נוחות מרובה וגם אם כלפי חוץ הוא נראה מרוסן ושקט, מתחת לפני השטח הוא נסער . שאיפה לשלמות, ביקורתיות רבה וחוסר גמישות גורמים לו לעיתים קרובות לתסכול וחוסר שביעות רצון. הוא נע בין רצון להסתגלות ונטייה להסתגרות וכתוצאה מכך, גוברת תחושת הבלבול שלו. חישה מופנמת שאינה מאוזנת בגישות מסייעות, גורמת לדיכאוניות ואפאטיות כמו גם להיפוכונדרייה ופסימיות. הפרפקציוניזם שלו עלול לשתק אותו. הסתירה בין עולמו הפנימי לעולם החיצון מתסכלת אותו והוא עלול לפתח אנטגוניזם וחשדנות. כשהוא יוצר קשר, הוא נאמן ומתמיד, בגלל המודעות שלו לרף הגבוה שהוא מציב ולקושי שלו לחוש שביעות רצון. את הפסיביות שלו הוא חייב לאזן באמצעות צורות תפקוד מסייעות אחרות המאפשרות מגע עם העולם החיצוני תוך ביטוי עצמי ואיטראקציה עם הסובבים אותו."}, {"main": "חישה", "attitude": "חשיבה", "meaning": "טיפוס מסודר, מאורגן, רציני ושקט. הוא מציב לעצמו מטרות ופועל להשגתן באופן שיטתי ומעמיק. קולט אינפורמציה רבה (חישה) ומעבד אותה באופן אובייקטיבי ושיטתי (חשיבה) תוך הפעלת ביקורת וצעידה בנתיב אותו בחר. טיפוס זה מתאים לעבודות כגון בקרת איכות וניתוח יעילות אולם קיים קושי בתכנון לטווח ארוך בגלל שהחישה מכתיבה התייחסות לקונקרטי והעכשווי. את הביקורת והרציונאליות שלו, הוא מנסה להפעיל גם על אחרים ובשל התמדה שהוא מגלה, הוא מתאים גם לעמדות ניהול ופיקוח. נטייתו לארגון וסדר מאפשרת לו להצליח במקצועות כמו חשבונאות, בנקאות, ביטוח, חשמל\\אלקטרוניקה ועבודות קטלוג וארכיון. גם במקצועות הבילוש, השיטור וקצין מבחן הוא יכול להשתלב. ארכיאולוגיה, גיאולוגיה, ביולוגיה ורפואה, גם הם יתאימו לחלק מבני טיפוס זה."}, {"main": "חישה", "attitude": "רגש", "meaning": "אדם מצפוני ואחראי, נאמן, מסור ומתחשב בזולת. בן טיפוס זה מתעניין בתחום החברתי ומתחשב ברגשותיהם של הסובבים אותו.הוא ניחן ברגישות וחוש ליופי, צורה, טעם וצבע ובעבודתו הוא משלב בין רגישותו זו וגישתו האכפתית שלו. הרגש גורם לעידון הטעם. המופנמות מכוונת לשיטה ולסדר, לביצוע מדויק ולשליטה עצמית. גם כאן ניכר זיכרון טוב בנוסף לדיוק, לארגון ולאהבת האסתטיקה ועל כן המקצועות המתאימים לו מגוונים וכוללים: קוסמטיקה, טעימת יין וגבינות, ספרנות, אומנות (צילום, ציור, פיסול, אופנה, איפור ועיצוב) וגם סיעוד, חינוך, רפואת משפחה, פיזיותרפיה וכו.'"}, {"main": "אינטואיציה", "attitude": "", "meaning": "אדם המגלה עניין באנשים ובמצבים חדשים. מזהה הזדמנויות. בעל אמות מוסר אישיות, פחות מתעניין במה חושבים ומרגישים אחרים. מתעניין ברעיונות ובתיאוריות, המצאות שהצד היישומי שלהן חלש. אנשים תופסים אותו כאופורטוניסט, הרפתקן, דמגוג ושכלתן. מעדיף גיוון ושינויים על פני עקביות. נמשך לצד הרעיוני ופחות לביצועי. יש לו יותר ידידים מחברים והוא חושב על המחר ולא על האתמול. הוא פועל על-פי הארות רגעיות, זקוק לגירויים חדשים ולשדות לא חרושים בהם יוכל לפעול באופן חופשי, הייחודי לו. הוא מסתגל היטב כי אינו נצמד לכללים ועקרונות אישיים נוקשים. הממוסד והקבוע מרתיעים אותו ועל כן, הוא נדמה לעיתים כחסר כנות ויושר כיוון שהוא מעדיף שלא להתחייב באמירות חד משמעיות. ספונטאני וישיר ומתפקד לפי קודים מוסריים אותם קבע לעצמו. כיוון שהלא ידוע מעניין אותו יותר מהמוכר, הוא נוטה להמר ולהקריב את ההווה למען העתיד (או למען הסיכויים הטמונים בעתיד) על כן הוא נתפס כהרפתקן. התנודיות המוטבעת בו מאפשרת לו סובלנות רבה גם לאנשים אחרים וגישות שונות. אך בכל זאת הוא נתפס לעיתים כאגוצנטרי כי אינו מתפקד בעקביות ולפי הכללים הנהוגים, אלא מתאים לעצמו קודים ייחודיים ואישיים. כמוחצן, הוא נוהה אחרי גירויים חיצוניים אך רק כאשר יש בהם ערך סובייקטיבי עבורו. הוא אינו יסודי במיוחד בטיפול בפרטים ואינו מנתב את חייו באמצעות משמעת או כוח רצון. כאשר הוא טועה, הוא מצליח להיחלץ מאי-נעימות באמצעות תמרון גמיש וערנות זריזה. הוא נהנה מקשרים חדשים אך מתקשה להבין ולהתחשב בצורכי עמיתיו (סובלני אך לא סבלני.) מנתב את בחירותיו החברתיות בהתאם לאינטרסים האישיים שלו ולעיתים תוך התעלמות מרגשות והתנהגויות הסובבים אותו. לרוב, המקור לחוסר השקט המאפיין אותו הוא החשש שלו שלא תמיד האינטואיציות שלו נכונות ומשרתות אותו היטב."}, {"main": "אינטואיציה", "attitude": "חשיבה", "meaning": "הרגש מכניס קצת סדר ושיטה לתנודיות המאפיינת את הטיפוס אינטואיטיבי. הפתיחות לאפשרויות ולהתרחשויות מנותבת באמצעות אמות מידה רגשיות התורמות לשיפוט ולדרוג ערכי. אך גם כאן בולט הצורך בגיוון ובחידוש על פני התמדה ועקביות. שילוב זה מאפשר הצלחה בתחומים בין אישיים הדורשים גמישות ומהירות תגובה כגון: דיפלומטיה, יחצנו\"ת, פרסום, תקשורת ומכירות. יכולותיו הגבוהות בעבודה עם אנשים יסייעו לו גם במקצועות ההוראה, פסיכולוגיה, עיתונאות ופרשנות פוליטית, והאפשרות להשתמש בתובנות לא-מודעות מסייעת בשטחי הפיתוח והמחקר. היכלות להיות קשוב לתכנים לא-מודעים מאפשרת גם לעסוק בתחומים אמנותיים, ספרות ומוזיקה. בכל מקרה, חשובה לבני הטיפוס הזה האפשרות לשינוי, גיוון והתפתחות אישית במסגרת העבודה."}, {"main": "אינטואיציה", "attitude": "רגש", "meaning": "נמרץ ומתלהב, מקורי ויוזם ומתעניין במגוון נושאים. החשיבה משמשת לו לניתוח וארגון שפע האפשרויות שפותחת בפניו האינטואיציה. בעיות מעוררות אותו לפעולה והוא מגלה תושייה ויכולת יוצאת דופן במציאת פתרונות חדשניים. הוא שואב את תחושת היכולת והכוח שלו מהצלחותיו ומן האתגרים הניצבים בפניו, אולם, גם מאבד עניין בקלות ובמהירות, משתעמם ונוטה לזנוח את הבעיה שנפתרה והאתגר שמומש. הביקורת הבונה והניתוח האובייקטיבי שמעניקה החשיבה והתובנות שמספקת האינטואיציה מכוונים את בן הטיפוס הזה לעיסוק בהמצאות, שיפורים ופיתוחים טכנולוגיים ומכניים. האתגרים הקוסמים להם מניעים אותם לעסוק ביזמות עסקית, שיווק וקידום מכירות ויצליחו גם בעיתונאות, תחקירנות, דוברות ותרגום סימולטני."}, {"main": "אינטואיציה", "attitude": "", "meaning": "טיפוס זה \"תלוש\" מהמציאות היום יומית. אלו הם אנשי חזון ואומנים החיים, פועלים ויוצרים מתוך עולמם הפנימי. לא איכפת להם אם מבינים אותם או לא. בעלי דמיון מפותח, נתפסים הרבה פעמים כמוזרים ולא \"מחוברים.\" בחייו משמשים מציאות ודמיון, פנטזיות ומיסטיקה. הוא הקרוב מכל הטיפוסים אל הלא מודע הקולקטיבי ושואב משם רעיונות ותכנים באופן אינטנסיבי. תגליות, חזיונות ונבואות נראים לו טבעיים ומציאותיים. הוא קשוב מאוד לעולמו הפנימי (כמו כל מופנם) ועולמו זה עשיר מאוד בשל האינטואיציה המאפיינת אותו. משיכתו למיסטיקה, אם כך, מובנת ועשויה לבוא לידי ביטוי ביצירה אומנותית לסוגיה השונים או בעיסוק מוגבר בנסתר ע\"י השתייכות לקבוצות שעניינן בכך כגון, כתות ופולחנים. בכל מקרה, אם אינו משחרר תכנים פנימיים באמצעות יצירה או בדרכים אחרות, חש תסכול רב. זהו הפער שהוא חש בין מופנמותו מחד, לבין הצורך שלו בקרבת אנשים ושיתופם כדי שיסייעו לו בהכרת ערך רעיונותיו, מאידך. הוא מעריך את ההתרחשויות סביבו על בסיס התרשמותו ועוצמת התחושות שמעורר בו האובייקט, ופחות על סמך חשיבותו האובייקטיבית. הוא נמשך לאירועים המעוררים בו רבדים פנימיים באישיותו, הקשורים דמיון ובפנטזיה. לרוב טיפוס זה מאוזן על-ידי אחד מצורות התפקוד המשניות כגון הרגש והחשיבה ולכן אינו קיצוני כל-כך ומצליח לתקשר ולהתחבר למציאות היום-יומית."}, {"main": "אינטואיציה", "attitude": "חשיבה", "meaning": "טיפוס זה מתאפיין בעצמאות, חדשנות, עקשנות ומעש רב. הוא אינו כבול למוסכמות חברתיות או לדעות המקובלות. מכיר ביכולותיו יוצאות הדופן וברעיונותיו המיוחדים לצד שאיפתו לעשייה, לפתרון בעיות ולהתמודדות עם אתגרים. הוא מעריך כשרון ויכולת אצל אחרים, גם אם בגישתו הוא מסויג וסגור. קל לו להתחבר לרעיון של אדם אחר, הרבה יותר מאשר לאדם עצמו. לכן מתאים לו לעסוק בפילוסופיה, משפטנות ותיאולוגיה. ממציא ומפתח בתחומים שונים כמו פיסיקה, אלקטרוניקה ומחשבים וגם מתמטיקה וביולוגיה.הוא ניחן באורך רוח, התמדה והעמקה."}, {"main": "אינטואיציה", "attitude": "רגש", "meaning": "מצפוני ומוסרי ובעל עקרונות ברורים ומעורבות רגשית. עצמאי ואינדיבידואליסט אך לא שתלטן משום שהרגש גורם לחברותיות, לצורך בהרמוניה ומגע אנושי. הוא עשוי להיות יוצר ומחדש בתחום האינטלקטואלי ולשלב נכון את שיפוטו הרגשי עם הארותיו האינטואיטיביות. מצליח מבחינה חברתית משום שבנוסף לצורך שלו באנשים, הוא בעל אינטואיציה מפותחת ומאבחן בחדות מצבי רוח ואופני התנהגות. כיוון שכך, נמצא בין בני טיפוס זה פסיכולוגים, יועצים, רופאים ועובדים סוציאליים ומורים בתחומים שונים. הוא מסוגל לסחוף אחריו ולהדביק אחרים בהתלהבותו הרעיונית. מוסריותו הגבוהה ועקרונותיו, בשילוב יכולת השכנוע שלו, מסייעים לו להנהיג ולתפקד היטב בתפקידים ציבוריים וקהילתיים. חשוב לציין שתחומי האומנות כובשים את רובם של בני טיפוס זה ובאמצעותם הם מצליחים לתעל את כישוריהם, נושאי העניין שלהם חדשנותם ויצירתיותם."}], "odemList": ["א. נירפה", "ב. אינטגרטיבי",   try{const o=JSON.parse(localStorage.getItem('grapho_db_v1'));if(o&&o.cases){o.settings=Object.assign(defDB().settings,o.settings||{});return o;}}catch(e){}

function ensure(c){
  if(!c.analysis)c.analysis={};
  const a=c.analysis;
  a.signs=a.signs||[];a.jung=a.jung||{};a.odem=a.odem||{dominant:'',sec:''};
  a.riasec=a.riasec||{R:0,I:0,A:0,S:0,E:0,C:0};a.profile=a.profile||{};a.redflags=a.redflags||{};a.report=a.report||{};

const STEPS=[['details','פרטים ואתיקה'],['impression','התרשמות'],['images','כתב יד'],['signs','סימנים'],['ai','ניתוח AI 🤖'],['occupational','תעסוקה'],['redflags','דגלים אדומים'],['typology','טיפולוגיה'],['report','דוח']];
function stepDone(c,s){const a=ensure(c);switch(s){
  case'details':return!!(c.name&&c.purpose);
  case'impression':return Object.values(c.impression||{}).some(v=>v);
  case'images':return(c.images||[]).length>0;
  case'signs':return a.signs.length>0;
  case'ai':return!!a.ai;
  case'occupational':return Object.keys(a.profile||{}).some(k=>a.profile[k])||Object.values(a.riasec).some(v=>v>0);
  case'redflags':return Object.keys(c.analysis.redflags||{}).length>0;
  case'typology':return!!(a.jung.fn||a.odem.dominant);
  case'report':return!!(a.report&&(a.report.paragraph||a.report.sections));
  default:return false;}}
function viewWorkspace(){
  const c=curCase();if(!c)return viewCases();ensure(c);
  const bar=`<div class="steps">${STEPS.map(([k,l])=>`<button data-step="${k}" class="${caseStep===k?'active':''} ${stepDone(c,k)?'done':''}">${l}<span class="dot"></span></button>`).join('')}</div>`;

  const body={details:stepDetails,impression:stepImpression,images:stepImages,signs:stepSigns,ai:stepAi,occupational:stepOccupational,redflags:stepRedFlags,typology:stepTypology,report:stepReport}[caseStep](c);
  return back+bar+body;
}

function openViewer(src){
  let rot=0,sc=1;const v=document.createElement('div');v.className='viewer';
  v.innerHTML=`<div class="vc"><button class="btn sm">סובב ⟳</button><button class="btn sm">זום +</button><button class="btn sm">זום −</button><button class="btn danger sm">סגור ✕</button></div><img src="${src}">`;
  document.body.appendChild(v);const img=v.querySelector('img');
  const b=v.querySelectorAll('button');
  b[0].onclick=()=>{rot+=90;img.style.transform=`rotate(${rot}deg) scale(${sc})`;};
  b[1].onclick=()=>{sc=Math.min(4,sc+.25);img.style.transform=`rotate(${rot}deg) scale(${sc})`;};
  b[2].onclick=()=>{sc=Math.max(.5,sc-.25);img.style.transform=`rotate(${rot}deg) scale(${sc})`;};
  b[3].onclick=()=>v.remove();
  v.addEventListener('click',e=>{if(e.target===v)v.remove();});
}
function handleImages(files){
  const c=curCase();ensure(c);let pending=files.length;
  [...files].forEach(file=>{
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{
      const max=1200;let w=im.width,h=im.height;if(w>max){h=h*max/w;w=max;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);
      c.images.push(cv.toDataURL('image/jpeg',0.72));if(--pending===0){saveDB();render();toast('נוספו תמונות');}
    };im.src=rd.result;};
    rd.readAsDataURL(file);
  });
}

function renderCatalog(q){const box=$('#catalog');if(!box)return;q=(q||'').trim();

function addSign(idx){const s=KB.signs[idx];if(!s)return;const c=curCase(),a=ensure(c);
  a.signs.push({cat:s.cat,variant:s.variant,meaning:s.meaning,appearance:s.appearance,odem:s.odem||[],prominent:false,doubt:false,intensity:'בינונית',freq:'חוזר',certainty:'בינונית',note:''});

      <span class="muted">שכיחות</span><select data-meta="freq" data-i="${i}" style="padding:2px 5px;border:1px solid var(--line);border-radius:6px">${['חד פעמי','חוזר','דומיננטי'].map(o=>`<option ${s.freq===o?'selected':''}>${o}</option>`).join('')}</select>

const STOP=new Set(['של','על','אל','עם','או','גם','כי','אך','אם','לא','אין','יש','זה','זו','את','כל','כמו','אבל','מאוד','יותר','פחות','בין','לבין','תוך','לכדי','עד','ללא','ועד','אצל','לפי','כדי','מתוך','בעת','הוא','היא','הם','הן','אדם','הכותב','מבטא','מבטאת','מעיד','מעידה','מורה','ביטוי','לעיתים','ואף','וכן','כן','אלו','אלה','כאן','בו','בה','בכך','דבר','דברים','עצמו','עצמה','אותו','אותה','מה','שלא','וגם','כגון','בעיקר','אינו','אינה','להיות','יכול','יכולה','יכולת']);
function tokens(t){return(t||'').replace(/\([^)]*\)/g,' ').replace(/[^א-ת\s]/g,' ').split(/\s+/).filter(w=>w.length>=3&&!STOP.has(w));}
const CONFLICT_PAIRS=[['זהירות','העזה'],['שליטה','אימפולסיב'],['סדר','פרוע'],['רגיש','אגרסיב'],['פתיחות','סגור'],['מעצורים','חופשי'],['ביטחון','נחיתות'],['יציבות','חוסר יציבות']];
function renderCrossRef(){const c=curCase(),a=ensure(c);
  const tally={};KB.odemList.forEach(o=>tally[o]=0);a.signs.forEach(s=>(s.odem||[]).forEach(o=>{tally[o]=(tally[o]||0)+1;}));
  const ranked=Object.entries(tally).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...ranked.map(r=>r[1]));
  const ot=$('#odemTally');if(ot)ot.innerHTML=ranked.length?ranked.map(([k,v])=>`<div class="bar-row"><span class="lbl">${esc(k.replace(/^[א-ת]\.\s*/,''))}</span><div class="bar"><span style="width:${Math.round(v/max*100)}%"></span></div><span class="v">${v}</span></div>`).join(''):'<div class="muted" style="font-size:12.5px">בחר סימנים המקושרים לאודם</div>';
  const freq={};a.signs.forEach(s=>{const seen=new Set();tokens(s.meaning).forEach(w=>{if(seen.has(w))return;seen.add(w);freq[w]=(freq[w]||0)+1;});});
  const top=Object.entries(freq).filter(([w,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,14);
  const tr=$('#traits');if(tr)tr.innerHTML=top.length?top.map(([w,n])=>`<span class="trait">${esc(w)} <small>×${n}</small></span>`).join(''):'<div class="muted" style="font-size:12.5px">תכונות שחוזרות ב-2+ סימנים</div>';
  // conflicts
  const allText=a.signs.map(s=>s.meaning||'').join(' ');const found=[];
  CONFLICT_PAIRS.forEach(([x,y])=>{if(allText.includes(x)&&allText.includes(y))found.push([x,y]);});
  // same category positive+negative
  const byCat={};a.signs.forEach(s=>{(byCat[s.cat]=byCat[s.cat]||[]).push(s.variant||'');});
  Object.entries(byCat).forEach(([cat,vs])=>{const j=vs.join(' ');if((j.includes('חיובי')&&j.includes('שלילי')))found.push(['חיובי','שלילי','('+cat+')']);});
  const doubts=a.signs.filter(s=>s.doubt).length;
  const cf=$('#conflicts');if(cf)cf.innerHTML=(found.length||doubts)?
    `${found.map(p=>`<div style="font-size:12.5px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:7px 9px;margin:4px 0">⚠️ מתח בין <b>${esc(p[0])}</b> ל-<b>${esc(p[1])}</b> ${p[2]?esc(p[2]):''} — שקול: קונפליקט פנימי? פער חוץ-פנים? עקבי או נקודתי?</div>`).join('')}${doubts?`<div style="font-size:12.5px;color:var(--warn);margin-top:4px">${doubts} סימנים מסומנים לבירור.</div>`:''}`
    :'<div class="muted" style="font-size:12.5px">לא זוהו סתירות בולטות</div>';
}

const LVLN={'נמוך':1,'בינוני':2,'גבוה':3};
function renderMatch(c){const a=ensure(c),mt=$('#matchTable');if(!mt)return;const req=c.job.req||{};
  const rows=OCC_AXES.filter(ax=>req[ax]||a.profile[ax]).map(ax=>{

function autoProfile(c){const a=ensure(c);
  // heuristic: map recurring traits keywords to axes
  const text=a.signs.map(s=>s.meaning||'').join(' ');
  const KMAP={'סדר וארגון':['ארגון','סדר','תכנון','שיטתי'],'אחריות':['אחריות','חובה','מחויב','אמינ'],'יוזמה':['יוזמה','יזם','דחף','פעלת'],'התמדה':['התמד','עקבי','דבק','סבלן'],'עבודה תחת לחץ':['לחץ','עמיד','שליטה עצמית'],'עצמאות':['עצמא','עצמאי','אינדיבידואל'],'עבודה בצוות':['צוות','שיתוף','חבר'],'תקשורת בין-אישית':['תקשורת','חברת','הבעה','דיפלומט'],'יכולת שירות':['שירות','נתינה','הכל','רגיש'],'יכולת ניהול':['ניהול','מנהיג','שליט','הובל'],'חשיבה אנליטית':['אנליט','ניתוח','חקרני','הגיון','שכלתנ'],'חשיבה מעשית':['מעשי','פרקטי','מציאות','תכליתי'],'יצירתיות':['יצירת','מקורי','דמיון','מעוף','אינטואיצ'],'גמישות':['גמיש','הסתגל','תמרון'],'דיוק':['דיוק','דייקנ','קפדנ','יסודי'],'קבלת סמכות':['מרות','סמכות','משמעת','כיבוד'],'יציבות רגשית':['יציב','איזון','רגוע','שקט'],'אמינות וזהירות':['אמינ','זהיר','כנות','מצפונ']};
  OCC_AXES.forEach(ax=>{let hits=0;(KMAP[ax]||[]).forEach(k=>{if(text.includes(k))hits++;});if(hits>=2)a.profile[ax]='גבוה';else if(hits===1&&!a.profile[ax])a.profile[ax]='בינוני';});
  saveDB();render();toast('הוצע פרופיל — בדוק וכוון ידנית');
}
function suggestProf(c){const a=ensure(c);const out=$('#profSuggest');if(!out)return;

  const bank=DB.settings.profBank||DEFAULT_PROF_BANK;
  const scored=bank.map(b=>{let sc=0;(b.axes||[]).forEach(ax=>{if(highAxes.includes(ax))sc+=2;});b.traits.split(/[,،]/).forEach(t=>{t=t.trim();if(t&&traitText.includes(t.slice(0,3)))sc+=1;});return{b,sc};}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  const code=hollandCode(a.riasec);const hp=code.split('').map(k=>RIASEC.find(r=>r.k===k)).map(r=>r.prof);

  out.querySelector('[data-act="profToReport"]').addEventListener('click',()=>{
    const list=scored.map(x=>x.b.prof).join('; ')+(hp.length?('; '+hp.join('; ')):'');
    a.report.professions=(a.report.professions?a.report.professions+'\n':'')+list;saveDB();toast('נוסף לשדה המקצועות בדוח');});
}

function aspectParagraph(c,asp){const a=ensure(c);const items=a.signs.filter(s=>aspectOf(s.cat)===asp&&s.meaning);
  if(!items.length)return'';const pref=(items.filter(s=>s.prominent).length?items.filter(s=>s.prominent):items);
  return pref.map(s=>s.meaning.replace(/\s*\.?\s*$/,'')).join('; ')+'.';}
function buildDraft(c){const a=ensure(c);const prom=a.signs.filter(s=>s.prominent&&s.meaning);
  const base=(prom.length?prom:a.signs.filter(s=>s.meaning)).map(s=>s.meaning.replace(/\s*\.?\s*$/,''));
  return base.length?('מפענוח כתב היד ניכר כי '+base.join('; ')+'.'):'';}

/* ============================================================
   AI ANALYSIS (שלב ה' באפיון) — ניתוח כתב יד אוטומטי ע"י Claude
   קורא ישירות ל-Claude Messages API מהדפדפן (ראייה), במקביל לאבחון הידני.

const AI_MODEL='claude-opus-4-8';
const AI_SCHEMA={type:'object',additionalProperties:false,
  properties:{
    impression:{type:'string',description:'התרשמות כללית מהכתב'},
    prominentSigns:{type:'array',items:{type:'object',additionalProperties:false,properties:{category:{type:'string'},sign:{type:'string'},meaning:{type:'string'}},required:['category','sign','meaning']}},
    aspectFunction:{type:'string',description:'היבט חשיבתי-תפקודי'},
    aspectSocial:{type:'string',description:'היבט חברתי'},
    aspectPersonal:{type:'string',description:'היבט אישי'},
    strengths:{type:'string'},blocks:{type:'string'},
    jung:{type:'string',description:'הערכת טיפוס יונג'},
    odem:{type:'string',description:'הערכת טיפוס אודם'},
    occupational:{type:'string',description:'כיווני תעסוקה מומלצים'},
    redFlags:{type:'array',items:{type:'string'}},
    caveats:{type:'string',description:'הסתייגויות ונקודות לבירור'}},
  required:['impression','prominentSigns','aspectFunction','aspectSocial','aspectPersonal','strengths','blocks','jung','odem','occupational','redFlags','caveats']};

function buildAiRequest(c){
  const key=(DB.settings.apiKey||'').trim();
  const cats=KB.groups.map(g=>g.name+': '+g.cats.join(', ')).join('\n');
  const odem=KB.odemList.map(o=>o+' — '+(KB.odemDesc[o]||'')).join('\n');
  const sys=`אתה עוזר מקצועי לגרפולוג מומחה (שיטת גרפולוגיה בעברית, מבוססת טיפוסי אודם ופונקציות יונג). אתה כלי עזר — לא מאבחן לבד.
עקרונות מחייבים:
• כל מסקנה חייבת להישען על כמה סימנים, לא על סימן יחיד.
• נסח בזהירות; כשיש ספק ציין זאת מפורשות והשתמש בניסוח כמו "ניכרים סימנים המחייבים בירור נוסף".
• אין לתת אבחנה רפואית או פסיכולוגית — רק תיאור סגנון תפקוד, נטיות, חוזקות ואתגרים.
• כתוב בעברית, בשפה מקצועית אך נגישה.
קטגוריות הסימנים לעבוד לפיהן:
${cats}
טיפוסי אודם:
${odem}
פונקציות יונג: חשיבה / רגש / חישה / אינטואיציה, בעמדת מוחצן או מופנם.
החזר JSON בלבד לפי הסכמה שניתנה.`;
  const ctx=`פרטי הנבדק: שם ${c.name||'-'}, גיל ${c.age||'-'}, יד כותבת ${c.hand||'-'}, מטרת אבחון ${c.purpose||'-'}${c.physical?(', מצב פיזי רלוונטי: '+c.physical):''}.${(c.impression&&c.impression.general)?(' התרשמות ראשונית של המאבחן: '+c.impression.general):''}`;
  const imgs=(c.images||[]).slice(0,3).map(src=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:(src.split(',')[1]||'')}}));
  const body={model:AI_MODEL,max_tokens:12000,thinking:{type:'adaptive'},
    output_config:{format:{type:'json_schema',schema:AI_SCHEMA}},
    system:sys,
    messages:[{role:'user',content:[...imgs,{type:'text',text:ctx+'\n\nנתח את כתב היד שבתמונות לפי שיטת הגרפולוגיה והחזר JSON לפי הסכמה.'}]}]};
  return {url:'https://api.anthropic.com/v1/messages',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body};
}
async function runAiAnalysis(c){
  const a=ensure(c);
  if(!(DB.settings.apiKey||'').trim()){toast('הזן מפתח API בהגדרות');setView('settings');return;}
  if(!(c.images||[]).length){toast('העלה תמונת כתב יד קודם');setStep('images');return;}
  a.aiLoading=true;a.aiError='';renderAiPanel();
  try{
    const req=buildAiRequest(c);
    const r=await fetch(req.url,{method:'POST',headers:req.headers,body:JSON.stringify(req.body)});
    if(!r.ok){let m=r.status+'';try{const e=await r.json();m+=' '+(e.error&&e.error.message||'');}catch(_){}throw new Error('שגיאת שרת '+m);}
    const data=await r.json();
    if(data.stop_reason==='refusal')throw new Error('הבקשה נדחתה מטעמי בטיחות.');
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    const parsed=JSON.parse(txt);
    parsed.at=Date.now();a.ai=parsed;
  }catch(err){a.aiError=(''+(err&&err.message||err)).slice(0,300);}
  a.aiLoading=false;saveDB();renderAiPanel();
}

/* ---- streaming helper (SSE) ---- */
async function streamClaude(opts){
  const key=(DB.settings.apiKey||'').trim();if(!key)throw new Error('אין מפתח API');
  const body={model:AI_MODEL,max_tokens:opts.max_tokens||2000,stream:true,messages:opts.messages};
  if(opts.system)body.system=opts.system;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  if(!r.ok){let m=r.status+'';try{const e=await r.json();m+=' '+(e.error&&e.error.message||'');}catch(_){}throw new Error('שגיאת שרת '+m);}
  const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,i);buf=buf.slice(i+2);
      const line=chunk.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
      const js=line.slice(5).trim();if(!js||js==='[DONE]')continue;
      try{const ev=JSON.parse(js);if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta')opts.onText(ev.delta.text);}catch(_){}}}
}

function comparisonTable(chosen){
  const axes=OCC_AXES;
  const head=`<th>קריטריון</th>${chosen.map(c=>`<th>${esc(c.name||'')}</th>`).join('')}`;
  const rows=axes.filter(ax=>chosen.some(c=>c.analysis&&c.analysis.profile&&c.analysis.profile[ax])).map(ax=>`<tr><td>${esc(ax)}</td>${chosen.map(c=>`<td>${esc((c.analysis&&c.analysis.profile&&c.analysis.profile[ax])||'—')}</td>`).join('')}</tr>`).join('');
  const holland=`<tr><td>קוד הולנד</td>${chosen.map(c=>`<td>${esc(hollandCode((c.analysis&&c.analysis.riasec)||{}))||'—'}</td>`).join('')}</tr>`;
  const odem=`<tr><td>טיפוס אודם</td>${chosen.map(c=>`<td>${esc((c.analysis&&c.analysis.odem&&c.analysis.odem.dominant)||'—').replace(/^[א-ת]\.\s*/,'')}</td>`).join('')}</tr>`;
  const flags=`<tr><td>דגלים אדומים</td>${chosen.map(c=>{const n=RED_FLAGS.filter((f,i)=>c.analysis&&c.analysis.redflags&&c.analysis.redflags['r'+i]).length;return `<td>${n?('⚠️ '+n):'—'}</td>`;}).join('')}</tr>`;
  return `<div style="overflow:auto;margin-top:12px"><table class="tbl" id="cmpTbl"><thead><tr>${head}</tr></thead><tbody>${rows}${holland}${odem}${flags}</tbody></table></div>
    <div class="muted" style="font-size:12.5px;margin-top:6px">המלצה: ההשוואה מציגה תמונה יחסית בלבד; יש לשלב ראיון, ניסיון וממליצים.</div>`;
}

function doAction(act,el){const c=curCase();
  switch(act){
    case'newcase':{const nc={id:uid(),name:'',purpose:'אישי',status:'נפתח תיק',createdAt:Date.now(),updatedAt:Date.now()};ensure(nc);DB.cases.push(nc);saveDB();openCase(nc.id);break;}
    case'del':if(confirm('למחוק את התיק לצמיתות?')){DB.cases=DB.cases.filter(x=>x.id!==el.dataset.id);currentCaseId=null;saveDB();setView('cases');toast('נמחק');}break;
    case'guidelines':showGuidelines();break;
    case'addImg':$('#imgInput').click();break;
    case'autoProfile':autoProfile(c);break;
    case'suggestProf':suggestProf(c);break;
    case'accessible':accessibleLang(c);break;
    case'qcCheck':qualityCheck(c);break;
    case'emailSummary':emailSummary(c);break;
    case'saveReport':saveDB();toast('הדוח נשמר');break;
    case'printReport':window.print();break;
    case'wordReport':exportWord(c);break;
    case'learnMark':{ensure(c);c.learning.flag=!c.learning.flag;if(c.learning.flag&&!c.learning.note)c.learning.note=prompt('הערה למאגר הלמידה (אופציונלי):')||'';saveDB();render();toast(c.learning.flag?'נוסף למאגר הלמידה':'הוסר');break;}
    case'saveSettings':if($('#setName'))DB.settings.graphologist=$('#setName').value;if($('#setDisc'))DB.settings.disclaimer=$('#setDisc').value;if($('#setSucc'))DB.settings.success=$('#setSucc').value;if($('#aiKey'))DB.settings.apiKey=$('#aiKey').value.trim();saveDB();toast('ההגדרות נשמרו');break;
    case'runAi':runAiAnalysis(c);break;
    case'aiImport':aiImport(c);break;
    case'addAiSigns':addAiSigns(c);break;
    case'aiAsk':aiAsk(c);break;
    case'compareAi':compareAi();break;
    case'loadDemo':loadDemo();break;
    case'addPrice':DB.settings.prices.push({label:'מסלול חדש',amount:0});saveDB();render();break;
    case'rmPrice':DB.settings.prices.splice(+el.dataset.i,1);saveDB();render();break;
    case'addProf':DB.settings.profBank.push({traits:'',prof:'',axes:[]});saveDB();render();break;
    case'rmProf':DB.settings.profBank.splice(+el.dataset.i,1);saveDB();render();break;
    case'export':exportBackup();break;
    case'import':$('#fileInput').click();break;
    case'wipe':if(confirm('למחוק את כל התיקים? פעולה בלתי הפיכה.')){DB={cases:[],settings:DB.settings};saveDB();currentCaseId=null;setView('cases');}break;
    case'cmpCsv':exportCmpCsv();break;
    case'cmpWord':exportCmpWord();break;
  }
}
function loadDemo(){
  const id=uid();const c={id,name:'הדגמה — דוד כהן',age:'35',gender:'זכר',hand:'ימין',lang:'עברית',purpose:'תעסוקתי',orderer:'מעסיק',status:'האבחון התחיל',price:'950',paid:true,createdAt:Date.now(),updatedAt:Date.now()};
  ensure(c);
  const idxs=[];KB.signs.forEach((s,i)=>{if(s.odem&&s.odem.length&&idxs.length<7)idxs.push(i);});
  idxs.forEach((i,k)=>{const s=KB.signs[i];c.analysis.signs.push({cat:s.cat,variant:s.variant,meaning:s.meaning,appearance:s.appearance,odem:s.odem||[],prominent:k<3,doubt:k===6,intensity:'בינונית',freq:'חוזר',certainty:'בינונית',note:''});});
  c.analysis.profile={'סדר וארגון':'גבוה','אחריות':'גבוה','דיוק':'בינוני','יוזמה':'בינוני','יציבות רגשית':'גבוה'};
  c.analysis.riasec={R:30,I:65,A:15,S:40,E:45,C:75};
  c.analysis.jung={attitude:'מופנם',fn:'חשיבה'};c.analysis.odem={dominant:'ד. רציונלי',sec:'ב. אינטגרטיבי'};
  c.impression={atmosphere:'כתב מסודר',order:'גבוהה',general:'כתב מסודר, מאורגן ובהיר, רושם של אדם שיטתי ואחראי'};
  c.ethics={e0:true,e1:true,e2:true,e6:true};
  DB.cases.push(c);saveDB();openCase(id);toast('נטען תיק הדגמה');
}
function showGuidelines(){const c=curCase();
  const txt=`הנחיות לכתיבת כתב יד לאבחון גרפולוגי:
• לכתוב על דף A4 חלק (ללא שורות).
• עט כדורי רגיל בלבד (לא טוש/עיפרון/פיילוט).
• טקסט חופשי ורציף של לפחות 15 שורות — לא להעתיק ולא בהכתבה.
• להוסיף חתימה בסיום.
• לציין גיל ויד כותבת${c&&c.name?(' ('+c.name+')'):''}.
• לכתוב בישיבה נוחה ליד שולחן יציב, במצב רגוע.
• אם יש מגבלה פיזית המשפיעה על הכתיבה — לציין במפורש.
• לצלם/לסרוק באיכות טובה.
• לא לשלוח כתב שנכתב בעייפות קיצונית/לחץ חריג/מצב רפואי חריג (אלא אם זו מטרת האבחון).`;
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><div class="mhead"><b>📋 הנחיות כתיבה ללקוח</b><span class="right"></span><button class="btn ghost sm" data-close>✕</button></div><div class="mbody"><textarea style="width:100%;min-height:260px;border:1px solid var(--line);border-radius:9px;padding:10px;line-height:1.7">${esc(txt)}</textarea><div class="row" style="margin-top:10px"><button class="btn accent" data-copy>📋 העתק</button><button class="btn ghost" data-close>סגור</button></div></div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click',e=>{if(e.target===bg||e.target.hasAttribute('data-close'))bg.remove();if(e.target.hasAttribute('data-copy')){navigator.clipboard.writeText(txt);toast('הועתק');}});
}
function accessibleLang(c){const a=ensure(c);const used=KB.glossary.filter(g=>{const all=[a.report.paragraph,a.report.sections&&a.report.sections.function,a.report.sections&&a.report.sections.social,a.report.sections&&a.report.sections.personal].join(' ');return all.includes(g.term);});
  if(!used.length){toast('לא נמצאו מונחים מקצועיים בטקסט');return;}
  const txt=used.map(g=>'• '+g.term+': '+g.def).join('\n');
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><div class="mhead"><b>🗣️ מונחים מקצועיים שכדאי להסביר ללקוח</b><span class="right"></span><button class="btn ghost sm" data-close>✕</button></div><div class="mbody"><div class="muted" style="margin-bottom:8px">המערכת זיהתה מונחים שעלולים להיות לא ברורים ללקוח. הסבריהם:</div><textarea style="width:100%;min-height:240px;border:1px solid var(--line);border-radius:9px;padding:10px;line-height:1.7">${esc(txt)}</textarea><div class="row" style="margin-top:10px"><button class="btn accent" data-copy>📋 העתק</button><button class="btn ghost" data-close>סגור</button></div></div></div>`;
  document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg||e.target.hasAttribute('data-close'))bg.remove();if(e.target.hasAttribute('data-copy')){navigator.clipboard.writeText(txt);toast('הועתק');}});
}
function qualityCheck(c){const a=ensure(c),r=a.report;const issues=[];
  if(a.signs.length<5)issues.push('מעט סימנים הוזנו ('+a.signs.length+') — מומלץ לבסס מסקנות על יותר סימנים.');
  if(!a.signs.some(s=>s.prominent))issues.push('לא סומנו סימנים בולטים.');
  if(r.type==='employer'){const t=[r.paragraph,r.sections&&r.sections.personal].join(' ');if(/דיכאון|טראומה|מיני|חרדה|רפואי/.test(t))issues.push('בדוח למעסיק זוהו ביטויים אישיים/רגישים — שקול לנסח בזהירות או להשמיט.');}
  const doubts=a.signs.filter(s=>s.doubt).length;if(doubts&&!(r.recommendations||'').trim())issues.push(doubts+' סימנים בספק אך אין המלצת בירור/ניסוח זהיר.');
  if(!a.jung.fn&&!a.odem.dominant)issues.push('לא הוגדרה טיפולוגיה (יונג/אודם).');
  const allText=a.signs.map(s=>s.meaning||'').join(' ');const conf=CONFLICT_PAIRS.filter(([x,y])=>allText.includes(x)&&allText.includes(y));if(conf.length)issues.push('קיימים סימנים סותרים שלא טופלו: '+conf.map(p=>p[0]+'/'+p[1]).join(', ')+'.');
  const out=$('#qcOut');out.innerHTML=issues.length?`<div style="background:var(--warn-soft);border:1px solid var(--warn);border-radius:9px;padding:10px 12px"><b style="color:var(--warn)">בקרת איכות — ${issues.length} נקודות לבדיקה:</b><ul style="margin:6px 0">${issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`:`<div style="background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:10px 12px;color:var(--good)">✅ לא נמצאו בעיות בולטות. הדוח נראה תקין להפקה.</div>`;
}
function emailSummary(c){const a=ensure(c);const odem=a.odem.dominant?a.odem.dominant.replace(/^[א-ת]\.\s*/,''):'';
  const txt=`שלום,
מצורף סיכום קצר מאבחון גרפולוגי${c.purpose?(' ('+c.purpose+')'):''} עבור ${c.name||''}.
${a.report.paragraph||buildDraft(c)}
${a.report.professions?('כיווני תעסוקה: '+a.report.professions):''}
${odem?('טיפוס מרכזי: '+odem):''}
לדוח המלא ולשיחת הרחבה אשמח לעמוד לרשותכם.
בברכה, ${DB.settings.graphologist||''}`;
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><div class="mhead"><b>✉️ סיכום קצר למייל</b><span class="right"></span><button class="btn ghost sm" data-close>✕</button></div><div class="mbody"><textarea style="width:100%;min-height:240px;border:1px solid var(--line);border-radius:9px;padding:10px;line-height:1.7">${esc(txt)}</textarea><div class="row" style="margin-top:10px"><button class="btn accent" data-copy>📋 העתק</button><button class="btn ghost" data-close>סגור</button></div></div></div>`;
  document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg||e.target.hasAttribute('data-close'))bg.remove();if(e.target.hasAttribute('data-copy')){navigator.clipboard.writeText(txt);toast('הועתק');}});
}

/* ===== exports ===== */
function wordWrap(inner){return `<html dir="rtl" xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset="utf-8"><style>body{font-family:'David',Arial;direction:rtl;line-height:1.8}h1{text-align:center;color:#2b3a67}h3{color:#2b3a67;border-bottom:1px solid #0e8a6e}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:5px;text-align:right}</style></head><body>${inner}</body></html>`;}
function dl(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function exportWord(c){const anon=anonOn();dl(new Blob(['﻿'+wordWrap(reportDocHTML(c))],{type:'application/msword'}),'אבחון - '+(anon?'אנונימי':(c.name||'ללא שם'))+'.doc');toast('הדוח ירד');}
function exportBackup(){dl(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}),'גיבוי-אבחונים-'+new Date().toISOString().slice(0,10)+'.json');toast('הגיבוי ירד');}
function exportCmpCsv(){const chosen=(viewComparison._sel||[]).map(id=>DB.cases.find(c=>c.id===id)).filter(Boolean);if(chosen.length<2)return;
  const rows=[['קריטריון',...chosen.map(c=>c.name||'')]];
  OCC_AXES.forEach(ax=>{if(chosen.some(c=>c.analysis&&c.analysis.profile&&c.analysis.profile[ax]))rows.push([ax,...chosen.map(c=>(c.analysis&&c.analysis.profile&&c.analysis.profile[ax])||'')]);});
  rows.push(['קוד הולנד',...chosen.map(c=>hollandCode((c.analysis&&c.analysis.riasec)||{}))]);
  rows.push(['טיפוס אודם',...chosen.map(c=>(c.analysis&&c.analysis.odem&&c.analysis.odem.dominant)||'')]);
  const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  dl(new Blob([csv],{type:'text/csv'}),'השוואת-מועמדים.csv');toast('הטבלה ירדה');}
function exportCmpWord(){const chosen=(viewComparison._sel||[]).map(id=>DB.cases.find(c=>c.id===id)).filter(Boolean);if(chosen.length<2)return;
  dl(new Blob(['﻿'+wordWrap('<h1>השוואת מועמדים</h1>'+comparisonTable(chosen))],{type:'application/msword'}),'השוואת-מועמדים.doc');}

$('#fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d&&d.cases){if(confirm('שחזור יחליף את כל הנתונים הקיימים. להמשיך?')){DB=d;DB.settings=Object.assign(defDB().settings,d.settings||{});saveDB();currentCaseId=null;setView('cases');toast('שוחזר');}}else toast('קובץ לא תקין');}catch(err){toast('שגיאה בקריאת הקובץ');}};
  rd.readAsText(f);e.target.value='';});
$('#imgInput').addEventListener('change',e=>{if(e.target.files.length)handleImages(e.target.files);e.target.value='';});
$('#btnExport').addEventListener('click',exportBackup);
$('#btnImport').addEventListener('click',()=>$('#fileInput').click());

/* ===== boot ===== */
render();
</script>
</body>
</html>
