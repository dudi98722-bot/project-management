<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת אבחון גרפולוגי — ישראל הפטקה</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✒️</text></svg>">
<style>
  :root{
    --bg:#eef1f6; --panel:#ffffff; --ink:#1f2733; --muted:#6b7688;
    --brand:#2b3a67; --brand2:#3f5694; --accent:#0e8a6e; --accent-soft:#e3f4ef;
    --warn:#c2410c; --warn-soft:#fff1e8; --danger:#b91c1c; --good:#15803d;
    --line:#e2e6ee; --chip:#eef2fb; --shadow:0 6px 22px rgba(28,40,70,.10);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI","Assistant","Heebo",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--brand2)}
  .hidden{display:none!important}

  header.top{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
  header.top .logo{font-size:26px}
  header.top h1{font-size:18px;margin:0;font-weight:700}
  header.top .sub{font-size:12px;opacity:.85;margin-top:1px}
  header.top .spacer{flex:1}
  nav.tabs{display:flex;gap:4px;background:#fff;padding:6px 14px;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:40;flex-wrap:wrap;box-shadow:0 2px 8px rgba(28,40,70,.04)}
  nav.tabs button{background:transparent;border:none;padding:9px 16px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px}
  nav.tabs button.active{background:var(--brand);color:#fff}
  nav.tabs button:hover:not(.active){background:var(--chip);color:var(--brand)}
  main{padding:18px;max-width:1320px;margin:0 auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:17px;color:var(--brand);display:flex;align-items:center;gap:8px}
  .card h3{margin:16px 0 8px;font-size:14.5px;color:var(--brand2)}
  .card h3:first-child{margin-top:0}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .grid{display:grid;gap:12px}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
  label.fld input,label.fld select,label.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  label.fld textarea{min-height:70px;resize:vertical;line-height:1.6}
  .btn{background:var(--brand);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px}
  .btn:hover{background:var(--brand2)}
  .btn.accent{background:var(--accent)}.btn.accent:hover{filter:brightness(1.08)}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--chip)}
  .btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
  .btn.danger{background:var(--danger)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--brand);font-size:12px;font-weight:700}
  .muted{color:var(--muted)}
  .right{margin-inline-start:auto}
  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  table.tbl th,table.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
  table.tbl th{background:var(--chip);color:var(--brand);font-weight:700}
  table.tbl tr:nth-child(even) td{background:#fafbfe}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;margin:1px}
  .empty{text-align:center;color:var(--muted);padding:36px 10px}
  .empty .big{font-size:40px;opacity:.5}
  .hr{height:1px;background:var(--line);margin:14px 0}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:800;color:var(--brand)}
  .stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
  .stat.accent .n{color:var(--accent)}

  .case-card{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:9px;cursor:pointer;transition:.12s}
  .case-card:hover{border-color:var(--brand2);box-shadow:var(--shadow);transform:translateY(-1px)}
  .case-card .av{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
  .case-card .nm{font-weight:700}
  .case-card .meta{font-size:12.5px;color:var(--muted)}
  .status-badge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}

  /* step nav */
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow)}
  .steps button{flex:1;min-width:96px;background:transparent;border:none;padding:9px 8px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13px;position:relative}
  .steps button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-inline-start:5px;vertical-align:middle}
  .steps button.done .dot{background:var(--accent)}
  .steps button.active{background:var(--brand);color:#fff}
  .steps button:hover:not(.active){background:var(--chip);color:var(--brand)}

  .wb{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
  @media(max-width:1000px){.wb{grid-template-columns:1fr}}
  .catalog .group{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .catalog .group>summary{padding:10px 13px;background:var(--chip);font-weight:700;color:var(--brand);cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
  .catalog .group>summary::-webkit-details-marker{display:none}
  .catalog .cat{padding:6px 10px 10px}
  .catalog .cat .catname{font-weight:700;font-size:13px;color:var(--brand2);margin:6px 0 4px}
  .catalog .var{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:3px 0;font-size:13px;line-height:1.45}
  .catalog .var:hover{background:var(--accent-soft);border-color:var(--accent)}
  .catalog .var .vt{font-weight:700;color:var(--ink)}
  .catalog .var .vm{color:var(--muted);font-size:12px}
  .sel-sign{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .sel-sign.prominent{border-inline-start:5px solid var(--accent);background:#f6fbf9}
  .sel-sign.doubt{border-inline-start:5px solid var(--warn);background:#fff8f3}
  .sel-sign .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sel-sign .sh .cat{font-size:11px;font-weight:700;color:var(--brand2);background:var(--chip);border-radius:6px;padding:1px 8px}
  .sel-sign .sh .vr{font-weight:700}
  .sel-sign .mn{font-size:13px;color:#374151;margin:6px 0}
  .toggle{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--muted)}
  .toggle.on-acc{background:var(--accent);color:#fff;border-color:var(--accent)}
  .toggle.on-warn{background:var(--warn);color:#fff;border-color:var(--warn)}
  .sidebar .bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
  .sidebar .bar-row .lbl{width:96px;flex:none;font-weight:600}
  .sidebar .bar{flex:1;height:14px;background:var(--chip);border-radius:7px;overflow:hidden}
  .sidebar .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--accent))}
  .sidebar .bar-row .v{width:24px;text-align:center;font-weight:800;color:var(--brand)}
  .trait{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 11px;margin:3px;font-size:12.5px;font-weight:700}
  .trait small{opacity:.7;font-weight:600}
  .chipbtn{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;margin:3px;font-size:12.5px;cursor:pointer}
  .chipbtn:hover{background:var(--accent-soft);border-color:var(--accent)}

  /* checklists */
  .check{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:5px 0;background:#fff}
  .check input{margin-top:3px}
  .check.on{background:var(--warn-soft);border-color:var(--warn)}
  .check.ok{background:var(--accent-soft);border-color:var(--accent)}
  .lvl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .lvl select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;min-width:140px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--brand);color:#fff}

  /* images */
  .imgs{display:flex;gap:10px;flex-wrap:wrap}
  .imgthumb{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:150px;height:150px;background:#f4f6fb}
  .imgthumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
  .imgthumb .x{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-weight:800}
  .viewer{position:fixed;inset:0;background:rgba(15,20,35,.9);z-index:120;display:grid;place-items:center}
  .viewer img{max-width:92vw;max-height:82vh;transition:transform .15s}
  .viewer .vc{position:absolute;top:14px;left:14px;display:flex;gap:8px}

  #reportDoc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:34px 40px;max-width:840px;margin:0 auto;box-shadow:var(--shadow);line-height:1.85}
  #reportDoc h1{text-align:center;font-size:22px;color:var(--brand);margin:0 0 4px}
  #reportDoc .bsd{text-align:center;font-size:13px;color:var(--muted)}
  #reportDoc .secttl{color:var(--brand);border-bottom:2px solid var(--accent);padding-bottom:3px;margin:20px 0 7px;font-size:16px}
  #reportDoc table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  #reportDoc table th,#reportDoc table td{border:1px solid #cdd4e2;padding:6px 8px;text-align:right;vertical-align:top}
  #reportDoc table th{background:#eef2fb;color:var(--brand)}
  #reportDoc .disc{font-size:12px;color:#555;background:#f6f7fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:18px}
  .kb-search{position:sticky;top:108px;z-index:5}
  .modal-bg{position:fixed;inset:0;background:rgba(20,28,48,.45);display:grid;place-items:center;z-index:100;padding:16px}
  .modal{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff;z-index:2}
  .modal .mbody{padding:18px 20px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-weight:600;z-index:200;box-shadow:var(--shadow);opacity:0;transition:.25s}
  .toast.show{opacity:1}
  .match-good{color:var(--good);font-weight:700}.match-part{color:var(--warn);font-weight:700}.match-gap{color:var(--danger);font-weight:700}
  @media print{
    header.top,nav.tabs,#reportTools,.steps,.no-print{display:none!important}
    body{background:#fff}main{padding:0;max-width:none}
    #reportDoc{box-shadow:none;border:none;max-width:none;margin:0;padding:0}
  }
</style>
</head>
<body>
<header class="top">
  <div class="logo">✒️</div>
  <div>
    <h1>מערכת אבחון גרפולוגי</h1>
    <div class="sub" id="hdrSub">פלטפורמה מקצועית לניהול תהליך אבחון גרפולוגי מלא</div>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost sm" id="btnExport">גיבוי ↧</button>
  <button class="btn ghost sm" id="btnImport">שחזור ↥</button>
</header>

<nav class="tabs" id="tabs">
  <button data-view="dashboard" class="active">לוח בקרה</button>
  <button data-view="cases">תיקים וארכיון</button>
  <button data-view="workspace" id="tabWs" disabled>תיק פעיל</button>
  <button data-view="comparison">השוואת מועמדים</button>
  <button data-view="kb">מאגר הידע</button>
  <button data-view="settings">הגדרות</button>
</nav>

<main id="app"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" class="hidden">
<input type="file" id="imgInput" accept="image/*" multiple class="hidden">

<script src="kb.js"></script>
<script>
/* ============================================================
   מערכת אבחון גרפולוגי — יישום מלא לפי מסמך האפיון
   ============================================================ */
const KB = window.GRAPHO_KB || {signs:[],groups:[],glossary:[],jung:[],odemList:[],odemDesc:{},speedtest:[]};
const LS_KEY = 'grapho_db_v2';

const STATUSES=['נפתח תיק','נשלחו הנחיות כתיבה','התקבל כתב יד','התקבל תשלום','האבחון התחיל','ממתין להשלמת נתונים','טיוטת דוח מוכנה','דוח אושר','דוח נשלח','התיק נסגר'];
const STATUS_COLORS={'נפתח תיק':'#64748b','נשלחו הנחיות כתיבה':'#7c5cbf','התקבל כתב יד':'#2563eb','התקבל תשלום':'#0891b2','האבחון התחיל':'#d97706','ממתין להשלמת נתונים':'#c2410c','טיוטת דוח מוכנה':'#9333ea','דוח אושר':'#0e8a6e','דוח נשלח':'#15803d','התיק נסגר':'#475569'};
const PURPOSES=['אישי','תעסוקתי','מועמד למשרה','ייעוץ קריירה','אחר'];
const REPORT_TYPES={personal:'דוח אישי מלא',occupational:'דוח תעסוקתי מלא',employer:'דוח מקוצר למעסיק',internal:'דוח פנימי למאבחן'};

const ETHICS=[
 'קיימת הסכמה של הכותב לאבחון',
 'ברור מי מזמין את האבחון',
 'מטרת האבחון מוגדרת',
 'אין מדובר בקטין (או שיש הסכמת אפוטרופוס)',
 'הכתב נכתב בתנאים סבירים',
 'אין מגבלה פיזית לא-מתועדת המשפיעה על הכתב',
 'ברור למי מיועד הדוח (האדם עצמו / מעסיק)',
 'נשמרת הימנעות מחשיפת מידע אישי שאינו רלוונטי'];

const IMPRESSION_FIELDS=[
 {k:'atmosphere',l:'אווירה כללית של הכתב'},
 {k:'feeling',l:'תחושה ראשונית שהכתב מעורר'},
 {k:'order',l:'רמת סדר וניקיון',opt:['נמוכה','בינונית','גבוהה']},
 {k:'vitality',l:'רמת חיות ותנועה',opt:['נמוכה','בינונית','גבוהה']},
 {k:'control',l:'רמת שליטה ואיפוק',opt:['נמוכה','בינונית','גבוהה']},
 {k:'openness',l:'פתיחות מול הסתגרות',opt:['סגור/מאופק','מאוזן','פתוח']},
 {k:'general',l:'רושם כללי על תפקוד, חשיבה ויחסי אנוש',big:1}];
const IMPRESSION_CHIPS=['כתב מסודר ומאורגן','כתב עמוס ולחוץ','כתב אגרסיבי','כתב מגונן','כתב זהיר ומחושב','כתב תנועתי ומהיר','כתב סגור ומאופק','כתב עקרוני ונוקשה','תחושת עייפות / ירידה באנרגיה'];

const OCC_AXES=['סדר וארגון','אחריות','יוזמה','התמדה','עבודה תחת לחץ','עצמאות','עבודה בצוות','תקשורת בין-אישית','יכולת שירות','יכולת ניהול','חשיבה אנליטית','חשיבה מעשית','יצירתיות','גמישות','דיוק','קבלת סמכות','יציבות רגשית','אמינות וזהירות'];
const AXIS_LEVELS=['','נמוך','בינוני','גבוה','לא ניתן לקבוע','דורש בירור נוסף'];

const RIASEC=[
 {k:'R',name:'ביצועי (Realistic)',desc:'עבודה מעשית, פיזית, טכנית, עם כלים וחומרים.',prof:'טכנאות, לוגיסטיקה, מלאכה, תפעול, חקלאות'},
 {k:'I',name:'חקרני (Investigative)',desc:'חקירה, ניתוח, פתרון בעיות, חשיבה מדעית.',prof:'מחקר, אנליזה, בדיקות, הנדסה, אבחון'},
 {k:'A',name:'אמנותי (Artistic)',desc:'יצירתיות, ביטוי עצמי, עיצוב, מקוריות.',prof:'עיצוב, כתיבה, מוזיקה, אמנות, פרסום'},
 {k:'S',name:'חברתי (Social)',desc:'עזרה, הדרכה, הוראה, שירות ותמיכה באנשים.',prof:'הוראה, ייעוץ, חינוך, סיעוד, שירות'},
 {k:'E',name:'יזמי (Enterprising)',desc:'שכנוע, הובלה, מכירות, יזמות וניהול.',prof:'מכירות, ניהול, יזמות, פיתוח עסקי'},
 {k:'C',name:'פקידותי (Conventional)',desc:'סדר, דיוק, נתונים, נהלים ועבודה מאורגנת.',prof:'הנהלת חשבונות, אדמיניסטרציה, בקרה, בנקאות'}];

const JOB_FIELDS=[
 {k:'title',l:'שם המשרה'},{k:'desc',l:'תיאור התפקיד',big:1},
 {k:'env',l:'סביבת עבודה'},{k:'hours',l:'שעות עבודה'},
 {k:'pressure',l:'רמת לחץ',opt:['נמוכה','בינונית','גבוהה']},
 {k:'people',l:'עבודה מול אנשים / לבד',opt:['בעיקר לבד','מעורב','בעיקר מול אנשים']},
 {k:'precision',l:'צורך בדיוק',opt:['נמוך','בינוני','גבוה']},
 {k:'initiative',l:'צורך ביוזמה',opt:['נמוך','בינוני','גבוה']},
 {k:'orderNeed',l:'צורך בסדר ומשמעת',opt:['נמוך','בינוני','גבוה']},
 {k:'kind',l:'אופי',opt:['פיזי','משרדי','ניהולי']},
 {k:'financial',l:'אחריות כספית',opt:['אין','חלקית','גבוהה']},
 {k:'peopleResp',l:'אחריות על אנשים',opt:['אין','חלקית','גבוהה']},
 {k:'service',l:'רמת שירותיות',opt:['נמוכה','בינונית','גבוהה']},
 {k:'stability',l:'יציבות נדרשת',opt:['נמוכה','בינונית','גבוהה']}];

const STEPS=[['details','פרטים ואתיקה'],['impression','התרשמות'],['images','כתב יד'],['signs','סימנים'],['occupational','תעסוקה'],['redflags','דגלים אדומים'],['typology','טיפולוגיה'],['report','דוח']];
function stepDone(c,s){const a=ensure(c);switch(s){
  case'details':return!!(c.name&&c.purpose);
  case'impression':return Object.values(c.impression||{}).some(v=>v);
  case'images':return(c.images||[]).length>0;
  case'signs':return a.signs.length>0;
  case'occupational':return Object.keys(a.profile||{}).some(k=>a.profile[k])||Object.values(a.riasec).some(v=>v>0);
  case'redflags':return Object.keys(c.analysis.redflags||{}).length>0;
  case'typology':return!!(a.jung.fn||a.odem.dominant);
  case'report':return!!(a.report&&(a.report.paragraph||a.report.sections));
  default:return false;}}
function viewWorkspace(){
  const c=curCase();if(!c)return viewCases();ensure(c);

  const body={details:stepDetails,impression:stepImpression,images:stepImages,signs:stepSigns,occupational:stepOccupational,redflags:stepRedFlags,typology:stepTypology,report:stepReport}[caseStep](c);
  return back+bar+body;
}

function openViewer(src){
  let rot=0,sc=1;const v=document.createElement('div');v.className='viewer';
  v.innerHTML=`<div class="vc"><button class="btn sm">סובב ⟳</button><button class="btn sm">זום +</button><button class="btn sm">זום −</button><button class="btn danger sm">סגור ✕</button></div><img src="${src}">`;
  document.body.appendChild(v);const img=v.querySelector('img');
  const b=v.querySelectorAll('button');
  b[0].onclick=()=>{rot+=90;img.style.transform=`rotate(${rot}deg) scale(${sc})`;};
  b[1].onclick=()=>{sc=Math.min(4,sc+.25);img.style.transform=`rotate(${rot}deg) scale(${sc})`;};
  b[2].onclick=()=>{sc=Math.max(.5,sc-.25);img.style.transform=`rotate(${rot}deg) scale(${sc})`;};
  b[3].onclick=()=>v.remove();
  v.addEventListener('click',e=>{if(e.target===v)v.remove();});
}
function handleImages(files){
  const c=curCase();ensure(c);let pending=files.length;
  [...files].forEach(file=>{
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{
      const max=1200;let w=im.width,h=im.height;if(w>max){h=h*max/w;w=max;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);
      c.images.push(cv.toDataURL('image/jpeg',0.72));if(--pending===0){saveDB();render();toast('נוספו תמונות');}
    };im.src=rd.result;};
    rd.readAsDataURL(file);
  });
}

function renderCatalog(q){const box=$('#catalog');if(!box)return;q=(q||'').trim();
  if(q){const hits=KB.signs.filter(s=>(s.cat+' '+s.variant+' '+s.meaning+' '+s.appearance).includes(q)).slice(0,80);

function varHTML(s){const i=KB.signs.indexOf(s);return `<button class="var" data-add="${i}"><span class="vt">${esc(s.variant||s.cat)}</span> ${s.meaning?`<span class="vm">— ${esc(s.meaning.slice(0,70))}${s.meaning.length>70?'…':''}</span>`:''}</button>`;}
function addSign(idx){const s=KB.signs[idx];if(!s)return;const c=curCase(),a=ensure(c);
  a.signs.push({cat:s.cat,variant:s.variant,meaning:s.meaning,appearance:s.appearance,odem:s.odem||[],prominent:false,doubt:false,intensity:'בינונית',freq:'חוזר',certainty:'בינונית',note:''});
  saveDB();renderSelected();toast('נוסף: '+(s.variant||s.cat));}
function renderSelected(){const c=curCase(),a=ensure(c);const cnt=$('#selCount');if(cnt)cnt.textContent=a.signs.length;
  const box=$('#selList');if(!box)return;

      <span class="muted">שכיחות</span><select data-meta="freq" data-i="${i}" style="padding:2px 5px;border:1px solid var(--line);border-radius:6px">${['חד פעמי','חוזר','דומיננטי'].map(o=>`<option ${s.freq===o?'selected':''}>${o}</option>`).join('')}</select>

  box.querySelectorAll('[data-meta]').forEach(b=>b.addEventListener('change',()=>{a.signs[+b.dataset.i][b.dataset.meta]=b.value;saveDB();}));
  renderCrossRef();
}
const STOP=new Set(['של','על','אל','עם','או','גם','כי','אך','אם','לא','אין','יש','זה','זו','את','כל','כמו','אבל','מאוד','יותר','פחות','בין','לבין','תוך','לכדי','עד','ללא','ועד','אצל','לפי','כדי','מתוך','בעת','הוא','היא','הם','הן','אדם','הכותב','מבטא','מבטאת','מעיד','מעידה','מורה','ביטוי','לעיתים','ואף','וכן','כן','אלו','אלה','כאן','בו','בה','בכך','דבר','דברים','עצמו','עצמה','אותו','אותה','מה','שלא','וגם','כגון','בעיקר','אינו','אינה','להיות','יכול','יכולה','יכולת']);
function tokens(t){return(t||'').replace(/\([^)]*\)/g,' ').replace(/[^א-ת\s]/g,' ').split(/\s+/).filter(w=>w.length>=3&&!STOP.has(w));}
const CONFLICT_PAIRS=[['זהירות','העזה'],['שליטה','אימפולסיב'],['סדר','פרוע'],['רגיש','אגרסיב'],['פתיחות','סגור'],['מעצורים','חופשי'],['ביטחון','נחיתות'],['יציבות','חוסר יציבות']];
function renderCrossRef(){const c=curCase(),a=ensure(c);
  const tally={};KB.odemList.forEach(o=>tally[o]=0);a.signs.forEach(s=>(s.odem||[]).forEach(o=>{tally[o]=(tally[o]||0)+1;}));
  const ranked=Object.entries(tally).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...ranked.map(r=>r[1]));
  const ot=$('#odemTally');if(ot)ot.innerHTML=ranked.length?ranked.map(([k,v])=>`<div class="bar-row"><span class="lbl">${esc(k.replace(/^[א-ת]\.\s*/,''))}</span><div class="bar"><span style="width:${Math.round(v/max*100)}%"></span></div><span class="v">${v}</span></div>`).join(''):'<div class="muted" style="font-size:12.5px">בחר סימנים המקושרים לאודם</div>';
  const freq={};a.signs.forEach(s=>{const seen=new Set();tokens(s.meaning).forEach(w=>{if(seen.has(w))return;seen.add(w);freq[w]=(freq[w]||0)+1;});});
  const top=Object.entries(freq).filter(([w,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,14);
  const tr=$('#traits');if(tr)tr.innerHTML=top.length?top.map(([w,n])=>`<span class="trait">${esc(w)} <small>×${n}</small></span>`).join(''):'<div class="muted" style="font-size:12.5px">תכונות שחוזרות ב-2+ סימנים</div>';
  // conflicts
  const allText=a.signs.map(s=>s.meaning||'').join(' ');const found=[];
  CONFLICT_PAIRS.forEach(([x,y])=>{if(allText.includes(x)&&allText.includes(y))found.push([x,y]);});
  // same category positive+negative
  const byCat={};a.signs.forEach(s=>{(byCat[s.cat]=byCat[s.cat]||[]).push(s.variant||'');});
  Object.entries(byCat).forEach(([cat,vs])=>{const j=vs.join(' ');if((j.includes('חיובי')&&j.includes('שלילי')))found.push(['חיובי','שלילי','('+cat+')']);});
  const doubts=a.signs.filter(s=>s.doubt).length;
  const cf=$('#conflicts');if(cf)cf.innerHTML=(found.length||doubts)?
    `${found.map(p=>`<div style="font-size:12.5px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:7px 9px;margin:4px 0">⚠️ מתח בין <b>${esc(p[0])}</b> ל-<b>${esc(p[1])}</b> ${p[2]?esc(p[2]):''} — שקול: קונפליקט פנימי? פער חוץ-פנים? עקבי או נקודתי?</div>`).join('')}${doubts?`<div style="font-size:12.5px;color:var(--warn);margin-top:4px">${doubts} סימנים מסומנים לבירור.</div>`:''}`
    :'<div class="muted" style="font-size:12.5px">לא זוהו סתירות בולטות</div>';
}

const LVLN={'נמוך':1,'בינוני':2,'גבוה':3};
function renderMatch(c){const a=ensure(c),mt=$('#matchTable');if(!mt)return;const req=c.job.req||{};
  const rows=OCC_AXES.filter(ax=>req[ax]||a.profile[ax]).map(ax=>{

}
function autoProfile(c){const a=ensure(c);
  // heuristic: map recurring traits keywords to axes
  const text=a.signs.map(s=>s.meaning||'').join(' ');
  const KMAP={'סדר וארגון':['ארגון','סדר','תכנון','שיטתי'],'אחריות':['אחריות','חובה','מחויב','אמינ'],'יוזמה':['יוזמה','יזם','דחף','פעלת'],'התמדה':['התמד','עקבי','דבק','סבלן'],'עבודה תחת לחץ':['לחץ','עמיד','שליטה עצמית'],'עצמאות':['עצמא','עצמאי','אינדיבידואל'],'עבודה בצוות':['צוות','שיתוף','חבר'],'תקשורת בין-אישית':['תקשורת','חברת','הבעה','דיפלומט'],'יכולת שירות':['שירות','נתינה','הכל','רגיש'],'יכולת ניהול':['ניהול','מנהיג','שליט','הובל'],'חשיבה אנליטית':['אנליט','ניתוח','חקרני','הגיון','שכלתנ'],'חשיבה מעשית':['מעשי','פרקטי','מציאות','תכליתי'],'יצירתיות':['יצירת','מקורי','דמיון','מעוף','אינטואיצ'],'גמישות':['גמיש','הסתגל','תמרון'],'דיוק':['דיוק','דייקנ','קפדנ','יסודי'],'קבלת סמכות':['מרות','סמכות','משמעת','כיבוד'],'יציבות רגשית':['יציב','איזון','רגוע','שקט'],'אמינות וזהירות':['אמינ','זהיר','כנות','מצפונ']};
  OCC_AXES.forEach(ax=>{let hits=0;(KMAP[ax]||[]).forEach(k=>{if(text.includes(k))hits++;});if(hits>=2)a.profile[ax]='גבוה';else if(hits===1&&!a.profile[ax])a.profile[ax]='בינוני';});
  saveDB();render();toast('הוצע פרופיל — בדוק וכוון ידנית');
}
function suggestProf(c){const a=ensure(c);const out=$('#profSuggest');if(!out)return;

  const code=hollandCode(a.riasec);const hp=code.split('').map(k=>RIASEC.find(r=>r.k===k)).map(r=>r.prof);

function aspectParagraph(c,asp){const a=ensure(c);const items=a.signs.filter(s=>aspectOf(s.cat)===asp&&s.meaning);
  if(!items.length)return'';const pref=(items.filter(s=>s.prominent).length?items.filter(s=>s.prominent):items);
  return pref.map(s=>s.meaning.replace(/\s*\.?\s*$/,'')).join('; ')+'.';}

  const base=(prom.length?prom:a.signs.filter(s=>s.meaning)).map(s=>s.meaning.replace(/\s*\.?\s*$/,''));

    if(highAxes.length)html+=sec('פרופיל תעסוקתי',`<table><thead><tr><th>ציר</th><th>הערכה</th></tr></thead><tbody>${highAxes.map(ax=>`<tr><td>${esc(ax)}</td><td>${esc(a.profile[ax])}</td></tr>`).join('')}</tbody></table>`);
    if(code)html+=`<p><b>קוד הולנד:</b> ${esc(code)}</p>`;
    if(c.job&&c.job.req&&Object.keys(c.job.req).length){const mt=document.createElement('div');renderMatchInto(c,mt);if(mt.innerHTML)html+=sec('טבלת התאמה למשרה',mt.innerHTML);}
    if(r.professions)html+=sec('מקצועות וכיווני תעסוקה מומלצים','<p>'+esc(r.professions).replace(/\n/g,'<br>')+'</p>');
  } else if(r.professions){html+=sec('מקצועות מומלצים','<p>'+esc(r.professions).replace(/\n/g,'<br>')+'</p>');}
  if(r.recommendations)html+=sec('המלצות','<p>'+esc(r.recommendations).replace(/\n/g,'<br>')+'</p>');
  if((jung||odem)&&!isEmployer)html+=sec('טיפולוגיה',`<p>${jung?'<b>יונג:</b> '+esc(jung):''}${odem?'&nbsp;&nbsp;<b>אודם:</b> '+esc(odem):''}</p>`);
  // internal extras
  if(isInternal&&a.signs.length)html+=sec('טבלת סימנים מלאה',`<table><thead><tr><th>קטגוריה</th><th>הסימן</th><th>משמעות</th><th>עוצמה</th></tr></thead><tbody>${a.signs.map(s=>`<tr><td>${esc(s.cat)}</td><td>${esc(s.variant||'')}</td><td>${esc(s.meaning||'')}</td><td>${esc(s.intensity||'')}</td></tr>`).join('')}</tbody></table>`);
  if((doubts.length||flags.length)&&(isInternal||!isEmployer))html+=sec('נקודות הדורשות בירור נוסף',`<ul>${doubts.map(s=>`<li>${esc(s.variant||s.cat)}</li>`).join('')}${flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`);
  if(r.success&&!isEmployer)html+=sec('לסיום','<p>'+esc(r.success)+'</p>');
  html+=`<div class="disc"><b>הסתייגות מקצועית:</b> ${esc(DB.settings.disclaimer||DEFAULT_DISCLAIMER)}</div>`;
  html+=`<div style="text-align:left;margin-top:16px;color:#555">בכבוד רב,<br>${esc(DB.settings.graphologist||'')}</div>`;
  return html;
}
function renderMatchInto(c,el){const a=ensure(c),req=c.job.req||{};
  const rows=OCC_AXES.filter(ax=>req[ax]||a.profile[ax]).map(ax=>{const r=req[ax]||'',cand=a.profile[ax]||'';let txt='—';
    if(r&&LVLN[cand]){const d=LVLN[cand]-LVLN[r];txt=d>=1?'יתרון':d===0?'התאמה טובה':d===-1?'התאמה חלקית':'פער — לבדוק';}
    return `<tr><td>${esc(ax)}</td><td>${esc(r||'—')}</td><td>${esc(cand||'—')}</td><td>${txt}</td></tr>`;});
  el.innerHTML=rows.length?`<table><thead><tr><th>פרמטר</th><th>דרישת המשרה</th><th>הערכת המועמד</th><th>רמת התאמה</th></tr></thead><tbody>${rows.join('')}</tbody></table>`:'';
}

function viewComparison(){

    ${candidates.length?`<div class="row">${candidates.map(c=>`<label class="chipbtn" style="${sel.includes(c.id)?'background:var(--accent-soft);border-color:var(--accent)':''}"><input type="checkbox" data-cmp="${c.id}" ${sel.includes(c.id)?'checked':''} style="margin-left:5px">${esc(c.name||'(ללא שם)')}${c.job&&c.job.title?' · '+esc(c.job.title):''}</label>`).join('')}</div>`:'<div class="empty"><div class="big">⚖️</div>אין תיקים מסוג "מועמד למשרה". צור תיקים והגדר מטרת אבחון "מועמד למשרה".</div>'}
    ${chosen.length>=2?comparisonTable(chosen):chosen.length?'<div class="muted" style="margin-top:10px">בחר לפחות 2 מועמדים</div>':''}
    ${chosen.length>=2?`<div class="row" style="margin-top:12px"><button class="btn ghost" data-act="cmpCsv">⬇️ ייצוא טבלה (CSV/Excel)</button><button class="btn ghost" data-act="cmpWord">⬇️ ייצוא Word</button></div>`:''}
  </div>`;
}
function comparisonTable(chosen){
  const axes=OCC_AXES;
  const head=`<th>קריטריון</th>${chosen.map(c=>`<th>${esc(c.name||'')}</th>`).join('')}`;
  const rows=axes.filter(ax=>chosen.some(c=>c.analysis&&c.analysis.profile&&c.analysis.profile[ax])).map(ax=>`<tr><td>${esc(ax)}</td>${chosen.map(c=>`<td>${esc((c.analysis&&c.analysis.profile&&c.analysis.profile[ax])||'—')}</td>`).join('')}</tr>`).join('');
  const holland=`<tr><td>קוד הולנד</td>${chosen.map(c=>`<td>${esc(hollandCode((c.analysis&&c.analysis.riasec)||{}))||'—'}</td>`).join('')}</tr>`;
  const odem=`<tr><td>טיפוס אודם</td>${chosen.map(c=>`<td>${esc((c.analysis&&c.analysis.odem&&c.analysis.odem.dominant)||'—').replace(/^[א-ת]\.\s*/,'')}</td>`).join('')}</tr>`;
  const flags=`<tr><td>דגלים אדומים</td>${chosen.map(c=>{const n=RED_FLAGS.filter((f,i)=>c.analysis&&c.analysis.redflags&&c.analysis.redflags['r'+i]).length;return `<td>${n?('⚠️ '+n):'—'}</td>`;}).join('')}</tr>`;
  return `<div style="overflow:auto;margin-top:12px"><table class="tbl" id="cmpTbl"><thead><tr>${head}</tr></thead><tbody>${rows}${holland}${odem}${flags}</tbody></table></div>
    <div class="muted" style="font-size:12.5px;margin-top:6px">המלצה: ההשוואה מציגה תמונה יחסית בלבד; יש לשלב ראיון, ניסיון וממליצים.</div>`;
}
afterRender.comparison=function(){
  $('#app').querySelectorAll('[data-cmp]').forEach(el=>el.addEventListener('change',()=>{
    let sel=viewComparison._sel||[];if(el.checked){if(sel.length<4)sel=[...sel,el.dataset.cmp];}else sel=sel.filter(x=>x!==el.dataset.cmp);
    viewComparison._sel=sel;render();}));
};

/* ============================================================
   ACTIONS
   ============================================================ */
function doAction(act,el){const c=curCase();
  switch(act){
    case'newcase':{const nc={id:uid(),name:'',purpose:'אישי',status:'נפתח תיק',createdAt:Date.now(),updatedAt:Date.now()};ensure(nc);DB.cases.push(nc);saveDB();openCase(nc.id);break;}
    case'del':if(confirm('למחוק את התיק לצמיתות?')){DB.cases=DB.cases.filter(x=>x.id!==el.dataset.id);currentCaseId=null;saveDB();setView('cases');toast('נמחק');}break;
    case'guidelines':showGuidelines();break;
    case'addImg':$('#imgInput').click();break;
    case'autoProfile':autoProfile(c);break;
    case'suggestProf':suggestProf(c);break;
    case'accessible':accessibleLang(c);break;
    case'qcCheck':qualityCheck(c);break;
    case'emailSummary':emailSummary(c);break;
    case'saveReport':saveDB();toast('הדוח נשמר');break;
    case'printReport':window.print();break;
    case'wordReport':exportWord(c);break;
    case'learnMark':{ensure(c);c.learning.flag=!c.learning.flag;if(c.learning.flag&&!c.learning.note)c.learning.note=prompt('הערה למאגר הלמידה (אופציונלי):')||'';saveDB();render();toast(c.learning.flag?'נוסף למאגר הלמידה':'הוסר');break;}
    case'saveSettings':DB.settings.graphologist=$('#setName').value;DB.settings.disclaimer=$('#setDisc').value;DB.settings.success=$('#setSucc').value;saveDB();toast('ההגדרות נשמרו');break;
    case'addPrice':DB.settings.prices.push({label:'מסלול חדש',amount:0});saveDB();render();break;
    case'rmPrice':DB.settings.prices.splice(+el.dataset.i,1);saveDB();render();break;
    case'addProf':DB.settings.profBank.push({traits:'',prof:'',axes:[]});saveDB();render();break;
    case'rmProf':DB.settings.profBank.splice(+el.dataset.i,1);saveDB();render();break;
    case'export':exportBackup();break;
    case'import':$('#fileInput').click();break;
    case'wipe':if(confirm('למחוק את כל התיקים? פעולה בלתי הפיכה.')){DB={cases:[],settings:DB.settings};saveDB();currentCaseId=null;setView('cases');}break;
    case'cmpCsv':exportCmpCsv();break;
    case'cmpWord':exportCmpWord();break;
  }
}
function showGuidelines(){const c=curCase();
  const txt=`הנחיות לכתיבת כתב יד לאבחון גרפולוגי:
• לכתוב על דף A4 חלק (ללא שורות).
• עט כדורי רגיל בלבד (לא טוש/עיפרון/פיילוט).
• טקסט חופשי ורציף של לפחות 15 שורות — לא להעתיק ולא בהכתבה.
• להוסיף חתימה בסיום.
• לציין גיל ויד כותבת${c&&c.name?(' ('+c.name+')'):''}.
• לכתוב בישיבה נוחה ליד שולחן יציב, במצב רגוע.
• אם יש מגבלה פיזית המשפיעה על הכתיבה — לציין במפורש.
• לצלם/לסרוק באיכות טובה.
• לא לשלוח כתב שנכתב בעייפות קיצונית/לחץ חריג/מצב רפואי חריג (אלא אם זו מטרת האבחון).`;
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><div class="mhead"><b>📋 הנחיות כתיבה ללקוח</b><span class="right"></span><button class="btn ghost sm" data-close>✕</button></div><div class="mbody"><textarea style="width:100%;min-height:260px;border:1px solid var(--line);border-radius:9px;padding:10px;line-height:1.7">${esc(txt)}</textarea><div class="row" style="margin-top:10px"><button class="btn accent" data-copy>📋 העתק</button><button class="btn ghost" data-close>סגור</button></div></div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click',e=>{if(e.target===bg||e.target.hasAttribute('data-close'))bg.remove();if(e.target.hasAttribute('data-copy')){navigator.clipboard.writeText(txt);toast('הועתק');}});
}
function accessibleLang(c){const a=ensure(c);const used=KB.glossary.filter(g=>{const all=[a.report.paragraph,a.report.sections&&a.report.sections.function,a.report.sections&&a.report.sections.social,a.report.sections&&a.report.sections.personal].join(' ');return all.includes(g.term);});
  if(!used.length){toast('לא נמצאו מונחים מקצועיים בטקסט');return;}
  const txt=used.map(g=>'• '+g.term+': '+g.def).join('\n');
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><div class="mhead"><b>🗣️ מונחים מקצועיים שכדאי להסביר ללקוח</b><span class="right"></span><button class="btn ghost sm" data-close>✕</button></div><div class="mbody"><div class="muted" style="margin-bottom:8px">המערכת זיהתה מונחים שעלולים להיות לא ברורים ללקוח. הסבריהם:</div><textarea style="width:100%;min-height:240px;border:1px solid var(--line);border-radius:9px;padding:10px;line-height:1.7">${esc(txt)}</textarea><div class="row" style="margin-top:10px"><button class="btn accent" data-copy>📋 העתק</button><button class="btn ghost" data-close>סגור</button></div></div></div>`;
  document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg||e.target.hasAttribute('data-close'))bg.remove();if(e.target.hasAttribute('data-copy')){navigator.clipboard.writeText(txt);toast('הועתק');}});
}
function qualityCheck(c){const a=ensure(c),r=a.report;const issues=[];
  if(a.signs.length<5)issues.push('מעט סימנים הוזנו ('+a.signs.length+') — מומלץ לבסס מסקנות על יותר סימנים.');
  if(!a.signs.some(s=>s.prominent))issues.push('לא סומנו סימנים בולטים.');
  if(r.type==='employer'){const t=[r.paragraph,r.sections&&r.sections.personal].join(' ');if(/דיכאון|טראומה|מיני|חרדה|רפואי/.test(t))issues.push('בדוח למעסיק זוהו ביטויים אישיים/רגישים — שקול לנסח בזהירות או להשמיט.');}
  const doubts=a.signs.filter(s=>s.doubt).length;if(doubts&&!(r.recommendations||'').trim())issues.push(doubts+' סימנים בספק אך אין המלצת בירור/ניסוח זהיר.');
  if(!a.jung.fn&&!a.odem.dominant)issues.push('לא הוגדרה טיפולוגיה (יונג/אודם).');
  const allText=a.signs.map(s=>s.meaning||'').join(' ');const conf=CONFLICT_PAIRS.filter(([x,y])=>allText.includes(x)&&allText.includes(y));if(conf.length)issues.push('קיימים סימנים סותרים שלא טופלו: '+conf.map(p=>p[0]+'/'+p[1]).join(', ')+'.');
  const out=$('#qcOut');out.innerHTML=issues.length?`<div style="background:var(--warn-soft);border:1px solid var(--warn);border-radius:9px;padding:10px 12px"><b style="color:var(--warn)">בקרת איכות — ${issues.length} נקודות לבדיקה:</b><ul style="margin:6px 0">${issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`:`<div style="background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:10px 12px;color:var(--good)">✅ לא נמצאו בעיות בולטות. הדוח נראה תקין להפקה.</div>`;
}
function emailSummary(c){const a=ensure(c);const odem=a.odem.dominant?a.odem.dominant.replace(/^[א-ת]\.\s*/,''):'';
  const txt=`שלום,
מצורף סיכום קצר מאבחון גרפולוגי${c.purpose?(' ('+c.purpose+')'):''} עבור ${c.name||''}.
${a.report.paragraph||buildDraft(c)}
${a.report.professions?('כיווני תעסוקה: '+a.report.professions):''}
${odem?('טיפוס מרכזי: '+odem):''}
לדוח המלא ולשיחת הרחבה אשמח לעמוד לרשותכם.
בברכה, ${DB.settings.graphologist||''}`;
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><div class="mhead"><b>✉️ סיכום קצר למייל</b><span class="right"></span><button class="btn ghost sm" data-close>✕</button></div><div class="mbody"><textarea style="width:100%;min-height:240px;border:1px solid var(--line);border-radius:9px;padding:10px;line-height:1.7">${esc(txt)}</textarea><div class="row" style="margin-top:10px"><button class="btn accent" data-copy>📋 העתק</button><button class="btn ghost" data-close>סגור</button></div></div></div>`;
  document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg||e.target.hasAttribute('data-close'))bg.remove();if(e.target.hasAttribute('data-copy')){navigator.clipboard.writeText(txt);toast('הועתק');}});
}

/* ===== exports ===== */
function wordWrap(inner){return `<html dir="rtl" xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset="utf-8"><style>body{font-family:'David',Arial;direction:rtl;line-height:1.8}h1{text-align:center;color:#2b3a67}h3{color:#2b3a67;border-bottom:1px solid #0e8a6e}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:5px;text-align:right}</style></head><body>${inner}</body></html>`;}
function dl(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function exportWord(c){const anon=anonOn();dl(new Blob(['﻿'+wordWrap(reportDocHTML(c))],{type:'application/msword'}),'אבחון - '+(anon?'אנונימי':(c.name||'ללא שם'))+'.doc');toast('הדוח ירד');}
function exportBackup(){dl(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}),'גיבוי-אבחונים-'+new Date().toISOString().slice(0,10)+'.json');toast('הגיבוי ירד');}
function exportCmpCsv(){const chosen=(viewComparison._sel||[]).map(id=>DB.cases.find(c=>c.id===id)).filter(Boolean);if(chosen.length<2)return;
  const rows=[['קריטריון',...chosen.map(c=>c.name||'')]];
  OCC_AXES.forEach(ax=>{if(chosen.some(c=>c.analysis&&c.analysis.profile&&c.analysis.profile[ax]))rows.push([ax,...chosen.map(c=>(c.analysis&&c.analysis.profile&&c.analysis.profile[ax])||'')]);});
  rows.push(['קוד הולנד',...chosen.map(c=>hollandCode((c.analysis&&c.analysis.riasec)||{}))]);
  rows.push(['טיפוס אודם',...chosen.map(c=>(c.analysis&&c.analysis.odem&&c.analysis.odem.dominant)||'')]);
  const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  dl(new Blob([csv],{type:'text/csv'}),'השוואת-מועמדים.csv');toast('הטבלה ירדה');}
function exportCmpWord(){const chosen=(viewComparison._sel||[]).map(id=>DB.cases.find(c=>c.id===id)).filter(Boolean);if(chosen.length<2)return;
  dl(new Blob(['﻿'+wordWrap('<h1>השוואת מועמדים</h1>'+comparisonTable(chosen))],{type:'application/msword'}),'השוואת-מועמדים.doc');}

$('#fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d&&d.cases){if(confirm('שחזור יחליף את כל הנתונים הקיימים. להמשיך?')){DB=d;DB.settings=Object.assign(defDB().settings,d.settings||{});saveDB();currentCaseId=null;setView('cases');toast('שוחזר');}}else toast('קובץ לא תקין');}catch(err){toast('שגיאה בקריאת הקובץ');}};
  rd.readAsText(f);e.target.value='';});
$('#imgInput').addEventListener('change',e=>{if(e.target.files.length)handleImages(e.target.files);e.target.value='';});
$('#btnExport').addEventListener('click',exportBackup);
$('#btnImport').addEventListener('click',()=>$('#fileInput').click());

/* ===== boot ===== */
render();
</script>
</body>
</html>
