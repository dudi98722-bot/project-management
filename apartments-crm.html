function onBbDetMode(){
  var m=val("bb-det-mode"), inp=document.getElementById("bb-details");
  if(!inp) return;
  var on=(m==="set"||m==="append");
  inp.disabled=!on; if(!on) inp.value=""; if(on) inp.focus();
}
function applyBulkBankMoveEdit(ids){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var bank=val("bb-bank"), date=val("bb-date");
  var kind=val("bb-kind").trim(), style=bmStyleVal("bb-style"), subStyle=bmStyleVal("bb-substyle");
  var doc=val("bb-doc")||"__keep", ign=val("bb-ignore")||"__keep";
  var dMode=val("bb-det-mode")||"keep", dTxt=val("bb-details").trim();
  if(!bank && !date && !kind && !style && !subStyle && doc==="__keep" && ign==="__keep" && dMode==="keep"){
    toast("לא נבחר מה לעדכן","warn"); return false; }
  if((dMode==="set"||dMode==="append") && !dTxt){ toast("כתוב את הטקסט שייכנס לפרטים","err"); return false; }
  var n=0, skipped=0;
  ids.forEach(function(id){
    var m=byId(DB.bankMoves,id); if(!m||m.deleted) return;
    if(bank){ m.stmtBankId=bank; m.accountId=""; }
    if(date) m.date=date;
    if(kind) m.kind=kind;
    if(style) m.style=style;
    if(subStyle) m.subStyle=subStyle;
    if(doc!=="__keep") setMoveDocState(m,doc);
    if(ign!=="__keep"){
      /* שורה שכבר הותאמה לא הופכת ל"התעלם" — זה היה מסתיר תשלום קיים */
      if(ign==="1" && moveMatches(m).length){ skipped++; }
      else m.ignored=(ign==="1");
    }
    if(dMode==="set") m.details=dTxt;
    else if(dMode==="append"){ var o=String(m.details||"").trim(); m.details=o?(o+" | "+dTxt):dTxt; }
    else if(dMode==="clear") m.details="";
    n++;
  });
  save();
  toast("עודכנו "+n+" שורות"+(skipped?" · "+skipped+" מותאמות לא סומנו כ\"התעלם\"":""),skipped?"warn":"ok");
  rerender();
  return true;
}
/* ---------- רשימות קטגוריה / תת קטגוריה ----------
   במקום הקלדה חופשית (שיוצרת "שכירות", "שכירות " ו"שכירויות" שונות),
   בוחרים מרשימת הערכים שכבר בשימוש בשורות הבנק. "➕ ערך חדש…" מוסיף
   לרשימה במקום. הרשימה נגזרת מהנתונים — ערך חי כל עוד שורה נושאת אותו. */
function bmStyleValues(field){
  var seen={}, out=[];
  (DB.bankMoves||[]).forEach(function(m){
    if(m.deleted) return;
    var v=String(m[field]||"").trim();
    if(v && !seen[v]){ seen[v]=1; out.push(v); }
  });
  return out.sort(function(a,b){ return a.localeCompare(b,"he"); });
}
function bmStyleSelect(id,field,cur,emptyLabel){
  cur=String(cur||"").trim();
  var vals=bmStyleValues(field);
  if(cur && vals.indexOf(cur)<0) vals.unshift(cur);
  return '<select id="'+id+'" onchange="bmStylePick(this)">'+
    '<option value="">'+esc(emptyLabel||"—")+'</option>'+
    vals.map(function(v){ return '<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(v)+'</option>'; }).join("")+
    '<option value="__add">➕ ערך חדש…</option></select>';
}
function bmStylePick(sel){
  if(sel.value!=="__add") return;
  var v=prompt("ערך חדש:",""); v=(v||"").trim();
  if(!v){ sel.value=""; return; }
  var has=Array.prototype.some.call(sel.options,function(o){ return o.value===v; });
  if(!has){
    var o=document.createElement("option"); o.value=v; o.textContent=v;
    sel.insertBefore(o, sel.querySelector('option[value="__add"]'));
  }
  sel.value=v;
}
function bmStyleVal(id){ var v=val(id); return v==="__add"?"":String(v||"").trim(); }

          matches:[],ignored:false,note:"",deleted:false});

    '<b>מדביק כמה בנקים יחד?</b> מפה למטה את עמודת "בנק" — הבחירה כאן תשמש רק לשורות שאין בהן בנק.</div></div>'+

/* נבחר "➕ בנק חדש" — שואלים שם, מוסיפים לרשימה ובוחרים אותו */
function onBankAccPick(){
  var sel=document.getElementById("bi-acc"); if(!sel) return;
  var v=sel.value;
  if(v!=="__add"){ BIMP.stmtBankId=v; renderBankPreview(); return; }
  var name=prompt("שם הבנק (למשל: מרכנתיל 342, מזרחי עסקי):","");
  name=(name||"").trim();
  if(!name){ sel.value=BIMP.stmtBankId||""; return; }
  var b=addStmtBank(name);
  save(); toast('נוסף הבנק "'+b.name+'" לרשימה',"ok");
  BIMP.stmtBankId=b.id;
  sel.innerHTML=stmtBanks().map(function(x){
      return '<option value="'+x.id+'"'+(BIMP.stmtBankId===x.id?" selected":"")+'>🏦 '+esc(x.name)+'</option>'; }).join("")+
    '<option value="__add">➕ בנק חדש…</option>';
  renderBankPreview();
}
function onBankPaste(){
  var txt=val("bm-paste");
  if(!txt.trim()){ BIMP.grid=null; document.getElementById("bm-map").innerHTML=""; return; }
  onBankGrid(parseDelimited(txt, txt.indexOf("\t")>=0?"\t":","),"הדבקה");
}
function onBankGrid(grid){
  grid=(grid||[]).filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); });
  if(!grid.length){ toast("לא נמצאו שורות","err"); return; }
  BIMP.grid=grid;
  /* ניחוש עמודות לפי הכותרות — רוב דפי הבנק נראים דומה */
  var head=grid[0].map(function(c){ return normKey(c); });
  function find(){ var pats=Array.prototype.slice.call(arguments);
    for(var i=0;i<head.length;i++) for(var j=0;j<pats.length;j++) if(head[i].indexOf(pats[j])>=0) return i;
    return -1; }
  BIMP.map.date=find("תאריך ערך","תאריך");
  BIMP.map.credit=find("זכות","הפקדה","זיכוי");
  BIMP.map.debit=find("חובה","משיכה","חיוב");
  BIMP.map.amount=find("סכום");
  BIMP.map.name=find("שם");
  BIMP.map.bank=find("בנק");
  BIMP.map.kind=find("סוג");
  BIMP.map.subStyle=find("תת קטגוריה","תת-קטגוריה");
  BIMP.map.style=find("קטגוריה","סגנון");
  if(BIMP.map.style===BIMP.map.subStyle) BIMP.map.style=-1;
  BIMP.map.details=find("פרטים","תיאור","פירוט","פעולה","תנועה");
  BIMP.map.doc=find("מסמך");
  BIMP.map.ref=find("אסמכתא","אסמכת","reference");
  BIMP.hasHeader=(BIMP.map.date>=0||BIMP.map.name>=0||BIMP.map.details>=0);
  renderBankMap();
}
function renderBankMap(){
  var box=document.getElementById("bm-map"); if(!box||!BIMP.grid) return;
  var head=BIMP.grid[0].map(function(c,i){ return String(c||"").trim()||("עמודה "+(i+1)); });
  function sel(key,cur){
    return '<select onchange="BIMP.map.'+key+'=Number(this.value);renderBankPreview()">'+
      '<option value="-1">— ללא —</option>'+
      head.map(function(h,i){ return '<option value="'+i+'"'+(i===cur?" selected":"")+'>'+esc(h)+'</option>'; }).join("")+
      '</select>';
  }
  box.innerHTML='<div class="section-title">התאמת עמודות</div>'+
    '<div class="field"><label><input type="checkbox" style="width:auto" '+(BIMP.hasHeader?"checked":"")+
      ' onchange="BIMP.hasHeader=this.checked;renderBankPreview()"> השורה הראשונה היא שורת כותרות</label></div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>תאריך</label>'+sel("date",BIMP.map.date)+'</div>'+
      '<div class="field"><label>שם</label>'+sel("name",BIMP.map.name)+'</div>'+
      '<div class="field"><label>זכות (כניסת כסף)</label>'+sel("credit",BIMP.map.credit)+
        '<div class="hint">אם בדף שלך יש עמודת "סכום" אחת — השאר ריק והשתמש בשדה הסכום</div></div>'+
      '<div class="field"><label>סכום (עמודה אחת)</label>'+sel("amount",BIMP.map.amount)+'</div>'+
      '<div class="field"><label>בנק (עמודה בקובץ)</label>'+sel("bank",BIMP.map.bank)+
        '<div class="hint">מדביקים כמה בנקים יחד? מפים כאן את עמודת הבנק — כל שורה תשויך לבנק שכתוב בה. '+
        'בנק שאינו ברשימה ייווצר אוטומטית.</div></div>'+
      '<div class="field"><label>סוג</label>'+sel("kind",BIMP.map.kind)+'</div>'+
      '<div class="field"><label>קטגוריה</label>'+sel("style",BIMP.map.style)+'</div>'+
      '<div class="field"><label>תת קטגוריה</label>'+sel("subStyle",BIMP.map.subStyle)+'</div>'+
      '<div class="field"><label>פרטים</label>'+sel("details",BIMP.map.details)+'</div>'+
      '<div class="field"><label>יש מסמך</label>'+sel("doc",BIMP.map.doc)+'</div>'+
      '<div class="field"><label>אסמכתא</label>'+sel("ref",BIMP.map.ref)+'</div>'+
    '</div><div id="bm-preview"></div>';
  renderBankPreview();
}
function bankImportRows(){
  if(!BIMP.grid) return [];
  var m=BIMP.map;
  var rows=BIMP.hasHeader?BIMP.grid.slice(1):BIMP.grid;
  var out=[];
  rows.forEach(function(r){
    /* רק כניסות כסף: עמודת זכות, או סכום חיובי בעמודה אחת */
    var amt=0;
    if(m.credit>=0) amt=impNum(r[m.credit]);
    else if(m.amount>=0) amt=impNum(r[m.amount]);
    if(!(amt>0.001)) return;
    out.push({
      date:m.date>=0?impDate(r[m.date]):todayISO(),
      amount:round2(amt),
      name:m.name>=0?String(r[m.name]||"").trim():"",
      bankName:m.bank>=0?String(r[m.bank]||"").trim():"",
      kind:m.kind>=0?String(r[m.kind]||"").trim():"",
      style:m.style>=0?String(r[m.style]||"").trim():"",
      subStyle:m.subStyle>=0?String(r[m.subStyle]||"").trim():"",
      details:m.details>=0?String(r[m.details]||"").trim():"",
      hasDoc:m.doc>=0?unitCellChecked(r[m.doc]):false,
      description:"",
      ref:m.ref>=0?String(r[m.ref]||"").trim():""
    });
  });
  return out;
}
/* הבנק של שורה בייבוא: מהעמודה שמופתה, אחרת הבורר.
   create=true — בנק שאינו ברשימה נוצר; אחרת מוחזר "" (לתצוגה מקדימה). */
function bankIdForRow(r,create){
  if(r.bankName){
    var ex=stmtBanks().filter(function(b){ return normKey(b.name)===normKey(r.bankName); })[0];
    if(ex) return ex.id;
    if(create){ var nb=addStmtBank(r.bankName); return nb?nb.id:""; }
    return "";                       // חדש — ייווצר בייבוא עצמו
  }
  return BIMP.stmtBankId||"";
}
function bankRowIsDup(r,bankId){
  function sig(x){ return normKey([x.name,x.details,x.description].filter(Boolean).join("|")); }
  return allBankMoves().some(function(m){
    return (m.stmtBankId||m.accountId)===bankId && m.date===r.date &&
      Math.abs((Number(m.amount)||0)-r.amount)<0.01 &&
      (r.ref ? String(m.ref||"")===r.ref : sig(m)===sig(r));
  });
}
function renderBankPreview(){
  var box=document.getElementById("bm-preview"); if(!box) return;
  var rows=bankImportRows();
  if(!rows.length){ box.innerHTML='<div class="empty">לא זוהו שורות של כניסת כסף — בדוק את התאמת העמודות</div>'; return; }
  var byCol=BIMP.map.bank>=0;
  var dup=rows.filter(function(r){ var b=bankIdForRow(r,false); return b&&bankRowIsDup(r,b); }).length;
  var sum=round2(rows.reduce(function(s,r){ return s+r.amount; },0));
  /* פירוט לפי בנק — כשמדביקים כמה בנקים יחד */
  var perBank={};
  rows.forEach(function(r){
    var nm=r.bankName||stmtBankName(BIMP.stmtBankId)||"(לא צוין)";
    perBank[nm]=perBank[nm]||{n:0,sum:0}; perBank[nm].n++; perBank[nm].sum=round2(perBank[nm].sum+r.amount);
  });
  var bankKeys=Object.keys(perBank);
  var missing=byCol&&!BIMP.stmtBankId?rows.filter(function(r){ return !r.bankName; }).length:0;
  box.innerHTML='<div class="section-title">תצוגה מקדימה — '+rows.length+' שורות, סה"כ '+money(sum)+
      (dup?' <span class="hint neg">· '+dup+' כבר קיימות ויידלגו</span>':'')+'</div>'+
    (bankKeys.length>1?'<div class="hint" style="margin-bottom:6px">לפי בנק: '+
      bankKeys.map(function(k){ return '<b>'+esc(k)+'</b> ('+perBank[k].n+' · '+money(perBank[k].sum)+')'; }).join(" · ")+'</div>':'')+
    (missing?'<div class="hint neg" style="margin-bottom:6px">'+missing+' שורות בלי ערך בעמודת הבנק — בחר בנק ברירת מחדל בבורר למעלה.</div>':'')+
    '<div class="table-wrap" style="max-height:240px"><table class="tbl"><thead><tr>'+
    '<th>תאריך</th><th>שם</th><th>סכום</th>'+(byCol?'<th>בנק</th>':'')+
    '<th>סוג</th><th>קטגוריה</th><th>תת קטגוריה</th><th>פרטים</th><th>יש מסמך</th><th></th></tr></thead><tbody>'+
    rows.slice(0,15).map(function(r){
      var bid=bankIdForRow(r,false);
      var d=bid&&bankRowIsDup(r,bid);
      var isNew=r.bankName&&!bid;
      return '<tr'+(d?' style="opacity:.5"':'')+'><td>'+dateHe(r.date)+'</td>'+
        '<td>'+esc(r.name||"—")+'</td><td>'+money(r.amount)+'</td>'+
        (byCol?'<td>'+(r.bankName?esc(r.bankName)+(isNew?' <span class="badge badge-warn badge-unit">חדש</span>':'')
                                 :'<span class="muted">'+esc(stmtBankName(BIMP.stmtBankId)||"—")+'</span>')+'</td>':'')+
        '<td>'+esc(r.kind||"—")+'</td><td>'+esc(r.style||"—")+'</td><td>'+esc(r.subStyle||"—")+'</td>'+
        '<td class="muted">'+esc(r.details||"—")+'</td>'+
        '<td>'+(r.hasDoc?"✔":"")+'</td>'+
        '<td>'+(d?'<span class="badge badge-muted badge-unit">קיימת</span>':'')+'</td></tr>';
    }).join("")+'</tbody></table></div>'+
    (rows.length>15?'<div class="hint">מוצגות 15 הראשונות מתוך '+rows.length+'.</div>':'');
}
function applyBankImport(){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var rows=bankImportRows();
  if(!rows.length){ toast("אין שורות לייבוא","err"); return false; }
  var byCol=BIMP.map.bank>=0;
  if(!byCol && !BIMP.stmtBankId){ toast("בחר בנק מהרשימה (או מפה עמודת בנק)","err"); return false; }
  /* שורה בלי ערך בעמודת הבנק נופלת לבנק שנבחר בבורר */
  if(byCol && !BIMP.stmtBankId && rows.some(function(r){ return !r.bankName; })){
    toast("יש שורות בלי בנק בעמודה — בחר בנק ברירת מחדל בבורר למעלה","err"); return false;
  }
  var added=0, skipped=0, newBanks=[];
  rows.forEach(function(r){
    var before=stmtBanks().length;
    var bankId=bankIdForRow(r,true);
    if(stmtBanks().length>before) newBanks.push(r.bankName);
    if(!bankId){ skipped++; return; }
    if(bankRowIsDup(r,bankId)){ skipped++; return; }
    DB.bankMoves.push({id:uid(),stmtBankId:bankId,apartmentId:"",
      date:r.date,amount:r.amount,
      name:r.name,kind:r.kind,style:r.style,subStyle:r.subStyle,details:r.details,hasDoc:r.hasDoc,
      description:r.description,ref:r.ref,
      matches:[],ignored:false,note:"",deleted:false});
    added++;
  });
  save();
  toast("נוספו "+added+" שורות"+(skipped?" · "+skipped+" כבר היו קיימות ודולגו":"")+
    (newBanks.length?" · נוצרו בנקים: "+newBanks.filter(function(x,i,arr){return arr.indexOf(x)===i;}).join(", "):""),"ok");
  rerender();
  return true;
}

/* ============================================================
   דמי ניהול על הכנסות
   ------------------------------------------------------------
   מנהל מקבל אחוז מההכנסות שסומנו כחייבות בדמי ניהול (i.mgmtOn).
   האחוז יושב על המנהל (m.incomePct), התשלומים אליו ב-DB.incMgmtPays,
   והמסך מראה לכל מנהל: חייב / שולם / נותר.
   ============================================================ */
function incMgmtOwed(aptId,mgrId){
  var m=byId(DB.managers,mgrId); var pct=Number(m&&m.incomePct)||0; if(!pct) return 0;
  return round2(apIncomeCalc(aptId).filter(function(i){ return !!i.mgmtOn; })
    .reduce(function(s,i){ return s+(Number(i.amount)||0)*pct/100; },0));
}
/* החוב למנהל הוא הוצאה אמיתית של הפרוייקט: לכל מנהל מוחזק שלב אוטומטי
   "דמי ניהול הכנסות — <שם>" שהסכום שלו מסונכרן לחוב, והתשלומים אליו
   הם תשלומים רגילים על השלב — כך הם מופיעים בהוצאות, בתשלומים,
   בקטגוריות, בבנק ובחלוקת השותפים, בלי מערכת תשלומים נפרדת. */
function incMgmtExpense(aptId,mgrId){
  return active(DB.expenses).filter(function(e){
    return e.apartmentId===aptId && e.incMgmtManagerId===mgrId; })[0]||null;
}
function ensureIncMgmtExpense(aptId,mgrId){
  var owed=incMgmtOwed(aptId,mgrId);
  var e=incMgmtExpense(aptId,mgrId);
  if(!e){
    if(owed<=0.009) return null;
    /* קטגוריית "דמי ניהול" — קיימת או נוצרת */
    var cat=active(DB.categories).filter(function(c){ return normKey(c.name)==="דמי ניהול"; })[0];
    if(!cat){ cat={id:uid(),name:"דמי ניהול",deleted:false}; DB.categories.push(cat); }
    e={id:uid(),apartmentId:aptId,categoryId:cat.id,classification:"ongoing",
      description:"דמי ניהול הכנסות — "+managerName(mgrId),
      amount:owed,date:todayISO(),
      note:"נוצר אוטומטית — הסכום מסונכרן מדמי הניהול על ההכנסות",
      hasInvoice:false,invoiceLink:"",mgmtEnabled:false,mgmtSet:true,
      incMgmtManagerId:mgrId,deleted:false};
    DB.expenses.push(e);
    apPartners(aptId).forEach(function(p){
      DB.expenseSplits.push({id:splitId(e.id,p.partnerId),expenseId:e.id,partnerId:p.partnerId,percent:p.defaultPercent,deleted:false});
    });
  }else{
    e.amount=owed;
    e.description="דמי ניהול הכנסות — "+managerName(mgrId);
  }
  return e;
}
/* סנכרון כל שלבי דמי-הניהול של הפרוייקט (אחרי שינוי אחוזים / סימונים) */
function syncIncMgmtExpenses(aptId){
  apManagers(aptId).forEach(function(m){
    var e=incMgmtExpense(aptId,m.id);
    var owed=incMgmtOwed(aptId,m.id);
    if(e){
      e.amount=owed;
      /* חוב אפס בלי אף תשלום — השלב מיותר ונעלם */
      if(owed<=0.009 && !expPayments(e.id).length) e.deleted=true;
    }else if(owed>0.009) ensureIncMgmtExpense(aptId,m.id);
  });
}
function incMgmtPaid(aptId,mgrId){
  var e=incMgmtExpense(aptId,mgrId);
  return e?round2(expPayments(e.id).reduce(function(s,p){ return s+(Number(p.amount)||0); },0)):0;
}
function openIncomeMgmt(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }

            (can("edit")?' <button class="btn btn-ghost btn-sm" title="מחק מנהל" onclick="delIncMgmtManager(\''+aptId+'\',\''+m.id+'\')">🗑️</button>':'')+
          '</td></tr>';
      }).join("")+'</tbody></table></div>'+
      '<div class="hint">החוב מחושב כאחוז מסך ההכנסות שסומנו למטה, ומוחזק כשלב אוטומטי '+
      '"דמי ניהול הכנסות" בהוצאות הפרוייקט — כך התשלומים מופיעים בהוצאות, בתשלומים, בקטגוריות ובבנק.</div>';
  }
  var incH='<div class="section-title" style="margin-top:14px">על אילו הכנסות יש דמי ניהול '+
    '<span class="hint">('+incs.filter(function(i){return i.mgmtOn;}).length+' מסומנות)</span></div>'+
    '<div class="toolbar"><button class="btn btn-sm" onclick="document.querySelectorAll(\'.img-inc\').forEach(function(c){c.checked=true})">סמן הכל</button>'+
    '<button class="btn btn-ghost btn-sm" onclick="document.querySelectorAll(\'.img-inc\').forEach(function(c){c.checked=false})">נקה הכל</button></div>'+
    '<div class="table-wrap" style="max-height:260px"><table class="tbl"><thead><tr>'+

    incs.map(function(i){

/* קורא את הטופס אל הנתונים ומסנכרן את שלבי ההוצאה (בלי save) */
function saveIncMgmtForm(aptId){
  document.querySelectorAll(".img-pct").forEach(function(inp){
    var m=byId(DB.managers,inp.getAttribute("data-m"));
    if(m) m.incomePct=Number(inp.value)||0;
  });
  document.querySelectorAll(".img-inc").forEach(function(cb){
    var i=byId(DB.income,cb.getAttribute("data-i"));
    if(i) i.mgmtOn=cb.checked;
  });
  syncIncMgmtExpenses(aptId);
}
/* תשלום למנהל — נפתח עורך התשלום הרגיל על שלב דמי הניהול שלו */
function incMgmtPayNow(aptId,mgrId){
  saveIncMgmtForm(aptId);
  var e=ensureIncMgmtExpense(aptId,mgrId);
  if(!e){ toast("אין חוב למנהל הזה — קבע אחוז וסמן הכנסות","warn"); return; }
  save();
  openPaymentEditor(e.id,null);
}
/* מחיקת מנהל ממסך דמי הניהול על ההכנסות — כולל שלב ההוצאה האוטומטי
   שלו והתשלומים עליו. הכל מחיקה רכה, כך שניתן לשחזר מסל המחזור. */
function delIncMgmtManager(aptId,mgrId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  saveIncMgmtForm(aptId);                     // לא לאבד שינויים שהוקלדו בטופס
  var m=byId(DB.managers,mgrId); if(!m) return;
  var e=incMgmtExpense(aptId,mgrId);
  var pays=e?expPayments(e.id):[];
  var paidSum=round2(pays.reduce(function(s,p){ return s+(Number(p.amount)||0); },0));
  var feesN=active(DB.expenseManagerFees).filter(function(f){ return f.managerId===mgrId; }).length;
  var msg='למחוק את "'+m.name+'"?';
  if(pays.length) msg+='\n\nיימחקו גם '+pays.length+' תשלומים אליו ('+money(paidSum)+') והשלב "דמי ניהול הכנסות" שלו.';
  if(feesN) msg+='\n\nדמי הניהול שלו יוסרו גם מ-'+feesN+' שלבי הוצאה.';
  msg+='\n\nהכל עובר לסל המחזור וניתן לשחזר.';
  if(!confirm(msg)) return;
  m.deleted=true;
  if(e){ e.deleted=true; pays.forEach(function(p){ p.deleted=true; }); }
  DB.expenseManagerFees.forEach(function(f){ if(f.managerId===mgrId) f.deleted=true; });
  save(); toast('"'+m.name+'" הועבר לסל המחזור',"ok"); rerender();
  openIncomeMgmt(aptId);
}
function addIncMgmtManager(aptId){
  var nm=val("img-new-name").trim();
  if(!nm){ toast("הזן שם מנהל","err"); return; }
  saveIncMgmtForm(aptId);
  DB.managers.push({id:uid(),apartmentId:aptId,name:nm,defaultFeePercent:0,
    incomePct:Number(val("img-new-pct"))||0,deleted:false});
  save(); toast('נוסף המנהל "'+nm+'"',"ok");
  openIncomeMgmt(aptId);
}

/* ---------- ייבוא הכנסות מאקסל / הדבקה ----------
   כמו ייבוא ההפקדות: קובץ או הדבקה, מיפוי עמודות עם ניחוש אוטומטי,
   תצוגה מקדימה ודילוג על שורות שכבר קיימות. עמודות היחידות מזוהות
   לפי שמות היחידות של הפרוייקט (וילה 1, יחידה 2…) — סימון בתא = הושכרה. */
var IIMP={grid:null,hasHeader:true,map:{date:-1,desc:-1,amount:-1,note:-1,start:-1,end:-1,paid:-1},units:{},aptId:null};

    (booking?'<div class="field full"><label style="font-weight:400">'+

      '</div><div class="hint">אם בקובץ יש עמודת "סך ששולם" — מפה אותה למטה, והתשלום יירשם לפי הסכום שבה. '+
      'אחרת יירשם התשלום בסכום המלא של כל שורה.</div></div></div>':'')+
    '<div class="toolbar"'+(booking?'':' style="margin-top:8px"')+'>'+
      '<button class="btn btn-primary btn-sm" onclick="document.getElementById(\'ii-file\').click()">📁 קובץ (xlsx / csv)</button>'+
      '<input type="file" id="ii-file" accept=".xlsx,.csv,.txt" style="display:none" onchange="readSheetFile(this,onIncomeGrid,\'ii-file-name\')">'+
      '<span id="ii-file-name" class="muted"></span>'+
    '</div>'+
    '<div class="hint">או להדביק ישירות מאקסל — אפשר עשרות שורות בבת אחת:</div>'+
    '<textarea id="ii-paste" rows="5" style="width:100%;font-family:monospace;font-size:12px" '+
      'placeholder="הדבק כאן שורות מאקסל…" oninput="onIncomePaste()"></textarea>'+
    '<div id="ii-map"></div>',
    saveLabel:"הוסף הכנסות",onSave:function(){ return applyIncomeImport(); }});
}
function onIncomePaste(){
  var txt=val("ii-paste");
  if(!txt.trim()){ IIMP.grid=null; document.getElementById("ii-map").innerHTML=""; return; }
  onIncomeGrid(parseDelimited(txt, txt.indexOf("\t")>=0?"\t":","),"הדבקה");
}
function onIncomeGrid(grid){
  grid=(grid||[]).filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); });
  if(!grid.length){ toast("לא נמצאו שורות","err"); return; }
  IIMP.grid=grid;
  var head=grid[0].map(function(c){ return normKey(c); });
  function find(){ var pats=Array.prototype.slice.call(arguments);
    for(var j=0;j<pats.length;j++) for(var i=0;i<head.length;i++) if(head[i].indexOf(normKey(pats[j]))>=0) return i;
    return -1; }
  IIMP.map.desc=find("שם","תיאור","אורח","פירוט");
  IIMP.map.amount=find("סך מחיר","מחיר","סכום");
  IIMP.map.start=find("כניסה","תחילת","מתאריך");
  IIMP.map.end=find("יציאה","סיום","עד תאריך");
  IIMP.map.note=find("הערה");
  IIMP.map.paid=find("סך ששולם","שולם");
  /* "תאריך" אחרון — אחרת הוא בולע את "תאריך כניסה" */
  IIMP.map.date=find("תאריך הזמנה","תאריך");
  if(IIMP.map.date===IIMP.map.start||IIMP.map.date===IIMP.map.end) IIMP.map.date=-1;
  /* עמודות היחידות — לפי שמות היחידות של הפרוייקט */
  IIMP.units={};
  aptUnits(IIMP.aptId).forEach(function(u){
    var ix=head.indexOf(normKey(u));
    if(ix<0) ix=head.findIndex(function(hh){ return hh && hh.indexOf(normKey(u))>=0; });
    IIMP.units[u]=ix;
  });
  IIMP.hasHeader=(IIMP.map.desc>=0||IIMP.map.amount>=0);
  renderIncomeMap();
}
function renderIncomeMap(){
  var box=document.getElementById("ii-map"); if(!box||!IIMP.grid) return;
  var head=IIMP.grid[0].map(function(c,i){ return String(c||"").trim()||("עמודה "+(i+1)); });
  function sel(key,cur,isUnit){
    return '<select onchange="'+(isUnit?('IIMP.units['+JSON.stringify(key)+']'):('IIMP.map.'+key))+'=Number(this.value);renderIncomePreview()">'+
      '<option value="-1">— ללא —</option>'+
      head.map(function(hh,i){ return '<option value="'+i+'"'+(i===cur?" selected":"")+'>'+esc(hh)+'</option>'; }).join("")+
      '</select>';
  }
  var unitsH=aptUnits(IIMP.aptId).map(function(u){
    return '<div class="field"><label>יחידה: '+esc(u)+'</label>'+sel(u,IIMP.units[u],true)+'</div>';
  }).join("");
  box.innerHTML='<div class="section-title">התאמת עמודות</div>'+
    '<div class="field"><label><input type="checkbox" style="width:auto" '+(IIMP.hasHeader?"checked":"")+
      ' onchange="IIMP.hasHeader=this.checked;renderIncomePreview()"> השורה הראשונה היא שורת כותרות</label></div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>תיאור / שם האורח <b>*</b></label>'+sel("desc",IIMP.map.desc)+'</div>'+
      '<div class="field"><label>סכום <b>*</b></label>'+sel("amount",IIMP.map.amount)+'</div>'+
      '<div class="field"><label>תאריך</label>'+sel("date",IIMP.map.date)+'</div>'+
      '<div class="field"><label>תחילת השכרה</label>'+sel("start",IIMP.map.start)+'</div>'+
      '<div class="field"><label>סיום השכרה</label>'+sel("end",IIMP.map.end)+'</div>'+
      '<div class="field"><label>הערה</label>'+sel("note",IIMP.map.note)+'</div>'+
      (aptBookingMode(IIMP.aptId)?'<div class="field"><label>סך ששולם</label>'+sel("paid",IIMP.map.paid)+
        '<div class="hint">אופציונלי — נרשם כתשלום על ההזמנה</div></div>':'')+
      unitsH+
    '</div>'+
    (unitsH?'<div class="hint">בעמודת יחידה, כל תא שאינו ריק (✔ / true / כן / 1) מסמן שהיחידה הושכרה.</div>':'')+
    '<div id="ii-preview"></div>';
  renderIncomePreview();
}
function onIiPaidNow(){
  var w=document.getElementById("ii-paid-wrap"); if(!w) return;
  w.style.display=checked("ii-paidnow")?"block":"none";
}
function unitCellChecked(v){
  var s=normKey(v);
  return s!=="" && s!=="0" && s!=="false" && s!=="לא" && s!=="-" && s!=="—";
}
function incomeImportRows(){
  if(!IIMP.grid) return [];
  var m=IIMP.map;
  var rows=IIMP.hasHeader?IIMP.grid.slice(1):IIMP.grid;
  var out=[];
  rows.forEach(function(r){
    var desc=m.desc>=0?String(r[m.desc]||"").trim():"";
    var amt=m.amount>=0?impNum(r[m.amount]):0;
    if(!desc && !(amt>0.001)) return;               // שורה ריקה
    var start=m.start>=0?impDate(r[m.start]):"";
    /* impDate מחזיר את היום כברירת מחדל — כאן ריק צריך להישאר ריק */
    if(m.start>=0 && !String(r[m.start]||"").trim()) start="";
    var end=m.end>=0?impDate(r[m.end]):"";
    if(m.end>=0 && !String(r[m.end]||"").trim()) end="";
    if(start && end && end<start){ var t=start; start=end; end=t; }
    var date=m.date>=0&&String(r[m.date]||"").trim()?impDate(r[m.date]):(start||todayISO());
    var units=[];
    Object.keys(IIMP.units).forEach(function(u){
      var ix=IIMP.units[u];
      if(ix>=0 && unitCellChecked(r[ix])) units.push(u);
    });
    out.push({desc:desc,amount:round2(amt),date:date,start:start,end:end,
      note:m.note>=0?String(r[m.note]||"").trim():"",units:units,
      paid:m.paid>=0?round2(impNum(r[m.paid])):null,
      bad:(!desc||!(amt>0.001))});
  });
  return out;
}
function incomeRowIsDup(r,aptId){
  return apIncome(aptId).some(function(i){
    return normKey(i.description)===normKey(r.desc) &&
      Math.abs((Number(i.amount)||0)-r.amount)<0.01 && (i.date||"")===r.date;
  });
}
function renderIncomePreview(){
  var box=document.getElementById("ii-preview"); if(!box) return;
  if(IIMP.map.desc<0||IIMP.map.amount<0){ box.innerHTML='<div class="empty">בחר את עמודות התיאור והסכום</div>'; return; }
  var rows=incomeImportRows();
  if(!rows.length){ box.innerHTML='<div class="empty">לא זוהו שורות — בדוק את התאמת העמודות</div>'; return; }
  var ok=rows.filter(function(r){ return !r.bad; });
  var dup=ok.filter(function(r){ return incomeRowIsDup(r,IIMP.aptId); }).length;
  var sum=round2(ok.reduce(function(s,r){ return s+r.amount; },0));
  var hasUnits=aptUnits(IIMP.aptId).length>0;
  box.innerHTML='<div class="section-title">תצוגה מקדימה — '+ok.length+' הכנסות, סה"כ '+money(sum)+
      (dup?' <span class="hint neg">· '+dup+' כבר קיימות ויידלגו</span>':'')+
      (rows.length-ok.length?' <span class="hint neg">· '+(rows.length-ok.length)+' שורות חסרות (תיאור/סכום) יידלגו</span>':'')+'</div>'+
    '<div class="table-wrap" style="max-height:240px"><table class="tbl"><thead><tr>'+
    '<th>תאריך</th><th>תיאור</th>'+(hasUnits?'<th>יחידות</th>':'')+'<th>תקופה</th><th>סכום</th>'+
    (IIMP.map.paid>=0?'<th>שולם</th>':'')+'<th>הערה</th><th></th></tr></thead><tbody>'+
    rows.slice(0,15).map(function(r){
      var d=!r.bad&&incomeRowIsDup(r,IIMP.aptId);
      return '<tr'+(r.bad?' style="background:#fef2f2"':(d?' style="opacity:.5"':''))+'>'+
        '<td>'+dateHe(r.date)+'</td><td>'+esc(r.desc||"—")+'</td>'+
        (hasUnits?'<td>'+esc(r.units.join(" · ")||"—")+'</td>':'')+
        '<td class="muted">'+(r.start?dateHe(r.start)+(r.end?" – "+dateHe(r.end):""):"—")+'</td>'+
        '<td>'+money(r.amount)+'</td>'+
        (IIMP.map.paid>=0?'<td>'+(r.paid?money(r.paid):'<span class="muted">—</span>')+'</td>':'')+
        '<td class="muted">'+esc(r.note)+'</td>'+
        '<td>'+(r.bad?'<span class="badge badge-danger badge-unit">חסר</span>':(d?'<span class="badge badge-muted badge-unit">קיימת</span>':''))+'</td></tr>';
    }).join("")+'</tbody></table></div>'+
    (rows.length>15?'<div class="hint">מוצגות 15 הראשונות מתוך '+rows.length+'.</div>':'');
}
function applyIncomeImport(){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var aptId=IIMP.aptId;
  if(IIMP.map.desc<0||IIMP.map.amount<0){ toast("בחר את עמודות התיאור והסכום","err"); return false; }
  var rows=incomeImportRows().filter(function(r){ return !r.bad; });
  if(!rows.length){ toast("אין שורות תקינות לייבוא","err"); return false; }
  var dest=document.getElementById("ii-dest")?val("ii-dest"):"";
  var booking=aptBookingMode(aptId);
  var paidNow=booking&&checked("ii-paidnow");
  var mth=val("ii-paid-method")||"transfer"; if(mth==="__new") mth="transfer";
  var added=0, skipped=0, paidN=0;
  rows.forEach(function(r){
    if(incomeRowIsDup(r,aptId)){ skipped++; return; }
    var inc={id:uid(),apartmentId:aptId,description:r.desc,amount:r.amount,
      date:r.date,receivedBy:(booking?"":dest),split:null,
      units:r.units.length?r.units:null,startDate:r.start,endDate:r.end,
      note:r.note,deleted:false};
    DB.income.push(inc);
    /* עמודת "סך ששולם" גוברת על הסימון הכללי; 0 = לא שולם כלום */
    var pAmt=(r.paid!=null)?r.paid:(paidNow?r.amount:0);
    if((paidNow||r.paid!=null) && pAmt>0.009){
      markIncomePaid(inc,{amount:Math.min(pAmt,r.amount),date:r.date,method:mth,dest:dest});
      paidN++;
    }
    added++;
  });
  save();
  toast("נוספו "+added+" הכנסות"+(paidN?" · "+paidN+" עם תשלום":"")+(skipped?" · "+skipped+" כבר היו קיימות ודולגו":""),"ok");
  rerender();
  return true;
}

/* ---------- הכנסה מרוכזת — כמה הכנסות בבת אחת ----------
   שורות ריקות מדולגות בשקט, כך שאפשר להשאיר שורות מיותרות ולא להילחם בטופס. */
function openBulkIncome(aptId){

      '<div class="field"><label>למי נכנס הכסף (לכל השורות)</label><select id="bi-dest">'+destSel+'</select></div>'+
      '<div class="field"><label>תאריך ברירת מחדל</label><input id="bi-date" type="date" value="'+todayISO()+'">'+
        '<div class="hint">שורה בלי תאריך משלה תקבל את התאריך הזה</div></div>'+
    '</div>'+
    /* במצב הזמנות — אפשר לרשום את כל השורות גם כתשלום שנגבה */
    (booking?'<div class="field full" style="margin-bottom:8px"><label style="font-weight:400">'+
      '<input type="checkbox" id="bi-paidnow" onchange="onBiPaidNow()" style="width:auto;margin-inline-end:6px">'+
      'כל השורות כבר נגבו — רשום לכל אחת גם תשלום מלא</label>'+
      '<div id="bi-paid-wrap" style="display:none;padding-top:6px"><div class="form-grid">'+
        '<div class="field"><label>אמצעי תשלום</label><select id="bi-paid-method">'+methodOptions("transfer")+'</select></div>'+
      '</div><div class="hint">התשלום יירשם בתאריך של כל שורה, בסכום המלא שלה, ליעד שנבחר למעלה.</div></div></div>':'')+
    '<div class="table-wrap"><table class="tbl"><thead><tr>'+
      '<th style="width:140px">תאריך</th><th>תיאור</th>'+
      (aptUnits(aptId).length?'<th>יחידות שהושכרו</th>':'')+
      '<th style="width:120px">סכום (₪)</th><th>הערה</th><th style="width:30px"></th>'+
    '</tr></thead><tbody id="bi-rows"></tbody></table></div>'+
    '<button class="btn btn-sm" style="margin-top:8px" onclick="addBulkIncomeRow(\''+aptId+'\')">➕ שורה</button>'+
    '<div class="hint" style="margin-top:6px">נשמרות רק שורות שיש בהן תיאור וסכום. חלוקת השותפים — לפי ברירת המחדל של הפרוייקט.</div>',
    saveLabel:"שמור הכל",onSave:function(){ return saveBulkIncome(aptId); }});
  for(var i=0;i<5;i++) addBulkIncomeRow(aptId);

function saveBulkIncome(aptId){
  var dest=val("bi-dest")||"", defDate=val("bi-date")||todayISO();
  var rows=[], bad=0;

    var desc=(tr.querySelector(".bi-desc").value||"").trim();

/* בורר סוג הדוח. מוצג תמיד כשיש שורות מסומנות באחד הסוגים, וגם
   כשכבר נבחר מצב שאינו הרגיל — אחרת אי אפשר לחזור ממנו. */
function reportShowAllBar(aptId){
  var nRep=hiddenFromReportCount(aptId), nFre=hiddenFromFreilichCount(aptId);
  var mode=reportMode();
  if(!nRep && !nFre && mode==="regular") return "";
  var note = mode==="all" ? ("מוצגות כל השורות — כולל "+(nRep+nFre)+" שמסומנות להסתרה")
    : mode==="freilich" ? ("מוסתרות "+(nRep+nFre)+" שורות: "+nRep+" מכל הדוחות + "+nFre+" מדוח פרייליך")
    : (nRep ? (nRep+" שורות מוסתרות מהדוחות") : "כל השורות מוצגות");
  return '<div class="toolbar no-print" style="background:'+(mode==="regular"?"#f8fafc":"#fff7ed")+
    ';border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px">'+
    '<span class="muted" style="align-self:center">סוג הדוח:</span>'+
    Object.keys(REPORT_MODES).map(function(k){
      return '<button class="btn btn-sm'+(mode===k?" btn-primary":"")+'" onclick="setReportMode(\''+k+'\')">'+
        REPORT_MODES[k]+'</button>';
    }).join("")+
    '<div class="sp"></div>'+
    '<span class="'+(mode==="regular"?"muted":"badge badge-warn")+'">'+esc(note)+'</span></div>';
}
function setReportMode(m){ state.params.repMode=m; rerender(); }

/* ============================================================
   דוח קטגוריות — לאן הלך הכסף בפרויקט
   נספרים רק עלים (שלב-אב הוא סיכום ולא הוצאה), כך שאין ספירה כפולה.
   ============================================================ */
function categoryBreakdown(aptId){
  var map={}, order=[];
  function slot(key,name){
    if(!map[key]){ map[key]={key:key,name:name,amount:0,mgmt:0,paid:0,count:0}; order.push(key); }
    return map[key];
  }
  apLeafExpenses(aptId).forEach(function(e){
    var key=e.categoryId||"__none";
    var s=slot(key, e.categoryId?(categoryName(e.categoryId)||"(קטגוריה שנמחקה)"):"ללא קטגוריה");
    s.amount+=Number(e.amount)||0;
    s.mgmt+=expenseMgmtCostLive(e.id);
    s.paid+=expensePaid(e.id);
    s.count++;
  });
  var rows=order.map(function(k){ return map[k]; });
  rows.forEach(function(r){ r.cost=round2(r.amount+r.mgmt); r.rem=round2(r.cost-r.paid);
    r.amount=round2(r.amount); r.mgmt=round2(r.mgmt); r.paid=round2(r.paid); });
  /* הגדולה למעלה, ו"ללא קטגוריה" תמיד אחרונה כדי שלא תסתיר את התמונה */
  rows.sort(function(x,y){
    if((x.key==="__none")!==(y.key==="__none")) return x.key==="__none"?1:-1;
    return y.cost-x.cost;
  });
  return rows;
}
function categoryReportHtml(aptId){
  var a=byId(DB.apartments,aptId);
  var rows=categoryBreakdown(aptId);
  if(!rows.length) return "";
  var total=rows.reduce(function(s,r){return s+r.cost;},0);
  var tagged=rows.filter(function(r){return r.key!=="__none";});
  var h='<div class="card"><h3>🗂️ לפי קטגוריה — '+esc(a.name)+'</h3>';
  if(!tagged.length){
    return h+'<div class="empty">עדיין לא שויכה קטגוריה לאף שלב.<br>'+
      '<span class="hint">פתח שלב לעריכה ובחר קטגוריה (חשמל, אדריכל, ריצוף…), '+
      'או הוסף קטגוריות בהגדרות → סוגי הוצאה.</span></div></div>';
  }
  h+='<div class="table-wrap"><table class="tbl"><thead><tr><th>קטגוריה</th><th>שלבים</th>'+
    '<th>סכום</th>'+(a.hasManagement?'<th>דמי ניהול</th>':'')+'<th>עלות כוללת</th>'+
    '<th>שולם</th><th>נותר</th><th>% מהפרויקט</th><th data-xl-skip="1">התפלגות</th></tr></thead><tbody>';
  var t={amount:0,mgmt:0,cost:0,paid:0,rem:0,count:0};
  rows.forEach(function(r){
    var pct=total>0?(r.cost/total*100):0;
    t.amount+=r.amount; t.mgmt+=r.mgmt; t.cost+=r.cost; t.paid+=r.paid; t.rem+=r.rem; t.count+=r.count;
    h+='<tr'+(r.key==="__none"?' class="muted"':'')+'><td><b>'+esc(r.name)+'</b></td>'+
      '<td>'+r.count+'</td><td>'+money(r.amount)+'</td>'+
      (a.hasManagement?'<td>'+money(r.mgmt)+'</td>':'')+
      '<td><b>'+money(r.cost)+'</b></td><td>'+money(r.paid)+'</td>'+
      '<td class="'+(r.rem>0.01?"neg":"pos")+'">'+money(r.rem)+'</td>'+
      '<td>'+num(round2(pct))+'%</td>'+
      '<td data-xl-skip="1" style="min-width:120px"><div style="background:#eef1f8;border-radius:6px;height:9px;overflow:hidden">'+
        '<div style="background:var(--brand);height:9px;width:'+Math.max(1,Math.min(100,pct)).toFixed(1)+'%"></div></div></td></tr>';
  });
  h+='</tbody><tfoot><tr><td>סה"כ</td><td>'+t.count+'</td><td>'+money(t.amount)+'</td>'+
    (a.hasManagement?'<td>'+money(t.mgmt)+'</td>':'')+
    '<td>'+money(t.cost)+'</td><td>'+money(t.paid)+'</td><td>'+money(t.rem)+'</td>'+
    '<td>100%</td><td></td></tr></tfoot></table></div>';
  var none=rows.filter(function(r){return r.key==="__none";})[0];
  if(none && none.count) h+='<div class="hint" style="margin-top:8px">'+none.count+
    ' שלבים עדיין בלי קטגוריה ('+money(none.cost)+'). שייך אותם כדי שהדוח יהיה מלא.</div>';
  return h+'</div>';
}

/* ============================================================
   דוח קטגוריה לפי תקופה — שורה לקטגוריה, עמודה לשנה או לחודש
   הסכום הוא עלות השלב (כולל דמי ניהול), לפי תאריך השלב.
   נספרים רק עלים — כמו בדוח הקטגוריות.
   ============================================================ */
function categoryPeriodReportHtml(aptId,mode){
  var a=byId(DB.apartments,aptId);
  var byMonth=(mode==="month");
  var cols=[], map={}, order=[];
  function slot(key,name){
    if(!map[key]){ map[key]={key:key,name:name,by:{},total:0}; order.push(key); }
    return map[key];
  }
  apLeafExpenses(aptId).forEach(function(e){
    var k=e.date?String(e.date).slice(0,byMonth?7:4):"ללא תאריך";
    if(cols.indexOf(k)<0) cols.push(k);
    var s=slot(e.categoryId||"__none",
      e.categoryId?(categoryName(e.categoryId)||"(קטגוריה שנמחקה)"):"ללא קטגוריה");
    var cost=(Number(e.amount)||0)+expenseMgmtCostLive(e.id);
    s.by[k]=round2((s.by[k]||0)+cost);
    s.total=round2(s.total+cost);
  });
  var rows=order.map(function(k){ return map[k]; });
  var title=byMonth?"📆 קטגוריה לפי חודש":"📆 קטגוריה לפי שנה";
  if(!rows.length) return '<div class="card"><h3>'+title+'</h3><div class="empty">אין שלבים בפרוייקט</div></div>';
  /* "ללא תאריך" תמיד אחרונה; התקופות בסדר עולה */
  cols.sort(function(x,y){
    if(x==="ללא תאריך") return 1; if(y==="ללא תאריך") return -1;
    return x<y?-1:1;
  });
  rows.sort(function(x,y){
    if(x.key==="__none") return 1; if(y.key==="__none") return -1;
    return y.total-x.total;
  });
  function colLabel(k){ return byMonth&&k!=="ללא תאריך" ? k.slice(5,7)+"/"+k.slice(0,4) : k; }
  /* סינון: תקופה ספציפית ו/או קטגוריה ספציפית. המסנן נשמר לכל מצב
     (שנה/חודש) בנפרד, כדי שחודש שנבחר לא "יידבק" לדוח השנתי. */
  var perKey=byMonth?"catRepPerM":"catRepPerY";
  var selPer=Q[perKey]||""; if(selPer && cols.indexOf(selPer)<0) selPer="";
  var selCat=Q.catRepCat||""; if(selCat && !rows.some(function(r){return r.key===selCat;})) selCat="";
  var shownCols=selPer?[selPer]:cols;
  var shownRows=selCat?rows.filter(function(r){return r.key===selCat;}):rows;
  var h='<div class="card"><h3>'+title+' — '+esc(a.name)+'</h3>'+
    '<div class="hint" style="margin-bottom:8px">'+(a.hasManagement?'הסכומים כוללים דמי ניהול. ':'')+
    'התקופה נקבעת לפי תאריך השלב.</div>'+
    '<div class="toolbar">'+
    '<select style="max-width:150px" onchange="Q.'+perKey+'=this.value;rerender()">'+
      '<option value="">'+(byMonth?"כל החודשים":"כל השנים")+'</option>'+
      cols.map(function(c){ return '<option value="'+esc(c)+'"'+(selPer===c?" selected":"")+'>'+esc(colLabel(c))+'</option>'; }).join("")+
    '</select>'+
    '<select style="max-width:170px" onchange="Q.catRepCat=this.value;rerender()">'+
      '<option value="">כל הקטגוריות</option>'+
      rows.map(function(r){ return '<option value="'+esc(r.key)+'"'+(selCat===r.key?" selected":"")+'>'+esc(r.name)+'</option>'; }).join("")+
    '</select>'+
    ((selPer||selCat)?'<button class="btn btn-ghost btn-sm" onclick="Q.'+perKey+'=\'\';Q.catRepCat=\'\';rerender()">✕ נקה</button>':'')+
    '<div class="sp"></div></div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr><th>קטגוריה</th>'+
    shownCols.map(function(c){ return '<th>'+esc(colLabel(c))+'</th>'; }).join("")+
    '<th>סה"כ</th></tr></thead><tbody>';
  var colTot={}, grand=0;
  shownRows.forEach(function(r){
    /* בסינון תקופה — סה"כ השורה הוא של התקופה שנבחרה בלבד */
    var rowTot=selPer?round2(r.by[selPer]||0):r.total;
    h+='<tr'+(r.key==="__none"?' class="muted"':'')+'><td><b>'+esc(r.name)+'</b></td>';
    shownCols.forEach(function(c){
      var v=r.by[c]||0; colTot[c]=round2((colTot[c]||0)+v);
      h+='<td>'+(v?money(v):'<span class="muted">—</span>')+'</td>';
    });
    grand=round2(grand+rowTot);
    h+='<td><b>'+money(rowTot)+'</b></td></tr>';
  });
  if(!shownRows.length) h+='<tr><td colspan="'+(shownCols.length+2)+'" class="empty">אין נתונים לסינון הזה</td></tr>';
  h+='</tbody><tfoot><tr><td>סה"כ</td>'+
    shownCols.map(function(c){ return '<td>'+money(colTot[c]||0)+'</td>'; }).join("")+
    '<td>'+money(grand)+'</td></tr></tfoot></table></div></div>';
  return h;
}
function categoryYearReportHtml(aptId){ return categoryPeriodReportHtml(aptId,"year"); }
function categoryMonthReportHtml(aptId){ return categoryPeriodReportHtml(aptId,"month"); }

/* ============================================================
   דוח הכנסות לפי שנה — שורה לשנה: כמה הזמנות, המחיר המלא,
   כמה התקבל בפועל (לפי תאריך התשלום) וכמה חוב נשאר.
   ============================================================ */
function incomeYearReportHtml(aptId){
  var a=byId(DB.apartments,aptId);
  var years={};
  function Y(k){ return years[k]=years[k]||{n:0,full:0,got:0}; }
  apIncomeCalc(aptId).forEach(function(i){
    var k=i.date?String(i.date).slice(0,4):"ללא תאריך";
    var y=Y(k); y.n++; y.full=round2(y.full+(Number(i.amount)||0));
    if(incomeTracked(i)){
      incomePays(i).forEach(function(g){
        var kg=(g.date||i.date)?String(g.date||i.date).slice(0,4):k;
        Y(kg).got=round2(Y(kg).got+(Number(g.amount)||0));
      });
    }else if(i.date) y.got=round2(y.got+(Number(i.amount)||0));
  });
  var keys=Object.keys(years).sort(function(x,y){
    if(x==="ללא תאריך") return 1; if(y==="ללא תאריך") return -1;
    return x<y?-1:1;
  });
  if(!keys.length) return '<div class="card"><h3>📆 הכנסות לפי שנה</h3><div class="empty">אין הכנסות בפרוייקט</div></div>';
  var h='<div class="card"><h3>📆 הכנסות לפי שנה — '+esc(a.name)+'</h3>'+
    '<div class="hint" style="margin-bottom:8px">"הכנסות" לפי תאריך ההכנסה (מחיר מלא); "התקבל" לפי תאריך התשלום בפועל. '+
    'הכנסה בלי מעקב תשלומים נספרת כאילו התקבלה בתאריך שלה.</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>שנה</th><th>הזמנות</th><th>הכנסות (מחיר)</th><th>התקבל</th><th>הפרש</th></tr></thead><tbody>';
  var t={n:0,full:0,got:0};
  keys.forEach(function(k){
    var y=years[k]; var diff=round2(y.full-y.got);
    t.n+=y.n; t.full=round2(t.full+y.full); t.got=round2(t.got+y.got);
    h+='<tr><td><b>'+esc(k)+'</b></td><td>'+y.n+'</td>'+
      '<td>'+money(y.full)+'</td><td>'+money(y.got)+'</td>'+
      '<td class="'+(diff>0.01?"neg":"pos")+'">'+money(diff)+'</td></tr>';
  });
  var td=round2(t.full-t.got);
  h+='</tbody><tfoot><tr><td>סה"כ</td><td>'+t.n+'</td><td>'+money(t.full)+'</td>'+
    '<td>'+money(t.got)+'</td><td class="'+(td>0.01?"neg":"pos")+'">'+money(td)+'</td></tr></tfoot></table></div>'+
    '<div class="hint">ההפרש בשורת שנה יכול להיות שלילי כשתשלומים על הזמנות משנה קודמת התקבלו בשנה הזו.</div></div>';
  return h;
}

/* ============================================================
   סיכום חודשי לפרוייקט — שורה לחודש: הכנסות מול מה שהתקבל,
   הוצאות מול מה ששולם, דמי ניהול, משיכות ויתרה.
   "התקבל" = תשלומי הזמנות לפי תאריך התשלום; הכנסה בלי מעקב תשלומים
   נספרת במלואה בתאריך שלה. תשלומי "שווה ערך" אוטומטיים אינם תזרים
   ולכן לא נספרים ב"שולם".
   ============================================================ */
function yearlySummaryReportHtml(aptId){ return periodSummaryReportHtml(aptId,"year"); }
function monthlySummaryReportHtml(aptId){ return periodSummaryReportHtml(aptId,"month"); }
function periodSummaryReportHtml(aptId,mode){
  var byMonth=(mode!=="year");
  var a=byId(DB.apartments,aptId);
  var months={};
  function M(k){ return months[k]=months[k]||{incFull:0,incGot:0,expCost:0,expPaid:0,mgmtPaid:0,wd:0}; }
  function mk(d){ return d?String(d).slice(0,byMonth?7:4):""; }
  /* הכנסות — מחיר מלא לפי תאריך ההכנסה; התקבל לפי תאריך התשלום */
  apIncomeCalc(aptId).forEach(function(i){
    var k=mk(i.date); if(k) M(k).incFull+=Number(i.amount)||0;
    if(incomeTracked(i)) incomePays(i).forEach(function(g){
      var kg=mk(g.date||i.date); if(kg) M(kg).incGot+=Number(g.amount)||0;
    });
    else if(k) M(k).incGot+=Number(i.amount)||0;
  });
  /* הוצאות — עלות לפי תאריך השלב; שולם לפי תאריך התשלום (בלי אוטומטיים).
     שלבי "דמי ניהול הכנסות" מוצגים בעמודה משלהם ולא נספרים פעמיים. */
  var expIds={}, incMgmtExpIds={};
  apLeafExpenses(aptId).forEach(function(e){
    expIds[e.id]=1;
    if(e.incMgmtManagerId){ incMgmtExpIds[e.id]=1; return; }
    var k=mk(e.date); if(k) M(k).expCost+=(Number(e.amount)||0)+expenseMgmtCostLive(e.id);
  });
  active(DB.payments).forEach(function(p){
    if(!expIds[p.expenseId]||p.auto) return;
    var k=mk(p.date); if(!k) return;
    if(incMgmtExpIds[p.expenseId]) M(k).mgmtPaid+=Number(p.amount)||0;
    else M(k).expPaid+=Number(p.amount)||0;
  });
  apWithdrawals(aptId).forEach(function(w){
    var k=mk(w.date); if(k) M(k).wd+=Number(w.amount)||0;
  });
  var keys=Object.keys(months).sort();
  var TITLE=byMonth?"📅 סיכום חודשי":"📅 סיכום שנתי";
  if(!keys.length) return '<div class="card"><h3>'+TITLE+'</h3><div class="empty">אין נתונים עם תאריכים בפרוייקט</div></div>';
  var anyMgmt=keys.some(function(k){ return months[k].mgmtPaid>0.01; });
  var anyWd=keys.some(function(k){ return months[k].wd>0.01; });
  var h='<div class="card"><h3>'+TITLE+' — '+esc(a.name)+'</h3>'+
    '<div class="hint" style="margin-bottom:8px">היתרה בפועל = התקבל מהכנסות − שולם להוצאות'+
    (anyMgmt?' − דמי ניהול ששולמו':'')+(anyWd?' − משיכות רווח':'')+'. העמודה האחרונה — היתרה המצטברת.</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr><th>'+(byMonth?"חודש":"שנה")+'</th>'+
    '<th>הכנסות (מחיר)</th><th>התקבל</th><th>הוצאות (עלות)</th><th>שולם להוצאות</th>'+
    (anyMgmt?'<th>דמי ניהול</th>':'')+(anyWd?'<th>משיכות רווח</th>':'')+
    '<th>יתרה '+(byMonth?"חודשית":"שנתית")+'</th><th>מצטבר</th></tr></thead><tbody>';
  var t={incFull:0,incGot:0,expCost:0,expPaid:0,mgmtPaid:0,wd:0}, cum=0;
  keys.forEach(function(k){
    var m=months[k];
    var bal=round2(m.incGot-m.expPaid-m.mgmtPaid-m.wd);
    cum=round2(cum+bal);
    Object.keys(t).forEach(function(f){ t[f]+=m[f]; });
    h+='<tr><td><b>'+(byMonth?(k.slice(5,7)+'/'+k.slice(0,4)):k)+'</b></td>'+
      '<td>'+(m.incFull?money(round2(m.incFull)):'<span class="muted">—</span>')+'</td>'+
      '<td>'+(m.incGot?money(round2(m.incGot)):'<span class="muted">—</span>')+'</td>'+
      '<td>'+(m.expCost?money(round2(m.expCost)):'<span class="muted">—</span>')+'</td>'+
      '<td>'+(m.expPaid?money(round2(m.expPaid)):'<span class="muted">—</span>')+'</td>'+
      (anyMgmt?'<td>'+(m.mgmtPaid?money(round2(m.mgmtPaid)):'<span class="muted">—</span>')+'</td>':'')+
      (anyWd?'<td>'+(m.wd?money(round2(m.wd)):'<span class="muted">—</span>')+'</td>':'')+
      '<td class="'+(bal<-0.01?"neg":"pos")+'"><b>'+money(bal)+'</b></td>'+
      '<td class="'+(cum<-0.01?"neg":"pos")+'">'+money(cum)+'</td></tr>';
  });
  var tBal=round2(t.incGot-t.expPaid-t.mgmtPaid-t.wd);
  h+='</tbody><tfoot><tr><td>סה"כ</td><td>'+money(round2(t.incFull))+'</td><td>'+money(round2(t.incGot))+'</td>'+
    '<td>'+money(round2(t.expCost))+'</td><td>'+money(round2(t.expPaid))+'</td>'+
    (anyMgmt?'<td>'+money(round2(t.mgmtPaid))+'</td>':'')+
    (anyWd?'<td>'+money(round2(t.wd))+'</td>':'')+
    '<td class="'+(tBal<-0.01?"neg":"pos")+'">'+money(tBal)+'</td><td></td></tr></tfoot></table></div></div>';
  return h;
}

/* ============================================================
   דוח "לפי מה ששולם בפועל" + התחשבנות בין השותפים
   שלב 1,000,000 שבו שולמו 500,000: שותף 25% חייב כרגע 125,000.
   ============================================================ */
/* ============================================================
   דוח "כל התשלומים של משלם" — בוחרים משלם ומקבלים את כל מה שהכניס
   לפרויקט: ישירות להוצאות, לדמי ניהול, והפקדות לבנק הזמני.
   הסכום כאן שווה בדיוק ל"שילם" שמופיע בשאר הדוחות (partnerPaid),
   ולכן נכללת גם זקיפת חלקו בהכנסה שנכנסה לבנק — אם יש כזו.
   תשלום שיצא מהבנק הזמני אינו נזקף למשלם: הכסף כבר נספר כשהופקד.
   ============================================================ */
function payerReportHtml(aptId){
  var ids=reportPartnerIds(aptId);
  if(!ids.length) return '<div class="card"><h3>💳 כל התשלומים של משלם</h3><div class="empty">אין שותפים בפרויקט</div></div>';
  var sel=(Q.apPayWho && ids.indexOf(Q.apPayWho)>=0) ? Q.apPayWho : ids[0];
  return '<div class="card"><div class="toolbar" style="margin-bottom:8px">'+
    '<h3 style="margin:0">💳 כל התשלומים של משלם</h3>'+
    '<select style="max-width:220px" onchange="Q.apPayWho=this.value;renderPayerReport(\''+aptId+'\')">'+
      ids.map(function(pid){ return '<option value="'+pid+'"'+(pid===sel?" selected":"")+'>'+esc(partnerName(pid))+'</option>'; }).join("")+
    '</select><div class="sp"></div></div>'+
    '<div id="payer-rep-body">'+payerReportBody(aptId,sel)+'</div></div>';
}
function renderPayerReport(aptId){
  var el=document.getElementById("payer-rep-body");
  if(el) el.innerHTML=payerReportBody(aptId,Q.apPayWho);

function payerReportBody(aptId,pid){
  if(!pid) return '<div class="empty">בחר משלם</div>';
  var expIds={}; apLeafExpenses(aptId).forEach(function(e){ expIds[e.id]=1; });
  var rows=[], tExp=0, tMgmt=0, tDep=0, tInc=0;
  active(DB.payments).forEach(function(p){
    if(!expIds[p.expenseId] || p.payerPartnerId!==pid) return;
    if(accountIsBank(p.accountId)) return;   // יצא מהקופה המשותפת, לא מכיסו
    var e=byId(DB.expenses,p.expenseId);
    var isM=(p.recipientType==="manager");
    var amt=Number(p.amount)||0;
    if(isM) tMgmt+=amt; else tExp+=amt;
    rows.push({date:p.date,kind:isM?"mgmt":"exp",
      what:(e?e.description:"—")+(isM?" · "+managerName(p.recipientManagerId):""),
      amount:amt,method:payMethodLabel(p),inv:invoiceStatusText(p),note:p.note||""});
  });
  apDeposits(aptId).forEach(function(d){
    if(d.partnerId!==pid) return;
    var amt=Number(d.amount)||0; tDep+=amt;
    rows.push({date:d.date,kind:"dep",
      what:"הפקדה לבנק הזמני"+(d.fromAccount?" · "+d.fromAccount:""),
      amount:amt,method:METHODS[d.method]||"",inv:"",note:d.note||""});
  });
  bankIncomeEntries(aptId).forEach(function(x){
    var pct=incomePartnerPct(x.i,pid); if(!pct) return;
    var amt=x.amount*pct/100; tInc+=amt;
    rows.push({date:x.date,kind:"inc",
      what:"חלקו ב"+(x.pay?"תשלום הזמנה":"הכנסה")+" שנכנס לבנק · "+(x.i.description||""),
      amount:amt,method:x.pay?(METHODS[x.pay.method]||""):"",inv:"",
      note:num(pct)+"% מתוך "+money(x.amount)});
  });
  /* משיכות רווח — כסף שיצא אל השותף, מוצג בשלילי ויורד מהסה"כ */
  var tWd=0;
  apWithdrawals(aptId).forEach(function(w){
    if(w.partnerId!==pid) return;
    var amt=Number(w.amount)||0; tWd+=amt;
    rows.push({date:w.date,kind:"wd",
      what:"משיכת רווח"+(w.accountId&&accountIsBank(w.accountId)?" מ"+bankName(w.accountId):""),
      amount:-amt,method:METHODS[w.method]||"",inv:"",note:w.note||""});
  });
  if(!rows.length) return '<div class="empty">אין תנועות למשלם הזה בפרויקט</div>';
  rows.sort(function(x,y){ return x.date<y.date?1:-1; });
  var tot=round2(tExp+tMgmt+tDep+tInc-tWd);
  var KIND={exp:'<span class="badge badge-muted">הוצאה</span>',
            mgmt:'<span class="badge badge-mgmt">🧾 דמי ניהול</span>',
            dep:'<span class="badge badge-ok">הפקדה לבנק</span>',
            inc:'<span class="badge badge-warn">הכנסה לבנק</span>',
            wd:'<span class="badge badge-danger">💸 משיכת רווח</span>'};
  var h='<div class="stat-grid">'+
      stat("שילם ישירות להוצאות",money(round2(tExp)))+
      stat("שילם לדמי ניהול",money(round2(tMgmt)))+
      stat("הפקיד לבנק הזמני",money(round2(tDep)))+
      (tInc>0.01?stat("חלקו בהכנסות לבנק",money(round2(tInc))):"")+
      (tWd>0.01?stat("משך רווח",money(round2(tWd)),"neg"):"")+
      stat("סה\"כ הכניס (נטו)",money(tot),"pos")+
    '</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>תאריך</th><th>סוג</th><th>עבור</th><th>סכום</th><th>אמצעי</th><th>חשבונית</th><th>הערה</th>'+
    '</tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr'+(r.kind==="mgmt"?' class="mgmt-row"':'')+'><td>'+dateHe(r.date)+'</td>'+
      '<td>'+KIND[r.kind]+'</td><td>'+esc(r.what)+'</td>'+
      '<td class="'+(r.amount<0?"neg":"")+'"><b>'+money(r.amount)+'</b></td>'+
      '<td>'+esc(r.method)+'</td><td>'+esc(r.inv)+'</td><td>'+esc(r.note)+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="3">סה"כ ('+rows.length+' תנועות)</td>'+
    '<td>'+money(tot)+'</td><td colspan="3"></td></tr></tfoot></table></div>'+
    '<div class="hint">הסכום כאן זהה ל"שילם" שמופיע בדוח המשלמים ובדוח ההתחשבנות. '+
    'תשלום שיצא מ<b>הבנק הזמני</b> אינו מופיע כאן — הכסף כבר נספר למשלם ברגע שהפקיד אותו לבנק, '+
    'וספירה נוספת הייתה כופלת אותו.</div>';
  return h;
}

/* ============================================================
   דוח שותפים — כמה כל שותף אמור לשלם על כל שלב, לפי אחוזיו
   כולל את חלקו בדמי הניהול, כך שהסיכום תואם לדוח המשלמים.
   ============================================================ */
var PR={mode:"matrix",partner:"",q:""};
function renderPartnerReport(){ return withIndex(function(){ return renderPartnerReportInner(); }); }
function renderPartnerReportInner(){
  var el=document.getElementById("partner-report");
  if(el) el.innerHTML=partnerReportHtml(state.params.apartmentId);
}
/* חלקו של שותף בשלב: אחוז × (סכום ההוצאה + דמי הניהול הפעילים) */
function partnerShareInExpense(eId,pid){
  var e=byId(DB.expenses,eId); if(!e) return 0;
  var pct=partnerPctInExpense(eId,pid)/100; if(!pct) return 0;
  return round2(pct*((Number(e.amount)||0)+expenseMgmtCostLive(eId)));
}
/* ============================================================
   חובה לפי מה ששולם בפועל
   ------------------------------------------------------------
   שלב של 1,000,000 שבו שולמו 500,000 בלבד: שותף עם 25% חייב
   כרגע 125,000 ולא 250,000. כך רואים מי מפגר מול מה שכבר יצא
   מהכיס בפועל, ולא מול העלות המלאה שעוד לא שולמה.
   ============================================================ */
function expenseOutflow(eId){          // כל הכסף שיצא על השלב: לספק ולמנהלים
  if(IX && IX.outflow[eId]!==undefined) return IX.outflow[eId];
  var v = isContainer(eId)
    ? round2(expenseChildren(eId).reduce(function(s,k){ return s+expenseOutflow(k.id); },0))
    : round2(expPayments(eId).reduce(function(s,p){ return s+(Number(p.amount)||0); },0));
  if(IX) IX.outflow[eId]=v;
  return v;
}
function partnerDueByPaid(aptId,pid){  // חלקו במה שכבר שולם
  return round2(apLeafExpenses(aptId).reduce(function(s,e){
    var pct=partnerPctInExpense(e.id,pid)/100;
    return pct ? s+pct*expenseOutflow(e.id) : s;
  },0));
}
function partnerDueByPaidOnExpense(eId,pid){
  var pct=partnerPctInExpense(eId,pid)/100;
  return pct ? round2(pct*expenseOutflow(eId)) : 0;
}
/* התחשבנות בין שותפים: מי מעביר למי, במינימום העברות */
function settlementPlan(balances){
  var cred=[],deb=[];
  Object.keys(balances).forEach(function(pid){
    var v=round2(balances[pid]);
    if(v>0.01) cred.push({pid:pid,amt:v});        // שילם יותר — מגיע לו
    else if(v<-0.01) deb.push({pid:pid,amt:-v});  // שילם פחות — חייב
  });
  cred.sort(function(a,b){return b.amt-a.amt;});
  deb.sort(function(a,b){return b.amt-a.amt;});
  var out=[],i=0,j=0;
  while(i<deb.length && j<cred.length){
    var m=Math.min(deb[i].amt,cred[j].amt);
    if(m>0.01) out.push({from:deb[i].pid,to:cred[j].pid,amount:round2(m)});
    deb[i].amt=round2(deb[i].amt-m); cred[j].amt=round2(cred[j].amt-m);
    if(deb[i].amt<=0.01) i++;
    if(cred[j].amt<=0.01) j++;
  }
  return out;
}

/* כמה השותף שילם בפועל על השלב (תשלומיו הישירים, לא מהבנק) */
function partnerPaidOnExpense(eId,pid){
  return round2(expPayments(eId).filter(function(p){
    return p.payerPartnerId===pid && !accountIsBank(p.accountId);
  }).reduce(function(s,p){ return s+(Number(p.amount)||0); },0));
}

  if(!rows) return h+'<div class="empty">לשותף זה אין חלק באף שלב שמתאים לסינון</div></div>';
  h+='<div class="stat-grid" style="margin-bottom:14px">'+
      stat("אמור לשלם",money(tShare))+
      stat("שילם ישירות",money(tPaid),"pos")+
      stat("יתרה",money(tPaid-tShare),(tPaid-tShare)<-0.01?"neg":"pos")+
    '</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>תאריך</th><th>שלב</th><th>סכום השלב</th><th>דמי ניהול</th><th>האחוז שלו</th>'+
    '<th>חלקו לתשלום</th><th>שילם</th><th>יתרה</th></tr></thead><tbody>'+rows+
    '</tbody><tfoot><tr><td colspan="5">סה"כ '+esc(partnerName(pid))+'</td>'+
      '<td>'+money(tShare)+'</td><td>'+money(tPaid)+'</td>'+
      '<td class="'+((tPaid-tShare)<-0.01?"neg":"pos")+'">'+money(tPaid-tShare)+'</td></tr></tfoot></table></div>'+
    '<div class="hint">"שילם" = תשלומים ישירים שלו על אותו שלב. הפקדות לבנק ותשלומים מהבנק נכללים ביתרה הכוללת בדוח המשלמים למעלה.</div></div>';
  return h;
}
function copyPartnerReport(){
  var box=document.getElementById("partner-report");
  var tbl=box&&box.querySelector("table.tbl");
  if(!tbl){ toast("אין טבלה להעתקה","warn"); return; }
  var lines=[];
  tbl.querySelectorAll("tr").forEach(function(tr){
    var cells=[];
    tr.querySelectorAll("th,td").forEach(function(c){
      cells.push(String(c.innerText||"").replace(/\s+/g," ").trim());
    });
    if(cells.join("").trim()) lines.push(cells.join("\t"));
  });
  try{ navigator.clipboard.writeText(lines.join("\n")); toast("הדוח הועתק — אפשר להדביק באקסל","ok"); }
  catch(e){ toast("לא ניתן להעתיק בדפדפן הזה","err"); }
}

/* ---------- דוח דמי ניהול (חוצה פרויקטים) ---------- */

  /* גרפים: תמונת מצב של דמי הניהול */

  var byMgr={};

    var k=normKey(m.name); if(!byMgr[k]) byMgr[k]={name:m.name,cur:0,paid:0};

  var mgrRows=Object.keys(byMgr).map(function(k){

  var any=false;
  apts.forEach(function(a){
    apManagers(a.id).forEach(function(m){
      var cur=managerReceivable(a.id,m.id), def=managerDeferredPending(a.id,m.id), paid=managerPaid(a.id,m.id);
      if(!cur && !def && !paid) return;
      any=true;

      var def=round2(full-cur);
      var paid=round2(expPayments(e.id).filter(function(p){return p.recipientType==="manager";})

        '<td>'+money(e.amount)+'</td><td><b>'+money(cur)+'</b></td>'+
        '<td class="'+(def>0.01?"neg":"")+'">'+money(def)+'</td><td>'+money(full)+'</td>'+

    '<th>דחוי</th><th>סה"כ בסוף</th><th>שולם</th><th>נותר</th></tr></thead><tbody>'+

        '<td>'+esc(payMethodLabel(p))+'</td><td>'+esc(invoiceStatusText(p))+'</td>'+

    (pAny?payRows:'<tr><td colspan="8" class="empty">עדיין לא נרשמו תשלומים למנהלים</td></tr>')+
    '</tbody>'+(pAny?'<tfoot><tr><td colspan="4">סה"כ שולם</td><td><b>'+money(round2(pTot))+'</b></td><td colspan="3"></td></tr></tfoot>':'')+
    '</table></div></div>';

  // דחויים שממתינים לשחרור
  var pend=[], ps=0;
  apts.forEach(function(a){
    apLeafExpenses(a.id).forEach(function(e){
      if(!e.mgmtEnabled) return;
      expMgrFees(e.id).forEach(function(f){
        var mg=byId(DB.managers,f.managerId); if(!mg||mg.deleted) return;
        if((Number(f.pctDeferred)||0)>0 && !f.deferredReleased){
          var amt=mgrFeeFullOnExpense(e.id,f.managerId)-mgrFeeLiveOnExpense(e.id,f.managerId);
          pend.push({apt:a,e:e,f:f,amt:amt}); ps+=amt;

      '<th>פרויקט</th><th>הוצאה</th><th>מנהל</th><th>% דחוי</th><th>מתי ישוחרר</th><th>סכום</th><th></th></tr></thead><tbody>';
    pend.forEach(function(x){

    {key:"bymgr",label:"👤 פירוט לפי מנהל",render:function(){ return byMgrH; }},
    {key:"stages",label:"📋 שלבים עם דמי ניהול",render:function(){ return stagesH; }},
    {key:"pays",label:"💳 תשלומים ששולמו",render:function(){ return paysH; }},
    {key:"pend",label:"⏳ דחויים ממתינים ("+pend.length+")",show:pend.length>0,render:function(){ return pendH; }}
  ],{title:"בחר דוח"});
}

async function runSalvage(){
  if(!CU||CU.role!=="admin"){ toast("אין הרשאה","err"); return; }
  toast("בודק מול הגיבוי בשרת…","ok");
  var j=await api({action:"salvage",codeHash:getAuth()});
  if(j&&j.error==="busy"){
    /* השרת באמצע שמירה של משתמש אחר — ממתינים וחוזרים פעם אחת לבד */
    toast("השרת עסוק בשמירה של משתמש אחר — מנסה שוב בעוד רגע…","warn");
    await new Promise(function(r){ setTimeout(r,5000); });
    j=await api({action:"salvage",codeHash:getAuth()});
  }
  if(!j||!j.ok){
    toast(j&&j.error==="no-backups"
      ? "אין עדיין גיבוי יומי בשרת — נסה שחזור מהיסטוריית הגרסאות של הגיליון"
      : j&&j.error==="busy"
      ? "השרת עדיין עסוק — המתן חצי דקה ונסה שוב"
      : "השחזור נכשל"+((j&&j.error)?": "+j.error:""),"err");
    return;
  }
  if(!j.restored||!j.restored.length){ toast("לא נמצאו טבלאות חסרות — הכל במקום","ok"); return; }
  toast("שוחזרו: "+j.restored.join(", ")+" — הנתונים נטענים מחדש","ok");
  var r=await serverLoad();
  if(r&&r.data&&Array.isArray(r.data.apartments)){
    DB=normalizeDB(r.data); setSyncBase(r.data); saveLocal(); rerender();
  }
}

function addPaymentMethod(){

    '<div class="field"><label>שם האמצעי</label><input id="pmth-name" placeholder="למשל: הוראת קבע, ביט, פייבוקס"></div>',

        toast("האמצעי כבר קיים","err"); return false; }
      DB.settings=DB.settings||{}; DB.settings.paymentMethods=DB.settings.paymentMethods||{};
      var k=normKey(nm).replace(/[^\w֐-׿]+/g,"_").slice(0,30)||("m"+Date.now().toString(36));

      save(); refreshMethods(); toast("נוסף","ok"); rerender();
    }});

function delPaymentMethod(k){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  if(METHODS_BASE[k]){ toast("אמצעי מובנה — לא ניתן למחוק","err"); return; }
  var used=active(DB.payments).filter(function(p){return p.method===k;}).length;
  if(used){ toast("האמצעי משמש ב-"+used+" תשלומים — לא ניתן למחוק","err"); return; }
  if(!confirm('למחוק את אמצעי התשלום "'+METHODS[k]+'"?')) return;
  delete DB.settings.paymentMethods[k];
  save(); refreshMethods(); toast("נמחק","ok"); rerender();
}

/* ============================================================
   הוצאות תקופתיות אוטומטיות
   ------------------------------------------------------------
   כלל שמגדירים פעם אחת ("ריבית שנתית", "ארנונה רבעונית") ובכל מועד
   נוצרת ממנו הוצאה פתוחה בכל הפרוייקטים שנבחרו — כדי שתדע לבדוק
   ולהשלים את הסכום. הבדיקה רצה בטעינה: אם עבר מועד, נוצרות ההוצאות
   שהוחמצו (עד 24 מחזורים לאחור, כדי שלא יווצר מבול מכלל ישן).
   ============================================================ */
var RECUR_EVERY={month:"כל חודש",quarter:"כל רבעון",half:"כל חצי שנה",year:"כל שנה"};
function recurAdvance(iso,every){
  var d=new Date(iso+"T00:00:00Z");
  var add={month:1,quarter:3,half:6,year:12}[every]||12;
  var day=d.getUTCDate();
  d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+add);
  var last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();
  d.setUTCDate(Math.min(day,last));
  return d.toISOString().slice(0,10);
}
function activeRecurring(){ return active(DB.recurring); }
/* יוצר את ההוצאות שהגיע מועדן. מחזיר כמה נוצרו. */
function runRecurring(silent){
  if(!DB || !Array.isArray(DB.recurring) || !can("edit")) return 0;
  var today=todayISO(), made=0, guard=0;
  activeRecurring().forEach(function(r){
    if(r.paused || !r.nextDate) return;
    while(r.nextDate<=today && guard<200){
      guard++;
      var due=r.nextDate;
      (r.apartmentIds||[]).forEach(function(aptId){
        var a=byId(DB.apartments,aptId); if(!a||a.deleted) return;
        /* הגנה מכפילות: אותו כלל + אותו מועד + אותו פרוייקט */
        var tag=r.id+"@"+due;
        if(active(DB.expenses).some(function(e){ return e.recurTag===tag && e.apartmentId===aptId; })) return;
        var eid=uid();
        DB.expenses.push({id:eid,apartmentId:aptId,categoryId:r.categoryId||"",
          classification:r.classification||"ongoing",
          description:r.description||"הוצאה תקופתית",
          amount:Number(r.amount)||0,date:due,
          note:(r.note||"")+(r.note?" · ":"")+"נוצר אוטומטית — לבדיקה והשלמת סכום",
          hasInvoice:false,invoiceLink:"",
          mgmtEnabled:false,mgmtSet:false,mgmtBaseType:"full",mgmtVatRate:18,
          recurTag:tag,recurId:r.id,recurOpen:true,deleted:false});
        apPartners(aptId).forEach(function(p){
          DB.expenseSplits.push({id:splitId(eid,p.partnerId),expenseId:eid,partnerId:p.partnerId,percent:p.defaultPercent,deleted:false});
        });
        made++;
      });
      r.lastRun=due;
      r.nextDate=recurAdvance(due,r.every||"year");
    }
  });
  if(made){
    save();
    if(!silent) toast("נוצרו "+made+" הוצאות תקופתיות לבדיקה","warn");
  }
  return made;
}

/* ============================================================
   שכירויות ארוכות-טווח — חוזים, תפוסה והתראות
   ------------------------------------------------------------
   ישות נפרדת לגמרי מ-rentalUnits של פרוייקטי הנופש: שם היחידות הן
   תוויות על הזמנה קצרה, וכאן כל דירה היא נכס עם חוזה, שוכר ותאריכי
   התחלה וסיום. פרוייקט שאין לו דירות כאן פשוט לא מופיע — כך פרוייקטי
   נופש ופרוייקטי בנייה נשארים מחוץ לתמונה בלי דגל נוסף.
   ============================================================ */
var RENT_ALERT_DAYS=60;          // "חודשיים לפני" — סף ההתראה
function activeRentals(){ return active(DB.rentals).filter(function(r){ return canSeeApartment(r.apartmentId); }); }
function aptRentals(aptId){ return activeRentals().filter(function(r){ return r.apartmentId===aptId; }); }
/* פרוייקטים שיש בהם דירות להשכרה — רק הם נכנסים לדשבורד */
function rentalApartments(){
  var seen={}, out=[];
  activeRentals().forEach(function(r){
    if(seen[r.apartmentId]) return;
    var a=byId(DB.apartments,r.apartmentId);
    if(a && !a.deleted){ seen[r.apartmentId]=1; out.push(a); }
  });
  return out.sort(function(x,y){ return String(x.name).localeCompare(String(y.name),"he"); });
}
function daysUntil(iso){
  if(!iso) return null;
  var d=new Date(iso+"T00:00:00"), t=new Date(todayISO()+"T00:00:00");
  return Math.round((d-t)/86400000);
}
function addMonthsISO(iso,n){
  var d=new Date(iso+"T00:00:00Z"), day=d.getUTCDate();
  d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+n);
  var last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();
  d.setUTCDate(Math.min(day,last));
  return d.toISOString().slice(0,10);
}
/* האם תקופה כלשהי (נוכחית או קודמת) מכסה תאריך נתון */
function periodCovers(s,e,t){
  if(!s && !e) return false;
  if(s && s>t) return false;
  if(e && e<t) return false;
  return true;
}
function historyCoversToday(r){
  var t=todayISO();
  return (r.history||[]).some(function(h){ return periodCovers(h.startDate,h.endDate,t); });
}
/* מצב הדירה היום. "פנויה" = אין שוכר או שאין תאריכים כלל. */
function rentalStatus(r){
  if(!r.tenant && !r.startDate && !r.endDate) return historyCoversToday(r) ? "renewed" : "free";
  var t=todayISO();
  /* חוזה חדש שטרם התחיל, בזמן שהחוזה הקודם עדיין רץ — הדירה מושכרת
     היום והחידוש כבר סגור. בלי זה היא נספרה כלא-תפוסה מיד אחרי חידוש. */
  if(r.startDate && r.startDate>t) return historyCoversToday(r) ? "renewed" : "future";
  if(!r.endDate) return "active";                 // חוזה פתוח / חודשי
  if(r.endDate<t) return "ended";
  var d=daysUntil(r.endDate);
  return d<=RENT_ALERT_DAYS ? "ending" : "active";
}
var RENT_STATUS={free:{t:"פנויה",c:"badge-muted"},future:{t:"מתחיל בהמשך",c:"badge-mgmt"},
  renewed:{t:"מושכרת · חודש",c:"badge-ok"},
  active:{t:"מושכרת",c:"badge-ok"},ending:{t:"מסתיים בקרוב",c:"badge-warn"},ended:{t:"החוזה הסתיים",c:"badge-danger"}};
function rentalStatusBadge(r){

  return '<span class="badge '+s.c+' badge-unit"'+ttl+'>'+s.t+'</span>';

/* דירה נחשבת תפוסה היום — לחישוב אחוז התפוסה */
function rentalOccupied(r){ var s=rentalStatus(r); return s==="active"||s==="ending"||s==="renewed"; }
/* ההתראות: חוזים שמסתיימים בתוך הסף, וכאלה שכבר הסתיימו ולא טופלו */

/* האם חוזה כלשהו כיסה את החודש הזה — כולל תקופות קודמות בהיסטוריה */
function rentalCoversMonth(r,ym){
  function covers(s,e){
    if(!s && !e) return false;
    if(s && s.slice(0,7)>ym) return false;
    if(e && e.slice(0,7)<ym) return false;
    return true;
  }
  if(covers(r.startDate,r.endDate)) return true;
  return (r.history||[]).some(function(h){ return covers(h.startDate,h.endDate); });
}

/* ============================================================
   גיליונות חופשיים — "אקסל בתוך התוכנה"

   רישום חופשי בלי מבנה קבוע: מקלידים בתאים, מדביקים טבלה שלמה
   מאקסל, ומקבלים סיכום אוטומטי לכל עמודה מספרית. הנתונים כאן אינם
   נכנסים לשום חישוב של המערכת — זהו פנקס צד, לא מקור נתונים.
   ============================================================ */
var SHEET_MIN_COLS=6, SHEET_MIN_ROWS=12;
function activeSheets(){ return active(DB.sheets); }
function curSheet(){
  var list=activeSheets();
  if(!list.length) return null;

  return (id && byId(DB.sheets,id) && !byId(DB.sheets,id).deleted) ? byId(DB.sheets,id) : list[0];

/* התא כמספר — אם הוא בכלל מספר. תומך בפסיקי אלפים, ₪, אחוזים ומינוס. */
/* לבקשת דודי: בלי סימני ₪ בגיליון החופשי. ערך שהוא מספר עם ₪ —
   הסימן מוסר; משפט חופשי שבמקרה מכיל ₪ נשאר כמו שהוא. */
function sheetStripShekel(v){
  if(typeof v!=="string" || v.indexOf("₪")<0) return v;
  if(cellNum(v)===null) return v;
  return v.replace(/₪/g,"").trim();
}
function cellNum(v){
  var s=String(v==null?"":v).trim();
  if(!s) return null;
  s=s.replace(/[₪$€,\s]/g,"").replace(/%$/,"");
  if(!/^-?\d*\.?\d+$/.test(s)) return null;
  var n=Number(s);
  return isFinite(n)?n:null;
}
function sheetColCount(s){
  var n=SHEET_MIN_COLS;
  (s.rows||[]).forEach(function(r){ if(r.length>n) n=r.length; });
  if((s.cols||[]).length>n) n=s.cols.length;
  return n;
}
function colLetter(i){
  var s="";
  do{ s=String.fromCharCode(65+(i%26))+s; i=Math.floor(i/26)-1; }while(i>=0);
  return s;
}
/* ---------- בחירת תאים ועיצובם ----------
   הבחירה חיה בזיכרון בלבד ולא נשמרת: היא סימון עבודה, לא נתון.
   העיצוב עצמו נשמר במפה "שורה,עמודה" על הגיליון, כדי שלא ינופח

var SHEETSEL=null;   // {id,r1,c1,r2,c2}
var SHEETDRAG=false;
var SHEET_PREVFOCUS=null;   // מי היה בפוקוס לפני הלחיצה — להבחין לחיצה ראשונה מלחיצה בתוך תא פתוח
var SHEET_COLORS=[

  {v:"#bfdbfe",n:"כחול",c:"#bfdbfe"},
  {v:"#e9d5ff",n:"סגול",c:"#e9d5ff"},
  {v:"#fed7aa",n:"כתום",c:"#fed7aa"},

];
function fmtKey(r,c){ return r+","+c; }
function sheetFmt(s,r,c){ return (s.fmt&&s.fmt[fmtKey(r,c)])||null; }
function sheetSelNorm(){
  if(!SHEETSEL) return null;
  return {id:SHEETSEL.id,
    r1:Math.min(SHEETSEL.r1,SHEETSEL.r2), r2:Math.max(SHEETSEL.r1,SHEETSEL.r2),
    c1:Math.min(SHEETSEL.c1,SHEETSEL.c2), c2:Math.max(SHEETSEL.c1,SHEETSEL.c2)};
}
function sheetSelCount(){

  return (s.r2-s.r1+1)*(s.c2-s.c1+1);
}
/* צביעת הסימון נעשית ישירות ב-DOM ולא ברינדור מחדש — אחרת כל לחיצה
   הייתה בונה את הטבלה מחדש ומאבדת את מיקוד ההקלדה. */
function paintSheetSel(){
  var sel=sheetSelNorm();
  document.querySelectorAll(".sheet-grid td[data-cr]").forEach(function(td){
    var r=Number(td.getAttribute("data-cr")), c=Number(td.getAttribute("data-cc"));
    var on=sel && r>=sel.r1 && r<=sel.r2 && c>=sel.c1 && c<=sel.c2;
    td.classList.toggle("sel",!!on);
  });
  var lbl=document.getElementById("sheet-sel-lbl");
  if(lbl){
    var n=sheetSelCount();
    if(!n) lbl.textContent="לא נבחר תא";
    else{
      /* כמו שורת הסטטוס באקסל: סכום התאים המספריים שנבחרו, לצד הספירה */
      var sel2=sheetSelNorm(), sh=sel2?byId(DB.sheets,sel2.id):null;
      var sum=0, nums=0;
      if(sh) for(var r=sel2.r1;r<=sel2.r2;r++){
        var row=(sh.rows||[])[r]||[];
        for(var c=sel2.c1;c<=sel2.c2;c++){
          var v=cellNum(row[c]);
          if(v!==null){ sum+=v; nums++; }
        }
      }
      lbl.textContent=(n>1?("נבחרו "+n+" תאים"):"תא אחד נבחר")+
        (nums?(' · סה"כ '+num(round2(sum))+(nums>1?' ('+nums+' מספרים)':'')):'');
    }
  }
}
function sheetCellDown(ev,id,r,c){

  if(ev.shiftKey && SHEETSEL && SHEETSEL.id===id){ SHEETSEL.r2=r; SHEETSEL.c2=c; }
  else { SHEETSEL={id:id,r1:r,c1:c,r2:r,c2:c}; SHEETDRAG=true; }
  paintSheetSel();
}
function sheetCellOver(id,r,c){
  if(!SHEETDRAG || !SHEETSEL || SHEETSEL.id!==id) return;

  paintSheetSel();
}
document.addEventListener("mouseup",function(){ SHEETDRAG=false; });
/* ---------- התנהגות הקלדה כמו באקסל ----------
   לחיצה בודדת על תא בוחרת את כל התוכן — הקלדה מחליפה אותו.
   לחיצה כפולה נכנסת לתוך הטקסט ומאפשרת לתקן ולהוסיף.
   לחיצה נוספת בתוך תא שכבר בעריכה רק מזיזה את הסמן. */
function sheetCellUp(ev,inp){
  if(sheetSelCount()>1) return;                       // בחירת טווח — לא מצב עריכה
  if(inp!==document.activeElement) return;            // סוף גרירה מעל תא אחר
  if(ev.detail===1 && SHEET_PREVFOCUS===inp) return;  // התא כבר בעריכה — רק הזזת סמן
  var d=ev.detail;
  setTimeout(function(){
    if(inp!==document.activeElement) return;
    try{
      if(d>=2){ var e2=inp.selectionEnd; inp.setSelectionRange(e2,e2); }  // לתוך הטקסט
      else inp.select();                                                   // הקלדה מחליפה הכל
    }catch(e){}
  },0);
}
/* בחירת עמודה או שורה שלמה בלחיצה על הכותרת */
/* גרירת רוחב עמודה. ב-RTL הקצה הפנימי הוא שמאל — גרירה שמאלה מרחיבה. */
var SHEETGRIP=null;
function sheetGripDown(ev,id,c){
  ev.preventDefault(); ev.stopPropagation();
  var th=ev.target.closest("th"); if(!th) return;
  SHEETGRIP={id:id,c:c,th:th,startX:ev.clientX,startW:th.getBoundingClientRect().width};
  document.addEventListener("mousemove",sheetGripMove);
  document.addEventListener("mouseup",sheetGripUp);
  document.body.style.cursor="col-resize";
  document.body.style.userSelect="none";
}
function sheetGripMove(ev){
  if(!SHEETGRIP) return;
  var w=Math.max(44, Math.round(SHEETGRIP.startW+(SHEETGRIP.startX-ev.clientX)));
  SHEETGRIP.th.style.width=w+"px";
  SHEETGRIP.w=w;
}
function sheetGripUp(){
  document.removeEventListener("mousemove",sheetGripMove);
  document.removeEventListener("mouseup",sheetGripUp);
  document.body.style.cursor=""; document.body.style.userSelect="";
  if(!SHEETGRIP) return;
  var g=SHEETGRIP; SHEETGRIP=null;
  if(!g.w || Math.abs(g.w-g.startW)<2) return;      /* לא באמת גרר */
  var sh=byId(DB.sheets,g.id); if(!sh) return;
  sh.colW=sh.colW||{}; sh.colW[g.c]=g.w;
  save();                                            /* בלי rerender — הרוחב כבר על המסך */
}
function sheetGripReset(id,c){
  var sh=byId(DB.sheets,id); if(!sh||!sh.colW) return;
  delete sh.colW[c];
  save(); rerender();
}
function sheetSelCol(id,c){
  var s=byId(DB.sheets,id); if(!s) return;
  var n=Math.max((s.rows||[]).length,SHEET_MIN_ROWS);
  SHEETSEL={id:id,r1:0,c1:c,r2:n-1,c2:c}; paintSheetSel();
}
function sheetSelRow(id,r){
  var s=byId(DB.sheets,id); if(!s) return;
  SHEETSEL={id:id,r1:r,c1:0,r2:r,c2:sheetColCount(s)-1}; paintSheetSel();
}
/* החלת עיצוב על הבחירה. kind: bg / bold / boxOut / boxAll / clear */
function sheetApplyFmt(id,kind,value){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var sel=sheetSelNorm();
  if(!sel || sel.id!==id){ toast("סמן קודם תא או קבוצת תאים","warn"); return; }
  var s=byId(DB.sheets,id); if(!s) return;
  s.fmt=s.fmt||{};
  function patch(r,c,o){
    var k=fmtKey(r,c), cur=s.fmt[k]||{};
    Object.keys(o).forEach(function(f){ if(o[f]) cur[f]=o[f]; else delete cur[f]; });
    if(Object.keys(cur).length) s.fmt[k]=cur; else delete s.fmt[k];
  }
  for(var r=sel.r1;r<=sel.r2;r++){
    for(var c=sel.c1;c<=sel.c2;c++){
      if(kind==="bg") patch(r,c,{bg:value});
      else if(kind==="bold"){
        var cur=sheetFmt(s,r,c);
        patch(r,c,{bold:(cur&&cur.bold)?0:1});
      }
      else if(kind==="boxAll") patch(r,c,{bt:1,bb:1,bl:1,br:1});
      else if(kind==="boxOut") patch(r,c,{
        bt:(r===sel.r1)?1:0, bb:(r===sel.r2)?1:0,
        bl:(c===sel.c1)?1:0, br:(c===sel.c2)?1:0});
      else if(kind==="noBox") patch(r,c,{bt:0,bb:0,bl:0,br:0});
      else if(kind==="clear") delete s.fmt[fmtKey(r,c)];
    }
  }
  /* "מודגש" על טווח — הופכים את כולם למצב אחיד לפי התא הראשון,
     אחרת כל תא היה מתהפך בנפרד והתוצאה מנומרת */
  if(kind==="bold"){
    var first=sheetFmt(s,sel.r1,sel.c1);
    var on=!!(first&&first.bold);
    for(var r2=sel.r1;r2<=sel.r2;r2++)
      for(var c2=sel.c1;c2<=sel.c2;c2++) patch(r2,c2,{bold:on?1:0});
  }
  save(); rerender();
}
/* מחיקת שורה מזיזה את העיצוב של השורות שמתחתיה — אחרת ההדגשות
   נשארות על מספרי שורה ישנים ומופיעות על תאים לא נכונים */
function shiftFmtAfterRowDelete(s,r){
  if(!s.fmt) return;
  var next={};
  Object.keys(s.fmt).forEach(function(k){
    var p=k.split(","), rr=Number(p[0]), cc=Number(p[1]);
    if(rr===r) return;                 // השורה שנמחקה
    next[fmtKey(rr>r?rr-1:rr,cc)]=s.fmt[k];
  });
  s.fmt=next;
}

}
function renameSheet(id){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }

  var name=prompt("שם הגיליון:",s.name); name=(name||"").trim();
  if(!name) return;

function setSheetCell(id,r,c,v){
  if(!can("edit")) return;

}
function setSheetCol(id,c,v){

function delSheetRow(id,r){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var s=byId(DB.sheets,id); if(!s||!s.rows) return;
  var row=s.rows[r]||[];
  var hasData=row.some(function(v){ return String(v==null?"":v).trim()!==""; });
  if(hasData && !confirm("למחוק את השורה על התוכן שבה?")) return;
  s.rows.splice(r,1);
  shiftFmtAfterRowDelete(s,r);
  SHEETSEL=null;
  save(); rerender();
}
/* ניווט במקלדת כמו בגיליון */
function sheetKey(ev,r,c){
  var dr=0, dc=0;
  if(ev.key==="Enter"||ev.key==="ArrowDown") dr=1;
  else if(ev.key==="ArrowUp") dr=-1;
  else return;
  ev.preventDefault();
  var next=document.querySelector('.sheet-grid input[data-r="'+(r+dr)+'"][data-c="'+(c+dc)+'"]');
  if(next){ next.focus(); next.select(); }
}
/* הדבקה של טבלה שלמה מאקסל — נפרסת מהתא שבו עומדים */
function sheetPaste(ev,id,r,c){
  if(!can("edit")) return;
  var txt=(ev.clipboardData||window.clipboardData).getData("text");
  if(!txt || txt.indexOf("\t")<0 && txt.indexOf("\n")<0) return;   // תא בודד — התנהגות רגילה
  ev.preventDefault();
  applySheetPaste(id,txt,r,c);
}
function applySheetPaste(id,txt,r0,c0){
  var s=byId(DB.sheets,id); if(!s) return 0;
  var lines=String(txt).replace(/\r/g,"").split("\n");
  while(lines.length && lines[lines.length-1].trim()==="") lines.pop();
  if(!lines.length) return 0;
  s.rows=s.rows||[];
  lines.forEach(function(line,i){
    var cells=line.split("\t");
    var r=r0+i;
    while(s.rows.length<=r) s.rows.push([]);
    var row=s.rows[r];
    cells.forEach(function(v,j){
      var c=c0+j;
      while(row.length<=c) row.push("");
      row[c]=sheetStripShekel(v.trim());
    });
  });
  save(); rerender();
  toast("הודבקו "+lines.length+" שורות","ok");
  return lines.length;
}
function openSheetPaste(id){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  openModal({title:"📋 הדבקת נתונים מאקסל",wide:true,bodyHtml:
    '<div class="hint" style="margin-bottom:8px">העתק תאים מאקסל / גוגל שיטס והדבק כאן. '+
    'העמודות מופרדות ב-Tab, בדיוק כמו שהאקסל מעתיק.</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>להתחיל בשורה</label><input id="sp-row" type="number" min="1" value="1"></div>'+
      '<div class="field"><label>להתחיל בעמודה</label><input id="sp-col" type="number" min="1" value="1"></div>'+
    '</div>'+
    '<textarea id="sp-data" rows="12" style="width:100%;font-family:monospace;direction:ltr" placeholder="הדבק כאן (Ctrl+V)"></textarea>',
    saveLabel:"הדבק",onSave:function(){
      var txt=val("sp-data");
      if(!String(txt).trim()){ toast("לא הודבק כלום","err"); return false; }
      var r=(Number(val("sp-row"))||1)-1, c=(Number(val("sp-col"))||1)-1;
