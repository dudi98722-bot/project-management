/* ---- סנכרון גוגל שיטס (best-effort) ---- */
function pushToSheets(){ serverSave(); }
async function pullFromSheets(){
  if(!sheetsUrl()){ toast("לא הוגדר קישור לשיט","err"); return; }
  if(SAVEQ.inflight){ toast("שמירה לשרת בעיצומה — המתן רגע ונסה שוב","warn"); return; }
  if(hasUnsaved()||hasDirtyMark()){
    if(!confirm("יש שינויים מקומיים שטרם נשמרו לשרת.\n\nטעינה מהשיט תדרוס אותם לצמיתות. להמשיך בכל זאת?")) return;
  }
  if(SAVEQ.timer){ clearTimeout(SAVEQ.timer); SAVEQ.timer=null; }
  SAVEQ.dirty=false; SAVEQ.fails=0; clearDirtyMark();
  var res=await serverLoad();
  if(res.error){ toast("שגיאת חיבור לשיט","err"); return; }
  if(res.data && Array.isArray(res.data.apartments)){
    DB=normalizeDB(res.data); saveLocal(); UNDO.length=0;   // סטאק ישן = בסיס לא תקף אחרי משיכה
    toast("נטען מהשיט","ok"); rerender();
  }
  else toast("השיט ריק","warn");
}

/* ---------- רענון אוטומטי משינויים של משתמשים אחרים ----------
   עד עכשיו הנתונים נמשכו מהשיטס רק בטעינת הדף, ולכן שינוי שמישהו אחר
   עשה לא הופיע עד רענון ידני. כאן בודקים כל 45 שניות את מונה הגרסה
   בשרת (בקשה זעירה, בלי הנתונים) ומושכים רק כשבאמת יש חדש.
   לעולם לא מושכים כשיש עבודה מקומית שטרם נשמרה, כשמודאל פתוח או
   כשעומדים בתוך שדה — כדי לא לדרוס הקלדה באמצע. */
var POLL={timer:null,pending:false,busy:false,lastCheck:0};
var POLL_MS=45000;
function startPolling(){
  if(POLL.timer) return;
  POLL.timer=setInterval(pollForUpdates,POLL_MS);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible") pollForUpdates();
  });
  window.addEventListener("focus",function(){ pollForUpdates(); });
}
function pollBlockedBy(){
  if(!CU||!getAuth()) return "no-auth";
  if(document.visibilityState!=="visible") return "hidden";
  if(SAVEQ.inflight||SAVEQ.dirty||SAVEQ.timer||hasDirtyMark()||hasUnsaved()) return "local-work";
  return "";
}
async function pollForUpdates(){
  if(POLL.busy) return;
  if(pollBlockedBy()) return;
  var now=Date.now();
  if(now-POLL.lastCheck<4000) return;      // הגנה מפני מבול פוקוס
  POLL.lastCheck=now;
  POLL.busy=true;
  try{
    var res=await api({action:"rev",codeHash:getAuth()});
    if(!res||!res.ok) return;
    var srv=Number(res.rev)||0, loc=(DB&&DB.meta&&Number(DB.meta.rev))||0;
    if(srv<=loc) return;
    if(pollBlockedBy()) return;             // משהו השתנה בזמן ההמתנה
    if(uiIsBusy()){ POLL.pending=true; showUpdateBanner(); return; }
    await applyServerUpdate();
  } finally { POLL.busy=false; }
}
/* מודאל פתוח, או פוקוס בתוך שדה — רינדור מחדש היה מוחק את מה שמקלידים */
function uiIsBusy(){
  var mr=document.getElementById("modal-root");
  if(mr && mr.innerHTML.trim()) return true;
  var ae=document.activeElement;
  if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return true;
  return false;
}
async function applyServerUpdate(){
  var res=await serverLoad();
  if(res.error||!res.data||!Array.isArray(res.data.apartments)) return false;
  var srv=(res.data.meta&&Number(res.data.meta.rev))||0;
  var loc=(DB&&DB.meta&&Number(DB.meta.rev))||0;
  if(srv<=loc) return false;
  if(pollBlockedBy()==="local-work") return false;   // נשמר משהו בזמן הטעינה
  DB=normalizeDB(res.data); saveLocal(); UNDO.length=0;
  POLL.pending=false; hideUpdateBanner();
  rerender();
  toast("עודכן — נכנסו שינויים ממשתמש אחר","ok");
  return true;
}
function showUpdateBanner(){
  if(document.getElementById("upd-banner")) return;
  var b=document.createElement("div");
  b.id="upd-banner";
  b.innerHTML='🔄 יש עדכון חדש ממשתמש אחר <button class="btn btn-sm" onclick="applyServerUpdate()">טען עכשיו</button>';
  document.body.appendChild(b);
}
function hideUpdateBanner(){ var b=document.getElementById("upd-banner"); if(b) b.remove(); }

/* ---- סנכרון מול גוגל שיטס (Apps Script) — מקור האמת ---- */
/* ---------- תור שמירה ----------
   כל שמירה שולחת את כל מסד הנתונים. כששולחים כמה בקשות במקביל הן אינן
   חוזרות בהכרח בסדר שנשלחו, ובקשה ישנה שמגיעה אחרונה דורסת שינויים
   חדשים — כך "חזרו" סימוני בנק שכובו. לכן: בקשה אחת בלבד בכל רגע,
   ותמיד עם המצב העדכני. שינויים שנעשו בזמן שליחה נשלחים מיד אחריה. */
var SAVEQ={inflight:false,dirty:false,timer:null,fails:0};
function serverSave(){
  if(!getAuth()){ setSync("local"); return; }
  SAVEQ.dirty=true;
  SAVEQ.fails=0;                       // עריכה חדשה מאפסת את מונה הכישלונות — ניסיון מיידי
  setSync("saving");
  if(SAVEQ.timer) return;
  SAVEQ.timer=setTimeout(function(){ SAVEQ.timer=null; flushSave(); },350);
}
function scheduleRetry(){
  /* לעולם לא מפסיקים לנסות — רק מאטים (עד 30 שניות בין ניסיונות).
     עצירה קשיחה אחרי N כישלונות השאירה שינויים תקועים לנצח. */
  var delay=Math.min(2000*Math.max(1,SAVEQ.fails), 30000);
  setSync(SAVEQ.fails>=3 ? "err" : "saving");
  setTimeout(flushSave, delay);
}
function flushSave(){
  if(SAVEQ.inflight || !SAVEQ.dirty) return;
  var h=getAuth(); if(!h){ setSync("local"); return; }
  SAVEQ.dirty=false; SAVEQ.inflight=true; setSync("saving");
  var payload=JSON.stringify({action:"save",codeHash:h,data:DB});   // תמונת מצב עדכנית
  fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:payload})
    .then(function(r){ return r.json(); })
    .then(function(j){
      SAVEQ.inflight=false;
      if(j&&j.ok){
        SAVEQ.fails=0;
        if(SAVEQ.dirty){ setSync("saving"); setTimeout(flushSave,0); }   // שינויים שנעשו בזמן השליחה
        else { clearDirtyMark(); setSync("ok"); }
        return;
      }
      SAVEQ.dirty=true;
      var err=j&&j.error;
      if(err==="stale-rev"){
        /* השרת מחזיק גרסה חדשה יותר (מכשיר אחר עבד בינתיים).
           לא דורסים אותה: שומרים את העותק שלנו בגיבוי חירום ומושכים את העדכני. */
        SAVEQ.dirty=false; setSync("err");
        stashLocalBackup("שינוי שנדחה — השרת התעדכן ממכשיר אחר");
        serverLoad().then(function(res){
          if(res.data && Array.isArray(res.data.apartments)){
            DB=normalizeDB(res.data); saveLocal(); UNDO.length=0; clearDirtyMark();
            setSync("ok"); rerender();
            toast("מכשיר אחר עדכן נתונים במקביל — נטענה הגרסה העדכנית. העותק שלך נשמר ב'גיבוי'","warn");
          }
        });
        return;
      }
      if(err==="unauthorized"||err==="forbidden"){
        /* קוד הכניסה כבר לא תקף (למשל אחרי איפוס ממכשיר אחר).
           אסור להמשיך לירות — עוצרים, והשינוי שמור מקומית ומסומן,
           כך שאחרי כניסה מחודשת הוא נדחף לשרת ולא נמחק. */
        setSync("err"); setAuth(""); CU=null;
        toast("החיבור לשרת פג — יש להתחבר מחדש. השינויים שלך שמורים ויסונכרנו אחרי הכניסה","err");
        renderApp(); return;
      }
      SAVEQ.fails++; scheduleRetry();
    })
    .catch(function(){
      SAVEQ.inflight=false; SAVEQ.fails++; SAVEQ.dirty=true;
      scheduleRetry();
    });
}
function hasUnsaved(){ return !!(SAVEQ.dirty||SAVEQ.inflight); }
window.addEventListener("online",function(){    // הרשת חזרה — מנסים מיד
  if(SAVEQ.dirty && !SAVEQ.inflight){ SAVEQ.fails=0; flushSave(); }
});
window.addEventListener("beforeunload",function(e){
  if(hasUnsaved()){ e.preventDefault(); e.returnValue=""; return ""; }
});
window.addEventListener("pagehide",function(){
  /* ניסיון אחרון לשלוח לפני סגירה. אם הוא נכשל (או שהנתונים גדולים מדי
     ל-keepalive) — הסימון המקומי נשאר, והכניסה הבאה תדחף את המקומי. */
  if(!hasUnsaved()) return;
  var h=getAuth(); if(!h) return;
  try{
    fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"save",codeHash:h,data:DB}),keepalive:true});
  }catch(e){}
});
async function serverLoad(){
  var h=getAuth();
  if(!h){ setSync("local"); return {error:true}; }
  var j=await api({action:"load",codeHash:h});
  if(j&&j.ok){ setSync("ok"); return {data:(j.data||null),user:j.user}; }
  setSync("err"); return {error:true,reason:(j&&j.error)};
}

/* ============================================================
   אתחול — השרת הוא מקור האמת; localStorage הוא מטמון מקומי
   ============================================================ */
/* סנכרון אחרי אימות: מושכים את השרת, משווים מוני גרסאות, ומחליטים —
   דוחפים את המקומי רק אם הוא באמת חדש יותר. דחיפה עיוורת של עותק ישן
   היא שמחקה תשלומים בעבר, ולכן ההשוואה כאן קריטית.
   מחזיר: true=להיכנס, false=אימות נכשל, null=אין רשת */
async function reconcileAfterAuth(){
  var res=await serverLoad();
  if(res.error){
    if(res.reason==="unauthorized"){ setAuth(""); CU=null; return false; }
    if(hasDirtyMark() && DB && Array.isArray(DB.apartments)) return true;   // אין רשת אבל יש עבודה מקומית — לא חוסמים
    return null;
  }
  if(res.user) CU=res.user;
  var srvRev=(res.data&&res.data.meta&&Number(res.data.meta.rev))||0;
  var locRev=(DB&&DB.meta&&Number(DB.meta.rev))||0;
  var localDirty=hasDirtyMark() && DB && Array.isArray(DB.apartments);
  if(localDirty && (res.data===null || locRev>=srvRev)){
    SAVEQ.dirty=true; flushSave();
    toast("נמצאו שינויים שטרם סונכרנו — נשלחים לשרת","warn");
    return true;
  }
  if(res.data && Array.isArray(res.data.apartments)){
    if(localDirty){
      stashLocalBackup("שינויים מקומיים ישנים — השרת היה מעודכן יותר בכניסה");
      toast("השרת הכיל גרסה חדשה יותר — נטענה. העותק המקומי נשמר ב'גיבוי'","warn");
    }
    DB=normalizeDB(res.data); saveLocal(); UNDO.length=0; clearDirtyMark();
  }
  return true;
}
async function boot(){
  var hadLocal=loadDB();
  if(!hadLocal||!DB){ DB=blankDB(); seedIfEmpty(); }
  if(getAuth()){                       // session פעיל
    var r=await reconcileAfterAuth();
    if(r===null){ CU=null; }           // אין רשת ואין עבודה מקומית — מסך כניסה עם האזהרה
    else if(r===false){ /* אומת כלא-תקף — כבר נוקה */ }
  }
  renderApp();
  watchTables();     // כלי טבלה + כפתור ייצוא לכל טבלה, גם אחרי רינדור חלקי
  watchSelects();    // זיכרון הבחירה הקודמת בבוררים עם "הוסף חדש…"
  startPolling();    // משיכת שינויים של משתמשים אחרים בלי לרענן ידנית
}
</script>
<script>
"use strict";
/* ============================================================
   מודולים
   ============================================================ */
/* ---------- חיפוש וסינון ---------- */
var Q={apts:"",exp:"",expStatus:"",expClass:"",quick:"",partners:"",cross:"",recycle:"",pay:"",payWho:"",paySrc:"",payInv:"",ppWho:""};
/* כל מילה בשאילתה חייבת להופיע — מאפשר "עורך דין קופר" ו"קופר דין" כאחד */
function matches(q,text){
  q=String(q||"").trim().toLowerCase(); if(!q) return true;
  var t=String(text||"").toLowerCase();
  return q.split(/\s+/).every(function(w){ return t.indexOf(w)>=0; });
}
function searchBox(id,val,ph,handler){
  return '<input id="'+id+'" value="'+esc(val)+'" placeholder="🔍 '+esc(ph)+'" '+
    'oninput="'+handler+'" style="max-width:300px">';
}
/* ============================================================
   סינון ומיון לפי עמודה — כמו באקסל
   עובד על כל טבלה: מוסיף שורת שדות מתחת לכותרות, ומיון בלחיצה.
   פועל על ה-DOM בלבד, כך שהוא חל על כל דוח בלי שינוי בקוד שלו.
   ============================================================ */
/* סינון-העמודות יושב ב-DOM, ולכן רינדור מחדש (למשל אחרי עריכת שורה)
   היה מאפס אותו. שומרים את ערכי הסינון לפי חתימת הכותרות ומשחזרים
   אותם כשהטבלה נבנית מחדש — כך הסינון שורד עריכה. מתאפס בניווט. */
var COLFILT={};
function tableSig(t){
  var hr=t.tHead&&t.tHead.rows[0]; if(!hr) return "";
  return Array.prototype.map.call(hr.cells,function(c){ return String(c.textContent||"").replace(/[▲▼]/g,"").trim(); }).join("|");
}
function attachTableTools(root){
  var scope=root||document;
  scope.querySelectorAll("table.tbl").forEach(function(t){
    if(t.getAttribute("data-tools")) return;
    var head=t.tHead; if(!head||!head.rows.length) return;
    if(!t.tBodies.length||!t.tBodies[0].rows.length) return;
    if(t.tBodies[0].rows.length<3) return;            // טבלה קטנה — לא מעמיסים
    t.setAttribute("data-tools","1");
    var hr=head.rows[0], n=hr.cells.length;

    /* מיון בלחיצה על כותרת */
    Array.prototype.forEach.call(hr.cells,function(th,i){
      if(th.getAttribute("onclick")) return;          // לכותרת יש כבר מיון משלה
      if(!String(th.textContent||"").trim()) return;
      th.style.cursor="pointer";
      th.title="לחץ למיון";
      th.addEventListener("click",function(){ sortTableByCol(t,i); });
    });

    /* שורת סינון */
    var fr=head.insertRow(-1);
    fr.className="filter-row";
    for(var i=0;i<n;i++){
      var c=fr.insertCell(-1);
      var label=String(hr.cells[i]?hr.cells[i].textContent:"").replace(/[▲▼]/g,"").trim();
      if(!label){ c.innerHTML=""; continue; }
      c.innerHTML='<input class="col-f" data-col="'+i+'" placeholder="סנן…" '+
        'style="padding:4px 7px;font-size:11.5px;border-radius:7px;min-width:60px">';
    }
    fr.querySelectorAll(".col-f").forEach(function(inp){
      inp.addEventListener("input",function(){ applyColFilters(t); });
      inp.addEventListener("click",function(e){ e.stopPropagation(); });
    });
    /* שחזור סינון קודם של אותה טבלה (שרד עריכה/רינדור) */
    var saved=COLFILT[tableSig(t)];
    if(saved){
      var any=false;
      fr.querySelectorAll(".col-f").forEach(function(inp){
        var v=saved[inp.getAttribute("data-col")];
        if(v){ inp.value=v; any=true; }
      });
      if(any) applyColFilters(t);
    }
  });
}
function applyColFilters(t){
  var fr=t.querySelector("thead tr.filter-row"); if(!fr) return;
  var f=[], mem={};
  fr.querySelectorAll(".col-f").forEach(function(inp){
    var v=String(inp.value||"").trim();
    if(v){ f.push({col:Number(inp.getAttribute("data-col")),q:v}); mem[inp.getAttribute("data-col")]=v; }
  });
  /* שומרים את מצב הסינון כדי שישרוד עריכה/רינדור */
  var sig=tableSig(t); if(f.length) COLFILT[sig]=mem; else delete COLFILT[sig];
  var body=t.tBodies[0], shown=0;
  Array.prototype.forEach.call(body.rows,function(tr){
    var vis=f.every(function(x){
      var cell=tr.cells[x.col];
      return cell ? matches(x.q, cell.innerText||cell.textContent||"") : false;
    });
    tr.style.display=vis?"":"none";
    if(vis) shown++;
  });
  /* שורת סיכום חיה של המסונן: מסכמת עמודות מספריות */
  var tf=t.tFoot;
  if(tf&&tf.rows.length){
    if(!tf.getAttribute("data-orig")) tf.setAttribute("data-orig",tf.innerHTML);
    if(!f.length){ tf.innerHTML=tf.getAttribute("data-orig"); }
    else{
      var n=t.tHead.rows[0].cells.length, sums=new Array(n).fill(null);
      /* שורת שלב-אב היא כבר הסיכום של תתי-השלבים שמתחתיה. אם שניהם
         גלויים, ספירת שניהם הייתה מכפילה את הסכום, את "שולם" ואת "נותר". */
      var visIds={};
      Array.prototype.forEach.call(body.rows,function(tr){
        if(tr.style.display!=="none" && tr.getAttribute("data-eid")) visIds[tr.getAttribute("data-eid")]=1;
      });
      Array.prototype.forEach.call(body.rows,function(tr){
        if(tr.style.display==="none") return;
        var par=tr.getAttribute("data-parent");
        if(par && visIds[par]) return;          // נספר כבר בשורת האב
        for(var i=0;i<n;i++){
          var cell=tr.cells[i]; if(!cell) continue;
          var txt=String(cell.innerText||"").replace(/[^\d.\-]/g,"");
          if(txt && /[\d]/.test(txt) && /[₪%]|^\s*-?[\d,.]+\s*$/.test(String(cell.innerText||""))){
            var v=parseFloat(txt);
            if(isFinite(v)) sums[i]=(sums[i]||0)+v;
          }
        }
      });
      var cells="";
      for(var i=0;i<n;i++){
        cells+= i===0 ? '<td>מסונן: '+shown+' שורות</td>'
                      : '<td>'+(sums[i]!=null?money(round2(sums[i])):"")+'</td>';
      }
      tf.innerHTML='<tr>'+cells+'</tr>';
    }
  }
}
function sortTableByCol(t,col){
  var body=t.tBodies[0]; if(!body) return;
  var dir=(t.getAttribute("data-sort-col")==String(col) && t.getAttribute("data-sort-dir")==="asc")?"desc":"asc";
  t.setAttribute("data-sort-col",col); t.setAttribute("data-sort-dir",dir);
  function keyOf(tr){
    var cell=tr.cells[col]; if(!cell) return "";
    var txt=String(cell.innerText||"").trim();
    var numTxt=txt.replace(/[^\d.\-]/g,"");
    var d=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(txt);
    if(d) return {n:Number(d[3]+d[2]+d[1])};
    if(numTxt && /^[₪\s\-]*[\d,.]+\s*%?$/.test(txt)){ var v=parseFloat(numTxt); if(isFinite(v)) return {n:v}; }
    return {s:txt};
  }
  var rows=Array.prototype.slice.call(body.rows);
  rows.sort(function(a,b){
    var ka=keyOf(a), kb=keyOf(b), r;
    if(ka.n!=null&&kb.n!=null) r=ka.n-kb.n;
    else r=String(ka.s||ka.n||"").localeCompare(String(kb.s||kb.n||""),"he");
    return dir==="asc"?r:-r;
  });
  /* קיבוץ אב/בנים חייב לשרוד את המיון — אחרת שורות "↳" נוחתות מתחת
     לשלב שאין להן קשר אליו. ממיינים את שורות האב, וכל בן נצמד לאביו. */
  var kidsOf={}, tops=[];
  rows.forEach(function(tr){
    var par=tr.getAttribute("data-parent");
    if(par){ (kidsOf[par]=kidsOf[par]||[]).push(tr); } else tops.push(tr);
  });
  var seen={};
  tops.forEach(function(tr){
    body.appendChild(tr);
    var id=tr.getAttribute("data-eid");
    if(id&&kidsOf[id]){ kidsOf[id].forEach(function(k){ body.appendChild(k); seen[id]=1; }); }
  });
  /* בן שאביו מסונן החוצה — מוצג לבד, בסוף, כדי שלא ייעלם */
  Object.keys(kidsOf).forEach(function(pid){
    if(!seen[pid]) kidsOf[pid].forEach(function(k){ body.appendChild(k); });
  });
  /* חיווי כיוון על הכותרת */
  var hr=t.tHead.rows[0];
  Array.prototype.forEach.call(hr.cells,function(th,i){
    var mark=th.querySelector(".sort-mark");
    if(mark) mark.remove();
    if(i===col){
      var sp=document.createElement("span");
      sp.className="sort-mark"; sp.style.color="var(--brand)";
      sp.textContent=" "+(dir==="asc"?"▲":"▼");
      th.appendChild(sp);
    }
  });
}
function countLine(shown,total,what){
  if(shown===total) return '<span class="muted">'+total+' '+esc(what)+'</span>';
  return '<span class="pill">מציג '+shown+' מתוך '+total+'</span>';
}

/* ============================================================
   ייצוא לאקסל — קובץ xlsx אמיתי, בלי שום ספרייה חיצונית
   ------------------------------------------------------------
   xlsx הוא ZIP של קבצי XML. אנחנו בונים את ה-ZIP בשיטת "stored"
   (בלי דחיסה) — כך צריך רק CRC32, בלי תלות ב-CompressionStream,
   וזה עובד בכל דפדפן. אקסל וגוגל שיטס פותחים את זה כרגיל.

var _crcT=null;
function crc32(b){
  if(!_crcT){ _crcT=new Uint32Array(256);
    for(var i=0;i<256;i++){ var c=i; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); _crcT[i]=c>>>0; } }
  var c=0xFFFFFFFF;
  for(var j=0;j<b.length;j++) c=_crcT[(c^b[j])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  function u16(v){ return [v&255,(v>>8)&255]; }
  function u32(v){ return [v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255]; }
  var parts=[], cd=[], off=0;
  files.forEach(function(f){
    var nm=new TextEncoder().encode(f.name), crc=crc32(f.data), len=f.data.length;
    var lh=[].concat([0x50,0x4B,0x03,0x04],u16(20),u16(0x0800),u16(0),u16(0),u16(0),
      u32(crc),u32(len),u32(len),u16(nm.length),u16(0));
    parts.push(new Uint8Array(lh),nm,f.data);
    cd.push({nm:nm,crc:crc,len:len,off:off});
    off+=lh.length+nm.length+len;
  });
  var cdStart=off, cdParts=[];
  cd.forEach(function(c){
    var h=[].concat([0x50,0x4B,0x01,0x02],u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),
      u32(c.crc),u32(c.len),u32(c.len),u16(c.nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));
    cdParts.push(new Uint8Array(h),c.nm);
    off+=h.length+c.nm.length;
  });
  var eocd=new Uint8Array([].concat([0x50,0x4B,0x05,0x06],u16(0),u16(0),
    u16(files.length),u16(files.length),u32(off-cdStart),u32(cdStart),u16(0)));
  return new Blob(parts.concat(cdParts,[eocd]),

function xlEsc(s){

    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c];

function colLetter(i){ var s=""; i++; while(i>0){ var m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26; } return s; }

function safeSheetName(s,used){
  var n=String(s||"גיליון").replace(/[\\\/\?\*\[\]:]/g," ").trim().slice(0,28)||"גיליון";
  var base=n, i=2; while(used[n]){ n=base.slice(0,26)+" "+(i++); }

/* sheets: [{name, rows:[[cell,…]], foot:[[cell,…]]}]

function xlsxBlob(sheets){

  function put(nm,str){ files.push({name:nm,data:new TextEncoder().encode(str)}); }
  var XD='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';

  sheets.forEach(function(sh,si){
    var name=safeSheetName(sh.name,used); names.push(name);
    var body=(sh.rows||[]).filter(function(r){ return r && r.length; });
    var foot=(sh.foot||[]);
    var nCols=0;
    body.concat(foot).forEach(function(r){ if(r.length>nCols) nCols=r.length; });
    if(!nCols){ nCols=1; body=[["אין נתונים"]]; }

    var widths=new Array(nCols).fill(10);
    body.concat(foot).forEach(function(r){
      for(var i=0;i<nCols;i++){
        var c=r[i]; if(c==null) continue;
        var v=(typeof c==="object")?c.v:c;
        var L=String(v==null?"":v).length+3;
        if(L>widths[i]) widths[i]=Math.min(L,46);
      }
    });

    function cellXml(ref,c,foot){
      if(c==null||c==="") return '<c r="'+ref+'"'+(foot?' s="6"':'')+'/>';
      var t=(typeof c==="object")?(c.t||"s"):((typeof c==="number")?"n":"s");
      var v=(typeof c==="object")?c.v:c;

        return '<c r="'+ref+'" s="3"><v>'+d+'</v></c>'; }
      if(t==="n"||t==="money"||t==="pct"){
        var n=Number(v); if(!isFinite(n)) n=0;
        var s=foot?5:(t==="money"?2:(t==="pct"?4:0));
        return '<c r="'+ref+'" s="'+s+'"><v>'+n+'</v></c>';
      }
      return '<c r="'+ref+'" t="inlineStr"'+(foot?' s="6"':'')+'><is><t xml:space="preserve">'+xlEsc(v)+'</t></is></c>';
    }

    var xml=XD+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+

      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'+
      '<sheetFormatPr defaultRowHeight="15"/><cols>';
    for(var i=0;i<nCols;i++) xml+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+widths[i]+'" customWidth="1"/>';
    xml+='</cols><sheetData>';
    var rn=0;
    body.forEach(function(r,ri){
      rn++;
      xml+='<row r="'+rn+'">';
      for(var i=0;i<nCols;i++){
        var c=r[i];
        if(ri===0){    // שורת כותרת

          xml+= (v==null||v==="") ? '<c r="'+colLetter(i)+rn+'" s="1"/>'
            : '<c r="'+colLetter(i)+rn+'" s="1" t="inlineStr"><is><t xml:space="preserve">'+xlEsc(v)+'</t></is></c>';
        } else xml+=cellXml(colLetter(i)+rn,c,false);
      }
      xml+='</row>';
    });
    foot.forEach(function(r){
      rn++;

    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+

  put("xl/_rels/workbook.xml.rels",XD+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    names.map(function(_,i){ return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'; }).join("")+

/* שער מרכזי להורדות: משתמש בהרשאת צפייה בלבד אינו מוריד קבצים.
   הכפתורים מוסתרים ממנו ממילא, אבל השער כאן חוסם גם קריאה ישירה. */
function canDownload(){ return can("edit"); }   /* מחייב משתמש מחובר עם הרשאת עריכה */
function downloadBlob(blob,filename){
  if(!canDownload()){ toast("להורדת קבצים נדרשת הרשאת עריכה — פנה למנהל","err"); return; }
  var url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=filename; a.style.display="none";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },2000);
}
function stamp(){ var d=new Date(); function p(x){return ("0"+x).slice(-2);}
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function saveXlsx(sheets,filename){

    downloadBlob(xlsxBlob(sheets),String(filename).replace(/[\\\/:*?"<>|]/g,"-")+" "+stamp()+".xlsx");
    toast("הקובץ ירד — ניתן לפתוח באקסל","ok");
  }catch(err){ toast("הייצוא נכשל: "+err.message,"err"); }
}

/* ---------- המרת טבלה שעל המסך לגיליון ---------- */
function xlParse(txt){
  /* סימני כיווניות נמחקים ולא מוחלפים ברווח, אחרת נוצר רווח מדומה
     שלא היה על המסך ומחרוזות "₪‎-1,234" לא מזוהות כמספר. */
  var s=String(txt==null?"":txt).replace(/[‎‏‪-‮]/g,"").replace(/ /g," ").trim();
  if(!s) return "";
  var d=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if(d) return {t:"d",v:d[3]+"-"+("0"+d[2]).slice(-2)+"-"+("0"+d[1]).slice(-2)};
  /* הערה בסוגריים אחרי הסכום ("₪-1,234 (חייב)") — הערך הוא המספר */
  var body=s.replace(/\s*\([^()]*\)\s*$/,"").trim()||s;
  var isMoney=/₪/.test(body), isPct=/%\s*$/.test(body);
  var core=body.replace(/₪/g,"").replace(/%/g,"").replace(/,/g,"").trim();
  if(core && /^-?\d+(\.\d+)?$/.test(core)){
    /* מחרוזת ספרות שאינה ערך מספרי — טלפון, ת"ז, מספר חשבון — נשארת
       טקסט: אפס מוביל היה נמחק, ומספר ארוך היה מאבד דיוק. */
    var digits=core.replace(/^-/,"").replace(".","");
    var looksId = (!isMoney && !isPct) && (/^0\d/.test(core) || digits.length>15);
    var n=parseFloat(core);
    if(!looksId && isFinite(n)) return {t:isMoney?"money":(isPct?"pct":"n"),v:n};
    if(looksId) return s;
  }
  /* תא רב-שורתי שבשורתו הראשונה מספר והשאר הערת תצוגה — לוקחים את המספר */
  if(s.indexOf("\n")>0){
    var first=xlParse(s.split("\n")[0]);
    if(first && typeof first==="object" && first.t!=="d") return first;
  }
  return s;
}
/* פורש שורה לפי colspan, כך שעמודות נשארות מיושרות */
function xlRowCells(tr,n){
  var out=new Array(n).fill(null), i=0;
  Array.prototype.forEach.call(tr.cells,function(c){
    var span=Math.max(1,Number(c.getAttribute("colspan"))||1);
    if(i<n) out[i]=c;
    i+=span;
  });
  return out;
}
/* טקסט התא לצורך ייצוא. אלמנטים עם data-xl-skip הם הערות תצוגה
   ("סך תתי-השלבים", תגיות מונה) ולא חלק מהערך — מסירים אותם. */
function cellText(c){
  if(!c) return "";
  var t;
  if(c.querySelector && c.querySelector("[data-xl-skip]")){
    var cl=c.cloneNode(true);
    cl.querySelectorAll("[data-xl-skip]").forEach(function(x){ x.remove(); });
    t=cl.textContent||"";
  } else t=c.innerText||c.textContent||"";
  t=String(t).replace(/[▲▼]/g,"").trim();
  /* תא שכל תוכנו תיבת סימון — הערך שעל המסך הוא המצב שלה */
  if(!t){
    var cb=c.querySelector&&c.querySelector('input[type="checkbox"]');
    if(cb) return cb.checked?"כן":"לא";
  }
  return t;
}
/* עמודות שלא מיוצאות: עמודת פעולות (רק כפתורים/פקדים או ריקה),
   או עמודה שהכותרת שלה מסומנת data-xl-skip (גרף, פס התפלגות וכד'). */
function xlSkipCols(hr,rows,n){
  var skip=new Array(n).fill(false);
  for(var i=0;i<n;i++){
    if(hr&&hr[i]&&hr[i].hasAttribute&&hr[i].hasAttribute("data-xl-skip")){ skip[i]=true; continue; }
    var any=false, onlyCtl=true;
    rows.forEach(function(r){
      var c=r[i]; if(!c) return;
      var t=cellText(c); if(!t) return;
      any=true;
      var clone=c.cloneNode(true);
      clone.querySelectorAll("button,input,select,textarea").forEach(function(x){ x.remove(); });
      if(String(clone.textContent||"").trim()) onlyCtl=false;
    });
    var head=hr?cellText(hr[i]):"";
    if(!head && (!any || onlyCtl)) skip[i]=true;
  }
  return skip;
}
function tableToSheet(t,name){
  var head=t.tHead, bodyEl=t.tBodies[0];
  var hr0=head&&head.rows.length?head.rows[0]:null;
  var n=0;
  if(hr0) Array.prototype.forEach.call(hr0.cells,function(c){ n+=Math.max(1,Number(c.getAttribute("colspan"))||1); });
  if(!n && bodyEl&&bodyEl.rows.length) n=bodyEl.rows[0].cells.length;
  if(!n) return {name:name,rows:[]};

  var hr=hr0?xlRowCells(hr0,n):null;
  /* רק שורות שנראות על המסך — כך שהייצוא מכבד את הסינון הפעיל */
  var visible=[];
  if(bodyEl) Array.prototype.forEach.call(bodyEl.rows,function(tr){
    if(tr.style.display==="none") return;
    if(tr.querySelector("td.empty")) return;
    visible.push(xlRowCells(tr,n));
  });
  var skip=xlSkipCols(hr,visible,n);
  function pack(cells,raw){
    var out=[];
    for(var i=0;i<n;i++){ if(skip[i]) continue; out.push(raw?cellText(cells[i]):xlParse(cellText(cells[i]))); }
    return out;
  }
  var rows=[];
  rows.push(hr?pack(hr,true):[]);
  visible.forEach(function(r){ rows.push(pack(r,false)); });
  var foot=[];
  if(t.tFoot) Array.prototype.forEach.call(t.tFoot.rows,function(tr){ foot.push(pack(xlRowCells(tr,n),false)); });
  return {name:name,rows:rows,foot:foot};
}
function exportTableEl(t,filename,sheetName){
  var sh=tableToSheet(t,sheetName||"נתונים");
  if(sh.rows.length<2){ toast("אין שורות לייצוא","warn"); return; }
  saveXlsx([sh],filename||"טבלה");
}
/* כפתור ייצוא לכל טבלה על המסך */
var _xlSeq=0, _xlReg={};
function attachExportButtons(root){
  if(!canDownload()) return;   /* צופה — אין טעם בכפתור שיידחה בשער ההורדות */
  var scope=root||document;
  /* טבלה שנדרסה ברינדור חלקי כבר לא ב-DOM. בלי הניקוי הזה המפה
     הייתה גדלה בלי גבול ומחזיקה טבלאות מנותקות בזיכרון. */
  Object.keys(_xlReg).forEach(function(k){
    if(!document.body.contains(_xlReg[k])) delete _xlReg[k];
  });
  scope.querySelectorAll("table.tbl").forEach(function(t){
    if(t.getAttribute("data-xl")) return;
    if(!t.tBodies.length||!t.tBodies[0].rows.length) return;
    if(t.tBodies[0].rows.length===1&&t.tBodies[0].rows[0].querySelector("td.empty")) return;
    var id="xl"+(++_xlSeq); t.setAttribute("data-xl",id); _xlReg[id]=t;
    var title=xlTitleFor(t);
    var bar=document.createElement("div");
    bar.className="xl-bar";
    bar.innerHTML='<button class="btn btn-ghost btn-sm" onclick="exportById(\''+id+'\')" '+
      'title="ייצוא הטבלה לאקסל (מכבד את הסינון הפעיל)">⬇️ אקסל</button>';
    var wrap=t.closest(".table-wrap")||t;
    wrap.parentNode.insertBefore(bar,wrap);
  });
}
function xlTitleFor(t){
  var box=t.closest(".card")||t.closest(".modal")||null;
  var h=box?box.querySelector("h3,h4,.section-title"):null;
  var s=h?String(h.innerText||h.textContent||"").trim():"";
  /* מחלקת תווים עם אימוג'י מתפרקת ליחידות UTF-16 ומשאירה חצי סורוגייט,
     שהופך ל-"�" בשם הגיליון ובשם הקובץ. עובדים ברמת נקודת קוד. */
  s=Array.from(s).filter(function(ch){
    var cp=ch.codePointAt(0);
    if(cp===0xFE0F||cp===0x200D||cp===0x20E3) return false;
    if(cp>=0x2190&&cp<=0x27BF) return false;
    if(cp>=0x2B00&&cp<=0x2BFF) return false;
    if(cp>=0x1F000&&cp<=0x1FAFF) return false;
    return true;
  }).join("").replace(/\s+/g," ").trim();
  return s.slice(0,40)||"טבלה";
}
/* רינדור חלקי (חיפוש, סינון, מיון, בורר שותף…) דורס innerHTML של מכולה
   פנימית ומוחק איתו את שורת הכפתור ואת שורת הסינון. במקום לזכור לקרוא
   לזה מתוך כל פונקציית רינדור — משקיפים על ה-DOM ומחזירים את הכלים
   לכל טבלה חדשה, כך שגם כל טבלה עתידית מכוסה מאליה. */
var _toolsPending=false;
function scheduleTableTools(){
  if(_toolsPending) return;
  _toolsPending=true;
  setTimeout(function(){
    _toolsPending=false;
    try{ attachTableTools(document); attachExportButtons(document); }catch(e){}
  },60);
}
/* כל בורר שיש בו אופציית "הוסף חדש…" זוכר את ערכו לפני השינוי, כדי
   שביטול ה-prompt יחזיר את הבחירה במקום למחוק אותה. */
function watchSelects(){
  ["focusin","change"].forEach(function(ev){
    document.addEventListener(ev,function(e){
      var el=e.target;
      if(el&&el.tagName==="SELECT"&&el.value!=="__new") el.setAttribute("data-prev",el.value);
    },true);
  });
}
function watchTables(){
  if(!window.MutationObserver) return;
  new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      var ad=muts[i].addedNodes;
      for(var j=0;j<ad.length;j++){
        var n=ad[j];
        if(n.nodeType!==1) continue;
        if((n.matches&&n.matches("table.tbl"))||(n.querySelector&&n.querySelector("table.tbl"))){
          scheduleTableTools(); return;
        }
      }
    }
  }).observe(document.body,{childList:true,subtree:true});
}
function exportById(id){
  var t=_xlReg[id]; if(!t||!document.body.contains(t)){ toast("הטבלה כבר לא על המסך","err"); return; }
  var nm=xlTitleFor(t);
  var a=currentApartment();
  exportTableEl(t,(a?a.name+" — ":"")+nm,nm);
}

   כאן לא מייצאים את מה שעל המסך אלא את הנתונים עצמם, עם שמות במקום

function M(v){ return {t:"money",v:round2(v)}; }

  return {name:"דירות",rows:rows,

function sheetExpenses(list){

      if(!cont){ t[0]+=Number(e.amount)||0; t[1]+=mg; t[2]+=expensePaid(e.id); t[3]+=rem; t[4]+=mgrPaid; }
    });
  });
  return {name:"שלבים",rows:rows,
    foot:[["סה\"כ (בלי שלבי-אב, כדי לא לספור פעמיים)","","","","","","",M(t[0]),M(t[1]),M(t[2]),M(t[3]),M(t[4])]]};

function sheetCategories(list){

  if(!nm){ toast("יש להזין שם חשבון","err"); return; }
  var isBank=checked("pm-newacc-bank");
  var scope=val("pm-newacc-scope");   // "" = כללי לכל הדירות
  var k=normKey(nm);
  var exist=availAccounts(aptId).find(function(a){ return normKey(a.name)===k; });
  var id;
  if(exist){ id=exist.id; toast("החשבון כבר קיים — נבחר","warn"); }
  else{
    id=uid();
    DB.accounts.push({id:id,apartmentId:(scope==="apt"?aptId:null),name:nm,isBank:isBank,partnerId:null,deleted:false});
    save(); toast('נוסף החשבון "'+nm+'"',"ok");
  }
  var sel=document.getElementById("pm-account");
  if(sel){ sel.innerHTML=accountOptions(aptId,id); sel.value=id; }
  var wrap=document.getElementById("pm-newacc"); if(wrap) wrap.style.display="none";
  var nmEl=document.getElementById("pm-newacc-name"); if(nmEl) nmEl.value="";
  onPmAccount();
}

  var h='<div class="toolbar"><h3 style="margin:0">שותפי הדירה ואחוזי ברירת מחדל</h3><div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-primary btn-sm" onclick="addApartmentPartner(\''+aptId+'\')">➕ הוסף שותף</button>':'')+'</div>';
  h+='<div class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>שותף</th><th>% ברירת מחדל</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td>'+esc(partnerName(r.partnerId))+'</td><td>'+num(r.defaultPercent)+'%</td><td class="right">'+
      (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="editApPartner(\''+r.id+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="softDelete(\'apartmentPartners\',\''+r.id+'\',\'להסיר שותף זה מהדירה?\')">🗑️</button>':'')+'</td></tr>';
  });

  if(Math.abs(sum-100)>=0.01) h+='<div class="hint neg">שים לב: סכום האחוזים אינו 100%.</div>';
  h+='</div>';
  h+=splitPresetsCardHtml(aptId);

  openModal({title:"הוספת שותף לדירה",bodyHtml:
    '<div class="field"><label>בחר שותף קיים</label><select id="apn-existing"><option value="">— חדש —</option>'+
      avail.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join("")+'</select></div>'+
    '<div class="field"><label>או שם שותף חדש</label><input id="apn-new" placeholder="שם"></div>'+
    '<div class="field"><label>% ברירת מחדל</label><input id="apn-pct" type="number" step="0.01" value="0"></div>',
    onSave:function(){
      var pid=val("apn-existing"); var newName=val("apn-new").trim();

      DB.apartmentPartners.push({id:uid(),apartmentId:aptId,partnerId:pid,defaultPercent:Number(val("apn-pct"))||0,deleted:false});

/* הדירה נלקחת מהמצב ולא מפרמטר משורשר לתוך מאפיין HTML —
   שרשור כזה שבר את הציטוט ובלם את כל הסינונים. */
function renderExpTable(aptId){ return withIndex(function(){ return renderExpTableInner(aptId); }); }
function renderExpTableInner(aptId){
  aptId=aptId||state.params.apartmentId;
  var el=document.getElementById("exp-table"); if(el) el.innerHTML=expTableHtml(aptId);
}
/* ---------- תת-שלבים ----------
   שלב שיש לו תתי-שלבים הוא "מכל": הסכום שלו נגזר מסך תתי-השלבים
   (חשמל = 15,000 כשמתוכו 7,500 ל-5/22 ו-7,500 ל-6/22), והוא עצמו
   אינו נספר בחישובים — תתי-השלבים הם ההוצאות האמיתיות, ולכן אין
   ספירה כפולה. הכסף, החלוקה והתשלומים יושבים בתתי-השלבים. */
function expenseChildren(eId){
  if(IX) return IX.kidsByPar[eId]||IX_EMPTY;
  return active(DB.expenses).filter(function(x){ return x.parentId===eId; });
}
function isContainer(eId){ return expenseChildren(eId).length>0; }
/* ההוצאות שנספרות בכסף: הכל חוץ ממכלים */
function apLeafExpenses(aptId){
  if(IX){ var c=IX.leaf[aptId];
    if(!c){ c=IX.leaf[aptId]=apExpenses(aptId).filter(function(e){ return !isContainer(e.id); }); }
    return c; }
  return apExpenses(aptId).filter(function(e){ return !isContainer(e.id); });
}
/* סכום המכל = סך תתי-השלבים. נקרא אחרי כל שינוי בתת-שלב.
   גם כשנמחק תת-השלב האחרון הסכום מתאפס: אחרת השלב היה חוזר להיספר
   כשלב רגיל, עם סכום של בנים שכבר לא קיימים — וללא חלוקת שותפים,
   כך שהעלות הכוללת הייתה גדלה בלי שאף שותף מחויב בה. */
function syncParentAmount(pid){
  var p=byId(DB.expenses,pid); if(!p) return;
  var kids=expenseChildren(pid);
  if(!kids.length){
    /* מאפסים רק כשזה מכל לשעבר — בלי חלוקה ובלי תשלומים משלו —
       כדי שקריאה שגויה לא תמחק סכום של שלב אמיתי. */
    if(!expSplits(pid).length && !expPayments(pid).length) p.amount=0;
    return;
  }
  p.amount=round2(kids.reduce(function(s,k){return s+(Number(k.amount)||0);},0));
}
function syncAllParents(aptId){
  apExpenses(aptId).forEach(function(e){ if(isContainer(e.id)) syncParentAmount(e.id); });
}
/* הפיכת שלב קיים למכל: אם יש בו כסף/תשלומים/חלוקה — מעבירים אותם
   לתת-שלב ראשון, כדי ששום דבר לא ייעלם כשהאב הופך לסיכום. */
function convertToContainer(pid,silent){
  var p=byId(DB.expenses,pid); if(!p) return true;
  if(isContainer(pid)) return true;                     // כבר מכל
  var pays=expPayments(pid);
  var hasMoney=(Number(p.amount)||0)>0.01 || pays.length;
  if(!hasMoney){ return true; }
  if(!silent && !confirm('"'+p.description+'" יהפוך לשלב-אב שמסכם את תתי-השלבים.\n\n'+
    'הסכום הקיים ('+money(p.amount)+')'+(pays.length?' ו-'+pays.length+' התשלומים שלו':'')+
    ' יועברו לתת-שלב ראשון, כדי שלא ייעלמו.\n\nלהמשיך?')) return false;
  var cid=uid();
  DB.expenses.push({id:cid,apartmentId:p.apartmentId,categoryId:p.categoryId||"",
    classification:p.classification,description:p.description,amount:p.amount,date:p.date,
    note:p.note||"",hasInvoice:p.hasInvoice,invoiceLink:p.invoiceLink||"",
    mgmtEnabled:p.mgmtEnabled,mgmtBaseType:p.mgmtBaseType,mgmtVatRate:p.mgmtVatRate,
    parentId:pid,deleted:false});
  /* מעבירים חלוקה, דמי ניהול ותשלומים לתת-השלב */
  DB.expenseSplits.forEach(function(s){ if(s.expenseId===pid) s.expenseId=cid; });
  DB.expenseManagerFees.forEach(function(f){ if(f.expenseId===pid) f.expenseId=cid; });
  DB.payments.forEach(function(x){ if(x.expenseId===pid) x.expenseId=cid; });
  p.mgmtEnabled=false; p.hasInvoice=false; p.invoiceLink="";
  syncParentAmount(pid);
  return true;
}
function expenseParentOptions(aptId,selfId,sel){
  var opts=apExpenses(aptId).filter(function(e){
    if(e.id===selfId) return false;
    if(e.parentId) return false;          // רק רמה אחת של קינון
    return true;
  }).sort(function(x,y){ return String(x.description).localeCompare(String(y.description),"he"); });
  return '<option value="">— שלב עצמאי (ללא אב) —</option>'+
    opts.map(function(e){
      return '<option value="'+e.id+'"'+(e.id===sel?" selected":"")+'>'+esc(e.description)+'</option>'; }).join("");
}
/* הוספת תת-שלב מתוך שורת האב */
function addSubExpense(parentId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var p=byId(DB.expenses,parentId); if(!p) return;
  if(p.parentId){ toast("אפשר תת-שלב רק תחת שלב עצמאי","err"); return; }
  /* מרגע שיש תת-שלב, השלב הופך למכל שמסכם אותם. כסף שכבר רשום עליו
     עובר לתת-שלב ראשון כדי שלא ייעלם. */
  var wasLeaf=!isContainer(parentId);
  if(!convertToContainer(parentId)) return;
  if(wasLeaf && isContainer(parentId)){ save(); toast("הכסף שהיה על השלב הועבר לתת-שלב ראשון","ok"); }
  openExpenseEditor(null,p.apartmentId,parentId);
}
function filteredExpenses(aptId){
  return apExpenses(aptId).filter(function(e){
    if(!matches(Q.exp, e.description+" "+(e.note||""))) return false;
    if(Q.expStatus && expenseStatus(e.id)!==Q.expStatus) return false;
    if(Q.expClass && e.classification!==Q.expClass) return false;
    return true;
  });
}
function expTableHtml(aptId){
  var a=byId(DB.apartments,aptId);
  var all=apExpenses(aptId);
  var exps=filteredExpenses(aptId);
  var cnt=document.getElementById("exp-count");
  if(cnt) cnt.innerHTML=countLine(exps.length,all.length,"שלבים");
  if(!exps.length) return '<div class="empty">לא נמצא שלב שמתאים לסינון</div>';
  var selC=can("edit");
  var h='<div class="table-wrap"><table class="tbl"><thead><tr>'+
    (selC?'<th data-xl-skip="1" style="width:30px"><input type="checkbox" title="סמן הכל" style="width:auto" onclick="ebAll(this.checked)"></th>':'')+
    '<th>תאריך</th><th>תיאור</th><th>סיווג</th><th>סכום</th>'+
    (a.hasManagement?'<th>דמי ניהול</th>':'')+'<th>שולם</th><th>נותר</th><th>סטטוס</th><th></th></tr></thead><tbody>';

  /* שורת שלב — נעשה שימוש גם לאב וגם לתת-שלב */
  function rowFor(e,isChild){
    var st=expenseStatus(e.id), rem=expenseRemaining(e.id);
    var badge=st==="paid"?'<span class="badge badge-ok">שולם</span>'
      :st==="over"?'<span class="badge badge-warn">⚠️ ביתר</span>'
      :st==="partial"?'<span class="badge badge-warn">חלקי</span>':'<span class="badge badge-danger">לא שולם</span>';
    var kids=expenseChildren(e.id), cont=kids.length>0;
    var mg=expenseMgmtCostLive(e.id);
    return '<tr data-eid="'+e.id+'"'+(isChild?' data-parent="'+e.parentId+'"':'')+
      (isChild?' style="background:#fbfcff"':(cont?' style="background:#f5f8ff"':''))+'>'+
      (selC?'<td>'+(cont?'':'<input type="checkbox" class="eb-x" value="'+e.id+'" style="width:auto" onchange="ebCount()">')+'</td>':'')+
      '<td>'+dateHe(e.date)+'</td>'+
      '<td'+(isChild?' style="padding-right:26px"':'')+'>'+
        (isChild?'<span class="muted">↳ </span>':'')+
        '<b>'+esc(e.description)+'</b>'+(e.hidden?' <span class="badge badge-danger" title="מוסתר משאר המשתמשים">🔒 מוסתר</span>':'')+(e.hasInvoice?' 📎':'')+
        (cont?' <span class="pill" data-xl-skip="1">'+kids.length+' תתי-שלבים</span>':'')+'</td>'+
      '<td>'+(CLASSIFICATIONS[e.classification]||"")+'</td>'+
      '<td><b>'+money(e.amount)+'</b>'+(cont?'<div class="muted" data-xl-skip="1" style="font-size:11px">סך תתי-השלבים</div>':'')+'</td>'+
      (a.hasManagement?'<td>'+((cont||e.mgmtEnabled)&&mg?money(mg):'—')+'</td>':'')+
      '<td>'+money(expensePaid(e.id))+'</td><td class="'+(Math.abs(rem)>0.01?"neg":"pos")+'">'+money(rem)+'</td><td>'+badge+'</td>'+
      '<td class="right" style="white-space:nowrap">'+
        /* למכל אין תשלומים משלו — הכסף יושב בתתי-השלבים */
        (cont?'':'<button class="btn btn-ghost btn-sm" onclick="openPayments(\''+e.id+'\')" title="תשלומים">💳</button>')+
        (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openExpenseEditor(\''+e.id+'\',\''+aptId+'\')" title="עריכה">✏️</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="softDelete(\'expenses\',\''+e.id+'\',\'למחוק הוצאה זו?\')">🗑️</button>':'')+'</td></tr>';
  }

  /* קיבוץ: אב ואחריו תתי-השלבים שלו. תת-שלב שהאב שלו לא במסונן — מוצג לבד.
     שורת האב היא כבר הסיכום (סכום, שולם ונותר מגולגלים), ולכן היא נספרת
     פעם אחת בסיכום התחתון והתתי-שלבים שמתחתיה לא נספרים שוב. */
  var shown={}; exps.forEach(function(e){ shown[e.id]=1; });
  var order=exps.slice().sort(function(x,y){return (x.date<y.date)?1:-1;});
  var tot=0, totPaid=0;
  order.forEach(function(e){
    if(e.parentId && shown[e.parentId]) return;          // ייוצג תחת האב
    h+=rowFor(e,!!e.parentId);
    tot+=(Number(e.amount)||0); totPaid+=expensePaid(e.id);
    expenseChildren(e.id).filter(function(k){ return shown[k.id]; })
      .sort(function(x,y){return (x.date<y.date)?1:-1;})
      .forEach(function(k){ h+=rowFor(k,true); });
  });
  var lbl=(exps.length===all.length)?'סה"כ':'סה"כ המסונן';
  h+='</tbody><tfoot><tr><td colspan="'+(selC?4:3)+'">'+lbl+'</td><td>'+money(tot)+'</td>'+(a.hasManagement?'<td></td>':'')+'<td>'+money(totPaid)+'</td><td>'+money(tot-totPaid)+'</td><td colspan="2"></td></tr></tfoot></table></div>';
  return h;
}
/* ============================================================
   עדכון מרוכז להוצאות — כמו בתשלומים
   ============================================================ */
function ebVisibleBoxes(sel){ return visibleBoxes(sel||".eb-x"); }
function ebAll(v){ ebVisibleBoxes().forEach(function(c){ c.checked=v; }); ebCount(); }
function ebCount(){
  var n=ebVisibleBoxes(".eb-x:checked").length;
  var hidden=document.querySelectorAll(".eb-x:checked").length-n;
  var el=document.getElementById("eb-count");
  if(el) el.textContent=n?("("+n+(hidden?" · "+hidden+" מוסתרים בסינון לא ישתנו":"")+")"):"";
}
function openBulkExpEdit(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var ids=ebVisibleBoxes(".eb-x:checked").map(function(c){ return c.value; });

  var exps=ids.map(function(id){ return byId(DB.expenses,id); }).filter(Boolean);

    '<div class="hint" style="margin-bottom:10px">שדה שנשאר על <b>"— ללא שינוי —"</b> לא ישתנה באף שלב.</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>קטגוריה</label><select id="eb-cat" onfocus="this.setAttribute(\'data-prev\',this.value)" onchange="onCatPick(\'eb-cat\')">'+
        '<option value="__keep">— ללא שינוי —</option>'+
        '<option value="">ללא קטגוריה</option>'+
        catsSorted().map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'; }).join("")+
        '<option value="__new">➕ קטגוריה חדשה…</option></select></div>'+
      '<div class="field"><label>סיווג</label><select id="eb-class">'+
        '<option value="__keep">— ללא שינוי —</option>'+
        Object.keys(CLASSIFICATIONS).map(function(k){ return '<option value="'+k+'">'+CLASSIFICATIONS[k]+'</option>'; }).join("")+'</select></div>'+
      '<div class="field"><label>תאריך</label><input id="eb-date" type="date"><div class="hint">ריק = ללא שינוי</div></div>'+
      (a&&a.hasManagement?'<div class="field"><label>דמי ניהול</label><select id="eb-mgmt">'+
        '<option value="__keep">— ללא שינוי —</option><option value="on">הפעל</option><option value="off">כבה</option></select></div>':'')+
    '</div>'+
    (CU&&CU.role==="admin"?'<div class="field" style="background:#fff7f7;border:1px solid #f0d0d0;border-radius:10px;padding:8px"><label>🔒 הסתרה משאר המשתמשים</label>'+
      '<select id="eb-hidden"><option value="__keep">— ללא שינוי —</option><option value="on">הסתר</option><option value="off">חשוף</option></select></div>':''),
    saveLabel:"עדכן "+exps.length+" שלבים",onSave:function(){ return applyBulkExpEdit(aptId,ids); }});
}
function applyBulkExpEdit(aptId,ids){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var cat=val("eb-cat"), cls=val("eb-class"), date=val("eb-date");
  var mg=document.getElementById("eb-mgmt")?val("eb-mgmt"):"__keep";
  var hid=document.getElementById("eb-hidden")?val("eb-hidden"):"__keep";
  if((cat==="__keep"||cat==="__new") && cls==="__keep" && !date && mg==="__keep" && hid==="__keep"){
    toast("לא נבחר מה לעדכן","warn"); return false;
  }
  var n=0;
  ids.forEach(function(id){
    var e=byId(DB.expenses,id); if(!e||e.deleted) return;
    if(cat!=="__keep" && cat!=="__new") e.categoryId=cat;
    if(cls!=="__keep") e.classification=cls;
    if(date) e.date=date;
    if(mg==="on") e.mgmtEnabled=true; else if(mg==="off") e.mgmtEnabled=false;
    if(CU&&CU.role==="admin"){ if(hid==="on") e.hidden=true; else if(hid==="off") e.hidden=false; }
    n++;
  });
  save(); toast("עודכנו "+n+" שלבים","ok"); rerender();
  return true;
}

/* ============================================================
   חלוקות שמורות — ברירות מחדל נוספות בשם, לכל דירה
   נשמרות על אובייקט הדירה (a.splitPresets), כדי לרכב על מנגנון
   הסינון והמיזוג בשרת בלי טבלה חדשה.
   ============================================================ */
function apSplitPresets(aptId){ var a=byId(DB.apartments,aptId); return (a&&a.splitPresets)||[]; }
function splitPresetRows(aptId,presetId){
  if(presetId==="__default"||!presetId)
    return apPartners(aptId).map(function(p){ return {partnerId:p.partnerId,percent:Number(p.defaultPercent)||0}; });
  var p=apSplitPresets(aptId).filter(function(x){ return x.id===presetId; })[0];
  return p?p.rows.map(function(r){return {partnerId:r.partnerId,percent:Number(r.percent)||0};}):[];
}
/* קטע ניהול החלוקות בלשונית "שותפים" */
function splitPresetsCardHtml(aptId){
  var ps=apSplitPresets(aptId);
  var h='<div class="card"><div class="toolbar" style="margin-bottom:6px"><h3 style="margin:0">חלוקות שמורות</h3>'+
    '<div class="hint">ברירות מחדל נוספות בשם — אפשר להחיל אותן על הוצאה בלחיצה</div><div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-primary btn-sm" onclick="editSplitPreset(\''+aptId+'\',null)">➕ חלוקה חדשה</button>':'')+'</div>';
  if(!ps.length) return h+'<div class="empty">אין חלוקות שמורות. "חלוקה חדשה" כדי להוסיף (למשל: "חלוקה לפי השקעה", "חלוקה שווה").</div></div>';
  h+='<div class="table-wrap"><table class="tbl"><thead><tr><th>שם החלוקה</th><th>פירוט</th><th>סה"כ</th><th></th></tr></thead><tbody>';
  ps.forEach(function(p){
    var sum=p.rows.reduce(function(s,r){return s+(Number(r.percent)||0);},0);
    h+='<tr><td><b>'+esc(p.name)+'</b></td><td class="muted">'+
      esc(p.rows.map(function(r){return partnerName(r.partnerId)+" "+num(r.percent)+"%";}).join(" · "))+'</td>'+
      '<td class="'+(Math.abs(sum-100)<0.01?"pos":"neg")+'">'+num(sum)+'%</td>'+
      '<td class="right">'+(can("edit")?'<button class="btn btn-ghost btn-sm" onclick="editSplitPreset(\''+aptId+'\',\''+p.id+'\')">✏️</button> '+
      '<button class="btn btn-ghost btn-sm" onclick="delSplitPreset(\''+aptId+'\',\''+p.id+'\')">🗑️</button>':'')+'</td></tr>';
  });
  return h+'</tbody></table></div></div>';
}
function editSplitPreset(aptId,id){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var ps=apSplitPresets(aptId);
  var p=id?ps.filter(function(x){return x.id===id;})[0]:{name:"",rows:apPartners(aptId).map(function(x){return {partnerId:x.partnerId,percent:Number(x.defaultPercent)||0};})};
  if(!p){ toast("החלוקה לא נמצאה","err"); return; }
  var rows=(p.rows&&p.rows.length)?p.rows:[{partnerId:"",percent:0}];
  openModal({title:id?"עריכת חלוקה שמורה":"חלוקה שמורה חדשה",wide:true,bodyHtml:
    '<div class="field"><label>שם החלוקה</label><input id="sp-name" value="'+esc(p.name||"")+'" placeholder="למשל: חלוקה לפי השקעה"></div>'+
    '<div class="section-title">אחוזים לכל שותף</div>'+
    '<div id="sp-rows">'+rows.map(function(r){return splitRowHtml(r.partnerId,r.percent);}).join("")+'</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">'+
      '<button class="btn btn-sm" onclick="document.getElementById(\'sp-rows\').insertAdjacentHTML(\'beforeend\',splitRowHtml(\'\',0));spSum()">➕ הוסף שותף</button>'+
      '<div>סה"כ: <b id="sp-sum">0%</b></div></div>',
    saveLabel:"שמירה",onSave:function(){ return saveSplitPreset(aptId,id); }});
  setTimeout(spSum,0);
}
function spSum(){
  var s=0; document.querySelectorAll("#sp-rows .sp-pct").forEach(function(i){ s+=Number(i.value)||0; });
  var el=document.getElementById("sp-sum"); if(el){ el.textContent=num(round2(s))+"%"; el.className=Math.abs(s-100)<0.01?"pos":"neg"; }
}
function saveSplitPreset(aptId,id){
  var name=val("sp-name").trim(); if(!name){ toast("יש להזין שם לחלוקה","err"); return false; }
  var byP={}, order=[];
  document.querySelectorAll("#sp-rows .split-row").forEach(function(r){
    var pid=r.querySelector(".sp-partner").value; var pct=Number(r.querySelector(".sp-pct").value)||0;
    if(pid){ if(byP[pid]==null){byP[pid]=0;order.push(pid);} byP[pid]+=pct; }
  });
  var rows=order.map(function(pid){ return {partnerId:pid,percent:byP[pid]}; });
  if(!rows.length){ toast("הוסף לפחות שותף אחד","err"); return false; }
  var sum=rows.reduce(function(s,r){return s+r.percent;},0);
  if(Math.abs(sum-100)>0.01){ toast("סכום החלוקה חייב להיות 100% (כרגע "+num(sum)+"%)","err"); return false; }
  var a=byId(DB.apartments,aptId); a.splitPresets=a.splitPresets||[];
  if(id){ var p=a.splitPresets.filter(function(x){return x.id===id;})[0]; if(p){ p.name=name; p.rows=rows; } }
  else a.splitPresets.push({id:uid(),name:name,rows:rows});
  save(); toast("נשמר","ok"); rerender();
}
function delSplitPreset(aptId,id){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var a=byId(DB.apartments,aptId); if(!a||!a.splitPresets) return;
  var p=a.splitPresets.filter(function(x){return x.id===id;})[0];
  if(!confirm('למחוק את החלוקה "'+(p?p.name:"")+'"?')) return;
  a.splitPresets=a.splitPresets.filter(function(x){return x.id!==id;});
  save(); toast("נמחק","ok"); rerender();
}
/* בורר "החל חלוקה" בעורך ההוצאה */
function exSplitChooserHtml(aptId){

    '</select><div class="hint">ממלא את שורות החלוקה למטה לפי החלוקה שנבחרה. אפשר לשנות ידנית אחרי כן.</div></div>';
}
function applyExSplit(aptId){
  var sel=document.getElementById("ex-split-preset"); if(!sel) return;

      '<td>'+(r.mgr?'<span class="badge badge-mgmt">🧾 דמי ניהול</span> ':'')+esc(r.recip)+'</td><td>'+esc(r.method)+'</td><td>'+esc(r.inv)+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="3">סה"כ ('+rows.length+' תנועות)'+(depTot?' · מזה הפקדות '+money(depTot):'')+'</td><td>'+money(round2(tot+depTot))+'</td><td colspan="3"></td></tr></tfoot></table></div>';

/* ---------- דמי ניהול מרוכז: החלה על הרבה שלבים בבת אחת ---------- */

  if(!a.hasManagement){
    toast("דמי ניהול כבויים בדירה — הפעל בלשונית \"דמי ניהול\"","err");
    go("apartment",{apartmentId:aptId,tab:"managers"}); return;
  }
  var mgrs=apManagers(aptId);
  if(!mgrs.length){
    toast("אין מנהלים מוגדרים — הוסף אותם קודם","err");

  }
  /* מכל אינו נושא דמי ניהול משלו — הם מוגדרים בכל תת-שלב בנפרד */

    '<div class="section-title">ההגדרות שיוחלו</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>בסיס החישוב</label><select id="bm-base">'+
        Object.keys(BASE_TYPES).map(function(k){return '<option value="'+k+'"'+(k==="net18"?" selected":"")+'>'+BASE_TYPES[k]+'</option>';}).join("")+
      '</select></div>'+
      '<div class="field"><label>מע"מ על דמי הניהול</label><select id="bm-vat">'+
        [0,17,18].map(function(v){return '<option value="'+v+'"'+(v===18?" selected":"")+'>'+(v===0?"ללא":v+"%")+'</option>';}).join("")+
      '</select></div>'+
    '</div>'+
    mgrs.map(function(m){
      return '<div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px"><b>'+esc(m.name)+'</b>'+
        '<div class="form-grid" style="margin-top:8px">'+
        '<div class="field"><label>% נוכחי</label><input id="bm-cur-'+m.id+'" type="number" step="0.01" value="'+esc(String(m.defaultFeePercent))+'"></div>'+
        '<div class="field"><label>% דחוי</label><input id="bm-def-'+m.id+'" type="number" step="0.01" value="0"></div>'+

    }).join("")+
    '<div class="section-title">על אילו שלבים להחיל</div>'+
    '<div class="toolbar">'+
      '<button class="btn btn-sm" onclick="bulkMgmtSelectAll(true)">✔️ סמן הכל</button>'+
      '<button class="btn btn-sm" onclick="bulkMgmtSelectAll(false)">✕ נקה בחירה</button>'+

        return '<tr><td><input type="checkbox" class="bm-x" value="'+e.id+'" checked onchange="bulkMgmtCount()" style="width:auto"></td>'+

/* שורת הסינון של הטבלה מסתירה שורות ויזואלית בלבד (display:none) —
   התיבות שלהן נשארות מסומנות. פעולה מרוכזת חייבת לחול רק על מה
   שנראה על המסך, אחרת סינון ל-3 שלבים היה משנה את כל 47. */
function bmVisibleBoxes(sel){ return visibleBoxes(sel||".bm-x"); }
/* שורת הסינון מסתירה שורות ויזואלית בלבד — פעולה מרוכזת חלה רק על
   מה שנראה על המסך, אחרת סינון היה משנה גם את מה שלא רואים. */
function visibleBoxes(sel){
  return Array.prototype.filter.call(document.querySelectorAll(sel),function(c){
    var tr=c.closest("tr");
    return !tr || tr.style.display!=="none";
  });
}
function bulkMgmtSelectAll(v){
  bmVisibleBoxes().forEach(function(c){ c.checked=v; });
  bulkMgmtCount();
}
function bulkMgmtCount(){
  var n=bmVisibleBoxes(".bm-x:checked").length;
  var hidden=document.querySelectorAll(".bm-x:checked").length-n;
  var el=document.getElementById("bm-count");
  if(el) el.textContent="נבחרו "+n+(hidden?" (מוסתרים בסינון: "+hidden+" — לא ישתנו)":"");
}
function bulkMgmtToggleMode(){
  var rm=checked("bm-remove");
  ["bm-base","bm-vat"].forEach(function(id){ var el=document.getElementById(id); if(el) el.disabled=rm; });
  document.querySelectorAll('[id^="bm-cur-"],[id^="bm-def-"],[id^="bm-lbl-"]').forEach(function(el){ el.disabled=rm; });
}
function applyBulkMgmt(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var ids=bmVisibleBoxes(".bm-x:checked").map(function(c){return c.value;})
    .filter(function(id){ return !isContainer(id); });      // מכל אינו נושא דמי ניהול
  if(!ids.length){ toast("לא נבחר אף שלב","err"); return false; }
  var remove=checked("bm-remove");
  var mgrs=apManagers(aptId);
  if(remove){
    /* שלב שכבר שולם עליו למנהלים לא ניתן לכיבוי — אחרת התשלומים נספרים
       בלי צד עלות והמאזן נשבר. מדלגים עליו ומדווחים. */
    var blocked=[], okIds=[];
    ids.forEach(function(eid){
      var mPaid=expPayments(eid).filter(function(p){return p.recipientType==="manager"&&!p.auto;})
        .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
      if(mPaid>0.01) blocked.push(eid); else okIds.push(eid);
    });
    if(!okIds.length){
      toast("בכל השלבים שנבחרו כבר שולמו דמי ניהול — אי אפשר לבטל. מחק קודם את התשלומים למנהלים","err");
      return false;
    }
    if(!confirm("יוסרו דמי ניהול מ-"+okIds.length+" שלבים"+
      (blocked.length? "\n("+blocked.length+" שלבים ידולגו כי כבר שולם בהם למנהלים)":"")+
      "\n\nהנתונים הקיימים יישמרו ויחזרו אם תחיל שוב.")) return false;
    okIds.forEach(function(eid){ var e=byId(DB.expenses,eid); if(e) e.mgmtEnabled=false; syncAutoMgmtPayments(eid); });
    save();
    toast("דמי הניהול הוסרו מ-"+okIds.length+" שלבים"+(blocked.length?" · "+blocked.length+" דולגו (שולם בהם)":""),blocked.length?"warn":"ok");
    rerender(); return;
  }
  var base=val("bm-base")||"full", vat=Number(val("bm-vat")); if(isNaN(vat)) vat=18;
  var cfg=mgrs.map(function(m){
    return {id:m.id, cur:Number(val("bm-cur-"+m.id))||0, def:Number(val("bm-def-"+m.id))||0, lbl:val("bm-lbl-"+m.id)||"" };
  });
  if(!cfg.some(function(c){ return c.cur>0 || c.def>0; })){
    toast("כל האחוזים אפס — הזן אחוז לפחות למנהל אחד","err"); return false;
  }
  ids.forEach(function(eid){
    var e=byId(DB.expenses,eid); if(!e) return;
    e.mgmtEnabled=true; e.mgmtBaseType=base; e.mgmtVatRate=vat;
    DB.expenseManagerFees=DB.expenseManagerFees.filter(function(f){return f.expenseId!==eid;});
    cfg.forEach(function(c){
      DB.expenseManagerFees.push({id:uid(),expenseId:eid,managerId:c.id,
        pctCurrent:c.cur,pctDeferred:c.def,deferredLabel:c.lbl,deferredReleased:false,deleted:false});
    });
    syncAutoMgmtPayments(eid);
  });
  save();
  toast("דמי ניהול הוחלו על "+ids.length+" שלבים","ok");
  rerender();
}

function splitRowHtml(pid,pct){
  return '<div class="split-row"><select class="sp-partner">'+partnerOptions(pid)+'</select>'+
    '<input class="sp-pct" type="number" step="0.01" value="'+(pct||0)+'" oninput="updateSplitSum()">'+
    '<button class="btn btn-ghost btn-sm" onclick="this.closest(\'.split-row\').remove();updateSplitSum()">✕</button></div>';
}
function updateSplitSum(){
  var rows=document.querySelectorAll("#split-rows .split-row");
  var el=document.getElementById("split-sum"); if(!el) return;
  if(!rows.length){ el.textContent="ללא חלוקה"; el.className="muted"; return; }
  var sum=0; document.querySelectorAll("#split-rows .sp-pct").forEach(function(i){sum+=Number(i.value)||0;});
  el.textContent=num(sum)+"%"; el.className=Math.abs(sum-100)<0.01?"pos":"neg";
}

/* תצוגה חיה של חישוב דמי הניהול, מתעדכנת בכל הקלדה */
function updateMgmtPreview(){
  var box=document.getElementById("mgmt-preview"); if(!box) return;
  var rowsEls=document.querySelectorAll("#mgmt-rows [data-mgr]");
  if(!rowsEls.length){ box.innerHTML=""; return; }
  var amt=Number(val("ex-amount"))||0;
  var baseType=val("ex-base")||"full", vat=Number(val("ex-vat"))||0;
  var b = baseType==="net17" ? amt/1.17 : baseType==="net18" ? amt/1.18 : amt;
  var vf = 1+vat/100;
  var out=[], totLive=0, totFull=0;
  Array.prototype.forEach.call(rowsEls,function(el){
    var mid=el.getAttribute("data-mgr"), nm=el.getAttribute("data-name")||"";
    var cur=Number(val("mf-cur-"+mid))||0, def=Number(val("mf-def-"+mid))||0, rel=checked("mf-rel-"+mid);
    var curAmt=b*cur/100*vf, defAmt=b*def/100*vf;
    var live=curAmt+(rel?defAmt:0), full=curAmt+defAmt;
    totLive+=live; totFull+=full;
    out.push('<tr><td>'+esc(nm)+'</td><td>'+money(curAmt)+'</td><td>'+money(defAmt)+(rel?' <span class="badge badge-ok">שוחרר</span>':'')+
      '</td><td><b>'+money(live)+'</b></td><td>'+money(full)+'</td></tr>');
  });
  box.innerHTML='<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>מנהל</th><th>נוכחי</th><th>דחוי</th><th>לתשלום עכשיו</th><th>סה"כ בסוף</th></tr></thead><tbody>'+
    out.join("")+'</tbody><tfoot><tr><td>בסיס: '+money(b)+(vat?' · מע"מ '+vat+'%':' · ללא מע"מ')+
    '</td><td colspan="2"></td><td><b>'+money(totLive)+'</b></td><td>'+money(totFull)+'</td></tr></tfoot></table></div>'+
    '<div class="hint">כל הסכומים כוללים מע"מ. "לתשלום עכשיו" = הנוכחי + הדחוי אם שוחרר — וזה גם התקרה לתשלום למנהל.</div>';
}

function saveExpense(eId,aptId){
  var a=byId(DB.apartments,aptId);
  var desc=val("ex-desc").trim(); var amount=Number(val("ex-amount"))||0;
  if(!desc){ toast("יש להזין תיאור","err"); return false; }
  /* שלב-אב (מכל): הסכום שלו נגזר מסך תתי-השלבים ואינו נערך ידנית */
  var isCont = !!(eId && isContainer(eId));
  if(isCont) amount=round2(expenseChildren(eId).reduce(function(s,k){return s+(Number(k.amount)||0);},0));
  else if(amount<=0){ toast("יש להזין סכום","err"); return false; }
  // חלוקה — איחוד שורות כפולות לאותו שותף + ולידציה
  var byP={}, order=[]; document.querySelectorAll("#split-rows .split-row").forEach(function(r){
    var pid=r.querySelector(".sp-partner").value; var pct=Number(r.querySelector(".sp-pct").value)||0;
    if(pid){ if(byP[pid]==null){byP[pid]=0;order.push(pid);} byP[pid]+=pct; }
  });
  var rows=order.map(function(pid){ return {partnerId:pid,percent:byP[pid]}; });
  /* חלוקה נדרשת רק בדירה שהוגדרו לה שותפים. דירה אישית
     (קרן השתלמות, קופת חיסכון...) נשמרת בלי חלוקה כלל. */
  if(isCont){
    /* מכל: אין לו חלוקה משלו — היא יושבת בתתי-השלבים */
  } else if(!rows.length){
    if(apPartners(aptId).length){ toast("יש להוסיף לפחות שורת חלוקה אחת","err"); return false; }
  } else {
    var pctSum=rows.reduce(function(s,r){return s+r.percent;},0);
    if(Math.abs(pctSum-100)>0.01){ toast("סכום חלוקת השותפים חייב להיות 100% (כרגע "+num(pctSum)+"%)","err"); return false; }
  }
  if(eId){ var paidSoFar=expensePaid(eId);
    if(amount<paidSoFar-0.01){
      if(!confirm("סכום השלב החדש ("+money(amount)+") נמוך ממה שכבר שולם ("+money(paidSoFar)+").\n\nהשלב יסומן \"שולם ביתר\". להמשיך?")) return false;
    } }

  /* ---- שיוך לשלב-אב ----
     כל הוולידציות והאישורים רצים כאן, *לפני* שנוגעים ב-DB. אחרת ביטול
     ה-confirm של "יהפוך לשלב-אב" היה משאיר הוצאה חצי-שמורה בלי חלוקה,
     שנספרת בעלות אבל לא מחויבת לאף שותף. */
  var hasParentField = !!document.getElementById("ex-parent");
  var oldParent = eId ? (byId(DB.expenses,eId).parentId||null) : null;
  var pv = null;
  if(hasParentField){
    pv = val("ex-parent")||"";
    if(pv==="__new") pv="";
    if(eId && pv===eId) pv="";
    var pe = pv?byId(DB.expenses,pv):null;
    if(pv && !pe){ toast("שלב-האב שנבחר אינו קיים","err"); return false; }
    if(pe && pe.apartmentId!==aptId){ toast("שלב-האב שייך לדירה אחרת","err"); return false; }
    if(pe && pe.parentId){ toast("אפשר תת-שלב רק תחת שלב עצמאי","err"); return false; }
    if(pv && eId && expenseChildren(eId).length){ toast("לשלב הזה יש תתי-שלבים — לא ניתן לשייך אותו לאב","err"); return false; }
    /* אב שיש עליו כסף משלו הופך למכל — הכסף שלו עובר לתת-שלב ראשון.
       זו הפעולה הראשונה שמשנה נתונים, ומכאן והלאה אין עוד ביטולים. */
    if(pv && pv!==oldParent && !convertToContainer(pv)) return false;
  }

  var e;
  if(eId){ e=byId(DB.expenses,eId); }
  else{ e={id:uid(),apartmentId:aptId,deleted:false}; DB.expenses.push(e); eId=e.id; }
  e.description=desc; e.amount=amount; e.date=val("ex-date")||todayISO();
  if(document.getElementById("ex-cat")){ var cv=val("ex-cat"); e.categoryId=(cv==="__new"?(e.categoryId||""):cv); }
  else e.categoryId=e.categoryId||"";
  e.classification=val("ex-class"); e.note=val("ex-note");
  if(hasParentField) e.parentId = pv || null;
  e.hasInvoice=checked("ex-inv"); e.invoiceLink=val("ex-link");
  if(CU&&CU.role==="admin"&&document.getElementById("ex-hidden")) e.hidden=checked("ex-hidden");
  else if(e.hidden==null) e.hidden=false;
  /* דמי ניהול — נוגעים בהם אך ורק כשהמקטע באמת הוצג על המסך.
     קודם: כל שמירה מחקה את דמי הניהול ובנתה מחדש רק אם התיבה סומנה,
     כך ששמירה ממצב שבו המקטע לא הוצג מחקה את הנתונים בשקט. */
  var mgmtShown = !!document.getElementById("ex-mgmt");
  if(mgmtShown){
    if(e.mgmtEnabled && !checked("ex-mgmt")){
      /* מבטלים דמי ניהול על הוצאה שכבר שולם עליה למנהלים? צד העלות היה
         מתאפס בעוד התשלומים ממשיכים להיספר — והמאזן נשבר. חוסמים. */
      /* תשלומים אוטומטיים ("שווה ערך") לא חוסמים — הם יוסרו בסנכרון */
      var mPaid=round2(expPayments(eId).filter(function(p){return p.recipientType==="manager"&&!p.auto;})
        .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
      if(mPaid>0.01){
        toast("אי אפשר לבטל דמי ניהול — כבר שולמו "+money(mPaid)+" למנהלים על שלב זה. מחק קודם את התשלומים אליהם","err");
        return false;
      }
    }
    e.mgmtEnabled = checked("ex-mgmt");
    e.mgmtBaseType = val("ex-base") || e.mgmtBaseType || "full";
    var vatRaw = val("ex-vat");
    if(vatRaw!==""){ var vn=Number(vatRaw); e.mgmtVatRate = isNaN(vn)?18:vn; }
    else if(e.mgmtVatRate==null){ e.mgmtVatRate = 18; }
  } else {
    if(e.mgmtEnabled==null) e.mgmtEnabled=false;
    if(e.mgmtBaseType==null) e.mgmtBaseType="full";
    if(e.mgmtVatRate==null) e.mgmtVatRate=18;
  }
  // rebuild splits — למכל אין חלוקה משלו, לא נוגעים בה
  if(!isCont){
    DB.expenseSplits=DB.expenseSplits.filter(function(s){return s.expenseId!==eId;});
    rows.forEach(function(r){ DB.expenseSplits.push({id:uid(),expenseId:eId,partnerId:r.partnerId,percent:r.percent,deleted:false}); });
  }
  // rebuild manager fees
  /* בונים מחדש רק כשיש ערכים חדשים על המסך. אם המקטע לא הוצג, או שדמי
     הניהול כבויים — משאירים את הרשומות הקיימות במקום למחוק אותן.
     הן ממילא אינן נספרות כל עוד mgmtEnabled כבוי, ואם יידלק שוב — הנתונים חוזרים. */
  if(mgmtShown && e.mgmtEnabled){
    DB.expenseManagerFees=DB.expenseManagerFees.filter(function(f){return f.expenseId!==eId;});
    apManagers(aptId).forEach(function(m){
      DB.expenseManagerFees.push({id:uid(),expenseId:eId,managerId:m.id,
        pctCurrent:Number(val("mf-cur-"+m.id))||0,pctDeferred:Number(val("mf-def-"+m.id))||0,
        deferredLabel:val("mf-lbl-"+m.id)||"",deferredReleased:checked("mf-rel-"+m.id),deleted:false});
    });
  }
  syncAutoMgmtPayments(eId);   // תשלום "שווה ערך" אוטומטי לפי הגדרת הפרויקט
  /* סכום המכל נגזר מתתי-השלבים — מסנכרנים את האב הישן ואת החדש */
  if(oldParent && oldParent!==e.parentId) syncParentAmount(oldParent);
  if(e.parentId) syncParentAmount(e.parentId);
  save(); toast("ההוצאה נשמרה","ok"); rerender();
}

/* ---------- לשונית תשלומים: כל תשלומי הדירה במקום אחד ---------- */
function apAllPayments(aptId){
  var expIds={}; apExpenses(aptId).forEach(function(e){ expIds[e.id]=1; });
  return active(DB.payments).filter(function(p){ return expIds[p.expenseId]; });
}
function modulePayments(aptId){
  var all=apAllPayments(aptId);
  var h='<div class="toolbar"><h3 style="margin:0">כל התשלומים</h3><div class="sp"></div></div>';
  if(!all.length) return h+'<div class="empty">אין תשלומים עדיין. רושמים תשלום דרך 💳 בשורת ההוצאה, או ב"תשלום מהיר".</div>';
  var payers={}; all.forEach(function(p){ if(p.payerPartnerId) payers[p.payerPartnerId]=1; });
  h+='<div class="toolbar">'+

/* ---------- עדכון מרוכז של תשלומים ----------
   מסמנים כמה תשלומים ומעדכנים יחד מאיפה שולמו, מי שילם, האמצעי או
   התאריך. שדה שנשאר על "ללא שינוי" לא נוגע בשום תשלום. */
function pbAll(v){
  visibleBoxes(".pb-x").forEach(function(c){ c.checked=v; });
  pbCount();
}
function pbCount(){
  var n=visibleBoxes(".pb-x:checked").length;
  var hidden=document.querySelectorAll(".pb-x:checked").length-n;
  var el=document.getElementById("pb-count");
  if(el) el.textContent=n?("("+n+(hidden?" · "+hidden+" מוסתרים לא ישתנו":"")+")"):"";
}
function openBulkPayEdit(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var ids=visibleBoxes(".pb-x:checked").map(function(c){ return c.value; });
  if(!ids.length){ toast("סמן קודם את התשלומים לעדכון (העמודה הראשונה בטבלה)","warn"); return; }
  var pays=ids.map(function(id){ return byId(DB.payments,id); }).filter(Boolean);
  var autoN=pays.filter(function(p){ return p.auto; }).length;
  var partners=apPartners(aptId);
  var sum=round2(pays.reduce(function(s,p){ return s+(Number(p.amount)||0); },0));

  openModal({title:"✏️ עדכון מרוכז — "+pays.length+" תשלומים",wide:true,bodyHtml:
    '<div class="stat-grid" style="margin-bottom:12px">'+
      stat("תשלומים שנבחרו",pays.length)+stat("סכום כולל",money(sum))+
    '</div>'+
    (autoN?'<div class="hint neg" style="margin-bottom:8px">'+autoN+' מהם תשלומי "שווה ערך" אוטומטיים — הם יידלגו, '+
      'כי הסכום והמשלם שלהם נגזרים מהגדרת דמי הניהול של הפרויקט.</div>':'')+
    '<div class="hint" style="margin-bottom:10px">שדה שנשאר על <b>"— ללא שינוי —"</b> לא ישתנה באף תשלום.</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>מהחשבון</label><select id="pb-account" onchange="onPbAccount()">'+
        '<option value="">— ללא שינוי —</option>'+
        '<option value="__none">ידני / ללא חשבון</option>'+
        availAccounts(aptId).map(function(ac){
          return '<option value="'+ac.id+'">'+esc(ac.name)+(ac.isBank?" 🏦 (בנק זמני)":"")+'</option>'; }).join("")+
      '</select></div>'+
      (partners.length
        ? '<div class="field"><label>מי שילם (שותף)</label><select id="pb-payer">'+
            '<option value="">— ללא שינוי —</option>'+
            '<option value="__none">ללא משלם</option>'+
            partners.map(function(ap){
              return '<option value="'+ap.partnerId+'">'+esc(partnerName(ap.partnerId))+'</option>'; }).join("")+
          '</select><div class="hint" id="pb-payer-hint"></div></div>'
        : '')+
      '<div class="field"><label>אמצעי תשלום</label><select id="pb-method" onchange="onMethodPick(\'pb-method\')">'+
        '<option value="">— ללא שינוי —</option>'+methodOptions("")+'</select></div>'+
      '<div class="field"><label>תאריך</label><input id="pb-date" type="date"><div class="hint">ריק = ללא שינוי</div></div>'+
      '<div class="field"><label>חשבונית</label><select id="pb-inv">'+invoiceStatusOptions("__keep",true)+'</select></div>'+
    '</div>',
    saveLabel:"עדכן "+pays.length+" תשלומים",onSave:function(){ return applyBulkPayEdit(aptId,ids); }});
  onPbAccount();
}
function onPbAccount(){
  var payer=document.getElementById("pb-payer"); if(!payer) return;
  var v=val("pb-account");
  var hint=document.getElementById("pb-payer-hint");
  if(v && v!=="__none" && accountIsBank(v)){
    payer.value="__none"; payer.disabled=true;
    if(hint) hint.textContent='תשלום מהבנק הזמני אינו משויך לשותף בודד.';
  } else {
    payer.disabled=false;
    if(hint) hint.textContent="";
  }
}
function applyBulkPayEdit(aptId,ids){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var acc=val("pb-account"), payer=document.getElementById("pb-payer")?val("pb-payer"):"";
  var method=val("pb-method"), date=val("pb-date");
  var invSt=val("pb-inv")||"__keep";
  if(!acc && !payer && !method && !date && invSt==="__keep"){ toast("לא נבחר מה לעדכן","warn"); return false; }

  var accId = acc==="__none" ? null : (acc||undefined);
  var isBankTarget = accId ? accountIsBank(accId) : false;

  var n=0, skippedAuto=0, overpaid=[];
  ids.forEach(function(id){
    var p=byId(DB.payments,id); if(!p||p.deleted) return;
    /* תשלום "שווה ערך" אוטומטי נגזר מהגדרת הפרויקט — שינוי ידני שלו
       היה נמחק בסנכרון הבא ומבלבל יותר משעוזר. */
    if(p.auto){ skippedAuto++; return; }
    if(accId!==undefined){ p.accountId=accId; }
    if(payer){ p.payerPartnerId = (payer==="__none")?null:payer; }
    if(accId!==undefined && isBankTarget) p.payerPartnerId=null;   // מהבנק — לא משויך לשותף
    if(method) p.method=method;
    if(date) p.date=date;
    if(invSt!=="__keep"){ p.invoiceStatus=invSt; p.hasInvoice=(invSt==="has"); }
    n++;
  });
  if(!n){ toast(skippedAuto?"כל התשלומים שנבחרו הם אוטומטיים — לא שונה דבר":"לא עודכן דבר","warn"); return false; }
  save();
  toast("עודכנו "+n+" תשלומים"+(skippedAuto?" ("+skippedAuto+" אוטומטיים דולגו)":""),"ok");
  rerender();
  return true;
}

function renderPayTable(aptId){ return withIndex(function(){ return renderPayTableInner(aptId); }); }
function renderPayTableInner(aptId){
  aptId=aptId||state.params.apartmentId;

function payTableHtml(aptId){
  var all=apAllPayments(aptId);
  var list=all.filter(function(p){
    var e=byId(DB.expenses,p.expenseId), acc=byId(DB.accounts,p.accountId);
    var txt=(e?e.description:"")+" "+(p.note||"")+" "+(acc?acc.name:"")+" "+
            (p.payerPartnerId?partnerName(p.payerPartnerId):"")+" "+
            (p.recipientType==="manager"?managerName(p.recipientManagerId):"");
    if(!matches(Q.pay,txt)) return false;
    if(Q.payWho && p.payerPartnerId!==Q.payWho) return false;
    if(Q.paySrc==="bank" && !accountIsBank(p.accountId)) return false;
    if(Q.paySrc==="direct" && (accountIsBank(p.accountId)||p.recipientType==="manager")) return false;
    if(Q.paySrc==="manager" && p.recipientType!=="manager") return false;
    if(Q.payInv){
      var ist=payInvoiceStatus(p);

    }

  });
  var cnt=document.getElementById("pay-count");

  if(!list.length) return '<div class="empty">לא נמצא תשלום שמתאים לסינון</div>';
  var tot=0;
  var sel=can("edit");
  var h='<div class="table-wrap"><table class="tbl"><thead><tr>'+
    (sel?'<th data-xl-skip="1" style="width:30px"><input type="checkbox" title="סמן הכל" style="width:auto" onclick="pbAll(this.checked)"></th>':'')+

    '<th>מוטב</th><th>אמצעי</th><th>חשבונית</th><th>הערה</th><th></th></tr></thead><tbody>';
  list.sort(function(x,y){ return x.date<y.date?1:-1; }).forEach(function(p){
    var e=byId(DB.expenses,p.expenseId), acc=byId(DB.accounts,p.accountId);
    tot+=Number(p.amount)||0;
    var isMgr=p.recipientType==="manager";
    var recip=isMgr
      ? '<span class="badge badge-mgmt">🧾 דמי ניהול</span> '+esc(managerName(p.recipientManagerId)) : 'ספק';
    h+='<tr'+(isMgr?' class="mgmt-row"':'')+'>'+
      (sel?'<td><input type="checkbox" class="pb-x" value="'+p.id+'" style="width:auto" onchange="pbCount()"></td>':'')+
      '<td>'+dateHe(p.date)+'</td>'+
      '<td><b>'+esc(e?e.description:"—")+'</b>'+(p.hidden?' <span class="badge badge-danger" title="תשלום מוסתר">🔒</span>':'')+'</td>'+
      '<td>'+money(p.amount)+'</td>'+
      '<td>'+esc(acc?acc.name:"ידני")+(acc&&acc.isBank?" 🏦":"")+'</td>'+
      '<td>'+(p.payerPartnerId?esc(partnerName(p.payerPartnerId)):(accountIsBank(p.accountId)?'<span class="muted">מהבנק</span>':"—"))+'</td>'+
      '<td>'+recip+'</td><td>'+(METHODS[p.method]||"")+(p.auto?' <span class="badge badge-muted">אוטו׳</span>':'')+'</td>'+
      '<td>'+invoiceCellHtml(p)+'</td>'+
      '<td class="muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis">'+esc(p.note||"")+'</td>'+
      '<td class="right" style="white-space:nowrap">'+
        '<button class="btn btn-ghost btn-sm" onclick="openPayments(\''+p.expenseId+'\')" title="כל תשלומי השלב">💳</button>'+
        (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openPaymentEditor(\''+p.expenseId+'\',\''+p.id+'\')">✏️</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="delPayment(\''+p.id+'\',\''+p.expenseId+'\')">🗑️</button>':'')+'</td></tr>';
  });
  var lbl=(list.length===all.length)?'סה"כ':'סה"כ המסונן';
  h+='</tbody><tfoot><tr><td colspan="'+(sel?3:2)+'">'+lbl+' ('+list.length+' תשלומים)</td><td>'+money(tot)+'</td>'+
    '<td colspan="7"></td></tr></tfoot></table></div>';
  return h;
}
