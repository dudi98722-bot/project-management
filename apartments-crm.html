   ------------------------------------------------------------
   סימוני הבחירה בטבלאות (העמודה הראשונה) הם מצב זמני של ה-DOM.
   כל רינדור מחדש — למשל "עודכן — נכנסו שינויים ממשתמש אחר" מהפולינג,
   או מיזוג אחרי שמירה — בנה את הטבלה מאפס ומחק אותם, והמשתמש נאלץ
   לסמן הכל שוב. כאן: לוכדים את המסומנים לפני, מחזירים אחרי, ומעדכנים
   את המונה שליד כפתור העדכון המרוכז. גם מיקום הגלילה נשמר —
   הקפיצה לראש הדף באמצע עבודה הייתה חלק מאותה תלונה.
   (ניווט אמיתי בין מסכים עובר דרך go(), שמגלגל לראש הדף לפני
   הרינדור — ולכן השחזור כאן משמר גם את זה נכון.) */
var SEL_KEEP=[["bm-x","bmCount"],["eb-x","ebCount"],["ib-x","ibCount"],["pb-x","pbCount"],["gb-x","gbCount"]];
function captureSelections(){
  var kept={};
  SEL_KEEP.forEach(function(pair){
    var v={}, n=0;
    document.querySelectorAll("input."+pair[0]+":checked").forEach(function(x){ v[x.value]=1; n++; });
    if(n) kept[pair[0]]=v;
  });
  /* המילוי המדורג של התאמת בנק מוסיף שורות אחרי שהשחזור הרגיל כבר רץ —
     ולכן צריך עותק שהוא יכול לקרוא בעצמו */
  window._BM_KEPT=kept["bm-x"]||null;
  return kept;
}
function restoreSelections(kept){
  SEL_KEEP.forEach(function(pair){
    var v=kept[pair[0]]; if(!v) return;
    var n=0;
    document.querySelectorAll("input."+pair[0]).forEach(function(x){
      if(v[x.value]){ x.checked=true; n++; }
    });
    if(n && typeof window[pair[1]]==="function"){ try{ window[pair[1]](); }catch(e){} }
  });
}
function anySelectionMarked(){
  return !!document.querySelector(SEL_KEEP.map(function(p){ return "input."+p[0]+":checked"; }).join(","));
}

  var kept=captureSelections();

     הסימונים בה לא עושים כלום. סוגרים; הסינון שכבר הוחל שמור

async function doLogin(){
  var hasUserField=!!document.getElementById("lg-user");
  var name=hasUserField?val("lg-user").trim():"";
  var code=val("lg-code");
  if(hasUserField && !name){ toast("יש להזין שם משתמש","err"); return; }
  if(!code){ toast("יש להזין קוד","err"); return; }
  var h=await hashCode(code);
  /* ---------- שתי הפניות יוצאות יחד ----------
     כל פנייה ל-Apps Script עולה 2-5 שניות, וקודם הן יצאו בזו אחר זו:
     קודם אימות ורק אחריו טעינת הנתונים — כלומר המתנה כפולה בכל כניסה.
     שתיהן צריכות בדיוק את אותו קוד, והשרת דוחה טעינה עם קוד שגוי,
     ולכן אפשר להוציא אותן במקביל ולחסוך פנייה שלמה. */
  var pLoad=api({action:"load",codeHash:h});
  var j=await api({action:"login",codeHash:h});
  if(!j||!j.ok){
    var er=j&&j.error;
    toast(er==="network" ? "אין חיבור לשרת"
      : er==="too-many" ? ("יותר מדי ניסיונות כניסה — נסה שוב בעוד "+Math.ceil((j.retryAfter||120)/60)+" דקות")
      : "שם המשתמש או קוד הכניסה שגויים","err");
    return;
  }
  /* הקוד הוא המפתח בשרת; השם חייב להתאים למשתמש שהקוד שייך לו.
     ההתאמה סלחנית לרווחים (normKey) אבל לא לשם אחר. */
  if(name && j.user && normKey(String(j.user.name))!==normKey(name)){
    toast("שם המשתמש אינו תואם לקוד","err"); return;
  }
  setAuth(h); CU=j.user;
  /* פתיחת הכספת המקומית ומשיכת מה ששרד ממנה מהסשן הקודם (למשל עבודה
     שלא הספיקה להישמר) — לפני הסנכרון, כדי שהמיזוג יראה אותה. */
  await vaultUnlock(h);
  await loadDB(); await loadSyncBase(); await loadStash();
  if(!DB) DB=blankDB();
  try{ LAST_JSON=JSON.stringify(DB); }catch(e){}
  resetIdle();
  var rec=await reconcileAfterAuth(await pLoad);
  if(rec===null){
    setAuth(""); CU=null;
    toast("לא הצלחתי לטעון את הנתונים מהשרת — נסה שוב בעוד רגע","err");
    return;
  }
  if(rec===false){ toast("האימות נכשל — נסה שוב","err"); return; }
  toast("ברוך הבא, "+CU.name,"ok"); go("dashboard",{});
}
function logout(){
  if(SAVEQ.timer){ clearTimeout(SAVEQ.timer); SAVEQ.timer=null; }
  if(hasUnsaved()){
    /* שולחים ניסיון אחרון עם ההרשאה הנוכחית לפני שהיא נמחקת.
       אם ייכשל — הסימון המקומי נשאר והכניסה הבאה תדחף את המקומי. */
    var h=getAuth();
    if(h){
      try{
        fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
          body:JSON.stringify({action:"save",codeHash:h,data:DB})})
          .then(function(r){return r.json();})
          .then(function(res){ if(res&&res.ok) clearDirtyMark(); }).catch(function(){});
      }catch(e){}
    }
  }
  SAVEQ.dirty=false; SAVEQ.inflight=false; SAVEQ.fails=0;
  /* מנקים כל עותק מהדיסק ונועלים את הכספת — כך שמי שניגש למחשב אחרי
     יציאה לא רואה שום נתון, וגם לא שרד hash של קוד כניסה. */
  vaultWipe(); vaultLock();
  DB=blankDB(); UNDO.length=0; LAST_JSON=null; STASH=[];
  SYNCBASE=null; SYNCREV=0;
  setAuth(""); CU=null; renderApp();
}
/* ---------- נעילה אוטומטית אחרי חוסר פעילות ----------
   דפדפן שנשאר פתוח על מסך עם נתונים פיננסיים הוא החשיפה הפשוטה
   ביותר. אחרי IDLE_MIN דקות בלי נגיעה — יציאה מלאה (כולל ניקוי
   המטמון). עבודה שלא נשמרה נדחפת לשרת קודם, כמו ביציאה רגילה. */
var IDLE_MIN=30, IDLE_TIMER=null;
function resetIdle(){
  if(IDLE_TIMER) clearTimeout(IDLE_TIMER);
  if(!getAuth()) return;
  IDLE_TIMER=setTimeout(function(){
    if(!getAuth()) return;
    toast("יצאת אוטומטית אחרי "+IDLE_MIN+" דקות ללא פעילות","warn");
    logout();
  }, IDLE_MIN*60000);
}
["mousedown","keydown","touchstart","scroll"].forEach(function(ev){
  window.addEventListener(ev,resetIdle,{passive:true});
});
/* ---------- שחזור קוד כניסה במייל (דרך Apps Script) ---------- */
async function forgotCode(){
  /* הקוד נשלח למייל של המשתמש הספציפי — לכן חייבים לדעת מי מבקש */
  var name=(document.getElementById("lg-user")?val("lg-user").trim():"");
  if(!name){
    toast("הזן קודם את שם המשתמש למעלה — קוד השחזור יישלח למייל שמשויך לו","err");
    var el=document.getElementById("lg-user"); if(el) el.focus();
    return;
  }
  toast("שולח קוד שחזור למייל…","ok");
  var j=await api("action=requestReset&user="+encodeURIComponent(name));
  if(!j||!j.ok){
    var m={"user-not-found":"לא נמצא משתמש פעיל בשם הזה",
           "no-email":"למשתמש הזה לא משויך מייל — בקש מהמנהל לקבוע לך קוד חדש (הגדרות ← משתמשים)"};
    toast(m[j&&j.error]||("שליחת הקוד נכשלה"+((j&&j.error)?": "+j.error:"")),"err");
    return;
  }
  openResetCodeModal(j.sentTo||"");
}
function openResetCodeModal(sentTo){
  openModal({title:"שחזור קוד כניסה",bodyHtml:
    '<p class="muted">נשלח קוד בן 6 ספרות למייל'+(sentTo?" "+esc(sentTo):"")+'. הקוד תקף ל-15 דקות ולשימוש חד-פעמי.</p>'+
    '<div class="field"><label>הקוד מהמייל</label><input id="rs-code" inputmode="numeric" placeholder="6 ספרות"></div>'+

async function doResetCode(){
  var code=val("rs-code").trim(), nw=val("rs-new");
  if(!code||!nw){ toast("יש למלא את שני השדות","err"); return; }
  var v=await api("action=verifyReset&code="+encodeURIComponent(code));
  if(!v||!v.ok){
    var m={"bad-code":"קוד שגוי","expired":"הקוד פג תוקף — בקש קוד חדש","no-request":"לא נמצאה בקשת שחזור"};
    toast(m[v&&v.error]||"האימות נכשל","err"); return;
  }
  var h=await hashCode(nw);
  var s=await api({action:"setCode",resetToken:v.resetToken,codeHash:h});
  if(!s||!s.ok){
    toast(s&&s.error==="code-taken"
      ?"הקוד החדש כבר שייך למשתמש אחר — בחר קוד אחר"
      :"קביעת הקוד נכשלה"+((s&&s.error)?": "+s.error:""),"err");
    return;
  }
  closeModal(); setAuth(h);
  var j=await api({action:"login",codeHash:h});
  if(j&&j.ok){
    CU=j.user;
    await reconcileAfterAuth();
    toast("הקוד עודכן — ברוך הבא","ok"); go("dashboard",{});
  }else{
    setAuth(""); toast("הקוד עודכן — היכנס עם הקוד החדש","ok"); renderApp();
  }
}

    '<td>'+money(tot.income)+'</td><td>'+money(tot.bank)+'</td><td colspan="4"></td></tr></tfoot></table></div>';

}
/* מתג מהיר מתוך הרשימה — בלי להיכנס לעריכת הפרוייקט */
function toggleAptFlag(aptId,flag,val){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var a=byId(DB.apartments,aptId); if(!a) return;
  if(!val && flag==="hasBank"){
    var deps=apDeposits(aptId).length;
    var expIds={}; apLeafExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
    var bankPays=active(DB.payments).filter(function(p){return expIds[p.expenseId]&&accountIsBank(p.accountId);}).length;
    if(deps||bankPays){
      if(!confirm('בפרוייקט "'+a.name+'" יש '+deps+' הפקדות ו-'+bankPays+' תשלומים מהבנק.\n\n'+
        'כיבוי הבנק רק מסתיר את הלשונית — הנתונים נשמרים ויחזרו אם תדליק שוב.\n\nלכבות?')) { rerender(); return; }
    }
  }
  a[flag]=!!val;
  if(flag==="hasBank" && val) ensureBankAccount(a);
  save();
  toast('"'+a.name+'" — '+(flag==="hasBank"?"בנק":"דמי ניהול")+(val?" הופעל":" כובה"),"ok");
  renderAptGrid();
}
/* פעולה מרוכזת על כל הפרוייקטים המוצגים (מכבד את החיפוש) */
function bulkAptFlags(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var shown=active(DB.apartments).filter(function(a){return canSeeApartment(a.id);})
    .filter(function(a){ return matches(Q.apts,a.name+" "+(a.notes||"")); });
  if(!shown.length){ toast("אין פרוייקטים מוצגים","warn"); return; }
  var withBank=shown.filter(function(a){return a.hasBank;}).length;
  var withMgmt=shown.filter(function(a){return a.hasManagement;}).length;
  openModal({title:"הפעלה/כיבוי מרוכז",bodyHtml:
    '<p class="muted">הפעולה תחול על <b>'+shown.length+' הפרוייקטים המוצגים</b> כרגע'+
    (Q.apts?' (לפי החיפוש "'+esc(Q.apts)+'")':'')+'.</p>'+
    '<div class="stat-grid" style="margin-bottom:14px">'+
      stat("עם בנק",withBank+" / "+shown.length)+
      stat("עם דמי ניהול",withMgmt+" / "+shown.length)+
    '</div>'+
    '<div class="section-title">בנק זמני</div>'+
    '<div class="toolbar">'+
      '<button class="btn btn-sm" onclick="applyBulkFlag(\'hasBank\',true)">✅ הפעל בכולן</button>'+
      '<button class="btn btn-danger btn-sm" onclick="applyBulkFlag(\'hasBank\',false)">🚫 כבה בכולן</button></div>'+
    '<div class="section-title">דמי ניהול</div>'+
    '<div class="toolbar">'+
      '<button class="btn btn-sm" onclick="applyBulkFlag(\'hasManagement\',true)">✅ הפעל בכולן</button>'+
      '<button class="btn btn-danger btn-sm" onclick="applyBulkFlag(\'hasManagement\',false)">🚫 כבה בכולן</button></div>'+
    '<div class="hint">כיבוי רק מסתיר את הלשונית ומוציא מהחישוב — שום נתון לא נמחק, והכל חוזר בהדלקה מחדש.</div>'});
}
function applyBulkFlag(flag,val){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var shown=active(DB.apartments).filter(function(a){return canSeeApartment(a.id);})
    .filter(function(a){ return matches(Q.apts,a.name+" "+(a.notes||"")); });
  var changed=shown.filter(function(a){ return !!a[flag]!==!!val; });
  if(!changed.length){ toast("כל הפרוייקטים המוצגים כבר במצב הזה","warn"); return; }
  var what=(flag==="hasBank"?"בנק":"דמי ניהול");
  if(!confirm((val?"להפעיל ":"לכבות ")+what+" ב-"+changed.length+" פרוייקטים?\n\nשום נתון לא נמחק — אפשר להחזיר בכל רגע (וגם Ctrl+Z).")) return;
  changed.forEach(function(a){ a[flag]=!!val; if(flag==="hasBank"&&val) ensureBankAccount(a); });
  save(); closeModal();
  toast(what+(val?" הופעל":" כובה")+" ב-"+changed.length+" פרוייקטים","ok");
  rerender();
}

function editApartment(id){
  var a=id?byId(DB.apartments,id):{name:"",notes:"",hasManagement:false,hasBank:false};
  openModal({title:id?"עריכת פרוייקט":"פרוייקט חדש",bodyHtml:
    '<div class="field"><label>שם / כתובת</label><input id="ap-name" value="'+esc(a.name)+'"></div>'+
    '<div class="field"><label>הערות</label><textarea id="ap-notes" rows="2">'+esc(a.notes||"")+'</textarea></div>'+
    '<div class="field"><label><input type="checkbox" id="ap-mgmt" '+(a.hasManagement?"checked":"")+' style="width:auto"> יש דמי ניהול בפרוייקט זה</label></div>'+
    '<div class="field"><label><input type="checkbox" id="ap-bank" '+(a.hasBank?"checked":"")+' style="width:auto"> יש בנק זמני (קופה משותפת)</label></div>',

function renderApartment(c){
  var a=currentApartment(); if(!a){ c.innerHTML='<div class="empty">פרוייקט לא נמצא</div>'; return; }
  if(!canSeeApartment(a.id)){ c.innerHTML='<div class="empty">אין לך הרשאה לצפות בפרויקט הזה</div>'; return; }
  var tab=state.params.tab||"overview";
  /* לשונית "שותפים" היא הגדרות בלבד — אחוזי ברירת מחדל וחלוקות
     שמורות. מי שקיבל קישור לצפייה לא אמור לראות אותה. */
  var tabs=[["overview","סקירה"],["expenses","הוצאות / שלבים"],["payments","תשלומים"]];
  if(can("edit")) tabs.push(["partners","שותפים"]);
  tabs.push(["managers","דמי ניהול"]);   // תמיד נגיש — בפנים אפשר להפעיל
  if(a.hasBank) tabs.push(["bank","בנק זמני"]);
  tabs.push(["income","הכנסות"]);
  /* השכרות לטווח ארוך מנוהלות כאן, בתוך הפרוייקט — שם ממילא עובדים
     על הדירות. הלשונית הראשית נשארה לצפייה מרוכזת בכל הפרויקטים. */
  if(CU && CU.role==="admin") tabs.push(["rentals","שכירויות"]);
  tabs.push(["reports","דוחות"]);
  var h='<div class="toolbar"><h2 style="margin:0">🏢 '+esc(a.name)+'</h2>'+
    (can("edit")?'<button class="btn btn-sm" onclick="editApartment(\''+a.id+'\')">✏️ עריכת פרוייקט</button>':'')+
    '<div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-danger btn-sm" onclick="delApartment(\''+a.id+'\')">🗑️ מחק פרוייקט + תנועות</button>':'')+'</div>';
  h+='<div class="tabs">'+tabs.map(function(t){ return '<div class="tab'+(tab===t[0]?" active":"")+'" onclick="go(\'apartment\',{apartmentId:\''+a.id+'\',tab:\''+t[0]+'\'})">'+t[1]+'</div>'; }).join("")+'</div>';
  h+='<div id="apt-body"></div>';
  c.innerHTML=h;
  var body=document.getElementById("apt-body");
  switch(tab){
    case "overview": body.innerHTML=viewApartmentOverview(a.id); break;
    case "expenses": body.innerHTML=viewExpenses(a.id); break;
    case "payments": body.innerHTML=modulePayments(a.id); break;
    case "partners": body.innerHTML=can("edit")?viewApartmentPartners(a.id):'<div class="empty">אין לך הרשאה לצפות בהגדרות השותפים</div>'; break;
    case "managers": body.innerHTML=viewManagers(a.id); break;
    case "bank": body.innerHTML=viewBank(a.id); break;
    case "income": body.innerHTML=viewIncome(a.id); break;
    case "rentals": body.innerHTML=(CU&&CU.role==="admin")?viewAptRentals(a.id):'<div class="empty">אין הרשאה</div>'; break;
    case "reports": body.innerHTML=viewApartmentReports(a.id); break;
  }
}
/* ---------- אישורי בדיקת מנהל ----------
   פעם בתקופה המנהל עובר על הנתונים ומאשר. האישורים יושבים על
   הפרוייקט (a.reviews) — תאריך, מי בדק והערה. */
function apReviews(aptId){
  var a=byId(DB.apartments,aptId);
  return ((a&&a.reviews)||[]).filter(function(r){ return !r.deleted; });
}
function lastReview(aptId){
  var rs=apReviews(aptId).slice().sort(function(x,y){ return x.date<y.date?1:-1; });
  return rs[0]||null;
}
function addReview(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  openModal({title:"✔ אישור בדיקה",bodyHtml:
    '<p class="hint">אישור שהנתונים בפרוייקט נבדקו ונמצאו תקינים, נכון לתאריך.</p>'+
    '<div class="field"><label>תאריך הבדיקה</label><input id="rv-date" type="date" value="'+todayISO()+'"></div>'+
    '<div class="field"><label>הערה</label><input id="rv-note" placeholder="למשל: נבדק מול דף הבנק עד סוף החודש"></div>',
    saveLabel:"אשר בדיקה",onSave:function(){
      var a=byId(DB.apartments,aptId); if(!a) return false;
      a.reviews=a.reviews||[];

        by:(CU&&CU.name)||"",note:val("rv-note"),deleted:false});

}
function delReview(aptId,id){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  if(!confirm("למחוק את אישור הבדיקה?")) return;
  var a=byId(DB.apartments,aptId);
  var r=((a&&a.reviews)||[]).filter(function(x){ return x.id===id; })[0];
  if(r){ r.deleted=true; save(); toast("נמחק","ok"); rerender(); }

function viewApartmentOverview(aptId){
  var a=byId(DB.apartments,aptId); var t=apartmentTotals(aptId);
  var h='<div class="stat-grid">'+
    stat("עלות כוללת",money(t.totalCost))+
    stat("שולם בפועל",money(t.paidAll))+
    stat("נותר לתשלום",money(t.remaining),t.remaining>0?"neg":"pos")+
    stat("סה\"כ הכנסות",money(t.income))+
    (a.hasManagement?stat("דמי ניהול (פעיל)",money(t.totalMgmt)):"")+
    (a.hasBank?stat("יתרת בנק צפויה",money(t.bank)):"")+
    '</div>';

  h+=reviewCardHtml(aptId);

  /* ===== התקדמות התשלום ===== */
  h+='<div class="card"><h3>📊 התקדמות התשלום</h3>'+
    progressBar(t.paidAll,t.totalCost,"מתוך העלות הכוללת")+
    '<div class="stat-grid" style="margin:0">'+
      stat("שולם",money(t.paidAll),"pos")+
      stat("נותר",money(t.remaining),t.remaining>0.01?"neg":"pos")+
      (a.hasManagement?stat("מזה דמי ניהול",money(t.totalMgmt)):"")+
    '</div></div>';

  /* ===== סטטוס שלבים + פילוח סיווג ===== */
  var exps=apLeafExpenses(aptId);
  if(exps.length){
    var byStatus={paid:0,partial:0,unpaid:0,over:0};
    exps.forEach(function(e){ byStatus[expenseStatus(e.id)]+=Number(e.amount)||0; });
    var statusData=[
      {label:"שולם במלואו",value:byStatus.paid,color:"#10b981"},
      {label:"שולם חלקית",value:byStatus.partial,color:"#f59e0b"},
      {label:"לא שולם",value:byStatus.unpaid,color:"#ef4444"},
      {label:"שולם ביתר",value:byStatus.over,color:"#8b5cf6"}
    ].filter(function(d){return d.value>0.01;});
    var byCls={};
    exps.forEach(function(e){ var k=CLASSIFICATIONS[e.classification]||"אחר";
      byCls[k]=(byCls[k]||0)+(Number(e.amount)||0); });
    var clsData=Object.keys(byCls).map(function(k,i){ return {label:k,value:byCls[k],color:chartColor(i+1)}; })
      .sort(function(x,y){return y.value-x.value;});

    h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">'+
      '<div class="card"><h3>סטטוס השלבים</h3>'+donutChart(statusData,180)+'</div>'+
      '<div class="card"><h3>פילוח לפי סיווג</h3>'+donutChart(clsData,180)+'</div>'+
    '</div>';

    /* ===== 10 השלבים הגדולים ===== */
    var top=exps.slice().sort(function(x,y){return (y.amount||0)-(x.amount||0);}).slice(0,10)
      .map(function(e){
        var paid=expensePaid(e.id), rem=expenseRemaining(e.id);
        return {label:e.description, value:Number(e.amount)||0,
          color:rem<=0.01?"#10b981":(paid>0.01?"#f59e0b":"#94a3b8"),
          sub:"שולם "+money(paid)+" · נותר "+money(rem)};
      });
    h+='<div class="card"><h3>🏆 השלבים הגדולים ביותר</h3>'+barChart(top)+
      '<div class="hint">🟢 שולם · 🟡 חלקי · ⚪ טרם שולם</div></div>';

    /* ===== קצב התשלומים לפי חודש ===== */
    var pays=apAllPayments(aptId);
    if(pays.length>1){
      var byMonth={};
      pays.forEach(function(p){ var m=String(p.date||"").slice(0,7); if(!m) return;
        byMonth[m]=(byMonth[m]||0)+(Number(p.amount)||0); });
      var months=Object.keys(byMonth).sort().map(function(m){
        var pp=m.split("-");
        return {label:pp[1]+"/"+pp[0].slice(2), value:byMonth[m]};
      });
      if(months.length>1){
        h+='<div class="card"><h3>📈 קצב התשלומים לאורך זמן</h3>'+lineChart(months)+
          '<div class="hint">סך התשלומים שנרשמו בכל חודש</div></div>';
      }
    }
  }

  /* ===== השוואת שותפים ===== */
  var pRows=reportPartnerIds(aptId).map(function(pid){
    return {label:partnerName(pid), a:partnerShouldPay(aptId,pid), b:partnerPaid(aptId,pid)};
  }).filter(function(r){ return r.a>0.01||r.b>0.01; });
  if(pRows.length){
    h+='<div class="card"><h3>👥 שותפים — אמור לשלם מול שילם</h3>'+groupedBars(pRows)+'</div>';
  }

  // כרטיסי שותפים
  var anyWd=apWithdrawals(aptId).length>0;
  h+='<div class="card"><div class="toolbar"><h3 style="margin:0">שותפים — לתשלום / שולם / יתרה</h3><div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-sm" onclick="editWithdrawal(null,\''+aptId+'\')">💸 משיכת רווח</button>':'')+'</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr>'+
     '<th>שותף</th><th>% ברירת מחדל</th><th>אמור לשלם</th><th>שילם</th>'+(anyWd?'<th>משך רווח</th>':'')+'<th>יתרה</th></tr></thead><tbody>';
  reportPartnerIds(aptId).forEach(function(pid){
    var should=partnerShouldPay(aptId,pid), paid=partnerPaid(aptId,pid);
    var wd=partnerWithdrawn(aptId,pid), bal=round2(paid-should-wd);
    var dp=partnerDefaultPct(aptId,pid);
    h+='<tr><td>'+esc(partnerName(pid))+'</td><td>'+(dp==null?"—":num(dp)+"%")+'</td>'+
      '<td>'+money(should)+'</td><td>'+money(paid)+'</td>'+
      (anyWd?'<td>'+(wd?money(wd):'<span class="muted">—</span>')+'</td>':'')+
      '<td class="'+(bal<0?"neg":"pos")+'">'+money(bal)+(bal<0?" (חייב)":bal>0?" (זכאי)":"")+'</td></tr>';
  });
  h+='</tbody></table></div>'+
    (anyWd?'<div class="hint">היתרה = שילם − אמור לשלם − משיכות רווח. פירוט המשיכות — בלשונית "בנק זמני" → "💸 משיכות רווח".</div>':'')+
    '</div>';
  return h;
}
function stat(label,value,cls){ return '<div class="stat"><div class="label">'+esc(label)+'</div><div class="value '+(cls||"")+'">'+value+'</div></div>'; }

/* ============================================================
   בורר תצוגות — מסך שיש בו כמה דוחות/רשימות מציג רק את מה שנבחר,
   במקום לשפוך הכל יחד. defs = [{key,label,show,render}].
   pk הוא מפתח ייחודי במסך; הבחירה נשמרת ב-state.params ומתאפסת
   בניווט. דוח יחיד — מוצג בלי בורר מיותר.
   ============================================================ */
function reportPicker(pk,defs,opts){
  opts=opts||{};
  var avail=(defs||[]).filter(function(d){ return d && d.show!==false; });
  if(!avail.length) return opts.empty||"";
  if(avail.length===1) return avail[0].render();
  var sel=state.params[pk]||opts.def||avail[0].key;
  if(sel!=="all" && !avail.some(function(d){ return d.key===sel; })) sel=avail[0].key;
  var bar='<div class="toolbar no-print" style="flex-wrap:wrap;gap:6px">'+
    '<span class="muted" style="align-self:center">'+esc(opts.title||"בחר תצוגה")+':</span>'+
    avail.map(function(d){
      return '<button class="btn btn-sm'+(sel===d.key?" btn-primary":"")+'" onclick="setReportPick(\''+pk+'\',\''+d.key+'\')">'+d.label+'</button>';
    }).join("")+
    '<button class="btn btn-sm'+(sel==="all"?" btn-primary":"")+'" onclick="setReportPick(\''+pk+'\',\'all\')">📚 הכל</button>'+
    (opts.extra||"")+'</div>';
  var chosen = sel==="all" ? avail : avail.filter(function(d){ return d.key===sel; });
  return bar+chosen.map(function(d){ return d.render(); }).join("");
}
function setReportPick(pk,k){ state.params[pk]=k; rerender(); }

/* ============================================================
   תרשימים — SVG מוטמע, בלי ספריות חיצוניות (עובד גם מאחורי סינון)
   ============================================================ */
var CHART_COLORS=["#4f46e5","#06b6d4","#f59e0b","#10b981","#ec4899","#8b5cf6","#ef4444","#14b8a6","#f97316","#6366f1"];
function chartColor(i){ return CHART_COLORS[i%CHART_COLORS.length]; }

/* מד התקדמות אופקי */
function progressBar(paid,total,label){
  var pct=total>0?Math.min(100,Math.max(0,paid/total*100)):0;
  var over=paid>total+0.01;
  return '<div style="margin-bottom:14px">'+
    '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">'+
      '<span class="muted">'+esc(label||"")+'</span>'+
      '<span style="font-weight:700">'+money(paid)+' <span class="muted">מתוך '+money(total)+'</span> · '+
        '<span style="color:'+(over?"#dc2626":"#4f46e5")+'">'+num(Math.round(pct))+'%</span></span>'+
    '</div>'+
    '<div style="height:11px;background:#eceffb;border-radius:99px;overflow:hidden">'+
      '<div style="height:100%;width:'+pct+'%;border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1);'+
        'background:'+(over?"linear-gradient(90deg,#f87171,#dc2626)":"linear-gradient(90deg,#4f46e5,#06b6d4)")+'"></div>'+
    '</div></div>';
}

/* תרשים טבעת (donut) */
function donutChart(data,size){
  size=size||190;
  var total=data.reduce(function(s,d){return s+(Number(d.value)||0);},0);
  if(total<=0) return '<div class="empty" style="padding:26px">אין נתונים להצגה</div>';
  var r=size/2-14, cx=size/2, cy=size/2, circ=2*Math.PI*r, off=0;
  var rings=data.map(function(d,i){
    var frac=(Number(d.value)||0)/total, len=circ*frac;
    var el='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(d.color||chartColor(i))+'" '+
      'stroke-width="20" stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-off)+'" '+
      'transform="rotate(-90 '+cx+' '+cy+')" style="transition:stroke-dasharray .6s"><title>'+
      esc(d.label)+': '+money(d.value)+'</title></circle>';
    off+=len; return el;
  }).join("");
  var legend=data.map(function(d,i){
    var pct=total>0?((Number(d.value)||0)/total*100):0;
    return '<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px">'+
      '<span style="width:11px;height:11px;border-radius:3px;background:'+(d.color||chartColor(i))+';flex:none"></span>'+
      '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.label)+'</span>'+
      '<b style="font-variant-numeric:tabular-nums">'+money(d.value)+'</b>'+
      '<span class="muted" style="width:44px;text-align:left">'+num(Math.round(pct))+'%</span></div>';
  }).join("");
  return '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">'+
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="flex:none">'+rings+
      '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="11" fill="#64748b">סה"כ</text>'+
      '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="15" font-weight="800" fill="#1e293b">'+money(total)+'</text>'+
    '</svg>'+
    '<div style="flex:1;min-width:210px">'+legend+'</div></div>';
}

/* תרשים עמודות אופקי */
function barChart(data,opt){
  opt=opt||{};
  if(!data.length) return '<div class="empty" style="padding:26px">אין נתונים להצגה</div>';
  var max=Math.max.apply(null,data.map(function(d){return Math.abs(Number(d.value)||0);}));
  if(max<=0) max=1;
  return '<div>'+data.map(function(d,i){
    var v=Number(d.value)||0, w=Math.abs(v)/max*100;
    var col=d.color||chartColor(i);
    return '<div style="margin-bottom:11px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">'+
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%">'+esc(d.label)+'</span>'+
        '<b style="font-variant-numeric:tabular-nums'+(v<0?';color:#dc2626':'')+'">'+money(v)+'</b></div>'+
      '<div style="height:9px;background:#eceffb;border-radius:99px;overflow:hidden">'+
        '<div style="height:100%;width:'+w+'%;border-radius:99px;background:'+col+';transition:width .5s"></div>'+
      '</div>'+
      (d.sub?'<div class="hint" style="margin-top:2px">'+esc(d.sub)+'</div>':'')+
    '</div>';
  }).join("")+'</div>';
}

/* עמודות מקובצות: אמור לשלם מול שילם */
function groupedBars(rows){
  if(!rows.length) return '<div class="empty" style="padding:26px">אין נתונים להצגה</div>';
  var max=Math.max.apply(null,rows.map(function(r){return Math.max(r.a||0,r.b||0);}));
  if(max<=0) max=1;
  return '<div>'+rows.map(function(r){
    return '<div style="margin-bottom:14px">'+
      '<div style="font-size:12.5px;font-weight:600;margin-bottom:5px">'+esc(r.label)+'</div>'+
      '<div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">'+
        '<span class="muted" style="width:66px;font-size:11.5px">אמור לשלם</span>'+
        '<div style="flex:1;height:9px;background:#eceffb;border-radius:99px;overflow:hidden">'+
          '<div style="height:100%;width:'+((r.a||0)/max*100)+'%;background:#4f46e5;border-radius:99px"></div></div>'+
        '<b style="width:92px;text-align:left;font-size:12px;font-variant-numeric:tabular-nums">'+money(r.a)+'</b></div>'+
      '<div style="display:flex;align-items:center;gap:7px">'+
        '<span class="muted" style="width:66px;font-size:11.5px">שילם</span>'+
        '<div style="flex:1;height:9px;background:#eceffb;border-radius:99px;overflow:hidden">'+
          '<div style="height:100%;width:'+((r.b||0)/max*100)+'%;background:#10b981;border-radius:99px"></div></div>'+
        '<b style="width:92px;text-align:left;font-size:12px;font-variant-numeric:tabular-nums">'+money(r.b)+'</b></div>'+
      '<div style="text-align:left;font-size:12px;margin-top:3px">יתרה: <b class="'+((r.b-r.a)<0?"neg":"pos")+'">'+money(r.b-r.a)+'</b></div>'+
    '</div>';
  }).join("")+'</div>';
}

/* גרף קו/שטח לפי חודשים */
function lineChart(points,opt){
  opt=opt||{};
  if(points.length<2) return '<div class="empty" style="padding:26px">צריך לפחות שני חודשים עם נתונים</div>';
  var W=640,H=190,pad=34;
  var max=Math.max.apply(null,points.map(function(p){return p.value;}));
  if(max<=0) max=1;
  var stepX=(W-pad*2)/(points.length-1);
  var xy=points.map(function(p,i){
    return {x:pad+i*stepX, y:H-pad-(p.value/max)*(H-pad*2), p:p};
  });
  var line=xy.map(function(c,i){ return (i?"L":"M")+c.x.toFixed(1)+" "+c.y.toFixed(1); }).join(" ");
  var area=line+" L"+xy[xy.length-1].x.toFixed(1)+" "+(H-pad)+" L"+xy[0].x.toFixed(1)+" "+(H-pad)+" Z";
  var dots=xy.map(function(c){
    return '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="3.5" fill="#fff" stroke="#4f46e5" stroke-width="2.5">'+
      '<title>'+esc(c.p.label)+': '+money(c.p.value)+'</title></circle>';
  }).join("");
  var labels=xy.map(function(c,i){
    if(points.length>8 && i%Math.ceil(points.length/8)!==0) return "";
    return '<text x="'+c.x.toFixed(1)+'" y="'+(H-pad+16)+'" text-anchor="middle" font-size="10" fill="#94a3b8">'+esc(c.p.label)+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
    '<defs><linearGradient id="lcg" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#4f46e5" stop-opacity=".28"/>'+
      '<stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/></linearGradient></defs>'+
    '<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#e2e8f0"/>'+
    '<line x1="'+pad+'" y1="'+pad+'" x2="'+(W-pad)+'" y2="'+pad+'" stroke="#f1f5f9" stroke-dasharray="3 4"/>'+
    '<text x="'+(pad-6)+'" y="'+(pad+4)+'" text-anchor="end" font-size="10" fill="#94a3b8">'+money(max)+'</text>'+
    '<path d="'+area+'" fill="url(#lcg)"/>'+
    '<path d="'+line+'" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+labels+'</svg>';
}

/* ---- סנכרון גוגל שיטס (best-effort) ---- */
function pushToSheets(){ serverSave(); }
async function pullFromSheets(){
  if(!sheetsUrl()){ toast("לא הוגדר קישור לשיט","err"); return; }
  if(SAVEQ.inflight){ toast("שמירה לשרת בעיצומה — המתן רגע ונסה שוב","warn"); return; }
  if(hasUnsaved()||hasDirtyMark()){
    if(!confirm("יש שינויים מקומיים שטרם נשמרו לשרת.\n\nטעינה מהשיט תדרוס אותם לצמיתות. להמשיך בכל זאת?")) return;
  }
  if(SAVEQ.timer){ clearTimeout(SAVEQ.timer); SAVEQ.timer=null; }
  SAVEQ.dirty=false; SAVEQ.fails=0; clearDirtyMark();
  var res=await serverLoad();
  if(res.error){ toast("שגיאת חיבור לשיט","err"); return; }
  if(res.data && Array.isArray(res.data.apartments)){
    DB=normalizeDB(res.data); setSyncBase(res.data); saveLocal(); UNDO.length=0;   // סטאק ישן = בסיס לא תקף אחרי משיכה
    toast("נטען מהשיט","ok"); rerender();
  }
  else toast("השיט ריק","warn");
}

/* ---------- רענון אוטומטי משינויים של משתמשים אחרים ----------
   עד עכשיו הנתונים נמשכו מהשיטס רק בטעינת הדף, ולכן שינוי שמישהו אחר
   עשה לא הופיע עד רענון ידני. כאן בודקים כל 45 שניות את מונה הגרסה
   בשרת (בקשה זעירה, בלי הנתונים) ומושכים רק כשבאמת יש חדש.
   לעולם לא מושכים כשיש עבודה מקומית שטרם נשמרה, כשמודאל פתוח או
   כשעומדים בתוך שדה — כדי לא לדרוס הקלדה באמצע. */
var POLL={timer:null,pending:false,busy:false,lastCheck:0};
var POLL_MS=45000;
function startPolling(){
  if(POLL.timer) return;
  POLL.timer=setInterval(pollForUpdates,POLL_MS);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible") pollForUpdates();
  });
  window.addEventListener("focus",function(){ pollForUpdates(); });
}
function pollBlockedBy(){
  if(!CU||!getAuth()) return "no-auth";
  if(document.visibilityState!=="visible") return "hidden";
  /* לצופה אין מה לדחוף — סימון "לא סונכרן" שנשאר מעריכה קודמת באותו
     דפדפן לא יחסום אותו מלקבל עדכונים לנצח. */
  if(CU && !can("edit")) return "";
  if(SAVEQ.inflight||SAVEQ.dirty||SAVEQ.timer||hasDirtyMark()||hasUnsaved()) return "local-work";
  return "";
}
async function pollForUpdates(){
  if(POLL.busy) return;
  /* עדכון שקט מחלון אחר שחיכה שהמשתמש יתפנה */
  if(TABSYNC_PENDING){ POLL.busy=true; try{ await tabSyncTry(); } finally{ POLL.busy=false; } return; }
  if(pollBlockedBy()) return;
  /* רינדור שנדחה בגלל עבודה באמצע — מושלם ברגע שהמשתמש פנוי,
     בלי לחכות לגרסה חדשה מהשרת */
  if(POLL.pending && !uiIsBusy()){ POLL.busy=true; try{ await applyServerUpdate(); } finally{ POLL.busy=false; } return; }
  var now=Date.now();
  if(now-POLL.lastCheck<4000) return;      // הגנה מפני מבול פוקוס
  POLL.lastCheck=now;
  POLL.busy=true;
  try{
    var res=await api({action:"rev",codeHash:getAuth()});
    if(!res||!res.ok) return;
    var srv=Number(res.rev)||0, loc=(DB&&DB.meta&&Number(DB.meta.rev))||0;
    if(srv<=loc) return;
    if(pollBlockedBy()) return;             // משהו השתנה בזמן ההמתנה
    POLL.srv=srv;                           // נשמר גם ללחיצה על הבאנר
    if(uiIsBusy()){ POLL.pending=true; showUpdateBanner(); return; }
    await applyServerUpdate(srv);
  } finally { POLL.busy=false; }
}
/* מודאל פתוח, או פוקוס בתוך שדה — רינדור מחדש היה מוחק את מה שמקלידים */
function uiIsBusy(){
  var mr=document.getElementById("modal-root");
  if(mr && mr.innerHTML.trim()) return true;
  var ae=document.activeElement;
  if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return true;
  /* שורות מסומנות = המשתמש באמצע פעולה מרוכזת. עדכון ממשתמש אחר לא
     נטען מעליו אוטומטית — מוצג באנר, והוא טוען כשנוח לו. הסימונים
     ממילא שורדים את הטעינה (renderApp משמר), זו הגנה כפולה. */
  if(anySelectionMarked()) return true;
  /* חלונית סינון עמודה פתוחה — רינדור באמצע היה משאיר אותה "מתה":
     מחוברת לטבלה שכבר הוחלפה, והסימונים בה לא משפיעים על כלום. */
  if(typeof _openPicker!=="undefined" && _openPicker) return true;
  return false;
}
async function applyServerUpdate(polledRev){
  var res=await serverLoad();
  if(res.error||!res.data||!Array.isArray(res.data.apartments)) return false;
  var srv=(res.data.meta&&Number(res.data.meta.rev))||0;
  /* אחרי שחזור גיליון מהיסטוריית גרסאות, מונה הבדיקה המהירה (בהגדרות
     הסקריפט) גבוה מהמונה שבנתונים. בלי אימוץ המונה הגבוה, הבאנר "יש
     עדכון" היה קופץ לנצח: כל טעינה מחזירה מונה נמוך, וכל בדיקה רואה
     שוב את הגבוה. */
  var known=Number(polledRev)||Number(POLL.srv)||0;
  if(known>srv){ res.data.meta=res.data.meta||{version:1}; res.data.meta.rev=known; srv=known; }
  var loc=(DB&&DB.meta&&Number(DB.meta.rev))||0;
  if(srv<=loc){
    /* אין נתונים חדשים מהשרת — אבל ייתכן שהרינדור נדחה (מיזוג בזמן
       שהמשתמש היה עסוק) והמסך מציג מצב ישן. מרעננים מהמקומי. */
    POLL.pending=false; hideUpdateBanner(); rerender(); return false;
  }
  if(pollBlockedBy()==="local-work"){
    /* יש עבודה מקומית באמצע שליחה — השמירה עצמה תמזג את שני הצדדים.
       לא שותקים: מי שלחץ על הבאנר מקבל הסבר במקום כלום. */
    toast("יש שינויים מקומיים באמצע שמירה — הם ימוזגו עם העדכון אוטומטית","warn");
    return false;
  }
  DB=normalizeDB(res.data); setSyncBase(res.data); saveLocal(); UNDO.length=0;
  POLL.pending=false; hideUpdateBanner();
  rerender();
  tabSyncBroadcast();
  toast("עודכן — נכנסו שינויים ממשתמש אחר","ok");
  return true;
}
function showUpdateBanner(){
  if(document.getElementById("upd-banner")) return;
  var b=document.createElement("div");
  b.id="upd-banner";
  b.innerHTML='🔄 יש עדכון חדש ממשתמש אחר <button class="btn btn-sm" onclick="applyServerUpdate()">טען עכשיו</button>';
  document.body.appendChild(b);
}
function hideUpdateBanner(){ var b=document.getElementById("upd-banner"); if(b) b.remove(); }

/* ---------- סנכרון שקט בין חלונות של אותו דפדפן ----------
   מי שפותח את המערכת בשני מסכים קיבל על כל שמירה בחלון אחד את ההודעה
   "נכנסו שינויים ממשתמש אחר" בחלון השני — למרות שזה הוא עצמו. שני
   החלונות חולקים את אותו עותק מקומי מוצפן, ולכן אחרי שמירה מוצלחת
   החלון השומר משדר לשאר, והם מאמצים את העותק המשותף בשקט: בלי הודעה,
   בלי באנר, ובלי פנייה נוספת לשרת. ההודעות נשארות רק על עדכונים
   שבאמת הגיעו ממחשב או דפדפן אחר. */
var TABSYNC=null, TABSYNC_PENDING=false;
try{
  if(window.BroadcastChannel){
    TABSYNC=new BroadcastChannel(LSKEY+"_tabs");
    TABSYNC.onmessage=function(ev){
      var d=ev&&ev.data;
      /* חלון שמחובר כמשתמש אחר באותו דפדפן — העותק המקומי בכלל לא שלו */
      if(!CU || !d || d.who!==CU.id) return;
      tabSyncSoon(Number(d.rev)||0, 0);
    };
  }
}catch(e){ TABSYNC=null; }
/* השידור מאוגד לרבע שנייה: הקלדה מהירה מייצרת שמירות רבות, ובלי
   האיגוד החלון השני היה מפענח את המטמון עשרות פעמים ברצף. */
var TABSYNC_T=null;
function tabSyncBroadcast(){
  if(!TABSYNC || !CU) return;
  if(TABSYNC_T) clearTimeout(TABSYNC_T);
  TABSYNC_T=setTimeout(function(){
    TABSYNC_T=null;
    try{ TABSYNC.postMessage({who:CU.id, rev:(DB&&DB.meta&&Number(DB.meta.rev))||0}); }catch(e){}
  },250);
}
/* הכתיבה המוצפנת של החלון השולח נשטפת ברקע, ולכן ברגע השידור היא
   עדיין לא בהכרח על הדיסק. במקום להמתין זמן קבוע (שלפעמים קצר מדי
   ותמיד מרגיש איטי) — מנסים עד שהעותק המשותף באמת מכיל את הגרסה
   ששודרה. בפועל זה נגמר בניסיון הראשון או השני. */
function tabSyncSoon(wantRev,attempt){
  setTimeout(function(){
    tabSyncTry(wantRev).then(function(res){
      if(res==="wait" && attempt<6) tabSyncSoon(wantRev,attempt+1);
    });
  }, attempt?120:40);
}
async function tabSyncTry(wantRev){
  if(!CU) return "none";
  /* עבודה מקומית באמצע — השמירה שלה תמזג ממילא; לא דורסים אותה.
     עסוק במסך (שדה/מודאל/סימונים) — מחכים שיתפנה, בלי באנר. */
  if(SAVEQ.inflight||SAVEQ.dirty||SAVEQ.timer||hasUnsaved()){ TABSYNC_PENDING=true; return "busy"; }
  if(uiIsBusy()){ TABSYNC_PENDING=true; return "busy"; }
  try{
    var raw=await vaultGet(LSKEY);
    if(!raw) return "none";
    var d=JSON.parse(raw);
    if(!d || !Array.isArray(d.apartments)) return "none";
    var vrev=(d.meta&&Number(d.meta.rev))||0, loc=(DB&&DB.meta&&Number(DB.meta.rev))||0;
    /* הגרסה ששודרה עוד לא נכתבה — לא מוותרים, מנסים שוב */
    if(wantRev && vrev<wantRev) return "wait";
    TABSYNC_PENDING=false;
    /* הבסיס המשותף מרוענן בכל שידור — גם כשאין מה להציג מחדש. אחרת
       השידור השני (אחרי אישור השרת) היה יוצא מכאן מוקדם, והחלון הזה
       היה נשאר עם בסיס מיזוג ישן. */
    await loadSyncBase();
    if(vrev<=loc) return "same";               // אין שם כלום חדש ממה שמוצג
    DB=normalizeDB(d);
    LAST_JSON=JSON.stringify(DB); UNDO.length=0;
    incMapClear();
    POLL.pending=false; hideUpdateBanner();
    rerender();
    return "ok";
  }catch(e){ return "none"; }
}

/* ---- סנכרון מול גוגל שיטס (Apps Script) — מקור האמת ---- */
/* ============================================================
   מיזוג תלת-כיווני — הלב של עבודה רב-משתמשית
   ------------------------------------------------------------
   כל שמירה שולחת את כל מסד הנתונים, ולכן שני משתמשים שעובדים במקביל
   היו דורסים זה את זה: המאחר או שנדחה (והקלט שלו נזרק ל"גיבוי") או
   שהתקבל ודרס בשקט את הראשון. הפתרון: זוכרים את "הבסיס" — המצב האחרון
   שסונכרן מול השרת — וכשמתגלה התנגשות ממזגים רשומה-רשומה:
   מה שרק אני שיניתי לעומת הבסיס — שלי; מה שרק הצד השני שינה — שלו;
   שנינו שינינו את אותה רשומה — השרת גובר, והעותק שלי נשמר ב"גיבוי".
   ============================================================ */
/* SYNCBASE = המצב האחרון שסונכרן מול השרת; SYNCREV = מונה הגרסה שלו.
   שניהם נשמרים ב-localStorage כדי שגם אחרי סגירת הדפדפן המיזוג ישווה
   מול הבסיס האמיתי — בלי זה, מיזוג בכניסה השווה את המקומי מול השרת
   עצמו וכל הבדל נראה כ"שינוי שלי" (כולל החזרת מחיקות של אחרים). */
var SYNCBASE=null, SYNCREV=0;
function setSyncBase(d){
  try{
    SYNCBASE=(typeof d==="string")?d:JSON.stringify(d);
    var p=(typeof d==="string")?JSON.parse(d):d;
    SYNCREV=(p&&p.meta&&Number(p.meta.rev))||0;
    try{ vaultPut(LSKEY+"_base",SYNCBASE); localStorage.setItem(LSKEY+"_baserev",String(SYNCREV)); }
    catch(qe){ try{ localStorage.removeItem(LSKEY+"_base"); }catch(e2){} }
  }catch(e){ SYNCBASE=null; }
}
async function loadSyncBase(){
  try{
    SYNCBASE=await vaultGet(LSKEY+"_base");
    SYNCREV=SYNCBASE?(Number(localStorage.getItem(LSKEY+"_baserev"))||0):0;
  }catch(e){ SYNCBASE=null; SYNCREV=0; }
}
var MERGE_TABLES=["apartments","partners","apartmentPartners","managers","categories",
  "expenses","expenseSplits","expenseManagerFees","accounts","payments","deposits",
  "income","bankMoves","stmtBanks","withdrawals","incMgmtPays","recurring","rentals","sheets","users"];
function merge3(baseStr,mine,theirs){
  var base=null;
  try{ base=baseStr?JSON.parse(baseStr):null; }catch(e){ base=null; }
  /* בלי בסיס אין דרך לדעת מי שינה מה. base=theirs היה הופך כל הבדל
     ל"רק אני שיניתי" — כלומר המקומי הישן היה מנצח ומחזיר מחיקות של
     אחרים. לכן: בלי בסיס השרת גובר על כל רשומה משותפת, ורק רשומות
     שקיימות אצלי בלבד (חדשות) מתווספות. */
  var noBase=!base;
  if(noBase) base=null;
  var out={}, conflicts=0;
  function idx(arr){ var m={}; (arr||[]).forEach(function(x){ if(x&&x.id!=null) m[x.id]=x; }); return m; }
  MERGE_TABLES.forEach(function(T){
    var B=base?idx(base[T]):{}, M=idx(mine[T]), Th=idx(theirs[T]);
    var res=[], seen={};
    /* קודם בסדר של השרת — ואז תוספות מקומיות חדשות בסופו */
    (theirs[T]||[]).forEach(function(t){
      if(t==null||t.id==null) return;
      seen[t.id]=1;
      var m=M[t.id];
      if(!m){ res.push(t); return; }                       // אצלי איננה — של השרת
      var mj=JSON.stringify(m), tj=JSON.stringify(t);
      if(mj===tj){ res.push(t); return; }                  // זהות
      if(noBase){ conflicts++; res.push(t); return; }      // בלי בסיס — השרת גובר
      var b=B[t.id], bj=b?JSON.stringify(b):null;
      if(mj===bj){ res.push(t); return; }                  // רק השרת שינה — שלו
      if(tj===bj){ res.push(m); return; }                  // רק אני שיניתי — שלי
      conflicts++; res.push(t);                            // שנינו — השרת גובר
    });
    (mine[T]||[]).forEach(function(m){
      if(m==null||m.id==null||seen[m.id]) return;
      /* קיימת אצלי ולא בשרת: חדשה שלי — נכנסת. הייתה גם בבסיס —
         ירדה מהשרת (למשל שינוי הרשאות) ולא מחזירים אותה בכוח. */
      if(noBase){ res.push(m); return; }                   // בלי בסיס: רק חדשות שלי
      var b=B[m.id];
      if(!b) res.push(m);
      else if(JSON.stringify(m)!==JSON.stringify(b)){ conflicts++; }
    });
    out[T]=res;
  });
  /* טבלאות שאינן ברשימת המיזוג — נשמרות ולא נופלות. כשקוד ישן פוגש
     נתונים מגרסה חדשה ממנו, הפלת טבלה לא-מוכרת פירושה מחיקתה בשמירה
     הבאה. השרת גובר; טבלה שקיימת רק אצלי — נשמרת. */
  [theirs,mine].forEach(function(src){
    Object.keys(src||{}).forEach(function(k){
      if(out[k]!==undefined || k==="settings" || k==="meta") return;
      if(Array.isArray(src[k])) out[k]=src[k];
    });
  });
  /* הגדרות: אמצעי תשלום מתאחדים; שאר השדות — מי ששינה מול הבסיס */
  var bs=((base&&base.settings)||{}), ms=(mine.settings||{}), ts=(theirs.settings||{});
  var st={};
  [ts,ms].forEach(function(src){ Object.keys(src).forEach(function(k){ if(k!=="paymentMethods") st[k]=src[k]; }); });
  Object.keys(ms).forEach(function(k){
    if(k==="paymentMethods") return;
    if(noBase){ if(ts[k]!==undefined) st[k]=ts[k]; return; }   // בלי בסיס — השרת גובר
    if(JSON.stringify(ms[k])!==JSON.stringify(bs[k])) st[k]=ms[k];
    else if(ts[k]!==undefined) st[k]=ts[k];
  });
  st.paymentMethods={};
  [ts.paymentMethods||{},ms.paymentMethods||{}].forEach(function(pm){
    Object.keys(pm).forEach(function(k){ st.paymentMethods[k]=pm[k]; });
  });
  out.settings=st;
  out.meta=theirs.meta||mine.meta||{version:1,rev:0};
  return {db:out,conflicts:conflicts};
}
/* התנגשות שהתגלתה (בבדיקה מוקדמת או בדחיית השרת): מושכים את גרסת
   השרת, ממזגים, ושומרים מחדש עם מונה גבוה יותר. */
var MERGE_ROUNDS=0;     // הגנה מפני לולאת מיזוג אינסופית מול שרת תקול
function resolveConflictAndResave(){
  stashLocalBackup("לפני מיזוג — משתמש אחר עדכן במקביל");
  /* התור חייב להישאר "מלוכלך" לאורך כל המסלול: אם משהו ייכשל באמצע,
     הניסיון החוזר עדיין מזוין ולא נשארים עם שינוי שלא נשלח לעולם. */
  SAVEQ.dirty=true;
  return serverLoad().then(function(res){
    if(!(res.data && Array.isArray(res.data.apartments))){
      SAVEQ.fails++; scheduleRetry(); return;
    }
    var srvRev=(res.data.meta&&Number(res.data.meta.rev))||0;
    var merged=merge3(SYNCBASE, DB, res.data);
    var next=normalizeDB(merged.db);
    /* הבסיס מתעדכן רק אחרי מיזוג מוצלח — לפני כן הוא עדיין האב הקדמון */
    setSyncBase(res.data);
    DB=next;
    DB.meta=DB.meta||{version:1};
    DB.meta.rev=srvRev+1;
    saveLocal(); UNDO.length=0;
    /* מיזוג חוזר ונשנה = השרת ממשיך להתקדם או תקול. משהים בהדרגה
       במקום להסתחרר בלולאה צמודה שמציפה את הרשת ואת המסך. */
    MERGE_ROUNDS++;
    var delay=MERGE_ROUNDS>2?Math.min(1500*(MERGE_ROUNDS-2),15000):0;
    setTimeout(function(){ flushSave(); },delay);
    setTimeout(function(){ MERGE_ROUNDS=0; },60000);
    /* המסך נבנה מחדש רק כשהמשתמש פנוי. באמצע סימון או עם חלונית
       סינון פתוחה — הנתונים כבר ממוזגים ושמורים, והתצוגה תתעדכן
       מהבאנר או מהפולינג ברגע שיתפנה. זה היה המסלול שמחק סימונים
       למרות השימור: הוא רץ מהשמירה של המשתמש עצמו, לא מהפולינג. */
    if(uiIsBusy()){ POLL.pending=true; showUpdateBanner(); }
    else rerender();
    toast(merged.conflicts
      ? "מוזגו שינויים משני משתמשים · "+merged.conflicts+" התנגשויות הוכרעו לפי השרת (העותק שלך בגיבוי)"
      : "נשמר · שולבו גם שינויים ממשתמש אחר",
      merged.conflicts?"warn":"ok");
  }).catch(function(){
    /* חריגה במיזוג עצמו — לא משאירים את התור תקוע */
    SAVEQ.dirty=true; SAVEQ.fails++; scheduleRetry();
  });
}
/* ---------- תור שמירה ----------
   כל שמירה שולחת את כל מסד הנתונים. כששולחים כמה בקשות במקביל הן אינן
   חוזרות בהכרח בסדר שנשלחו, ובקשה ישנה שמגיעה אחרונה דורסת שינויים
   חדשים — כך "חזרו" סימוני בנק שכובו. לכן: בקשה אחת בלבד בכל רגע,
   ותמיד עם המצב העדכני. שינויים שנעשו בזמן שליחה נשלחים מיד אחריה. */
var SAVEQ={inflight:false,dirty:false,timer:null,fails:0};
function serverSave(){
  if(!getAuth()){ setSync("local"); return; }
  SAVEQ.dirty=true;
  SAVEQ.fails=0;                       // עריכה חדשה מאפסת את מונה הכישלונות — ניסיון מיידי
  setSync("saving");
  if(SAVEQ.timer) return;
  /* 350ms שלחו כל הקלדה בנפרד לשרת. כששני אנשים עובדים במקביל כמעט
     כל שמירה נחתה על גרסה חדשה יותר וייצרה מיזוג — ומכאן ההודעה
     "מוזגו שינויים" שקפצה שוב ושוב. איגוד לשתיים וחצי שניות מצמצם
     את זה בסדר גודל. השמירה המקומית ממילא מיידית, ויציאה מהדף
     דוחפת מיד (pagehide), כך שאין סיכון לאיבוד. */
  SAVEQ.timer=setTimeout(function(){ SAVEQ.timer=null; flushSave(); },2500);
}
function scheduleRetry(){
  /* לעולם לא מפסיקים לנסות — רק מאטים (עד 30 שניות בין ניסיונות).
     עצירה קשיחה אחרי N כישלונות השאירה שינויים תקועים לנצח. */
  var delay=Math.min(2000*Math.max(1,SAVEQ.fails), 30000);
  setSync(SAVEQ.fails>=3 ? "err" : "saving");
  setTimeout(flushSave, delay);
}
async function flushSave(){
  if(SAVEQ.inflight || !SAVEQ.dirty) return;
  var h=getAuth(); if(!h){ setSync("local"); return; }
  /* תפקיד ללא הרשאת עריכה לא ינסה לדחוף — השרת יחזיר forbidden,
     והדחיפה הייתה נכשלת שוב ושוב בכל כניסה. */
  if(CU && !can("edit")){ SAVEQ.dirty=false; setSync("local"); return; }
  SAVEQ.dirty=false; SAVEQ.inflight=true; setSync("saving");
  try{
  /* בדיקה מוקדמת וזולה: אם השרת כבר התקדם אל (או מעבר ל) המונה שלנו —
     משתמש אחר שמר בינתיים. בלעדיה, שמירה עם מונה שווה הייתה מתקבלת
     ודורסת בשקט את מה שהוא הכניס. נכשלה הבדיקה (רשת)? ממשיכים —
     שומר-הגרסה בשרת עדיין עוצר את המקרים הקשים. */
  try{
    var rc=await api({action:"rev",codeHash:h});
    if(rc && rc.ok){
      var srv=Number(rc.rev)||0, loc=(DB&&DB.meta&&Number(DB.meta.rev))||0;
      if(srv>=loc){
        SAVEQ.inflight=false;
        resolveConflictAndResave();
        return;
      }
    }
  }catch(e){}
  var snap=JSON.stringify(DB);                                      // תמונת מצב עדכנית
  var payload='{"action":"save","codeHash":'+JSON.stringify(h)+',"data":'+snap+'}';
  fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:payload})
    .then(function(r){ return r.json(); })
    .then(function(j){
      SAVEQ.inflight=false;
      if(j&&j.ok){
        SAVEQ.fails=0; MERGE_ROUNDS=0;
        setSyncBase(snap);                   // מה שנשלח הוא עכשיו מצב השרת
        tabSyncBroadcast();                  // חלונות אחרים של אותו דפדפן מתעדכנים בשקט
        if(j.restoredTables&&j.restoredTables.length){
          /* השרת השלים טבלאות שחסרו בשמירה — העותק המקומי חסר.
             מושכים את המלא, שהמסך לא ימשיך להציג חוסר שיישמר שוב. */
          toast("השרת שחזר טבלאות שחסרו בשמירה: "+j.restoredTables.join(", ")+" — הנתונים נטענים מחדש","warn");
          serverLoad().then(function(r2){
            if(r2&&r2.data&&Array.isArray(r2.data.apartments)){
              DB=normalizeDB(r2.data); setSyncBase(r2.data); saveLocal(); rerender();
            }
          });
        }
        if(SAVEQ.dirty){ setSync("saving"); setTimeout(flushSave,0); }   // שינויים שנעשו בזמן השליחה
        else { clearDirtyMark(); setSync("ok"); }
        return;
      }
      SAVEQ.dirty=true;
      var err=j&&j.error;
      if(err==="stale-rev"){
        /* משתמש אחר שמר בינתיים — ממזגים במקום לזרוק את העבודה שלנו */
        SAVEQ.dirty=false; setSync("saving");
        resolveConflictAndResave();
        return;
      }
      if(err==="forbidden"){
        /* הקוד תקף אבל לתפקיד אין הרשאת עריכה — לא מנתקים ולא יורים
           שוב ושוב. השינוי נשאר מקומי ומסומן. */
        SAVEQ.dirty=false; setSync("local");
        toast("למשתמש הזה אין הרשאת עריכה — השינויים נשמרו מקומית בלבד","warn");
        return;
      }
      if(err==="shrink-guard"||err==="users-wipe"||err==="storage-error"){
        /* השרת סירב כדי להגן על הנתונים (שמירה שמרוקנת מסד / מוחקת את
           כל המשתמשים / מסד לא קריא). אין טעם לירות שוב אוטומטית —
           העבודה שמורה מקומית ומסומנת, והמשתמש מקבל הסבר אמיתי. */
        SAVEQ.dirty=true; setSync("err");
        if(!SAVEQ.guardToasted){
          SAVEQ.guardToasted=true;
          toast(err==="users-wipe"
            ? "השרת חסם שמירה שהייתה מוחקת את כל המשתמשים — השינויים נשמרו מקומית. רענן את הדף וודא שהנתונים מלאים לפני שמירה נוספת"
            : err==="storage-error"
            ? "מסד הנתונים בשרת אינו קריא — שמירות נעצרו כדי להגן עליו. פנה למנהל לשחזור"
            : "השרת חסם שמירה שהייתה מוחקת חלק גדול מהנתונים — השינויים נשמרו מקומית. רענן את הדף וודא שהנתונים מלאים לפני שמירה נוספת","err");
        }
        return;
      }
      if(err==="unauthorized"){
        /* קוד הכניסה כבר לא תקף (למשל אחרי איפוס ממכשיר אחר).
           אסור להמשיך לירות — עוצרים, והשינוי שמור מקומית ומסומן,
           כך שאחרי כניסה מחודשת הוא נדחף לשרת ולא נמחק. */
        setSync("err"); setAuth(""); CU=null;
        toast("החיבור לשרת פג — יש להתחבר מחדש. השינויים שלך שמורים ויסונכרנו אחרי הכניסה","err");
        renderApp(); return;
      }
      SAVEQ.fails++; scheduleRetry();
    })
    .catch(function(){
      SAVEQ.inflight=false; SAVEQ.fails++; SAVEQ.dirty=true;
      scheduleRetry();
    });
  }catch(e){
    /* חריגה סינכרונית (למשל JSON.stringify על נתון פגום) הייתה משאירה
       inflight=true לנצח — כל שמירה עתידית הייתה נחסמת בשקט. */
    SAVEQ.inflight=false; SAVEQ.dirty=true; SAVEQ.fails++;
    scheduleRetry();
  }
}
function hasUnsaved(){ return !!(SAVEQ.dirty||SAVEQ.inflight); }
window.addEventListener("online",function(){    // הרשת חזרה — מנסים מיד
  if(SAVEQ.dirty && !SAVEQ.inflight){ SAVEQ.fails=0; flushSave(); }
});
window.addEventListener("beforeunload",function(e){
  if(hasUnsaved()){ e.preventDefault(); e.returnValue=""; return ""; }
});
window.addEventListener("pagehide",function(){
  /* ניסיון אחרון לשלוח לפני סגירה. אם הוא נכשל (או שהנתונים גדולים מדי
     ל-keepalive) — הסימון המקומי נשאר, והכניסה הבאה תדחף את המקומי. */
  if(!hasUnsaved()) return;
  var h=getAuth(); if(!h) return;
  try{
    fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"save",codeHash:h,data:DB}),keepalive:true});
  }catch(e){}
});
/* תרגום תשובת "load" גולמית לצורה שכל הקוראים מצפים לה. חולץ כדי
   שגם טעינה שיצאה במקביל לאימות תעבור באותו מסלול. */
function loadResult(j){
  if(j&&j.ok){ setSync("ok"); return {data:(j.data||null),user:j.user}; }
  setSync("err"); return {error:true,reason:(j&&j.error)};
}
async function serverLoad(){
  var h=getAuth();
  if(!h){ setSync("local"); return {error:true}; }
  return loadResult(await api({action:"load",codeHash:h}));
}

/* ============================================================
   אתחול — השרת הוא מקור האמת; localStorage הוא מטמון מקומי
   ============================================================ */
/* סנכרון אחרי אימות: מושכים את השרת, משווים מוני גרסאות, ומחליטים —
   דוחפים את המקומי רק אם הוא באמת חדש יותר. דחיפה עיוורת של עותק ישן
   היא שמחקה תשלומים בעבר, ולכן ההשוואה כאן קריטית.
   מחזיר: true=להיכנס, false=אימות נכשל, null=אין רשת */
async function reconcileAfterAuth(pre){
  var res = pre ? loadResult(pre) : await serverLoad();
  /* הטעינה המקבילה נכשלה בעוד האימות הצליח (תקלת רשת רגעית) —
     מנסים שוב ברצף, שלא ניפול לכניסה בלי נתונים. */
  if(pre && res.error && res.reason!=="unauthorized") res=await serverLoad();
  if(res.error){
    if(res.reason==="unauthorized"){ setAuth(""); CU=null; return false; }
    if(hasDirtyMark() && DB && Array.isArray(DB.apartments)) return true;   // אין רשת אבל יש עבודה מקומית — לא חוסמים
    return null;
  }
  if(res.user) CU=res.user;
  var srvRev=(res.data&&res.data.meta&&Number(res.data.meta.rev))||0;
  var locRev=(DB&&DB.meta&&Number(DB.meta.rev))||0;
  var localDirty=hasDirtyMark() && DB && Array.isArray(DB.apartments);
  /* אין עבודה מקומית — פשוט מיישרים לשרת (וזה גם הבסיס החדש).
     יש עבודה מקומית — הבסיס נשאר האב הקדמון עד אחרי המיזוג. */
  if(!localDirty){
    if(res.data && Array.isArray(res.data.apartments)){
      DB=normalizeDB(res.data); setSyncBase(res.data); saveLocal(); UNDO.length=0; clearDirtyMark();
    }
    return true;
  }
  if(res.data===null){
    SAVEQ.dirty=true; flushSave();
    toast("נמצאו שינויים שטרם סונכרנו — נשלחים לשרת","warn");
    return true;
  }
  if(res.data && Array.isArray(res.data.apartments)){
    if(srvRev<=SYNCREV && locRev>=srvRev){
      /* השרת לא התקדם מאז הבסיס שלנו — אין מה למזג, רק לדחוף */
      SAVEQ.dirty=true; flushSave();
      toast("נמצאו שינויים שטרם סונכרנו — נשלחים לשרת","warn");
      return true;
    }
    /* עבודה מקומית מול שרת שהתקדם — ממזגים במקום לזרוק צד כלשהו */
    stashLocalBackup("לפני מיזוג בכניסה — השרת התעדכן בינתיים");
    var merged=merge3(SYNCBASE, DB, res.data);
    var next=normalizeDB(merged.db);
    setSyncBase(res.data);              // רק אחרי המיזוג
    DB=next;
    DB.meta=DB.meta||{version:1}; DB.meta.rev=srvRev+1;
    saveLocal(); UNDO.length=0;
    SAVEQ.dirty=true; setTimeout(flushSave,0);
    toast(merged.conflicts
      ? "מוזגו שינויים מקומיים עם עדכוני השרת · "+merged.conflicts+" התנגשויות הוכרעו לפי השרת"
      : "שינויים מקומיים מוזגו עם עדכוני השרת","warn");
  }
  return true;
}
async function boot(){
  var auth=getAuth();
  /* הכספת נפתחת רק עם קוד כניסה תקף בסשן. בלי סשן — לא נוגעים במטמון
     המוצפן (הוא ממילא בלתי קריא), אבל עותק גלוי ששרד מגרסה קודמת
     נמחק כאן, אלא אם יש בו עבודה שטרם סונכרנה. */
  if(auth) await vaultUnlock(auth);
  else if(hasPlainLeftovers() && !hasDirtyMark()) vaultWipe();
  var hadLocal=await loadDB();
  await loadSyncBase();   // בסיס המיזוג שורד סגירת דפדפן — בלעדיו המיזוג בכניסה שגוי
  await loadStash();
  if(hadLocal && DB){ try{ LAST_JSON=JSON.stringify(DB); }catch(e){} }
  if(!hadLocal||!DB){ DB=blankDB(); seedIfEmpty(); }
  if(auth){                            // session פעיל
    var r=await reconcileAfterAuth();
    if(r===null){ CU=null; }           // אין רשת ואין עבודה מקומית — מסך כניסה עם האזהרה
    else if(r===false){ /* אומת כלא-תקף — כבר נוקה */ }
    resetIdle();
  }
  try{ runRecurring(true); }catch(e){}      // הוצאות תקופתיות שהגיע מועדן
  try{ runRentalIncome(true); }catch(e){}   // שורות הכנסה חודשיות מחוזי שכירות
  renderApp();
  watchTables();     // כלי טבלה + כפתור ייצוא לכל טבלה, גם אחרי רינדור חלקי
  watchSelects();    // זיכרון הבחירה הקודמת בבוררים עם "הוסף חדש…"
  startPolling();    // משיכת שינויים של משתמשים אחרים בלי לרענן ידנית
}
</script>
<script>
"use strict";
/* ============================================================
   מודולים
   ============================================================ */
/* ---------- חיפוש וסינון ---------- */
var Q={apts:"",exp:"",expStatus:"",expClass:"",quick:"",partners:"",cross:"",recycle:"",pay:"",payWho:"",paySrc:"",payInv:"",ppWho:"",apPayWho:"",rent:"",rentApt:"",rentStatus:"",expSplit:""};
/* כל מילה בשאילתה חייבת להופיע — מאפשר "עורך דין קופר" ו"קופר דין" כאחד */
function matches(q,text){
  q=String(q||"").trim().toLowerCase(); if(!q) return true;
  var t=String(text||"").toLowerCase();
  return q.split(/\s+/).every(function(w){ return t.indexOf(w)>=0; });
}
function searchBox(id,val,ph,handler){
  return '<input id="'+id+'" value="'+esc(val)+'" placeholder="🔍 '+esc(ph)+'" '+
    'oninput="'+handler+'" style="max-width:300px">';
}
/* ============================================================
   סינון ומיון לפי עמודה — כמו באקסל
   עובד על כל טבלה: מוסיף שורת שדות מתחת לכותרות, ומיון בלחיצה.
   פועל על ה-DOM בלבד, כך שהוא חל על כל דוח בלי שינוי בקוד שלו.
   ============================================================ */
/* סינון-העמודות יושב ב-DOM, ולכן רינדור מחדש (למשל אחרי עריכת שורה)
   היה מאפס אותו. שומרים את ערכי הסינון לפי חתימת הכותרות ומשחזרים
   אותם כשהטבלה נבנית מחדש — כך הסינון שורד עריכה. מתאפס בניווט. */
var COLFILT={};
function tableSig(t){
  var hr=t.tHead&&t.tHead.rows[0]; if(!hr) return "";
  return Array.prototype.map.call(hr.cells,function(c){ return String(c.textContent||"").replace(/[▲▼]/g,"").trim(); }).join("|");
}
function attachTableTools(root){
  var scope=root||document;
  scope.querySelectorAll("table.tbl").forEach(function(t){
    if(t.getAttribute("data-tools")) return;
    var head=t.tHead; if(!head||!head.rows.length) return;
    if(!t.tBodies.length||!t.tBodies[0].rows.length) return;
    if(t.tBodies[0].rows.length<2) return;            // שורה בודדת — אין מה למיין או לסנן

      if(th.getAttribute("onclick")) return;          // לכותרת יש כבר מיון משלה
      if(!String(th.textContent||"").trim()) return;
      th.style.cursor="pointer";
      th.title="לחץ למיון";
      th.addEventListener("click",function(){ sortTableByCol(t,i); });
    });

    /* שורת סינון */
    var fr=head.insertRow(-1);
    fr.className="filter-row";
    for(var i=0;i<n;i++){
      var c=fr.insertCell(-1);
      var label=String(hr.cells[i]?hr.cells[i].textContent:"").replace(/[▲▼]/g,"").trim();
      if(!label){ c.innerHTML=""; continue; }
      c.innerHTML='<div style="display:flex;gap:2px;align-items:center">'+
        '<input class="col-f" data-col="'+i+'" placeholder="סנן…" style="padding:4px 6px;font-size:11.5px;border-radius:7px;min-width:44px;flex:1">'+
        '<button type="button" class="col-pick-btn" data-col="'+i+'" title="בחר ערכים (כמו אקסל)" style="padding:2px 5px;font-size:11px;line-height:1;border:1px solid var(--line,#d8dee9);border-radius:6px;background:#fff;cursor:pointer">▾</button>'+
        '</div>';
    }
    fr.querySelectorAll(".col-f").forEach(function(inp){
      /* כל תו הריץ סינון מלא על כל השורות — בטבלה גדולה זה מורגש
         כהקלדה תקועה. השהיה קצרה מאגדת את התווים לסינון אחד. */
      var ft=null;
      inp.addEventListener("input",function(){
        if(ft) clearTimeout(ft);
        ft=setTimeout(function(){ ft=null; applyColFilters(t); },250);
      });
      inp.addEventListener("click",function(e){ e.stopPropagation(); });
    });
    fr.querySelectorAll(".col-pick-btn").forEach(function(btn){
      btn.addEventListener("click",function(e){ e.stopPropagation(); e.preventDefault(); openColPicker(t,Number(btn.getAttribute("data-col")),btn); });
    });
    /* שחזור סינון קודם של אותה טבלה — טקסט + בחירות-מרובות (שרד עריכה/רינדור) */
    var saved=COLFILT[tableSig(t)];
    if(saved){
      var any=false;
      if(saved.t) fr.querySelectorAll(".col-f").forEach(function(inp){
        var v=saved.t[inp.getAttribute("data-col")];
        if(v){ inp.value=v; any=true; }
      });
      if(saved.p && Object.keys(saved.p).length) any=true;
      if(any) applyColFilters(t);
    }
  });
}
/* מצב הסינון לכל טבלה: t = טקסט חופשי לפי עמודה, p = בחירה-מרובה
   (סט ערכים) לפי עמודה — בדיוק כמו סינון עמודה באקסל. */
function colFilterState(t){ var sig=tableSig(t); if(!COLFILT[sig]) COLFILT[sig]={t:{},p:{}}; return COLFILT[sig]; }
function cellVal(cell){ return String(cell.innerText||cell.textContent||"").replace(/\s+/g," ").trim(); }
function applyColFilters(t){
  var fr=t.querySelector("thead tr.filter-row"); if(!fr) return;
  var st=colFilterState(t);
  st.t={};
  fr.querySelectorAll(".col-f").forEach(function(inp){
    var v=String(inp.value||"").trim();
    if(v) st.t[inp.getAttribute("data-col")]=v;
  });
  var texts=[]; Object.keys(st.t).forEach(function(col){ texts.push({col:Number(col),q:st.t[col]}); });
  var picks=[]; Object.keys(st.p||{}).forEach(function(col){ if(Object.keys(st.p[col]||{}).length) picks.push({col:Number(col),set:st.p[col]}); });
  var anyFilter=texts.length||picks.length;
  var sig=tableSig(t); if(!anyFilter) delete COLFILT[sig];
  /* מסמנים את כפתורי הבחירה שפעילים בהם סינון */
  fr.querySelectorAll(".col-pick-btn").forEach(function(btn){
    var on=st.p&&st.p[btn.getAttribute("data-col")]&&Object.keys(st.p[btn.getAttribute("data-col")]).length;
    btn.style.background=on?"var(--accent,#3b5bdb)":"#fff"; btn.style.color=on?"#fff":"";
    btn.style.borderColor=on?"var(--accent,#3b5bdb)":"var(--line,#d8dee9)";
  });
  var body=t.tBodies[0], shown=0;
  /* ---------- שלב קריאה ואז שלב כתיבה ----------
     קריאת innerText מחייבת את הדפדפן לחשב את פריסת העמוד. כשקוראים
     ומיד משנים display שורה-שורה, כל שורה גוררת חישוב פריסה מלא של
     כל הטבלה — על אלפי שורות אלו דקות של מסך תקוע. לכן קודם קוראים
     את כל הטקסטים ברצף (חישוב פריסה אחד), ורק אחר כך כותבים. */
  var rowsArr=Array.prototype.slice.call(body.rows);
  /* נקראות רק העמודות שמסוננות בפועל — לא כל הטבלה */
  var needCols={};
  texts.forEach(function(x){ needCols[x.col]=1; });
  picks.forEach(function(x){ needCols[x.col]=1; });
  var colList=Object.keys(needCols).map(Number);
  var rowTexts=rowsArr.map(function(tr){
    var arr={};
    for(var k2=0;k2<colList.length;k2++){
      var cell=tr.cells[colList[k2]];
      if(cell) arr[colList[k2]]=String(cell.innerText||cell.textContent||"");
    }
    return arr;
  });
  var visArr=rowTexts.map(function(ct){
    return texts.every(function(x){ return ct[x.col]!==undefined ? matches(x.q, ct[x.col]) : false; })
        && picks.every(function(x){ return ct[x.col]!==undefined ? !!x.set[ct[x.col].replace(/\s+/g," ").trim()] : false; });
  });
  rowsArr.forEach(function(tr,ri){
    var want=visArr[ri]?"":"none";

    if(visArr[ri]) shown++;
  });
  var f=anyFilter?[1]:[];   /* תאימות: הקוד למטה בודק f.length לסיכום */
  /* שורת סיכום חיה של המסונן: מסכמת עמודות מספריות.
     טבלה בלי שורת סה"כ (למשל התאמת בנק) מקבלת אחת זמנית בזמן
     הסינון — כך הסיכום עובד בכל טבלה, והוא נעלם כשהסינון מנוקה. */

  if(!tf && f.length){
    tf=t.createTFoot();

  }
  if(tf && tf.getAttribute("data-auto") && !f.length){ tf.remove(); tf=null; }
  if(tf&&(tf.rows.length||tf.getAttribute("data-auto"))){
    if(!tf.getAttribute("data-auto") && !tf.getAttribute("data-orig")) tf.setAttribute("data-orig",tf.innerHTML);
    if(!f.length){ tf.innerHTML=tf.getAttribute("data-orig"); }
    else{
      var n=t.tHead.rows[0].cells.length, sums=new Array(n).fill(null);
      /* שורת שלב-אב היא כבר הסיכום של תתי-השלבים שמתחתיה. אם שניהם
         גלויים, ספירת שניהם הייתה מכפילה את הסכום, את "שולם" ואת "נותר".
         הטקסטים נקראו כבר בשלב הקריאה — אין קריאת innerText נוספת. */
      var visIds={};
      rowsArr.forEach(function(tr,ri){
        if(visArr[ri] && tr.getAttribute("data-eid")) visIds[tr.getAttribute("data-eid")]=1;
      });
      rowsArr.forEach(function(tr,ri){
        if(!visArr[ri]) return;
        var par=tr.getAttribute("data-parent");
        if(par && visIds[par]) return;          // נספר כבר בשורת האב
        /* textContent — קריאה זולה שאינה מחייבת חישוב פריסה */
        var cells=tr.cells;
        for(var i=0;i<n;i++){
          var cell=cells[i]; if(!cell) continue;

      }
      tf.innerHTML='<tr>'+cells+'</tr>';

  }
}
/* ---------- בוחר ערכים מרובה (סינון עמודה כמו אקסל) ---------- */
var _openPicker=null;
function _pickerOutside(e){ if(_openPicker && !_openPicker.contains(e.target)) closeColPicker(); }
function closeColPicker(){ if(_openPicker){ _openPicker.remove(); _openPicker=null; document.removeEventListener("mousedown",_pickerOutside,true); } }
function openColPicker(t,col,btn){
  var reopen = _openPicker && _openPicker.getAttribute("data-col")===String(col);
  closeColPicker();
  if(reopen) return;   /* לחיצה שנייה על אותו כפתור — סוגרת */
  var st=colFilterState(t); st.p=st.p||{};
  var cur=st.p[col]||{};
  /* ---------- סינון מדורג (כמו באקסל) ----------
     הרשימה נבנתה מכל השורות, ולכן אחרי סינון לפי תאריך עדיין הוצעו
     קטגוריות שלא קיימות באותו תאריך — ובחירה בהן החזירה טבלה ריקה.
     כאן נכללות רק שורות שעוברות את שאר הסינונים.
     הסינון של העמודה הנוכחית עצמה לא נספר, אחרת לאחר בחירת ערך אחד
     לא היה אפשר להוסיף לו עוד ערך. */
  var otherTexts=[], otherPicks=[];

    var fr=t.querySelector("thead tr.filter-row");

      var c=Number(inp.getAttribute("data-col")), v=String(inp.value||"").trim();
      if(v && c!==col) otherTexts.push({col:c,q:v});
    });
    Object.keys(st.p||{}).forEach(function(c){
      if(Number(c)===col) return;

    });
  })();
  function passesOthers(tr){
    return otherTexts.every(function(x){ var cell=tr.cells[x.col]; return cell?matches(x.q,cell.innerText||cell.textContent||""):false; })

  }

    var cell=tr.cells[col]; if(!cell) return;
    var v=cellVal(cell);

  /* ערך שכבר נבחר אך יצא מהטווח בעקבות סינון אחר — נשאר ברשימה,

  function isNum(x){ return /\d/.test(x) && /^[₪\s\-]*[\d.,]+\s*%?$/.test(x); }
  list.sort(function(a,b){
    if(isNum(a)&&isNum(b)) return parseFloat(a.replace(/[^\d.\-]/g,""))-parseFloat(b.replace(/[^\d.\-]/g,""));

  });
  var panel=document.createElement("div");
  panel.setAttribute("data-col",String(col));
  panel.style.cssText="position:absolute;z-index:9999;background:#fff;border:1px solid var(--line,#d8dee9);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.20);padding:8px;max-height:340px;overflow:auto;min-width:190px;font-size:12.5px;direction:rtl";
  var rows=list.map(function(v){

      '<input type="checkbox" class="cp-cb" data-v="'+esc(v)+'" '+(cur[v]?"checked":"")+' style="width:auto"> '+
      '<span>'+(v===""?'<span class="muted">(ריק)</span>':esc(v))+'</span></label>';
  }).join("");
  panel.innerHTML='<div style="display:flex;gap:10px;margin-bottom:6px">'+
      '<a href="#" class="cp-all" style="text-decoration:none;font-weight:700;color:var(--accent,#3b5bdb)">✔ הכל</a>'+
      '<a href="#" class="cp-none" style="text-decoration:none;font-weight:700;color:var(--danger,#ef4444)">✖ נקה</a></div>'+
    ((otherTexts.length||otherPicks.length)
      ? '<div style="font-size:10.5px;opacity:.6;margin-bottom:5px;line-height:1.3">מוצגים רק ערכים שקיימים בשורות המסוננות'+

function sortTableByCol(t,col){
  var body=t.tBodies[0]; if(!body) return;
  var dir=(t.getAttribute("data-sort-col")==String(col) && t.getAttribute("data-sort-dir")==="asc")?"desc":"asc";
  t.setAttribute("data-sort-col",col); t.setAttribute("data-sort-dir",dir);
  function keyOf(tr){
    var cell=tr.cells[col]; if(!cell) return "";
    var txt=String(cell.innerText||"").trim();
    var numTxt=txt.replace(/[^\d.\-]/g,"");
    var d=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(txt);
    if(d) return {n:Number(d[3]+d[2]+d[1])};
    if(numTxt && /^[₪\s\-]*[\d,.]+\s*%?$/.test(txt)){ var v=parseFloat(numTxt); if(isFinite(v)) return {n:v}; }
    return {s:txt};
  }
  var rows=Array.prototype.slice.call(body.rows);
  rows.sort(function(a,b){
    var ka=keyOf(a), kb=keyOf(b), r;
    if(ka.n!=null&&kb.n!=null) r=ka.n-kb.n;
    else r=String(ka.s||ka.n||"").localeCompare(String(kb.s||kb.n||""),"he");
    return dir==="asc"?r:-r;
  });
  /* קיבוץ אב/בנים חייב לשרוד את המיון — אחרת שורות "↳" נוחתות מתחת
     לשלב שאין להן קשר אליו. ממיינים את שורות האב, וכל בן נצמד לאביו. */
  var kidsOf={}, tops=[];
  rows.forEach(function(tr){
    var par=tr.getAttribute("data-parent");
    if(par){ (kidsOf[par]=kidsOf[par]||[]).push(tr); } else tops.push(tr);
  });
  var seen={};
  tops.forEach(function(tr){
    body.appendChild(tr);
    var id=tr.getAttribute("data-eid");
    if(id&&kidsOf[id]){ kidsOf[id].forEach(function(k){ body.appendChild(k); seen[id]=1; }); }
  });
  /* בן שאביו מסונן החוצה — מוצג לבד, בסוף, כדי שלא ייעלם */
  Object.keys(kidsOf).forEach(function(pid){
    if(!seen[pid]) kidsOf[pid].forEach(function(k){ body.appendChild(k); });
  });
  /* חיווי כיוון על הכותרת */
  var hr=t.tHead.rows[0];
  Array.prototype.forEach.call(hr.cells,function(th,i){
    var mark=th.querySelector(".sort-mark");
    if(mark) mark.remove();
    if(i===col){
      var sp=document.createElement("span");
      sp.className="sort-mark"; sp.style.color="var(--brand)";
      sp.textContent=" "+(dir==="asc"?"▲":"▼");
      th.appendChild(sp);
    }
  });
}

/* ============================================================
   ייצוא לאקסל — קובץ xlsx אמיתי, בלי שום ספרייה חיצונית
   ------------------------------------------------------------
   xlsx הוא ZIP של קבצי XML. אנחנו בונים את ה-ZIP בשיטת "stored"
   (בלי דחיסה) — כך צריך רק CRC32, בלי תלות ב-CompressionStream,
   וזה עובד בכל דפדפן. אקסל וגוגל שיטס פותחים את זה כרגיל.
   ============================================================ */
var _crcT=null;
function crc32(b){
  if(!_crcT){ _crcT=new Uint32Array(256);
    for(var i=0;i<256;i++){ var c=i; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); _crcT[i]=c>>>0; } }
  var c=0xFFFFFFFF;
  for(var j=0;j<b.length;j++) c=_crcT[(c^b[j])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  function u16(v){ return [v&255,(v>>8)&255]; }
  function u32(v){ return [v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255]; }
  var parts=[], cd=[], off=0;
  files.forEach(function(f){
    var nm=new TextEncoder().encode(f.name), crc=crc32(f.data), len=f.data.length;
    var lh=[].concat([0x50,0x4B,0x03,0x04],u16(20),u16(0x0800),u16(0),u16(0),u16(0),
      u32(crc),u32(len),u32(len),u16(nm.length),u16(0));
    parts.push(new Uint8Array(lh),nm,f.data);
    cd.push({nm:nm,crc:crc,len:len,off:off});
    off+=lh.length+nm.length+len;
  });
  var cdStart=off, cdParts=[];
  cd.forEach(function(c){
    var h=[].concat([0x50,0x4B,0x01,0x02],u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),
      u32(c.crc),u32(c.len),u32(c.len),u16(c.nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));
    cdParts.push(new Uint8Array(h),c.nm);
    off+=h.length+c.nm.length;
  });
  var eocd=new Uint8Array([].concat([0x50,0x4B,0x05,0x06],u16(0),u16(0),
    u16(files.length),u16(files.length),u32(off-cdStart),u32(cdStart),u16(0)));
  return new Blob(parts.concat(cdParts,[eocd]),
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

function xlEsc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c];
  }).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");   // תווי בקרה פוסלים את הקובץ
}
function colLetter(i){ var s=""; i++; while(i>0){ var m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26; } return s; }

  return Math.round((Date.UTC(+p[1],+p[2]-1,+p[3])-Date.UTC(1899,11,30))/86400000);
}

function safeSheetName(s,used){

  var base=n, i=2; while(used[n]){ n=base.slice(0,26)+" "+(i++); }

/* sheets: [{name, rows:[[cell,…]], foot:[[cell,…]]}]
   cell: מחרוזת/מספר, או {v,t} כאשר t = s|n|money|pct|d  */
function xlsxBlob(sheets){
  var files=[], used={}, names=[];
  function put(nm,str){ files.push({name:nm,data:new TextEncoder().encode(str)}); }
  var XD='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';

  sheets.forEach(function(sh,si){
    var name=safeSheetName(sh.name,used); names.push(name);
    var body=(sh.rows||[]).filter(function(r){ return r && r.length; });
    var foot=(sh.foot||[]);
    var nCols=0;
    body.concat(foot).forEach(function(r){ if(r.length>nCols) nCols=r.length; });
    if(!nCols){ nCols=1; body=[["אין נתונים"]]; }

    var widths=new Array(nCols).fill(10);
    body.concat(foot).forEach(function(r){
      for(var i=0;i<nCols;i++){
        var c=r[i]; if(c==null) continue;
        var v=(typeof c==="object")?c.v:c;
        var L=String(v==null?"":v).length+3;
        if(L>widths[i]) widths[i]=Math.min(L,46);
      }
    });

    function cellXml(ref,c,foot){
      if(c==null||c==="") return '<c r="'+ref+'"'+(foot?' s="6"':'')+'/>';
      var t=(typeof c==="object")?(c.t||"s"):((typeof c==="number")?"n":"s");
      var v=(typeof c==="object")?c.v:c;
      if(v===""||v==null) return '<c r="'+ref+'"'+(foot?' s="6"':'')+'/>';

        return '<c r="'+ref+'" s="3"><v>'+d+'</v></c>'; }
      if(t==="n"||t==="money"||t==="pct"){
        var n=Number(v); if(!isFinite(n)) n=0;
        var s=foot?5:(t==="money"?2:(t==="pct"?4:0));
        return '<c r="'+ref+'" s="'+s+'"><v>'+n+'</v></c>';
      }
      return '<c r="'+ref+'" t="inlineStr"'+(foot?' s="6"':'')+'><is><t xml:space="preserve">'+xlEsc(v)+'</t></is></c>';
    }

    var xml=XD+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<sheetViews><sheetView rightToLeft="1"'+(si===0?' tabSelected="1"':'')+' workbookViewId="0">'+
      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'+
      '<sheetFormatPr defaultRowHeight="15"/><cols>';
    for(var i=0;i<nCols;i++) xml+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+widths[i]+'" customWidth="1"/>';
    xml+='</cols><sheetData>';
    var rn=0;
    body.forEach(function(r,ri){
      rn++;
      xml+='<row r="'+rn+'">';
      for(var i=0;i<nCols;i++){
        var c=r[i];
        if(ri===0){    // שורת כותרת
          var v=(c&&typeof c==="object")?c.v:c;
          xml+= (v==null||v==="") ? '<c r="'+colLetter(i)+rn+'" s="1"/>'
            : '<c r="'+colLetter(i)+rn+'" s="1" t="inlineStr"><is><t xml:space="preserve">'+xlEsc(v)+'</t></is></c>';
        } else xml+=cellXml(colLetter(i)+rn,c,false);
      }
      xml+='</row>';
    });
    foot.forEach(function(r){
      rn++;

    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+

    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  put("xl/workbook.xml",XD+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
    names.map(function(n,i){ return '<sheet name="'+xlEsc(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'; }).join("")+
    '</sheets></workbook>');
  put("xl/_rels/workbook.xml.rels",XD+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    names.map(function(_,i){ return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'; }).join("")+
    '<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  put("xl/styles.xml",XL_STYLES);

}
/* שער מרכזי להורדות: משתמש בהרשאת צפייה בלבד אינו מוריד קבצים.
   הכפתורים מוסתרים ממנו ממילא, אבל השער כאן חוסם גם קריאה ישירה. */

  if(!canDownload()){ toast("להורדת קבצים נדרשת הרשאת עריכה — פנה למנהל","err"); return; }
  var url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=filename; a.style.display="none";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },2000);
}
function stamp(){ var d=new Date(); function p(x){return ("0"+x).slice(-2);}
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function saveXlsx(sheets,filename){

    downloadBlob(xlsxBlob(sheets),String(filename).replace(/[\\\/:*?"<>|]/g,"-")+" "+stamp()+".xlsx");
    toast("הקובץ ירד — ניתן לפתוח באקסל","ok");
  }catch(err){ toast("הייצוא נכשל: "+err.message,"err"); }
