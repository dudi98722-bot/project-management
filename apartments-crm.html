function onPmAccount(){
  var sel=document.getElementById("pm-account"); if(!sel) return;
  var accId=sel.value; var acc=byId(DB.accounts,accId);
  var payer=document.getElementById("pm-payer");
  if(!payer) return;   // פרוייקט בלי שותפים — אין שדה משלם
  if(acc&&acc.isBank){ payer.value=""; payer.disabled=true; }
  else{ payer.disabled=false; if(acc&&acc.partnerId&&!payer.value) payer.value=acc.partnerId; }
}
function onPmRecipient(){
  var isMgr=val("pm-recipient")==="manager";
  document.getElementById("pm-mgr-wrap").style.display = isMgr?"block":"none";
  /* מבהירים שגם בתשלום דמי ניהול צריך לציין מי מהשותפים הוציא את הכסף —
     אחרת התשלום לא נזקף לזכותו בדוח היתרות. */
  var lbl=document.getElementById("pm-payer-lbl");
  if(lbl) lbl.textContent = isMgr?"מי מהשותפים שילם את דמי הניהול":"מי שילם (שותף)";
}
function savePayment(eId,payId){
  var e=byId(DB.expenses,eId);
  if(isContainer(eId)){ toast("שלב-אב אינו מקבל תשלומים — רשום בתת-השלב","err"); return false; }
  /* יעד השיוך: כברירת מחדל השלב הנוכחי; בעריכה אפשר להעביר לשלב אחר */
  var tgtId=eId, te=e;
  if(payId && document.getElementById("pm-moveto")){
    var mv=pickId("pm-moveto");
    if(mv===null){ toast("השלב לא זוהה — בחר מהרשימה","err"); return false; }
    if(mv && mv!==eId){
      var cand=byId(DB.expenses,mv);
      if(!cand||cand.deleted){ toast("השלב לא נמצא","err"); return false; }
      if(isContainer(mv)){ toast("שלב-אב אינו מקבל תשלומים — בחר תת-שלב","err"); return false; }
      tgtId=mv; te=cand;
    }
  }
  var amount=Number(val("pm-amount"))||0; if(amount<=0){ toast("סכום לא תקין","err"); return false; }
  var accountId=val("pm-account")||null;
  if(accountId==="__new"){ toast("סיים להוסיף את החשבון או בחר אחר","err"); return false; }
  var isBank=accountIsBank(accountId);
  /* כשאין דמי ניהול על השלב בורר המוטב לא מוצג — ברירת המחדל היא הספק */
  var recipientType=val("pm-recipient")||"supplier";
  var recipientManagerId=recipientType==="manager"?(val("pm-manager")||null):null;
  if(recipientType==="manager"&&!recipientManagerId){ toast("בחר מנהל","err"); return false; }
  var payer=isBank?null:(val("pm-payer")||null);
  /* משלם נדרש רק בפרוייקט שיש בה שותפים — בפרויקט אישי אין את מי לשייך */
  if(!isBank&&!payer&&apPartners(e.apartmentId).length){ toast("בחר מי שילם, או חשבון בנק","err"); return false; }
  // תקרות
  if(recipientType==="supplier"){
    var others=expPayments(tgtId).filter(function(x){return x.recipientType!=="manager"&&x.id!==payId;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);
    if(others+amount>Number(te.amount)+0.01){
      /* חריגה מהשלב מותרת — אבל רק באישור מפורש, שלא תקרה בטעות הקלדה */
      var over=round2(others+amount-Number(te.amount));
      if(!confirm("שים לב: סך התשלומים ("+money(others+amount)+") יחרוג מסכום השלב ("+money(te.amount)+") ב-"+money(over)+".\n\nהשלב יסומן \"שולם ביתר\". לאשר את התשלום?")) return false;
    }
  }else{
    if(tgtId!==eId && !te.mgmtEnabled){
      toast("בשלב היעד אין דמי ניהול — אי אפשר להעביר אליו תשלום למנהל","err"); return false;
    }
    var cap=mgrFeeLiveOnExpense(tgtId,recipientManagerId);
    /* האוטומטי ("שווה ערך") לא נספר כאן — הוא יצטמצם בסנכרון ויפנה מקום לידני */
    var othersM=expPayments(tgtId).filter(function(x){return x.recipientType==="manager"&&x.recipientManagerId===recipientManagerId&&x.id!==payId&&!x.auto;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);
    if(othersM+amount>cap+0.01){ toast("חורג ממה שמגיע למנהל ("+money(cap)+")","err"); return false; }
  }
  var obj={id:payId||uid(),expenseId:tgtId,date:val("pm-date")||todayISO(),amount:amount,accountId:accountId,
    payerPartnerId:payer,method:val("pm-method"),recipientType:recipientType,recipientManagerId:recipientManagerId,
    invoiceStatus:val("pm-invoice-st")||"",hasInvoice:(val("pm-invoice-st")==="has"),
    sentToCpa:(val("pm-cpa")==="1"),
    hidden:(CU&&CU.role==="admin"&&document.getElementById("pm-hidden"))?checked("pm-hidden"):(!!(payId&&byId(DB.payments,payId)&&byId(DB.payments,payId).hidden)),
    invoiceLink:val("pm-link"),note:val("pm-note"),deleted:false};
  if(payId){ Object.assign(byId(DB.payments,payId),obj); } else DB.payments.push(obj);
  syncAutoMgmtPayments(eId);   // ידני חדש מצמצם את האוטומטי בהתאם לתקרה
  if(tgtId!==eId) syncAutoMgmtPayments(tgtId);   // גם שלב היעד מסתנכרן
  save();
  toast(tgtId!==eId?('התשלום הועבר לשלב "'+te.description+'"'):"התשלום נשמר","ok");
  rerender(); openPayments(tgtId); return false;
}

/* ---------- דמי ניהול (ניהול + לי׳דג׳ר) ---------- */
function enableManagement(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var a=byId(DB.apartments,aptId); if(!a) return;
  a.hasManagement=true; save(); toast("דמי ניהול הופעלו בפרוייקט","ok"); rerender();
}
function disableManagement(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  if(!confirm("לכבות דמי ניהול בפרוייקט זה?\n\nהמנהלים והנתונים יישמרו, אבל דמי הניהול לא ייכללו בחישובים.")) return;
  var a=byId(DB.apartments,aptId); a.hasManagement=false; save(); toast("דמי ניהול כובו","ok"); rerender();
}
/* הוספת שני מנהלים בבת אחת — המקרה הנפוץ */
function addTwoManagers(aptId){
  openModal({title:"הוספת מנהלים",bodyHtml:
    '<p class="muted">אפשר להוסיף שניים בבת אחת. השאר ריק את מי שלא צריך.</p>'+
    '<div class="form-grid">'+
      '<div class="field"><label>מנהל 1 — שם</label><input id="m2-n1" placeholder="שם המנהל"></div>'+
      '<div class="field"><label>% ברירת מחדל</label><input id="m2-p1" type="number" step="0.01" value="4"></div>'+
      '<div class="field"><label>מנהל 2 — שם</label><input id="m2-n2" placeholder="שם המנהל"></div>'+
      '<div class="field"><label>% ברירת מחדל</label><input id="m2-p2" type="number" step="0.01" value="4"></div>'+
    '</div><div class="hint">האחוז הזה הוא ברירת המחדל בלבד — בכל הוצאה אפשר לשנות אותו, וגם לפצל לאחוז נוכחי + דחוי.</div>',
    saveLabel:"הוסף",onSave:function(){
      var n1=val("m2-n1").trim(), n2=val("m2-n2").trim(), c=0;
      if(n1){ DB.managers.push({id:uid(),apartmentId:aptId,name:n1,defaultFeePercent:Number(val("m2-p1"))||0,deleted:false}); c++; }
      if(n2){ DB.managers.push({id:uid(),apartmentId:aptId,name:n2,defaultFeePercent:Number(val("m2-p2"))||0,deleted:false}); c++; }
      if(!c){ toast("יש להזין לפחות שם אחד","err"); return false; }
      var a=byId(DB.apartments,aptId); if(a) a.hasManagement=true;
      save(); toast("נוספו "+c+" מנהלים","ok"); rerender();
    }});
}
/* העתקת המנהלים מפרוייקט אחר — כשאותם אנשים חוזרים בכמה פרויקטים */
function copyManagersFrom(aptId){
  var srcs=active(DB.apartments).filter(function(x){ return x.id!==aptId && apManagers(x.id).length; });
  if(!srcs.length){ toast("אין פרוייקט אחר עם מנהלים מוגדרים","warn"); return; }
  openModal({title:"העתקת מנהלים מפרוייקט אחר",bodyHtml:
    '<div class="field"><label>מאיזו פרוייקט להעתיק?</label><select id="cm-src">'+
      srcs.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+' — '+apManagers(x.id).length+' מנהלים</option>';}).join("")+
    '</select></div><div class="hint">מנהל שכבר קיים כאן באותו שם לא יועתק שוב.</div>',
    saveLabel:"העתק",onSave:function(){
      var src=val("cm-src"), n=0;
      apManagers(src).forEach(function(m){
        if(apManagers(aptId).some(function(x){return String(x.name).trim()===String(m.name).trim();})) return;
        DB.managers.push({id:uid(),apartmentId:aptId,name:m.name,defaultFeePercent:m.defaultFeePercent,deleted:false}); n++;
      });
      if(!n){ toast("כל המנהלים כבר קיימים כאן","warn"); return false; }
      var a=byId(DB.apartments,aptId); if(a) a.hasManagement=true;
      save(); toast("הועתקו "+n+" מנהלים","ok"); rerender();
    }});
}
function moduleManagers(aptId){
  var a=byId(DB.apartments,aptId);
  var mgrs=apManagers(aptId);
  if(!a.hasManagement){
    return '<div class="card" style="border:2px dashed var(--brand);text-align:center;padding:26px">'+
      '<div style="font-size:38px">💼</div>'+
      '<h3 style="margin:10px 0 6px">דמי ניהול אינם מופעלים בפרוייקט הזה</h3>'+
      '<p class="muted" style="max-width:520px;margin:0 auto 16px">הפעל כדי להגדיר מנהלים שמקבלים אחוז מההוצאות — כולל אחוז שונה לכל מנהל בכל הוצאה, אחוז נוכחי מול דחוי, ומע"מ.</p>'+
      (can("edit")?'<button class="btn btn-primary" onclick="enableManagement(\''+aptId+'\')">✅ הפעל דמי ניהול בפרוייקט זה</button>':'')+
      '</div>';
  }
  var h='<div class="toolbar"><h3 style="margin:0">מנהלים ודמי ניהול</h3><div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-primary btn-sm" onclick="addTwoManagers(\''+aptId+'\')">➕ הוסף מנהלים</button> '+
      '<button class="btn btn-sm" onclick="copyManagersFrom(\''+aptId+'\')">📋 העתק מפרוייקט אחר</button> '+
      '<button class="btn btn-ghost btn-sm" onclick="disableManagement(\''+aptId+'\')">כבה דמי ניהול</button>':'')+'</div>';
  if(!mgrs.length){
    h+='<div class="card" style="border:2px dashed #fecaca;text-align:center;padding:20px">'+
      '<div style="font-weight:800;color:var(--danger)">עדיין לא הוגדרו מנהלים</div>'+
      '<div class="muted" style="margin:8px 0">בלי מנהלים לא יופיעו שדות האחוזים בהוצאות. הוסף אותם עכשיו — בדרך כלל שניים.</div>'+
      (can("edit")?'<button class="btn btn-primary btn-sm" onclick="addTwoManagers(\''+aptId+'\')">➕ הוסף מנהלים</button>':'')+
      '</div>';
    return h;
  }
  var autoH="", balH="", mgrCards=[], pendH="";
  /* הגדרת תשלום אוטומטי "שווה ערך" */
  var am=a.autoMgmt||null;
  autoH='<div class="card" style="border-right:3px solid var(--brand)"><h3>⚡ תשלום אוטומטי — שווה ערך</h3>'+
    '<p class="muted" style="margin-top:0">אחוז מדמי הניהול של כל שלב נרשם אוטומטית כתשלום למנהלים ששולם ע"י שותף נבחר, באמצעי "שווה ערך". '+
    'לדוגמה: דמי ניהול 8,000 והגדרה של 3% → 240 ₪ נרשמים כמשולמים.</p>'+
    (am&&am.partnerId?'<div style="margin-bottom:10px"><span class="badge badge-ok">פעיל</span> '+
      esc(partnerName(am.partnerId))+' · '+num(am.pct)+'% מדמי הניהול</div>'
      :'<div style="margin-bottom:10px"><span class="badge badge-muted">כבוי</span></div>')+
    (can("edit")?'<div class="form-grid">'+
      '<div class="field"><label>השותף שנזקף לזכותו</label><select id="am-partner"><option value="">—</option>'+
        apPartners(aptId).map(function(ap){return '<option value="'+ap.partnerId+'"'+(am&&am.partnerId===ap.partnerId?" selected":"")+'>'+esc(partnerName(ap.partnerId))+'</option>';}).join("")+
      '</select></div>'+
      '<div class="field"><label>% מתוך דמי הניהול</label><input id="am-pct" type="number" step="0.01" value="'+(am?esc(String(am.pct)):"3")+'"></div>'+
    '</div>'+
    '<div class="toolbar"><button class="btn btn-primary btn-sm" onclick="saveAutoMgmt(\''+aptId+'\')">שמור והחל על כל השלבים</button>'+
      (am&&am.partnerId?'<button class="btn btn-danger btn-sm" onclick="disableAutoMgmt(\''+aptId+'\')">כבה והסר את האוטומטיים</button>':'')+
    '</div>':'')+
    '<div class="hint">האוטומטי מתעדכן לבד: שלב חדש, שינוי אחוזים, שחרור דחוי — הסכום מחושב מחדש. תשלום ידני למנהל מצמצם את האוטומטי כדי לא לחרוג מהזכאות.</div></div>';
  // ליֹדג׳ר
  balH='<div class="card"><h3>מאזן מנהלים</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>מנהל</th><th>% ברירת מחדל</th><th>מגיע (פעיל, כולל מע"מ)</th><th>קיבל</th><th>יתרה</th><th></th></tr></thead><tbody>';
  mgrs.forEach(function(m){
    var rec=managerReceivable(aptId,m.id), paid=managerPaid(aptId,m.id), bal=rec-paid;
    balH+='<tr><td>'+esc(m.name)+'</td><td>'+num(m.defaultFeePercent)+'%</td><td>'+money(rec)+'</td><td>'+money(paid)+'</td>'+
      '<td class="'+(bal>0?"neg":"pos")+'">'+money(bal)+'</td>'+
      '<td class="right">'+(can("edit")?'<button class="btn btn-ghost btn-sm" onclick="editManager(\''+m.id+'\',\''+aptId+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="delManager(\''+m.id+'\',\''+aptId+'\')">🗑️</button>':'')+'</td></tr>';
  });
  balH+='</tbody></table></div></div>';

  /* ---- תשלומים למנהלים: שלב-שלב, לכל מנהל בנפרד ---- */
  mgrs.forEach(function(m){
    var rows=apLeafExpenses(aptId).map(function(e){
      var due=mgrFeeLiveOnExpense(e.id,m.id);
      var paid=mgrPaidOnExpense(e.id,m.id);
      return {e:e,due:due,paid:paid,rem:round2(due-paid)};
    }).filter(function(r){ return r.due>0.01 || r.paid>0.01; })
      .sort(function(x,y){ return x.e.date<y.e.date?-1:1; });
    if(!rows.length) return;
    var tD=0,tP=0;
    var openCnt=rows.filter(function(r){return r.rem>0.01;}).length;
    var cardH='<div class="card"><div class="toolbar" style="margin-bottom:8px"><h3 style="margin:0">💳 תשלומים ל'+esc(m.name)+'</h3><div class="sp"></div>'+
      (can("edit")&&openCnt?'<button class="btn btn-primary btn-sm" onclick="openBulkPayMgr(\''+aptId+'\',\''+m.id+'\')">💳 תשלום מרוכז ('+openCnt+' פתוחים)</button>':'')+
      '</div>'+
      '<div class="table-wrap"><table class="tbl"><thead><tr>'+
      '<th>תאריך</th><th>שלב</th><th>מגיע (כולל מע"מ)</th><th>שולם</th><th>נותר</th><th>סטטוס</th><th></th>'+
      '</tr></thead><tbody>';
    rows.forEach(function(r){
      tD+=r.due; tP+=r.paid;
      var badge = r.rem<=0.01 ? '<span class="badge badge-ok">שולם</span>'
                : r.paid>0.01 ? '<span class="badge badge-warn">חלקי</span>'
                : '<span class="badge badge-danger">לא שולם</span>';
      cardH+='<tr><td>'+dateHe(r.e.date)+'</td><td><b>'+esc(r.e.description)+'</b></td>'+
        '<td>'+money(r.due)+'</td><td>'+money(r.paid)+'</td>'+
        '<td class="'+(r.rem>0.01?"neg":"pos")+'">'+money(r.rem)+'</td><td>'+badge+'</td>'+
        '<td class="right">'+(can("edit")&&r.rem>0.01
          ? '<button class="btn btn-primary btn-sm" onclick="payManager(\''+r.e.id+'\',\''+m.id+'\')">💳 שלם</button>'
          : '<button class="btn btn-ghost btn-sm" onclick="openPayments(\''+r.e.id+'\')">פירוט</button>')+'</td></tr>';
    });
    cardH+='</tbody><tfoot><tr><td colspan="2">סה"כ</td><td>'+money(tD)+'</td><td>'+money(tP)+'</td>'+
      '<td class="'+((tD-tP)>0.01?"neg":"pos")+'">'+money(tD-tP)+'</td><td colspan="2"></td></tr></tfoot></table></div></div>';
    mgrCards.push({id:m.id,name:m.name,open:openCnt,html:cardH});
  });

  // דחויים ממתינים לשחרור
  var pend=[];
  apLeafExpenses(aptId).forEach(function(e){ if(!e.mgmtEnabled) return;
    expMgrFees(e.id).forEach(function(f){ if((Number(f.pctDeferred)||0)>0 && !f.deferredReleased) pend.push({e:e,f:f}); });
  });
  if(pend.length){
    pendH='<div class="card"><h3>דחויים ממתינים לשחרור</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>הוצאה</th><th>מנהל</th><th>% דחוי</th><th>תווית</th><th>סכום דחוי (כולל מע"מ)</th><th></th></tr></thead><tbody>';
    pend.forEach(function(x){
      var full=mgrFeeFullOnExpense(x.e.id,x.f.managerId), live=mgrFeeLiveOnExpense(x.e.id,x.f.managerId);
      pendH+='<tr><td>'+esc(x.e.description)+'</td><td>'+esc(managerName(x.f.managerId))+'</td><td>'+num(x.f.pctDeferred)+'%</td><td>'+esc(x.f.deferredLabel||"")+'</td><td>'+money(full-live)+'</td>'+
        '<td class="right">'+(can("edit")?'<button class="btn btn-sm btn-primary" onclick="releaseDeferred(\''+x.f.id+'\')">שחרר לתשלום</button>':'')+'</td></tr>';
    });
    pendH+='</tbody></table></div></div>';
  }
  /* כל התצוגות של הלשונית — בוחרים אחת במקום לראות הכל יחד */
  var defs=[{key:"bal",label:"⚖️ מאזן מנהלים",render:function(){ return balH; }}];
  mgrCards.forEach(function(c){
    defs.push({key:"m_"+c.id,label:"💳 תשלומים ל"+esc(c.name)+(c.open?' <span class="pill">'+c.open+'</span>':''),
               render:function(){ return c.html; }});
  });
  defs.push({key:"pend",label:"⏳ דחויים ממתינים ("+pend.length+")",show:pend.length>0,render:function(){ return pendH; }});
  /* הגדרת התשלום האוטומטי היא הגדרה פנימית — היא חושפת איזה שותף
     נזקף ובאיזה אחוז, ואינה מיועדת למי שקיבל קישור לצפייה. */
  defs.push({key:"auto",label:"⚡ תשלום אוטומטי",show:can("edit"),render:function(){ return autoH; }});
  return h+reportPicker("mgrView",defs,{title:"בחר תצוגה"});
}
function editManager(id,aptId){
  var m=id?byId(DB.managers,id):{name:"",defaultFeePercent:4};
  openModal({title:id?"עריכת מנהל":"מנהל חדש",bodyHtml:
    '<div class="field"><label>שם</label><input id="mg-name" value="'+esc(m.name)+'"></div>'+
    '<div class="field"><label>% ברירת מחדל</label><input id="mg-pct" type="number" step="0.01" value="'+esc(String(m.defaultFeePercent))+'"></div>',
    onSave:function(){
      var name=val("mg-name").trim(); if(!name){ toast("שם חסר","err"); return false; }
      if(id){ m.name=name; m.defaultFeePercent=Number(val("mg-pct"))||0; }
      else DB.managers.push({id:uid(),apartmentId:aptId,name:name,defaultFeePercent:Number(val("mg-pct"))||0,deleted:false});
      save(); toast("נשמר","ok"); rerender();
    }});
}
function delManager(mId,aptId){
  var paid=managerPaid(aptId,mId);
  if(paid>0){ toast("לא ניתן למחוק מנהל שכבר קיבל תשלומים ("+money(paid)+"). מחק תחילה את התשלומים אליו.","err"); return; }
  confirmDelete("למחוק מנהל זה? דמי הניהול שלו יוסרו מכל ההוצאות.",function(){
    var m=byId(DB.managers,mId); if(!m) return;
    m.deleted=true;
    DB.expenseManagerFees.forEach(function(f){ if(f.managerId===mId) f.deleted=true; });
    save(); toast("הועבר לסל המחזור","ok"); rerender();
  });
}
/* פתיחת תשלום למנהל עם המנהל והסכום שנותר ממולאים מראש */
function payManager(eId,mId){
  openPaymentEditor(eId,null);
  var rec=document.getElementById("pm-recipient");
  if(!rec || !Array.prototype.some.call(rec.options,function(o){return o.value==="manager";})){
    toast("דמי ניהול אינם מופעלים על ההוצאה הזאת","err"); closeModal(); return;
  }
  rec.value="manager"; onPmRecipient();
  var sel=document.getElementById("pm-manager"); if(sel) sel.value=mId;
  var due=round2(mgrFeeLiveOnExpense(eId,mId)-mgrPaidOnExpense(eId,mId));
  var amt=document.getElementById("pm-amount"); if(amt && due>0) amt.value=due;
}
/* ---------- תשלום מרוכז למנהל: סוגרים הרבה שלבים בבת אחת ---------- */
function openBulkPayMgr(aptId,mgrId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var m=byId(DB.managers,mgrId); if(!m) return;
  var open=apLeafExpenses(aptId).map(function(e){
    return {e:e, rem:round2(mgrFeeLiveOnExpense(e.id,mgrId)-mgrPaidOnExpense(e.id,mgrId))};
  }).filter(function(r){ return r.rem>0.01; })
    .sort(function(x,y){ return x.e.date<y.e.date?-1:1; });
  if(!open.length){ toast("אין שלבים פתוחים למנהל זה","warn"); return; }
  var partners=apPartners(aptId);
  var accOpts='<option value="">— ידני / ללא חשבון —</option>'+
    availAccounts(aptId).map(function(ac){
      return '<option value="'+ac.id+'">'+esc(ac.name)+(ac.isBank?" 🏦 (בנק זמני)":"")+'</option>'; }).join("");
  var body='<p class="muted">הפרטים למטה יחולו על <b>כל השלבים המסומנים</b> — תשלום נפרד לכל שלב, בגובה ה"נותר" שלו.</p>'+
    '<div class="form-grid">'+
      '<div class="field"><label>תאריך</label><input id="bp-date" type="date" value="'+todayISO()+'"></div>'+
      '<div class="field"><label>מהחשבון</label><select id="bp-account" onchange="onBpAccount()">'+accOpts+'</select></div>'+
      (partners.length
        ? '<div class="field"><label>מי שילם (שותף)</label><select id="bp-payer"><option value="">—</option>'+
            partners.map(function(ap){return '<option value="'+ap.partnerId+'">'+esc(partnerName(ap.partnerId))+'</option>';}).join("")+'</select></div>'
        : '')+
      '<div class="field"><label>אמצעי תשלום</label><select id="bp-method" onchange="onMethodPick(\'bp-method\')">'+methodOptions("transfer")+'</select></div>'+
      '<div class="field full"><label>הערה (תיווסף לכל התשלומים)</label><input id="bp-note" value=""></div>'+
    '</div>'+
    '<div class="section-title">אילו שלבים לשלם</div>'+
    '<div class="toolbar"><button class="btn btn-sm" onclick="bulkPaySelAll(true)">✔️ סמן הכל</button>'+
      '<button class="btn btn-sm" onclick="bulkPaySelAll(false)">✕ נקה</button>'+
      '<div class="sp"></div><span id="bp-total" class="pill"></span></div>'+
    '<div class="table-wrap" style="max-height:300px;overflow:auto"><table class="tbl"><thead><tr>'+
      '<th></th><th>תאריך</th><th>שלב</th><th>נותר לתשלום</th></tr></thead><tbody>'+
      open.map(function(r){
        return '<tr><td><input type="checkbox" class="bp-x" value="'+r.e.id+'" data-rem="'+r.rem+'" checked onchange="bulkPayTotal()" style="width:auto"></td>'+
          '<td>'+dateHe(r.e.date)+'</td><td><b>'+esc(r.e.description)+'</b></td>'+
          '<td class="neg">'+money(r.rem)+'</td></tr>';
      }).join("")+
    '</tbody></table></div>';
  openModal({title:"💳 תשלום מרוכז ל"+m.name,wide:true,bodyHtml:body,
    saveLabel:"רשום את התשלומים",onSave:function(){ return applyBulkPayMgr(aptId,mgrId); }});
  bulkPayTotal();
}
function onBpAccount(){
  var payer=document.getElementById("bp-payer"); if(!payer) return;
  var isBank=accountIsBank(val("bp-account"));
  if(isBank){ payer.value=""; payer.disabled=true; } else payer.disabled=false;
}
function bulkPaySelAll(v){ document.querySelectorAll(".bp-x").forEach(function(c){c.checked=v;}); bulkPayTotal(); }
function bulkPayTotal(){
  var n=0,s=0;
  document.querySelectorAll(".bp-x:checked").forEach(function(c){ n++; s+=Number(c.getAttribute("data-rem"))||0; });
  var el=document.getElementById("bp-total");
  if(el) el.textContent="נבחרו "+n+" · סה\"כ "+money(round2(s));
}
function applyBulkPayMgr(aptId,mgrId){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var ids=Array.prototype.map.call(document.querySelectorAll(".bp-x:checked"),function(c){return c.value;});
  if(!ids.length){ toast("לא נבחר אף שלב","err"); return false; }
  var accountId=val("bp-account")||null;
  var isBank=accountIsBank(accountId);
  var payer=isBank?null:(val("bp-payer")||null);
  if(!isBank&&!payer&&apPartners(aptId).length){ toast("בחר מי שילם, או חשבון בנק","err"); return false; }
  var date=val("bp-date")||todayISO(), method=val("bp-method")||"transfer", note=val("bp-note")||"";
  var made=0, sum=0;
  ids.forEach(function(eid){
    /* מחשבים את הנותר מחדש ברגע הרישום — בטוח גם אם משהו השתנה בינתיים */
    var rem=round2(mgrFeeLiveOnExpense(eid,mgrId)-mgrPaidOnExpense(eid,mgrId));
    if(rem<=0.009) return;
    DB.payments.push({id:uid(),expenseId:eid,date:date,amount:rem,accountId:accountId,
      payerPartnerId:payer,method:method,recipientType:"manager",recipientManagerId:mgrId,
      hasInvoice:false,invoiceLink:"",note:note,deleted:false});
    syncAutoMgmtPayments(eid);
    made++; sum+=rem;
  });
  if(!made){ toast("לא נותר מה לשלם בשלבים שנבחרו","warn"); return false; }
  save();
  toast("נרשמו "+made+" תשלומים · "+money(round2(sum)),"ok");
  rerender();
}

function saveAutoMgmt(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var pid=val("am-partner"), pct=Number(val("am-pct"))||0;
  if(!pid){ toast("בחר שותף","err"); return; }
  if(pct<=0||pct>100){ toast("אחוז לא תקין","err"); return; }
  var a=byId(DB.apartments,aptId);
  a.autoMgmt={partnerId:pid,pct:pct};
  syncAutoMgmtApartment(aptId);
  save();
  var n=apExpenses(aptId).filter(function(e){return active(DB.payments).some(function(p){return p.expenseId===e.id&&p.auto;});}).length;
  toast("הופעל — נרשמו תשלומי שווה ערך על "+n+" שלבים","ok");
  rerender();
}
function disableAutoMgmt(aptId){

      '<option value="">לא מהבנק הזמני</option>'+
      banks.map(function(b){ return '<option value="'+b.id+'"'+(w.accountId===b.id?" selected":"")+'>🏦 '+esc(b.name)+'</option>'; }).join("")+
    '</select><div class="hint">משיכה מבנק זמני מקטינה את יתרת הבנק.</div></div>'+
    '<div class="field"><label>אמצעי תשלום</label><select id="wd-method" onchange="onMethodPick(\'wd-method\')">'+methodOptions(w.method||"transfer")+'</select></div>'+
    '<div class="field"><label>הערה</label><input id="wd-note" value="'+esc(w.note||"")+'"></div>',
    saveLabel:"שמירה",onSave:function(){
      var pid=val("wd-partner"); var amt=Number(val("wd-amount"))||0;
      if(!pid){ toast("בחר שותף","err"); return false; }

        !confirm("יתרת "+bankName(accId)+" היא "+money(bankBalance(aptId,accId))+" — המשיכה תוריד אותה מתחת לאפס.\n\nלרשום בכל זאת?")) return false;
      var mth=val("wd-method")||"transfer"; if(mth==="__new") mth=w.method||"transfer";

      else DB.withdrawals.push({id:uid(),apartmentId:aptId,partnerId:pid,amount:amt,

      save(); toast("משיכת הרווח נרשמה","ok"); rerender();

function onDepositPaste(){
  var txt=val("di-paste");
  if(!txt.trim()){ DIMP.grid=null; document.getElementById("di-map").innerHTML=""; return; }
  onDepositGrid(parseDelimited(txt, txt.indexOf("\t")>=0?"\t":","),"הדבקה");
}
function onDepositGrid(grid){
  grid=(grid||[]).filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); });
  if(!grid.length){ toast("לא נמצאו שורות","err"); return; }
  DIMP.grid=grid;
  var head=grid[0].map(function(c){ return String(c||"").trim(); });
  /* זיהוי אוטומטי לפי כותרות, עם נפילה לזיהוי לפי תוכן השורה הראשונה */
  function guess(hints){
    for(var i=0;i<head.length;i++){
      var h=normKey(head[i]);
      for(var k=0;k<hints.length;k++) if(h.indexOf(normKey(hints[k]))>=0) return i;
    }
    return -1;
  }
  var m={date:guess(["תאריך","date"]),amount:guess(["סכום","סך","amount","זכות","הפקדה"]),
         method:guess(["אמצעי","צורת","שיטת","method","סוג תשלום"]),
         from:guess(["מחשבון","חשבון","account"]),
         note:guess(["הער","פרט","תיאור","אסמכת","note"])};
  var hasHeader = (m.date>=0||m.amount>=0);
  if(!hasHeader){
    /* אין כותרות — מנחשים לפי התוכן: מה שנראה כתאריך ומה שנראה כמספר */
    var r0=grid[0];
    for(var i=0;i<r0.length;i++){
      var v=String(r0[i]||"").trim();
      if(m.date<0 && (/^\d{4}-\d{2}-\d{2}/.test(v)||/^\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}$/.test(v))) m.date=i;
      else if(m.amount<0 && impNum(v)>0) m.amount=i;
    }
  }
  DIMP.map=m; DIMP.hasHeader=hasHeader;
  renderDepositMap();
}

function depositImportRows(){
  if(!DIMP.grid) return [];
  var m=DIMP.map;
  var rows=DIMP.hasHeader?DIMP.grid.slice(1):DIMP.grid;
  var outRows=[];
  rows.forEach(function(r,ix){
    var amt=m.amount>=0?impNum(r[m.amount]):0;
    if(!(amt>0.001)) return;                       // שורה בלי סכום אינה הפקדה
    outRows.push({
      idx:ix+1,
      date:m.date>=0?impDate(r[m.date]):todayISO(),
      amount:round2(amt),
      method:m.method>=0?impMethod(r[m.method]):"transfer",
      from:m.from>=0?String(r[m.from]||"").trim():"",
      note:m.note>=0?String(r[m.note]||"").trim():""
    });
  });
  return outRows;
}
/* טקסט חופשי של אמצעי תשלום → המפתח במערכת; לא מזוהה = נשמר כאמצעי חדש */
function impMethod(v){
  var s=String(v==null?"":v).trim(); if(!s) return "transfer";
  refreshMethods();
  var k=Object.keys(METHODS).find(function(x){ return normKey(METHODS[x])===normKey(s); });
  if(k) return k;
  var alias={"העברה בנקאית":"transfer","העברה":"transfer","זיכוי":"transfer","הו״ק":"transfer",
             "הוראת קבע":"transfer","שיק":"check","צק":"check","צ׳ק":"check","המחאה":"check",
             "כרטיס אשראי":"credit","אשראי":"credit","מזומן":"cash","שווה ערך":"equiv"};
  var ak=Object.keys(alias).find(function(x){ return normKey(x)===normKey(s); });
  if(ak) return alias[ak];
  return "other";
}
function renderDepositPreview(){
  var box=document.getElementById("di-preview"); if(!box) return;
  var rows=depositImportRows();
  if(!rows.length){ box.innerHTML='<div class="empty">לא זוהו שורות עם סכום — בדוק את התאמת העמודות</div>'; return; }
  var sum=round2(rows.reduce(function(s,r){ return s+r.amount; },0));
  refreshMethods();
  box.innerHTML='<div class="section-title">תצוגה מקדימה — '+rows.length+' הפקדות, סה"כ '+money(sum)+'</div>'+
    '<div class="table-wrap" style="max-height:220px"><table class="tbl"><thead><tr>'+
    '<th>תאריך</th><th>סכום</th><th>אמצעי</th><th>מחשבון</th><th>הערה</th></tr></thead><tbody>'+
    rows.slice(0,12).map(function(r){
      return '<tr><td>'+dateHe(r.date)+'</td><td>'+money(r.amount)+'</td>'+
        '<td>'+esc(METHODS[r.method]||r.method)+'</td><td>'+esc(r.from||"")+'</td><td>'+esc(r.note)+'</td></tr>';
    }).join("")+
    '</tbody></table></div>'+
    (rows.length>12?'<div class="hint">מוצגות 12 הראשונות מתוך '+rows.length+'</div>':'');
}
function applyDepositImport(){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var aptId=DIMP.aptId, pid=val("di-payer");
  if(!pid){ toast("בחר את השותף המפקיד","err"); return false; }
  var rows=depositImportRows();
  if(!rows.length){ toast("אין שורות לייבוא","err"); return false; }
  /* אותו שותף + תאריך + סכום = כנראה ייבוא חוזר של אותו קובץ */
  var dup=rows.filter(function(r){
    return apDeposits(aptId).some(function(d){
      return d.partnerId===pid && d.date===r.date && Math.abs((Number(d.amount)||0)-r.amount)<0.01; });
  }).length;
  if(dup && !confirm(dup+" מתוך "+rows.length+" ההפקדות כבר קיימות (אותו שותף, תאריך וסכום).\n\nלהוסיף בכל זאת?")) return false;
  var sum=0, bnk=pickedBank("di-bank",aptId);
  rows.forEach(function(r){
    DB.deposits.push({id:uid(),apartmentId:aptId,partnerId:pid,amount:r.amount,
      date:r.date,method:r.method,accountId:bnk,fromAccount:r.from,note:r.note,deleted:false});

  });

}

function bdRows(){ return Array.prototype.slice.call(document.querySelectorAll(".bd-amt")); }
function bdSum(){
  var s=bdRows().reduce(function(t,i){ return t+(Number(i.value)||0); },0);
  var el=document.getElementById("bd-sum"); if(el) el.innerHTML="<b>"+money(round2(s))+"</b>";
}
function bdSplit(){
  var tot=Number(val("bd-total"))||0;
  if(tot<=0){ toast("הזן סכום כולל","warn"); return; }
  var rows=bdRows();
  var pctSum=rows.reduce(function(s,i){ return s+(Number(i.getAttribute("data-pct"))||0); },0);
  if(pctSum<=0){ toast("אין אחוזי ברירת מחדל בפרוייקט — השתמש בפיצול שווה","warn"); return; }
  /* מחלקים לפי אחוזים ומיישרים את השארית באחרון, כדי שהסכום יסתדר בדיוק */
  var acc=0;
  rows.forEach(function(i,ix){
    var v = (ix===rows.length-1)
      ? round2(tot-acc)
      : round2(tot*(Number(i.getAttribute("data-pct"))||0)/pctSum);
    acc=round2(acc+v); i.value=v;
  });
  bdSum();
}
function bdEqual(){
  var tot=Number(val("bd-total"))||0;
  if(tot<=0){ toast("הזן סכום כולל","warn"); return; }
  var rows=bdRows(), acc=0;
  rows.forEach(function(i,ix){
    var v=(ix===rows.length-1)?round2(tot-acc):round2(tot/rows.length);
    acc=round2(acc+v); i.value=v;
  });
  bdSum();
}
function bdClear(){ bdRows().forEach(function(i){ i.value=""; }); var t=document.getElementById("bd-total"); if(t) t.value=""; bdSum(); }
function saveBulkDeposit(aptId){

  }).filter(function(x){ return x.amount>0.001; });
  if(!picked.length){ toast("לא הוזן סכום לאף שותף","err"); return false; }
  var sum=round2(picked.reduce(function(s,x){ return s+x.amount; },0));
  /* אותו פרוייקט + אותו תאריך + אותו סכום = כנראה לחיצה כפולה */
  var dupN=picked.filter(function(x){

  if(dupN && !confirm(dupN+" מההפקדות כבר קיימות באותו תאריך ובאותו סכום.\n\nלהוסיף בכל זאת?")) return false;
  var bnk=pickedBank("bd-bank",aptId);
  picked.forEach(function(x){
    DB.deposits.push({id:uid(),apartmentId:aptId,partnerId:x.partnerId,
      amount:x.amount,date:date,method:mth,accountId:bnk,fromAccount:fromAcc,note:note,deleted:false});
  });
  save();
  toast("נרשמו "+picked.length+" הפקדות בסך "+money(sum),"ok");
  rerender();
  return true;
}

  });
  h+='</tbody></table></div>';
  /* סיכום לפי יחידה — כמה הושכר וכמה נכנס בכל אחת (בלי "לא לחישוב") */
  var allCalc=all.filter(function(i){ return !i.excluded; });

    });
    var noUnit=allCalc.filter(function(i){ return !incomeUnits(i).length; });
    if(noUnit.length){
      var amt0=noUnit.reduce(function(s,i){return s+(Number(i.amount)||0);},0);
      var pd0=noUnit.reduce(function(s,i){return s+(incomeTracked(i)?incomePaid(i):(Number(i.amount)||0));},0);

   ------------------------------------------------------------
   במקום לפתוח כל הזמנה בנפרד: טבלה שטוחה של כל התשלומים, עם סינון,
   סימון מרובה ועדכון מרוכז. התשלומים יושבים בתוך ההכנסות, ולכן כל
   שורה מחזיקה את ההזמנה שאליה היא שייכת.

var GPQ={q:"",method:"",cpa:"",unit:""};
function allIncomePays(aptId){
  var out=[];
  apIncome(aptId).forEach(function(i){
    incomePays(i).forEach(function(g){ out.push({i:i,g:g}); });
  });
  return out;
}
function findIncomePay(aptId,payId){
  var hit=null;
  apIncome(aptId).some(function(i){
    var g=incomePays(i).filter(function(x){ return x.id===payId; })[0];
    if(g){ hit={i:i,g:g}; return true; }
    return false;
  });
  return hit;
}
function filteredIncomePays(aptId){
  return allIncomePays(aptId).filter(function(r){
    if(!matches(GPQ.q, r.i.description+" "+(r.g.note||"")+" "+(r.g.invoices||""))) return false;
    if(GPQ.method && (r.g.method||"")!==GPQ.method) return false;
    if(GPQ.cpa==="sent" && !r.g.sentToCpa) return false;
    if(GPQ.cpa==="not" && r.g.sentToCpa) return false;
    if(GPQ.unit && incomeUnits(r.i).indexOf(GPQ.unit)<0) return false;
    return true;
  });
}

          return '<option value="'+esc(k)+'"'+(GPQ.method===k?" selected":"")+'>'+esc(METHODS[k])+'</option>'; }).join("")+
      '</select>'+

          return '<option value="'+o[0]+'"'+(GPQ.cpa===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+
      '</select>'+
      (units.length?'<select style="max-width:150px" onchange="GPQ.unit=this.value;renderGpTable('+JSON.stringify(aptId)+')">'+
        '<option value="">כל היחידות</option>'+
        units.map(function(n){ return '<option value="'+esc(n)+'"'+(GPQ.unit===n?" selected":"")+'>'+esc(n)+'</option>'; }).join("")+
      '</select>':'')+
      ((GPQ.q||GPQ.method||GPQ.cpa||GPQ.unit)?'<button class="btn btn-ghost btn-sm" onclick="GPQ={q:\'\',method:\'\',cpa:\'\',unit:\'\'};openAllIncomePays('+JSON.stringify(aptId)+')">✕ נקה</button>':'')+
      (can("edit")?'<button class="btn btn-primary btn-sm" onclick="openBulkIncPayEdit('+JSON.stringify(aptId)+')">✏️ עדכון מרוכז <span id="gb-count"></span></button>':'')+
      '<div class="sp"></div><span id="gp-count"></span>'+
    '</div>'+
    '<div id="gp-table">'+gpTableHtml(aptId)+'</div>'});

          '<option value="keep">— ללא שינוי —</option>'+
          '<option value="set">להחליף בהערה שאכתוב</option>'+
          '<option value="append">להוסיף בסוף ההערה הקיימת</option>'+

function onGbNoteMode(){
  var m=val("gb-note-mode"), inp=document.getElementById("gb-note");
  if(!inp) return;
  var on=(m==="set"||m==="append");
  inp.disabled=!on;
  if(!on) inp.value="";
  if(on) inp.focus();
}
function applyBulkIncPayEdit(aptId,ids){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var method=val("gb-method"), date=val("gb-date"), cpaSel=val("gb-cpa")||"__keep";
  var invTxt=val("gb-inv").trim(), dest=val("gb-dest")||"";
  var noteMode=val("gb-note-mode")||"keep", noteTxt=val("gb-note").trim();
  if(!method && !date && cpaSel==="__keep" && !invTxt && !dest && noteMode==="keep"){ toast("לא נבחר מה לעדכן","warn"); return false; }
  if((noteMode==="set"||noteMode==="append") && !noteTxt){
    toast("כתוב את ההערה שתיכנס, או בחר \"ללא שינוי\" בשדה ההערה","err"); return false; }
  var n=0;
  ids.forEach(function(id){
    var r=findIncomePay(aptId,id); if(!r) return;
    var g=r.g;
    if(method) g.method=method;
    if(date) g.date=date;
    if(cpaSel!=="__keep") g.sentToCpa=(cpaSel==="1");
    if(dest) g.receivedBy=(dest==="__none")?"":dest;
    if(invTxt) g.invoices=invTxt;
    if(noteMode==="set") g.note=noteTxt;
    else if(noteMode==="append"){ var old=String(g.note||"").trim(); g.note = old ? (old+" | "+noteTxt) : noteTxt; }
    else if(noteMode==="clear") g.note="";
    n++;
  });
  save(); toast("עודכנו "+n+" תשלומים","ok"); rerender();
  openAllIncomePays(aptId);
  return false;
}

function ibDestPreview(aptId){

  if(val("ib-dest")!=="__fromnote"){ box.innerHTML=""; return; }
  var ids=[]; document.querySelectorAll(".ib-x:checked").forEach(function(c){ ids.push(c.value); });
  if(!ids.length){ ids=(window._IB_IDS||[]); }

      (bad.length>6?" ועוד "+(bad.length-6):"")+'</span>':'')+
    '<br><span class="muted">ההערה עצמה נשארת. להסרתה — בחר בשדה ההערה "למחוק את ההערה".</span>';

function applyBulkIncomeEdit(aptId,ids){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var date=val("ib-date"), start=val("ib-start"), end=val("ib-end");
  var dest=document.getElementById("ib-dest")?val("ib-dest"):"";
  var uMode=document.getElementById("ib-unit-mode")?val("ib-unit-mode"):"keep";
  var noteMode=val("ib-note-mode")||"keep", noteTxt=val("ib-note").trim();
  var markPaid=checked("ib-paid");
  var exclSel=document.getElementById("ib-excl")?val("ib-excl"):"__keep";
  var repSel=document.getElementById("ib-inrep")?val("ib-inrep"):"__keep";
  var frlSel=document.getElementById("ib-frl")?val("ib-frl"):"__keep";
  if(!date && !start && !end && !dest && uMode==="keep" && noteMode==="keep" && !markPaid && exclSel==="__keep" && repSel==="__keep" && frlSel==="__keep"){ toast("לא נבחר מה לעדכן","warn"); return false; }
  if((noteMode==="set"||noteMode==="append") && !noteTxt){
    toast("כתוב את ההערה שתיכנס, או בחר \"ללא שינוי\" בשדה ההערה","err"); return false; }
  var picked=(uMode==="set"||uMode==="add")?readUnitChecks("ib-u"):[];
  if((uMode==="set"||uMode==="add") && !picked.length){ toast("סמן אילו יחידות, או בחר \"ללא שינוי\"","err"); return false; }
  var payMth=val("ib-paid-method")||"transfer"; if(payMth==="__new") payMth="transfer";
  var payDest=document.getElementById("ib-paid-dest")?val("ib-paid-dest"):"__same";
  var n=0, badRange=0, paidN=0, fromNoteOk=0, fromNoteBad=0;
  ids.forEach(function(id){
    var i=byId(DB.income,id); if(!i||i.deleted) return;
    if(date) i.date=date;
    if(start) i.startDate=start;
    if(end) i.endDate=end;
    /* טווח הפוך אחרי העדכון — משאירים את השורה כמו שהייתה */
    if(i.startDate && i.endDate && i.endDate<i.startDate){
      if(start) i.startDate=""; if(end) i.endDate=""; badRange++;
    }
    /* קובע את היעד על ההכנסה וגם על תשלומי ההזמנה שלה — בפרוייקט
       הזמנות הכסף נספר לפי התשלומים, ולכן שינוי ההזמנה בלבד לא היה
       משנה דבר בבנק ובדוחות. */
    function setDest(row,v){
      row.receivedBy=v;
      (row.payments||[]).forEach(function(g){ if(!g.deleted) g.receivedBy=v; });
    }
    if(dest==="__fromnote"){
      var t=String(i.note||"").trim();
      if(t){
        var d=destFromText(i.apartmentId,t);
        if(d){ setDest(i,d); fromNoteOk++; }
        else fromNoteBad++;
      } else fromNoteBad++;
    }
    else if(dest) setDest(i,(dest==="__none")?"":dest);
    if(repSel==="on") i.noReport=false; else if(repSel==="off") i.noReport=true;
    if(frlSel==="on") i.noFreilich=false; else if(frlSel==="off") i.noFreilich=true;
    if(uMode==="set") i.units=picked.slice();
    else if(uMode==="add"){
      var cur=incomeUnits(i).slice();
      picked.forEach(function(u){ if(cur.indexOf(u)<0) cur.push(u); });
      i.units=cur;
    }else if(uMode==="clear") i.units=null;
    if(exclSel==="excl") i.excluded=true;
    else if(exclSel==="incl") i.excluded=false;
    if(noteMode==="set") i.note=noteTxt;
    else if(noteMode==="append"){ var old=String(i.note||"").trim(); i.note = old ? (old+" | "+noteTxt) : noteTxt; }
    else if(noteMode==="clear") i.note="";
    /* סימון "שולם" — רק לשורות שאין עליהן תשלום, כדי לא לשלם פעמיים.
       יעד "כמו בהכנסה" שומר על שיוך הכסף לבנק/לשותף בדיוק כמו קודם. */
    if(markPaid && !incomePays(i).length && (Number(i.amount)||0)>0){
      markIncomePaid(i,{amount:i.amount,date:i.date,method:payMth,
        dest:(payDest==="__same")?(i.receivedBy||""):(payDest==="__none"?"":payDest),
        note:"סומן כשולם"});
      paidN++;
    }
    n++;
  });
  save();
  toast("עודכנו "+n+" שורות"+(paidN?" · "+paidN+" סומנו כשולמו":"")+
    (fromNoteOk?" · "+fromNoteOk+" יעדים זוהו מההערה":"")+
    (fromNoteBad?" · "+fromNoteBad+" לא זוהו ולא שונו":"")+
    (badRange?" · ב-"+badRange+" הטווח היה הפוך ולא שונה":""),
    (badRange||fromNoteBad)?"warn":"ok");
  rerender();
  return true;
}

/* ============================================================
   לוח תפוסה — חודש בכל פעם, שורה לכל יחידה, עמודה לכל יום
   ============================================================ */
var OCC={ym:""};
function ymOf(d){ return String(d||"").slice(0,7); }
function ymShift(ym,delta){
  var y=Number(ym.slice(0,4)), m=Number(ym.slice(5,7))-1+delta;
  var d=new Date(Date.UTC(y,m,1));
  return d.toISOString().slice(0,7);
}
var HE_MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
function ymLabel(ym){ return HE_MONTHS[Number(ym.slice(5,7))-1]+" "+ym.slice(0,4); }
function openOccupancy(aptId){
  if(!OCC.ym){
    /* נפתח על החודש שבו יש הזמנות — עדיף על חודש ריק */
    var dates=apIncome(aptId).map(stayStart).filter(Boolean).sort();
    var today=todayISO().slice(0,7);
    OCC.ym = dates.length ? (dates[dates.length-1]>=today ? today : ymOf(dates[dates.length-1])) : today;
  }
  openModal({title:"📅 לוח תפוסה",wide:true,bodyHtml:'<div id="occ-body">'+occupancyHtml(aptId)+'</div>'});
}
function occShift(aptId,delta){
  OCC.ym=ymShift(OCC.ym,delta);
  var el=document.getElementById("occ-body"); if(el) el.innerHTML=occupancyHtml(aptId);
}
function occToday(aptId){
  OCC.ym=todayISO().slice(0,7);
  var el=document.getElementById("occ-body"); if(el) el.innerHTML=occupancyHtml(aptId);
}
function occupancyHtml(aptId){
  var ym=OCC.ym, y=Number(ym.slice(0,4)), m=Number(ym.slice(5,7));
  var days=new Date(Date.UTC(y,m,0)).getUTCDate();
  var units=aptUnits(aptId);
  var rows=units.length?units:["הנכס"];
  var today=todayISO();
  /* map[unit][day] = רשימת ההזמנות שתופסות את הלילה הזה */
  var map={}; rows.forEach(function(u){ map[u]={}; });
  var monthBookings=[];
  apIncome(aptId).forEach(function(i){
    var nights=stayNightList(i); if(!nights.length) return;
    var inMonth=nights.filter(function(d){ return d.slice(0,7)===ym; });
    if(!inMonth.length) return;
    monthBookings.push(i);
    var us=incomeUnits(i);
    if(!us.length) us=units.length?[]:["הנכס"];   // בלי יחידות ובלי רשימה — שורת הנכס
    us.forEach(function(u){
      if(!map[u]) return;
      inMonth.forEach(function(d){
        var k=Number(d.slice(8,10));
        (map[u][k]=map[u][k]||[]).push(i);
      });
    });
  });
  var noUnit=monthBookings.filter(function(i){ return units.length && !incomeUnits(i).length; });

  var h='<div class="toolbar">'+
    '<button class="btn btn-sm" onclick="occShift(\''+aptId+'\',-1)">‹ חודש קודם</button>'+
    '<h3 style="margin:0 10px">'+esc(ymLabel(ym))+'</h3>'+
    '<button class="btn btn-sm" onclick="occShift(\''+aptId+'\',1)">חודש הבא ›</button>'+
    '<button class="btn btn-ghost btn-sm" onclick="occToday(\''+aptId+'\')">היום</button>'+
    '<div class="sp"></div></div>';

  /* סיכום תפוסה */
  var slots=rows.length*days, taken=0;
  rows.forEach(function(u){ for(var d=1;d<=days;d++){ if((map[u][d]||[]).length) taken++; } });
  h+='<div class="stat-grid" style="margin-bottom:12px">'+
    stat("לילות תפוסים",taken+" מתוך "+slots)+
    stat("אחוז תפוסה",(slots?Math.round(taken*1000/slots)/10:0)+"%")+
    stat("הזמנות בחודש",monthBookings.length)+'</div>';

  /* data-tools="1" — לוח הימים לא מקבל שורת סינון ומיון; אין להם משמעות כאן */
  h+='<div class="table-wrap"><table class="tbl" data-tools="1" style="font-size:11px"><thead><tr>'+
    '<th style="position:sticky;inset-inline-start:0;background:#fff;min-width:90px">יחידה</th>';
  for(var d=1;d<=days;d++){
    var iso=ym+"-"+(d<10?"0":"")+d;
    var dow=new Date(iso+"T00:00:00Z").getUTCDay();
    var isSat=(dow===6), isFri=(dow===5);
    h+='<th style="padding:3px;text-align:center;min-width:20px'+
      (iso===today?';background:#eef2ff;color:#4338ca':(isSat?';background:#f8fafc':''))+'"'+
      ' title="'+iso+'">'+d+(isFri||isSat?'<div style="font-size:9px;opacity:.6">'+(isSat?"ש":"ו")+'</div>':'')+'</th>';
  }
  h+='</tr></thead><tbody>';
  rows.forEach(function(u){
    h+='<tr><td style="position:sticky;inset-inline-start:0;background:#fff;font-weight:700;white-space:nowrap">'+esc(u)+'</td>';
    for(var d=1;d<=days;d++){
      var list=map[u][d]||[];
      var iso=ym+"-"+(d<10?"0":"")+d;
      if(!list.length){
        h+='<td style="padding:3px;text-align:center'+(iso===today?';background:#eef2ff':'')+'"></td>';
      }else{
        var names=list.map(function(i){ return i.description; }).join(" | ");
        var conflict=list.length>1;
        h+='<td title="'+esc(names+" · "+iso)+'" style="padding:3px;text-align:center;color:#fff;font-weight:700;'+
          'background:'+(conflict?"#ef4444":"#10b981")+'">'+(conflict?"!":"●")+'</td>';
      }
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>'+
    '<div class="hint" style="margin-top:6px">● לילה תפוס · <span style="color:#b91c1c">!</span> חפיפה — שתי הזמנות באותה יחידה באותו לילה. '+
    'יום היציאה נחשב פנוי. מעבר עם העכבר על תא מציג את שם ההזמנה.</div>';

  if(noUnit.length){
    h+='<div class="hint neg" style="margin-top:8px">'+noUnit.length+' הזמנות בחודש הזה בלי יחידה מסומנת, ולכן אינן מופיעות בלוח: '+
      esc(noUnit.slice(0,5).map(function(i){return i.description;}).join(" · "))+(noUnit.length>5?" ועוד…":"")+'</div>';
  }
  /* רשימת ההזמנות של החודש */
  if(monthBookings.length){
    h+='<div class="section-title" style="margin-top:14px">הזמנות החודש</div>'+
      '<div class="table-wrap"><table class="tbl"><thead><tr><th>אורח</th><th>יחידות</th><th>כניסה</th><th>יציאה</th><th>לילות</th><th>מחיר</th><th>יתרת חוב</th></tr></thead><tbody>';
    monthBookings.sort(function(x,y){ return stayStart(x)<stayStart(y)?-1:1; }).forEach(function(i){
      var debt=incomeDebt(i);
      h+='<tr><td><b>'+esc(i.description)+'</b></td><td>'+unitsCellHtml(i)+'</td>'+
        '<td>'+dateHe(stayStart(i))+'</td><td>'+(i.endDate?dateHe(i.endDate):'<span class="muted">—</span>')+'</td>'+
        '<td>'+stayNights(i)+'</td><td>'+money(i.amount)+'</td>'+
        '<td>'+(incomeTracked(i)?(Math.abs(debt)<=0.01?'<span class="badge badge-ok">✔ שולם</span>':money(debt)):'<span class="muted">—</span>')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  return h;
}

function delIncomePay(incId,payId,aptId,back){

/* ============================================================
   דוחות התאמת בנק
   ------------------------------------------------------------
   אותן שורות שעל המסך (הסינון הפעיל תקף גם כאן), מקובצות לפי מה
   שבוחרים. כל קבוצה: כמה שורות, כמה כסף נכנס, כמה כבר הותאם וכמה
   עוד לא מוסבר. כפתור האקסל הרגיל של הטבלאות עובד גם על הדוח.
   ============================================================ */
/* המימדים שאפשר לקבץ לפיהם — גם בשורות וגם בעמודות. כל צירוף חוקי,
   ולכן "לפי שנה לפי קטגוריה" הוא פשוט שורות=קטגוריה, עמודות=שנה. */
var BM_DIMS={style:"קטגוריה", subStyle:"תת קטגוריה", both:"קטגוריה + תת קטגוריה",
  bank:"בנק", apt:"פרוייקט", kind:"סוג",
  year:"שנה", month:"חודש", doc:"מסמך", status:"סטטוס"};
var BM_REPORTS=BM_DIMS;
/* המדד שמוצג בתוך תאי הפיצול */
var BM_MEASURES={sum:"סכום", n:"מספר שורות", matched:"הותאם", open:"לא מוסבר"};
var BM_MEASURE_MONEY={sum:1,matched:1,open:1};
/* מצב הפתיחה של "סיכום לפי בנק" — העדפת תצוגה, לא נתון: נשמר מקומית
   בדפדפן ולא נכנס למסד ולא מסונכרן. */
function bmSumOpen(){ try{ return localStorage.getItem(LSKEY+"_banksum")==="1"; }catch(e){ return false; } }
function bmToggleBankSum(){
  try{ localStorage.setItem(LSKEY+"_banksum", bmSumOpen()?"0":"1"); }catch(e){}
  rerender();
}
function bmToggleReport(){
  BQ.report = BQ.report ? "" : "style";
  rerender();
}
function bmSetReport(v){
  BQ.report=v||"style";
  /* אותו מימד בשורות ובעמודות אינו דוח — מאפסים את הפיצול, שלא יחזור
     מעצמו כשמחליפים שוב את מימד השורות. */
  if(BQ.repCol===BQ.report) BQ.repCol="";
  rerender();
}
function bmMonthKey(d){
  d=String(d||"");
  return /^\d{4}-\d{2}/.test(d) ? d.slice(0,7) : "";
}
/* המפתח שלפיו מקבצים. label = מה שמוצג, sort = לפי מה ממיינים */
function bmGroupOf(m,mode){
  var st=String(m.style||"").trim(), sub=String(m.subStyle||"").trim();
  if(mode==="style")    return {label:st||"ללא קטגוריה", sort:st};
  if(mode==="subStyle") return {label:sub||"ללא תת קטגוריה", sort:sub};
  if(mode==="both")     return {label:(st||"ללא קטגוריה")+" › "+(sub||"ללא תת קטגוריה"), sort:st+" "+sub};
  if(mode==="bank")     return {label:stmtBankName(m.stmtBankId||m.accountId)||bankName(m.stmtBankId||m.accountId)||"ללא בנק", sort:""};
  if(mode==="kind")     return {label:String(m.kind||"").trim()||"ללא סוג", sort:""};
  if(mode==="apt")      return {label:moveAptId(m)?apartmentName(moveAptId(m)):"לא שויך לפרוייקט", sort:""};
  if(mode==="doc")      return {label:(DOC_STATES[moveDocState(m)]||{}).t||"—", sort:""};
  if(mode==="status"){
    var st=moveStatus(m);
    return {label:st==="matched"?"מותאם":st==="partial"?"מותאם חלקית":st==="ignored"?"התעלמתי":"לא מותאם", sort:st};
  }
  if(mode==="year"){
    var yk=bmMonthKey(m.date).slice(0,4);
    return {label:yk||"ללא תאריך", sort:yk};
  }
  var mk=bmMonthKey(m.date);
  return {label:mk?(mk.slice(5,7)+"/"+mk.slice(0,4)):"ללא תאריך", sort:mk};
}
function bmSetReportCol(v){ BQ.repCol=(v===BQ.report)?"":v; rerender(); }
function bmSetReportVal(v){ BQ.repVal=BM_MEASURES[v]?v:"sum"; rerender(); }
/* ערך המדד לשורה בודדת — כדי שהצבירה תהיה במקום אחד */
function bmMeasure(m,val){
  if(val==="n") return 1;
  if(val==="matched") return moveAllocated(m);
  if(val==="open") return moveIsOpen(m)?moveRemaining(m):0;
  return Number(m.amount)||0;
}
function bmFmtMeasure(v,val){ return BM_MEASURE_MONEY[val] ? money(round2(v)) : num(v); }
/* מימד של זמן מסתדר לפי הזמן; שאר המימדים לפי הגודל */
function bmSortLabels(order,map,mode,asc){
  var timeDim=(mode==="month"||mode==="year"||mode==="status");
  return order.slice().sort(timeDim
    ? function(a,b){ var x=map[a].sort, y=map[b].sort; return asc?(x<y?-1:x>y?1:0):(x<y?1:x>y?-1:0); }
    : function(a,b){ return map[b].sum-map[a].sum; });
}
/* דוח מוצלב: שורות מול עמודות, מדד אחד בתוך התאים */
var SEP=String.fromCharCode(31);
function bankPivotHtml(list,mode,colMode){
  var val=BM_MEASURES[BQ.repVal]?BQ.repVal:"sum";
  var rowMap={}, rowOrder=[], colMap={}, colOrder=[], cell={}, grand=0;
  list.forEach(function(m){
    var r=bmGroupOf(m,mode), c=bmGroupOf(m,colMode);
    if(!rowMap[r.label]){ rowMap[r.label]={sort:r.sort,sum:0}; rowOrder.push(r.label); }
    if(!colMap[c.label]){ colMap[c.label]={sort:c.sort,sum:0}; colOrder.push(c.label); }
    var v=bmMeasure(m,val);
    rowMap[r.label].sum+=v; colMap[c.label].sum+=v; grand+=v;
    var k=r.label+SEP+c.label;
    cell[k]=(cell[k]||0)+v;
  });
  rowOrder=bmSortLabels(rowOrder,rowMap,mode,false);
  colOrder=bmSortLabels(colOrder,colMap,colMode,true);
  var h='<div class="table-wrap"><table class="tbl" id="bm-report-table"><thead><tr>'+
    '<th>'+esc(BM_DIMS[mode])+'</th>'+
    colOrder.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join("")+
    '<th>סה"כ</th></tr></thead><tbody>';
  rowOrder.forEach(function(r){
    h+='<tr><td><b>'+esc(r)+'</b></td>'+
      colOrder.map(function(c){
        var v=cell[r+SEP+c]||0;
        return '<td>'+(v?bmFmtMeasure(v,val):'<span class="muted">—</span>')+'</td>';
      }).join("")+
      '<td><b>'+bmFmtMeasure(rowMap[r].sum,val)+'</b></td></tr>';
  });
  h+='</tbody><tfoot><tr><td>סה"כ '+rowOrder.length+' שורות</td>'+
    colOrder.map(function(c){ return '<td>'+bmFmtMeasure(colMap[c].sum,val)+'</td>'; }).join("")+
    '<td>'+bmFmtMeasure(grand,val)+'</td></tr></tfoot></table></div>';
  return h;
}
function bankReportHtml(list){
  var mode=BM_REPORTS[BQ.report]?BQ.report:"style";
  var map={}, order=[];
  list.forEach(function(m){
    var g=bmGroupOf(m,mode);
    var row=map[g.label];
    if(!row){ row=map[g.label]={label:g.label,sort:g.sort,n:0,sum:0,matched:0,open:0}; order.push(g.label); }
    row.n++;
    row.sum=round2(row.sum+(Number(m.amount)||0));
    row.matched=round2(row.matched+moveAllocated(m));
    if(moveIsOpen(m)) row.open=round2(row.open+moveRemaining(m));
  });
  var tot={n:0,sum:0,matched:0,open:0};
  order.forEach(function(k){ var r=map[k];
    tot.n+=r.n; tot.sum=round2(tot.sum+r.sum); tot.matched=round2(tot.matched+r.matched); tot.open=round2(tot.open+r.open); });
  /* חודש מסתדר לפי הזמן; שאר הדוחות — הגדול ביותר למעלה */
  order.sort(mode==="month"
    ? function(a,b){ return map[a].sort<map[b].sort?1:-1; }
    : function(a,b){ return map[b].sum-map[a].sum; });

  var colMode=(BM_DIMS[BQ.repCol] && BQ.repCol!==mode) ? BQ.repCol : "";
  var val=BM_MEASURES[BQ.repVal]?BQ.repVal:"sum";
  function dimOpts(cur,skip){
    return Object.keys(BM_DIMS).map(function(k){
      if(k===skip) return "";
      return '<option value="'+k+'"'+(cur===k?" selected":"")+'>'+BM_DIMS[k]+'</option>'; }).join("");
  }
  var h='<div class="card"><div class="toolbar" style="margin-bottom:10px">'+

/* מילוי מדורג: מוסיף את יתרת השורות במנות של 200, בין פריימים.
   רינדור חדש מבטל מילוי ישן דרך ה-token — אחרת שני מילויים היו
   רצים במקביל ומכפילים שורות. */
var BM_FILL=null, BM_FILL_TOKEN=0;
function bmFillChunks(){
  var job=BM_FILL;
  if(!job || job.token!==BM_FILL_TOKEN) return;
  /* חייב לפגוע בטבלת התנועות בלבד: הבורר הכללי תפס את הטבלה הראשונה
     במסך — טבלת "סיכום לפי בנק" — והזריק לתוכה 1,400 שורות של תנועות
     עם 12 עמודות. התוצאה: שטח לבן ענק והסיכום נהרס. */
  var tbl=document.querySelector("#bm-moves-table tbody");
  if(!tbl){ BM_FILL=null; return; }
  var batch=job.rows.splice(0,200);
  if(!batch.length){ BM_FILL=null; return; }
  var h="";
  batch.forEach(function(m){ h+=bankMoveRowHtml(m,job.selBm); });
  tbl.insertAdjacentHTML("beforeend",h);
  /* סימונים שנלכדו לפני הרינדור — מוחלים גם על השורות שהגיעו במנה */
  if(window._BM_KEPT){
    batch.forEach(function(m){
      if(window._BM_KEPT[m.id]){
        var cb=tbl.querySelector('.bm-x[value="'+m.id+'"]');
        if(cb) cb.checked=true;
      }
    });
    bmCount();
  }
  /* setTimeout ולא requestAnimationFrame: כשהלשונית ברקע rAF מושהה,
     והמילוי היה נעצר באמצע עד שחוזרים אליה */
  if(job.rows.length) setTimeout(bmFillChunks,16);
  else{
    BM_FILL=null;
    /* סינון עמודות פעיל — מוחל גם על השורות החדשות */
    var t=tbl.closest("table");
    if(t && COLFILT[tableSig(t)]) try{ applyColFilters(t); }catch(e){}
  }
}
/* שורת בנק אחת. חולצה מהלולאה כדי שאפשר יהיה לרענן שורה בודדת

  var nm=m.name||m.description||"";
  var det=m.name?(m.details||m.description||""):(m.details||"");
  return '<tr>'+
    (selBm?'<td class="chk"><input type="checkbox" class="bm-x" value="'+m.id+'" style="width:auto" onchange="bmCount()"></td>':'')+
    '<td>'+dateHe(m.date)+'</td>'+

    '<td><b>'+money(m.amount)+'</b></td>'+

    '<td>'+esc(m.kind||"—")+'</td>'+
    '<td>'+esc(m.style||"—")+'</td>'+
    '<td>'+esc(m.subStyle||"—")+'</td>'+
    '<td title="'+esc(det)+'" style="max-width:180px;overflow:hidden;text-overflow:ellipsis" class="muted">'+esc(det||"—")+'</td>'+
    '<td>'+moveDocCell(m)+'</td>'+
    '<td>'+moveStatusHtml(m)+'</td>'+
    /* לאיזו הזמנה הותאם — ומתחת, לאיזה פרוייקט. בלי הפרוייקט אי אפשר
       היה לדעת לאן נזקף הכסף בלי להיכנס לשורה. */
    '<td class="muted" style="max-width:230px">'+
      (mm.length?mm.map(function(x){
        var i=incMapGet(x.incomeId);
        return '<div>'+esc(i?i.description:"—")+' ('+money(x.amount)+')'+
          (i&&i.apartmentId?'<div class="hint">'+esc(apartmentName(i.apartmentId))+'</div>':'')+'</div>';
      }).join(""):"—")+'</td>'+
    '<td class="right" style="white-space:nowrap">'+
      (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openMoveMatch(\''+m.id+'\')" title="התאמה">🔗</button>'+
      '<button class="btn btn-ghost btn-sm" onclick="editBankMove(\''+m.id+'\')" title="עריכת השורה">✏️</button>'+
      (m.ignored?'<button class="btn btn-ghost btn-sm" onclick="toggleMoveIgnore(\''+m.id+'\')" title="החזר לטיפול">↩️</button>'
                :'<button class="btn btn-ghost btn-sm" onclick="toggleMoveIgnore(\''+m.id+'\')" title="התעלם משורה זו">🚫</button>')+
      '<button class="btn btn-ghost btn-sm" onclick="delBankMove(\''+m.id+'\')">🗑️</button>':'')+'</td></tr>';
}
function apartmentName(id){ var a=byId(DB.apartments,id); return a?a.name:"—"; }
function toggleMoveIgnore(id){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var m=byId(DB.bankMoves,id); if(!m) return;
  if(!m.ignored && moveMatches(m).length){ toast("לשורה יש התאמות — בטל אותן קודם","err"); return; }
  m.ignored=!m.ignored; save();
  /* מרעננים רק את השורה: הסטטוס משתנה וגם ההדגשה שלה */
  var tr=bmRowEl(id);
  if(tr) refreshMoveRow(id); else rerender();
}
/* בונה מחדש שורת בנק אחת במקום את כל הטבלה */
function refreshMoveRow(id){
  var tr=bmRowEl(id); if(!tr) return false;
  var m=byId(DB.bankMoves,id); if(!m) return false;
  var wrap=document.createElement("tbody");
  wrap.innerHTML=bankMoveRowHtml(m);
  var fresh=wrap.rows[0]; if(!fresh) return false;
  var wasChecked=!!tr.querySelector(".bm-x:checked");
  tr.parentNode.replaceChild(fresh,tr);
  if(wasChecked){ var cb=fresh.querySelector(".bm-x"); if(cb) cb.checked=true; }
  bmCount();
  return true;
}
function delBankMove(id){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var m=byId(DB.bankMoves,id); if(!m) return;
  var n=moveMatches(m).length;
  confirmDelete("למחוק את שורת הבנק של "+money(m.amount)+"?"+(n?" יבוטלו גם "+n+" התאמות (התשלומים שנוצרו מהן יימחקו).":""),function(){
    moveMatches(m).forEach(function(x){ undoMoveMatch(m,x.id); });
    m.deleted=true; save(); toast("נמחק","ok"); rerender();
  });
}
function clearMatchedMoves(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var done=allBankMoves().filter(function(m){ return moveStatus(m)==="matched"; });
  if(!done.length){ toast("אין שורות מותאמות לניקוי","warn"); return; }
  confirmDelete("להסיר "+done.length+" שורות בנק שכבר הותאמו?\n\nהתשלומים שנוצרו מהן נשארים — רק שורות הבנק עצמן עוברות לסל המחזור.",function(){
    done.forEach(function(m){ m.deleted=true; });
    save(); toast("הוסרו "+done.length+" שורות","ok"); rerender();
  });
}
/* ---------- התאמה אוטומטית של כל מה שבטוח ---------- */
function runAutoMatch(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var open=allBankMoves().filter(moveIsOpen);
  var plan=[];
  open.forEach(function(m){
    /* שורה בלי פרוייקט נבדקת מול כל הפרוייקטים — הבנק משרת כמה */
    var pick=autoMatchPick(m,moveAptId(m)); if(!pick) return;
    plan.push({m:m,inc:pick.inc,amount:Math.min(moveRemaining(m),pick.debt),why:pick.why});
  });
  if(!plan.length){ toast("לא נמצאה אף התאמה ודאית — התאם ידנית","warn"); return; }
  openModal({title:"⚡ התאמה אוטומטית — "+plan.length+" שורות",wide:true,bodyHtml:
    '<div class="hint" style="margin-bottom:10px">רק שורות שבהן יש <b>מועמד יחיד בסכום זהה</b>. כל השאר נשארות להתאמה ידנית.</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr><th>תאריך</th><th>סכום</th><th>תיאור מהבנק</th><th>יותאם להזמנה</th><th>פרוייקט</th><th>למה</th></tr></thead><tbody>'+
    plan.map(function(p){
      return '<tr><td>'+dateHe(p.m.date)+'</td><td>'+money(p.amount)+'</td>'+
        '<td class="muted">'+esc(p.m.description||"—")+'</td>'+
        '<td><b>'+esc(p.inc.description)+'</b></td>'+
        '<td>'+esc(apartmentName(p.inc.apartmentId))+'</td>'+
        '<td class="muted">'+esc(p.why.join(" · "))+'</td></tr>';
    }).join("")+'</tbody></table></div>',
    saveLabel:"בצע "+plan.length+" התאמות",onSave:function(){
      plan.forEach(function(p){ applyMoveMatch(p.m,p.inc,p.amount); });
      save(); toast("הותאמו "+plan.length+" שורות","ok"); rerender();
    }});
}
/* ============================================================
   התאמה מרוכזת
   ------------------------------------------------------------
   ההתאמה האוטומטית מטפלת רק בשורות עם מועמד יחיד ובסכום זהה, וכל
   השאר נשארו להתאמה אחת-אחת. כאן: מסמנים שורות, ולכל אחת מוצג
   המועמד המוביל בשורה אחת עם אפשרות להחליף אותו או לדלג. שורה בלי
   מועמד כלל אינה מוצגת — אין מה לבחור בה.
   ============================================================ */
var BULKMATCH=[];
var BULKMATCH_MIN=60;   /* מתחת לזה — לא מסומן מראש */
var BULKMATCH_APT="";   /* "" = אוטומטי (לפי הפרוייקט של כל שורה / כולם) */
function openBulkMatch(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var ids=visibleBoxes(".bm-x:checked").map(function(c){ return c.value; });
  var explicit=ids.length>0;
  var rows=explicit
    ? ids.map(function(id){ return byId(DB.bankMoves,id); }).filter(Boolean)
    : allBankMoves().filter(moveIsOpen);
  rows=rows.filter(moveIsOpen);
  if(!rows.length){ toast(explicit?"כל השורות שסימנת כבר מותאמות":"אין שורות פתוחות להתאמה","warn"); return; }
  /* בלי סימון — תקרה. פתיחה על 1500 שורות פתוחות היא שתקעה את המסך;
     מי שרוצה קבוצה גדולה מסמן אותה, או עובד במנות. */
  var capped=0;
  if(!explicit && rows.length>300){
    rows=rows.slice().sort(function(x,y){ return x.date<y.date?1:-1; }).slice(0,300);
    capped=1;
  }
  BULKMATCH_APT="";
  bmPoolBuild();
  bulkMatchBuild(rows,explicit);
  bmPoolClear();
  if(capped) toast("מוצגות 300 השורות האחרונות — סמן שורות ספציפיות לקבוצה אחרת","warn");
  if(!BULKMATCH.length){ toast("לא נמצאו מועמדים לאף שורה שנבחרה","warn"); return; }
  var noCand=rows.length-BULKMATCH.length;
  var weakN=BULKMATCH.filter(function(r){ return r.weak; }).length;
  openModal({title:"🔗 התאמה מרוכזת — "+BULKMATCH.length+" שורות",wide:true,bodyHtml:
    '<div class="hint" style="margin-bottom:8px">לכל שורה מוצג המועמד המתאים ביותר. אפשר להחליף מועמד, לשנות סכום, '+
    'ליצור הכנסה חדשה, או להסיר את הסימון כדי לדלג. ההתאמה יוצרת תשלום על ההזמנה, בדיוק כמו התאמה ידנית.'+
    (weakN?' <b>'+weakN+' שורות מסומנות "חלשה" — בדוק את המועמד שלהן לפני הביצוע.</b>':'')+
    (noCand?' <b>'+noCand+' שורות שנבחרו לא הוצגו — לא נמצא להן אף מועמד.</b>':'')+'</div>'+
    bulkMatchAptBar()+
    '<div class="toolbar" style="margin-bottom:8px">'+'<button type="button" class="btn btn-sm" onclick="bulkMatchOneIncome()">\u2795 \u05d4\u05db\u05e0\u05e1\u05d4 \u05d0\u05d7\u05ea \u05dc\u05db\u05de\u05d4 \u05e9\u05d5\u05e8\u05d5\u05ea</button>'+'<span class="hint">\u05e1\u05de\u05df \u05e8\u05e7 \u05d0\u05ea \u05d4\u05e9\u05d5\u05e8\u05d5\u05ea \u05e9\u05e9\u05d9\u05d9\u05db\u05d5\u05ea \u05dc\u05d0\u05d5\u05ea\u05d4 \u05d4\u05db\u05e0\u05e1\u05d4, \u05d5\u05dc\u05d7\u05e5 \u05db\u05d0\u05df</span>'+'</div>'+
    '<div id="bulkmatch-body">'+bulkMatchTableHtml()+'</div>',
    saveLabel:"בצע התאמה",onSave:function(){ return applyBulkMatch(); }});
}
/* ---------- הכנסה אחת לכמה שורות בנק ----------
   שלושה תשלומים מאותו שוכר, או תשלום שפוצל — כולם צריכים להיסגר מול
   התחייבות אחת. עד כה אפשר היה ליצור הכנסה רק לשורה בודדת. כאן:

function bulkMatchOneIncome(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var sel=BULKMATCH.filter(function(r){ return !r.skip; });
  if(sel.length<2){
    toast(sel.length?'לשורה בודדת השתמש ב"➕ חדשה" שבשורה עצמה':"סמן לפחות שתי שורות","warn");

  var totRem=round2(sel.reduce(function(a,r){ return a+moveRemaining(r.m); },0));
  var apts=active(DB.apartments).filter(function(a){ return canSeeApartment(a.id); });

    var a=moveAptId(r.m)||(r.cands[r.pick]&&r.cands[r.pick].inc.apartmentId)||"";

      stat("שורות",sel.length)+stat("סכום כולל",money(totRem))+
    '</div>'+
    '<div class="table-wrap" style="max-height:180px;margin-bottom:10px"><table class="tbl" style="font-size:12px">'+
      '<thead><tr><th>תאריך</th><th>שורת הבנק</th><th>סכום</th></tr></thead><tbody>'+
      sel.map(function(r){
        return '<tr><td>'+dateHe(r.m.date)+'</td>'+
          '<td>'+esc((r.m.name||r.m.description||"—")).slice(0,45)+'</td>'+
          '<td><b>'+money(moveRemaining(r.m))+'</b></td></tr>'; }).join("")+

    '<div class="form-grid">'+
      '<div class="field"><label>פרוייקט</label><select id="mi-apt">'+
        apts.map(function(a){ return '<option value="'+a.id+'"'+(preApt===a.id?" selected":"")+'>'+esc(a.name)+'</option>'; }).join("")+
      '</select></div>'+
      '<div class="field"><label>תיאור / שם</label><input id="mi-desc" value="'+esc(preName)+'"></div>'+
      '<div class="field"><label>סכום ההכנסה (₪)</label><input id="mi-amount" type="number" step="0.01" value="'+totRem+'">'+
        '<div class="hint">סכום גדול מ-'+money(totRem)+' יישאר עם חוב פתוח</div></div>'+
      '<div class="field"><label>תאריך</label><input id="mi-date" type="date" value="'+esc(dates[0]||todayISO())+'"></div>'+
      '<div class="field full"><label>הערה</label><input id="mi-note" value="'+esc("נסגר מ-"+sel.length+" שורות בנק")+'"></div>'+
      incFlagsHtml("mi")+
    '</div>',
    saveLabel:"צור והתאם "+sel.length+" שורות",onSave:function(){
      var aptId=val("mi-apt"), desc=val("mi-desc").trim(), amt=Number(val("mi-amount"))||0;
      if(!aptId){ toast("בחר פרוייקט","err"); return false; }

      if(amt<totRem-0.01 && !confirm("סכום ההכנסה ("+money(amt)+") קטן מסך השורות ("+money(totRem)+").\n\n"+
        "יותאם רק עד "+money(amt)+", והשורות שיעברו את הסכום יישארו פתוחות. להמשיך?")) return false;
      var inc={id:uid(),apartmentId:aptId,description:desc,amount:amt,
        date:val("mi-date")||todayISO(),receivedBy:"",split:null,units:null,
        startDate:"",endDate:"",note:val("mi-note"),payments:[],deleted:false};
      incFlagsRead("mi",inc);
      DB.income.push(inc);
      /* מתאימים שורה-שורה, ומחשבים את החוב מחדש בכל פעם — אחרת
         היינו רושמים יותר ממה שההכנסה חייבת */
      var done=0, left=0;
      sel.forEach(function(r){
        var debt=incomeDebt(inc), rem=moveRemaining(r.m);
        var a=round2(Math.min(debt,rem));
        if(a<=0.01){ left++; return; }
        applyMoveMatch(r.m,inc,a);
        done++;
      });
      /* השורות שנסגרו יורדות מהרשימה */
      BULKMATCH=BULKMATCH.filter(function(r){ return moveIsOpen(r.m); });
      save();
      toast("נוצרה הכנסה והותאמו "+done+" שורות"+(left?" · "+left+" נשארו פתוחות (הסכום נגמר)":""),left?"warn":"ok");
      if(BULKMATCH.length) openBulkMatchReopen();
      else rerender();
      return true;
    }});
}
/* בונה את רשימת ההתאמות. explicit = המשתמש סימן שורות בעצמו:
   כולן מסומנות לביצוע — גם "חלשה" (עם תג אזהרה). בלי סימון מפורש,
   שורה חלשה אינה מסומנת מראש, כדי שסריקה גורפת לא תנחש. */
function bulkMatchBuild(rows,explicit){
  BULKMATCH=[];
  rows.forEach(function(m){
    var c=moveCandidates(m, BULKMATCH_APT||moveAptId(m));
    if(!c.length) return;
    var weak=c[0].score<BULKMATCH_MIN;
    BULKMATCH.push({m:m,cands:c.slice(0,8),pick:0,weak:weak,skip:(explicit?false:weak)});
  });
}
/* החלפת פרוייקט המועמדים — מחשב מחדש את כל הרשימה מול הפרוייקט שנבחר */
function bulkMatchSetApt(v){
  BULKMATCH_APT=v||"";
  var rows=BULKMATCH.map(function(r){ return r.m; });
  bmPoolBuild();
  bulkMatchBuild(rows,true);
  bmPoolClear();
  if(!BULKMATCH.length){ toast("אין מועמדים בפרוייקט הזה לשורות שנבחרו","warn"); }
  bulkMatchRefresh();
}

/* הסכום להתאמה: מה שהמשתמש הקליד, או ברירת המחדל (המינימום בין
   יתרת השורה לחוב ההזמנה). נשמר על השורה כדי לשרוד רענון של הטבלה. */
function bulkMatchAmt(r){
  var def=round2(Math.min(moveRemaining(r.m), r.cands[r.pick].debt));
  return (r.amt!=null && r.amt>0) ? round2(r.amt) : def;
}
function bulkMatchAmount(idx,v){
  var r=BULKMATCH[idx]; if(!r) return;
  var n=Number(v)||0;
  var max=round2(Math.min(moveRemaining(r.m), r.cands[r.pick].debt));
  if(n<=0){ r.amt=null; }
  else if(n>max+0.01){ toast("הסכום גבוה מהאפשרי ("+money(max)+") — הותאם למקסימום","warn"); r.amt=max; }
  else r.amt=n;
  bulkMatchRefresh();
}
/* יצירת הכנסה חדשה לשורה שאין לה התאמה מתאימה — בלי לצאת מהמסך
   המרוכז. אחרי היצירה השורה מוחלפת בהזמנה החדשה ומסומנת. */
function bulkMatchNewIncome(idx){

      ' · '+esc(moveBankLabel(m))+'</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>פרוייקט</label><select id="bn-apt">'+
        apts.map(function(a){ return '<option value="'+a.id+'"'+(preApt===a.id?" selected":"")+'>'+esc(a.name)+'</option>'; }).join("")+
      '</select></div>'+
      '<div class="field"><label>תיאור / שם</label><input id="bn-desc" value="'+esc(preName)+'"></div>'+
      '<div class="field"><label>סכום ההכנסה (₪)</label><input id="bn-amount" type="number" step="0.01" value="'+rem+'"></div>'+
      '<div class="field"><label>תאריך</label><input id="bn-date" type="date" value="'+esc(m.date||todayISO())+'"></div>'+
      '<div class="field full"><label>הערה</label><input id="bn-note" value="'+esc(moveNoteDefault(m))+'"></div>'+
      incFlagsHtml("bn")+
    '</div>',
    saveLabel:"צור והמשך",onSave:function(){
      var aptId=val("bn-apt"), desc=val("bn-desc").trim(), amt=Number(val("bn-amount"))||0;
      if(!aptId){ toast("בחר פרוייקט","err"); return false; }
      if(!desc){ toast("תיאור חסר","err"); return false; }
      if(amt<=0){ toast("סכום לא תקין","err"); return false; }

        date:val("bn-date")||m.date||todayISO(),receivedBy:"",split:null,units:null,
        startDate:"",endDate:"",note:val("bn-note"),payments:[],deleted:false};

      save();
      /* ההזמנה החדשה נכנסת לראש רשימת המועמדים של השורה ונבחרת */
      r.cands.unshift({inc:inc,debt:amt,score:999,why:["נוצרה עכשיו"],days:0});
      r.pick=0; r.skip=false; r.amt=round2(Math.min(rem,amt));
      toast('נוצרה ההכנסה "'+desc+'" — לחץ "בצע התאמה" לסיום',"ok");
      /* חוזרים למסך המרוכז */
      openBulkMatchReopen();
      return true;
    }});
}
/* פותח מחדש את מסך ההתאמה המרוכזת עם המצב הקיים בזיכרון */
function openBulkMatchReopen(){
  var weakN=BULKMATCH.filter(function(r){ return r.weak; }).length;

    bulkMatchAptBar()+
    '<div class="toolbar" style="margin-bottom:8px">'+'<button type="button" class="btn btn-sm" onclick="bulkMatchOneIncome()">\u2795 \u05d4\u05db\u05e0\u05e1\u05d4 \u05d0\u05d7\u05ea \u05dc\u05db\u05de\u05d4 \u05e9\u05d5\u05e8\u05d5\u05ea</button>'+'<span class="hint">\u05e1\u05de\u05df \u05e8\u05e7 \u05d0\u05ea \u05d4\u05e9\u05d5\u05e8\u05d5\u05ea \u05e9\u05e9\u05d9\u05d9\u05db\u05d5\u05ea \u05dc\u05d0\u05d5\u05ea\u05d4 \u05d4\u05db\u05e0\u05e1\u05d4, \u05d5\u05dc\u05d7\u05e5 \u05db\u05d0\u05df</span>'+'</div>'+
    '<div id="bulkmatch-body">'+bulkMatchTableHtml()+'</div>',

function bulkMatchRefresh(){
  var box=document.getElementById("bulkmatch-body");
  if(box) box.innerHTML=bulkMatchTableHtml();
}
function applyBulkMatch(){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var todo=BULKMATCH.filter(function(r){ return !r.skip; });
  if(!todo.length){ toast("לא נבחרה אף שורה","warn"); return false; }
  /* הזמנה אחת יכולה להופיע כמועמדת בכמה שורות. החוב מתעדכן תוך כדי,
     ולכן מחשבים מחדש לפני כל התאמה — אחרת היינו רושמים תשלום כפול
     על אותה הזמנה. */
  var done=0, skipped=0;
  todo.forEach(function(r){
    var inc=r.cands[r.pick].inc;
    var debtNow=incomeDebt(inc), remNow=moveRemaining(r.m);
    var wanted=bulkMatchAmt(r);
    var amt=round2(Math.min(remNow, debtNow, wanted));
    if(amt<=0.01){ skipped++; return; }
    applyMoveMatch(r.m, inc, amt);
    done++;
  });
  save();
  toast("בוצעו "+done+" התאמות"+(skipped?" · "+skipped+" דולגו (החוב כבר נסגר)":""),skipped?"warn":"ok");
  rerender();
  return true;
}

/* ההערה של הכנסה שנוצרת משורת בנק. קודם נלקחו רק הפרטים והסוג של
   השורה — וכששניהם היו ריקים ההכנסה נולדה בלי הערה בכלל, בעוד
   שהכנסות מהמסלול המרוכז תמיד קיבלו "נסגר מ-N שורות בנק". עכשיו
   תמיד נרשם מאיפה ההכנסה באה, והפרטים מתווספים כשיש. */
function moveNoteDefault(m){
  var extra=[m.details,m.kind].filter(Boolean).join(" · ");
  return "נוצר משורת בנק "+dateHe(m.date)+
    (moveBankLabel(m)?" · "+moveBankLabel(m):"")+
    (extra?" · "+extra:"");
}
/* יצירת הכנסה חדשה משורת בנק — כשאין לה הזמנה קיימת להתאים אליה.
   נוצרת ההכנסה, ומיד גם התשלום שמקושר לשורה. */
function createIncomeFromMove(moveId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var m=byId(DB.bankMoves,moveId); if(!m) return;
  var rem=moveRemaining(m);
  if(rem<=0.01){ toast("השורה כבר מותאמת במלואה","warn"); return; }
  var apts=active(DB.apartments).filter(function(a){ return canSeeApartment(a.id); });
  if(!apts.length){ toast("אין פרוייקטים במערכת","err"); return; }
  var preApt=val("mv-apt")||moveAptId(m)||"";
  var preName=m.name||m.description||m.details||"";
  openModal({title:"➕ הכנסה חדשה משורת בנק — "+money(rem),wide:true,bodyHtml:
    '<div class="hint" style="margin-bottom:10px">מהבנק: <b>'+esc(preName||"—")+'</b> · '+dateHe(m.date)+
      ' · '+esc(moveBankLabel(m))+'</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>פרוייקט</label><select id="ni-apt"><option value="">— בחר —</option>'+
        apts.map(function(a){ return '<option value="'+a.id+'"'+(preApt===a.id?" selected":"")+'>'+esc(a.name)+'</option>'; }).join("")+
      '</select></div>'+
      '<div class="field"><label>תיאור / שם</label><input id="ni-desc" value="'+esc(preName)+'"></div>'+
      '<div class="field"><label>סכום ההכנסה (₪)</label><input id="ni-amount" type="number" step="0.01" value="'+rem+'">'+
        '<div class="hint">סכום גדול מ-'+money(rem)+' יישאר עם חוב פתוח</div></div>'+
      '<div class="field"><label>תאריך</label><input id="ni-date" type="date" value="'+esc(m.date||todayISO())+'"></div>'+
      '<div class="field full"><label>הערה</label><input id="ni-note" value="'+esc(moveNoteDefault(m))+'"></div>'+
      incFlagsHtml("ni")+
    '</div>',
    saveLabel:"צור הכנסה ורשום תשלום",onSave:function(){
      var aptId=val("ni-apt"), desc=val("ni-desc").trim();
      var amt=Number(val("ni-amount"))||0;
      if(!aptId){ toast("בחר פרוייקט","err"); return false; }
      if(!desc){ toast("תיאור חסר","err"); return false; }
      if(amt<=0){ toast("סכום לא תקין","err"); return false; }
      if(amt<rem-0.01 && !confirm("סכום ההכנסה ("+money(amt)+") קטן מהסכום שנותר בשורת הבנק ("+money(rem)+").\n\nיותאם רק "+money(amt)+" והשאר יישאר פתוח. להמשיך?")) return false;
      var inc={id:uid(),apartmentId:aptId,description:desc,amount:amt,
        date:val("ni-date")||m.date||todayISO(),receivedBy:"",split:null,units:null,
        startDate:"",endDate:"",note:val("ni-note"),payments:[],deleted:false};
      incFlagsRead("ni",inc);
      DB.income.push(inc);
      applyMoveMatch(m,inc,Math.min(rem,amt));
      save(); toast("נוצרה הכנסה ונרשם התשלום","ok"); rerender();
      openMoveMatch(moveId); return false;
    }});
}
function doMoveMatch(moveId,incId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var m=byId(DB.bankMoves,moveId), inc=byId(DB.income,incId);
  if(!m||!inc) return;
  var inp=document.querySelector('.mv-amt[data-i="'+incId+'"]');
  var amt=round2(Number(inp?inp.value:0)||0);
  if(amt<=0){ toast("סכום לא תקין","err"); return; }
  if(amt>moveRemaining(m)+0.01){ toast("הסכום גדול ממה שנותר בשורת הבנק ("+money(moveRemaining(m))+")","err"); return; }
  /* נכנס יותר ממה שנרשם בהזמנה — המצב השכיח: ההזמנה הייתה 15,000
     ובפועל התקבלו 17,000. במקום לחסום, מציעים להגדיל את ההזמנה כדי
     שהיא תיסגר במלואה; מי שרוצה תשלום ביתר עדיין יכול. */
  var debt=incomeDebt(inc);
  if(amt>debt+0.01){
    var grow=round2((Number(inc.amount)||0)+(amt-debt));
    var ans=confirm("הסכום ("+money(amt)+") גדול מהחוב של ההזמנה ("+money(debt)+").\n\n"+
      "אישור = להגדיל את סכום ההזמנה מ-"+money(inc.amount)+" ל-"+money(grow)+" ולסגור אותה במלואה.\n"+
      "ביטול = להשאיר את ההזמנה כפי שהיא (ייווצר תשלום ביתר).");
    if(ans){
      inc.amount=grow;
      toast("סכום ההזמנה עודכן ל-"+money(grow),"ok");
    }
  }
  applyMoveMatch(m,inc,amt);
  save(); toast("הותאם · נרשם תשלום של "+money(amt),"ok");
  renderMoveCandidates(moveId);
}
/* עדכון סכום ההזמנה בלי לצאת ממסך ההתאמה */
function editIncomeAmountFromMatch(moveId,incId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var inc=byId(DB.income,incId); if(!inc) return;
  var paid=incomePaid(inc);
  var v=prompt('סכום ההזמנה "'+inc.description+'":', String(Number(inc.amount)||0));
  if(v===null) return;
  var n=round2(Number(String(v).replace(/[₪,\s]/g,""))||0);
  if(n<=0){ toast("סכום לא תקין","err"); return; }
  if(n<paid-0.01 && !confirm("כבר נרשמו על ההזמנה תשלומים בסך "+money(paid)+".\n\n"+
    "הקטנה ל-"+money(n)+" תיצור תשלום ביתר. להמשיך?")) return;
  inc.amount=n;
  save(); toast("סכום ההזמנה עודכן ל-"+money(n),"ok");
  renderMoveCandidates(moveId);
}
function undoMatchFromUi(moveId,matchId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var m=byId(DB.bankMoves,moveId); if(!m) return;
  undoMoveMatch(m,matchId);
  save(); toast("ההתאמה בוטלה והתשלום הוסר","ok");
  renderMoveCandidates(moveId);
}
/* ---------- עדכון מרוכז לשורות בנק ---------- */
function bmAll(v){ visibleBoxes(".bm-x").forEach(function(c){ c.checked=v; }); bmCount(); }
/* ---------- פס סיכום צף לשורות מסומנות ----------
   מסמנים שורות בכל טבלה — ובפינה מופיע כמה סומנו ומה הסכום שלהן,
   כמו שורת הסטטוס באקסל. נעלם כשאין סימונים. */
var SEL_SUM_SRC={ "bm-x":"bankMoves", "ib-x":"income", "eb-x":"expenses", "pb-x":"payments" };
function updateSelSumBar(){
  var total=0, n=0;
  Object.keys(SEL_SUM_SRC).forEach(function(cls){
    var boxes=(cls==="eb-x"&&typeof ebVisibleBoxes==="function")
      ? ebVisibleBoxes("."+cls+":checked") : visibleBoxes("."+cls+":checked");
    if(!boxes.length) return;
    /* חיפוש כל סימון בנפרד ברשימה היה ריבועי — "סמן הכל" על אלפי
       שורות נתקע. מפה אחת של מזהה→סכום, וכל סימון נמצא מיד. */
    var amts={};
    (DB[SEL_SUM_SRC[cls]]||[]).forEach(function(x){ amts[x.id]=Number(x.amount)||0; });
    boxes.forEach(function(c){ n++; total+=amts[c.value]||0; });
  });
  var bar=document.getElementById("sel-sumbar");
  if(!n){ if(bar) bar.remove(); return; }
  if(!bar){
    bar=document.createElement("div");
    bar.id="sel-sumbar";
    bar.style.cssText="position:fixed;bottom:14px;inset-inline-start:14px;z-index:60;"+
      "background:#1e293b;color:#fff;padding:8px 14px;border-radius:10px;"+
      "box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:13px;direction:rtl;pointer-events:none";
    document.body.appendChild(bar);
  }
  bar.innerHTML='סומנו <b>'+n+'</b> · סה"כ <b>'+money(round2(total))+'</b>';
}
function bmCount(){
  var n=visibleBoxes(".bm-x:checked").length;
  var el=document.getElementById("bm-count");
  if(el) el.textContent=n?("("+n+")"):"";
  updateSelSumBar();
}

        '<option value="__keep">— ללא שינוי —</option>'+
        DOC_ORDER.map(function(k){ return '<option value="'+k+'">'+DOC_STATES[k].t+'</option>'; }).join("")+

        '<option value="__keep">— ללא שינוי —</option>'+
        '<option value="1">🚫 סמן "התעלם"</option><option value="0">↩️ החזר לטיפול</option></select></div>'+

          '<option value="set">להחליף בטקסט שאכתוב</option>'+
          '<option value="append">להוסיף בסוף</option>'+
