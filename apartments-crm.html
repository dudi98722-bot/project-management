function exportSheetXls(id){
  if(!canDownload()){ toast("להורדת קבצים נדרשת הרשאת עריכה — פנה למנהל","err"); return; }
  var s=byId(DB.sheets,id); if(!s) return;
  var nCols=sheetColCount(s);
  var head=[]; for(var c=0;c<nCols;c++) head.push((s.cols&&s.cols[c])||colLetter(c));
  var rows=[head];
  (s.rows||[]).forEach(function(r){
    var out=[]; for(var c2=0;c2<nCols;c2++) out.push(r[c2]==null?"":r[c2]);
    if(out.some(function(v){ return String(v).trim()!==""; })) rows.push(out);
  });
  saveXlsx([{name:s.name.slice(0,28),rows:rows}], s.name);
}
/* ============================================================
   הכנסה חודשית אוטומטית מחוזה שכירות
   ------------------------------------------------------------
   חוזה שסומן autoIncome מייצר שורת הכנסה אחת לכל חודש שהוא מכסה,
   בסכום המלא (גם בחודש חלקי — כך נקבע), מסומנת "ממתינה לתשלום"
   וממתינה לסגירה בתשלום.

   מפתח הייחודיות הוא rentalId + חודש: אותו חודש לא ייווצר פעמיים
   גם אם המערכת נטענת עשר פעמים ביום, וגם אם החוזה נערך.

   כלל ברזל: שורה שכבר נרשם עליה תשלום לעולם אינה נמחקת ואינה
   משתנה אוטומטית. קיצור חוזה או שינוי סכום נוגעים רק בשורות פתוחות,
   ורק אחרי אישור מפורש.
   ============================================================ */
function ymOf(iso){ return iso?String(iso).slice(0,7):""; }
function ymAdd(ym,n){
  var y=Number(ym.slice(0,4)), m=Number(ym.slice(5,7))-1+n;
  y+=Math.floor(m/12); m=((m%12)+12)%12;
  return y+"-"+String(m+1).padStart(2,"0");
}
function ymLabel(ym){ return ym.slice(5,7)+"/"+ym.slice(0,4); }
function daysInMonth(ym){ return new Date(Date.UTC(Number(ym.slice(0,4)),Number(ym.slice(5,7)),0)).getUTCDate(); }
function dueDateIn(ym,day){
  var d=Math.min(Math.max(Number(day)||1,1),daysInMonth(ym));
  return ym+"-"+String(d).padStart(2,"0");
}
/* החודשים שחוזה אמור לייצר — מהמאוחר שבין תחילת החוזה לבין "לייצר
   החל מ", ועד המוקדם שבין סוף החוזה לחודש הנוכחי. חודשים עתידיים לא
   נוצרים מראש: הם היו מציגים חוב שטרם נולד. */
/* תדירות החיוב. r.rent הוא הסכום לכל חיוב — לא בהכרח חודשי — ולכן
   הדשבורד מנרמל אותו לערך חודשי כדי שהסיכומים יישארו בני-השוואה. */
var RENT_EVERY={month:"חודשי",quarter:"רבעוני",half:"חצי-שנתי",year:"שנתי"};
var RENT_EVERY_M={month:1,quarter:3,half:6,year:12};
function rentEvery(r){ return RENT_EVERY_M[r&&r.every] ? r.every : "month"; }
function rentStepM(r){ return RENT_EVERY_M[rentEvery(r)]; }
function rentMonthly(r){ return (Number(r&&r.rent)||0)/rentStepM(r); }
function rentPeriodLabel(r,ym){
  var st=rentStepM(r);
  if(st===1) return ymLabel(ym);
  var last=ymAdd(ym,st-1);
  return ymLabel(ym)+"–"+ymLabel(last);
}
function rentalDueMonths(r){
  if(!r || !r.autoIncome || !r.startDate) return [];
  var from=r.genFrom && r.genFrom>ymOf(r.startDate) ? r.genFrom : ymOf(r.startDate);
  var today=ymOf(todayISO());
  var to=r.endDate && ymOf(r.endDate)<today ? ymOf(r.endDate) : today;
  if(from>to) return [];
  /* הצעד הוא לפי התדירות: חיוב שנתי מייצר שורה אחת לכל 12 חודשים,
     והמפתח נשאר חודש ההתחלה של התקופה — כך שגם אחרי שינוי תדירות
     לא נוצרות כפילויות על תקופה שכבר חויבה. */
  var step=rentStepM(r);
  var out=[], cur=from, guard=0;
  while(cur<=to && guard<600){ out.push(cur); cur=ymAdd(cur,step); guard++; }
  return out;
}
/* התקופה שהשורה מייצגת: מהחודש שלה ולפי התדירות (חיוב שנתי = 12
   חודשים), חתוכה לגבולות החוזה — כדי שחודש ראשון או אחרון חלקיים
   לא ייראו ארוכים ממה שהחוזה באמת מכסה. */
function rentalIncomePeriod(r,ym){
  var step=rentStepM(r);
  var st=ym+"-01";
  var lastYm=ymAdd(ym,step-1);
  var en=lastYm+"-"+String(daysInMonth(lastYm)).padStart(2,"0");
  if(r.startDate && r.startDate>st) st=r.startDate;
  if(r.endDate && r.endDate<en) en=r.endDate;
  if(en<st) en=st;
  return {start:st,end:en};
}
/* שורות ההכנסה שנוצרו מחוזה מסוים */
function rentalIncome(rentalId){
  return active(DB.income).filter(function(i){ return i.rentalId===rentalId; });
}
function rentalIncomeFor(rentalId,ym){
  return rentalIncome(rentalId).filter(function(i){ return i.periodYM===ym; })[0]||null;
}
/* מה עוד חסר — לתצוגה מקדימה ולכפתור "צור עכשיו" */
function rentalMissingMonths(r){
  return rentalDueMonths(r).filter(function(ym){ return !rentalIncomeFor(r.id,ym); });
}
function makeRentalIncome(r,ym){
  var a=byId(DB.apartments,r.apartmentId);
  var per=rentalIncomePeriod(r,ym);
  var row={id:uid(),apartmentId:r.apartmentId,
    description:"שכר דירה — "+r.name+" — "+rentPeriodLabel(r,ym)+(r.tenant?" · "+r.tenant:""),
    amount:round2(Number(r.rent)||0), date:dueDateIn(ym,r.dueDay),
    receivedBy:"", split:null, units:null, startDate:per.start, endDate:per.end,
    note:"", excluded:false, awaitsPayment:true,
    rentalId:r.id, periodYM:ym, payments:[], deleted:false};
  DB.income.push(row);
  return row;
}
/* יצירה אוטומטית בטעינה. מחזיר כמה שורות נוצרו. */
function runRentalIncome(silent){
  if(!CU || CU.role!=="admin") return 0;
  if(!DB || !Array.isArray(DB.rentals)) return 0;
  var made=0;
  activeRentals().forEach(function(r){
    rentalMissingMonths(r).forEach(function(ym){ makeRentalIncome(r,ym); made++; });
  });
  if(made){
    save();
    if(!silent) toast("נוצרו "+made+" שורות הכנסה חודשיות","ok");
  }
  return made;
}
/* סיכום מצב הגבייה של חוזה — לעמודות במסך השכירויות */
function rentalIncomeStats(r){
  var rows=rentalIncome(r.id);
  var billed=0, paid=0, open=0;
  rows.forEach(function(i){
    if(i.excluded) return;
    var amt=Number(i.amount)||0;
    billed+=amt;
    var p=incomePaid(i);
    paid+=p;
    if(amt-p>0.01) open++;
  });
  return {n:rows.length, billed:round2(billed), paid:round2(paid),
    debt:round2(billed-paid), openRows:open, missing:rentalMissingMonths(r).length};
}

/* ציר זמן: שורה לכל דירה, עמודה לכל חודש — רואים חורים בתפוסה */

/* שינוי שכר דירה — הכרעה מפורשת על השורות שטרם שולמו */
function applyRentChange(r,oldRent,newRent){
  var openRows=rentalIncome(r.id).filter(function(i){ return incomePaid(i)<=0.01; });
  if(!openRows.length) return;
  var ok=confirm("שכר הדירה שונה מ-"+money(oldRent)+" ל-"+money(newRent)+".\n\n"+
    "יש "+openRows.length+" שורות הכנסה שטרם שולמו.\n\n"+
    "אישור = לעדכן גם אותן לסכום החדש.\nביטול = להשאיר אותן כפי שהן; הסכום החדש יחול רק על חודשים חדשים.");
  if(!ok) return;
  openRows.forEach(function(i){ i.amount=round2(newRent); });
  toast("עודכנו "+openRows.length+" שורות פתוחות","ok");
}
/* קיצור או ביטול חוזה — מסירים רק שורות שמחוץ לתוקף ושטרם שולמו */
function pruneRentalIncome(r){
  var valid={};
  rentalDueMonths(r).forEach(function(ym){ valid[ym]=1; });
  var stale=rentalIncome(r.id).filter(function(i){
    return i.periodYM && !valid[i.periodYM] && incomePaid(i)<=0.01;
  });
  if(!stale.length) return;
  var paidStale=rentalIncome(r.id).filter(function(i){
    return i.periodYM && !valid[i.periodYM] && incomePaid(i)>0.01;
  }).length;
  if(!confirm(stale.length+" שורות הכנסה כבר אינן בתוקף לפי החוזה המעודכן, וטרם שולמו.\n\n"+
    "אישור = להעביר אותן לסל המחזור.\nביטול = להשאיר אותן.\n\n"+
    (paidStale?("שים לב: "+paidStale+" שורות נוספות מחוץ לטווח כבר שולמו — הן יישארו בכל מקרה."):""))) return;
  stale.forEach(function(i){ i.deleted=true; });
  toast("הוסרו "+stale.length+" שורות שאינן בתוקף","warn");
}

      if(r.tenant||r.startDate||r.endDate){

/* ---------- ניהול חשבונות ---------- */
/* בכמה מקומות מצביעים לחשבון — לא רק תשלומים */
function accountUsage(accId){
  var n=active(DB.payments).filter(function(p){ return p.accountId===accId; }).length;
  n+=active(DB.deposits).filter(function(d){ return d.accountId===accId; }).length;
  n+=active(DB.withdrawals).filter(function(w){ return w.accountId===accId; }).length;
  var dest="bank:"+accId;
  active(DB.income).forEach(function(i){
    if(i.receivedBy===dest) n++;
    (i.payments||[]).forEach(function(g){ if(!g.deleted && g.receivedBy===dest) n++; });
  });
  return n;
}
/* מעביר כל הפניה מחשבון אחד לאחר — לפני מיזוג או מחיקה */
function repointAccount(fromId,toId){
  active(DB.payments).forEach(function(p){ if(p.accountId===fromId) p.accountId=toId; });
  active(DB.deposits).forEach(function(d){ if(d.accountId===fromId) d.accountId=toId; });
  active(DB.withdrawals).forEach(function(w){ if(w.accountId===fromId) w.accountId=toId; });
  var from="bank:"+fromId, to="bank:"+toId;
  active(DB.income).forEach(function(i){
    if(i.receivedBy===from) i.receivedBy=to;
    (i.payments||[]).forEach(function(g){ if(g.receivedBy===from) g.receivedBy=to; });
  });
  active(DB.bankMoves).forEach(function(m){ if(m.accountId===fromId) m.accountId=toId; });
}
/* קבוצות חשבונות עם אותו שם — מפתח: השם המנורמל. השיוך אינו חלק
   מהמפתח: "אמרי מנחם" שנוצר פעמיים בשני פרויקטים הוא אותו חשבון. */
function accountDupGroups(){
  var by={};
  active(DB.accounts).forEach(function(ac){
    var k=normKey(ac.name);
    (by[k]=by[k]||[]).push(ac);
  });
  var out={};
  Object.keys(by).forEach(function(k){ if(by[k].length>1) out[k]=by[k]; });
  return out;
}
/* מי נשאר בקבוצה: הכי הרבה תנועות, ובתיקו — הכללי לפני המשויך */
function dupKeeper(g){
  return g.slice().sort(function(a,b){
    return accountUsage(b.id)-accountUsage(a.id) || ((a.apartmentId?1:0)-(b.apartmentId?1:0));
  })[0];
}
function acctScopeLabel(ac){
  if(!ac.apartmentId) return "כללי";
  var a=byId(DB.apartments,ac.apartmentId);
  return a?a.name:"פרוייקט שנמחק";
}
/* מסך המיזוג — מראה בדיוק מה ימוזג לפני שנוגעים בנתונים */
function openMergeAccounts(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var groups=accountDupGroups();
  var keys=Object.keys(groups).sort();
  if(!keys.length){
    openModal({title:"🧹 מיזוג חשבונות",bodyHtml:
      '<div class="empty">לא נמצאו שני חשבונות עם אותו שם.</div>'+
      '<div class="hint">למיזוג של שני חשבונות בשמות שונים — לחץ <b>⇄</b> בשורת החשבון שברצונך לבטל, ובחר לאיזה חשבון להעביר את התנועות שלו.</div>',
      saveLabel:""});
    return;
  }
  var h='<div class="hint" style="margin-bottom:10px">לכל שם יישאר <b>חשבון אחד</b> וכל התנועות של השאר יועברו אליו. '+
    'שום תשלום, הפקדה, משיכה או הכנסה לא הולך לאיבוד. העותקים המיותרים עוברים לסל המחזור וניתן לשחזר אותם.</div>'+
    '<div class="toolbar"><button class="btn btn-sm" onclick="document.querySelectorAll(\'.mg-x\').forEach(function(c){c.checked=true})">סמן הכל</button>'+
    '<button class="btn btn-ghost btn-sm" onclick="document.querySelectorAll(\'.mg-x\').forEach(function(c){c.checked=false})">נקה</button></div>'+
    '<div class="table-wrap" style="max-height:420px"><table class="tbl"><thead><tr>'+
    '<th class="chk" style="width:30px"></th><th>שם</th><th>עותקים</th><th>יישאר</th><th>שיוך אחרי המיזוג</th><th>תנועות שיעברו</th>'+
    '</tr></thead><tbody>';
  keys.forEach(function(k){
    var g=groups[k], keep=dupKeeper(g);
    var scopes={}; g.forEach(function(a){ scopes[a.apartmentId||""]=1; });
    var mixedScope=Object.keys(scopes).length>1;
    var banks={}; g.forEach(function(a){ banks[a.isBank?1:0]=1; });
    var mixedBank=Object.keys(banks).length>1;
    var moving=g.filter(function(a){ return a.id!==keep.id; })
                .reduce(function(s,a){ return s+accountUsage(a.id); },0);
    h+='<tr'+(mixedBank?' style="background:#fef2f2"':'')+'>'+
      '<td class="chk"><input type="checkbox" class="mg-x" data-k="'+esc(k)+'"'+(mixedBank?'':' checked')+'></td>'+
      '<td><b>'+esc(keep.name)+'</b>'+
        '<div class="hint">'+g.map(function(a){ return esc(acctScopeLabel(a))+" ("+accountUsage(a.id)+")"; }).join(" · ")+'</div></td>'+
      '<td>'+g.length+'</td>'+
      '<td>'+esc(acctScopeLabel(keep))+(keep.isBank?' 🏦':'')+'</td>'+
      '<td>'+(mixedScope
        ? '<span class="badge badge-warn badge-unit">כללי</span><div class="hint">השיוכים שונים — הופך לכללי כדי שכל התנועות יישארו תקפות</div>'
        : esc(acctScopeLabel(keep)))+'</td>'+
      '<td>'+(moving||'<span class="muted">—</span>')+
        (mixedBank?'<div class="hint neg">חלק מסומנים "בנק זמני" וחלק לא — מיזוג משנה את חישוב יתרת הבנק. סמן ידנית רק אם זה נכון.</div>':'')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  openModal({title:"🧹 מיזוג חשבונות — "+keys.length+" שמות כפולים",wide:true,bodyHtml:h,
    saveLabel:"מזג את המסומנים",onSave:function(){ return applyMergeAccounts(); }});
}
function applyMergeAccounts(){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var picked=[];
  document.querySelectorAll(".mg-x:checked").forEach(function(c){ picked.push(c.getAttribute("data-k")); });
  if(!picked.length){ toast("לא נבחר אף שם למיזוג","warn"); return false; }
  var groups=accountDupGroups();
  var removed=0, moved=0;
  picked.forEach(function(k){
    var g=groups[k]; if(!g||g.length<2) return;
    var keep=dupKeeper(g);
    var scopes={}; g.forEach(function(a){ scopes[a.apartmentId||""]=1; });
    /* שיוכים שונים — הנותר הופך לכללי, אחרת תשלומים מפרוייקט אחר
       היו מצביעים לחשבון שאינו זמין שם */
    if(Object.keys(scopes).length>1) keep.apartmentId=null;
    g.forEach(function(ac){
      if(ac.id===keep.id) return;
      moved+=accountUsage(ac.id);
      repointAccount(ac.id,keep.id);
      ac.deleted=true; removed++;
    });
  });
  save();
  toast("מוזגו "+removed+" חשבונות · הועברו "+moved+" תנועות","ok");
  rerender();
  return true;
}
/* מיזוג ידני: חשבון בודד לתוך חשבון אחר, גם בשם שונה */
function mergeAccountInto(fromId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var from=byId(DB.accounts,fromId); if(!from) return;
  var others=active(DB.accounts).filter(function(a){ return a.id!==fromId; });
  if(!others.length){ toast("אין חשבון אחר למזג אליו","warn"); return; }
  var n=accountUsage(fromId);
  openModal({title:"⇄ מיזוג החשבון \""+from.name+"\"",bodyHtml:
    '<div class="hint" style="margin-bottom:10px">כל '+(n||0)+' התנועות של <b>'+esc(from.name)+'</b> ('+esc(acctScopeLabel(from))+') '+
    'יועברו לחשבון שתבחר, והחשבון הזה יעבור לסל המחזור.</div>'+
    '<div class="field"><label>למזג לתוך</label>'+
      pickerHtml("mg-target",others.map(function(a){
        return {id:a.id,label:a.name+" — "+acctScopeLabel(a)+(a.isBank?" 🏦":"")}; }),"",
        {placeholder:"הקלד שם חשבון…"})+'</div>'+
    (from.isBank?'<div class="hint neg">החשבון הנוכחי מסומן <b>🏦 בנק זמני</b>. אם היעד אינו בנק זמני — התנועות יפסיקו להיספר ביתרת הבנק.</div>':''),
    saveLabel:"מזג",onSave:function(){
      var toId=pickId("mg-target");
      if(!toId){ toast(toId===null?"שם החשבון לא זוהה — בחר מהרשימה":"בחר חשבון יעד","err"); return false; }
      var to=byId(DB.accounts,toId); if(!to){ toast("חשבון היעד לא נמצא","err"); return false; }
      /* שיוכים שונים — היעד הופך לכללי כדי שהתנועות שעברו יישארו תקפות */
      if((from.apartmentId||"")!==(to.apartmentId||"") && to.apartmentId) to.apartmentId=null;
      repointAccount(fromId,toId);
      from.deleted=true;
      save(); toast("מוזג · הועברו "+n+" תנועות ל\""+to.name+"\"","ok"); rerender();
    }});
}
/* חשבונות שאין להם אף תנועה — ניקוי הרשימה הארוכה */
function cleanUnusedAccounts(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var unused=active(DB.accounts).filter(function(ac){ return accountUsage(ac.id)===0; });
  if(!unused.length){ toast("כל החשבונות בשימוש","warn"); return; }
  if(!confirm(unused.length+" חשבונות ללא אף תנועה יעברו לסל המחזור:\n\n"+
    unused.slice(0,15).map(function(a){return "• "+a.name;}).join("\n")+
    (unused.length>15?"\n…ועוד "+(unused.length-15):"")+"\n\nלהמשיך?")) return;
  unused.forEach(function(ac){ ac.deleted=true; });
  save(); toast("הוסרו "+unused.length+" חשבונות שלא היו בשימוש","ok"); rerender();
}
function editAccount(id){
  var ac=id?byId(DB.accounts,id):{name:"",isBank:false,apartmentId:null};
  var apts=active(DB.apartments);
  openModal({title:id?"עריכת חשבון":"חשבון חדש",bodyHtml:
    '<div class="field"><label>שם החשבון</label><input id="ac-name" value="'+esc(ac.name)+'" placeholder="למשל: מרכנתיל / חשבון יונה"></div>'+
    '<div class="field"><label>שיוך</label><select id="ac-apt"><option value="">כללי — זמין בכל הפרויקטים</option>'+
      apts.map(function(a){return '<option value="'+a.id+'"'+(ac.apartmentId===a.id?" selected":"")+'>'+esc(a.name)+'</option>';}).join("")+
    '</select></div>'+
    '<div class="field"><label style="font-weight:400"><input type="checkbox" id="ac-bank" style="width:auto" '+(ac.isBank?"checked":"")+'> זהו <b>בנק זמני</b> (קופה משותפת)</label>'+
      '<div class="hint">תשלום מחשבון כזה יורד מיתרת הבנק ואינו נחשב תרומה של שותף מסוים</div></div>',
    onSave:function(){
      var nm=val("ac-name").trim(); if(!nm){ toast("יש להזין שם","err"); return false; }
      if(id){ ac.name=nm; ac.isBank=checked("ac-bank"); ac.apartmentId=val("ac-apt")||null; }
      else{
        var k=normKey(nm);
        if(active(DB.accounts).some(function(x){return normKey(x.name)===k && (x.apartmentId||null)===(val("ac-apt")||null);})){
          toast("כבר קיים חשבון בשם הזה","err"); return false;
        }
        DB.accounts.push({id:uid(),apartmentId:val("ac-apt")||null,name:nm,isBank:checked("ac-bank"),partnerId:null,deleted:false});
      }
      save(); toast("נשמר","ok"); rerender();
    }});
}
function delAccount(id){
  var used=active(DB.payments).filter(function(p){return p.accountId===id;}).length;
  var ac=byId(DB.accounts,id);
  if(used){ toast('אי אפשר למחוק — "'+ac.name+'" משמש ב-'+used+' תשלומים',"err"); return; }
  softDelete("accounts",id,'למחוק את החשבון "'+ac.name+'"?');
}
/* רשימת החשבונות שבשימוש בפועל אצל המשתמש */
function seedCommonAccounts(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var list=["פרטי","פאגי","הלואה מיוחדת","מרכנתיל","אשראי חיליק","משכנתא","מזרחי","אמריקה",
    "בנצי אמרי מנחם","לסידור","אמרי מנחם","חשבון יונה","יהב","סקיי גייט","חיליק","טריה",
    "סיבובי פאגי","שווה ערך","חול","דיסקונט","דיסקונט הרשי","חשבן אחר","פועלים","פרלמן יונה אמרי"];
  var added=0, skipped=0;
  list.forEach(function(nm){
    var k=normKey(nm);
    if(active(DB.accounts).some(function(x){ return normKey(x.name)===k && !x.apartmentId; })){ skipped++; return; }
    DB.accounts.push({id:uid(),apartmentId:null,name:nm,isBank:false,partnerId:null,deleted:false}); added++;
  });
  if(!added){ toast("כל החשבונות כבר קיימים","warn"); return; }
  save(); toast("נוספו "+added+" חשבונות"+(skipped?" · "+skipped+" כבר היו":""),"ok"); rerender();
}

/* ---------- מחיקה מרוכזת (רכה — הכל לסל המחזור) ---------- */
function deleteAllExpenses(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var exps=active(DB.expenses);
  if(!exps.length){ toast("אין הוצאות למחיקה","warn"); return; }
  var ids={}; exps.forEach(function(e){ ids[e.id]=1; });
  var pays=active(DB.payments).filter(function(p){return ids[p.expenseId];});
  if(!confirm("יימחקו "+exps.length+" הוצאות ו-"+pays.length+" תשלומים שלהן.\n\n"+
    "הכל עובר לסל המחזור וניתן לשחזר.\nהפרוייקטים, השותפים והאחוזים יישארו.\n\nלהמשיך?")) return;
  exps.forEach(function(e){ e.deleted=true; });
  pays.forEach(function(p){ p.deleted=true; });
  save(); toast("נמחקו "+exps.length+" הוצאות ו-"+pays.length+" תשלומים","ok"); rerender();
}

/* ---------- איחוד פרוייקטים כפולים ----------
   "הלפרין  17" (רווח כפול) ו"הלפרין 17" נוצרו כשני פרוייקטים. המיזוג מעביר
   את כל התנועות לפרוייקט היעד ומעביר את הכפולה לסל המחזור. */
function mergeApartments(srcId,dstId){
  if(srcId===dstId) return 0;
  var src=byId(DB.apartments,srcId), dst=byId(DB.apartments,dstId);
  if(!src||!dst) return 0;
  var moved=0;
  // הוצאות (החלוקות, דמי הניהול והתשלומים שלהן עוברים איתן דרך expenseId)
  active(DB.expenses).forEach(function(e){ if(e.apartmentId===srcId){ e.apartmentId=dstId; moved++; } });
  // שותפי פרוייקט — לא מכפילים שותף שכבר קיים ביעד
  var dstP={}; apPartners(dstId).forEach(function(x){ dstP[x.partnerId]=1; });
  active(DB.apartmentPartners).forEach(function(x){
    if(x.apartmentId!==srcId) return;
    if(dstP[x.partnerId]){ x.deleted=true; x.deletedBy="merged:"+dstId; }
    else { x.apartmentId=dstId; dstP[x.partnerId]=1; }
  });
  // מנהלים — אותו שם ביעד: מפנים אליו את דמי הניהול והתשלומים
  active(DB.managers).forEach(function(m){
    if(m.apartmentId!==srcId) return;
    var twin=apManagers(dstId).find(function(t){ return normKey(t.name)===normKey(m.name); });
    if(twin){
      DB.expenseManagerFees.forEach(function(f){ if(f.managerId===m.id) f.managerId=twin.id; });
      DB.payments.forEach(function(p){ if(p.recipientManagerId===m.id) p.recipientManagerId=twin.id; });
      m.deleted=true; m.deletedBy="merged:"+dstId;
    } else m.apartmentId=dstId;
  });
  // חשבונות — אותו שם ביעד: מפנים אליו את התשלומים
  active(DB.accounts).forEach(function(ac){
    if(ac.apartmentId!==srcId) return;
    var twin=apAccounts(dstId).find(function(t){ return normKey(t.name)===normKey(ac.name); });
    if(twin){
      DB.payments.forEach(function(p){ if(p.accountId===ac.id) p.accountId=twin.id; });
      ac.deleted=true; ac.deletedBy="merged:"+dstId;
    } else ac.apartmentId=dstId;
  });
  active(DB.deposits).forEach(function(d){ if(d.apartmentId===srcId){ d.apartmentId=dstId; moved++; } });
  active(DB.income).forEach(function(i){ if(i.apartmentId===srcId){ i.apartmentId=dstId; moved++; } });
  if(src.hasBank) dst.hasBank=true;
  if(src.hasManagement) dst.hasManagement=true;
  if(src.notes && !dst.notes) dst.notes=src.notes;
  src.deleted=true; src.deletedBy="merged:"+dstId;
  return moved;
}
function openMergeTool(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var apts=active(DB.apartments);
  // קבוצות של שמות זהים-בפועל
  var byKey={};
  apts.forEach(function(a){ var k=normKey(a.name); (byKey[k]=byKey[k]||[]).push(a); });
  var groups=Object.keys(byKey).map(function(k){return byKey[k];}).filter(function(g){return g.length>1;});
  window._mergeGroups=groups;
  function aptLine(a,gi){
    var n=apExpenses(a.id).length, pay=apAllPayments(a.id).length;
    var best=window._mergeGroups[gi].reduce(function(m,x){ return apExpenses(x.id).length>apExpenses(m.id).length?x:m; });
    return '<label style="display:flex;gap:8px;align-items:center;font-weight:400;padding:4px 0">'+
      '<input type="radio" name="mg-'+gi+'" value="'+a.id+'" style="width:auto" '+(a.id===best.id?"checked":"")+'>'+
      '<span><b>'+esc(a.name)+'</b>'+(/\s{2,}/.test(a.name)?' <span class="badge badge-warn">רווח כפול</span>':'')+
      ' <span class="muted">— '+n+' שלבים · '+pay+' תשלומים</span></span></label>';
  }
  var body= groups.length
    ? '<p class="muted">נמצאו '+groups.length+' קבוצות של פרוייקטים עם אותו שם בפועל (הבדל של רווחים/גרשיים). '+
      'בחר בכל קבוצה את הפרוייקט <b>שתישאר</b> — כל השאר ימוזגו לתוכה.</p>'+
      groups.map(function(g,gi){
        return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px">'+
          g.map(function(a){return aptLine(a,gi);}).join("")+
          '<button class="btn btn-primary btn-sm" style="margin-top:6px" onclick="mergeGroup('+gi+')">🔀 מזג את הקבוצה</button></div>';
      }).join("")
    : '<p class="pos">✅ לא נמצאו פרוייקטים כפולים לפי שם.</p>';
  body+='<div class="section-title">מיזוג ידני</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>פרוייקט למיזוג (תיעלם)</label><select id="mg-src">'+
        apts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label>לתוך (תישאר)</label><select id="mg-dst">'+
        apts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join("")+'</select></div>'+
    '</div>'+
    '<button class="btn btn-sm" onclick="manualMerge()">🔀 מזג ידנית</button>'+
    '<div class="hint">המיזוג מעביר הכל: שלבים, תשלומים, שותפים, מנהלים, חשבונות, הפקדות והכנסות. הפרוייקט שמוזג עוברת לסל המחזור.</div>';
  openModal({title:"🔀 איחוד פרוייקטים כפולים",wide:true,bodyHtml:body});
}
function mergeGroup(gi){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var g=window._mergeGroups[gi]; if(!g) return;
  var sel=document.querySelector('input[name="mg-'+gi+'"]:checked');
  if(!sel){ toast("בחר את הפרוייקט שתישאר","err"); return; }
  var dstId=sel.value;
  var srcs=g.filter(function(a){return a.id!==dstId;});

  var deps=apDeposits(aptId), inc=apIncome(aptId);

    "• "+exps.length+" הוצאות\n• "+pays.length+" תשלומים\n• "+deps.length+" הפקדות\n• "+inc.length+" הכנסות\n"+
    "• "+aps.length+" שותפים בפרוייקט\n• "+mgrs.length+" מנהלים\n• "+accs.length+" חשבונות\n\n"+
    "הכל עובר לסל המחזור, וניתן לשחזר את הפרוייקט עם כל התנועות בלחיצה אחת.\n\nלהמשיך?")) return;
  var tag="apt:"+aptId;
  function kill(arr){ arr.forEach(function(x){ x.deleted=true; x.deletedBy=tag; }); }
  kill(exps); kill(pays); kill(splits); kill(fees); kill(deps); kill(inc); kill(mgrs); kill(accs); kill(aps);
  a.deleted=true;
  save();
  toast('"'+a.name+'" וכל התנועות שלה הועברו לסל המחזור',"ok");
  go("dashboard",{});
}

async function saveUser(id,u){
  var name=val("us-name").trim(); if(!name){ toast("שם חסר","err"); return; }
  var email=val("us-email").trim();
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast("כתובת המייל אינה תקינה","err"); return; }
  var apts=Array.prototype.slice.call(document.querySelectorAll(".u-apt:checked")).map(function(c){return c.value;});
  var code=val("us-code");
  var role=val("us-role");
  /* הקוד הוא הזהות — אין שם משתמש בכניסה. שני משתמשים עם אותו קוד
     היו נכנסים שניהם לחשבון הראשון שמתאים, וזה נראה כמו "הכניסה
     לא עובדת". חוסמים מראש. */
  if(code){
    var h=await hashCode(code);
    var clash=active(DB.users).find(function(x){ return x.code===h && x.id!==id; });
    if(clash){ toast('הקוד הזה כבר שייך למשתמש "'+clash.name+'" — בחר קוד אחר',"err"); return; }
  }
  if(id){
    u.name=name; u.email=email; u.role=role; u.allowedApartments=apts; u.partnerId=null; u.active=checked("us-active");
    if(code) u.code=await hashCode(code);
  }
  else{
    if(!code){ toast("יש להזין קוד","err"); return; }
    DB.users.push({id:uid(),name:name,email:email,role:role,code:await hashCode(code),
      allowedApartments:apts,partnerId:null,active:checked("us-active"),deleted:false});
  }
  save(); closeModal(); rerender();
  toast(id?'"'+name+'" נשמר':'"'+name+'" נוסף — נכנסים עם השם "'+name+'" בדיוק, יחד עם הקוד',"ok");
  if(!id) confirmUserOnServer(name);
}
/* ---------- אישור שהמשתמש באמת הגיע לשרת ----------
   הכניסה נבדקת מול השרת ולא מול העותק המקומי: המשתמש נוצר אצלי מיד,
   אבל עד שהשמירה נוחתת בשרת הוא לא קיים שם — וניסיון כניסה נכשל
   ב"שם המשתמש או קוד הכניסה שגויים", בלי שום רמז לסיבה. אם השמירה
   נכשלת לגמרי (או שסוגרים את הדפדפן לפניה) הוא לעולם לא יגיע לשם.
   לכן ממתינים לאישור השרת ואומרים במפורש מה קרה. */
function confirmUserOnServer(name){
  if(!getAuth()) return;                 /* עבודה מקומית בלבד — אין למה להמתין */
  var t0=Date.now();
  (function wait(){
    if(!hasUnsaved() && !SAVEQ.timer){
      toast('"'+name+'" נשמר גם בשרת — אפשר להיכנס איתו עכשיו',"ok");
      return;
    }
    if(Date.now()-t0>25000){
      toast('"'+name+'" נשמר במחשב הזה אבל עדיין לא הגיע לשרת — הכניסה איתו '+
        'לא תעבוד עד שהשמירה תושלם. השאר את החלון פתוח, ואם הסימון למעלה '+
        'נשאר אדום — פנה אליי',"warn");
      return;
    }
    setTimeout(wait,700);
  })();
}

  r.onload=function(){ try{ var d=JSON.parse(r.result);
    if(d&&d.__merge){ openMergeImport(d); return; }
    if(d&&Array.isArray(d.apartments)){ DB=normalizeDB(d); save(); toast("שוחזר","ok"); rerender(); } else toast("קובץ לא תקין","err"); }catch(e){ toast("שגיאה בקריאה","err"); } };
  r.readAsText(f); }

/* ---------- ייבוא-מיזוג: קובץ JSON שמוסיף פרוייקט שלם לנתונים הקיימים ----------
   בשונה מ"ייבוא JSON" הרגיל (שמחליף את הכל), קובץ עם __merge:true ממוזג:
   שותפים / חשבונות / קטגוריות מאותרים לפי שם (או נוצרים), וההוצאות,
   התשלומים וההכנסות מתווספים לפרוייקט. הרצה חוזרת לא מכפילה — שורה
   שכבר קיימת (אותו תיאור + סכום + תאריך) מדולגת. */
function openMergeImport(d){
  var aptName=(d.apartment&&d.apartment.name)||"";
  if(!aptName){ toast("קובץ מיזוג לא תקין — חסר שם פרוייקט","err"); return; }
  var exist=active(DB.apartments).filter(function(a){return normKey(a.name)===normKey(aptName);})[0];
  openModal({title:"📥 ייבוא-מיזוג — "+aptName,bodyHtml:
    '<p>'+(exist?'הפרוייקט <b>'+esc(aptName)+'</b> כבר קיים — הנתונים יתווספו אליו.'
               :'ייווצר פרוייקט חדש: <b>'+esc(aptName)+'</b>.')+'</p>'+
    '<ul style="margin:8px 0 0 0;padding-inline-start:18px">'+
      '<li>הוצאות: '+((d.expenses||[]).length)+'</li>'+
      '<li>תשלומי הוצאות: '+((d.payments||[]).length)+'</li>'+
      '<li>הזמנות / הכנסות: '+((d.income||[]).length)+' (עם '+
        (d.income||[]).reduce(function(s,x){return s+((x.payments||[]).length);},0)+' תשלומי אורחים)</li>'+
      '<li>שותפים: '+((d.partners||[]).join(", ")||"—")+'</li>'+
      '<li>חשבונות: '+((d.accounts||[]).join(", ")||"—")+'</li>'+
    '</ul>'+
    '<p class="hint" style="margin-top:8px">שורות שכבר קיימות במערכת ידולגו, כך שאפשר להריץ את הקובץ שוב בלי כפילויות. לפני המיזוג נשמר מצב לשחזור (Ctrl+Z).</p>',
    saveLabel:"בצע מיזוג",onSave:function(){ return applyMergeImport(d,exist); }});
}
function applyMergeImport(d,exist){
  try{
    var added={exp:0,pay:0,inc:0,gp:0}, skipped={exp:0,pay:0,inc:0};
    /* פרוייקט */
    var apt=exist;
    if(!apt){ apt={id:uid(),name:d.apartment.name,note:(d.apartment.note||""),deleted:false}; DB.apartments.push(apt); }
    /* יחידות ההשכרה של הפרוייקט (וילה 1, יחידה 2…) */
    if(d.apartment.rentalUnits && d.apartment.rentalUnits.length) apt.rentalUnits=d.apartment.rentalUnits.slice();
    /* שותפים — לפי שם; חדשים נקשרים לפרוייקט בחלוקה שווה */
    var pByName={};
    (d.partners||[]).forEach(function(nm){
      var p=active(DB.partners).filter(function(x){return normKey(x.name)===normKey(nm);})[0];
      if(!p){ p={id:uid(),name:nm,deleted:false}; DB.partners.push(p); }
      pByName[normKey(nm)]=p;
      var link=active(DB.apartmentPartners).filter(function(x){return x.apartmentId===apt.id&&x.partnerId===p.id;})[0];
      if(!link) DB.apartmentPartners.push({id:uid(),apartmentId:apt.id,partnerId:p.id,
        defaultPercent:Math.round(10000/((d.partners||[]).length||1))/100,deleted:false});
    });
    /* חשבונות — קודם חשבון קיים (כללי או של הפרוייקט), אחרת נוצר לפרוייקט */
    var accByName={};
    (d.accounts||[]).forEach(function(nm){
      var ac=active(DB.accounts).filter(function(x){
        return normKey(x.name)===normKey(nm)&&(!x.apartmentId||x.apartmentId===apt.id);})[0];
      if(!ac){ ac={id:uid(),apartmentId:apt.id,name:nm,isBank:false,deleted:false}; DB.accounts.push(ac); }
      accByName[normKey(nm)]=ac;
    });
    /* קטגוריות */
    var catByName={};
    (d.categories||[]).forEach(function(nm){
      var c=active(DB.categories).filter(function(x){return normKey(x.name)===normKey(nm);})[0];
      if(!c){ c={id:uid(),name:nm,deleted:false}; DB.categories.push(c); }
      catByName[normKey(nm)]=c;
    });
    /* הוצאות — מפתח הקובץ ← מזהה שנוצר; כפילות = תיאור+סכום+תאריך.
       ההשוואה סופרת מופעים: שתי שורות זהות באמת בקובץ נשארות שתיים —
       מדולגות רק כנגד שורות קיימות שכבר נקלטו בהרצה קודמת. */
    var expByKey={};
    var existingExp={};
    active(DB.expenses).forEach(function(e){ if(e.apartmentId===apt.id){
      var s=normKey(e.description)+"|"+(Number(e.amount)||0)+"|"+(e.date||"");
      (existingExp[s]=existingExp[s]||[]).push(e); } });
    (d.expenses||[]).forEach(function(x){
      var sig=normKey(x.desc)+"|"+(Number(x.amount)||0)+"|"+(x.date||"");
      var e=(existingExp[sig]||[]).shift();
      if(e){ skipped.exp++; expByKey[x.key]=e; return; }
      e={id:uid(),apartmentId:apt.id,description:x.desc,amount:Number(x.amount)||0,date:x.date||"",
         categoryId:(catByName[normKey(x.category||"")]||{}).id||"",
         classification:x.classification||"ongoing",note:x.note||"",deleted:false};
      DB.expenses.push(e); expByKey[x.key]=e; added.exp++;
    });
    /* תשלומי הוצאות — אותה ספירת מופעים */
    var existingPay={};
    active(DB.payments).forEach(function(p){ var e=byId(DB.expenses,p.expenseId);
      if(e&&e.apartmentId===apt.id){
        var s=p.expenseId+"|"+(Number(p.amount)||0)+"|"+(p.date||"");
        existingPay[s]=(existingPay[s]||0)+1; } });
    (d.payments||[]).forEach(function(x){
      var e=expByKey[x.expenseKey]; if(!e){ skipped.pay++; return; }
      var sig=e.id+"|"+(Number(x.amount)||0)+"|"+(x.date||"");
      if(existingPay[sig]>0){ existingPay[sig]--; skipped.pay++; return; }
      DB.payments.push({id:uid(),expenseId:e.id,date:x.date||"",amount:Number(x.amount)||0,
        accountId:(accByName[normKey(x.account||"")]||{}).id||"",
        payerPartnerId:(pByName[normKey(x.payer||"")]||{}).id||"",
        method:x.method||"",recipientType:"supplier",recipientManagerId:null,
        invoiceStatus:x.invoice||"",hasInvoice:(x.invoice==="has"),
        invoiceLink:"",note:x.note||"",hidden:false,deleted:false});
      added.pay++;
    });
    /* הזמנות / הכנסות + תשלומי אורחים משובצים */
    /* הזמנה מזוהה לפי תיאור+סכום+תאריך. altDesc הוא ניסוח ישן של אותה
       שורה (למשל כשהיחידות היו חלק מהתיאור) — כך הרצה חוזרת של קובץ
       מעודכן משדרגת את השורה הקיימת במקום ליצור כפילות. */
    var existingInc={};
    active(DB.income).forEach(function(i){ if(i.apartmentId===apt.id){
      var s=normKey(i.description)+"|"+(Number(i.amount)||0)+"|"+(i.date||"");
      (existingInc[s]=existingInc[s]||[]).push(i); } });
    (d.income||[]).forEach(function(x){
      var amt=Number(x.amount)||0;
      var sig=normKey(x.desc)+"|"+amt+"|"+(x.date||"");
      var hit=(existingInc[sig]||[]).shift();
      if(!hit && x.altDesc){
        var alt=normKey(x.altDesc)+"|"+amt+"|"+(x.date||"");
        hit=(existingInc[alt]||[]).shift();
      }
      if(hit){
        hit.description=x.desc;
        if(x.units&&x.units.length) hit.units=x.units.slice();
        skipped.inc++; return;
      }
      var pays=(x.payments||[]).map(function(g){
        added.gp++;
        return {id:uid(),date:g.date||"",amount:Number(g.amount)||0,method:g.method||"",
          invoices:g.invoices||"",note:g.note||"",deleted:false};
      });
      DB.income.push({id:uid(),apartmentId:apt.id,description:x.desc,amount:amt,
        date:x.date||"",receivedBy:"",split:null,
        units:(x.units&&x.units.length)?x.units.slice():null,note:x.note||"",
        payments:pays.length?pays:null,deleted:false});
      added.inc++;
    });
    DB=normalizeDB(DB);
    save(); rerender();
    toast("מיזוג הושלם: "+added.exp+" הוצאות, "+added.pay+" תשלומים, "+added.inc+" הזמנות ("+added.gp+" תשלומי אורחים)"+

/* מפרסר טקסט מופרד שמכבד מרכאות — תא באקסל יכול להכיל ירידת שורה,
   ואז הוא מגיע עטוף במרכאות. פיצול נאיבי לפי \n שבר שורות כאלה לשתיים. */
function parseDelimited(raw,sep){
  var rows=[], row=[], field="", i=0, inQ=false;
  while(i<raw.length){
    var c=raw.charAt(i);
    if(inQ){
      if(c==='"'){
        if(raw.charAt(i+1)==='"'){ field+='"'; i+=2; continue; }
        inQ=false; i++; continue;
      }
      field+=c; i++; continue;
    }
    /* גרשיים פותחים ציטוט רק בתחילת שדה. באמצע מילה הם תו רגיל —
       אחרת טקסט עברי כמו מע"מ / סה"כ / ע"ש היה בולע את שורות ההמשך. */
    if(c==='"' && field===""){ inQ=true; i++; continue; }
    if(c===sep){ row.push(field); field=""; i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ row.push(field); field=""; rows.push(row); row=[]; i++; continue; }
    field+=c; i++;
  }
  if(field!=="" || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); })
             .map(function(r){ return r.map(function(c){ return String(c).replace(/\s+/g," ").trim(); }); });
}
/* מפתח השוואה סלחני: מאחד גרשיים/אפוסטרופים, רווחים כפולים, ורישיות.
   באקסל אותו שם נכתב לפעמים עם ׳ ולפעמים עם ', או עם רווח כפול. */
function normKey(s){
  return String(s==null?"":s)
    .replace(/[‘’׳ʼ'`´]/g,"'")
    .replace(/[“”״"]/g,'"')
    .replace(/[‎‏‪-‮]/g,"")
    .replace(/\s+/g," ")
    .trim().toLowerCase();
}
function impNum(v){ var n=parseFloat(String(v==null?"":v).replace(/[^\d.\-]/g,"")); return isFinite(n)?n:0; }

   קריאת קובץ אקסל (.xlsx) ישירות בדפדפן — בלי ספרייה חיצונית.
   xlsx הוא ZIP של קובצי XML; פותחים עם DecompressionStream המובנה.

/* קורא xlsx או CSV ומחזיר רשת תאים ל-onGrid. בלי onGrid — ההתנהגות

function readSheetFile(inp,onGrid,nameElId){

    if(nameEl) nameEl.textContent=""; return;
  }
  var rd=new FileReader();
  rd.onerror=function(){ toast("שגיאה בקריאת הקובץ","err"); if(nameEl) nameEl.textContent=""; };
  if(isXlsx){
    rd.onload=function(){ parseXlsx(rd.result,f.name,onGrid,nameEl).catch(function(e){
      toast("קריאת ה-xlsx נכשלה: "+e.message,"err"); if(nameEl) nameEl.textContent=""; }); };
    rd.readAsArrayBuffer(f);
  }else{
    rd.onload=function(){
      var txt=rd.result;
      // אקסל עברי שומר CSV ב-Windows-1255; אם רואים הרבה תווי החלפה — קוראים שוב בקידוד הנכון
      function done(t){
        if(onGrid){
          var g=parseDelimited(t, t.indexOf("	")>=0?"	":",");
          if(nameEl) nameEl.textContent="✅ "+f.name+" ("+g.length+" שורות)";
          onGrid(g,f.name);
        } else fileTextToTextarea(t,f.name);

      if((txt.match(/�/g)||[]).length>3){
        var rd2=new FileReader();
        rd2.onload=function(){ done(rd2.result); };
        rd2.readAsText(f,"windows-1255"); return;
      }
      done(txt);
    };
    rd.readAsText(f,"utf-8");
  }
}

/* ---------- ZIP: איתור הרשומות ופריסתן ---------- */
async function unzipAll(buf){
  var u8=new Uint8Array(buf), dv=new DataView(buf);
  // End Of Central Directory — סורקים מהסוף
  var eocd=-1;
  for(var i=u8.length-22;i>=Math.max(0,u8.length-70000);i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error("קובץ ZIP לא תקין");
  var count=dv.getUint16(eocd+10,true), cdOfs=dv.getUint32(eocd+16,true);
  var out={}, p=cdOfs;
  for(var n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    var method=dv.getUint16(p+10,true);
    var csize=dv.getUint32(p+20,true);
    var nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    var lho=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    // הכותרת המקומית קובעת איפה הדאטה מתחיל
    var lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
    var dataStart=lho+30+lnlen+lelen;
    var raw=u8.subarray(dataStart,dataStart+csize);
    if(method===0){ out[name]=raw; }
    else if(method===8){
      var ds=new DecompressionStream("deflate-raw");
      var stream=new Blob([raw]).stream().pipeThrough(ds);
      out[name]=new Uint8Array(await new Response(stream).arrayBuffer());
    }
    p+=46+nlen+elen+clen;
  }
  return out;
}
function xmlOf(bytes){ return new DOMParser().parseFromString(new TextDecoder("utf-8").decode(bytes),"application/xml"); }
function colToIdx(ref){ // "BC12" -> 54
  var m=/^([A-Z]+)/.exec(ref); if(!m) return 0;
  var c=0; for(var i=0;i<m[1].length;i++) c=c*26+(m[1].charCodeAt(i)-64);
  return c-1;
}

/* ---------- XLSX → רשת תאים ---------- */
async function parseXlsx(buf,fname,onGrid,nameEl){
  var files=await unzipAll(buf);
  // מחרוזות משותפות
  var shared=[];
  if(files["xl/sharedStrings.xml"]){
    var sst=xmlOf(files["xl/sharedStrings.xml"]);
    Array.prototype.forEach.call(sst.getElementsByTagName("si"),function(si){
      var s=""; Array.prototype.forEach.call(si.getElementsByTagName("t"),function(t){ s+=t.textContent; });
      shared.push(s);
    });
  }
  // שמות גיליונות
  var sheets=[];
  if(files["xl/workbook.xml"]){
    var wb=xmlOf(files["xl/workbook.xml"]);
    var rels={};
    if(files["xl/_rels/workbook.xml.rels"]){
      Array.prototype.forEach.call(xmlOf(files["xl/_rels/workbook.xml.rels"]).getElementsByTagName("Relationship"),function(r){
        rels[r.getAttribute("Id")]="xl/"+r.getAttribute("Target").replace(/^\//,"").replace(/^xl\//,"");
      });
    }
    Array.prototype.forEach.call(wb.getElementsByTagName("sheet"),function(s){
      var rid=s.getAttribute("r:id")||s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
      var path=rels[rid]||("xl/worksheets/sheet"+(sheets.length+1)+".xml");
      if(files[path]) sheets.push({name:s.getAttribute("name")||("גיליון "+(sheets.length+1)),path:path});
    });
  }
  if(!sheets.length){
    Object.keys(files).forEach(function(k){
      if(/^xl\/worksheets\/sheet\d+\.xml$/.test(k)) sheets.push({name:k.replace(/^.*\//,""),path:k});
    });
  }
  if(!sheets.length) throw new Error("לא נמצאו גיליונות בקובץ");

  function sheetToGrid(path){
    var doc=xmlOf(files[path]), rows=[];
    Array.prototype.forEach.call(doc.getElementsByTagName("row"),function(rowEl){
      var cells=[];
      Array.prototype.forEach.call(rowEl.getElementsByTagName("c"),function(c){
        var idx=colToIdx(c.getAttribute("r")||"");
        var t=c.getAttribute("t")||"";
        var v="";
        if(t==="inlineStr"){
          var is=c.getElementsByTagName("is")[0];
          if(is){ Array.prototype.forEach.call(is.getElementsByTagName("t"),function(tt){ v+=tt.textContent; }); }
        }else{
          var vEl=c.getElementsByTagName("v")[0];
          if(vEl){ v=vEl.textContent; if(t==="s") v=shared[Number(v)]!=null?shared[Number(v)]:""; }
        }
        cells[idx]=v;
      });
      for(var i=0;i<cells.length;i++) if(cells[i]==null) cells[i]="";
      rows.push(cells);
    });
    return rows;
  }

  function nonEmpty(grid){ return grid.filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); }); }

  /* יעד שהוא מסך פתוח (onGrid) — בוחרים גיליון *בתוך* אותו מסך.
     קודם נפתח כאן מודל בחירה, והוא דרס את מסך הייבוא עצמו: הנתונים
     נמסרו ל-DOM שכבר לא היה קיים, וזה נראה כאילו הקובץ לא נקלט. */
  if(onGrid){
    XLPICK={fname:fname,nameEl:nameEl,onGrid:onGrid,
            grids:sheets.map(function(s){ return {name:s.name,grid:nonEmpty(sheetToGrid(s.path))}; })};
    var first=0;
    for(var si=0;si<XLPICK.grids.length;si++) if(XLPICK.grids[si].grid.length){ first=si; break; }
    xlPickSheet(first);
    return;
  }
  if(sheets.length===1){ xlsxGridToTextarea(sheetToGrid(sheets[0].path),fname+" · "+sheets[0].name); return; }
  // מסך הייבוא הרגיל (לא מודל) — שם מודל בחירה בטוח
  openModal({title:"באיזה גיליון להשתמש?",bodyHtml:
    '<div class="field"><label>הקובץ מכיל '+sheets.length+' גיליונות</label><select id="xl-sheet">'+
      sheets.map(function(s,i){return '<option value="'+i+'">'+esc(s.name)+'</option>';}).join("")+
    '</select></div>',
    saveLabel:"טען גיליון",onSave:function(){
      var s=sheets[Number(val("xl-sheet"))||0];
      xlsxGridToTextarea(sheetToGrid(s.path),fname+" · "+s.name);
    }});
}

function impDate(v){
  var s=String(v==null?"":v).trim(); if(!s) return todayISO();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  // מספר סידורי של אקסל (ימים מ-30/12/1899) — כך מגיעים תאריכים מקובץ xlsx
  if(/^\d+(\.\d+)?$/.test(s)){
    var n=parseFloat(s);
    if(n>=15000 && n<=80000){
      var d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);
      return d.toISOString().slice(0,10);
    }
  }
  var p=s.split(/[\/.\-]/);
  if(p.length===3){ var y=p[2].length===4?p[2]:("20"+p[2]);
    return y+"-"+String(p[1]).trim().padStart(2,"0")+"-"+String(p[0]).trim().padStart(2,"0"); }
  return todayISO();
}

      '<div class="hint">בטל את הסימון אם הדבקת רשימה נקייה בלי כותרות.</div></div>'+
    '<div class="field"><label>העלה קובץ או הדבק</label>'+
      '<div class="toolbar" style="margin-bottom:8px">'+
        '<button class="btn" onclick="document.getElementById(\'im-file\').click()">📁 העלה קובץ אקסל (.xlsx / .csv)</button>'+
        '<input type="file" id="im-file" accept=".xlsx,.csv" style="display:none" onchange="readImportFile(this)">'+
        '<span id="im-file-name" class="muted"></span>'+
      '</div>'+
      '<textarea id="im-data" rows="8" placeholder="או: סמן באקסל → Ctrl+C → הדבק כאן Ctrl+V"></textarea></div>'+
    '<button class="btn btn-primary" onclick="parseImport()">נתח עמודות ←</button>'+
    '<div class="hint">בהוצאות: זוגות עמודות <b>משלם</b>+<b>אחוז</b> יזוהו אוטומטית ויהפכו לחלוקת השותפים של כל שורה.<br>'+
    'פרוייקטים, שותפים, סוגי הוצאה וחשבונות <b>ייווצרו אוטומטית</b> לפי השם אם עדיין אינם קיימים.</div>'+
   '</div><div id="im-preview"></div>';
}

function parseImport(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var raw=val("im-data").trim(); if(!raw){ toast("לא הודבקו נתונים","err"); return; }
  var hasHeader=checked("im-hasheader");
  var sep=raw.indexOf("\t")>=0?"\t":",";
  var all=parseDelimited(raw,sep);
  if(!all.length){ toast("לא זוהו שורות","err"); return; }
  if(hasHeader && all.length<2){ toast("צריך שורת כותרות + לפחות שורה אחת (או בטל את סימון הכותרות)","err"); return; }
  var headers, rows;
  if(hasHeader){ headers=all[0]; rows=all.slice(1); }
  else{
    rows=all;
    var maxc=rows.reduce(function(n,r){return Math.max(n,r.length);},1);
    headers=[]; for(var ci=0;ci<maxc;ci++) headers.push("עמודה "+(ci+1));
  }
  var type=val("im-type")||"expenses";
  window._imp={headers:headers,rows:rows,type:type,hasHeader:hasHeader,
    pairs:(type==="expenses"?detectSplitPairs(headers):[])};

  var def=IMPORT_TYPES[type];
  var usedCols={};
  function sel(f){
    var chosen=-1;
    headers.forEach(function(hh,i){ if(chosen<0 && f.hints.some(function(t){return hh.indexOf(t)>=0;})) chosen=i; });
    // שדה חובה שלא זוהה לפי הכותרת (למשל רשימה בלי כותרות) — קח את העמודה הפנויה הראשונה
    if(chosen<0 && !f.opt){ for(var i=0;i<headers.length;i++){ if(!usedCols[i]){ chosen=i; break; } } }
    if(chosen>=0) usedCols[chosen]=1;
    return '<option value="-1">— ללא —</option>'+headers.map(function(hh,i){
      return '<option value="'+i+'"'+(i===chosen?" selected":"")+'>'+esc(hh)+'</option>'; }).join("");
  }
  var h='<div class="card"><h3>מיפוי עמודות — '+esc(def.label)+'</h3>'+
    '<p class="muted">בחר לכל שדה את העמודה המתאימה. שדות עם * הם חובה.</p><div class="form-grid">'+
    def.fields.map(function(f){
      return '<div class="field"><label>'+esc(f.l)+(f.opt?'':' <span class="neg">*</span>')+'</label>'+
        '<select id="mp-'+f.k+'">'+sel(f)+'</select></div>'; }).join("")+
    '</div>';
  if(type==="expenses"){
    var pairs=window._imp.pairs;
    h+='<div class="section-title">חלוקת שותפים</div>'+
      (pairs.length
        ? '<div class="hint"><span class="pos">✅ זוהו '+pairs.length+' זוגות</span> — '+
          pairs.map(function(p){return esc(headers[p.n])+"+"+esc(headers[p.p]);}).join(" · ")+
          '<br>לכל שורה תיווצר חלוקה משלה לפי הערכים בעמודות האלה.</div>'
        : '<div class="hint neg">לא זוהו זוגות משלם/אחוז — תוחל חלוקת ברירת המחדל של הפרוייקט.</div>');
  }
  h+='<div class="toolbar" style="margin-top:16px"><button class="btn btn-primary" onclick="commitImport()">ייבא '+rows.length+' שורות</button></div></div>';
  h+='<div class="card"><h3>תצוגה מקדימה</h3><div class="table-wrap"><table class="tbl"><thead><tr>'+
    headers.map(function(hh){return '<th>'+esc(hh)+'</th>';}).join("")+'</tr></thead><tbody>'+
    rows.slice(0,8).map(function(r){return '<tr>'+headers.map(function(_,i){return '<td>'+esc(r[i]||"")+'</td>';}).join("")+'</tr>';}).join("")+
    '</tbody></table></div>'+(rows.length>8?'<div class="hint">מוצגות 8 מתוך '+rows.length+' שורות</div>':'')+'</div>';
  document.getElementById("im-preview").innerHTML=h;
}

function commitImport(force){
  if(!can("edit")){ toast("אין הרשאה לייבא","err"); return; }
  var imp=window._imp; if(!imp){ toast("יש לנתח קודם","err"); return; }
  // המיפוי נקרא מה-DOM רק כשתפריטי המיפוי עדיין על המסך.
  // אחרי הצגת תוצאות הם מוחלפים, ולכן בייבוא חוזר משתמשים במיפוי שנשמר.
  var flds=IMPORT_TYPES[imp.type].fields, m={};
  if(document.getElementById("mp-"+flds[0].k)){
    flds.forEach(function(f){ m[f.k]=Number(val("mp-"+f.k)); });
    imp.map=m;
    imp.defApt=val("im-apt");
  } else {
    m=imp.map||{};
    flds.forEach(function(f){ if(typeof m[f.k]!=="number"||isNaN(m[f.k])) m[f.k]=-1; });
  }
  var defApt=(document.getElementById("im-apt")?val("im-apt"):(imp.defApt||""));
  var beforeA=active(DB.apartments).length, beforeP=active(DB.partners).length;
  var res={created:0,skipped:0,newApts:0,newPartners:0,reason:"",skippedRows:[],skippedRaw:[],
           autoExpenses:0,forced:!!force,sumCreated:0,sumSkipped:0,missingNames:{}};

  function skip(idx,reason,r){
    res.skipped++; res.reason=reason;
    if(typeof m.amount==="number" && m.amount>=0 && r) res.sumSkipped+=impNum(r[m.amount]);
    // שורות שדולגו כי הן כפילות — אין טעם לנסות שוב; השאר ניתנות לייבוא כפוי
    if(reason.indexOf("ייבוא חוזר")<0 && r) res.skippedRaw.push(r);
    if(res.skippedRows.length<1000){
      res.skippedRows.push({line:idx+(imp.hasHeader?2:1),reason:reason,
        preview:(r||[]).map(function(c){return String(c==null?"":c).trim();}).filter(function(c){return c;}).join(" | ").slice(0,160)});
    }
  }

  function aptFor(r){
    var name=(m.apartment>=0)?String(r[m.apartment]||"").trim():"";
    if(name) return findOrCreateApartment(name);
    return defApt||null;
  }

  if(imp.type==="apartments"){
    if(m.name<0){ toast("חובה למפות את עמודת השם","err"); return; }
    imp.rows.forEach(function(r,idx){
      var nm=String(r[m.name]||"").trim();
      if(!nm){ skip(idx,"שורה ריקה",r); return; }
      var nmk=normKey(nm);
      if(active(DB.apartments).some(function(a){return normKey(a.name)===nmk;})){
        skip(idx,"כבר קיים פרוייקט בשם הזה",r); return;
      }
      var id=findOrCreateApartment(nm);
      if(id && m.note>=0){ var a=byId(DB.apartments,id); if(a) a.notes=String(r[m.note]||""); }
      res.created++;
    });
  }
  else if(imp.type==="expenses"){
    if(m.desc<0||m.amount<0){ toast("חובה למפות תיאור וסכום","err"); return; }
    var splitFreq={}, noSplit=[];
    /* קובץ שיוצא מהמערכת מכיל גם את שורת שלב-האב (הסיכום) וגם את
       תתי-השלבים. אם נייבא את שתיהן הכסף ייספר פעמיים, ולכן כל שורה
       ששמה מופיע בעמודת "שלב-אב" של שורה אחרת מזוהה כשורת סיכום ומדולגת. */
    var summaryNames={};
    if(m.parent>=0) imp.rows.forEach(function(r){
      var pn=String(r[m.parent]||"").trim(), dn=String(r[m.desc]||"").trim();
      if(pn && normKey(pn)!==normKey(dn)) summaryNames[normKey(pn)]=pn;
    });
    imp.rows.forEach(function(r,idx){
      var aptId=aptFor(r); if(!aptId){ skip(idx,"לא זוהה פרוייקט (עמודת הפרויקט ריקה ולא נבחר פרוייקט ברירת מחדל)",r); return; }
      var desc=String(r[m.desc]||"").trim(); var amt=impNum(r[m.amount]);
      if(!desc && !amt){ skip(idx,"שורה ריקה — אין תיאור ואין סכום",r); return; }
      if(desc && summaryNames[normKey(desc)]){
        skip(idx,'שורת שלב-אב ("'+desc+'") — הסכום שלה הוא סך תתי-השלבים ולכן היא לא מיובאת, כדי שהכסף לא ייספר פעמיים',r); return;
      }
      var dt=(m.date>=0?impDate(r[m.date]):todayISO());
      // הגנה מפני ייבוא כפול: אותו פרוייקט + תיאור + סכום + תאריך
      if(apExpenses(aptId).some(function(x){
           return String(x.description).trim()===desc && Math.abs((Number(x.amount)||0)-amt)<0.01 && x.date===dt; })){
        skip(idx,"הוצאה זהה כבר קיימת (ייבוא חוזר)",r); return;
      }
      var eid=uid();
      DB.expenses.push({id:eid,apartmentId:aptId,
        categoryId:(m.category>=0?findOrCreateCategory(r[m.category]):""),
        classification:(m.classification>=0?classifyText(r[m.classification]):"investment"),
        description:desc||"(ללא תיאור)",amount:amt,date:dt,
        note:(m.note>=0?String(r[m.note]||""):""),
        hasInvoice:false,invoiceLink:"",mgmtEnabled:false,mgmtBaseType:"full",mgmtVatRate:18,deleted:false});
      /* שיוך לשלב-אב לפי שם: אם האב לא קיים — נוצר אוטומטית בסכום 0 */
      if(m.parent>=0){
        var pName=String(r[m.parent]||"").trim();
        if(pName && normKey(pName)!==normKey(desc)){
          var pk=normKey(pName);
          var par=apExpenses(aptId).find(function(x){ return normKey(x.description)===pk && !x.parentId; });
          if(!par){
            var pid2=uid();
            DB.expenses.push({id:pid2,apartmentId:aptId,categoryId:"",classification:byId(DB.expenses,eid).classification,
              description:pName,amount:0,date:dt,note:"שלב-אב (נוצר בייבוא)",hasInvoice:false,invoiceLink:"",
              mgmtEnabled:false,mgmtBaseType:"full",mgmtVatRate:18,parentId:null,deleted:false});
            par=byId(DB.expenses,pid2);
          }
          /* אב שיש עליו כסף משלו הופך למכל — כספו עובר לתת-שלב ראשון בשקט */
          if(par && !par.parentId) convertToContainer(par.id,true);
          if(par && !par.parentId) byId(DB.expenses,eid).parentId=par.id;
        }
      }
      var split=[];
      (imp.pairs||[]).forEach(function(pr){
        var nm=String(r[pr.n]||"").trim(); var pc=impNum(r[pr.p]);
        if(nm && pc>0){ var pid=findOrCreatePartner(nm); if(pid) split.push({partnerId:pid,percent:pc}); }
      });
      if(!split.length){ split=apPartners(aptId).map(function(x){return {partnerId:x.partnerId,percent:x.defaultPercent};}); }
      // אין חלוקה בשורה וגם אין עדיין ברירת מחדל לפרוייקט — נשלים בסוף הייבוא
      if(!split.length) noSplit.push({eid:eid,aptId:aptId});
      split.forEach(function(s){ DB.expenseSplits.push({id:uid(),expenseId:eid,partnerId:s.partnerId,percent:s.percent,deleted:false}); });
      if(split.length){   // סופרים תדירות של כל חלוקה, כדי לבחור ברירת מחדל מייצגת
        var sig=split.map(function(s){return s.partnerId+":"+s.percent;}).sort().join("|");
        if(!splitFreq[aptId]) splitFreq[aptId]={};
        if(!splitFreq[aptId][sig]) splitFreq[aptId][sig]={count:0,split:split};
        splitFreq[aptId][sig].count++;
      }
      res.created++; res.sumCreated+=amt;
    });
    // פרוייקט שאין בה עדיין שותפים — ברירת המחדל היא החלוקה הנפוצה ביותר בייבוא,
    // ולא הראשונה שנתקלנו בה (שורה חריגה בתחילת הגיליון הייתה מטה את הכל)
    Object.keys(splitFreq).forEach(function(aptId){
      if(apPartners(aptId).length) return;
      var best=null;
      Object.keys(splitFreq[aptId]).forEach(function(sig){
        var e=splitFreq[aptId][sig];
        if(!best || e.count>best.count) best=e;
      });
      if(!best) return;
      best.split.forEach(function(s){
        DB.apartmentPartners.push({id:uid(),apartmentId:aptId,partnerId:s.partnerId,defaultPercent:s.percent,deleted:false});
      });
    });
    // עכשיו שיש ברירת מחדל — משלימים חלוקה להוצאות שנוצרו בלי אף שותף,
    // אחרת העלות שלהן לא משויכת לאיש והדוחות לא יסתכמו לעלות הכוללת
    noSplit.forEach(function(x){
      if(expSplits(x.eid).length) return;
      apPartners(x.aptId).forEach(function(p){
        DB.expenseSplits.push({id:uid(),expenseId:x.eid,partnerId:p.partnerId,percent:p.defaultPercent,deleted:false});
      });
    });
    /* סכום כל שלב-אב = סך תתי-השלבים שנוצרו תחתיו */
    var touched={}; imp.rows.forEach(function(r){ var ai=aptFor(r); if(ai) touched[ai]=1; });
    Object.keys(touched).forEach(function(ai){ syncAllParents(ai); });
  }
  else if(imp.type==="payments"){
    if(m.expense<0||m.amount<0){ toast("חובה למפות 'עבור' וסכום","err"); return; }
    /* אינדקס הוצאות לכל פרוייקט: התאמה מדויקת ואחריה התאמה מנורמלת.
       גם מהיר בהרבה מ-find על כל שורה כשיש אלפי הוצאות. */
    var expIdx={};
    function idxFor(aptId){
      if(expIdx[aptId]) return expIdx[aptId];
      /* שלב-אב אינו מקבל תשלומים — הכסף יושב בתת-השלב. אילו היינו
         מצמידים אליו תשלום, הוא היה נעלם מכל חישובי הכסף (שעובדים על
         עלים בלבד) אבל כן נספר ברשימת התשלומים. */
      var ix={exact:{},norm:{},cont:{}};
      apExpenses(aptId).forEach(function(x){
        var d=String(x.description).trim(), nk=normKey(d);
        if(isContainer(x.id)){ ix.cont[d]=x; ix.cont[nk]=x; return; }
        if(!ix.exact[d]) ix.exact[d]=x;
        if(!ix.norm[nk]) ix.norm[nk]=x;
      });
      expIdx[aptId]=ix; return ix;
    }
    imp.rows.forEach(function(r,idx){
      var aptId=aptFor(r); if(!aptId){ skip(idx,"לא זוהה פרוייקט",r); return; }
      var target=String(r[m.expense]||"").trim();
      var ix=idxFor(aptId);
      var e=ix.exact[target] || ix.norm[normKey(target)];
      var amt=impNum(r[m.amount]);
      if(!e && target && (ix.cont[target]||ix.cont[normKey(target)])){
        var ct=ix.cont[target]||ix.cont[normKey(target)];
        skip(idx,'"'+target+'" הוא שלב-אב — יש לרשום את התשלום באחד מתתי-השלבים שלו ('+
          expenseChildren(ct.id).map(function(k){return k.description;}).join(", ")+')',r); return;
      }
      if(!e && target){
        res.missingNames[target]=(res.missingNames[target]||0)+1;
      }
      if(!e){
        if(force && target && amt>0){
          // ייבוא כפוי: ההוצאה לא קיימת בגיליון ההוצאות — ניצור אותה לפי התשלום
          var neid=uid();
          DB.expenses.push({id:neid,apartmentId:aptId,categoryId:"",
            classification:(m.classification>=0 && String(r[m.classification]||"").trim())?classifyText(r[m.classification]):"investment",
            description:target,amount:amt,date:(m.date>=0?impDate(r[m.date]):todayISO()),
            note:"נוצרה אוטומטית מייבוא תשלומים",hasInvoice:false,invoiceLink:"",
            mgmtEnabled:false,mgmtBaseType:"full",mgmtVatRate:18,deleted:false});
          apPartners(aptId).forEach(function(x){
            DB.expenseSplits.push({id:uid(),expenseId:neid,partnerId:x.partnerId,percent:x.defaultPercent,deleted:false}); });
          e=byId(DB.expenses,neid); res.autoExpenses++;
          idxFor(aptId).exact[target]=e; idxFor(aptId).norm[normKey(target)]=e;
        } else { skip(idx,'לא נמצאה הוצאה בשם "'+target+'"',r); return; }
      }
      if(amt<=0){ skip(idx,"סכום ריק או אפס",r); return; }
      /* עמודת סיווג בגיליון התשלומים מתייחסת להוצאה — מעדכנים אותה
         רק כשהתא מלא, כדי לא לדרוס סיווג קיים בשורות שהשאירו ריק */
      if(m.classification>=0){
        var clsRaw=String(r[m.classification]||"").trim();
        if(clsRaw) e.classification=classifyText(clsRaw);
      }
      var pdt=(m.date>=0?impDate(r[m.date]):todayISO());
      var accId=(m.account>=0)?findOrCreateAccount(aptId,r[m.account]):null;
      var isBank=accountIsBank(accId);
      var payer=(!isBank && m.payer>=0)?findOrCreatePartner(r[m.payer]):null;
      var pnote=(m.note>=0?String(r[m.note]||""):"");
      /* זיהוי כפילות חייב לכלול גם מי שילם, מאיזה חשבון ומה ההערה.
         קודם נבדקו רק סכום+תאריך, ולכן שני תשלומים לגיטימיים של שותפים
         שונים באותו יום ובאותו סכום — השני נחשב "כפילות" ונזרק. */
      if(expPayments(e.id).some(function(p){
           return Math.abs((Number(p.amount)||0)-amt)<0.01 && p.date===pdt &&
                  (p.payerPartnerId||null)===(payer||null) &&
                  (p.accountId||null)===(accId||null) &&
                  String(p.note||"")===pnote; })){
        skip(idx,"תשלום זהה לחלוטין כבר קיים (ייבוא חוזר)",r); return;
      }
      DB.payments.push({id:uid(),expenseId:e.id,
        date:pdt,amount:amt,
        accountId:accId,payerPartnerId:payer,
        method:(m.method>=0?methodText(r[m.method]):"transfer"),
        recipientType:"supplier",recipientManagerId:null,
        hasInvoice:(m.invoice>=0 && /כן|✔|✓|v|true|1/i.test(String(r[m.invoice]||""))),
        invoiceStatus:(m.invoice>=0 && /כן|✔|✓|v|true|1/i.test(String(r[m.invoice]||"")))?"has":"",
        invoiceLink:"",note:pnote,deleted:false});
      res.created++; res.sumCreated+=amt;
    });
  }
  else if(imp.type==="deposits"){
    if(m.partner<0||m.amount<0){ toast("חובה למפות שותף וסכום","err"); return; }
    imp.rows.forEach(function(r,idx){
      var aptId=aptFor(r); if(!aptId){ skip(idx,"לא זוהה פרוייקט",r); return; }
      var pid=findOrCreatePartner(r[m.partner]); var amt=impNum(r[m.amount]);
      if(!pid||amt<=0){ skip(idx,"חסר שותף או סכום",r); return; }
      var ddt=(m.date>=0?impDate(r[m.date]):todayISO());
      if(apDeposits(aptId).some(function(d){ return d.partnerId===pid && Math.abs((Number(d.amount)||0)-amt)<0.01 && d.date===ddt; })){
        skip(idx,"הפקדה זהה כבר קיימת (ייבוא חוזר)",r); return;
      }
      var a=byId(DB.apartments,aptId); if(a && !a.hasBank) a.hasBank=true;
      DB.deposits.push({id:uid(),apartmentId:aptId,partnerId:pid,amount:amt,
        date:ddt,
        note:(m.note>=0?String(r[m.note]||""):""),deleted:false});
      res.created++; res.sumCreated+=amt;
    });
  }
  else if(imp.type==="income"){
    if(m.desc<0||m.amount<0){ toast("חובה למפות תיאור וסכום","err"); return; }
    imp.rows.forEach(function(r,idx){
      var aptId=aptFor(r); if(!aptId){ skip(idx,"לא זוהה פרוייקט",r); return; }
      var amt=impNum(r[m.amount]);
      var idesc=String(r[m.desc]||"").trim()||"(ללא תיאור)";
      var idt=(m.date>=0?impDate(r[m.date]):todayISO());
      if(apIncome(aptId).some(function(x){ return String(x.description).trim()===idesc && Math.abs((Number(x.amount)||0)-amt)<0.01 && x.date===idt; })){
        skip(idx,"הכנסה זהה כבר קיימת (ייבוא חוזר)",r); return;
      }
      DB.income.push({id:uid(),apartmentId:aptId,description:idesc,
        amount:amt,date:idt,
        note:(m.note>=0?String(r[m.note]||""):""),deleted:false});
      res.created++; res.sumCreated+=amt;
    });
  }

  res.newApts=active(DB.apartments).length-beforeA;
  res.newPartners=active(DB.partners).length-beforeP;
  window._impSkipped=res.skippedRaw;
  save();
  toast("יובאו "+res.created+" שורות"+(res.skipped?" · דולגו "+res.skipped:""),res.skipped?"warn":"ok");
  showImportResult(res);
}

/* ייבוא כפוי של השורות שדולגו (למעט כפילויות) */
function retrySkipped(){
  var imp=window._imp, rows=window._impSkipped||[];
  if(!imp||!rows.length){ toast("אין שורות לייבוא חוזר","warn"); return; }
  if(!confirm("ייובאו "+rows.length+" השורות שדולגו.\n\n"+
    (imp.type==="payments"
      ? "לתשלום שלא נמצאה לו הוצאה — תיווצר הוצאה חדשה בשם שבעמודת \"עבור\", בסכום התשלום.\n\n"
      : "שורות ללא פרוייקט ישויכו לפרוייקט ברירת המחדל שבחרת למעלה.\n\n")+
    "כפילויות ידולגו בכל מקרה. להמשיך?")) return;
  imp.rows=rows;
  commitImport(true);
}

function showImportResult(res){
  var box=document.getElementById("im-preview"); if(!box) return;
  window._lastImportRes=res;
  var h='<div class="card"><h3>✅ הייבוא הושלם'+(res.forced?" (ייבוא כפוי)":"")+'</h3><div class="stat-grid">'+
    stat("נוצרו רשומות",num(res.created))+
    stat("דולגו",num(res.skipped),res.skipped?"neg":"pos")+
    stat("פרוייקטים חדשים",num(res.newApts))+
    stat("שותפים חדשים",num(res.newPartners))+
    (res.autoExpenses?stat("הוצאות שנוצרו אוטומטית",num(res.autoExpenses)):"")+
    '</div>'+
    '<div class="stat-grid" style="margin-top:10px">'+
      stat("סכום שיובא",money(res.sumCreated))+
      stat("סכום שדולג",money(res.sumSkipped),res.sumSkipped?"neg":"pos")+
      stat("סה\"כ בקובץ",money(res.sumCreated+res.sumSkipped))+
    '</div>'+
    '<div class="hint">השווה את <b>"סה\"כ בקובץ"</b> לסכום באקסל — כך תדע מיד אם משהו לא נקלט.</div>';
  if(res.skipped){
    var byReason={};
    res.skippedRows.forEach(function(s){ byReason[s.reason]=(byReason[s.reason]||0)+1; });
    h+='<div class="section-title">למה דולגו</div><div class="table-wrap"><table class="tbl"><thead><tr>'+
      '<th>סיבה</th><th>כמות</th></tr></thead><tbody>'+
      Object.keys(byReason).sort(function(a,b){return byReason[b]-byReason[a];}).map(function(k){
        return '<tr><td>'+esc(k)+'</td><td><b>'+byReason[k]+'</b></td></tr>'; }).join("")+
      '</tbody></table></div>';
    var miss=Object.keys(res.missingNames||{});
    if(miss.length){
      miss.sort(function(a,b){ return res.missingNames[b]-res.missingNames[a]; });
      var missTot=miss.reduce(function(s,k){return s+res.missingNames[k];},0);
      h+='<div class="section-title">שמות שלא נמצאה להם הוצאה ('+miss.length+' שמות · '+missTot+' שורות)</div>'+
        '<div class="hint">אלה השמות מעמודת "עבור" שאין להם הוצאה תואמת בפרוייקט. '+
        'או שההוצאה לא יובאה, או שהשם כתוב אחרת בגיליון ההוצאות.</div>'+
        '<div class="table-wrap" style="max-height:260px;overflow:auto"><table class="tbl"><thead><tr>'+
        '<th>השם בעמודת "עבור"</th><th>כמה שורות</th></tr></thead><tbody>'+
        miss.slice(0,200).map(function(k){
          return '<tr><td>'+esc(k)+'</td><td><b>'+res.missingNames[k]+'</b></td></tr>'; }).join("")+
        '</tbody></table></div>'+
        (miss.length>200?'<div class="hint">מוצגים 200 מתוך '+miss.length+'</div>':'');
    }
    h+='<div class="section-title">השורות שדולגו</div>'+
      '<div class="table-wrap" style="max-height:340px;overflow:auto"><table class="tbl"><thead><tr>'+
      '<th>שורה באקסל</th><th>סיבה</th><th>תוכן השורה</th></tr></thead><tbody>'+
      res.skippedRows.map(function(s){
        return '<tr><td>'+s.line+'</td><td class="neg">'+esc(s.reason)+'</td><td>'+esc(s.preview)+'</td></tr>'; }).join("")+
      '</tbody></table></div>';
    h+='<div class="toolbar" style="margin-top:12px">'+
      ((res.skippedRaw&&res.skippedRaw.length)
        ? '<button class="btn btn-primary" onclick="retrySkipped()">🔁 ייבא בכל זאת את הדולגים ('+res.skippedRaw.length+')</button>'
        : '')+
      '<button class="btn" onclick="copySkipped()">📋 העתק רשימה</button></div>'+
      ((res.skippedRaw&&res.skippedRaw.length)?'<div class="hint">"ייבא בכל זאת" מייבא רק את מה שדולג מסיבה שניתן לעקוף. כפילויות תמיד ידולגו.</div>':'');
  }
  h+='<div class="toolbar" style="margin-top:12px"><button class="btn" onclick="go(\'dashboard\',{})">לפרוייקטים ←</button>'+
    '<button class="btn" onclick="go(\'import\',{})">ייבוא נוסף</button></div></div>';
  box.innerHTML=h;
}
function copySkipped(){
  var res=window._lastImportRes;
  if(!res||!res.skippedRows.length){ toast("אין מה להעתיק","warn"); return; }
  var txt="שורה\tסיבה\tתוכן\n"+res.skippedRows.map(function(s){ return s.line+"\t"+s.reason+"\t"+s.preview; }).join("\n");
  try{ navigator.clipboard.writeText(txt); toast("הרשימה הועתקה ללוח","ok"); }
  catch(e){ toast("לא ניתן להעתיק בדפדפן הזה","err"); }
}

/* ---------- סל מחזור ---------- */
function moduleRecycle(){
  var h='<h2>🗑️ סל מחזור</h2><p class="muted">פריטים שנמחקו נשמרים כאן וניתן לשחזר אותם. שום דבר לא נמחק פיזית.</p>'+
    '<div class="toolbar">'+searchBox("rc-q",Q.recycle,"חיפוש בפריטים שנמחקו…","Q.recycle=this.value;renderRecycleList()")+
    '<select style="max-width:170px" onchange="Q.recycleWhen=this.value;renderRecycleList()">'+
      [["","כל התקופות"],["1","נמחק היום"],["7","7 הימים האחרונים"],["30","30 הימים האחרונים"]].map(function(o){
        return '<option value="'+o[0]+'"'+(Q.recycleWhen===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+
    '</select>'+
    ((Q.recycle||Q.recycleWhen)?'<button class="btn btn-ghost btn-sm" onclick="Q.recycle=\'\';Q.recycleWhen=\'\';rerender()">✕ נקה</button>':'')+
    '</div>'+
    '<div id="rc-list">'+recycleListHtml()+'</div>';
  return h;
}
/* תאריך ושעה של המחיקה. פריט ישן (לפני שהייתה חותמת) מוצג כ"לא ידוע". */
function delStampHtml(it){
  if(!it.deletedAt) return '<span class="muted" title="נמחק לפני שהמערכת התחילה לתעד זמני מחיקה">לא ידוע</span>';
  var d=new Date(it.deletedAt);
  if(isNaN(d.getTime())) return '<span class="muted">לא ידוע</span>';
  var p=function(n){ return (n<10?"0":"")+n; };
  return dateHe(it.deletedAt.slice(0,10))+' <span class="muted">'+p(d.getHours())+':'+p(d.getMinutes())+'</span>';
}
function delWithinDays(it,days){
  if(!days) return true;
  if(!it.deletedAt) return false;                 // בלי חותמת אין איך לסנן לפי זמן
  var t=Date.parse(it.deletedAt); if(isNaN(t)) return false;
  return (Date.now()-t) <= Number(days)*86400000;
}
function renderRecycleList(){ return withIndex(function(){ return renderRecycleListInner(); }); }
function renderRecycleListInner(){
  var el=document.getElementById("rc-list"); if(el) el.innerHTML=recycleListHtml();
}
function recycleListHtml(){
  var groups=[["apartments","פרוייקטים"],["partners","שותפים"],["apartmentPartners","שותפי פרוייקט"],["managers","מנהלים"],
    ["categories","קטגוריות"],["expenses","הוצאות"],["payments","תשלומים"],["deposits","הפקדות"],["income","הכנסות"],
    ["withdrawals","משיכות רווח"],["accounts","חשבונות"],["bankMoves","שורות בנק"],["stmtBanks","בנקים"],["users","משתמשים"]];
  var h='';
  var any=false;
  groups.forEach(function(g){
    var items=(DB[g[0]]||[]).filter(function(x){
      return x.deleted && delWithinDays(x,Q.recycleWhen) &&
        matches(Q.recycle, recycleLabel(g[0],x)+" "+g[1]+" "+(x.deletedByUser||"")); });
    if(!items.length) return; any=true;
    /* האחרון שנמחק למעלה — זה מה שמחפשים כשרוצים לשחזר טעות */
    items.sort(function(a,b){ return String(b.deletedAt||"").localeCompare(String(a.deletedAt||"")); });
    h+='<div class="card"><h3>'+g[1]+' ('+items.length+')</h3><div class="table-wrap"><table class="tbl"><thead><tr>'+
      '<th>פריט</th><th>נמחק בתאריך</th><th>מי מחק</th><th></th></tr></thead><tbody>';
    items.forEach(function(it){
      h+='<tr><td>'+esc(recycleLabel(g[0],it))+'</td>'+
        '<td style="white-space:nowrap">'+delStampHtml(it)+'</td>'+
        '<td>'+esc(it.deletedByUser||"—")+'</td>'+
        '<td class="right"><button class="btn btn-sm" onclick="restoreItem(\''+g[0]+'\',\''+it.id+'\')">♻️ שחזר</button></td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  if(!any) h+='<div class="empty">'+((Q.recycle||Q.recycleWhen)?'לא נמצא פריט שמתאים לסינון':'סל המחזור ריק')+'</div>';
  return h;
}
function recycleLabel(entity,it){
  if(entity==="expenses"||entity==="income") return it.description+" — "+money(it.amount);
  if(entity==="payments") return money(it.amount)+" ("+dateHe(it.date)+")";
  if(entity==="deposits") return partnerName(it.partnerId)+" — "+money(it.amount);
  if(entity==="withdrawals") return partnerName(it.partnerId)+" — "+money(it.amount)+" ("+dateHe(it.date)+")";
  if(entity==="bankMoves") return (it.name||it.description||"שורת בנק")+" — "+money(it.amount)+" ("+dateHe(it.date)+")";
  if(entity==="apartmentPartners") return partnerName(it.partnerId)+" ("+num(it.defaultPercent)+"%)";
  return it.name||it.id;
}
function restoreItem(entity,id){ if(!can("edit")){ toast("אין הרשאה","err"); return; } var it=byId(DB[entity],id); if(it){ it.deleted=false; delete it.deletedBy; delete it.deletedAt; delete it.deletedByUser;
  if(entity==="managers"){ DB.expenseManagerFees.forEach(function(f){ if(f.managerId===id) f.deleted=false; }); }
  if(entity==="expenses"){
    /* שחזור שלב-אב מחזיר איתו את תתי-השלבים שנמחקו יחד איתו */
    var etag="expense:"+id, k=0;
    DB.expenses.forEach(function(x){ if(x.deleted && x.deletedBy===etag){ x.deleted=false; delete x.deletedBy; k++; } });
    if(k) toast("שוחזרו גם "+k+" תתי-שלבים","ok");
    if(it.parentId) syncParentAmount(it.parentId);
    if(isContainer(id)) syncParentAmount(id);
  }
  if(entity==="apartments"){
    var tag="apt:"+id, n=0;
    ["expenses","payments","expenseSplits","expenseManagerFees","deposits","income","managers","accounts","apartmentPartners"]
      .forEach(function(k){ (DB[k]||[]).forEach(function(x){
        if(x.deleted && x.deletedBy===tag){ x.deleted=false; delete x.deletedBy; n++; } }); });
    if(n) toast("שוחזרו גם "+n+" תנועות של הפרוייקט","ok");
  }
  save(); toast("שוחזר","ok"); rerender(); } }
</script>

<script>boot();</script>
