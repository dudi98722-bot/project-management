<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --brand:#2563eb; --brand-d:#1d4ed8; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  --chip:#eef2ff; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);direction:rtl;font-size:15px;line-height:1.5}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--brand)}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.hidden{display:none!important}
/* layout */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,var(--brand),var(--brand-d));color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;box-shadow:var(--shadow)}
.topbar .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.topbar .sp{flex:1}
.topbar select{width:auto;min-width:180px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}
.topbar select option{color:#111}
.topbar .who{font-size:13px;opacity:.95}
.nav{display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);padding:8px 18px;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:20}
.nav-item{padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.nav-item:hover{background:var(--chip)}
.nav-item.active{background:var(--brand);color:#fff}
.content{max-width:1200px;margin:0 auto;padding:20px 18px 80px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
/* cards & stats */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.stat .label{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .value{font-size:22px;font-weight:800;margin-top:4px}
.grid{display:grid;gap:14px}
.apt-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.apt-card{cursor:pointer;transition:.12s;border-top:4px solid var(--brand)}
.apt-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,24,40,.12)}
/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
table.tbl th,table.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.tbl th{background:#f8fafc;font-weight:700;color:#374151;position:sticky;top:0}
table.tbl tbody tr:hover{background:#f9fbff}
table.tbl tfoot td{font-weight:800;background:#f8fafc;border-top:2px solid var(--line)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:#f3f4f6}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-d)}
.btn-danger{background:#fff;border-color:#fecaca;color:var(--danger)}
.btn-danger:hover{background:#fef2f2}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:#f3f4f6}
.btn-sm{padding:5px 10px;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}
/* badges */
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.badge-ok{background:#dcfce7;color:#166534}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-muted{background:#eef2f7;color:#475569}
.pill{background:var(--chip);color:var(--brand-d);padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.muted{color:var(--muted)}
.pos{color:var(--ok);font-weight:700}
.neg{color:var(--danger);font-weight:700}
.center{text-align:center}.right{text-align:left}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.field{margin-bottom:10px}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .12s ease}
.modal.wide{max-width:920px}
@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:scale(1);opacity:1}}
.modal-header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{margin:0;font-size:17px}
.modal-body{padding:18px;max-height:70vh;overflow:auto}
.modal-footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start}
.x{cursor:pointer;font-size:22px;color:var(--muted);line-height:1;background:none;border:none}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#2563eb);padding:20px}
.login-card{background:#fff;border-radius:18px;padding:34px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-card h1{font-size:22px;margin:6px 0 4px}
.login-card p{color:var(--muted);margin:0 0 22px;font-size:14px}
/* toast */
#toasts{position:fixed;bottom:18px;left:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:#111827;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:14px;animation:pop .12s ease}
.toast.ok{background:var(--ok)}.toast.err{background:var(--danger)}.toast.warn{background:var(--warn)}
/* split rows */
.split-row,.mgr-row{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:center;margin-bottom:6px}
.sumline{display:flex;justify-content:space-between;padding:8px 2px;font-weight:700;border-top:1px dashed var(--line);margin-top:6px}
.section-title{font-weight:800;margin:16px 0 8px;font-size:15px;color:#334155;border-right:3px solid var(--brand);padding-right:8px}
.hint{font-size:12px;color:var(--muted);margin-top:2px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}.content{padding:14px}}
@media print{.topbar,.nav,.toolbar,.no-print{display:none!important}.content{max-width:100%}}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
"use strict";
/* ============================================================
   מערכת ניהול דירות ושותפויות — קובץ עצמאי
   אחסון: localStorage (מקור אמת מקומי) + סנכרון אופציונלי ל-Google Sheets
   ============================================================ */

/* ---------- קבועים ---------- */
var LSKEY = "apartmentsCRM_v1";
/* אחסון על השרת (VPS) — מקור האמת. מוטמע בקוד כדי שכל מכשיר יתחבר אוטומטית */
/* ---- גוגל שיטס = מקור האמת ----
   הכתובת מוטמעת כדי שכל מכשיר יתחבר אוטומטית.
   האבטחה אינה מסתמכת על סודיות הכתובת אלא על אימות בצד השרת:
   כל בקשה חייבת קוד כניסה תקף, אחרת ה-Apps Script לא מחזיר ולא שומר דבר. */
var SHEETS_URL = "https://script.google.com/macros/s/AKfycbxkuppsmvwlUDhg5ZfZlp7Kz9TRtEJ8XRhc0ihdDO-W5uCH8mxGWHF-wsr2WyopmgbIuQ/exec";
function sheetsUrl(){ return SHEETS_URL; }

/* hash של קוד הכניסה — נשמר ל-session בלבד (נמחק בסגירת הדפדפן) */
var AUTH_KEY = "apartmentsCRM_auth";
var AUTH = "";
function getAuth(){ if(AUTH) return AUTH; try{ return sessionStorage.getItem(AUTH_KEY)||""; }catch(e){ return ""; } }
function setAuth(h){ AUTH=h||""; try{ if(h) sessionStorage.setItem(AUTH_KEY,h); else sessionStorage.removeItem(AUTH_KEY); }catch(e){} }

/* קריאה ל-Apps Script. אובייקט => POST, מחרוזת => GET עם query */
async function api(payload){
  try{
    var r;
    if(typeof payload==="string"){ r=await fetch(SHEETS_URL+"?"+payload,{cache:"no-store"}); }
    else{ r=await fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}); }
    return await r.json();
  }catch(e){ return {ok:false,error:"network"}; }
}
var SYNC="idle";
function syncBadgeHtml(){
  var m={idle:["⏳","מתחבר…"],saving:["🔄","שומר לשיטס…"],ok:["✅","מסונכרן לשיטס"],
         err:["⚠️","שגיאת סנכרון — מנסה שוב"],local:["💾","מקומי בלבד — לא מחובר"]};
  var x=m[SYNC]||m.idle;
  return '<span id="sync-badge" class="who" style="cursor:pointer" title="לחץ להגדרות סנכרון" '+
    'onclick="go(\'settings\',{stab:\'sheets\'})">'+x[0]+' '+esc(x[1])+'</span>';
}
function setSync(s){ SYNC=s; var el=document.getElementById("sync-badge"); if(el){ el.outerHTML=syncBadgeHtml(); } }
var CLASSIFICATIONS = {investment:"השקעה", ongoing:"שוטף", private:"פרטי"};
var METHODS = {transfer:"העברה", check:"צ׳ק", cash:"מזומן", other:"אחר"};
var ROLES = {admin:"מנהל", editor:"עורך", viewer:"צפייה בלבד", partner:"שותף"};
var BASE_TYPES = {full:"מלא (כל הסכום)", net17:"נטו (מע\"מ 17%)", net18:"נטו (מע\"מ 18%)"};

/* ---------- מצב ---------- */
var DB = null;
var CU = null; // current user
var state = {view:"dashboard", params:{}};

/* ---------- כלים ---------- */
function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function num(n){ n = Number(n)||0; return n.toLocaleString("he-IL",{maximumFractionDigits:2}); }
function money(n){ return "₪" + num(n); }
function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
function dateHe(iso){ if(!iso) return ""; var s=esc(String(iso).slice(0,10)); var p=s.split("-"); return p.length===3? p[2]+"/"+p[1]+"/"+p[0] : s; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
async function hashCode(code){
  try{
    var enc=new TextEncoder().encode(String(code));
    var buf=await crypto.subtle.digest("SHA-256",enc);
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
  }catch(e){ return "plain:"+String(code); }
}
function active(list){ return (list||[]).filter(function(x){return !x.deleted;}); }
function byId(list,id){ return (list||[]).find(function(x){return x.id===id;}); }

/* ---------- טעינה/שמירה ---------- */
function loadDB(){
  try{ var raw=localStorage.getItem(LSKEY); if(raw){ DB=JSON.parse(raw); return true; } }catch(e){}
  DB=null; return false;
}
function saveLocal(){
  try{ localStorage.setItem(LSKEY, JSON.stringify(DB)); }catch(e){}
}
/* ---------- ביטול פעולה (Ctrl+Z) ----------
   לפני כל שמירה נשמר המצב הקודם. אין צורך לצלם מראש: ב-localStorage
   עדיין נמצא המצב שלפני השינוי ברגע שקוראים ל-save(). */
var UNDO=[], UNDO_MAX=30;
function undoCount(){ return UNDO.length; }
/* סימון "יש שינוי מקומי שטרם הגיע לשרת" — נשמר ב-localStorage (שורד רענון
   וסגירה), ומנוקה רק אחרי אישור שמירה מהשרת. בכניסה הבאה, אם הסימון קיים,
   המקומי נדחף לשרת במקום להימחק על ידו. */
function markDirty(){ try{ localStorage.setItem(LSKEY+"_dirty","1"); }catch(e){} }
function clearDirtyMark(){ try{ localStorage.removeItem(LSKEY+"_dirty"); }catch(e){} }
function hasDirtyMark(){ try{ return localStorage.getItem(LSKEY+"_dirty")==="1"; }catch(e){ return false; } }
function save(){
  try{
    var prev=localStorage.getItem(LSKEY);
    if(prev){ UNDO.push(prev); if(UNDO.length>UNDO_MAX) UNDO.shift(); }
    localStorage.setItem(LSKEY, JSON.stringify(DB));
  }catch(e){ toast("שגיאת שמירה מקומית","err"); }
  markDirty();
  serverSave();   // כל שינוי נשמר גם בגוגל שיטס
}
function undo(){
  if(!UNDO.length){ toast("אין פעולה לביטול","warn"); return; }
  var prev=UNDO.pop();
  try{
    DB=JSON.parse(prev);
    localStorage.setItem(LSKEY,prev);
    markDirty();
    serverSave();                       // מסנכרן את המצב המוחזר גם לשיטס
    closeModal();
    toast("הפעולה בוטלה"+(UNDO.length?" · עוד "+UNDO.length+" לביטול":""),"ok");
    rerender();
  }catch(e){ toast("הביטול נכשל","err"); }
}
document.addEventListener("keydown",function(e){
  if(!(e.ctrlKey||e.metaKey) || e.shiftKey) return;
  if(e.key!=="z" && e.key!=="Z") return;
  var t=e.target, tag=((t&&t.tagName)||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||(t&&t.isContentEditable)) return;  // לא להפריע לעריכת טקסט
  e.preventDefault(); undo();
});
function blankDB(){
  return {meta:{version:1}, partners:[], apartments:[], apartmentPartners:[], managers:[],
    categories:[], expenses:[], expenseSplits:[], expenseManagerFees:[], accounts:[],
    payments:[], deposits:[], income:[], users:[], settings:{sheetsUrl:"", currency:"₪"}};
}
function toNum(v){ var n=Number(v); return isFinite(n)?n:0; }
function toISO(v){ v=String(v==null?"":v).slice(0,10); return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:""; }
function normalizeDB(d){
  (d.expenses||[]).forEach(function(e){ e.amount=toNum(e.amount); e.date=toISO(e.date); e.mgmtVatRate=toNum(e.mgmtVatRate); });
  (d.expenseSplits||[]).forEach(function(s){ s.percent=toNum(s.percent); });
  (d.expenseManagerFees||[]).forEach(function(f){ f.pctCurrent=toNum(f.pctCurrent); f.pctDeferred=toNum(f.pctDeferred); });
  (d.apartmentPartners||[]).forEach(function(x){ x.defaultPercent=toNum(x.defaultPercent); });
  (d.managers||[]).forEach(function(m){ m.defaultFeePercent=toNum(m.defaultFeePercent); });
  (d.payments||[]).forEach(function(p){ p.amount=toNum(p.amount); p.date=toISO(p.date); });
  (d.deposits||[]).forEach(function(x){ x.amount=toNum(x.amount); x.date=toISO(x.date); });
  (d.income||[]).forEach(function(x){ x.amount=toNum(x.amount); x.date=toISO(x.date); });
  return d;
}

/* ---------- אתחול ראשוני (ללא נתונים) ---------- */
function seedIfEmpty(){
  if(DB && DB.apartments && DB.apartments.length) return;
  DB = blankDB();
  save();
}

/* ============================================================
   חישובים (הלב של המערכת)
   ============================================================ */
function apExpenses(aptId){ return active(DB.expenses).filter(function(e){return e.apartmentId===aptId;}); }
function apPartners(aptId){ return active(DB.apartmentPartners).filter(function(x){return x.apartmentId===aptId;}); }
function apManagers(aptId){ return active(DB.managers).filter(function(x){return x.apartmentId===aptId;}); }
function apAccounts(aptId){ return active(DB.accounts).filter(function(x){return x.apartmentId===aptId;}); }
function apDeposits(aptId){ return active(DB.deposits).filter(function(x){return x.apartmentId===aptId;}); }
function apIncome(aptId){ return active(DB.income).filter(function(x){return x.apartmentId===aptId;}); }
function expSplits(eId){ return active(DB.expenseSplits).filter(function(s){return s.expenseId===eId;}); }
function expPayments(eId){ return active(DB.payments).filter(function(p){return p.expenseId===eId;}); }
function expMgrFees(eId){ return active(DB.expenseManagerFees).filter(function(f){return f.expenseId===eId;}); }
function partnerName(id){ var p=byId(DB.partners,id); return p?p.name:"—"; }
function managerName(id){ var m=byId(DB.managers,id); return m?m.name:"—"; }
function accountIsBank(accId){ if(!accId) return false; var a=byId(DB.accounts,accId); return !!(a&&a.isBank); }

// תשלומי ספק להוצאה (מה ששולם על ההוצאה עצמה)
function expensePaid(eId){
  return round2(expPayments(eId).filter(function(p){return p.recipientType!=="manager";})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
}
function expenseRemaining(eId){ var e=byId(DB.expenses,eId); return round2((e?Number(e.amount):0)-expensePaid(eId)); }
function expenseStatus(eId){ var e=byId(DB.expenses,eId); var paid=expensePaid(eId); var amt=e?Number(e.amount):0;
  if(paid<=0) return "unpaid";
  if(paid>amt+0.01) return "over";          // שולם ביתר — חריגה מאושרת
  if(paid>=amt-0.01) return "paid"; return "partial"; }

// דמי ניהול
function mgmtBase(e){ var a=Number(e.amount)||0; if(e.mgmtBaseType==="net17")return a/1.17; if(e.mgmtBaseType==="net18")return a/1.18; return a; }
function mgmtVatFactor(e){ return 1+(Number(e.mgmtVatRate)||0)/100; }
function mgrFeeLiveOnExpense(eId,mId){ // כולל מע"מ, רק חלק פעיל (נוכחי + דחוי ששוחרר)
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  var mg=byId(DB.managers,mId); if(!mg||mg.deleted) return 0;
  var f=expMgrFees(eId).find(function(x){return x.managerId===mId;}); if(!f) return 0;
  var base=mgmtBase(e); var live=(Number(f.pctCurrent)||0)/100 + (f.deferredReleased?(Number(f.pctDeferred)||0)/100:0);
  return round2(base*live*mgmtVatFactor(e));
}
function mgrFeeFullOnExpense(eId,mId){ // כולל מע"מ, נוכחי+דחוי (סופי)
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  var f=expMgrFees(eId).find(function(x){return x.managerId===mId;}); if(!f) return 0;
  var base=mgmtBase(e); var tot=((Number(f.pctCurrent)||0)+(Number(f.pctDeferred)||0))/100;
  return round2(base*tot*mgmtVatFactor(e));
}
function expenseMgmtCostLive(eId){ // סך דמי הניהול הפעילים של ההוצאה (עלות שמתחלקת בין השותפים)
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  return round2(expMgrFees(eId).reduce(function(s,f){return s+mgrFeeLiveOnExpense(eId,f.managerId);},0));
}
function mgrPaidOnExpense(eId,mId){
  return round2(expPayments(eId).filter(function(p){return p.recipientType==="manager"&&p.recipientManagerId===mId;})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
}

// שותף — כמה אמור לשלם (חלקו בהוצאות + חלקו בדמי הניהול, לפי חלוקת ההוצאה)
function partnerPctInExpense(eId,pId){ return expSplits(eId).reduce(function(s,x){ return s+(x.partnerId===pId?(Number(x.percent)||0):0); },0); }
function partnerShouldPay(aptId,pId){
  return round2(apExpenses(aptId).reduce(function(sum,e){
    var pct=partnerPctInExpense(e.id,pId)/100; if(!pct) return sum;
    return sum + pct*(Number(e.amount)||0) + pct*expenseMgmtCostLive(e.id);
  },0));
}
// שותף — כמה שילם בפועל (תשלומים ישירים שלו מחשבון שאינו בנק + הפקדותיו לבנק)
function partnerPaid(aptId,pId){
  var expIds={}; apExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
  var direct=active(DB.payments).filter(function(p){
    return expIds[p.expenseId] && !accountIsBank(p.accountId) && p.payerPartnerId===pId;
  }).reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  var deps=apDeposits(aptId).filter(function(d){return d.partnerId===pId;}).reduce(function(s,d){return s+(Number(d.amount)||0);},0);
  return round2(direct+deps);
}
function partnerBalance(aptId,pId){ return round2(partnerPaid(aptId,pId)-partnerShouldPay(aptId,pId)); }
// קבוצת השותפים לדוחות = שותפי-הדירה ∪ כל שותף שמופיע בחלוקת הוצאה (שלא ייעלם כסף מהדוח)
function apReportPartnerIds(aptId){
  var set={}, order=[];
  function add(pid){ if(pid && !set[pid]){ set[pid]=1; order.push(pid); } }
  apPartners(aptId).forEach(function(ap){ add(ap.partnerId); });
  var expIdSet={};
  apExpenses(aptId).forEach(function(e){ expIdSet[e.id]=1; expSplits(e.id).forEach(function(s){ add(s.partnerId); }); });
  apDeposits(aptId).forEach(function(d){ add(d.partnerId); });           // מפקידים לבנק
  active(DB.payments).forEach(function(p){ if(expIdSet[p.expenseId] && !accountIsBank(p.accountId)) add(p.payerPartnerId); }); // משלמים ישירים
  return order;
}
function reportPartnerIds(aptId){
  var ids=apReportPartnerIds(aptId);
  if(CU && CU.role==="partner" && CU.partnerId) ids=ids.filter(function(id){return id===CU.partnerId;});
  return ids;
}
function partnerDefaultPct(aptId,pId){ var r=apPartners(aptId).find(function(x){return x.partnerId===pId;}); return r?r.defaultPercent:null; }

// בנק
function bankBalance(aptId){
  var deps=apDeposits(aptId).reduce(function(s,d){return s+(Number(d.amount)||0);},0);
  var expIds={}; apExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
  var out=active(DB.payments).filter(function(p){return expIds[p.expenseId]&&accountIsBank(p.accountId);})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  return round2(deps-out);
}
// מנהל — מגיע/קיבל/יתרה
function managerReceivable(aptId,mId){ return round2(apExpenses(aptId).reduce(function(s,e){return s+mgrFeeLiveOnExpense(e.id,mId);},0)); }
/* דחוי שטרם שוחרר = ההפרש בין הסופי לפעיל */
function managerDeferredPending(aptId,mId){
  return round2(apExpenses(aptId).reduce(function(s,e){
    return s + (mgrFeeFullOnExpense(e.id,mId) - mgrFeeLiveOnExpense(e.id,mId)); },0));
}
function managerPaid(aptId,mId){
  var expIds={}; apExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
  return round2(active(DB.payments).filter(function(p){return expIds[p.expenseId]&&p.recipientType==="manager"&&p.recipientManagerId===mId;})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
}
// סיכומי דירה
function apartmentTotals(aptId){
  var exps=apExpenses(aptId);
  var totalExpenses=exps.reduce(function(s,e){return s+(Number(e.amount)||0);},0);
  var totalMgmt=exps.reduce(function(s,e){return s+expenseMgmtCostLive(e.id);},0);
  var totalPaid=exps.reduce(function(s,e){return s+expensePaid(e.id);},0);
  var expIdSet={}; exps.forEach(function(e){expIdSet[e.id]=1;});
  var mgrPaidTot=active(DB.payments).filter(function(p){return expIdSet[p.expenseId]&&p.recipientType==="manager";})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  var income=apIncome(aptId).reduce(function(s,i){return s+(Number(i.amount)||0);},0);
  return {totalExpenses:round2(totalExpenses),totalMgmt:round2(totalMgmt),totalCost:round2(totalExpenses+totalMgmt),
    totalPaid:round2(totalPaid),mgrPaidTot:round2(mgrPaidTot),paidAll:round2(totalPaid+mgrPaidTot),
    remaining:round2(totalExpenses+totalMgmt-totalPaid-mgrPaidTot),
    income:round2(income),bank:bankBalance(aptId)};
}

function can(action){
  if(!CU) return false;
  if(CU.role==="admin") return true;
  if(CU.role==="editor") return action!=="manageUsers"&&action!=="settings";
  if(CU.role==="viewer"||CU.role==="partner") return action==="view";
  return false;
}
function canSeeApartment(aptId){
  if(!CU) return false;
  if(CU.role==="admin"||CU.role==="editor"||CU.role==="viewer") return true;
  if(!CU.allowedApartments||!CU.allowedApartments.length) return true;
  return CU.allowedApartments.indexOf(aptId)>=0;
}

async function createAdmin(){

  if(!code){ toast("יש להזין קוד","err"); return; }
  var h=await hashCode(code);
  var u={id:uid(),name:name,code:h,role:"admin",allowedApartments:[],partnerId:null,active:true,deleted:false};
  if(!DB){ DB=blankDB(); seedIfEmpty(); }
  DB.users=[u];
  var j=await api({action:"bootstrap",data:DB});
  if(!j||!j.ok){ toast("ההקמה נכשלה"+((j&&j.error)?": "+j.error:""),"err"); return; }
  setAuth(h); CU=u; saveLocal(); setSync("ok");
  toast("ברוך הבא, "+name,"ok"); go("dashboard",{});
}
async function doLogin(){
  var code=val("lg-code"); if(!code){ toast("יש להזין קוד","err"); return; }
  var h=await hashCode(code);
  var j=await api({action:"login",codeHash:h});
  if(!j||!j.ok){ toast((j&&j.error==="network")?"אין חיבור לשרת":"קוד שגוי","err"); return; }
  setAuth(h); CU=j.user;
  if(hasDirtyMark() && DB && Array.isArray(DB.apartments)){
    /* המכשיר מחזיק שינוי שטרם הגיע לשרת — דוחפים אותו במקום למשוך ולמחוק */
    SAVEQ.dirty=true; flushSave();
    toast("נמצאו שינויים שטרם סונכרנו — נשלחים לשרת","warn");
  } else {
    var res=await serverLoad();
    if(res.data && Array.isArray(res.data.apartments)){ DB=normalizeDB(res.data); saveLocal(); UNDO.length=0; }
    else if(res.error){
      /* בלי נתונים עדכניים לא נכנסים למצב עריכה על מטמון ישן */
      setAuth(""); CU=null;
      toast("לא הצלחתי לטעון את הנתונים מהשרת — נסה שוב בעוד רגע","err");
      return;
    }
  }
  toast("ברוך הבא, "+CU.name,"ok"); go("dashboard",{});
}
function logout(){
  if(SAVEQ.timer){ clearTimeout(SAVEQ.timer); SAVEQ.timer=null; }
  if(hasUnsaved()){
    /* שולחים ניסיון אחרון עם ההרשאה הנוכחית לפני שהיא נמחקת.
       אם ייכשל — הסימון המקומי נשאר והכניסה הבאה תדחף את המקומי. */
    var h=getAuth();
    if(h){
      try{
        fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
          body:JSON.stringify({action:"save",codeHash:h,data:DB})})
          .then(function(r){return r.json();})
          .then(function(res){ if(res&&res.ok) clearDirtyMark(); }).catch(function(){});
      }catch(e){}
    }
  }
  SAVEQ.dirty=false; SAVEQ.inflight=false; SAVEQ.fails=0;
  setAuth(""); CU=null; renderApp();
}

async function doResetCode(){

  }

function renderAptGrid(){
  var el=document.getElementById("apt-grid"); if(el) el.innerHTML=aptGridHtml();
}
function aptGridHtml(){
  var all=active(DB.apartments).filter(function(a){return canSeeApartment(a.id);});
  var apts=all.filter(function(a){ return matches(Q.apts,a.name+" "+(a.notes||"")); });
  var cnt=document.getElementById("apt-count");
  if(cnt) cnt.innerHTML=countLine(apts.length,all.length,"דירות");
  if(!apts.length) return '<div class="empty">לא נמצאה דירה שמתאימה ל"'+esc(Q.apts)+'"</div>';

  // חישוב פעם אחת לכל דירה — משמש גם למיון וגם לתצוגה
  var rows=apts.map(function(a){ return {a:a, t:apartmentTotals(a.id)}; });
  var dir=APT_SORT.dir;
  rows.sort(function(x,y){
    var r;
    switch(APT_SORT.by){
      case "cost":   r=x.t.totalCost-y.t.totalCost; break;
      case "paid":   r=x.t.paidAll-y.t.paidAll; break;
      case "rem":    r=x.t.remaining-y.t.remaining; break;
      case "income": r=x.t.income-y.t.income; break;
      case "bank":   r=x.t.bank-y.t.bank; break;
      case "mgmt":     r=x.t.totalMgmt-y.t.totalMgmt; break;
      case "mgmtPaid": r=x.t.mgrPaidTot-y.t.mgrPaidTot; break;
      case "mgmtRem":  r=(x.t.totalMgmt-x.t.mgrPaidTot)-(y.t.totalMgmt-y.t.mgrPaidTot); break;

  var shown=active(DB.apartments).filter(function(a){return canSeeApartment(a.id);})
    .filter(function(a){ return matches(Q.apts,a.name+" "+(a.notes||"")); });
  var changed=shown.filter(function(a){ return !!a[flag]!==!!val; });
  if(!changed.length){ toast("כל הדירות המוצגות כבר במצב הזה","warn"); return; }

function pushToSheets(){ serverSave(); }
async function pullFromSheets(){
  if(!sheetsUrl()){ toast("לא הוגדר קישור לשיט","err"); return; }
  if(SAVEQ.inflight){ toast("שמירה לשרת בעיצומה — המתן רגע ונסה שוב","warn"); return; }
  if(hasUnsaved()||hasDirtyMark()){
    if(!confirm("יש שינויים מקומיים שטרם נשמרו לשרת.\n\nטעינה מהשיט תדרוס אותם לצמיתות. להמשיך בכל זאת?")) return;
  }
  if(SAVEQ.timer){ clearTimeout(SAVEQ.timer); SAVEQ.timer=null; }
  SAVEQ.dirty=false; SAVEQ.fails=0; clearDirtyMark();
  var res=await serverLoad();
  if(res.error){ toast("שגיאת חיבור לשיט","err"); return; }
  if(res.data && Array.isArray(res.data.apartments)){
    DB=normalizeDB(res.data); saveLocal(); UNDO.length=0;   // סטאק ישן = בסיס לא תקף אחרי משיכה
    toast("נטען מהשיט","ok"); rerender();
  }
  else toast("השיט ריק","warn");
}

/* ---- סנכרון מול גוגל שיטס (Apps Script) — מקור האמת ---- */
/* ---------- תור שמירה ----------
   כל שמירה שולחת את כל מסד הנתונים. כששולחים כמה בקשות במקביל הן אינן
   חוזרות בהכרח בסדר שנשלחו, ובקשה ישנה שמגיעה אחרונה דורסת שינויים
   חדשים — כך "חזרו" סימוני בנק שכובו. לכן: בקשה אחת בלבד בכל רגע,
   ותמיד עם המצב העדכני. שינויים שנעשו בזמן שליחה נשלחים מיד אחריה. */
var SAVEQ={inflight:false,dirty:false,timer:null,fails:0};
function serverSave(){
  if(!getAuth()){ setSync("local"); return; }
  SAVEQ.dirty=true;
  SAVEQ.fails=0;                       // עריכה חדשה מאפסת את מונה הכישלונות — ניסיון מיידי
  setSync("saving");
  if(SAVEQ.timer) return;
  SAVEQ.timer=setTimeout(function(){ SAVEQ.timer=null; flushSave(); },350);
}
function scheduleRetry(){
  /* לעולם לא מפסיקים לנסות — רק מאטים (עד 30 שניות בין ניסיונות).
     עצירה קשיחה אחרי N כישלונות השאירה שינויים תקועים לנצח. */
  var delay=Math.min(2000*Math.max(1,SAVEQ.fails), 30000);
  setSync(SAVEQ.fails>=3 ? "err" : "saving");
  setTimeout(flushSave, delay);
}
function flushSave(){
  if(SAVEQ.inflight || !SAVEQ.dirty) return;
  var h=getAuth(); if(!h){ setSync("local"); return; }
  SAVEQ.dirty=false; SAVEQ.inflight=true; setSync("saving");
  var payload=JSON.stringify({action:"save",codeHash:h,data:DB});   // תמונת מצב עדכנית
  fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:payload})
    .then(function(r){ return r.json(); })
    .then(function(j){
      SAVEQ.inflight=false;
      if(j&&j.ok){
        SAVEQ.fails=0;
        if(SAVEQ.dirty){ setSync("saving"); setTimeout(flushSave,0); }   // שינויים שנעשו בזמן השליחה
        else { clearDirtyMark(); setSync("ok"); }
        return;
      }
      SAVEQ.dirty=true;
      var err=j&&j.error;
      if(err==="unauthorized"||err==="forbidden"){
        /* קוד הכניסה כבר לא תקף (למשל אחרי איפוס ממכשיר אחר).
           אסור להמשיך לירות — עוצרים, והשינוי שמור מקומית ומסומן,
           כך שאחרי כניסה מחודשת הוא נדחף לשרת ולא נמחק. */
        setSync("err"); setAuth(""); CU=null;
        toast("החיבור לשרת פג — יש להתחבר מחדש. השינויים שלך שמורים ויסונכרנו אחרי הכניסה","err");
        renderApp(); return;
      }
      SAVEQ.fails++; scheduleRetry();
    })
    .catch(function(){
      SAVEQ.inflight=false; SAVEQ.fails++; SAVEQ.dirty=true;
      scheduleRetry();
    });
}
function hasUnsaved(){ return !!(SAVEQ.dirty||SAVEQ.inflight); }
window.addEventListener("online",function(){    // הרשת חזרה — מנסים מיד
  if(SAVEQ.dirty && !SAVEQ.inflight){ SAVEQ.fails=0; flushSave(); }
});
window.addEventListener("beforeunload",function(e){
  if(hasUnsaved()){ e.preventDefault(); e.returnValue=""; return ""; }
});
window.addEventListener("pagehide",function(){
  /* ניסיון אחרון לשלוח לפני סגירה. אם הוא נכשל (או שהנתונים גדולים מדי
     ל-keepalive) — הסימון המקומי נשאר, והכניסה הבאה תדחף את המקומי. */
  if(!hasUnsaved()) return;
  var h=getAuth(); if(!h) return;
  try{
    fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"save",codeHash:h,data:DB}),keepalive:true});
  }catch(e){}
});
async function serverLoad(){
  var h=getAuth();
  if(!h){ setSync("local"); return {error:true}; }
  var j=await api({action:"load",codeHash:h});
  if(j&&j.ok){ setSync("ok"); return {data:(j.data||null),user:j.user}; }
  setSync("err"); return {error:true,reason:(j&&j.error)};
}

/* ============================================================
   אתחול — השרת הוא מקור האמת; localStorage הוא מטמון מקומי
   ============================================================ */
async function boot(){
  var hadLocal=loadDB();
  if(!hadLocal||!DB){ DB=blankDB(); seedIfEmpty(); }
  if(getAuth()){                       // session פעיל
    if(hadLocal && hasDirtyMark()){
      /* יש שינוי מקומי שלא אושר ע"י השרת (סגירה מהירה / כשל רשת).
         לא מושכים מהשרת — קודם דוחפים את המקומי, אחרת השינוי נמחק. */
      var jl=await api({action:"login",codeHash:getAuth()});
      if(jl&&jl.ok){
        CU=jl.user;
        SAVEQ.dirty=true; flushSave();
        toast("נמצאו שינויים שטרם סונכרנו — נשלחים לשרת עכשיו","warn");
      } else if(jl&&jl.error==="bad-code"){ setAuth(""); CU=null; }
      /* כשל רשת: נשארים על המקומי עם הסימון — ננסה שוב בהמשך */
    } else {
      var res=await serverLoad();
      if(res.data && Array.isArray(res.data.apartments)){
        DB=normalizeDB(res.data); saveLocal(); UNDO.length=0;
        if(res.user) CU=res.user;
      } else if(res.reason==="unauthorized"){ setAuth(""); CU=null; }
      else if(res.error){
        /* השרת לא זמין: לא עורכים בשקט על עותק ישן — חוזרים למסך הכניסה,
           שמציג את אזהרת החיבור. הנתונים המקומיים לא נמחקים. */
        CU=null;
      }
    }
  }
  renderApp();
}
</script>
<script>
"use strict";
/* ============================================================
   מודולים
   ============================================================ */
/* ---------- חיפוש וסינון ---------- */
var Q={apts:"",exp:"",expStatus:"",expClass:"",quick:"",partners:"",cross:"",recycle:"",pay:"",payWho:"",paySrc:""};
/* כל מילה בשאילתה חייבת להופיע — מאפשר "עורך דין קופר" ו"קופר דין" כאחד */
function matches(q,text){
  q=String(q||"").trim().toLowerCase(); if(!q) return true;
  var t=String(text||"").toLowerCase();
  return q.split(/\s+/).every(function(w){ return t.indexOf(w)>=0; });
}
function searchBox(id,val,ph,handler){
  return '<input id="'+id+'" value="'+esc(val)+'" placeholder="🔍 '+esc(ph)+'" '+
    'oninput="'+handler+'" style="max-width:300px">';
}
function countLine(shown,total,what){
  if(shown===total) return '<span class="muted">'+total+' '+esc(what)+'</span>';
  return '<span class="pill">מציג '+shown+' מתוך '+total+'</span>';
}

function partnerOptions(sel){ return active(DB.partners).map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?" selected":"")+'>'+esc(p.name)+'</option>';}).join(""); }
function categoryOptions(sel){ return '<option value="">—</option>'+active(DB.categories).map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?" selected":"")+'>'+esc(c.name)+'</option>';}).join(""); }
function classOptions(sel){ return Object.keys(CLASSIFICATIONS).map(function(k){return '<option value="'+k+'"'+(k===sel?" selected":"")+'>'+CLASSIFICATIONS[k]+'</option>';}).join(""); }
function accountOptions(aptId,sel){ return '<option value="">— ידני / ללא חשבון —</option>'+apAccounts(aptId).map(function(ac){return '<option value="'+ac.id+'"'+(ac.id===sel?" selected":"")+'>'+esc(ac.name)+(ac.isBank?" 🏦":"")+'</option>';}).join(""); }

/* ---------- שותפי דירה ---------- */
function modulePartners(aptId){
  var rows=apPartners(aptId); var sum=rows.reduce(function(s,r){return s+(Number(r.defaultPercent)||0);},0);
  var h='<div class="toolbar"><h3 style="margin:0">שותפי הדירה ואחוזי ברירת מחדל</h3><div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-primary btn-sm" onclick="addApartmentPartner(\''+aptId+'\')">➕ הוסף שותף</button>':'')+'</div>';
  h+='<div class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>שותף</th><th>% ברירת מחדל</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td>'+esc(partnerName(r.partnerId))+'</td><td>'+num(r.defaultPercent)+'%</td><td class="right">'+
      (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="editApPartner(\''+r.id+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="softDelete(\'apartmentPartners\',\''+r.id+'\',\'להסיר שותף זה מהדירה?\')">🗑️</button>':'')+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><td>סה"כ</td><td class="'+(Math.abs(sum-100)<0.01?"pos":"neg")+'">'+num(sum)+'%</td><td></td></tr></tfoot></table></div>';
  if(Math.abs(sum-100)>=0.01) h+='<div class="hint neg">שים לב: סכום האחוזים אינו 100%.</div>';
  h+='</div>';
  return h;
}
function addApartmentPartner(aptId){
  var inApt={}; apPartners(aptId).forEach(function(x){inApt[x.partnerId]=1;});
  var avail=active(DB.partners).filter(function(p){return !inApt[p.id];});
  openModal({title:"הוספת שותף לדירה",bodyHtml:
    '<div class="field"><label>בחר שותף קיים</label><select id="apn-existing"><option value="">— חדש —</option>'+
      avail.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join("")+'</select></div>'+
    '<div class="field"><label>או שם שותף חדש</label><input id="apn-new" placeholder="שם"></div>'+
    '<div class="field"><label>% ברירת מחדל</label><input id="apn-pct" type="number" step="0.01" value="0"></div>',
    onSave:function(){
      var pid=val("apn-existing"); var newName=val("apn-new").trim();
      if(!pid&&newName){ pid=uid(); DB.partners.push({id:pid,name:newName,phone:"",notes:"",deleted:false}); }
      if(!pid){ toast("בחר או הזן שותף","err"); return false; }
      DB.apartmentPartners.push({id:uid(),apartmentId:aptId,partnerId:pid,defaultPercent:Number(val("apn-pct"))||0,deleted:false});
      save(); toast("נוסף","ok"); rerender();
    }});
}
function editApPartner(id){
  var r=byId(DB.apartmentPartners,id);
  openModal({title:"עריכת אחוז ברירת מחדל — "+partnerName(r.partnerId),bodyHtml:
    '<div class="field"><label>% ברירת מחדל</label><input id="app-pct" type="number" step="0.01" value="'+esc(String(r.defaultPercent))+'"></div>',
    onSave:function(){ r.defaultPercent=Number(val("app-pct"))||0; save(); toast("נשמר","ok"); rerender(); }});
}

/* ---------- הוצאות ---------- */
function moduleExpenses(aptId){
  var exps=apExpenses(aptId);
  var h='<div class="toolbar"><h3 style="margin:0">הוצאות / שלבים</h3><div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-primary btn-sm" onclick="openExpenseEditor(null,\''+aptId+'\')">➕ הוצאה חדשה</button>':'')+
    (can("edit")&&exps.length?' <button class="btn btn-sm" onclick="openBulkMgmt(\''+aptId+'\')">💼 דמי ניהול מרוכז</button>':'')+
    (can("edit")&&exps.length?' <button class="btn btn-danger btn-sm" onclick="deleteApartmentExpenses(\''+aptId+'\')">🗑️ מחק הכל</button>':'')+'</div>';
  if(!exps.length) return h+'<div class="empty">אין הוצאות עדיין.</div>';
  h+='<div class="toolbar">'+
    searchBox("exp-q",Q.exp,"חיפוש לפי שם שלב / הערה…","Q.exp=this.value;renderExpTable('+JSON.stringify(aptId)+')")+
    '<select style="max-width:170px" onchange="Q.expStatus=this.value;renderExpTable('+JSON.stringify(aptId)+')">'+
      ['','unpaid','partial','paid'].map(function(v){
        var l={"":"כל הסטטוסים","unpaid":"לא שולם","partial":"שולם חלקית","paid":"שולם במלואו"}[v];
        return '<option value="'+v+'"'+(Q.expStatus===v?" selected":"")+'>'+l+'</option>'; }).join("")+
    '</select>'+
    '<select style="max-width:150px" onchange="Q.expClass=this.value;renderExpTable('+JSON.stringify(aptId)+')">'+
      '<option value="">כל הסיווגים</option>'+
      Object.keys(CLASSIFICATIONS).map(function(k){
        return '<option value="'+k+'"'+(Q.expClass===k?" selected":"")+'>'+CLASSIFICATIONS[k]+'</option>'; }).join("")+
    '</select>'+
    ((Q.exp||Q.expStatus||Q.expClass)?'<button class="btn btn-ghost btn-sm" onclick="Q.exp=\'\';Q.expStatus=\'\';Q.expClass=\'\';rerender()">✕ נקה</button>':'')+
    '<div class="sp"></div><span id="exp-count"></span></div>';
  h+='<div id="exp-table">'+expTableHtml(aptId)+'</div>';
  return h;
}
function renderExpTable(aptId){
  var el=document.getElementById("exp-table"); if(el) el.innerHTML=expTableHtml(aptId);
}
function filteredExpenses(aptId){
  return apExpenses(aptId).filter(function(e){
    if(!matches(Q.exp, e.description+" "+(e.note||""))) return false;
    if(Q.expStatus && expenseStatus(e.id)!==Q.expStatus) return false;
    if(Q.expClass && e.classification!==Q.expClass) return false;
    return true;
  });
}
function expTableHtml(aptId){
  var a=byId(DB.apartments,aptId);
  var all=apExpenses(aptId);
  var exps=filteredExpenses(aptId);
  var cnt=document.getElementById("exp-count");
  if(cnt) cnt.innerHTML=countLine(exps.length,all.length,"שלבים");
  if(!exps.length) return '<div class="empty">לא נמצא שלב שמתאים לסינון</div>';
  var h='<div class="table-wrap"><table class="tbl"><thead><tr><th>תאריך</th><th>תיאור</th><th>סיווג</th><th>סכום</th>'+
    (a.hasManagement?'<th>דמי ניהול</th>':'')+'<th>שולם</th><th>נותר</th><th>סטטוס</th><th></th></tr></thead><tbody>';
  exps.sort(function(x,y){return (x.date<y.date)?1:-1;}).forEach(function(e){
    var st=expenseStatus(e.id), rem=expenseRemaining(e.id);
    var badge=st==="paid"?'<span class="badge badge-ok">שולם</span>'
      :st==="over"?'<span class="badge badge-warn">⚠️ ביתר</span>'
      :st==="partial"?'<span class="badge badge-warn">חלקי</span>':'<span class="badge badge-danger">לא שולם</span>';
    h+='<tr><td>'+dateHe(e.date)+'</td><td><b>'+esc(e.description)+'</b>'+(e.hasInvoice?' 📎':'')+'</td>'+
      '<td>'+(CLASSIFICATIONS[e.classification]||"")+'</td>'+
      '<td>'+money(e.amount)+'</td>'+
      (a.hasManagement?'<td>'+(e.mgmtEnabled?money(expenseMgmtCostLive(e.id)):'—')+'</td>':'')+
      '<td>'+money(expensePaid(e.id))+'</td><td class="'+(Math.abs(rem)>0.01?"neg":"pos")+'">'+money(rem)+'</td><td>'+badge+'</td>'+
      '<td class="right" style="white-space:nowrap">'+
        '<button class="btn btn-ghost btn-sm" onclick="openPayments(\''+e.id+'\')" title="תשלומים">💳</button>'+
        (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openExpenseEditor(\''+e.id+'\',\''+aptId+'\')">✏️</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="softDelete(\'expenses\',\''+e.id+'\',\'למחוק הוצאה זו?\')">🗑️</button>':'')+'</td></tr>';
  });
  // סיכום — של השורות המוצגות אחרי הסינון
  var tot=exps.reduce(function(s,e){return s+(Number(e.amount)||0);},0);
  var totPaid=exps.reduce(function(s,e){return s+expensePaid(e.id);},0);
  var lbl=(exps.length===all.length)?'סה"כ':'סה"כ המסונן';
  h+='</tbody><tfoot><tr><td colspan="3">'+lbl+'</td><td>'+money(tot)+'</td>'+(a.hasManagement?'<td></td>':'')+'<td>'+money(totPaid)+'</td><td>'+money(tot-totPaid)+'</td><td colspan="2"></td></tr></tfoot></table></div>';
  return h;
}
/* ---------- דמי ניהול מרוכז: החלה על הרבה שלבים בבת אחת ---------- */
function openBulkMgmt(aptId){
  var a=byId(DB.apartments,aptId);
  if(!a.hasManagement){
    toast("דמי ניהול כבויים בדירה — הפעל בלשונית \"דמי ניהול\"","err");
    go("apartment",{apartmentId:aptId,tab:"managers"}); return;
  }
  var mgrs=apManagers(aptId);
  if(!mgrs.length){
    toast("אין מנהלים מוגדרים — הוסף אותם קודם","err");
    go("apartment",{apartmentId:aptId,tab:"managers"}); return;
  }
  var list=filteredExpenses(aptId).sort(function(x,y){return x.date<y.date?-1:1;});
  if(!list.length){ toast("אין שלבים להצגה לפי הסינון הנוכחי","warn"); return; }

  var body='<div class="hint">מוצגים '+list.length+' שלבים לפי הסינון הנוכחי במסך ההוצאות. '+
    'סנן/חפש שם לפני שנכנסים לכאן כדי לצמצם את הרשימה.</div>'+
    '<div class="section-title">ההגדרות שיוחלו</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>בסיס החישוב</label><select id="bm-base">'+
        Object.keys(BASE_TYPES).map(function(k){return '<option value="'+k+'"'+(k==="net18"?" selected":"")+'>'+BASE_TYPES[k]+'</option>';}).join("")+
      '</select></div>'+
      '<div class="field"><label>מע"מ על דמי הניהול</label><select id="bm-vat">'+
        [0,17,18].map(function(v){return '<option value="'+v+'"'+(v===18?" selected":"")+'>'+(v===0?"ללא":v+"%")+'</option>';}).join("")+
      '</select></div>'+
    '</div>'+
    mgrs.map(function(m){
      return '<div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px"><b>'+esc(m.name)+'</b>'+
        '<div class="form-grid" style="margin-top:8px">'+
        '<div class="field"><label>% נוכחי</label><input id="bm-cur-'+m.id+'" type="number" step="0.01" value="'+esc(String(m.defaultFeePercent))+'"></div>'+
        '<div class="field"><label>% דחוי</label><input id="bm-def-'+m.id+'" type="number" step="0.01" value="0"></div>'+
        '<div class="field full"><label>מתי ישוחרר הדחוי</label><input id="bm-lbl-'+m.id+'" value="בסיום הבנייה"></div>'+
        '</div></div>';
    }).join("")+
    '<div class="section-title">על אילו שלבים להחיל</div>'+
    '<div class="toolbar">'+
      '<button class="btn btn-sm" onclick="bulkMgmtSelectAll(true)">✔️ סמן הכל</button>'+
      '<button class="btn btn-sm" onclick="bulkMgmtSelectAll(false)">✕ נקה בחירה</button>'+
      '<div class="sp"></div><span id="bm-count" class="pill"></span></div>'+
    '<div class="table-wrap" style="max-height:300px;overflow:auto"><table class="tbl"><thead><tr>'+
      '<th></th><th>תאריך</th><th>שלב</th><th>סכום</th><th>דמי ניהול כיום</th></tr></thead><tbody>'+
      list.map(function(e){
        return '<tr><td><input type="checkbox" class="bm-x" value="'+e.id+'" checked onchange="bulkMgmtCount()" style="width:auto"></td>'+
          '<td>'+dateHe(e.date)+'</td><td><b>'+esc(e.description)+'</b></td><td>'+money(e.amount)+'</td>'+
          '<td>'+(e.mgmtEnabled?money(expenseMgmtCostLive(e.id)):'<span class="muted">—</span>')+'</td></tr>';
      }).join("")+
    '</tbody></table></div>'+
    '<div class="field" style="margin-top:12px"><label><input type="checkbox" id="bm-remove" style="width:auto" onchange="bulkMgmtToggleMode()"> '+
      '<b class="neg">להסיר</b> דמי ניהול מהשלבים המסומנים (במקום להחיל)</label></div>';

  openModal({title:"💼 דמי ניהול לכמה שלבים",wide:true,bodyHtml:body,
    saveLabel:"החל על המסומנים",onSave:function(){ return applyBulkMgmt(aptId); }});
  bulkMgmtCount();
}
function bulkMgmtSelectAll(v){
  document.querySelectorAll(".bm-x").forEach(function(c){ c.checked=v; });
  bulkMgmtCount();
}
function bulkMgmtCount(){
  var n=document.querySelectorAll(".bm-x:checked").length;
  var el=document.getElementById("bm-count"); if(el) el.textContent="נבחרו "+n;
}
function bulkMgmtToggleMode(){
  var rm=checked("bm-remove");
  ["bm-base","bm-vat"].forEach(function(id){ var el=document.getElementById(id); if(el) el.disabled=rm; });
  document.querySelectorAll('[id^="bm-cur-"],[id^="bm-def-"],[id^="bm-lbl-"]').forEach(function(el){ el.disabled=rm; });
}
function applyBulkMgmt(aptId){
  var ids=Array.prototype.map.call(document.querySelectorAll(".bm-x:checked"),function(c){return c.value;});
  if(!ids.length){ toast("לא נבחר אף שלב","err"); return false; }
  var remove=checked("bm-remove");
  var mgrs=apManagers(aptId);
  if(remove){
    /* שלב שכבר שולם עליו למנהלים לא ניתן לכיבוי — אחרת התשלומים נספרים
       בלי צד עלות והמאזן נשבר. מדלגים עליו ומדווחים. */
    var blocked=[], okIds=[];
    ids.forEach(function(eid){
      var mPaid=expPayments(eid).filter(function(p){return p.recipientType==="manager";})
        .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
      if(mPaid>0.01) blocked.push(eid); else okIds.push(eid);
    });
    if(!okIds.length){
      toast("בכל השלבים שנבחרו כבר שולמו דמי ניהול — אי אפשר לבטל. מחק קודם את התשלומים למנהלים","err");
      return false;
    }
    if(!confirm("יוסרו דמי ניהול מ-"+okIds.length+" שלבים"+
      (blocked.length? "\n("+blocked.length+" שלבים ידולגו כי כבר שולם בהם למנהלים)":"")+
      "\n\nהנתונים הקיימים יישמרו ויחזרו אם תחיל שוב.")) return false;
    okIds.forEach(function(eid){ var e=byId(DB.expenses,eid); if(e) e.mgmtEnabled=false; });
    save();
    toast("דמי הניהול הוסרו מ-"+okIds.length+" שלבים"+(blocked.length?" · "+blocked.length+" דולגו (שולם בהם)":""),blocked.length?"warn":"ok");
    rerender(); return;
  }
  var base=val("bm-base")||"full", vat=Number(val("bm-vat")); if(isNaN(vat)) vat=18;
  var cfg=mgrs.map(function(m){
    return {id:m.id, cur:Number(val("bm-cur-"+m.id))||0, def:Number(val("bm-def-"+m.id))||0, lbl:val("bm-lbl-"+m.id)||"" };
  });
  if(!cfg.some(function(c){ return c.cur>0 || c.def>0; })){
    toast("כל האחוזים אפס — הזן אחוז לפחות למנהל אחד","err"); return false;
  }
  ids.forEach(function(eid){
    var e=byId(DB.expenses,eid); if(!e) return;
    e.mgmtEnabled=true; e.mgmtBaseType=base; e.mgmtVatRate=vat;
    DB.expenseManagerFees=DB.expenseManagerFees.filter(function(f){return f.expenseId!==eid;});
    cfg.forEach(function(c){
      DB.expenseManagerFees.push({id:uid(),expenseId:eid,managerId:c.id,
        pctCurrent:c.cur,pctDeferred:c.def,deferredLabel:c.lbl,deferredReleased:false,deleted:false});
    });
  });
  save();
  toast("דמי ניהול הוחלו על "+ids.length+" שלבים","ok");
  rerender();
}

function splitRowHtml(pid,pct){
  return '<div class="split-row"><select class="sp-partner">'+partnerOptions(pid)+'</select>'+
    '<input class="sp-pct" type="number" step="0.01" value="'+(pct||0)+'" oninput="updateSplitSum()">'+
    '<button class="btn btn-ghost btn-sm" onclick="this.closest(\'.split-row\').remove();updateSplitSum()">✕</button></div>';
}
function updateSplitSum(){
  var rows=document.querySelectorAll("#split-rows .split-row");
  var el=document.getElementById("split-sum"); if(!el) return;
  if(!rows.length){ el.textContent="ללא חלוקה"; el.className="muted"; return; }
  var sum=0; document.querySelectorAll("#split-rows .sp-pct").forEach(function(i){sum+=Number(i.value)||0;});
  el.textContent=num(sum)+"%"; el.className=Math.abs(sum-100)<0.01?"pos":"neg";
}
function addSplitRow(){ document.getElementById("split-rows").insertAdjacentHTML("beforeend",splitRowHtml("",0)); updateSplitSum(); }
function toggleMgmt(){
  var el=document.getElementById("mgmt-details");
  if(el) el.style.display=checked("ex-mgmt")?"block":"none";
  updateMgmtPreview();
}
/* תצוגה חיה של חישוב דמי הניהול, מתעדכנת בכל הקלדה */
function updateMgmtPreview(){
  var box=document.getElementById("mgmt-preview"); if(!box) return;
  var rowsEls=document.querySelectorAll("#mgmt-rows [data-mgr]");
  if(!rowsEls.length){ box.innerHTML=""; return; }
  var amt=Number(val("ex-amount"))||0;
  var baseType=val("ex-base")||"full", vat=Number(val("ex-vat"))||0;
  var b = baseType==="net17" ? amt/1.17 : baseType==="net18" ? amt/1.18 : amt;
  var vf = 1+vat/100;
  var out=[], totLive=0, totFull=0;
  Array.prototype.forEach.call(rowsEls,function(el){
    var mid=el.getAttribute("data-mgr"), nm=el.getAttribute("data-name")||"";
    var cur=Number(val("mf-cur-"+mid))||0, def=Number(val("mf-def-"+mid))||0, rel=checked("mf-rel-"+mid);
    var curAmt=b*cur/100*vf, defAmt=b*def/100*vf;
    var live=curAmt+(rel?defAmt:0), full=curAmt+defAmt;
    totLive+=live; totFull+=full;
    out.push('<tr><td>'+esc(nm)+'</td><td>'+money(curAmt)+'</td><td>'+money(defAmt)+(rel?' <span class="badge badge-ok">שוחרר</span>':'')+
      '</td><td><b>'+money(live)+'</b></td><td>'+money(full)+'</td></tr>');
  });
  box.innerHTML='<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>מנהל</th><th>נוכחי</th><th>דחוי</th><th>לתשלום עכשיו</th><th>סה"כ בסוף</th></tr></thead><tbody>'+
    out.join("")+'</tbody><tfoot><tr><td>בסיס: '+money(b)+(vat?' · מע"מ '+vat+'%':' · ללא מע"מ')+
    '</td><td colspan="2"></td><td><b>'+money(totLive)+'</b></td><td>'+money(totFull)+'</td></tr></tfoot></table></div>'+
    '<div class="hint">כל הסכומים כוללים מע"מ. "לתשלום עכשיו" = הנוכחי + הדחוי אם שוחרר — וזה גם התקרה לתשלום למנהל.</div>';
}

function saveExpense(eId,aptId){
  var a=byId(DB.apartments,aptId);
  var desc=val("ex-desc").trim(); var amount=Number(val("ex-amount"))||0;
  if(!desc){ toast("יש להזין תיאור","err"); return false; }
  if(amount<=0){ toast("יש להזין סכום","err"); return false; }
  // חלוקה — איחוד שורות כפולות לאותו שותף + ולידציה
  var byP={}, order=[]; document.querySelectorAll("#split-rows .split-row").forEach(function(r){
    var pid=r.querySelector(".sp-partner").value; var pct=Number(r.querySelector(".sp-pct").value)||0;
    if(pid){ if(byP[pid]==null){byP[pid]=0;order.push(pid);} byP[pid]+=pct; }
  });
  var rows=order.map(function(pid){ return {partnerId:pid,percent:byP[pid]}; });
  /* חלוקה נדרשת רק בדירה שהוגדרו לה שותפים. דירה אישית
     (קרן השתלמות, קופת חיסכון...) נשמרת בלי חלוקה כלל. */
  if(!rows.length){
    if(apPartners(aptId).length){ toast("יש להוסיף לפחות שורת חלוקה אחת","err"); return false; }
  } else {
    var pctSum=rows.reduce(function(s,r){return s+r.percent;},0);
    if(Math.abs(pctSum-100)>0.01){ toast("סכום חלוקת השותפים חייב להיות 100% (כרגע "+num(pctSum)+"%)","err"); return false; }
  }
  if(eId){ var paidSoFar=expensePaid(eId);
    if(amount<paidSoFar-0.01){
      if(!confirm("סכום השלב החדש ("+money(amount)+") נמוך ממה שכבר שולם ("+money(paidSoFar)+").\n\nהשלב יסומן \"שולם ביתר\". להמשיך?")) return false;
    } }
  var e;
  if(eId){ e=byId(DB.expenses,eId); }
  else{ e={id:uid(),apartmentId:aptId,deleted:false}; DB.expenses.push(e); eId=e.id; }
  e.description=desc; e.amount=amount; e.date=val("ex-date")||todayISO();
  e.categoryId=(document.getElementById("ex-cat")?val("ex-cat"):(e.categoryId||""));
  e.classification=val("ex-class"); e.note=val("ex-note");
  e.hasInvoice=checked("ex-inv"); e.invoiceLink=val("ex-link");
  /* דמי ניהול — נוגעים בהם אך ורק כשהמקטע באמת הוצג על המסך.
     קודם: כל שמירה מחקה את דמי הניהול ובנתה מחדש רק אם התיבה סומנה,
     כך ששמירה ממצב שבו המקטע לא הוצג מחקה את הנתונים בשקט. */
  var mgmtShown = !!document.getElementById("ex-mgmt");
  if(mgmtShown){
    if(e.mgmtEnabled && !checked("ex-mgmt")){
      /* מבטלים דמי ניהול על הוצאה שכבר שולם עליה למנהלים? צד העלות היה
         מתאפס בעוד התשלומים ממשיכים להיספר — והמאזן נשבר. חוסמים. */
      var mPaid=round2(expPayments(eId).filter(function(p){return p.recipientType==="manager";})
        .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
      if(mPaid>0.01){
        toast("אי אפשר לבטל דמי ניהול — כבר שולמו "+money(mPaid)+" למנהלים על שלב זה. מחק קודם את התשלומים אליהם","err");
        return false;
      }
    }
    e.mgmtEnabled = checked("ex-mgmt");
    e.mgmtBaseType = val("ex-base") || e.mgmtBaseType || "full";
    var vatRaw = val("ex-vat");
    if(vatRaw!==""){ var vn=Number(vatRaw); e.mgmtVatRate = isNaN(vn)?18:vn; }
    else if(e.mgmtVatRate==null){ e.mgmtVatRate = 18; }
  } else {
    if(e.mgmtEnabled==null) e.mgmtEnabled=false;
    if(e.mgmtBaseType==null) e.mgmtBaseType="full";
    if(e.mgmtVatRate==null) e.mgmtVatRate=18;
  }
  // rebuild splits
  DB.expenseSplits=DB.expenseSplits.filter(function(s){return s.expenseId!==eId;});
  rows.forEach(function(r){ DB.expenseSplits.push({id:uid(),expenseId:eId,partnerId:r.partnerId,percent:r.percent,deleted:false}); });
  // rebuild manager fees
  /* בונים מחדש רק כשיש ערכים חדשים על המסך. אם המקטע לא הוצג, או שדמי
     הניהול כבויים — משאירים את הרשומות הקיימות במקום למחוק אותן.
     הן ממילא אינן נספרות כל עוד mgmtEnabled כבוי, ואם יידלק שוב — הנתונים חוזרים. */
  if(mgmtShown && e.mgmtEnabled){
    DB.expenseManagerFees=DB.expenseManagerFees.filter(function(f){return f.expenseId!==eId;});
    apManagers(aptId).forEach(function(m){
      DB.expenseManagerFees.push({id:uid(),expenseId:eId,managerId:m.id,
        pctCurrent:Number(val("mf-cur-"+m.id))||0,pctDeferred:Number(val("mf-def-"+m.id))||0,
        deferredLabel:val("mf-lbl-"+m.id)||"",deferredReleased:checked("mf-rel-"+m.id),deleted:false});
    });
  }
  save(); toast("ההוצאה נשמרה","ok"); rerender();
}

function payTableHtml(aptId){

    var e=byId(DB.expenses,p.expenseId), acc=byId(DB.accounts,p.accountId);

            (p.payerPartnerId?partnerName(p.payerPartnerId):"")+" "+
            (p.recipientType==="manager"?managerName(p.recipientManagerId):"");

    if(Q.payWho && p.payerPartnerId!==Q.payWho) return false;

  });
  var cnt=document.getElementById("pay-count");
  if(cnt) cnt.innerHTML=countLine(list.length,all.length,"תשלומים");

    tot+=Number(p.amount)||0;
    var recip=p.recipientType==="manager"
      ? '<span class="pill">מנהל: '+esc(managerName(p.recipientManagerId))+'</span>' : 'ספק';
    h+='<tr><td>'+dateHe(p.date)+'</td>'+
      '<td><b>'+esc(e?e.description:"—")+'</b></td>'+
      '<td>'+money(p.amount)+'</td>'+
      '<td>'+esc(acc?acc.name:"ידני")+(acc&&acc.isBank?" 🏦":"")+'</td>'+
      '<td>'+(p.payerPartnerId?esc(partnerName(p.payerPartnerId)):(accountIsBank(p.accountId)?'<span class="muted">מהבנק</span>':"—"))+'</td>'+
      '<td>'+recip+'</td><td>'+(METHODS[p.method]||"")+'</td>'+
      '<td>'+(p.hasInvoice?"✔️":"")+'</td>'+
      '<td class="muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis">'+esc(p.note||"")+'</td>'+
      '<td class="right" style="white-space:nowrap">'+
        '<button class="btn btn-ghost btn-sm" onclick="openPayments(\''+p.expenseId+'\')" title="כל תשלומי השלב">💳</button>'+
        (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openPaymentEditor(\''+p.expenseId+'\',\''+p.id+'\')">✏️</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="delPayment(\''+p.id+'\',\''+p.expenseId+'\')">🗑️</button>':'')+'</td></tr>';
  });
  var lbl=(list.length===all.length)?'סה"כ':'סה"כ המסונן';
  h+='</tbody><tfoot><tr><td colspan="2">'+lbl+' ('+list.length+' תשלומים)</td><td>'+money(tot)+'</td>'+

        '<td>'+(p.payerPartnerId?esc(partnerName(p.payerPartnerId)):(acc&&acc.isBank?"מהבנק":"—"))+'</td>'+
        '<td>'+esc(recip)+'</td><td>'+(METHODS[p.method]||"")+'</td><td>'+(p.hasInvoice?"✔️":"")+'</td>'+
        '<td class="right">'+(can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openPaymentEditor(\''+eId+'\',\''+p.id+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="delPayment(\''+p.id+'\',\''+eId+'\')">🗑️</button>':'')+'</td></tr>';
    });
    body+='</tbody></table></div>';
  }
  openModal({title:"תשלומים — "+e.description,wide:true,bodyHtml:body});
}
/* ---------- תשלום מהיר: בחר דירה → בחר שלב שטרם שולם במלואו ---------- */
function openQuickPay(){
  var apts=active(DB.apartments).filter(function(a){return canSeeApartment(a.id);});
  if(!apts.length){ toast("אין דירות במערכת","err"); return; }
  var cur=state.params.apartmentId||apts[0].id;
  openModal({title:"💳 תשלום מהיר",wide:true,bodyHtml:
    '<div class="field"><label>בחר דירה</label><select id="qp-apt" onchange="renderQuickPayList()">'+
      apts.map(function(a){return '<option value="'+a.id+'"'+(a.id===cur?" selected":"")+'>'+esc(a.name)+'</option>';}).join("")+
    '</select></div>'+
    '<div class="field">'+searchBox("qp-q",Q.quick,"חיפוש שלב…","Q.quick=this.value;renderQuickPayList()")+'</div>'+
    '<div id="qp-list"></div>'});
  renderQuickPayList();
}
function renderQuickPayList(){
  var aptId=val("qp-apt"); var box=document.getElementById("qp-list"); if(!box) return;
  var allOpen=apExpenses(aptId).filter(function(e){ return expenseRemaining(e.id)>0.01; });
  var open=allOpen.filter(function(e){ return matches(Q.quick, e.description+" "+(e.note||"")); })
    .sort(function(x,y){ return x.date<y.date?-1:1; });
  if(!allOpen.length){ box.innerHTML='<div class="empty">✅ כל השלבים בדירה זו שולמו במלואם</div>'; return; }
  if(!open.length){ box.innerHTML='<div class="empty">לא נמצא שלב שמתאים לחיפוש</div>'; return; }
  var h='<div class="section-title">שלבים שטרם שולמו במלואם ('+open.length+
    (open.length!==allOpen.length?' מתוך '+allOpen.length:'')+')</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>תאריך</th><th>שלב</th><th>סכום</th><th>שולם</th><th>נותר</th><th></th></tr></thead><tbody>';
  var tot=0;
  open.forEach(function(e){
    var rem=expenseRemaining(e.id); tot+=rem;
    h+='<tr><td>'+dateHe(e.date)+'</td><td><b>'+esc(e.description)+'</b></td>'+
      '<td>'+money(e.amount)+'</td><td>'+money(expensePaid(e.id))+'</td>'+
      '<td class="neg">'+money(rem)+'</td>'+
      '<td class="right"><button class="btn btn-primary btn-sm" onclick="quickPayExpense(\''+e.id+'\')">💳 שלם</button></td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="4">סה"כ נותר בדירה</td><td class="neg">'+money(tot)+'</td><td></td></tr></tfoot></table></div>';
  box.innerHTML=h;
}
function quickPayExpense(eId){ openPaymentEditor(eId,null); }

function delPayment(pid,eId){ var p=byId(DB.payments,pid); confirmDelete("למחוק תשלום זה?",function(){ p.deleted=true; save(); toast("נמחק","ok"); rerender(); openPayments(eId); return false; }); }
function openPaymentEditor(eId,payId){
  var e=byId(DB.expenses,eId); var aptId=e.apartmentId; var a=byId(DB.apartments,aptId);
  var p=payId?byId(DB.payments,payId):null;
  var mgrs=apManagers(aptId);
  var partners=apPartners(aptId);
  var body='<div class="form-grid">'+
    '<div class="field"><label>תאריך</label><input id="pm-date" type="date" value="'+(p?esc(p.date):todayISO())+'"></div>'+
    '<div class="field"><label>סכום (₪)</label><input id="pm-amount" type="number" step="0.01" value="'+(p?esc(String(p.amount)):"")+'"></div>'+
    '<div class="field"><label>מהחשבון</label><select id="pm-account" onchange="onPmAccount()">'+accountOptions(aptId,p?p.accountId:"")+'</select></div>'+
    /* "מי שילם" מוצג רק כשיש שותפים בדירה — בפרויקט אישי אין את מי לבחור */
    (partners.length
      ? '<div class="field"><label>מי שילם (שותף)</label><select id="pm-payer"><option value="">—</option>'+partners.map(function(ap){return '<option value="'+ap.partnerId+'"'+(p&&p.payerPartnerId===ap.partnerId?" selected":"")+'>'+esc(partnerName(ap.partnerId))+'</option>';}).join("")+'</select></div>'
      : '')+
    '<div class="field"><label>אמצעי תשלום</label><select id="pm-method">'+Object.keys(METHODS).map(function(k){return '<option value="'+k+'"'+(p&&p.method===k?" selected":"")+'>'+METHODS[k]+'</option>';}).join("")+'</select></div>'+
    /* בורר "מוטב" מוצג רק כשיש דמי ניהול על השלב — אחרת יש רק אפשרות אחת והוא רעש */
    (e.mgmtEnabled
      ? '<div class="field"><label>המוטב הוא</label><select id="pm-recipient" onchange="onPmRecipient()"><option value="supplier"'+(!p||p.recipientType==="supplier"?" selected":"")+'>הספק של השלב</option><option value="manager"'+(p&&p.recipientType==="manager"?" selected":"")+'>מנהל (דמי ניהול)</option></select></div>'+
        '<div class="field" id="pm-mgr-wrap" style="display:'+(p&&p.recipientType==="manager"?"block":"none")+'"><label>מנהל</label><select id="pm-manager"><option value="">—</option>'+mgrs.map(function(m){return '<option value="'+m.id+'"'+(p&&p.recipientManagerId===m.id?" selected":"")+'>'+esc(m.name)+'</option>';}).join("")+'</select></div>'
      : '')+
    '<div class="field full"><label><input type="checkbox" id="pm-invoice" style="width:auto" '+(p&&p.hasInvoice?"checked":"")+'> יש חשבונית</label><input id="pm-link" placeholder="קישור לחשבונית (אופציונלי)" value="'+esc(p?p.invoiceLink:"")+'" style="margin-top:4px"></div>'+
    '<div class="field full"><label>הערה</label><input id="pm-note" value="'+esc(p?p.note:"")+'"></div>'+
    '</div>'+
    (partners.length?'<div class="hint">תשלום מחשבון בנק 🏦 יורד מיתרת הבנק ואינו משויך לשותף. תשלום מחשבון שותף נחשב לתרומה שלו.</div>':'');
  openModal({title:payId?"עריכת תשלום":"תשלום חדש",bodyHtml:body,saveLabel:"שמירה",onSave:function(){ return savePayment(eId,payId); }});
  onPmAccount();
}
function onPmAccount(){
  var sel=document.getElementById("pm-account"); if(!sel) return;
  var accId=sel.value; var acc=byId(DB.accounts,accId);
  var payer=document.getElementById("pm-payer");
  if(!payer) return;   // דירה בלי שותפים — אין שדה משלם
  if(acc&&acc.isBank){ payer.value=""; payer.disabled=true; }
  else{ payer.disabled=false; if(acc&&acc.partnerId&&!payer.value) payer.value=acc.partnerId; }
}
function onPmRecipient(){ document.getElementById("pm-mgr-wrap").style.display = val("pm-recipient")==="manager"?"block":"none"; }
function savePayment(eId,payId){
  var e=byId(DB.expenses,eId);
  var amount=Number(val("pm-amount"))||0; if(amount<=0){ toast("סכום לא תקין","err"); return false; }
  var accountId=val("pm-account")||null; var isBank=accountIsBank(accountId);
  /* כשאין דמי ניהול על השלב בורר המוטב לא מוצג — ברירת המחדל היא הספק */
  var recipientType=val("pm-recipient")||"supplier";
  var recipientManagerId=recipientType==="manager"?(val("pm-manager")||null):null;
  if(recipientType==="manager"&&!recipientManagerId){ toast("בחר מנהל","err"); return false; }
  var payer=isBank?null:(val("pm-payer")||null);
  /* משלם נדרש רק בדירה שיש בה שותפים — בפרויקט אישי אין את מי לשייך */
  if(!isBank&&!payer&&apPartners(e.apartmentId).length){ toast("בחר מי שילם, או חשבון בנק","err"); return false; }
  // תקרות
  if(recipientType==="supplier"){
    var others=expPayments(eId).filter(function(x){return x.recipientType!=="manager"&&x.id!==payId;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);
    if(others+amount>Number(e.amount)+0.01){
      /* חריגה מהשלב מותרת — אבל רק באישור מפורש, שלא תקרה בטעות הקלדה */
      var over=round2(others+amount-Number(e.amount));
      if(!confirm("שים לב: סך התשלומים ("+money(others+amount)+") יחרוג מסכום השלב ("+money(e.amount)+") ב-"+money(over)+".\n\nהשלב יסומן \"שולם ביתר\". לאשר את התשלום?")) return false;
    }
  }else{
    var cap=mgrFeeLiveOnExpense(eId,recipientManagerId);
    var othersM=expPayments(eId).filter(function(x){return x.recipientType==="manager"&&x.recipientManagerId===recipientManagerId&&x.id!==payId;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);
    if(othersM+amount>cap+0.01){ toast("חורג ממה שמגיע למנהל ("+money(cap)+")","err"); return false; }
  }
  var obj={id:payId||uid(),expenseId:eId,date:val("pm-date")||todayISO(),amount:amount,accountId:accountId,
    payerPartnerId:payer,method:val("pm-method"),recipientType:recipientType,recipientManagerId:recipientManagerId,
    hasInvoice:checked("pm-invoice"),invoiceLink:val("pm-link"),note:val("pm-note"),deleted:false};
  if(payId){ Object.assign(byId(DB.payments,payId),obj); } else DB.payments.push(obj);
  save(); toast("התשלום נשמר","ok"); rerender(); openPayments(eId); return false;
}

/* ---------- דמי ניהול (ניהול + לי׳דג׳ר) ---------- */
function enableManagement(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var a=byId(DB.apartments,aptId); if(!a) return;
  a.hasManagement=true; save(); toast("דמי ניהול הופעלו בדירה","ok"); rerender();
}
function disableManagement(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  if(!confirm("לכבות דמי ניהול בדירה זו?\n\nהמנהלים והנתונים יישמרו, אבל דמי הניהול לא ייכללו בחישובים.")) return;

/* הוספת שני מנהלים בבת אחת — המקרה הנפוץ */
function addTwoManagers(aptId){

    '<div class="form-grid">'+
      '<div class="field"><label>מנהל 1 — שם</label><input id="m2-n1" placeholder="שם המנהל"></div>'+

      '<div class="field"><label>מנהל 2 — שם</label><input id="m2-n2" placeholder="שם המנהל"></div>'+
      '<div class="field"><label>% ברירת מחדל</label><input id="m2-p2" type="number" step="0.01" value="4"></div>'+
    '</div><div class="hint">האחוז הזה הוא ברירת המחדל בלבד — בכל הוצאה אפשר לשנות אותו, וגם לפצל לאחוז נוכחי + דחוי.</div>',
    saveLabel:"הוסף",onSave:function(){

/* העתקת המנהלים מדירה אחרת — כשאותם אנשים חוזרים בכמה פרויקטים */
function copyManagersFrom(aptId){
  var srcs=active(DB.apartments).filter(function(x){ return x.id!==aptId && apManagers(x.id).length; });
  if(!srcs.length){ toast("אין דירה אחרת עם מנהלים מוגדרים","warn"); return; }
  openModal({title:"העתקת מנהלים מדירה אחרת",bodyHtml:
    '<div class="field"><label>מאיזו דירה להעתיק?</label><select id="cm-src">'+
      srcs.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+' — '+apManagers(x.id).length+' מנהלים</option>';}).join("")+
    '</select></div><div class="hint">מנהל שכבר קיים כאן באותו שם לא יועתק שוב.</div>',
    saveLabel:"העתק",onSave:function(){
      var src=val("cm-src"), n=0;
      apManagers(src).forEach(function(m){
        if(apManagers(aptId).some(function(x){return String(x.name).trim()===String(m.name).trim();})) return;
        DB.managers.push({id:uid(),apartmentId:aptId,name:m.name,defaultFeePercent:m.defaultFeePercent,deleted:false}); n++;
      });
      if(!n){ toast("כל המנהלים כבר קיימים כאן","warn"); return false; }
      var a=byId(DB.apartments,aptId); if(a) a.hasManagement=true;
      save(); toast("הועתקו "+n+" מנהלים","ok"); rerender();
    }});
}
function moduleManagers(aptId){
  var a=byId(DB.apartments,aptId);

    return '<div class="card" style="border:2px dashed var(--brand);text-align:center;padding:26px">'+

      '<h3 style="margin:10px 0 6px">דמי ניהול אינם מופעלים בדירה הזאת</h3>'+
      '<p class="muted" style="max-width:520px;margin:0 auto 16px">הפעל כדי להגדיר מנהלים שמקבלים אחוז מההוצאות — כולל אחוז שונה לכל מנהל בכל הוצאה, אחוז נוכחי מול דחוי, ומע"מ.</p>'+

    (can("edit")?'<button class="btn btn-primary btn-sm" onclick="addTwoManagers(\''+aptId+'\')">➕ הוסף מנהלים</button> '+
      '<button class="btn btn-sm" onclick="copyManagersFrom(\''+aptId+'\')">📋 העתק מדירה אחרת</button> '+

      '<div class="muted" style="margin:8px 0">בלי מנהלים לא יופיעו שדות האחוזים בהוצאות. הוסף אותם עכשיו — בדרך כלל שניים.</div>'+
      (can("edit")?'<button class="btn btn-primary btn-sm" onclick="addTwoManagers(\''+aptId+'\')">➕ הוסף מנהלים</button>':'')+
      '</div>';
    return h;
  }
  // ליֹדג׳ר
  h+='<div class="card"><h3>מאזן מנהלים</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>מנהל</th><th>% ברירת מחדל</th><th>מגיע (פעיל, כולל מע"מ)</th><th>קיבל</th><th>יתרה</th><th></th></tr></thead><tbody>';
  mgrs.forEach(function(m){
    var rec=managerReceivable(aptId,m.id), paid=managerPaid(aptId,m.id), bal=rec-paid;
    h+='<tr><td>'+esc(m.name)+'</td><td>'+num(m.defaultFeePercent)+'%</td><td>'+money(rec)+'</td><td>'+money(paid)+'</td>'+
      '<td class="'+(bal>0?"neg":"pos")+'">'+money(bal)+'</td>'+
      '<td class="right">'+(can("edit")?'<button class="btn btn-ghost btn-sm" onclick="editManager(\''+m.id+'\',\''+aptId+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="delManager(\''+m.id+'\',\''+aptId+'\')">🗑️</button>':'')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  /* ---- תשלומים למנהלים: שלב-שלב, לכל מנהל בנפרד ---- */
  mgrs.forEach(function(m){
    var rows=apExpenses(aptId).map(function(e){
      var due=mgrFeeLiveOnExpense(e.id,m.id);
      var paid=mgrPaidOnExpense(e.id,m.id);
      return {e:e,due:due,paid:paid,rem:round2(due-paid)};
    }).filter(function(r){ return r.due>0.01 || r.paid>0.01; })
      .sort(function(x,y){ return x.e.date<y.e.date?-1:1; });
    if(!rows.length) return;
    var tD=0,tP=0;
    h+='<div class="card"><h3>💳 תשלומים ל'+esc(m.name)+'</h3>'+

      '</tr></thead><tbody>';
    rows.forEach(function(r){
      tD+=r.due; tP+=r.paid;

    });
    h+='</tbody><tfoot><tr><td colspan="2">סה"כ</td><td>'+money(tD)+'</td><td>'+money(tP)+'</td>'+

    pend.forEach(function(x){

      h+='<tr><td>'+esc(x.e.description)+'</td><td>'+esc(managerName(x.f.managerId))+'</td><td>'+num(x.f.pctDeferred)+'%</td><td>'+esc(x.f.deferredLabel||"")+'</td><td>'+money(full-live)+'</td>'+

    });
    h+='</tbody></table></div></div>';
  }
  return h;
}
function editManager(id,aptId){

/* ---------- דוח דמי ניהול (חוצה פרויקטים) ---------- */
function moduleMgmtReport(){
  var apts=active(DB.apartments).filter(function(a){ return canSeeApartment(a.id) && a.hasManagement; });
  var h='<div class="toolbar"><h2 style="margin:0">💼 דוח דמי ניהול</h2><div class="sp"></div>'+
    '<button class="btn btn-sm no-print" onclick="window.print()">🖨️ הדפסה</button></div>';
  if(!apts.length){
    return h+'<div class="empty">אין עדיין פרויקט עם דמי ניהול.<br>הפעל בלשונית <b>דמי ניהול</b> של הדירה הרלוונטית.</div>';
  }
  var tCur=0,tDef=0,tPaid=0;
  h+='<div class="card"><h3>סיכום לפי פרויקט</h3><div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>פרויקט</th><th>מנהלים</th><th>נוכחי (מגיע כעת)</th><th>דחוי (עתידי)</th>'+
    '<th>סה"כ בסוף</th><th>שולם</th><th>נותר לתשלום</th></tr></thead><tbody>';
  apts.forEach(function(a){
    var mgrs=apManagers(a.id), cur=0, def=0, paid=0;
    mgrs.forEach(function(m){
      cur+=managerReceivable(a.id,m.id);
      def+=managerDeferredPending(a.id,m.id);
      paid+=managerPaid(a.id,m.id);
    });
    tCur+=cur; tDef+=def; tPaid+=paid;
    var rem=cur-paid;
    h+='<tr><td><b>'+esc(a.name)+'</b></td><td>'+mgrs.length+'</td>'+
      '<td>'+money(cur)+'</td><td class="'+(def>0.01?"neg":"")+'">'+money(def)+'</td>'+
      '<td><b>'+money(cur+def)+'</b></td><td>'+money(paid)+'</td>'+
      '<td class="'+(rem>0.01?"neg":"pos")+'">'+money(rem)+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="2">סה"כ</td><td>'+money(tCur)+'</td><td>'+money(tDef)+'</td>'+
    '<td>'+money(tCur+tDef)+'</td><td>'+money(tPaid)+'</td><td class="'+((tCur-tPaid)>0.01?"neg":"pos")+'">'+money(tCur-tPaid)+'</td></tr></tfoot></table></div>'+
    '<div class="hint"><b>נוכחי</b> = מה שמגיע כבר עכשיו (האחוז הנוכחי + דחוי ששוחרר). <b>דחוי</b> = מה שיגיע בעתיד וטרם שוחרר. כל הסכומים כוללים מע"מ.</div></div>';

  // פירוט לפי מנהל
  h+='<div class="card"><h3>פירוט לפי מנהל</h3><div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>פרויקט</th><th>מנהל</th><th>נוכחי</th><th>דחוי</th><th>סה"כ בסוף</th><th>קיבל</th><th>יתרה</th></tr></thead><tbody>';
  var any=false;
  apts.forEach(function(a){
    apManagers(a.id).forEach(function(m){
      var cur=managerReceivable(a.id,m.id), def=managerDeferredPending(a.id,m.id), paid=managerPaid(a.id,m.id);
      if(!cur && !def && !paid) return;
      any=true;
      h+='<tr><td>'+esc(a.name)+'</td><td><b>'+esc(m.name)+'</b></td>'+
        '<td>'+money(cur)+'</td><td class="'+(def>0.01?"neg":"")+'">'+money(def)+'</td>'+
        '<td>'+money(cur+def)+'</td><td>'+money(paid)+'</td>'+
        '<td class="'+((cur-paid)>0.01?"neg":"pos")+'">'+money(cur-paid)+'</td></tr>';
    });
  });
  if(!any) h+='<tr><td colspan="7" class="empty">אין עדיין דמי ניהול מחושבים — סמן "יש דמי ניהול" בהוצאות הרלוונטיות</td></tr>';
  h+='</tbody></table></div></div>';

  // דחויים שממתינים לשחרור
  var pend=[], ps=0;
  apts.forEach(function(a){
    apExpenses(a.id).forEach(function(e){
      if(!e.mgmtEnabled) return;
      expMgrFees(e.id).forEach(function(f){
        var mg=byId(DB.managers,f.managerId); if(!mg||mg.deleted) return;
        if((Number(f.pctDeferred)||0)>0 && !f.deferredReleased){
          var amt=mgrFeeFullOnExpense(e.id,f.managerId)-mgrFeeLiveOnExpense(e.id,f.managerId);
          pend.push({apt:a,e:e,f:f,amt:amt}); ps+=amt;
        }
      });
    });
  });
  if(pend.length){
    h+='<div class="card"><h3>דחויים שממתינים לשחרור ('+pend.length+')</h3><div class="table-wrap"><table class="tbl"><thead><tr>'+
      '<th>פרויקט</th><th>הוצאה</th><th>מנהל</th><th>% דחוי</th><th>מתי ישוחרר</th><th>סכום</th><th></th></tr></thead><tbody>';
    pend.forEach(function(x){
      h+='<tr><td>'+esc(x.apt.name)+'</td><td>'+esc(x.e.description)+'</td><td>'+esc(managerName(x.f.managerId))+'</td>'+
        '<td>'+num(x.f.pctDeferred)+'%</td><td>'+esc(x.f.deferredLabel||"—")+'</td><td>'+money(x.amt)+'</td>'+
        '<td class="right no-print">'+(can("edit")?'<button class="btn btn-primary btn-sm" onclick="releaseDeferred(\''+x.f.id+'\')">שחרר</button>':'')+'</td></tr>';
    });
    h+='</tbody><tfoot><tr><td colspan="5">סה"כ דחוי שטרם שוחרר</td><td><b>'+money(ps)+'</b></td><td></td></tr></tfoot></table></div>'+
      '<div class="hint">"שחרר" הופך את הסכום לחוב פעיל: הוא נכנס לעלות הפרויקט, מתחלק בין השותפים, ומאפשר לשלם למנהל.</div></div>';
  }
  return h;
}

/* ---------- איחוד דירות כפולות ----------
   "הלפרין  17" (רווח כפול) ו"הלפרין 17" נוצרו כשתי דירות. המיזוג מעביר
   את כל התנועות לדירת היעד ומעביר את הכפולה לסל המחזור. */
function mergeApartments(srcId,dstId){
  if(srcId===dstId) return 0;
  var src=byId(DB.apartments,srcId), dst=byId(DB.apartments,dstId);
  if(!src||!dst) return 0;
  var moved=0;
  // הוצאות (החלוקות, דמי הניהול והתשלומים שלהן עוברים איתן דרך expenseId)
  active(DB.expenses).forEach(function(e){ if(e.apartmentId===srcId){ e.apartmentId=dstId; moved++; } });
  // שותפי דירה — לא מכפילים שותף שכבר קיים ביעד
  var dstP={}; apPartners(dstId).forEach(function(x){ dstP[x.partnerId]=1; });
  active(DB.apartmentPartners).forEach(function(x){
    if(x.apartmentId!==srcId) return;
    if(dstP[x.partnerId]){ x.deleted=true; x.deletedBy="merged:"+dstId; }
    else { x.apartmentId=dstId; dstP[x.partnerId]=1; }
  });
  // מנהלים — אותו שם ביעד: מפנים אליו את דמי הניהול והתשלומים
  active(DB.managers).forEach(function(m){
    if(m.apartmentId!==srcId) return;
    var twin=apManagers(dstId).find(function(t){ return normKey(t.name)===normKey(m.name); });
    if(twin){
      DB.expenseManagerFees.forEach(function(f){ if(f.managerId===m.id) f.managerId=twin.id; });
      DB.payments.forEach(function(p){ if(p.recipientManagerId===m.id) p.recipientManagerId=twin.id; });
      m.deleted=true; m.deletedBy="merged:"+dstId;
    } else m.apartmentId=dstId;
  });
  // חשבונות — אותו שם ביעד: מפנים אליו את התשלומים
  active(DB.accounts).forEach(function(ac){
    if(ac.apartmentId!==srcId) return;
    var twin=apAccounts(dstId).find(function(t){ return normKey(t.name)===normKey(ac.name); });
    if(twin){
      DB.payments.forEach(function(p){ if(p.accountId===ac.id) p.accountId=twin.id; });
      ac.deleted=true; ac.deletedBy="merged:"+dstId;
    } else ac.apartmentId=dstId;
  });
  active(DB.deposits).forEach(function(d){ if(d.apartmentId===srcId){ d.apartmentId=dstId; moved++; } });
  active(DB.income).forEach(function(i){ if(i.apartmentId===srcId){ i.apartmentId=dstId; moved++; } });
  if(src.hasBank) dst.hasBank=true;
  if(src.hasManagement) dst.hasManagement=true;
  if(src.notes && !dst.notes) dst.notes=src.notes;
  src.deleted=true; src.deletedBy="merged:"+dstId;
  return moved;
}
function openMergeTool(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var apts=active(DB.apartments);
  // קבוצות של שמות זהים-בפועל
  var byKey={};
  apts.forEach(function(a){ var k=normKey(a.name); (byKey[k]=byKey[k]||[]).push(a); });
  var groups=Object.keys(byKey).map(function(k){return byKey[k];}).filter(function(g){return g.length>1;});
  window._mergeGroups=groups;
  function aptLine(a,gi){
    var n=apExpenses(a.id).length, pay=apAllPayments(a.id).length;
    var best=window._mergeGroups[gi].reduce(function(m,x){ return apExpenses(x.id).length>apExpenses(m.id).length?x:m; });

  }
  var body= groups.length
    ? '<p class="muted">נמצאו '+groups.length+' קבוצות של דירות עם אותו שם בפועל (הבדל של רווחים/גרשיים). '+
      'בחר בכל קבוצה את הדירה <b>שתישאר</b> — כל השאר ימוזגו לתוכה.</p>'+
      groups.map(function(g,gi){
        return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px">'+
          g.map(function(a){return aptLine(a,gi);}).join("")+
          '<button class="btn btn-primary btn-sm" style="margin-top:6px" onclick="mergeGroup('+gi+')">🔀 מזג את הקבוצה</button></div>';
      }).join("")
    : '<p class="pos">✅ לא נמצאו דירות כפולות לפי שם.</p>';
  body+='<div class="section-title">מיזוג ידני</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>דירה למיזוג (תיעלם)</label><select id="mg-src">'+
        apts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label>לתוך (תישאר)</label><select id="mg-dst">'+
        apts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join("")+'</select></div>'+
    '</div>'+
    '<button class="btn btn-sm" onclick="manualMerge()">🔀 מזג ידנית</button>'+
    '<div class="hint">המיזוג מעביר הכל: שלבים, תשלומים, שותפים, מנהלים, חשבונות, הפקדות והכנסות. הדירה שמוזגה עוברת לסל המחזור.</div>';
  openModal({title:"🔀 איחוד דירות כפולות",wide:true,bodyHtml:body});
}
function mergeGroup(gi){
  var g=window._mergeGroups[gi]; if(!g) return;
  var sel=document.querySelector('input[name="mg-'+gi+'"]:checked');
  if(!sel){ toast("בחר את הדירה שתישאר","err"); return; }
  var dstId=sel.value;
  var srcs=g.filter(function(a){return a.id!==dstId;});
  if(!confirm(srcs.length+' דירות ימוזגו לתוך "'+byId(DB.apartments,dstId).name+'".\n\nכל התנועות עוברות, והכפולות עוברות לסל המחזור. אפשר לבטל ב-Ctrl+Z.\n\nלהמשיך?')) return;
  srcs.forEach(function(a){ mergeApartments(a.id,dstId); });
  save(); toast("מוזגו "+srcs.length+" דירות","ok");
  closeModal(); openMergeTool(); rerender();
}
function manualMerge(){
  var s=val("mg-src"), d=val("mg-dst");
  if(s===d){ toast("בחר שתי דירות שונות","err"); return; }
  var sa=byId(DB.apartments,s), da=byId(DB.apartments,d);
  if(!confirm('"'+sa.name+'" תמוזג לתוך "'+da.name+'" ותעבור לסל המחזור.\n\nלהמשיך?')) return;
  mergeApartments(s,d);
  save(); toast("מוזג","ok"); closeModal(); openMergeTool(); rerender();
}
