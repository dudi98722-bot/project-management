<meta charset="utf-8">
<title>ניהול דירות ושותפויות</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --brand:#2563eb; --brand-d:#1d4ed8; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  --chip:#eef2ff; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);direction:rtl;font-size:15px;line-height:1.5}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--brand)}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.hidden{display:none!important}
/* layout */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,var(--brand),var(--brand-d));color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;box-shadow:var(--shadow)}
.topbar .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.topbar .sp{flex:1}
.topbar select{width:auto;min-width:180px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}
.topbar select option{color:#111}
.topbar .who{font-size:13px;opacity:.95}
.nav{display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);padding:8px 18px;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:20}
.nav-item{padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.nav-item:hover{background:var(--chip)}
.nav-item.active{background:var(--brand);color:#fff}
.content{max-width:1200px;margin:0 auto;padding:20px 18px 80px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
/* cards & stats */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.stat .label{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .value{font-size:22px;font-weight:800;margin-top:4px}
.grid{display:grid;gap:14px}
.apt-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.apt-card{cursor:pointer;transition:.12s;border-top:4px solid var(--brand)}
.apt-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,24,40,.12)}
/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
table.tbl th,table.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.tbl th{background:#f8fafc;font-weight:700;color:#374151;position:sticky;top:0}
table.tbl tbody tr:hover{background:#f9fbff}
table.tbl tfoot td{font-weight:800;background:#f8fafc;border-top:2px solid var(--line)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:#f3f4f6}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-d)}
.btn-danger{background:#fff;border-color:#fecaca;color:var(--danger)}
.btn-danger:hover{background:#fef2f2}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:#f3f4f6}
.btn-sm{padding:5px 10px;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}
/* badges */
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.badge-ok{background:#dcfce7;color:#166534}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-muted{background:#eef2f7;color:#475569}
.pill{background:var(--chip);color:var(--brand-d);padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.muted{color:var(--muted)}
.pos{color:var(--ok);font-weight:700}
.neg{color:var(--danger);font-weight:700}
.center{text-align:center}.right{text-align:left}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.field{margin-bottom:10px}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .12s ease}
.modal.wide{max-width:920px}
@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:scale(1);opacity:1}}
.modal-header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{margin:0;font-size:17px}
.modal-body{padding:18px;max-height:70vh;overflow:auto}
.modal-footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start}
.x{cursor:pointer;font-size:22px;color:var(--muted);line-height:1;background:none;border:none}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#2563eb);padding:20px}
.login-card{background:#fff;border-radius:18px;padding:34px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-card h1{font-size:22px;margin:6px 0 4px}
.login-card p{color:var(--muted);margin:0 0 22px;font-size:14px}
/* toast */
#toasts{position:fixed;bottom:18px;left:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:#111827;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:14px;animation:pop .12s ease}
.toast.ok{background:var(--ok)}.toast.err{background:var(--danger)}.toast.warn{background:var(--warn)}
/* split rows */
.split-row,.mgr-row{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:center;margin-bottom:6px}
.sumline{display:flex;justify-content:space-between;padding:8px 2px;font-weight:700;border-top:1px dashed var(--line);margin-top:6px}
.section-title{font-weight:800;margin:16px 0 8px;font-size:15px;color:#334155;border-right:3px solid var(--brand);padding-right:8px}
.hint{font-size:12px;color:var(--muted);margin-top:2px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}.content{padding:14px}}
@media print{.topbar,.nav,.toolbar,.no-print{display:none!important}.content{max-width:100%}}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
"use strict";
/* ============================================================
   מערכת ניהול דירות ושותפויות — קובץ עצמאי
   אחסון: localStorage (מקור אמת מקומי) + סנכרון אופציונלי ל-Google Sheets
   ============================================================ */

/* ---------- קבועים ---------- */
var LSKEY = "apartmentsCRM_v1";
/* אחסון על השרת (VPS) — מקור האמת. מוטמע בקוד כדי שכל מכשיר יתחבר אוטומטית */
/* ---- גוגל שיטס = מקור האמת ----
   הכתובת מוטמעת כדי שכל מכשיר יתחבר אוטומטית.
   האבטחה אינה מסתמכת על סודיות הכתובת אלא על אימות בצד השרת:
   כל בקשה חייבת קוד כניסה תקף, אחרת ה-Apps Script לא מחזיר ולא שומר דבר. */
var SHEETS_URL = "https://script.google.com/macros/s/AKfycbxkuppsmvwlUDhg5ZfZlp7Kz9TRtEJ8XRhc0ihdDO-W5uCH8mxGWHF-wsr2WyopmgbIuQ/exec";
function sheetsUrl(){ return SHEETS_URL; }

/* hash של קוד הכניסה — נשמר ל-session בלבד (נמחק בסגירת הדפדפן) */
var AUTH_KEY = "apartmentsCRM_auth";
var AUTH = "";
function getAuth(){ if(AUTH) return AUTH; try{ return sessionStorage.getItem(AUTH_KEY)||""; }catch(e){ return ""; } }
function setAuth(h){ AUTH=h||""; try{ if(h) sessionStorage.setItem(AUTH_KEY,h); else sessionStorage.removeItem(AUTH_KEY); }catch(e){} }

/* קריאה ל-Apps Script. אובייקט => POST, מחרוזת => GET עם query */
async function api(payload){
  try{
    var r;
    if(typeof payload==="string"){ r=await fetch(SHEETS_URL+"?"+payload,{cache:"no-store"}); }
    else{ r=await fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}); }
    return await r.json();
  }catch(e){ return {ok:false,error:"network"}; }
}
var SYNC="idle";
function syncBadgeHtml(){
  var m={idle:["⏳","מתחבר…"],saving:["🔄","שומר לשיטס…"],ok:["✅","מסונכרן לשיטס"],
         err:["⚠️","שגיאת סנכרון"],local:["💾","מקומי בלבד — לא מחובר"]};
  var x=m[SYNC]||m.idle;
  return '<span id="sync-badge" class="who" style="cursor:pointer" title="לחץ להגדרות סנכרון" '+
    'onclick="go(\'settings\',{stab:\'sheets\'})">'+x[0]+' '+esc(x[1])+'</span>';
}
function setSync(s){ SYNC=s; var el=document.getElementById("sync-badge"); if(el){ el.outerHTML=syncBadgeHtml(); } }
var CLASSIFICATIONS = {investment:"השקעה", ongoing:"שוטף", private:"פרטי"};
var METHODS = {transfer:"העברה", check:"צ׳ק", cash:"מזומן", other:"אחר"};
var ROLES = {admin:"מנהל", editor:"עורך", viewer:"צפייה בלבד", partner:"שותף"};
var BASE_TYPES = {full:"מלא (כל הסכום)", net17:"נטו (מע\"מ 17%)", net18:"נטו (מע\"מ 18%)"};

/* ---------- מצב ---------- */
var DB = null;
var CU = null; // current user
var state = {view:"dashboard", params:{}};

/* ---------- כלים ---------- */
function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function num(n){ n = Number(n)||0; return n.toLocaleString("he-IL",{maximumFractionDigits:2}); }
function money(n){ return "₪" + num(n); }
function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
function dateHe(iso){ if(!iso) return ""; var s=esc(String(iso).slice(0,10)); var p=s.split("-"); return p.length===3? p[2]+"/"+p[1]+"/"+p[0] : s; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
async function hashCode(code){
  try{
    var enc=new TextEncoder().encode(String(code));
    var buf=await crypto.subtle.digest("SHA-256",enc);
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
  }catch(e){ return "plain:"+String(code); }
}
function active(list){ return (list||[]).filter(function(x){return !x.deleted;}); }
function byId(list,id){ return (list||[]).find(function(x){return x.id===id;}); }

/* ---------- טעינה/שמירה ---------- */
function loadDB(){
  try{ var raw=localStorage.getItem(LSKEY); if(raw){ DB=JSON.parse(raw); return true; } }catch(e){}
  DB=null; return false;
}
function saveLocal(){
  try{ localStorage.setItem(LSKEY, JSON.stringify(DB)); }catch(e){}
}
function save(){
  try{ localStorage.setItem(LSKEY, JSON.stringify(DB)); }catch(e){ toast("שגיאת שמירה מקומית","err"); }
  serverSave();   // כל שינוי נשמר גם בגוגל שיטס
}
function blankDB(){
  return {meta:{version:1}, partners:[], apartments:[], apartmentPartners:[], managers:[],
    categories:[], expenses:[], expenseSplits:[], expenseManagerFees:[], accounts:[],
    payments:[], deposits:[], income:[], users:[], settings:{sheetsUrl:"", currency:"₪"}};
}
function toNum(v){ var n=Number(v); return isFinite(n)?n:0; }
function toISO(v){ v=String(v==null?"":v).slice(0,10); return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:""; }
function normalizeDB(d){
  (d.expenses||[]).forEach(function(e){ e.amount=toNum(e.amount); e.date=toISO(e.date); e.mgmtVatRate=toNum(e.mgmtVatRate); });
  (d.expenseSplits||[]).forEach(function(s){ s.percent=toNum(s.percent); });
  (d.expenseManagerFees||[]).forEach(function(f){ f.pctCurrent=toNum(f.pctCurrent); f.pctDeferred=toNum(f.pctDeferred); });
  (d.apartmentPartners||[]).forEach(function(x){ x.defaultPercent=toNum(x.defaultPercent); });
  (d.managers||[]).forEach(function(m){ m.defaultFeePercent=toNum(m.defaultFeePercent); });
  (d.payments||[]).forEach(function(p){ p.amount=toNum(p.amount); p.date=toISO(p.date); });
  (d.deposits||[]).forEach(function(x){ x.amount=toNum(x.amount); x.date=toISO(x.date); });
  (d.income||[]).forEach(function(x){ x.amount=toNum(x.amount); x.date=toISO(x.date); });
  return d;
}

/* ---------- אתחול ראשוני (ללא נתונים) ---------- */
function seedIfEmpty(){
  if(DB && DB.apartments && DB.apartments.length) return;
  DB = blankDB();
  // רשימת סוגי הוצאה התחלתית בלבד — ניתנת לעריכה והוספה מההגדרות
  ["רכישת דירה","עורך דין","רישום בטאבו","תרגום מסמכים","נסיעות וחניה","חותמות","עבודות/שכר","דמי ניהול","שיפוץ","שונות"]
    .forEach(function(n){ DB.categories.push({id:uid(),name:n,deleted:false}); });
  save();
}

/* ============================================================
   חישובים (הלב של המערכת)
   ============================================================ */
function apExpenses(aptId){ return active(DB.expenses).filter(function(e){return e.apartmentId===aptId;}); }
function apPartners(aptId){ return active(DB.apartmentPartners).filter(function(x){return x.apartmentId===aptId;}); }
function apManagers(aptId){ return active(DB.managers).filter(function(x){return x.apartmentId===aptId;}); }
function apAccounts(aptId){ return active(DB.accounts).filter(function(x){return x.apartmentId===aptId;}); }
function apDeposits(aptId){ return active(DB.deposits).filter(function(x){return x.apartmentId===aptId;}); }
function apIncome(aptId){ return active(DB.income).filter(function(x){return x.apartmentId===aptId;}); }
function expSplits(eId){ return active(DB.expenseSplits).filter(function(s){return s.expenseId===eId;}); }
function expPayments(eId){ return active(DB.payments).filter(function(p){return p.expenseId===eId;}); }
function expMgrFees(eId){ return active(DB.expenseManagerFees).filter(function(f){return f.expenseId===eId;}); }
function partnerName(id){ var p=byId(DB.partners,id); return p?p.name:"—"; }
function managerName(id){ var m=byId(DB.managers,id); return m?m.name:"—"; }
function accountIsBank(accId){ if(!accId) return false; var a=byId(DB.accounts,accId); return !!(a&&a.isBank); }

// תשלומי ספק להוצאה (מה ששולם על ההוצאה עצמה)
function expensePaid(eId){
  return round2(expPayments(eId).filter(function(p){return p.recipientType!=="manager";})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
}
function expenseRemaining(eId){ var e=byId(DB.expenses,eId); return round2((e?Number(e.amount):0)-expensePaid(eId)); }
function expenseStatus(eId){ var e=byId(DB.expenses,eId); var paid=expensePaid(eId); var amt=e?Number(e.amount):0;
  if(paid<=0) return "unpaid"; if(paid>=amt-0.01) return "paid"; return "partial"; }

// דמי ניהול
function mgmtBase(e){ var a=Number(e.amount)||0; if(e.mgmtBaseType==="net17")return a/1.17; if(e.mgmtBaseType==="net18")return a/1.18; return a; }
function mgmtVatFactor(e){ return 1+(Number(e.mgmtVatRate)||0)/100; }
function mgrFeeLiveOnExpense(eId,mId){ // כולל מע"מ, רק חלק פעיל (נוכחי + דחוי ששוחרר)
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  var mg=byId(DB.managers,mId); if(!mg||mg.deleted) return 0;
  var f=expMgrFees(eId).find(function(x){return x.managerId===mId;}); if(!f) return 0;
  var base=mgmtBase(e); var live=(Number(f.pctCurrent)||0)/100 + (f.deferredReleased?(Number(f.pctDeferred)||0)/100:0);
  return round2(base*live*mgmtVatFactor(e));
}
function mgrFeeFullOnExpense(eId,mId){ // כולל מע"מ, נוכחי+דחוי (סופי)
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  var f=expMgrFees(eId).find(function(x){return x.managerId===mId;}); if(!f) return 0;
  var base=mgmtBase(e); var tot=((Number(f.pctCurrent)||0)+(Number(f.pctDeferred)||0))/100;
  return round2(base*tot*mgmtVatFactor(e));
}
function expenseMgmtCostLive(eId){ // סך דמי הניהול הפעילים של ההוצאה (עלות שמתחלקת בין השותפים)
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  return round2(expMgrFees(eId).reduce(function(s,f){return s+mgrFeeLiveOnExpense(eId,f.managerId);},0));
}
function mgrPaidOnExpense(eId,mId){
  return round2(expPayments(eId).filter(function(p){return p.recipientType==="manager"&&p.recipientManagerId===mId;})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
}

// שותף — כמה אמור לשלם (חלקו בהוצאות + חלקו בדמי הניהול, לפי חלוקת ההוצאה)
function partnerPctInExpense(eId,pId){ return expSplits(eId).reduce(function(s,x){ return s+(x.partnerId===pId?(Number(x.percent)||0):0); },0); }
function partnerShouldPay(aptId,pId){
  return round2(apExpenses(aptId).reduce(function(sum,e){
    var pct=partnerPctInExpense(e.id,pId)/100; if(!pct) return sum;
    return sum + pct*(Number(e.amount)||0) + pct*expenseMgmtCostLive(e.id);
  },0));
}
// שותף — כמה שילם בפועל (תשלומים ישירים שלו מחשבון שאינו בנק + הפקדותיו לבנק)
function partnerPaid(aptId,pId){
  var expIds={}; apExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
  var direct=active(DB.payments).filter(function(p){
    return expIds[p.expenseId] && !accountIsBank(p.accountId) && p.payerPartnerId===pId;
  }).reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  var deps=apDeposits(aptId).filter(function(d){return d.partnerId===pId;}).reduce(function(s,d){return s+(Number(d.amount)||0);},0);
  return round2(direct+deps);
}
function partnerBalance(aptId,pId){ return round2(partnerPaid(aptId,pId)-partnerShouldPay(aptId,pId)); }
// קבוצת השותפים לדוחות = שותפי-הדירה ∪ כל שותף שמופיע בחלוקת הוצאה (שלא ייעלם כסף מהדוח)
function apReportPartnerIds(aptId){
  var set={}, order=[];
  function add(pid){ if(pid && !set[pid]){ set[pid]=1; order.push(pid); } }
  apPartners(aptId).forEach(function(ap){ add(ap.partnerId); });
  var expIdSet={};
  apExpenses(aptId).forEach(function(e){ expIdSet[e.id]=1; expSplits(e.id).forEach(function(s){ add(s.partnerId); }); });
  apDeposits(aptId).forEach(function(d){ add(d.partnerId); });           // מפקידים לבנק
  active(DB.payments).forEach(function(p){ if(expIdSet[p.expenseId] && !accountIsBank(p.accountId)) add(p.payerPartnerId); }); // משלמים ישירים
  return order;
}
function reportPartnerIds(aptId){
  var ids=apReportPartnerIds(aptId);
  if(CU && CU.role==="partner" && CU.partnerId) ids=ids.filter(function(id){return id===CU.partnerId;});
  return ids;
}
function partnerDefaultPct(aptId,pId){ var r=apPartners(aptId).find(function(x){return x.partnerId===pId;}); return r?r.defaultPercent:null; }

// בנק
function bankBalance(aptId){
  var deps=apDeposits(aptId).reduce(function(s,d){return s+(Number(d.amount)||0);},0);
  var expIds={}; apExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
  var out=active(DB.payments).filter(function(p){return expIds[p.expenseId]&&accountIsBank(p.accountId);})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  return round2(deps-out);
}
// מנהל — מגיע/קיבל/יתרה
function managerReceivable(aptId,mId){ return round2(apExpenses(aptId).reduce(function(s,e){return s+mgrFeeLiveOnExpense(e.id,mId);},0)); }
function managerPaid(aptId,mId){
  var expIds={}; apExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
  return round2(active(DB.payments).filter(function(p){return expIds[p.expenseId]&&p.recipientType==="manager"&&p.recipientManagerId===mId;})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
}
// סיכומי דירה
function apartmentTotals(aptId){
  var exps=apExpenses(aptId);
  var totalExpenses=exps.reduce(function(s,e){return s+(Number(e.amount)||0);},0);
  var totalMgmt=exps.reduce(function(s,e){return s+expenseMgmtCostLive(e.id);},0);
  var totalPaid=exps.reduce(function(s,e){return s+expensePaid(e.id);},0);
  var expIdSet={}; exps.forEach(function(e){expIdSet[e.id]=1;});
  var mgrPaidTot=active(DB.payments).filter(function(p){return expIdSet[p.expenseId]&&p.recipientType==="manager";})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  var income=apIncome(aptId).reduce(function(s,i){return s+(Number(i.amount)||0);},0);
  return {totalExpenses:round2(totalExpenses),totalMgmt:round2(totalMgmt),totalCost:round2(totalExpenses+totalMgmt),
    totalPaid:round2(totalPaid),mgrPaidTot:round2(mgrPaidTot),paidAll:round2(totalPaid+mgrPaidTot),
    remaining:round2(totalExpenses+totalMgmt-totalPaid-mgrPaidTot),
    income:round2(income),bank:bankBalance(aptId)};
}

function can(action){
  if(!CU) return false;
  if(CU.role==="admin") return true;
  if(CU.role==="editor") return action!=="manageUsers"&&action!=="settings";
  if(CU.role==="viewer"||CU.role==="partner") return action==="view";
  return false;
}
function canSeeApartment(aptId){
  if(!CU) return false;
  if(CU.role==="admin"||CU.role==="editor"||CU.role==="viewer") return true;
  if(!CU.allowedApartments||!CU.allowedApartments.length) return true;
  return CU.allowedApartments.indexOf(aptId)>=0;
}

  var v=await api("action=verifyReset&code="+encodeURIComponent(code));

/* ---- סנכרון מול גוגל שיטס (Apps Script) — מקור האמת ---- */
function serverSave(){
  var h=getAuth();
  if(!h){ setSync("local"); return; }
  setSync("saving");
  try{
    fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"save",codeHash:h,data:DB})})
      .then(function(r){ return r.json(); })
      .then(function(j){ setSync(j&&j.ok?"ok":"err"); })
      .catch(function(){ setSync("err"); });
  }catch(e){ setSync("err"); }
}
async function serverLoad(){
  var h=getAuth();
  if(!h){ setSync("local"); return {error:true}; }
  var j=await api({action:"load",codeHash:h});
  if(j&&j.ok){ setSync("ok"); return {data:(j.data||null),user:j.user}; }
  setSync("err"); return {error:true,reason:(j&&j.error)};
}

   אתחול — השרת הוא מקור האמת; localStorage הוא מטמון מקומי
   ============================================================ */
async function boot(){
  var hadLocal=loadDB();
  if(!hadLocal||!DB){ DB=blankDB(); seedIfEmpty(); }
  if(getAuth()){                       // session פעיל -> משחזרים מהשרת
    var res=await serverLoad();
    if(res.data && Array.isArray(res.data.apartments)){
      DB=normalizeDB(res.data); saveLocal();
      if(res.user) CU=res.user;
    } else if(res.reason==="unauthorized"){ setAuth(""); CU=null; }
  }
  renderApp();
}
</script>
<script>
"use strict";
/* ============================================================
   מודולים
   ============================================================ */
function partnerOptions(sel){ return active(DB.partners).map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?" selected":"")+'>'+esc(p.name)+'</option>';}).join(""); }
function categoryOptions(sel){ return '<option value="">—</option>'+active(DB.categories).map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?" selected":"")+'>'+esc(c.name)+'</option>';}).join(""); }
function classOptions(sel){ return Object.keys(CLASSIFICATIONS).map(function(k){return '<option value="'+k+'"'+(k===sel?" selected":"")+'>'+CLASSIFICATIONS[k]+'</option>';}).join(""); }
function accountOptions(aptId,sel){ return '<option value="">— ידני / ללא חשבון —</option>'+apAccounts(aptId).map(function(ac){return '<option value="'+ac.id+'"'+(ac.id===sel?" selected":"")+'>'+esc(ac.name)+(ac.isBank?" 🏦":"")+'</option>';}).join(""); }

/* ---------- שותפי דירה ---------- */
function modulePartners(aptId){
  var rows=apPartners(aptId); var sum=rows.reduce(function(s,r){return s+(Number(r.defaultPercent)||0);},0);
  var h='<div class="toolbar"><h3 style="margin:0">שותפי הדירה ואחוזי ברירת מחדל</h3><div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-primary btn-sm" onclick="addApartmentPartner(\''+aptId+'\')">➕ הוסף שותף</button>':'')+'</div>';
  h+='<div class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>שותף</th><th>% ברירת מחדל</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td>'+esc(partnerName(r.partnerId))+'</td><td>'+num(r.defaultPercent)+'%</td><td class="right">'+
      (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="editApPartner(\''+r.id+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="softDelete(\'apartmentPartners\',\''+r.id+'\',\'להסיר שותף זה מהדירה?\')">🗑️</button>':'')+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><td>סה"כ</td><td class="'+(Math.abs(sum-100)<0.01?"pos":"neg")+'">'+num(sum)+'%</td><td></td></tr></tfoot></table></div>';
  if(Math.abs(sum-100)>=0.01) h+='<div class="hint neg">שים לב: סכום האחוזים אינו 100%.</div>';
  h+='</div>';
  return h;
}
function addApartmentPartner(aptId){
  var inApt={}; apPartners(aptId).forEach(function(x){inApt[x.partnerId]=1;});
  var avail=active(DB.partners).filter(function(p){return !inApt[p.id];});
  openModal({title:"הוספת שותף לדירה",bodyHtml:
    '<div class="field"><label>בחר שותף קיים</label><select id="apn-existing"><option value="">— חדש —</option>'+
      avail.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join("")+'</select></div>'+
    '<div class="field"><label>או שם שותף חדש</label><input id="apn-new" placeholder="שם"></div>'+
    '<div class="field"><label>% ברירת מחדל</label><input id="apn-pct" type="number" step="0.01" value="0"></div>',
    onSave:function(){
      var pid=val("apn-existing"); var newName=val("apn-new").trim();
      if(!pid&&newName){ pid=uid(); DB.partners.push({id:pid,name:newName,phone:"",notes:"",deleted:false}); }
      if(!pid){ toast("בחר או הזן שותף","err"); return false; }
      DB.apartmentPartners.push({id:uid(),apartmentId:aptId,partnerId:pid,defaultPercent:Number(val("apn-pct"))||0,deleted:false});
      save(); toast("נוסף","ok"); rerender();
    }});
}
function editApPartner(id){
  var r=byId(DB.apartmentPartners,id);
  openModal({title:"עריכת אחוז ברירת מחדל — "+partnerName(r.partnerId),bodyHtml:
    '<div class="field"><label>% ברירת מחדל</label><input id="app-pct" type="number" step="0.01" value="'+esc(String(r.defaultPercent))+'"></div>',
    onSave:function(){ r.defaultPercent=Number(val("app-pct"))||0; save(); toast("נשמר","ok"); rerender(); }});
}

/* ---------- הוצאות ---------- */
function moduleExpenses(aptId){
  var exps=apExpenses(aptId);
  var a=byId(DB.apartments,aptId);
  var h='<div class="toolbar"><h3 style="margin:0">הוצאות / שלבים ('+exps.length+')</h3><div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-primary btn-sm" onclick="openExpenseEditor(null,\''+aptId+'\')">➕ הוצאה חדשה</button>':'')+'</div>';
  if(!exps.length) return h+'<div class="empty">אין הוצאות עדיין.</div>';
  h+='<div class="table-wrap"><table class="tbl"><thead><tr><th>תאריך</th><th>תיאור</th><th>סוג</th><th>סיווג</th><th>סכום</th>'+
    (a.hasManagement?'<th>דמי ניהול</th>':'')+'<th>שולם</th><th>נותר</th><th>סטטוס</th><th></th></tr></thead><tbody>';
  exps.sort(function(x,y){return (x.date<y.date)?1:-1;}).forEach(function(e){
    var st=expenseStatus(e.id), rem=expenseRemaining(e.id), cat=byId(DB.categories,e.categoryId);
    var badge=st==="paid"?'<span class="badge badge-ok">שולם</span>':st==="partial"?'<span class="badge badge-warn">חלקי</span>':'<span class="badge badge-danger">לא שולם</span>';
    h+='<tr><td>'+dateHe(e.date)+'</td><td><b>'+esc(e.description)+'</b>'+(e.hasInvoice?' 📎':'')+'</td>'+
      '<td>'+esc(cat?cat.name:"—")+'</td><td>'+(CLASSIFICATIONS[e.classification]||"")+'</td>'+
      '<td>'+money(e.amount)+'</td>'+
      (a.hasManagement?'<td>'+(e.mgmtEnabled?money(expenseMgmtCostLive(e.id)):'—')+'</td>':'')+
      '<td>'+money(expensePaid(e.id))+'</td><td class="'+(rem>0?"neg":"pos")+'">'+money(rem)+'</td><td>'+badge+'</td>'+
      '<td class="right" style="white-space:nowrap">'+
        '<button class="btn btn-ghost btn-sm" onclick="openPayments(\''+e.id+'\')" title="תשלומים">💳</button>'+
        (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openExpenseEditor(\''+e.id+'\',\''+aptId+'\')">✏️</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="softDelete(\'expenses\',\''+e.id+'\',\'למחוק הוצאה זו?\')">🗑️</button>':'')+'</td></tr>';
  });
  // סיכום
  var tot=exps.reduce(function(s,e){return s+(Number(e.amount)||0);},0);
  var totPaid=exps.reduce(function(s,e){return s+expensePaid(e.id);},0);
  h+='</tbody><tfoot><tr><td colspan="4">סה"כ</td><td>'+money(tot)+'</td>'+(a.hasManagement?'<td></td>':'')+'<td>'+money(totPaid)+'</td><td>'+money(tot-totPaid)+'</td><td colspan="2"></td></tr></tfoot></table></div>';
  return h;
}
function splitRowHtml(pid,pct){
  return '<div class="split-row"><select class="sp-partner">'+partnerOptions(pid)+'</select>'+
    '<input class="sp-pct" type="number" step="0.01" value="'+(pct||0)+'" oninput="updateSplitSum()">'+
    '<button class="btn btn-ghost btn-sm" onclick="this.closest(\'.split-row\').remove();updateSplitSum()">✕</button></div>';
}
function updateSplitSum(){
  var sum=0; document.querySelectorAll("#split-rows .sp-pct").forEach(function(i){sum+=Number(i.value)||0;});
  var el=document.getElementById("split-sum"); if(el){ el.textContent=num(sum)+"%"; el.className=Math.abs(sum-100)<0.01?"pos":"neg"; }
}
function addSplitRow(){ document.getElementById("split-rows").insertAdjacentHTML("beforeend",splitRowHtml("",0)); updateSplitSum(); }
function toggleMgmt(){ var el=document.getElementById("mgmt-details"); if(el) el.style.display=checked("ex-mgmt")?"block":"none"; }
function openExpenseEditor(eId,aptId){
  var a=byId(DB.apartments,aptId);
  var e=eId?byId(DB.expenses,eId):null;
  var splits = e? expSplits(eId).map(function(s){return [s.partnerId,s.percent];}) : apPartners(aptId).map(function(p){return [p.partnerId,p.defaultPercent];});
  var body='<div class="section-title">פרטי ההוצאה</div>'+
    '<div class="form-grid">'+
     '<div class="field"><label>תיאור</label><input id="ex-desc" value="'+esc(e?e.description:"")+'"></div>'+
     '<div class="field"><label>סכום (₪)</label><input id="ex-amount" type="number" step="0.01" value="'+(e?esc(String(e.amount)):"")+'"></div>'+
     '<div class="field"><label>תאריך</label><input id="ex-date" type="date" value="'+(e?esc(e.date):todayISO())+'"></div>'+
     '<div class="field"><label>סוג הוצאה</label><select id="ex-cat">'+categoryOptions(e?e.categoryId:"")+'</select></div>'+
     '<div class="field"><label>סיווג</label><select id="ex-class">'+classOptions(e?e.classification:"investment")+'</select></div>'+
     '<div class="field"><label>הערה</label><input id="ex-note" value="'+esc(e?e.note:"")+'"></div>'+
     '<div class="field full"><label><input type="checkbox" id="ex-inv" style="width:auto" '+(e&&e.hasInvoice?"checked":"")+'> יש חשבונית/קבלה</label><input id="ex-link" placeholder="קישור לקבלה (אופציונלי)" value="'+esc(e?e.invoiceLink:"")+'" style="margin-top:4px"></div>'+
    '</div>'+
    '<div class="section-title">חלוקת שותפים <span class="hint">(מאותחל מברירת המחדל, ניתן לשנות)</span></div>'+
    '<div id="split-rows">'+splits.map(function(s){return splitRowHtml(s[0],s[1]);}).join("")+'</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">'+
      '<button class="btn btn-sm" onclick="addSplitRow()">➕ הוסף שותף</button>'+
      '<div>סה"כ: <b id="split-sum">100%</b></div></div>';
  // דמי ניהול
  if(a.hasManagement){
    var mgrs=apManagers(aptId);
    body+='<div class="section-title">דמי ניהול</div>'+
      '<div class="field"><label><input type="checkbox" id="ex-mgmt" style="width:auto" onchange="toggleMgmt()" '+(e&&e.mgmtEnabled?"checked":"")+'> יש דמי ניהול על הוצאה זו</label></div>'+
      '<div id="mgmt-details" style="display:'+(e&&e.mgmtEnabled?"block":"none")+'">'+
      '<div class="form-grid">'+
        '<div class="field"><label>בסיס החישוב</label><select id="ex-base">'+Object.keys(BASE_TYPES).map(function(k){return '<option value="'+k+'"'+(e&&e.mgmtBaseType===k?" selected":"")+'>'+BASE_TYPES[k]+'</option>';}).join("")+'</select></div>'+
        '<div class="field"><label>מע"מ על דמי הניהול</label><select id="ex-vat">'+[0,17,18].map(function(v){return '<option value="'+v+'"'+((e?e.mgmtVatRate:18)==v?" selected":"")+'>'+(v===0?"ללא":v+"%")+'</option>';}).join("")+'</select></div>'+
      '</div>'+
      mgrs.map(function(m){
        var f=e?expMgrFees(eId).find(function(x){return x.managerId===m.id;}):null;
        var cur=f?f.pctCurrent:m.defaultFeePercent, def=f?f.pctDeferred:0, lbl=f?f.deferredLabel:"בסיום הבנייה", rel=f?f.deferredReleased:false;
        return '<div style="border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px"><b>'+esc(m.name)+'</b>'+
          '<div class="form-grid" style="margin-top:6px">'+
          '<div class="field"><label>% נוכחי</label><input id="mf-cur-'+m.id+'" type="number" step="0.01" value="'+esc(String(cur))+'"></div>'+
          '<div class="field"><label>% דחוי</label><input id="mf-def-'+m.id+'" type="number" step="0.01" value="'+esc(String(def))+'"></div>'+
          '<div class="field"><label>תווית הדחוי</label><input id="mf-lbl-'+m.id+'" value="'+esc(lbl)+'"></div>'+
          '<div class="field"><label><input type="checkbox" id="mf-rel-'+m.id+'" style="width:auto" '+(rel?"checked":"")+'> הדחוי שוחרר לתשלום</label></div>'+
          '</div></div>';
      }).join("")+
      '<div class="hint">דמי הניהול (כולל מע"מ) מתחלקים בין השותפים לפי חלוקת ההוצאה שלמעלה.</div>'+
      '</div>';
  }
  openModal({title:eId?"עריכת הוצאה":"הוצאה חדשה",wide:true,bodyHtml:body,saveLabel:"שמירה",onSave:function(){ return saveExpense(eId,aptId); }});
  setTimeout(updateSplitSum,30);
}
function saveExpense(eId,aptId){
  var a=byId(DB.apartments,aptId);
  var desc=val("ex-desc").trim(); var amount=Number(val("ex-amount"))||0;
  if(!desc){ toast("יש להזין תיאור","err"); return false; }
  if(amount<=0){ toast("יש להזין סכום","err"); return false; }
  // חלוקה — איחוד שורות כפולות לאותו שותף + ולידציה
  var byP={}, order=[]; document.querySelectorAll("#split-rows .split-row").forEach(function(r){
    var pid=r.querySelector(".sp-partner").value; var pct=Number(r.querySelector(".sp-pct").value)||0;
    if(pid){ if(byP[pid]==null){byP[pid]=0;order.push(pid);} byP[pid]+=pct; }
  });
  var rows=order.map(function(pid){ return {partnerId:pid,percent:byP[pid]}; });
  if(!rows.length){ toast("יש להוסיף לפחות שורת חלוקה אחת","err"); return false; }
  var pctSum=rows.reduce(function(s,r){return s+r.percent;},0);
  if(Math.abs(pctSum-100)>0.01){ toast("סכום חלוקת השותפים חייב להיות 100% (כרגע "+num(pctSum)+"%)","err"); return false; }
  if(eId){ var paidSoFar=expensePaid(eId); if(amount<paidSoFar-0.01){ toast("סכום ההוצאה ("+money(amount)+") נמוך מהתשלומים שכבר נרשמו ("+money(paidSoFar)+")","err"); return false; } }
  var e;
  if(eId){ e=byId(DB.expenses,eId); }
  else{ e={id:uid(),apartmentId:aptId,deleted:false}; DB.expenses.push(e); eId=e.id; }
  e.description=desc; e.amount=amount; e.date=val("ex-date")||todayISO();
  e.categoryId=val("ex-cat"); e.classification=val("ex-class"); e.note=val("ex-note");
  e.hasInvoice=checked("ex-inv"); e.invoiceLink=val("ex-link");
  e.mgmtEnabled = a.hasManagement ? checked("ex-mgmt") : false;
  e.mgmtBaseType = val("ex-base")||"full"; e.mgmtVatRate = Number(val("ex-vat")); if(isNaN(e.mgmtVatRate)) e.mgmtVatRate=18;
  // rebuild splits
  DB.expenseSplits=DB.expenseSplits.filter(function(s){return s.expenseId!==eId;});
  rows.forEach(function(r){ DB.expenseSplits.push({id:uid(),expenseId:eId,partnerId:r.partnerId,percent:r.percent,deleted:false}); });
  // rebuild manager fees
  DB.expenseManagerFees=DB.expenseManagerFees.filter(function(f){return f.expenseId!==eId;});
  if(e.mgmtEnabled){
    apManagers(aptId).forEach(function(m){
      DB.expenseManagerFees.push({id:uid(),expenseId:eId,managerId:m.id,
        pctCurrent:Number(val("mf-cur-"+m.id))||0,pctDeferred:Number(val("mf-def-"+m.id))||0,
        deferredLabel:val("mf-lbl-"+m.id)||"",deferredReleased:checked("mf-rel-"+m.id),deleted:false});
    });
  }
  save(); toast("ההוצאה נשמרה","ok"); rerender();
}

/* ---------- תשלומים ---------- */
function openPayments(eId){
  var e=byId(DB.expenses,eId); var pays=expPayments(eId);
  var body='<div class="stat-grid" style="margin-bottom:12px">'+
    stat("סכום ההוצאה",money(e.amount))+stat("שולם",money(expensePaid(eId)))+stat("נותר",money(expenseRemaining(eId)),expenseRemaining(eId)>0?"neg":"pos")+'</div>';
  body+='<div class="toolbar">'+(can("edit")?'<button class="btn btn-primary btn-sm" onclick="openPaymentEditor(\''+eId+'\',null)">➕ תשלום</button>':'')+'</div>';
  if(!pays.length) body+='<div class="empty">אין תשלומים.</div>';
  else{
    body+='<div class="table-wrap"><table class="tbl"><thead><tr><th>תאריך</th><th>סכום</th><th>חשבון</th><th>מי שילם</th><th>מוטב</th><th>אמצעי</th><th>חשבונית</th><th></th></tr></thead><tbody>';
    pays.sort(function(x,y){return x.date<y.date?1:-1;}).forEach(function(p){
      var acc=byId(DB.accounts,p.accountId); var recip=p.recipientType==="manager"?("מנהל: "+managerName(p.recipientManagerId)):"ספק";
      body+='<tr><td>'+dateHe(p.date)+'</td><td>'+money(p.amount)+'</td><td>'+esc(acc?acc.name:"ידני")+(acc&&acc.isBank?" 🏦":"")+'</td>'+
        '<td>'+(p.payerPartnerId?esc(partnerName(p.payerPartnerId)):(acc&&acc.isBank?"מהבנק":"—"))+'</td>'+
        '<td>'+esc(recip)+'</td><td>'+(METHODS[p.method]||"")+'</td><td>'+(p.hasInvoice?"✔️":"")+'</td>'+
        '<td class="right">'+(can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openPaymentEditor(\''+eId+'\',\''+p.id+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="delPayment(\''+p.id+'\',\''+eId+'\')">🗑️</button>':'')+'</td></tr>';
    });
    body+='</tbody></table></div>';
  }
  openModal({title:"תשלומים — "+e.description,wide:true,bodyHtml:body});
}
/* ---------- תשלום מהיר: בחר דירה → בחר שלב שטרם שולם במלואו ---------- */
function openQuickPay(){
  var apts=active(DB.apartments).filter(function(a){return canSeeApartment(a.id);});
  if(!apts.length){ toast("אין דירות במערכת","err"); return; }
  var cur=state.params.apartmentId||apts[0].id;
  openModal({title:"💳 תשלום מהיר",wide:true,bodyHtml:
    '<div class="field"><label>בחר דירה</label><select id="qp-apt" onchange="renderQuickPayList()">'+
      apts.map(function(a){return '<option value="'+a.id+'"'+(a.id===cur?" selected":"")+'>'+esc(a.name)+'</option>';}).join("")+
    '</select></div><div id="qp-list"></div>'});
  renderQuickPayList();
}
function renderQuickPayList(){
  var aptId=val("qp-apt"); var box=document.getElementById("qp-list"); if(!box) return;
  var open=apExpenses(aptId).filter(function(e){ return expenseRemaining(e.id)>0.01; })
    .sort(function(x,y){ return x.date<y.date?-1:1; });
  if(!open.length){ box.innerHTML='<div class="empty">✅ כל השלבים בדירה זו שולמו במלואם</div>'; return; }
  var h='<div class="section-title">שלבים שטרם שולמו במלואם ('+open.length+')</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>תאריך</th><th>שלב</th><th>סכום</th><th>שולם</th><th>נותר</th><th></th></tr></thead><tbody>';
  var tot=0;
  open.forEach(function(e){
    var rem=expenseRemaining(e.id); tot+=rem;
    h+='<tr><td>'+dateHe(e.date)+'</td><td><b>'+esc(e.description)+'</b></td>'+
      '<td>'+money(e.amount)+'</td><td>'+money(expensePaid(e.id))+'</td>'+
      '<td class="neg">'+money(rem)+'</td>'+
      '<td class="right"><button class="btn btn-primary btn-sm" onclick="quickPayExpense(\''+e.id+'\')">💳 שלם</button></td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="4">סה"כ נותר בדירה</td><td class="neg">'+money(tot)+'</td><td></td></tr></tfoot></table></div>';
  box.innerHTML=h;
}
function quickPayExpense(eId){ openPaymentEditor(eId,null); }

function delPayment(pid,eId){ var p=byId(DB.payments,pid); confirmDelete("למחוק תשלום זה?",function(){ p.deleted=true; save(); toast("נמחק","ok"); rerender(); openPayments(eId); return false; }); }
function openPaymentEditor(eId,payId){
  var e=byId(DB.expenses,eId); var aptId=e.apartmentId; var a=byId(DB.apartments,aptId);
  var p=payId?byId(DB.payments,payId):null;
  var mgrs=apManagers(aptId);
  var body='<div class="form-grid">'+
    '<div class="field"><label>תאריך</label><input id="pm-date" type="date" value="'+(p?esc(p.date):todayISO())+'"></div>'+
    '<div class="field"><label>סכום (₪)</label><input id="pm-amount" type="number" step="0.01" value="'+(p?esc(String(p.amount)):"")+'"></div>'+
    '<div class="field"><label>מהחשבון</label><select id="pm-account" onchange="onPmAccount()">'+accountOptions(aptId,p?p.accountId:"")+'</select></div>'+

function onPmAccount(){
  var sel=document.getElementById("pm-account"); var opt=sel.options[sel.selectedIndex];
  var accId=sel.value; var acc=byId(DB.accounts,accId);
  var payer=document.getElementById("pm-payer");
  if(acc&&acc.isBank){ payer.value=""; payer.disabled=true; }
  else{ payer.disabled=false; if(acc&&acc.partnerId&&!payer.value) payer.value=acc.partnerId; }
}
function onPmRecipient(){ document.getElementById("pm-mgr-wrap").style.display = val("pm-recipient")==="manager"?"block":"none"; }
function savePayment(eId,payId){
  var e=byId(DB.expenses,eId);
  var amount=Number(val("pm-amount"))||0; if(amount<=0){ toast("סכום לא תקין","err"); return false; }
  var accountId=val("pm-account")||null; var isBank=accountIsBank(accountId);
  var recipientType=val("pm-recipient"); var recipientManagerId=recipientType==="manager"?(val("pm-manager")||null):null;
  if(recipientType==="manager"&&!recipientManagerId){ toast("בחר מנהל","err"); return false; }
  var payer=isBank?null:(val("pm-payer")||null);
  if(!isBank&&!payer){ toast("בחר מי שילם, או חשבון בנק","err"); return false; }
  // תקרות
  if(recipientType==="supplier"){
    var others=expPayments(eId).filter(function(x){return x.recipientType!=="manager"&&x.id!==payId;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);
    if(others+amount>Number(e.amount)+0.01){ toast("סך התשלומים חורג מסכום ההוצאה ("+money(e.amount)+")","err"); return false; }
  }else{
    var cap=mgrFeeLiveOnExpense(eId,recipientManagerId);
    var othersM=expPayments(eId).filter(function(x){return x.recipientType==="manager"&&x.recipientManagerId===recipientManagerId&&x.id!==payId;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);
    if(othersM+amount>cap+0.01){ toast("חורג ממה שמגיע למנהל ("+money(cap)+")","err"); return false; }
  }
  var obj={id:payId||uid(),expenseId:eId,date:val("pm-date")||todayISO(),amount:amount,accountId:accountId,
    payerPartnerId:payer,method:val("pm-method"),recipientType:recipientType,recipientManagerId:recipientManagerId,
    hasInvoice:checked("pm-invoice"),invoiceLink:val("pm-link"),note:val("pm-note"),deleted:false};
  if(payId){ Object.assign(byId(DB.payments,payId),obj); } else DB.payments.push(obj);
  save(); toast("התשלום נשמר","ok"); rerender(); openPayments(eId); return false;
}

function impNum(v){ var n=parseFloat(String(v==null?"":v).replace(/[^\d.\-]/g,"")); return isFinite(n)?n:0; }
function impDate(v){
  var s=String(v==null?"":v).trim(); if(!s) return todayISO();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  var p=s.split(/[\/.\-]/);
  if(p.length===3){ var y=p[2].length===4?p[2]:("20"+p[2]);
    return y+"-"+String(p[1]).trim().padStart(2,"0")+"-"+String(p[0]).trim().padStart(2,"0"); }
  return todayISO();
}

  if(t.indexOf("פרטי")>=0) return "private";

function methodText(t){ t=String(t||"");
  if(t.indexOf("צ")>=0) return "check";
  if(t.indexOf("העבר")>=0) return "transfer";
  if(t.indexOf("מזומן")>=0) return "cash";

function detectSplitPairs(headers){
  var pairs=[];
  for(var i=0;i<headers.length-1;i++){
    if(/משלם|שותף/.test(headers[i]) && /אחוז|%/.test(headers[i+1])) pairs.push({n:i,p:i+1});
  }
  return pairs;
}

function parseImport(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var raw=val("im-data").trim(); if(!raw){ toast("לא הודבקו נתונים","err"); return; }
  var lines=raw.split(/\r?\n/).filter(function(l){return l.trim();});
  if(lines.length<2){ toast("צריך שורת כותרות + לפחות שורה אחת","err"); return; }
  var sep=lines[0].indexOf("\t")>=0?"\t":",";
  var headers=lines[0].split(sep).map(function(s){return s.trim();});
  var rows=lines.slice(1).map(function(l){return l.split(sep);});
  var type=val("im-type")||"expenses";
  window._imp={headers:headers,rows:rows,type:type,pairs:(type==="expenses"?detectSplitPairs(headers):[])};

  var def=IMPORT_TYPES[type];
  function sel(f){
    var chosen=-1;
    headers.forEach(function(hh,i){ if(chosen<0 && f.hints.some(function(t){return hh.indexOf(t)>=0;})) chosen=i; });
    return '<option value="-1">— ללא —</option>'+headers.map(function(hh,i){
      return '<option value="'+i+'"'+(i===chosen?" selected":"")+'>'+esc(hh)+'</option>'; }).join("");
  }
  var h='<div class="card"><h3>מיפוי עמודות — '+esc(def.label)+'</h3>'+
    '<p class="muted">בחר לכל שדה את העמודה המתאימה. שדות עם * הם חובה.</p><div class="form-grid">'+
    def.fields.map(function(f){
      return '<div class="field"><label>'+esc(f.l)+(f.opt?'':' <span class="neg">*</span>')+'</label>'+
        '<select id="mp-'+f.k+'">'+sel(f)+'</select></div>'; }).join("")+
    '</div>';
  if(type==="expenses"){
    var pairs=window._imp.pairs;
    h+='<div class="section-title">חלוקת שותפים</div>'+
      (pairs.length
        ? '<div class="hint"><span class="pos">✅ זוהו '+pairs.length+' זוגות</span> — '+
          pairs.map(function(p){return esc(headers[p.n])+"+"+esc(headers[p.p]);}).join(" · ")+
          '<br>לכל שורה תיווצר חלוקה משלה לפי הערכים בעמודות האלה.</div>'
        : '<div class="hint neg">לא זוהו זוגות משלם/אחוז — תוחל חלוקת ברירת המחדל של הדירה.</div>');
  }
  h+='<div class="toolbar" style="margin-top:16px"><button class="btn btn-primary" onclick="commitImport()">ייבא '+rows.length+' שורות</button></div></div>';
  h+='<div class="card"><h3>תצוגה מקדימה</h3><div class="table-wrap"><table class="tbl"><thead><tr>'+
    headers.map(function(hh){return '<th>'+esc(hh)+'</th>';}).join("")+'</tr></thead><tbody>'+
    rows.slice(0,8).map(function(r){return '<tr>'+headers.map(function(_,i){return '<td>'+esc(r[i]||"")+'</td>';}).join("")+'</tr>';}).join("")+
    '</tbody></table></div>'+(rows.length>8?'<div class="hint">מוצגות 8 מתוך '+rows.length+' שורות</div>':'')+'</div>';
  document.getElementById("im-preview").innerHTML=h;
}

function commitImport(){
  if(!can("edit")){ toast("אין הרשאה לייבא","err"); return; }
  var imp=window._imp; if(!imp){ toast("יש לנתח קודם","err"); return; }
  var m={}; IMPORT_TYPES[imp.type].fields.forEach(function(f){ m[f.k]=Number(val("mp-"+f.k)); });
  var defApt=val("im-apt");
  var beforeA=active(DB.apartments).length, beforeP=active(DB.partners).length;
  var res={created:0,skipped:0,newApts:0,newPartners:0,reason:""};

  function aptFor(r){
    var name=(m.apartment>=0)?String(r[m.apartment]||"").trim():"";
    if(name) return findOrCreateApartment(name);
    return defApt||null;
  }

  if(imp.type==="expenses"){
    if(m.desc<0||m.amount<0){ toast("חובה למפות תיאור וסכום","err"); return; }
    var firstSplit={};
    imp.rows.forEach(function(r){
      var aptId=aptFor(r); if(!aptId){ res.skipped++; res.reason="לא נמצאה דירה"; return; }
      var desc=String(r[m.desc]||"").trim(); var amt=impNum(r[m.amount]);
      if(!desc && !amt){ res.skipped++; return; }
      var eid=uid();
      DB.expenses.push({id:eid,apartmentId:aptId,
        categoryId:(m.category>=0?findOrCreateCategory(r[m.category]):""),
        classification:(m.classification>=0?classifyText(r[m.classification]):"investment"),
        description:desc||"(ללא תיאור)",amount:amt,
        date:(m.date>=0?impDate(r[m.date]):todayISO()),
        note:(m.note>=0?String(r[m.note]||""):""),
        hasInvoice:false,invoiceLink:"",mgmtEnabled:false,mgmtBaseType:"full",mgmtVatRate:18,deleted:false});
      var split=[];
      (imp.pairs||[]).forEach(function(pr){
        var nm=String(r[pr.n]||"").trim(); var pc=impNum(r[pr.p]);
        if(nm && pc>0){ var pid=findOrCreatePartner(nm); if(pid) split.push({partnerId:pid,percent:pc}); }
      });
      if(!split.length){ split=apPartners(aptId).map(function(x){return {partnerId:x.partnerId,percent:x.defaultPercent};}); }
      split.forEach(function(s){ DB.expenseSplits.push({id:uid(),expenseId:eid,partnerId:s.partnerId,percent:s.percent,deleted:false}); });
      if(!firstSplit[aptId] && split.length) firstSplit[aptId]=split;
      res.created++;
    });
    // דירה שאין בה עדיין שותפים — נקבע לה ברירת מחדל מהחלוקה הראשונה שיובאה
    Object.keys(firstSplit).forEach(function(aptId){
      if(apPartners(aptId).length) return;
      firstSplit[aptId].forEach(function(s){
        DB.apartmentPartners.push({id:uid(),apartmentId:aptId,partnerId:s.partnerId,defaultPercent:s.percent,deleted:false});
      });
    });
  }
  else if(imp.type==="payments"){
    if(m.expense<0||m.amount<0){ toast("חובה למפות 'עבור' וסכום","err"); return; }
    imp.rows.forEach(function(r){
      var aptId=aptFor(r); if(!aptId){ res.skipped++; res.reason="לא נמצאה דירה"; return; }
      var target=String(r[m.expense]||"").trim();
      var e=apExpenses(aptId).find(function(x){ return String(x.description).trim()===target; });
      if(!e){ res.skipped++; res.reason="לא נמצאה הוצאה בשם שב'עבור'"; return; }
      var amt=impNum(r[m.amount]); if(amt<=0){ res.skipped++; return; }
      var accId=(m.account>=0)?findOrCreateAccount(aptId,r[m.account]):null;
      var isBank=accountIsBank(accId);
      var payer=(!isBank && m.payer>=0)?findOrCreatePartner(r[m.payer]):null;
      DB.payments.push({id:uid(),expenseId:e.id,
        date:(m.date>=0?impDate(r[m.date]):todayISO()),amount:amt,
        accountId:accId,payerPartnerId:payer,
        method:(m.method>=0?methodText(r[m.method]):"transfer"),
        recipientType:"supplier",recipientManagerId:null,
        hasInvoice:(m.invoice>=0 && /כן|✔|✓|v|true|1/i.test(String(r[m.invoice]||""))),
        invoiceLink:"",note:(m.note>=0?String(r[m.note]||""):""),deleted:false});
      res.created++;
    });
  }
  else if(imp.type==="deposits"){
    if(m.partner<0||m.amount<0){ toast("חובה למפות שותף וסכום","err"); return; }
    imp.rows.forEach(function(r){
      var aptId=aptFor(r); if(!aptId){ res.skipped++; return; }
      var pid=findOrCreatePartner(r[m.partner]); var amt=impNum(r[m.amount]);
      if(!pid||amt<=0){ res.skipped++; return; }
      var a=byId(DB.apartments,aptId); if(a && !a.hasBank) a.hasBank=true;
      DB.deposits.push({id:uid(),apartmentId:aptId,partnerId:pid,amount:amt,
        date:(m.date>=0?impDate(r[m.date]):todayISO()),
        note:(m.note>=0?String(r[m.note]||""):""),deleted:false});
      res.created++;
    });
  }
  else if(imp.type==="income"){
    if(m.desc<0||m.amount<0){ toast("חובה למפות תיאור וסכום","err"); return; }
    imp.rows.forEach(function(r){
      var aptId=aptFor(r); if(!aptId){ res.skipped++; return; }
      var amt=impNum(r[m.amount]);
      DB.income.push({id:uid(),apartmentId:aptId,description:String(r[m.desc]||"").trim()||"(ללא תיאור)",
        amount:amt,date:(m.date>=0?impDate(r[m.date]):todayISO()),
        note:(m.note>=0?String(r[m.note]||""):""),deleted:false});
      res.created++;
    });
  }

  res.newApts=active(DB.apartments).length-beforeA;
  res.newPartners=active(DB.partners).length-beforeP;
  save();
  toast("יובאו "+res.created+" שורות"+(res.skipped?" · דולגו "+res.skipped:""),res.skipped?"warn":"ok");
  showImportResult(res);
}

function showImportResult(res){
  var box=document.getElementById("im-preview"); if(!box) return;
  box.innerHTML='<div class="card"><h3>✅ הייבוא הושלם</h3><div class="stat-grid">'+
    stat("נוצרו רשומות",num(res.created))+
    stat("דולגו",num(res.skipped),res.skipped?"neg":"pos")+
    stat("דירות חדשות",num(res.newApts))+
    stat("שותפים חדשים",num(res.newPartners))+
    '</div>'+
    (res.skipped?'<div class="hint neg">סיבת הדילוג הנפוצה: '+esc(res.reason||"שורה ריקה")+'. בתשלומים — השם בעמודת "עבור" חייב להיות זהה לתיאור ההוצאה.</div>':'')+
    '<div class="toolbar" style="margin-top:12px"><button class="btn" onclick="go(\'dashboard\',{})">לדירות ←</button>'+
    '<button class="btn" onclick="go(\'import\',{})">ייבוא נוסף</button></div></div>';
}

/* ---------- סל מחזור ---------- */
function moduleRecycle(){
  var groups=[["apartments","דירות"],["partners","שותפים"],["apartmentPartners","שותפי דירה"],["managers","מנהלים"],
    ["categories","סוגי הוצאה"],["expenses","הוצאות"],["payments","תשלומים"],["deposits","הפקדות"],["income","הכנסות"],["users","משתמשים"]];
  var h='<h2>🗑️ סל מחזור</h2><p class="muted">פריטים שנמחקו נשמרים כאן וניתן לשחזר אותם. שום דבר לא נמחק פיזית.</p>';
  var any=false;
  groups.forEach(function(g){
    var items=(DB[g[0]]||[]).filter(function(x){return x.deleted;});
    if(!items.length) return; any=true;
    h+='<div class="card"><h3>'+g[1]+' ('+items.length+')</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>פריט</th><th></th></tr></thead><tbody>';
    items.forEach(function(it){
      h+='<tr><td>'+esc(recycleLabel(g[0],it))+'</td><td class="right"><button class="btn btn-sm" onclick="restoreItem(\''+g[0]+'\',\''+it.id+'\')">♻️ שחזר</button></td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  if(!any) h+='<div class="empty">סל המחזור ריק</div>';
  return h;
}
function recycleLabel(entity,it){
  if(entity==="expenses"||entity==="income") return it.description+" — "+money(it.amount);
  if(entity==="payments") return money(it.amount)+" ("+dateHe(it.date)+")";
  if(entity==="deposits") return partnerName(it.partnerId)+" — "+money(it.amount);
  if(entity==="apartmentPartners") return partnerName(it.partnerId)+" ("+num(it.defaultPercent)+"%)";
  return it.name||it.id;
}
function restoreItem(entity,id){ if(!can("edit")){ toast("אין הרשאה","err"); return; } var it=byId(DB[entity],id); if(it){ it.deleted=false;
  if(entity==="managers"){ DB.expenseManagerFees.forEach(function(f){ if(f.managerId===id) f.deleted=false; }); }
  save(); toast("שוחזר","ok"); rerender(); } }
</script>
