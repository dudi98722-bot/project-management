function delApartment(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var a=byId(DB.apartments,aptId); if(!a) return;
  var exps=apExpenses(aptId), eids={}; exps.forEach(function(e){ eids[e.id]=1; });
  var pays=active(DB.payments).filter(function(p){return eids[p.expenseId];});
  var splits=active(DB.expenseSplits).filter(function(s){return eids[s.expenseId];});
  var fees=active(DB.expenseManagerFees).filter(function(f){return eids[f.expenseId];});
  var deps=apDeposits(aptId), inc=apIncome(aptId);
  var mgrs=apManagers(aptId), accs=apAccounts(aptId), aps=apPartners(aptId);
  if(!confirm('למחוק את הדירה "'+a.name+'" וכל התנועות שלה?\n\n'+
    "• "+exps.length+" הוצאות\n• "+pays.length+" תשלומים\n• "+deps.length+" הפקדות\n• "+inc.length+" הכנסות\n"+
    "• "+aps.length+" שותפים בדירה\n• "+mgrs.length+" מנהלים\n• "+accs.length+" חשבונות\n\n"+
    "הכל עובר לסל המחזור, וניתן לשחזר את הדירה עם כל התנועות בלחיצה אחת.\n\nלהמשיך?")) return;
  var tag="apt:"+aptId;
  function kill(arr){ arr.forEach(function(x){ x.deleted=true; x.deletedBy=tag; }); }
  kill(exps); kill(pays); kill(splits); kill(fees); kill(deps); kill(inc); kill(mgrs); kill(accs); kill(aps);
  a.deleted=true;
  save();
  toast('"'+a.name+'" וכל התנועות שלה הועברו לסל המחזור',"ok");
  go("dashboard",{});
}

/* מפרסר טקסט מופרד שמכבד מרכאות — תא באקסל יכול להכיל ירידת שורה,
   ואז הוא מגיע עטוף במרכאות. פיצול נאיבי לפי \n שבר שורות כאלה לשתיים. */
function parseDelimited(raw,sep){
  var rows=[], row=[], field="", i=0, inQ=false;
  while(i<raw.length){
    var c=raw.charAt(i);
    if(inQ){
      if(c==='"'){
        if(raw.charAt(i+1)==='"'){ field+='"'; i+=2; continue; }
        inQ=false; i++; continue;
      }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c===sep){ row.push(field); field=""; i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ row.push(field); field=""; rows.push(row); row=[]; i++; continue; }
    field+=c; i++;
  }
  if(field!=="" || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); })
             .map(function(r){ return r.map(function(c){ return String(c).replace(/\s+/g," ").trim(); }); });
}
/* מפתח השוואה סלחני: מאחד גרשיים/אפוסטרופים, רווחים כפולים, ורישיות.
   באקסל אותו שם נכתב לפעמים עם ׳ ולפעמים עם ', או עם רווח כפול. */
function normKey(s){
  return String(s==null?"":s)
    .replace(/[‘’׳ʼ'`´]/g,"'")
    .replace(/[“”״"]/g,'"')
    .replace(/[‎‏‪-‮]/g,"")
    .replace(/\s+/g," ")
    .trim().toLowerCase();
}
function impNum(v){ var n=parseFloat(String(v==null?"":v).replace(/[^\d.\-]/g,"")); return isFinite(n)?n:0; }

/* ============================================================
   קריאת קובץ אקסל (.xlsx) ישירות בדפדפן — בלי ספרייה חיצונית.
   xlsx הוא ZIP של קובצי XML; פותחים עם DecompressionStream המובנה.
   ============================================================ */
function readImportFile(inp){
  var f=inp.files && inp.files[0]; if(!f) return;
  inp.value="";
  var nameEl=document.getElementById("im-file-name");
  if(nameEl) nameEl.textContent="⏳ קורא את "+f.name+"…";
  var isXlsx=/\.xlsx$/i.test(f.name);
  if(isXlsx && !window.DecompressionStream){
    toast("הדפדפן הזה ישן מדי לקריאת xlsx — שמור כ-CSV או הדבק","err");
    if(nameEl) nameEl.textContent=""; return;
  }
  var rd=new FileReader();
  rd.onerror=function(){ toast("שגיאה בקריאת הקובץ","err"); if(nameEl) nameEl.textContent=""; };
  if(isXlsx){
    rd.onload=function(){ parseXlsx(rd.result,f.name).catch(function(e){
      toast("קריאת ה-xlsx נכשלה: "+e.message,"err"); if(nameEl) nameEl.textContent=""; }); };
    rd.readAsArrayBuffer(f);
  }else{
    rd.onload=function(){
      var txt=rd.result;
      // אקסל עברי שומר CSV ב-Windows-1255; אם רואים הרבה תווי החלפה — קוראים שוב בקידוד הנכון
      if((txt.match(/�/g)||[]).length>3){
        var rd2=new FileReader();
        rd2.onload=function(){ fileTextToTextarea(rd2.result,f.name); };
        rd2.readAsText(f,"windows-1255"); return;
      }
      fileTextToTextarea(txt,f.name);
    };
    rd.readAsText(f,"utf-8");
  }
}
function fileTextToTextarea(txt,fname){
  var ta=document.getElementById("im-data"); if(ta) ta.value=txt;
  var nameEl=document.getElementById("im-file-name");
  if(nameEl) nameEl.textContent="✅ "+fname;
  parseImport();
}

/* ---------- ZIP: איתור הרשומות ופריסתן ---------- */
async function unzipAll(buf){
  var u8=new Uint8Array(buf), dv=new DataView(buf);
  // End Of Central Directory — סורקים מהסוף
  var eocd=-1;
  for(var i=u8.length-22;i>=Math.max(0,u8.length-70000);i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error("קובץ ZIP לא תקין");
  var count=dv.getUint16(eocd+10,true), cdOfs=dv.getUint32(eocd+16,true);
  var out={}, p=cdOfs;
  for(var n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    var method=dv.getUint16(p+10,true);
    var csize=dv.getUint32(p+20,true);
    var nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    var lho=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    // הכותרת המקומית קובעת איפה הדאטה מתחיל
    var lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
    var dataStart=lho+30+lnlen+lelen;
    var raw=u8.subarray(dataStart,dataStart+csize);
    if(method===0){ out[name]=raw; }
    else if(method===8){
      var ds=new DecompressionStream("deflate-raw");
      var stream=new Blob([raw]).stream().pipeThrough(ds);
      out[name]=new Uint8Array(await new Response(stream).arrayBuffer());
    }
    p+=46+nlen+elen+clen;
  }
  return out;
}
function xmlOf(bytes){ return new DOMParser().parseFromString(new TextDecoder("utf-8").decode(bytes),"application/xml"); }
function colToIdx(ref){ // "BC12" -> 54
  var m=/^([A-Z]+)/.exec(ref); if(!m) return 0;
  var c=0; for(var i=0;i<m[1].length;i++) c=c*26+(m[1].charCodeAt(i)-64);
  return c-1;
}

/* ---------- XLSX → רשת תאים ---------- */
async function parseXlsx(buf,fname){
  var files=await unzipAll(buf);
  // מחרוזות משותפות
  var shared=[];
  if(files["xl/sharedStrings.xml"]){
    var sst=xmlOf(files["xl/sharedStrings.xml"]);
    Array.prototype.forEach.call(sst.getElementsByTagName("si"),function(si){
      var s=""; Array.prototype.forEach.call(si.getElementsByTagName("t"),function(t){ s+=t.textContent; });
      shared.push(s);
    });
  }
  // שמות גיליונות
  var sheets=[];
  if(files["xl/workbook.xml"]){
    var wb=xmlOf(files["xl/workbook.xml"]);
    var rels={};
    if(files["xl/_rels/workbook.xml.rels"]){
      Array.prototype.forEach.call(xmlOf(files["xl/_rels/workbook.xml.rels"]).getElementsByTagName("Relationship"),function(r){
        rels[r.getAttribute("Id")]="xl/"+r.getAttribute("Target").replace(/^\//,"").replace(/^xl\//,"");
      });
    }
    Array.prototype.forEach.call(wb.getElementsByTagName("sheet"),function(s){
      var rid=s.getAttribute("r:id")||s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
      var path=rels[rid]||("xl/worksheets/sheet"+(sheets.length+1)+".xml");
      if(files[path]) sheets.push({name:s.getAttribute("name")||("גיליון "+(sheets.length+1)),path:path});
    });
  }
  if(!sheets.length){
    Object.keys(files).forEach(function(k){
      if(/^xl\/worksheets\/sheet\d+\.xml$/.test(k)) sheets.push({name:k.replace(/^.*\//,""),path:k});
    });
  }
  if(!sheets.length) throw new Error("לא נמצאו גיליונות בקובץ");

  function sheetToGrid(path){
    var doc=xmlOf(files[path]), rows=[];
    Array.prototype.forEach.call(doc.getElementsByTagName("row"),function(rowEl){
      var cells=[];
      Array.prototype.forEach.call(rowEl.getElementsByTagName("c"),function(c){
        var idx=colToIdx(c.getAttribute("r")||"");
        var t=c.getAttribute("t")||"";
        var v="";
        if(t==="inlineStr"){
          var is=c.getElementsByTagName("is")[0];
          if(is){ Array.prototype.forEach.call(is.getElementsByTagName("t"),function(tt){ v+=tt.textContent; }); }
        }else{
          var vEl=c.getElementsByTagName("v")[0];
          if(vEl){ v=vEl.textContent; if(t==="s") v=shared[Number(v)]!=null?shared[Number(v)]:""; }
        }
        cells[idx]=v;
      });
      for(var i=0;i<cells.length;i++) if(cells[i]==null) cells[i]="";
      rows.push(cells);
    });
    return rows;
  }

  if(sheets.length===1){ xlsxGridToTextarea(sheetToGrid(sheets[0].path),fname+" · "+sheets[0].name); return; }
  // כמה גיליונות — נותנים לבחור
  openModal({title:"באיזה גיליון להשתמש?",bodyHtml:
    '<div class="field"><label>הקובץ מכיל '+sheets.length+' גיליונות</label><select id="xl-sheet">'+
      sheets.map(function(s,i){return '<option value="'+i+'">'+esc(s.name)+'</option>';}).join("")+
    '</select></div>',
    saveLabel:"טען גיליון",onSave:function(){
      var s=sheets[Number(val("xl-sheet"))||0];
      xlsxGridToTextarea(sheetToGrid(s.path),fname+" · "+s.name);
    }});
}
function xlsxGridToTextarea(grid,label){
  grid=grid.filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); });
  if(!grid.length){ toast("הגיליון ריק","err"); return; }
  var tsv=grid.map(function(r){
    return r.map(function(c){
      c=String(c==null?"":c);
      if(/[\t\n\r"]/.test(c)) c='"'+c.replace(/"/g,'""')+'"';
      return c;
    }).join("\t");
  }).join("\n");
  var ta=document.getElementById("im-data"); if(ta) ta.value=tsv;
  var nameEl=document.getElementById("im-file-name");
  if(nameEl) nameEl.textContent="✅ "+label+" ("+grid.length+" שורות)";
  toast("נטענו "+grid.length+" שורות מהקובץ","ok");
  parseImport();
}
function impDate(v){
  var s=String(v==null?"":v).trim(); if(!s) return todayISO();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  // מספר סידורי של אקסל (ימים מ-30/12/1899) — כך מגיעים תאריכים מקובץ xlsx
  if(/^\d+(\.\d+)?$/.test(s)){
    var n=parseFloat(s);
    if(n>=15000 && n<=80000){
      var d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);
      return d.toISOString().slice(0,10);
    }
  }
  var p=s.split(/[\/.\-]/);
  if(p.length===3){ var y=p[2].length===4?p[2]:("20"+p[2]);
    return y+"-"+String(p[1]).trim().padStart(2,"0")+"-"+String(p[0]).trim().padStart(2,"0"); }
  return todayISO();
}
/* התאמה סלחנית (normKey) בכל החיפושים: "הלפרין  17" עם רווח כפול ו"הלפרין 17"
   הם אותה דירה. התאמה מדויקת יצרה כפילויות שנראות זהות בעין. */
function findOrCreatePartner(name){
  name=String(name||"").trim(); if(!name) return null;
  var k=normKey(name);
  var p=active(DB.partners).find(function(x){return normKey(x.name)===k;});
  if(p) return p.id;
  var id=uid(); DB.partners.push({id:id,name:name,phone:"",notes:"",deleted:false}); return id;
}
function findOrCreateApartment(name){
  name=String(name||"").trim(); if(!name) return null;

  var a=active(DB.apartments).find(function(x){return normKey(x.name)===k;});
  if(a) return a.id;
  var id=uid(); DB.apartments.push({id:id,name:name,notes:"",hasManagement:false,hasBank:true,deleted:false}); return id;

function findOrCreateCategory(name){

function findOrCreateAccount(aptId,name){

  DB.accounts.push({id:id,apartmentId:aptId,name:name,isBank:/בנק|קופה/.test(name),partnerId:null,deleted:false});

  if(t.indexOf("פרטי")>=0) return "private";
  if(t.indexOf("שוטף")>=0) return "ongoing";
  return "investment"; }
function methodText(t){ t=String(t||"");
  if(t.indexOf("צ")>=0) return "check";
  if(t.indexOf("העבר")>=0) return "transfer";
  if(t.indexOf("מזומן")>=0) return "cash";

function detectSplitPairs(headers){
  var pairs=[];
  for(var i=0;i<headers.length-1;i++){
    if(/משלם|שותף/.test(headers[i]) && /אחוז|%/.test(headers[i+1])) pairs.push({n:i,p:i+1});
  }
  return pairs;
}

function parseImport(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var raw=val("im-data").trim(); if(!raw){ toast("לא הודבקו נתונים","err"); return; }
  var hasHeader=checked("im-hasheader");
  var sep=raw.indexOf("\t")>=0?"\t":",";
  var all=parseDelimited(raw,sep);
  if(!all.length){ toast("לא זוהו שורות","err"); return; }
  if(hasHeader && all.length<2){ toast("צריך שורת כותרות + לפחות שורה אחת (או בטל את סימון הכותרות)","err"); return; }
  var headers, rows;
  if(hasHeader){ headers=all[0]; rows=all.slice(1); }
  else{
    rows=all;
    var maxc=rows.reduce(function(n,r){return Math.max(n,r.length);},1);
    headers=[]; for(var ci=0;ci<maxc;ci++) headers.push("עמודה "+(ci+1));
  }
  var type=val("im-type")||"expenses";
  window._imp={headers:headers,rows:rows,type:type,hasHeader:hasHeader,
    pairs:(type==="expenses"?detectSplitPairs(headers):[])};

  var def=IMPORT_TYPES[type];
  var usedCols={};
  function sel(f){
    var chosen=-1;
    headers.forEach(function(hh,i){ if(chosen<0 && f.hints.some(function(t){return hh.indexOf(t)>=0;})) chosen=i; });
    // שדה חובה שלא זוהה לפי הכותרת (למשל רשימה בלי כותרות) — קח את העמודה הפנויה הראשונה
    if(chosen<0 && !f.opt){ for(var i=0;i<headers.length;i++){ if(!usedCols[i]){ chosen=i; break; } } }
    if(chosen>=0) usedCols[chosen]=1;
    return '<option value="-1">— ללא —</option>'+headers.map(function(hh,i){
      return '<option value="'+i+'"'+(i===chosen?" selected":"")+'>'+esc(hh)+'</option>'; }).join("");
  }
  var h='<div class="card"><h3>מיפוי עמודות — '+esc(def.label)+'</h3>'+
    '<p class="muted">בחר לכל שדה את העמודה המתאימה. שדות עם * הם חובה.</p><div class="form-grid">'+
    def.fields.map(function(f){
      return '<div class="field"><label>'+esc(f.l)+(f.opt?'':' <span class="neg">*</span>')+'</label>'+
        '<select id="mp-'+f.k+'">'+sel(f)+'</select></div>'; }).join("")+
    '</div>';
  if(type==="expenses"){
    var pairs=window._imp.pairs;
    h+='<div class="section-title">חלוקת שותפים</div>'+
      (pairs.length
        ? '<div class="hint"><span class="pos">✅ זוהו '+pairs.length+' זוגות</span> — '+
          pairs.map(function(p){return esc(headers[p.n])+"+"+esc(headers[p.p]);}).join(" · ")+
          '<br>לכל שורה תיווצר חלוקה משלה לפי הערכים בעמודות האלה.</div>'
        : '<div class="hint neg">לא זוהו זוגות משלם/אחוז — תוחל חלוקת ברירת המחדל של הדירה.</div>');
  }
  h+='<div class="toolbar" style="margin-top:16px"><button class="btn btn-primary" onclick="commitImport()">ייבא '+rows.length+' שורות</button></div></div>';
  h+='<div class="card"><h3>תצוגה מקדימה</h3><div class="table-wrap"><table class="tbl"><thead><tr>'+
    headers.map(function(hh){return '<th>'+esc(hh)+'</th>';}).join("")+'</tr></thead><tbody>'+
    rows.slice(0,8).map(function(r){return '<tr>'+headers.map(function(_,i){return '<td>'+esc(r[i]||"")+'</td>';}).join("")+'</tr>';}).join("")+
    '</tbody></table></div>'+(rows.length>8?'<div class="hint">מוצגות 8 מתוך '+rows.length+' שורות</div>':'')+'</div>';
  document.getElementById("im-preview").innerHTML=h;
}

function commitImport(force){
  if(!can("edit")){ toast("אין הרשאה לייבא","err"); return; }
  var imp=window._imp; if(!imp){ toast("יש לנתח קודם","err"); return; }
  // המיפוי נקרא מה-DOM רק כשתפריטי המיפוי עדיין על המסך.
  // אחרי הצגת תוצאות הם מוחלפים, ולכן בייבוא חוזר משתמשים במיפוי שנשמר.
  var flds=IMPORT_TYPES[imp.type].fields, m={};
  if(document.getElementById("mp-"+flds[0].k)){
    flds.forEach(function(f){ m[f.k]=Number(val("mp-"+f.k)); });
    imp.map=m;
    imp.defApt=val("im-apt");
  } else {
    m=imp.map||{};
    flds.forEach(function(f){ if(typeof m[f.k]!=="number"||isNaN(m[f.k])) m[f.k]=-1; });
  }
  var defApt=(document.getElementById("im-apt")?val("im-apt"):(imp.defApt||""));
  var beforeA=active(DB.apartments).length, beforeP=active(DB.partners).length;
  var res={created:0,skipped:0,newApts:0,newPartners:0,reason:"",skippedRows:[],skippedRaw:[],
           autoExpenses:0,forced:!!force,sumCreated:0,sumSkipped:0,missingNames:{}};

  function skip(idx,reason,r){
    res.skipped++; res.reason=reason;
    if(typeof m.amount==="number" && m.amount>=0 && r) res.sumSkipped+=impNum(r[m.amount]);
    // שורות שדולגו כי הן כפילות — אין טעם לנסות שוב; השאר ניתנות לייבוא כפוי
    if(reason.indexOf("ייבוא חוזר")<0 && r) res.skippedRaw.push(r);
    if(res.skippedRows.length<1000){
      res.skippedRows.push({line:idx+(imp.hasHeader?2:1),reason:reason,
        preview:(r||[]).map(function(c){return String(c==null?"":c).trim();}).filter(function(c){return c;}).join(" | ").slice(0,160)});
    }
  }

  function aptFor(r){
    var name=(m.apartment>=0)?String(r[m.apartment]||"").trim():"";
    if(name) return findOrCreateApartment(name);
    return defApt||null;
  }

  if(imp.type==="apartments"){
    if(m.name<0){ toast("חובה למפות את עמודת השם","err"); return; }
    imp.rows.forEach(function(r,idx){
      var nm=String(r[m.name]||"").trim();
      if(!nm){ skip(idx,"שורה ריקה",r); return; }
      var nmk=normKey(nm);
      if(active(DB.apartments).some(function(a){return normKey(a.name)===nmk;})){
        skip(idx,"כבר קיימת דירה בשם הזה",r); return;
      }
      var id=findOrCreateApartment(nm);
      if(id && m.note>=0){ var a=byId(DB.apartments,id); if(a) a.notes=String(r[m.note]||""); }
      res.created++;
    });
  }
  else if(imp.type==="expenses"){
    if(m.desc<0||m.amount<0){ toast("חובה למפות תיאור וסכום","err"); return; }
    var splitFreq={}, noSplit=[];
    imp.rows.forEach(function(r,idx){
      var aptId=aptFor(r); if(!aptId){ skip(idx,"לא זוהתה דירה (עמודת הפרויקט ריקה ולא נבחרה דירת ברירת מחדל)",r); return; }
      var desc=String(r[m.desc]||"").trim(); var amt=impNum(r[m.amount]);
      if(!desc && !amt){ skip(idx,"שורה ריקה — אין תיאור ואין סכום",r); return; }
      var dt=(m.date>=0?impDate(r[m.date]):todayISO());
      // הגנה מפני ייבוא כפול: אותה דירה + תיאור + סכום + תאריך
      if(apExpenses(aptId).some(function(x){
           return String(x.description).trim()===desc && Math.abs((Number(x.amount)||0)-amt)<0.01 && x.date===dt; })){
        skip(idx,"הוצאה זהה כבר קיימת (ייבוא חוזר)",r); return;
      }
      var eid=uid();
      DB.expenses.push({id:eid,apartmentId:aptId,
        categoryId:(m.category>=0?findOrCreateCategory(r[m.category]):""),
        classification:(m.classification>=0?classifyText(r[m.classification]):"investment"),
        description:desc||"(ללא תיאור)",amount:amt,date:dt,
        note:(m.note>=0?String(r[m.note]||""):""),
        hasInvoice:false,invoiceLink:"",mgmtEnabled:false,mgmtBaseType:"full",mgmtVatRate:18,deleted:false});
      var split=[];
      (imp.pairs||[]).forEach(function(pr){
        var nm=String(r[pr.n]||"").trim(); var pc=impNum(r[pr.p]);
        if(nm && pc>0){ var pid=findOrCreatePartner(nm); if(pid) split.push({partnerId:pid,percent:pc}); }
      });
      if(!split.length){ split=apPartners(aptId).map(function(x){return {partnerId:x.partnerId,percent:x.defaultPercent};}); }
      // אין חלוקה בשורה וגם אין עדיין ברירת מחדל לדירה — נשלים בסוף הייבוא
      if(!split.length) noSplit.push({eid:eid,aptId:aptId});
      split.forEach(function(s){ DB.expenseSplits.push({id:uid(),expenseId:eid,partnerId:s.partnerId,percent:s.percent,deleted:false}); });
      if(split.length){   // סופרים תדירות של כל חלוקה, כדי לבחור ברירת מחדל מייצגת
        var sig=split.map(function(s){return s.partnerId+":"+s.percent;}).sort().join("|");
        if(!splitFreq[aptId]) splitFreq[aptId]={};
        if(!splitFreq[aptId][sig]) splitFreq[aptId][sig]={count:0,split:split};
        splitFreq[aptId][sig].count++;
      }
      res.created++; res.sumCreated+=amt;
    });
    // דירה שאין בה עדיין שותפים — ברירת המחדל היא החלוקה הנפוצה ביותר בייבוא,
    // ולא הראשונה שנתקלנו בה (שורה חריגה בתחילת הגיליון הייתה מטה את הכל)
    Object.keys(splitFreq).forEach(function(aptId){
      if(apPartners(aptId).length) return;
      var best=null;
      Object.keys(splitFreq[aptId]).forEach(function(sig){
        var e=splitFreq[aptId][sig];
        if(!best || e.count>best.count) best=e;
      });
      if(!best) return;
      best.split.forEach(function(s){
        DB.apartmentPartners.push({id:uid(),apartmentId:aptId,partnerId:s.partnerId,defaultPercent:s.percent,deleted:false});
      });
    });
    // עכשיו שיש ברירת מחדל — משלימים חלוקה להוצאות שנוצרו בלי אף שותף,
    // אחרת העלות שלהן לא משויכת לאיש והדוחות לא יסתכמו לעלות הכוללת
    noSplit.forEach(function(x){
      if(expSplits(x.eid).length) return;
      apPartners(x.aptId).forEach(function(p){
        DB.expenseSplits.push({id:uid(),expenseId:x.eid,partnerId:p.partnerId,percent:p.defaultPercent,deleted:false});
      });
    });
  }
  else if(imp.type==="payments"){
    if(m.expense<0||m.amount<0){ toast("חובה למפות 'עבור' וסכום","err"); return; }
    /* אינדקס הוצאות לכל דירה: התאמה מדויקת ואחריה התאמה מנורמלת.
       גם מהיר בהרבה מ-find על כל שורה כשיש אלפי הוצאות. */
    var expIdx={};
    function idxFor(aptId){
      if(expIdx[aptId]) return expIdx[aptId];
      var ix={exact:{},norm:{}};
      apExpenses(aptId).forEach(function(x){
        var d=String(x.description).trim();
        if(!ix.exact[d]) ix.exact[d]=x;
        var nk=normKey(d);
        if(!ix.norm[nk]) ix.norm[nk]=x;
      });
      expIdx[aptId]=ix; return ix;
    }
    imp.rows.forEach(function(r,idx){
      var aptId=aptFor(r); if(!aptId){ skip(idx,"לא זוהתה דירה",r); return; }
      var target=String(r[m.expense]||"").trim();
      var ix=idxFor(aptId);
      var e=ix.exact[target] || ix.norm[normKey(target)];
      var amt=impNum(r[m.amount]);
      if(!e && target){
        res.missingNames[target]=(res.missingNames[target]||0)+1;
      }
      if(!e){
        if(force && target && amt>0){
          // ייבוא כפוי: ההוצאה לא קיימת בגיליון ההוצאות — ניצור אותה לפי התשלום
          var neid=uid();
          DB.expenses.push({id:neid,apartmentId:aptId,categoryId:"",
            classification:(m.classification>=0 && String(r[m.classification]||"").trim())?classifyText(r[m.classification]):"investment",
            description:target,amount:amt,date:(m.date>=0?impDate(r[m.date]):todayISO()),
            note:"נוצרה אוטומטית מייבוא תשלומים",hasInvoice:false,invoiceLink:"",
            mgmtEnabled:false,mgmtBaseType:"full",mgmtVatRate:18,deleted:false});
          apPartners(aptId).forEach(function(x){
            DB.expenseSplits.push({id:uid(),expenseId:neid,partnerId:x.partnerId,percent:x.defaultPercent,deleted:false}); });
          e=byId(DB.expenses,neid); res.autoExpenses++;
          idxFor(aptId).exact[target]=e; idxFor(aptId).norm[normKey(target)]=e;
        } else { skip(idx,'לא נמצאה הוצאה בשם "'+target+'"',r); return; }
      }
      if(amt<=0){ skip(idx,"סכום ריק או אפס",r); return; }
      /* עמודת סיווג בגיליון התשלומים מתייחסת להוצאה — מעדכנים אותה
         רק כשהתא מלא, כדי לא לדרוס סיווג קיים בשורות שהשאירו ריק */
      if(m.classification>=0){
        var clsRaw=String(r[m.classification]||"").trim();
        if(clsRaw) e.classification=classifyText(clsRaw);
      }
      var pdt=(m.date>=0?impDate(r[m.date]):todayISO());
      var accId=(m.account>=0)?findOrCreateAccount(aptId,r[m.account]):null;
      var isBank=accountIsBank(accId);
      var payer=(!isBank && m.payer>=0)?findOrCreatePartner(r[m.payer]):null;
      var pnote=(m.note>=0?String(r[m.note]||""):"");
      /* זיהוי כפילות חייב לכלול גם מי שילם, מאיזה חשבון ומה ההערה.
         קודם נבדקו רק סכום+תאריך, ולכן שני תשלומים לגיטימיים של שותפים
         שונים באותו יום ובאותו סכום — השני נחשב "כפילות" ונזרק. */
      if(expPayments(e.id).some(function(p){
           return Math.abs((Number(p.amount)||0)-amt)<0.01 && p.date===pdt &&
                  (p.payerPartnerId||null)===(payer||null) &&
                  (p.accountId||null)===(accId||null) &&
                  String(p.note||"")===pnote; })){
        skip(idx,"תשלום זהה לחלוטין כבר קיים (ייבוא חוזר)",r); return;
      }
      DB.payments.push({id:uid(),expenseId:e.id,
        date:pdt,amount:amt,
        accountId:accId,payerPartnerId:payer,
        method:(m.method>=0?methodText(r[m.method]):"transfer"),
        recipientType:"supplier",recipientManagerId:null,
        hasInvoice:(m.invoice>=0 && /כן|✔|✓|v|true|1/i.test(String(r[m.invoice]||""))),
        invoiceLink:"",note:pnote,deleted:false});
      res.created++; res.sumCreated+=amt;
    });
  }
  else if(imp.type==="deposits"){
    if(m.partner<0||m.amount<0){ toast("חובה למפות שותף וסכום","err"); return; }
    imp.rows.forEach(function(r,idx){
      var aptId=aptFor(r); if(!aptId){ skip(idx,"לא זוהתה דירה",r); return; }
      var pid=findOrCreatePartner(r[m.partner]); var amt=impNum(r[m.amount]);
      if(!pid||amt<=0){ skip(idx,"חסר שותף או סכום",r); return; }
      var ddt=(m.date>=0?impDate(r[m.date]):todayISO());
      if(apDeposits(aptId).some(function(d){ return d.partnerId===pid && Math.abs((Number(d.amount)||0)-amt)<0.01 && d.date===ddt; })){
        skip(idx,"הפקדה זהה כבר קיימת (ייבוא חוזר)",r); return;
      }
      var a=byId(DB.apartments,aptId); if(a && !a.hasBank) a.hasBank=true;
      DB.deposits.push({id:uid(),apartmentId:aptId,partnerId:pid,amount:amt,
        date:ddt,
        note:(m.note>=0?String(r[m.note]||""):""),deleted:false});
      res.created++; res.sumCreated+=amt;
    });
  }
  else if(imp.type==="income"){
    if(m.desc<0||m.amount<0){ toast("חובה למפות תיאור וסכום","err"); return; }
    imp.rows.forEach(function(r,idx){
      var aptId=aptFor(r); if(!aptId){ skip(idx,"לא זוהתה דירה",r); return; }
      var amt=impNum(r[m.amount]);
      var idesc=String(r[m.desc]||"").trim()||"(ללא תיאור)";
      var idt=(m.date>=0?impDate(r[m.date]):todayISO());
      if(apIncome(aptId).some(function(x){ return String(x.description).trim()===idesc && Math.abs((Number(x.amount)||0)-amt)<0.01 && x.date===idt; })){
        skip(idx,"הכנסה זהה כבר קיימת (ייבוא חוזר)",r); return;
      }
      DB.income.push({id:uid(),apartmentId:aptId,description:idesc,
        amount:amt,date:idt,
        note:(m.note>=0?String(r[m.note]||""):""),deleted:false});
      res.created++; res.sumCreated+=amt;
    });
  }

  res.newApts=active(DB.apartments).length-beforeA;
  res.newPartners=active(DB.partners).length-beforeP;
  window._impSkipped=res.skippedRaw;
  save();
  toast("יובאו "+res.created+" שורות"+(res.skipped?" · דולגו "+res.skipped:""),res.skipped?"warn":"ok");
  showImportResult(res);
}

/* ייבוא כפוי של השורות שדולגו (למעט כפילויות) */
function retrySkipped(){
  var imp=window._imp, rows=window._impSkipped||[];
  if(!imp||!rows.length){ toast("אין שורות לייבוא חוזר","warn"); return; }
  if(!confirm("ייובאו "+rows.length+" השורות שדולגו.\n\n"+
    (imp.type==="payments"
      ? "לתשלום שלא נמצאה לו הוצאה — תיווצר הוצאה חדשה בשם שבעמודת \"עבור\", בסכום התשלום.\n\n"
      : "שורות ללא דירה ישויכו לדירת ברירת המחדל שבחרת למעלה.\n\n")+
    "כפילויות ידולגו בכל מקרה. להמשיך?")) return;
  imp.rows=rows;
  commitImport(true);
}

function showImportResult(res){
  var box=document.getElementById("im-preview"); if(!box) return;
  window._lastImportRes=res;
  var h='<div class="card"><h3>✅ הייבוא הושלם'+(res.forced?" (ייבוא כפוי)":"")+'</h3><div class="stat-grid">'+
    stat("נוצרו רשומות",num(res.created))+
    stat("דולגו",num(res.skipped),res.skipped?"neg":"pos")+
    stat("דירות חדשות",num(res.newApts))+
    stat("שותפים חדשים",num(res.newPartners))+
    (res.autoExpenses?stat("הוצאות שנוצרו אוטומטית",num(res.autoExpenses)):"")+
    '</div>'+
    '<div class="stat-grid" style="margin-top:10px">'+
      stat("סכום שיובא",money(res.sumCreated))+
      stat("סכום שדולג",money(res.sumSkipped),res.sumSkipped?"neg":"pos")+
      stat("סה\"כ בקובץ",money(res.sumCreated+res.sumSkipped))+
    '</div>'+
    '<div class="hint">השווה את <b>"סה\"כ בקובץ"</b> לסכום באקסל — כך תדע מיד אם משהו לא נקלט.</div>';
  if(res.skipped){
    var byReason={};
    res.skippedRows.forEach(function(s){ byReason[s.reason]=(byReason[s.reason]||0)+1; });
    h+='<div class="section-title">למה דולגו</div><div class="table-wrap"><table class="tbl"><thead><tr>'+
      '<th>סיבה</th><th>כמות</th></tr></thead><tbody>'+
      Object.keys(byReason).sort(function(a,b){return byReason[b]-byReason[a];}).map(function(k){
        return '<tr><td>'+esc(k)+'</td><td><b>'+byReason[k]+'</b></td></tr>'; }).join("")+
      '</tbody></table></div>';
    var miss=Object.keys(res.missingNames||{});
    if(miss.length){
      miss.sort(function(a,b){ return res.missingNames[b]-res.missingNames[a]; });
      var missTot=miss.reduce(function(s,k){return s+res.missingNames[k];},0);
      h+='<div class="section-title">שמות שלא נמצאה להם הוצאה ('+miss.length+' שמות · '+missTot+' שורות)</div>'+
        '<div class="hint">אלה השמות מעמודת "עבור" שאין להם הוצאה תואמת בדירה. '+
        'או שההוצאה לא יובאה, או שהשם כתוב אחרת בגיליון ההוצאות.</div>'+
        '<div class="table-wrap" style="max-height:260px;overflow:auto"><table class="tbl"><thead><tr>'+
        '<th>השם בעמודת "עבור"</th><th>כמה שורות</th></tr></thead><tbody>'+
        miss.slice(0,200).map(function(k){
          return '<tr><td>'+esc(k)+'</td><td><b>'+res.missingNames[k]+'</b></td></tr>'; }).join("")+
        '</tbody></table></div>'+
        (miss.length>200?'<div class="hint">מוצגים 200 מתוך '+miss.length+'</div>':'');
    }
    h+='<div class="section-title">השורות שדולגו</div>'+
      '<div class="table-wrap" style="max-height:340px;overflow:auto"><table class="tbl"><thead><tr>'+
      '<th>שורה באקסל</th><th>סיבה</th><th>תוכן השורה</th></tr></thead><tbody>'+
      res.skippedRows.map(function(s){
        return '<tr><td>'+s.line+'</td><td class="neg">'+esc(s.reason)+'</td><td>'+esc(s.preview)+'</td></tr>'; }).join("")+
      '</tbody></table></div>';
    h+='<div class="toolbar" style="margin-top:12px">'+
      ((res.skippedRaw&&res.skippedRaw.length)
        ? '<button class="btn btn-primary" onclick="retrySkipped()">🔁 ייבא בכל זאת את הדולגים ('+res.skippedRaw.length+')</button>'
        : '')+
      '<button class="btn" onclick="copySkipped()">📋 העתק רשימה</button></div>'+
      ((res.skippedRaw&&res.skippedRaw.length)?'<div class="hint">"ייבא בכל זאת" מייבא רק את מה שדולג מסיבה שניתן לעקוף. כפילויות תמיד ידולגו.</div>':'');
  }
  h+='<div class="toolbar" style="margin-top:12px"><button class="btn" onclick="go(\'dashboard\',{})">לדירות ←</button>'+
    '<button class="btn" onclick="go(\'import\',{})">ייבוא נוסף</button></div></div>';
  box.innerHTML=h;
}
function copySkipped(){
  var res=window._lastImportRes;
  if(!res||!res.skippedRows.length){ toast("אין מה להעתיק","warn"); return; }
  var txt="שורה\tסיבה\tתוכן\n"+res.skippedRows.map(function(s){ return s.line+"\t"+s.reason+"\t"+s.preview; }).join("\n");
  try{ navigator.clipboard.writeText(txt); toast("הרשימה הועתקה ללוח","ok"); }
  catch(e){ toast("לא ניתן להעתיק בדפדפן הזה","err"); }
}

/* ---------- סל מחזור ---------- */
function moduleRecycle(){
  var groups=[["apartments","דירות"],["partners","שותפים"],["apartmentPartners","שותפי דירה"],["managers","מנהלים"],
    ["categories","סוגי הוצאה"],["expenses","הוצאות"],["payments","תשלומים"],["deposits","הפקדות"],["income","הכנסות"],["users","משתמשים"]];
  var h='<h2>🗑️ סל מחזור</h2><p class="muted">פריטים שנמחקו נשמרים כאן וניתן לשחזר אותם. שום דבר לא נמחק פיזית.</p>'+
    '<div class="toolbar">'+searchBox("rc-q",Q.recycle,"חיפוש בפריטים שנמחקו…","Q.recycle=this.value;renderRecycleList()")+'</div>'+
    '<div id="rc-list">'+recycleListHtml()+'</div>';
  return h;
}
function renderRecycleList(){
  var el=document.getElementById("rc-list"); if(el) el.innerHTML=recycleListHtml();
}
function recycleListHtml(){
  var groups=[["apartments","דירות"],["partners","שותפים"],["apartmentPartners","שותפי דירה"],["managers","מנהלים"],
    ["categories","סוגי הוצאה"],["expenses","הוצאות"],["payments","תשלומים"],["deposits","הפקדות"],["income","הכנסות"],["users","משתמשים"]];
  var h='';
  var any=false;
  groups.forEach(function(g){
    var items=(DB[g[0]]||[]).filter(function(x){
      return x.deleted && matches(Q.recycle, recycleLabel(g[0],x)+" "+g[1]); });
    if(!items.length) return; any=true;
    h+='<div class="card"><h3>'+g[1]+' ('+items.length+')</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>פריט</th><th></th></tr></thead><tbody>';
    items.forEach(function(it){
      h+='<tr><td>'+esc(recycleLabel(g[0],it))+'</td><td class="right"><button class="btn btn-sm" onclick="restoreItem(\''+g[0]+'\',\''+it.id+'\')">♻️ שחזר</button></td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  if(!any) h+='<div class="empty">'+(Q.recycle?'לא נמצא פריט שמתאים לחיפוש':'סל המחזור ריק')+'</div>';
  return h;
}
function recycleLabel(entity,it){
  if(entity==="expenses"||entity==="income") return it.description+" — "+money(it.amount);
  if(entity==="payments") return money(it.amount)+" ("+dateHe(it.date)+")";
  if(entity==="deposits") return partnerName(it.partnerId)+" — "+money(it.amount);
  if(entity==="apartmentPartners") return partnerName(it.partnerId)+" ("+num(it.defaultPercent)+"%)";
  return it.name||it.id;
}
function restoreItem(entity,id){ if(!can("edit")){ toast("אין הרשאה","err"); return; } var it=byId(DB[entity],id); if(it){ it.deleted=false; delete it.deletedBy;
  if(entity==="managers"){ DB.expenseManagerFees.forEach(function(f){ if(f.managerId===id) f.deleted=false; }); }
  if(entity==="apartments"){
    var tag="apt:"+id, n=0;
    ["expenses","payments","expenseSplits","expenseManagerFees","deposits","income","managers","accounts","apartmentPartners"]
      .forEach(function(k){ (DB[k]||[]).forEach(function(x){
        if(x.deleted && x.deletedBy===tag){ x.deleted=false; delete x.deletedBy; n++; } }); });
    if(n) toast("שוחזרו גם "+n+" תנועות של הדירה","ok");
  }
  save(); toast("שוחזר","ok"); rerender(); } }
</script>

<script>boot();</script>
