<meta charset="utf-8">
<title>לווי וניהול פרוייקטים</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- אייקון בית ללשונית — SVG מוטמע, בלי בקשת רשת חיצונית -->

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%232563eb'/%3E%3Cpath d='M32 12L55 32h-6v20H15V32H9z' fill='%23ffffff'/%3E%3Crect x='27' y='38' width='10' height='14' rx='1.5' fill='%232563eb'/%3E%3Crect x='19' y='34' width='6' height='6' rx='1' fill='%232563eb'/%3E%3Crect x='39' y='34' width='6' height='6' rx='1' fill='%232563eb'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef0f7; --panel:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#e6e9f4;
  --brand:#4f46e5; --brand-d:#4338ca; --brand-l:#eef2ff;
  --ok:#059669; --warn:#d97706; --danger:#dc2626;
  --chip:#eef2ff; --shadow:0 1px 2px rgba(30,41,59,.06),0 4px 16px rgba(30,41,59,.06);
  --shadow-lg:0 8px 30px rgba(30,41,59,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Rubik","Heebo","Assistant","Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;
  background:var(--bg);
  background-image:radial-gradient(900px 340px at 85% -80px,rgba(79,70,229,.10),transparent 60%),
                   radial-gradient(700px 300px at 8% -60px,rgba(14,165,233,.08),transparent 55%);
  background-attachment:fixed;
  color:var(--ink);direction:rtl;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h2{font-weight:800;letter-spacing:-.01em}
h3{font-weight:700}
button{font-family:inherit}
::selection{background:#c7d2fe}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#c3c9de;border-radius:8px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#9aa3c4;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:9px 12px;
  border:1.5px solid #dde1f0;border-radius:10px;background:#fff;color:var(--ink);
  transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:#c4cbe8}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3.5px rgba(79,70,229,.13)}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.hidden{display:none!important}

/* ===== מסגרת עליונה ===== */
.topbar{position:sticky;top:0;z-index:30;color:#fff;display:flex;align-items:center;gap:12px;
  padding:11px 20px;
  background:linear-gradient(120deg,#1e1b4b 0%,#312e81 45%,#4338ca 100%);
  box-shadow:0 4px 20px rgba(30,27,75,.35)}
.topbar .logo{display:flex;align-items:center;gap:11px;letter-spacing:-.01em}
.topbar .logo .mark{display:grid;place-items:center;width:36px;height:36px;flex:none;
  background:linear-gradient(150deg,#6366f1,#38bdf8);border-radius:11px;
  box-shadow:0 4px 12px rgba(56,189,248,.35);border:1px solid rgba(255,255,255,.25)}
.topbar .logo .mark svg{width:21px;height:21px}
.topbar .logo .brand{display:flex;flex-direction:column;line-height:1.08}
.topbar .logo .brand b{font-weight:800;font-size:16px}
.topbar .logo .brand small{font-size:10px;font-weight:600;opacity:.72;letter-spacing:.03em}
@media(max-width:720px){.topbar .logo .brand small{display:none}.topbar .logo .brand b{font-size:14px}}
.topbar .sp{flex:1}
.topbar select{width:auto;min-width:190px;background:rgba(255,255,255,.12);color:#fff;
  border-color:rgba(255,255,255,.28);font-weight:600}
.topbar select:focus{box-shadow:0 0 0 3.5px rgba(255,255,255,.18);border-color:rgba(255,255,255,.6)}
.topbar select option{color:#111}
.topbar .who{font-size:13px;opacity:.92;font-weight:500}
.topbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.topbar .btn:hover{background:rgba(255,255,255,.22);transform:none}

/* ===== ניווט ===== */
.nav{display:flex;gap:6px;flex-wrap:wrap;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  padding:9px 20px;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:20}
.nav-item{padding:7px 15px;border-radius:999px;cursor:pointer;font-weight:600;color:#475569;font-size:13.5px;
  transition:background .15s,color .15s,box-shadow .15s;user-select:none}
.nav-item:hover{background:var(--brand-l);color:var(--brand-d)}
.nav-item.active{background:linear-gradient(135deg,var(--brand),#6366f1);color:#fff;
  box-shadow:0 3px 10px rgba(79,70,229,.35)}
/* במסכים גדולים מנצלים את כל הרוחב — טבלת 46 הפרויקטים נכנסת בלי גלילה */
.content{max-width:1200px;margin:0 auto;padding:22px 18px 90px}
@media(min-width:1300px){ .content{max-width:96vw} }
@media(min-width:1700px){ .content{max-width:1780px} }
/* טבלאות רחבות: מרווחים וגופן צפופים יותר, וגלישת שורה בעמודת השם */
.tbl-compact table.tbl{font-size:12.5px}
.tbl-compact table.tbl th,.tbl-compact table.tbl td{padding:8px 8px}
/* עמודת השם גולשת לשורה — אבל לא כשהעמודה הראשונה היא תיבת סימון,
   ולא בשורת הסינון (שם ה-min-width היה מנפח את העמודה הראשונה) */
.tbl-compact table.tbl tbody td:first-child:not(.chk),
.tbl-compact table.tbl thead tr:first-child th:first-child:not(.chk){white-space:normal;min-width:150px}
.tbl-compact table.tbl td:not(:first-child),.tbl-compact table.tbl th:not(:first-child){white-space:nowrap}
.tbl-compact table.tbl td.chk,.tbl-compact table.tbl th.chk{min-width:0;width:26px;padding:8px 3px}
/* תגי יחידות ההשכרה — צפופים, כדי שארבע יחידות לא יבלעו את הטבלה */
.badge-unit{padding:2px 6px;font-size:10.5px;gap:0}
.badge-unit::before{display:none}
/* כפתורי הפעולה בשורה — צרים יותר, הם רק אייקונים */
.tbl-compact table.tbl .btn-sm{padding:3px 6px}
/* עמודת הערה — נחתכת בשלוש נקודות כדי שכל שאר העמודות ייכנסו למסך.
   הטקסט המלא נשאר ב-title (מעבר עכבר) וגם בייצוא לאקסל. */
table.tbl td.note{max-width:120px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tbl-compact table.tbl td.note{max-width:90px}
@media(min-width:1700px){ table.tbl td.note{max-width:200px} }

/* ===== הגיליון החופשי — מראה של אקסל קלאסי =====
   שורות נמוכות, הכל מיושר ימינה (כולל הכותרות), וקווי רשת דקים.
   מספרים מקבלים direction:ltr כדי שסימן מינוס ופסיקי אלפים יישארו
   במקומם, אבל נשארים צמודים לימין כמו כל השאר. */
table.tbl.sheet-grid{font-size:12.5px;border-collapse:collapse;table-layout:fixed;width:max-content}
.col-grip{position:absolute;top:0;bottom:0;inset-inline-end:-3px;width:7px;cursor:col-resize;z-index:5}
.col-grip:hover{background:var(--brand);opacity:.5}
table.tbl.sheet-grid th,table.tbl.sheet-grid td{
  padding:0;text-align:right;border:1px solid #dde3f0;white-space:nowrap}
table.tbl.sheet-grid thead th{padding:1px 0;font-size:11px}
table.tbl.sheet-grid input{
  width:100%;border:0;background:transparent;outline:none;
  font-size:12.5px;line-height:1.2;height:22px;padding:0 5px;text-align:right;
  border-radius:0}
table.tbl.sheet-grid input:focus{background:#eef2ff;box-shadow:inset 0 0 0 2px var(--brand)}
table.tbl.sheet-grid thead input{font-weight:700;height:20px}
table.tbl.sheet-grid input.num{direction:ltr;font-variant-numeric:tabular-nums}
/* עמודת המספור צרה. הסלקטור מפורט כי כללי הטבלה הצפופה מרחיבים
   את העמודה הראשונה ל-min-width:150px וגוברים על סלקטור קצר יותר. */
.tbl-compact table.tbl.sheet-grid tbody td.rownum,
.tbl-compact table.tbl.sheet-grid thead th.rownum,
table.tbl.sheet-grid td.rownum,table.tbl.sheet-grid th.rownum{
  text-align:center;background:#eef1fa;color:var(--muted);font-size:10.5px;
  width:34px;min-width:34px;max-width:34px;padding:0 2px;white-space:nowrap}
table.tbl.sheet-grid td.cellval{padding:0 5px;height:22px;line-height:22px;overflow:hidden}
table.tbl.sheet-grid td.cellval.num{direction:ltr;font-variant-numeric:tabular-nums}
table.tbl.sheet-grid tfoot td{
  background:#eef1fa;font-weight:700;padding:2px 5px;border-top:2px solid #c7cee3;
  text-align:right;direction:ltr;font-variant-numeric:tabular-nums}
table.tbl.sheet-grid tfoot td.rownum{direction:rtl}
table.tbl.sheet-grid .btn-sm{padding:1px 5px;font-size:11px}
table.tbl.sheet-grid .colletter{font-size:9.5px;opacity:.5;text-align:center;line-height:1.1}
/* תאים שנבחרו לעיצוב — מסגרת פנימית שלא מזיזה את הפריסה */
table.tbl.sheet-grid td.sel{outline:2px solid var(--brand);outline-offset:-2px;background:#eef2ff}
table.tbl.sheet-grid td.sel input{background:transparent}
/* מסגרת שהמשתמש צייר — עבה יותר מקווי הרשת ובצבע כהה.
   הצלעות האנכיות משתמשות ב-inline-start/end ולא ב-left/right:
   הגיליון בעברית, ולכן העמודה הראשונה יושבת בימין המסך. עם
   border-left היא קיבלה את הצלע הפנימית, וכל המסגרת נצבעה בפנים
   במקום בהיקף. תכונות לוגיות מתהפכות לבד לפי כיוון הכתיבה. */
table.tbl.sheet-grid td.bt{border-top:2px solid #334155}
table.tbl.sheet-grid td.bb{border-bottom:2px solid #334155}
table.tbl.sheet-grid td.bl{border-inline-start:2px solid #334155}
table.tbl.sheet-grid td.br{border-inline-end:2px solid #334155}
table.tbl.sheet-grid td.bold input,table.tbl.sheet-grid td.bold{font-weight:700}
.sheet-tools{display:flex;gap:5px;flex-wrap:wrap;align-items:center;
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin-bottom:8px}
.sheet-swatch{width:24px;height:24px;border-radius:5px;border:1px solid #cbd5e1;cursor:pointer;padding:0}
.sheet-swatch:hover{transform:scale(1.12)}

/* ===== לשוניות משנה ===== */
/* לשוניות הפרוייקט נשארות גלויות בגלילה, מתחת לסרגל ולניווט */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:20px;
  position:sticky;top:99px;z-index:15;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);
  padding:6px 18px 0;margin-left:-18px;margin-right:-18px}
.tab{padding:9px 15px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;
  border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0;
  transition:color .15s,background .15s;user-select:none}
.tab:hover{color:var(--ink);background:rgba(79,70,229,.05)}
.tab.active{color:var(--brand-d);border-bottom-color:var(--brand)}

/* ===== כרטיסים ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
  box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px;color:#0f172a}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--brand),#38bdf8)}
.stat .label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.stat .value{font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.grid{display:grid;gap:14px}
.apt-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.apt-card{cursor:pointer;transition:transform .15s,box-shadow .15s;border-top:4px solid var(--brand)}
.apt-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}

/* ===== טבלאות ===== */
/* CSS כופה overflow-y:auto כשיש overflow-x:auto — ולכן כותרת sticky
   שמכוונת לגלילת העמוד נחתכת. הפתרון: הטבלה גוללת בתוך עצמה,
   והכותרת נצמדת לראש אזור הגלילה שלה. עובד תמיד, גם אופקית. */
.table-wrap{max-height:calc(100vh - 210px);overflow:auto;border:1px solid var(--line);
  border-radius:14px;background:#fff;box-shadow:var(--shadow)}
#upd-banner{position:fixed;bottom:16px;left:16px;z-index:900;background:var(--brand);color:#fff;
  padding:9px 13px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.22);font-size:13px;
  display:flex;align-items:center;gap:9px}
#upd-banner .btn{background:#fff;color:var(--brand);border:0}
/* שורת הכפתור "ייצוא לאקסל" שנתלית מעל כל טבלה */
.xl-bar{display:flex;justify-content:flex-start;margin:0 0 5px;line-height:1}
.xl-bar .btn{padding:3px 9px;font-size:11.5px;opacity:.62}
.xl-bar .btn:hover{opacity:1}
@media print{.xl-bar{display:none}}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;font-size:13.5px;
  font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{padding:10px 13px;text-align:right;white-space:nowrap}
table.tbl thead th{background:#eef1fa;font-weight:700;color:#3f4863;font-size:12px;
  letter-spacing:.02em;position:sticky;top:0;z-index:5;
  border-bottom:2px solid #d9deef;
  box-shadow:0 1px 0 #d9deef, 0 6px 12px -8px rgba(30,41,59,.35)}
.modal-body .table-wrap{max-height:340px}
/* שורת סינון העמודות — נדבקת מתחת לכותרות */
table.tbl thead tr.filter-row th,table.tbl thead tr.filter-row td{
  background:#f8f9fe;position:sticky;top:34px;z-index:4;padding:5px 6px;
  border-bottom:1px solid #dfe3f2;box-shadow:none}
table.tbl thead tr.filter-row input{border-color:#dde1f0;background:#fff}
.sort-mark{font-size:10px}
table.tbl tbody td{border-bottom:1px solid #f0f2fa}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:#f6f8ff}
/* שורת הסיכום נדבקת לתחתית אזור הגלילה — הסה"כ תמיד גלוי */
table.tbl tfoot td{font-weight:800;background:#eef1fa;border-top:2px solid #d9deef;
  position:sticky;bottom:0;z-index:4;
  box-shadow:0 -1px 0 #d9deef, 0 -6px 12px -8px rgba(30,41,59,.3)}

/* ===== כפתורים ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:10px;
  border:1.5px solid #dde1f0;background:#fff;color:#334155;cursor:pointer;font-weight:600;font-size:13.5px;
  transition:all .15s;user-select:none}
.btn:hover{background:#f6f7fd;border-color:#c4cbe8;transform:translateY(-1px);box-shadow:0 3px 10px rgba(30,41,59,.08)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,var(--brand),#6366f1);border-color:transparent;color:#fff;
  box-shadow:0 3px 12px rgba(79,70,229,.35)}
.btn-primary:hover{background:linear-gradient(135deg,var(--brand-d),#4f46e5);box-shadow:0 5px 16px rgba(79,70,229,.45)}
.btn-danger{background:#fff;border-color:#fecaca;color:var(--danger)}
.btn-danger:hover{background:#fef2f2;border-color:#fca5a5}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.btn-ghost:hover{background:var(--brand-l);color:var(--brand-d);box-shadow:none;transform:none}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:9px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}

/* ===== תגיות ===== */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;letter-spacing:.01em}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.badge-ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.badge-warn{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.badge-danger{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.badge-muted{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.badge-mgmt{background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;font-weight:600}
tr.mgmt-row>td{background:#f7f8ff}
.pill{background:var(--chip);color:var(--brand-d);padding:2.5px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;border:1px solid #dfe4ff}
.muted{color:var(--muted)}
.pos{color:var(--ok);font-weight:700}
.neg{color:var(--danger);font-weight:700}
.center{text-align:center}.right{text-align:left}
div.empty{text-align:center;color:var(--muted);padding:44px 14px;background:#fff;
  border:1.5px dashed #d3d8ec;border-radius:16px;font-size:14.5px}
td.empty{text-align:center;color:var(--muted);padding:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.field{margin-bottom:10px}

/* ===== מודלים ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;justify-content:center;padding:34px 14px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;
  box-shadow:0 24px 70px rgba(2,6,23,.45);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:920px}
@media(min-width:1000px){ .modal.wide{max-width:min(1180px,94vw)} }
/* ===== מודאל צפוף — טבלה שנכנסת למסך בלי גלילה הצידה =====
   טבלאות המועמדים נדחסו לרוחב של 920px וכל עמודה קיבלה מינימום רחב,
   מה שחייב גלילה אופקית. כאן: גופן קטן, ריפוד מצומצם, שבירת שורות
   מותרת, ותקרת רוחב לעמודות הטקסט הארוכות. */
.modal .tbl-tight table.tbl{font-size:11.5px;table-layout:fixed;width:100%}
.modal .tbl-tight table.tbl th,
.modal .tbl-tight table.tbl td{padding:3px 5px;white-space:normal;word-break:break-word;line-height:1.25}
.modal .tbl-tight table.tbl thead th{font-size:10.5px;letter-spacing:0}
.modal .tbl-tight table.tbl td.num,

<script>
"use strict";
/* ============================================================
   מערכת ניהול פרוייקטים ושותפויות — קובץ עצמאי
   אחסון: localStorage (מקור אמת מקומי) + סנכרון אופציונלי ל-Google Sheets
   ============================================================ */

/* ---------- קבועים ---------- */
var LSKEY = "apartmentsCRM_v1";
/* חותמת הגרסה מוצגת בתחתית התפריט. כשמדווחים "התיקון לא עובד", הדבר
   הראשון לבדוק הוא אם הדפדפן בכלל קיבל את הגרסה — רענון רגיל (F5)
   מגיש לפעמים את הקובץ הישן מהמטמון. */
var APP_BUILD = "19.08 כב'";
/* אחסון על השרת (VPS) — מקור האמת. מוטמע בקוד כדי שכל מכשיר יתחבר אוטומטית */
/* ---- גוגל שיטס = מקור האמת ----
   הכתובת מוטמעת כדי שכל מכשיר יתחבר אוטומטית.
   האבטחה אינה מסתמכת על סודיות הכתובת אלא על אימות בצד השרת:
   כל בקשה חייבת קוד כניסה תקף, אחרת ה-Apps Script לא מחזיר ולא שומר דבר. */
var SHEETS_URL = "https://script.google.com/macros/s/AKfycbxkuppsmvwlUDhg5ZfZlp7Kz9TRtEJ8XRhc0ihdDO-W5uCH8mxGWHF-wsr2WyopmgbIuQ/exec";
function sheetsUrl(){ return SHEETS_URL; }

/* hash של קוד הכניסה — נשמר ל-session בלבד (נמחק בסגירת הדפדפן) */
var AUTH_KEY = "apartmentsCRM_auth";
var AUTH = "";
function getAuth(){ if(AUTH) return AUTH; try{ return sessionStorage.getItem(AUTH_KEY)||""; }catch(e){ return ""; } }
function setAuth(h){ AUTH=h||""; try{ if(h) sessionStorage.setItem(AUTH_KEY,h); else sessionStorage.removeItem(AUTH_KEY); }catch(e){} }

/* קריאה ל-Apps Script. אובייקט => POST, מחרוזת => GET עם query */
async function api(payload){
  try{
    var r;
    if(typeof payload==="string"){ r=await fetch(SHEETS_URL+"?"+payload,{cache:"no-store"}); }
    else{ r=await fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}); }
    return await r.json();
  }catch(e){ return {ok:false,error:"network"}; }
}
var SYNC="idle";
function syncBadgeHtml(){
  var m={idle:["⏳","מתחבר…"],saving:["🔄","שומר לשיטס…"],ok:["✅","מסונכרן לשיטס"],
         err:["⚠️","שגיאת סנכרון — מנסה שוב"],local:["💾","מקומי בלבד — לא מחובר"]};
  var x=m[SYNC]||m.idle;
  var clk=can("settings")?' style="cursor:pointer" title="לחץ להגדרות סנכרון" onclick="go(\'settings\',{stab:\'sheets\'})"':'';
  return '<span id="sync-badge" class="who"'+clk+'>'+x[0]+' '+esc(x[1])+'</span>';
}
function setSync(s){ SYNC=s; var el=document.getElementById("sync-badge"); if(el){ el.outerHTML=syncBadgeHtml(); } }
/* סמליל המותג — עמודות עולות (מעקב וקידום פרויקטים) */
var LOGO_MARK = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">'+
  '<rect x="3.4" y="12.6" width="3.7" height="7.4" rx="1.3" fill="#fff" opacity=".62"/>'+
  '<rect x="10.15" y="8.4" width="3.7" height="11.6" rx="1.3" fill="#fff" opacity=".82"/>'+
  '<rect x="16.9" y="4" width="3.7" height="16" rx="1.3" fill="#fff"/>'+
  '<path d="M3.6 8.8 9 6.2l4.1 1.9 6.8-4.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>'+
  '<circle cx="19.9" cy="3.7" r="1.7" fill="#fde68a"/></svg>';
var CLASSIFICATIONS = {investment:"השקעה", ongoing:"שוטף", private:"פרטי"};
/* אמצעי תשלום: בסיס קבוע + אמצעים שהמשתמש מוסיף (נשמרים בנתונים) */
var METHODS_BASE = {transfer:"העברה", check:"צ׳ק", credit:"אשראי", cash:"מזומן", equiv:"שווה ערך", other:"אחר"};
var METHODS = METHODS_BASE;   // נבנה מחדש בכל טעינה ע"י refreshMethods()
function refreshMethods(){
  var m={}; Object.keys(METHODS_BASE).forEach(function(k){ m[k]=METHODS_BASE[k]; });
  var custom=(DB&&DB.settings&&DB.settings.paymentMethods)||{};
  Object.keys(custom).forEach(function(k){ if(custom[k]) m[k]=custom[k]; });
  METHODS=m; return m;
}
function methodOptions(sel){
  refreshMethods();
  return Object.keys(METHODS).map(function(k){
    return '<option value="'+esc(k)+'"'+(k===sel?" selected":"")+'>'+esc(METHODS[k])+'</option>'; }).join("")+
    '<option value="__new">➕ אמצעי חדש…</option>';
}
/* נבחר "אמצעי חדש" — שואלים שם, שומרים, ובוחרים אותו */
function onMethodPick(selId){
  var sel=document.getElementById(selId); if(!sel) return;
  if(sel.value!=="__new") return;
  var name=prompt("שם אמצעי התשלום החדש (למשל: הוראת קבע, ביט, פייבוקס):","");
  name=(name||"").trim();
  var prevM=sel.getAttribute("data-prev")||"transfer";
  if(!name){ sel.value=prevM; return; }
  if(!can("edit")){ toast("אין הרשאה","err"); sel.value=prevM; return; }
  DB.settings=DB.settings||{};
  DB.settings.paymentMethods=DB.settings.paymentMethods||{};
  var k=normKey(name).replace(/[^\w֐-׿]+/g,"_").slice(0,30) || ("m"+Date.now().toString(36));
  var exists=Object.keys(METHODS).find(function(x){ return normKey(METHODS[x])===normKey(name); });
  if(exists){ toast("האמצעי כבר קיים — נבחר","warn"); sel.value=exists; refreshMethods(); return; }
  DB.settings.paymentMethods[k]=name;
  save(); refreshMethods();
  var cur=sel.id;
  sel.innerHTML=methodOptions(k); sel.value=k; sel.setAttribute("data-prev",k);
  toast('נוסף אמצעי התשלום "'+name+'"',"ok");
}
/* קטגוריות הוצאה (חשמל, אדריכל…) — רשימה פתוחה שהמשתמש מנהל.
   הרשימה המומלצת היא רק נקודת פתיחה בלחיצה אחת, לא ברירת מחדל כפויה. */
var CATEGORIES_SUGGESTED = ["אדריכל","יועצים ומתכננים","עורך דין","אגרות והיטלים","קבלן שלד",
  "חשמל","אינסטלציה","מיזוג אוויר","גבס","טיח","ריצוף וחיפוי","צבע","אלומיניום","נגרות",
  "מסגרות","איטום","פיתוח וחצר","מעלית","מטבח","דלתות","מדידות","פיקוח","שיפוצים",
  "חומרי בניין","הובלות ופינוי","ביטוח","מימון וריבית","שיווק ותיווך","הוצאות שוטפות","שונות"];
/* ============================================================
   בורר עם הקלדה (combobox)
   ------------------------------------------------------------
   רשימה ארוכה (קטגוריות, פרוייקטים, חשבונות) — במקום לגלול,
   מקלידים ומסננים. בנוי על <input> + <datalist> כדי שיישאר טופס
   רגיל: הערך נקרא דרך val() כמו כל שדה, ובלי תלות בספרייה.
   הפונקציה מחזירה HTML; הערך הנבחר מומר חזרה ל-id ע"י pickId().
   ============================================================ */
var _PICK={};       // id של השדה → רשימת {id,label} לפענוח חוזר
function pickerHtml(fieldId,items,selId,opts){
  opts=opts||{};
  _PICK[fieldId]=items;
  var sel=items.filter(function(x){ return x.id===selId; })[0];
  var lid=fieldId+"-list";
  return '<input id="'+fieldId+'" list="'+lid+'" value="'+esc(sel?sel.label:"")+'"'+
    ' placeholder="'+esc(opts.placeholder||"הקלד לחיפוש…")+'"'+
    (opts.onchange?' onchange="'+opts.onchange+'" oninput="'+opts.onchange+'"':'')+
    ' autocomplete="off">'+
    '<datalist id="'+lid+'">'+
      items.map(function(x){ return '<option value="'+esc(x.label)+'"></option>'; }).join("")+
    '</datalist>';
}
/* הערך שנבחר בבורר → id. התאמה מדויקת, ואם אין — התאמה יחידה חלקית.
   ריק מחזיר "" ; טקסט שלא זוהה מחזיר null (כדי שאפשר יהיה להתריע). */
function pickId(fieldId){
  var raw=String(val(fieldId)||"").trim();
  if(!raw) return "";
  var items=_PICK[fieldId]||[];
  var exact=items.filter(function(x){ return normKey(x.label)===normKey(raw); });
  if(exact.length) return exact[0].id;
  var part=items.filter(function(x){ return normKey(x.label).indexOf(normKey(raw))>=0; });
  if(part.length===1) return part[0].id;
  return null;
}
/* ---------- קטגוריה מתוך הטופס, בלי לצאת למסך ההגדרות ----------
   שם קיים מוחזר כ-id; שם שאינו ברשימה נוצר כקטגוריה חדשה במקום.
   ההתאמה החלקית מכוונת רק לזיהוי — לעולם לא ל"ניחוש" קטגוריה אחרת:
   טקסט שמתאים חלקית לכמה קטגוריות נוצר כקטגוריה בשם שהוקלד, ולא
   נזקף בשקט לאחת מהן. */
function categoryByName(name){
  return active(DB.categories).filter(function(c){ return normKey(c.name)===normKey(name); })[0]||null;
}
function pickCategoryId(fieldId){
  var raw=String(val(fieldId)||"").trim();
  if(!raw) return "";
  var ex=categoryByName(raw);
  if(ex) return ex.id;
  var id=pickId(fieldId);
  if(id) return id;
  var c={id:uid(),name:raw,deleted:false};
  DB.categories.push(c);
  return c.id;
}
/* בורר קטגוריה שלם: שדה הקלדה + כפתור "➕ חדשה" + חיווי חי מתחתיו */
function categoryPickerHtml(fieldId,selId,hint){
  return '<div style="display:flex;gap:6px;align-items:flex-start">'+
      '<div style="flex:1">'+
        pickerHtml(fieldId,catsSorted().map(function(c){return {id:c.id,label:c.name};}),selId||"",
          {placeholder:"הקלד או בחר קטגוריה…",onchange:"catPickHint('"+fieldId+"')"})+
      '</div>'+
      '<button type="button" class="btn btn-sm" style="white-space:nowrap" '+
        'onclick="addCategoryInline(\''+fieldId+'\')" title="הוספת קטגוריה חדשה">➕ חדשה</button>'+
    '</div>'+
    '<div class="hint" id="'+fieldId+'-fb">'+(hint||"")+'</div>';
}
/* חיווי בזמן ההקלדה: קיימת / תיווצר חדשה / ריק */
function catPickHint(fieldId){
  var box=document.getElementById(fieldId+"-fb"); if(!box) return;
  var raw=String(val(fieldId)||"").trim();
  if(!raw){ box.innerHTML='<span class="muted">ללא קטגוריה</span>'; return; }
  var ex=categoryByName(raw);
  if(ex){ box.innerHTML='<span class="pos">✔ קטגוריה קיימת</span>'; return; }
  var id=pickId(fieldId);
  if(id){ box.innerHTML='<span class="pos">✔ '+esc(categoryName(id))+'</span>'; return; }
  box.innerHTML='<span class="badge badge-warn badge-unit">➕ תיווצר קטגוריה חדשה: '+esc(raw)+'</span>';
}
/* הוספה מפורשת מתוך הטופס — הקטגוריה נוצרת ונבחרת מיד, בלי לסגור
   את הטופס ובלי לאבד את מה שכבר הוזן בו. */
function addCategoryInline(fieldId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var el=document.getElementById(fieldId); if(!el) return;
  var typed=String(el.value||"").trim();
  var name=prompt("שם הקטגוריה החדשה (למשל: חשמל, אדריכל, ריצוף):", typed);
  name=(name||"").trim();
  if(!name) return;
  var ex=categoryByName(name);
  if(ex){
    el.value=ex.name; catPickHint(fieldId);
    toast('"'+name+'" כבר קיימת — נבחרה',"warn"); return;
  }
  var c={id:uid(),name:name,deleted:false};
  DB.categories.push(c);
  save();
  /* מרעננים את רשימת ההשלמה של השדה כדי שהחדשה תופיע בה מיד */
  var items=catsSorted().map(function(x){ return {id:x.id,label:x.name}; });
  _PICK[fieldId]=items;
  var dl=document.getElementById(fieldId+"-list");
  if(dl) dl.innerHTML=items.map(function(x){ return '<option value="'+esc(x.label)+'"></option>'; }).join("");
  el.value=name; catPickHint(fieldId);
  toast('נוספה הקטגוריה "'+name+'"',"ok");
}
function catsSorted(){
  return active(DB.categories).slice().sort(function(a,b){
    return String(a.name).localeCompare(String(b.name),"he"); });
}
/* קטגוריה שנמחקה מחזירה "" — כך היא לא נראית חיה בדוחות, והשלבים
   שלה מקובצים לשורת "(קטגוריה שנמחקה)" במקום להיראות כאילו לא נמחקה. */
function categoryName(id){ var c=id?byId(DB.categories,id):null; return (c&&!c.deleted)?c.name:""; }
/* בחירת הקטגוריה עברה כולה לבורר-ההקלדה (categoryPickerHtml), שגם
   מוסיף קטגוריה חדשה מתוך הטופס — כך שרשימת <option> ו-onCatPick
   כבר אינן בשימוש. */
var ROLES = {admin:"מנהל", editor:"עורך", viewer:"צפייה בלבד", mgmt:"דמי ניהול"};
/* סטטוס חשבונית לתשלום: יש / ממתין / לא צריך. "" = לא צוין (נתונים
   ישנים). hasInvoice הבוליאני נשמר מסונכרן לתאימות עם ייבוא/ייצוא ישנים. */
var INVOICE_STATUSES={has:"יש חשבונית",pending:"ממתין לחשבונית",none:"לא צריך חשבונית"};
function payInvoiceStatus(p){ return p.invoiceStatus||(p.hasInvoice?"has":""); }
function invoiceCellHtml(p){
  var st=payInvoiceStatus(p);

/* ---------- כלים ---------- */
function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function num(n){ n = Number(n)||0; return n.toLocaleString("he-IL",{maximumFractionDigits:2}); }
function money(n){ return "₪" + num(n); }
function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
function dateHe(iso){ if(!iso) return ""; var s=esc(String(iso).slice(0,10)); var p=s.split("-"); return p.length===3? p[2]+"/"+p[1]+"/"+p[0] : s; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
async function hashCode(code){
  try{
    var enc=new TextEncoder().encode(String(code));
    var buf=await crypto.subtle.digest("SHA-256",enc);
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
  }catch(e){ return "plain:"+String(code); }
}
/* ============================================================
   שכבת אינדוקס לרינדור
   ------------------------------------------------------------
   כל שליפה כמו expPayments(eId) סרקה את כל מערך התשלומים מחדש,
   ורינדור אחד עושה אלפי שליפות כאלה — מה שהפך דוחות גדולים
   לעשרות מיליוני פעולות ולעיכוב של שניות.

   כאן נבנה אינדקס פעם אחת בתחילת כל רינדור ונמחק בסופו. רינדור
   אינו משנה נתונים, ולכן האינדקס מובטח עקבי לכל אורכו; בכל מקום
   אחר (שמירה, עריכה, ייבוא) IX ריק והשליפות מתבצעות ישירות מהנתונים
   בדיוק כמו קודם. זהו אך ורק זירוז — לא שינוי בהתנהגות.
   ============================================================ */
var IX=null;
var IX_EMPTY=[];
function ixGroup(arr,key){
  var m=Object.create(null);
  for(var i=0;i<arr.length;i++){
    var x=arr[i]; if(x.deleted) continue;
    var k=x[key]; if(k==null||k==="") continue;
    (m[k]||(m[k]=[])).push(x);
  }
  return m;
}
function ixBuild(){
  var ix={maps:new WeakMap(),actives:new WeakMap(),leaf:Object.create(null),
          paid:Object.create(null),mgmt:Object.create(null),outflow:Object.create(null)};
  ix.payByExp   = ixGroup(DB.payments||[],"expenseId");
  ix.splitByExp = ixGroup(DB.expenseSplits||[],"expenseId");
  ix.feeByExp   = ixGroup(DB.expenseManagerFees||[],"expenseId");
  ix.kidsByPar  = ixGroup(DB.expenses||[],"parentId");
  ix.expByApt   = ixGroup(DB.expenses||[],"apartmentId");
  ix.apByApt    = ixGroup(DB.apartmentPartners||[],"apartmentId");
  ix.mgrByApt   = ixGroup(DB.managers||[],"apartmentId");
  ix.accByApt   = ixGroup(DB.accounts||[],"apartmentId");
  ix.depByApt   = ixGroup(DB.deposits||[],"apartmentId");
  ix.incByApt   = ixGroup(DB.income||[],"apartmentId");
  return ix;
}
function ixIdMap(list){
  var m=IX.maps.get(list);
  if(!m){ m=new Map(); for(var i=0;i<list.length;i++) m.set(list[i].id,list[i]); IX.maps.set(list,m); }
  return m;
}
function ixActive(list){
  var a=IX.actives.get(list);
  if(!a){ a=list.filter(function(x){return !x.deleted;}); IX.actives.set(list,a); }
  return a;
}
/* עוטף רינדור: בונה אינדקס, מרנדר, ומוחק אותו בכל מקרה */
function withIndex(fn){
  var outer=IX;
  if(!outer) IX=ixBuild();
  try{ return fn(); }
  finally{ if(!outer) IX=null; }
}

function active(list){
  if(IX&&list) return ixActive(list);
  return (list||[]).filter(function(x){return !x.deleted;});
}
function byId(list,id){
  if(IX&&list) return ixIdMap(list).get(id);
  return (list||[]).find(function(x){return x.id===id;});
}

/* ---------- טעינה/שמירה ---------- */
/* ============================================================
   כספת מקומית — הצפנת המטמון שבדפדפן
   ------------------------------------------------------------
   המערכת שומרת עותק מלא של הנתונים ב-localStorage (מטמון + עבודה
   אופליין). localStorage שורד סגירת דפדפן, בעוד שקוד הכניסה יושב
   ב-sessionStorage ונמחק — כלומר בלי הצפנה כל מי שפותח F12 על אותו
   מחשב היה קורא את הכל בלי להזדהות.

   כאן כל עותק מקומי מוצפן ב-AES-GCM עם מפתח שנגזר (PBKDF2) מקוד
   הכניסה. המפתח קיים בזיכרון בלבד וחי כל עוד הלשונית פתוחה; בלי הקוד
   הנתונים בדיסק הם רצף חסר משמעות.

   כשל בפענוח אינו מסוכן: המטמון הוא עותק בלבד, ומקור האמת הוא
   הגיליון — פשוט נמשכים משם מחדש.
   ============================================================ */
var VAULT={key:null, salt:null};
var VAULT_KEYS=[LSKEY, LSKEY+"_base", LSKEY+"_stash"];   // מה שמוצפן
function b64(buf){ var b=new Uint8Array(buf),s=""; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64(str){ var s=atob(str),a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
function vaultSalt(){
  if(VAULT.salt) return VAULT.salt;
  var s=null; try{ s=localStorage.getItem(LSKEY+"_salt"); }catch(e){}
  if(!s){
    var r=new Uint8Array(16); crypto.getRandomValues(r); s=b64(r);
    try{ localStorage.setItem(LSKEY+"_salt",s); }catch(e){}
  }
  VAULT.salt=s; return s;
}
/* פתיחת הכספת בכניסה. נכשל בשקט בדפדפן ישן — אז פשוט לא נשמר מטמון. */
async function vaultUnlock(codeHash){
  VAULT.key=null;
  if(!codeHash || !window.crypto || !crypto.subtle) return false;
  try{
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(String(codeHash)),
      {name:"PBKDF2"},false,["deriveKey"]);
    VAULT.key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:unb64(vaultSalt()),iterations:150000,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
    return true;
  }catch(e){ VAULT.key=null; return false; }
}
function vaultLock(){ VAULT.key=null; }
function vaultOpen(){ return !!VAULT.key; }
async function vaultEncrypt(str){
  var iv=new Uint8Array(12); crypto.getRandomValues(iv);
  var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},VAULT.key,new TextEncoder().encode(str));
  return JSON.stringify({__enc:1,iv:b64(iv),ct:b64(ct)});
}
async function vaultDecrypt(raw){
  var o=JSON.parse(raw);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},VAULT.key,unb64(o.ct));
  return new TextDecoder().decode(pt);
}
function isEncrypted(raw){
  return typeof raw==="string" && raw.charAt(0)==="{" && raw.indexOf('"__enc"')>0;
}
/* קריאה: מוצפן ואין מפתח => null (כאילו אין מטמון). טקסט גלוי מגרסה
   קודמת נקרא כרגיל ויוצפן בכתיבה הבאה. */
async function vaultGet(key){
  var raw=null; try{ raw=localStorage.getItem(key); }catch(e){}
  if(!raw) return null;
  if(!isEncrypted(raw)) return raw;
  if(!vaultOpen()) return null;
  try{ return await vaultDecrypt(raw); }
  catch(e){ try{ localStorage.removeItem(key); }catch(e2){} return null; }
}
/* כתיבה מרוכזת: ההצפנה אסינכרונית, ולכן הכתיבות נצברות ונשטפות יחד.
   בלי מפתח לא נכתב כלום לדיסק — עדיף בלי מטמון מאשר מטמון גלוי. */
var LSQ={pending:{},timer:null,busy:false};
function vaultPut(key,str){
  LSQ.pending[key]=str;
  if(!LSQ.timer) LSQ.timer=setTimeout(vaultFlush,0);
}
async function vaultFlush(){
  LSQ.timer=null;
  if(LSQ.busy){ LSQ.timer=setTimeout(vaultFlush,30); return; }
  LSQ.busy=true;
  var todo=LSQ.pending; LSQ.pending={};
  try{
    for(var k in todo){
      if(!todo.hasOwnProperty(k)) continue;
      var v=todo[k];
      try{
        if(v===null){ localStorage.removeItem(k); continue; }
        if(!vaultOpen()) continue;                 // נעול — לא כותבים גלוי
        localStorage.setItem(k, await vaultEncrypt(v));
      }catch(e){ /* מכסה מלאה או הצפנה שנכשלה — מוותרים על המטמון */ }
    }
  } finally { LSQ.busy=false; }
}
/* מחיקת כל עותק מקומי — ביציאה, ובאתחול בלי סשן כשאין עבודה שלא נשמרה */
function vaultWipe(){
  try{
    VAULT_KEYS.forEach(function(k){ localStorage.removeItem(k); });
    localStorage.removeItem(LSKEY+"_baserev");
    localStorage.removeItem(LSKEY+"_dirty");
  }catch(e){}
  LSQ.pending={};
}
/* האם שרד בדיסק עותק גלוי מגרסה שקדמה להצפנה */
function hasPlainLeftovers(){
  try{
    for(var i=0;i<VAULT_KEYS.length;i++){
      var raw=localStorage.getItem(VAULT_KEYS[i]);
      if(raw && !isEncrypted(raw)) return true;
    }
  }catch(e){}
  return false;
}
async function loadDB(){
  try{ var raw=await vaultGet(LSKEY); if(raw){ DB=JSON.parse(raw); return true; } }catch(e){}
  DB=null; return false;
}
function saveLocal(){
  try{ vaultPut(LSKEY, JSON.stringify(DB)); }catch(e){}
}
/* ---------- ביטול פעולה (Ctrl+Z) ----------
   המצב שלפני השינוי נשמר בזיכרון (LAST_JSON) ולא נקרא מ-localStorage:
   מאז שהמטמון מוצפן הקריאה משם אסינכרונית, והביטול חייב להיות מיידי. */
var UNDO=[], UNDO_MAX=30, LAST_JSON=null;
function undoCount(){ return UNDO.length; }
/* סימון "יש שינוי מקומי שטרם הגיע לשרת" — נשמר ב-localStorage (שורד רענון
   וסגירה), ומנוקה רק אחרי אישור שמירה מהשרת. בכניסה הבאה, אם הסימון קיים,
   המקומי נדחף לשרת במקום להימחק על ידו. */
function markDirty(){ try{ localStorage.setItem(LSKEY+"_dirty","1"); }catch(e){} }
function clearDirtyMark(){ try{ localStorage.removeItem(LSKEY+"_dirty"); }catch(e){} }
function hasDirtyMark(){ try{ return localStorage.getItem(LSKEY+"_dirty")==="1"; }catch(e){ return false; } }
/* ישויות שעוברות לסל המחזור — משמש גם לחותמת המחיקה וגם למסך עצמו */
var RECYCLE_ENTITIES=["apartments","partners","apartmentPartners","managers","categories",
  "expenses","payments","expenseSplits","expenseManagerFees","deposits","income",
  "accounts","withdrawals","bankMoves","stmtBanks","recurring","rentals","sheets","users"];
/* חותמת "מתי נמחק ומי מחק".
   נעשית מרכזית בשמירה ולא בכל מקום מחיקה בנפרד — כך גם מחיקות מדורגות
   (שלב-אב עם תתי-שלבים, פרוייקט עם כל התנועות) מקבלות אותה, ואי אפשר
   לשכוח אותה בנתיב חדש. פריט שכבר נושא חותמת אינו נדרס. */
function stampDeletions(){
  var now=new Date().toISOString();
  var who=(CU&&CU.name)||"";
  RECYCLE_ENTITIES.forEach(function(k){
    (DB[k]||[]).forEach(function(x){
      if(x.deleted && x.deletedAt===undefined){ x.deletedAt=now; x.deletedByUser=who; }
      else if(!x.deleted && x.deletedAt!==undefined){ delete x.deletedAt; delete x.deletedByUser; }
    });
  });
}
function save(){
  /* שער מרכזי: אף כתיבה לא עוברת אצל משתמש ללא הרשאת עריכה.
     מכסה גם נתיבים שנקראים ישירות (קונסולה/קישור) ולא רק כפתורים מוסתרים.
     CU ריק = מסלולי אתחול/כניסה לפני שיש משתמש — מותר. */
  if(CU && !can("edit")){ toast("אין לך הרשאת עריכה","err"); return; }
  stampDeletions();
  try{
    if(LAST_JSON){ UNDO.push(LAST_JSON); if(UNDO.length>UNDO_MAX) UNDO.shift(); }
    /* מונה גרסאות = גרסת הבסיס שסונכרן + 1, ולא מונה עריכות.
       ספירת עריכות אפשרה לשני שינויים מהירים "לעקוף" שמירה של משתמש
       אחר: המונה המקומי היה גבוה מהשרת, הבדיקה המוקדמת לא זיהתה
       התנגשות והשרת קיבל — ודרס. עכשיו כל עוד לא סונכרן, המונה נשאר
       בסיס+1, כך שכל שמירה של אחר מזוהה כהתנגשות וממוזגת. */
    DB.meta=DB.meta||{version:1};
    DB.meta.rev=Math.max((Number(SYNCREV)||0)+1, Number(DB.meta.rev)||0);
    LAST_JSON=JSON.stringify(DB);
    vaultPut(LSKEY, LAST_JSON);
  }catch(e){ toast("שגיאת שמירה מקומית","err"); }
  incMapClear();  // מפת ההכנסות נבנית מחדש ברינדור הבא
  markDirty();
  /* חלון שני של אותו דפדפן מתעדכן כאן — מהעותק המקומי המשותף, מיד.
     קודם השידור יצא רק אחרי אישור השרת, כלומר 2.5 שניות איגוד ועוד
     2-5 שניות של גוגל: 5-8 שניות עד שהמסך השני הראה את השינוי. */
  tabSyncBroadcast();
  serverSave();   // כל שינוי נשמר גם בגוגל שיטס
}
function undo(){
  if(!UNDO.length){ toast("אין פעולה לביטול","warn"); return; }
  var prev=UNDO.pop();
  try{
    var newRev=(DB&&DB.meta&&Number(DB.meta.rev)||0)+1;   // הביטול הוא גרסה חדשה, לא חזרה למונה ישן
    DB=JSON.parse(prev);
    DB.meta=DB.meta||{version:1}; DB.meta.rev=newRev;
    LAST_JSON=JSON.stringify(DB);
    vaultPut(LSKEY, LAST_JSON);
    markDirty();
    tabSyncBroadcast();                 // גם ביטול פעולה מגיע מיד לחלון השני
    serverSave();                       // מסנכרן את המצב המוחזר גם לשיטס
    closeModal();
    toast("הפעולה בוטלה"+(UNDO.length?" · עוד "+UNDO.length+" לביטול":""),"ok");
    rerender();
  }catch(e){ toast("הביטול נכשל","err"); }
}
/* ---------- גיבויי חירום מקומיים ----------
   לפני כל החלפה של הנתונים המקומיים (משיכה מהשרת, דחייה בגלל גרסה)
   העותק הנוכחי נשמר כאן — רשת ביטחון אחרונה, בנוסף להיסטוריית השיט. */
/* הגיבויים נשמרים בזיכרון ומוצפנים לדיסק — הם מכילים מסד נתונים מלא */
var STASH=[];
function stashLocalBackup(reason){
  try{
    STASH.unshift({ts:new Date().toISOString(),reason:reason||"",data:JSON.stringify(DB)});

  (d.managers||[]).forEach(function(m){ m.defaultFeePercent=toNum(m.defaultFeePercent); });
  (d.payments||[]).forEach(function(p){ p.amount=toNum(p.amount); p.date=toISO(p.date);

  RECYCLE_ENTITIES.forEach(function(k){

  (function(){

        hasInvoice:false,invoiceLink:"",mgmtEnabled:false,mgmtSet:true,

/* ============================================================
   חישובים (הלב של המערכת)
   ============================================================ */
/* ============================================================
   "להציג בדוח רגיל"
   ------------------------------------------------------------
   כל הוצאה והכנסה מסומנות כברירת מחדל להצגה. סימון noReport מוציא
   את השורה מהדוחות בלבד — היא נשארת במלואה בלשוניות ובסכומים שם.
   הדגל שלילי בכוונה: שורות קיימות (בלי השדה) ממשיכות להופיע, בלי
   מיגרציה. REPORT_SCOPE דולק רק בזמן בניית דוח, כך שאותן פונקציות
   מחזירות בלשוניות את הנתונים המלאים. */
var REPORT_SCOPE=false;              // דולק רק בתוך בניית דוח
/* שלושה מצבי דוח:
   regular  — הדוח הרגיל: מסתיר שורות שסומנו "לא להציג בדוח"
   freilich — דוח לפרייליך: מסתיר בנוסף שורות שסומנו "לא בדוח לפרייליך"
   all      — הצג הכל, בלי שום סינון */
var REPORT_MODES={regular:"דוח רגיל", freilich:"דוח לפרייליך", all:"הצג הכל"};
function reportMode(){
  var m=state.params.repMode;
  return REPORT_MODES[m] ? m : "regular";
}
function reportShowAll(){ return reportMode()==="all"; }
function repFilter(list){
  if(!REPORT_SCOPE) return list;
  var mode=reportMode();
  if(mode==="all") return list;
  var out=list.filter(function(x){
    if(x.noReport) return false;
    if(mode==="freilich" && x.noFreilich) return false;
    return true;
  });
  return out.length===list.length ? list : out;   // בלי העתקה מיותרת
}
function withReportScope(fn){
  var prev=REPORT_SCOPE; REPORT_SCOPE=true;
  try{ return fn(); } finally{ REPORT_SCOPE=prev; }
}
/* כמה שורות מוסתרות בכל מצב — לחיווי בלשונית הדוחות */
function hiddenFromReportCount(aptId){

}
function hiddenFromFreilichCount(aptId){
  var n=0;
  apLeafExpensesRaw(aptId).forEach(function(e){ if(!e.noReport && e.noFreilich) n++; });
  apIncomeRaw(aptId).forEach(function(i){ if(!i.noReport && i.noFreilich) n++; });
  return n;
}

/* הכנסות שנספרות בסיכומים — בלי אלה שסומנו "לא לחישוב".

/* ---------- תשלומי אורחים על הזמנה (הכנסה עם מעקב חוב) ----------
   הכנסה רגילה: הסכום הוא מה שנכנס. הזמנה: הסכום הוא המחיר המלא,
   והתשלומים בפועל נרשמים ב-i.payments — כך רואים את החוב שנשאר. */
/* ---------- יחידות השכרה ----------

/* ---------- תקופת השכרה ----------
   ההזמנה תופסת את הלילות מתאריך הכניסה ועד יום לפני היציאה — יום
   היציאה פנוי לאורח הבא, כמו בכל מלון. בלי תאריכי תקופה נופלים לתאריך
   ההזמנה עצמו (לילה אחד), כדי שגם נתונים ישנים ייכנסו ללוח. */
function stayStart(i){ return (i&&(i.startDate||i.date))||""; }
function stayEnd(i){
  if(!i) return "";
  var s=stayStart(i);
  return i.endDate && i.endDate>s ? i.endDate : s;
}
function stayNights(i){
  var s=stayStart(i); if(!s) return 0;
  var e=stayEnd(i);
  return e>s ? Math.round((Date.parse(e)-Date.parse(s))/86400000) : 1;
}
function stayLabel(i){
  var s=stayStart(i); if(!s) return "";
  if(!i.startDate && !i.endDate) return "";       // אין תקופה שהוזנה
  var n=stayNights(i);
  return dateHe(s)+(i.endDate&&i.endDate>s?" – "+dateHe(i.endDate):"")+" · "+n+" לילות";
}
/* גרסה קצרה לטבלה — בלי השנה כשהיא השנה הנוכחית, כדי לחסוך רוחב */
function stayLabelShort(i){
  var s=stayStart(i); if(!s || (!i.startDate && !i.endDate)) return "";
  var yr=todayISO().slice(0,4);
  function d(x){ return x.slice(8,10)+"/"+x.slice(5,7)+(x.slice(0,4)===yr?"":"/"+x.slice(2,4)); }
  return d(s)+(i.endDate&&i.endDate>s?"–"+d(i.endDate):"")+" · "+stayNights(i)+"ל׳";
}
/* כל הלילות (YYYY-MM-DD) שההזמנה תופסת */
function stayNightList(i){
  var s=stayStart(i); if(!s) return [];
  var out=[], t=Date.parse(s), n=stayNights(i);
  for(var k=0;k<n && k<400;k++){ out.push(new Date(t+k*86400000).toISOString().slice(0,10)); }
  return out;
}
function incomePays(i){ return (i&&i.payments||[]).filter(function(g){return !g.deleted;}); }
/* ---------- הכנסה שנגבתה במקום ----------
   בפרוייקט הזמנות ההכנסה והתשלום נפרדים, אבל לא תמיד: יש הכנסות
   שנגבות במלואן ברגע הרישום. הפונקציה רושמת עליהן את התשלום, כדי
   שלא יצטרכו לפתוח את ההזמנה ולהזין אותו ידנית. */
function markIncomePaid(i,opt){

    note:opt.note||"נגבה עם רישום ההכנסה",deleted:false};

}
/* ---------- הכנסה שממתינה לתשלום ----------
   עד כאן "הכנסה במעקב" הוגדרה כהכנסה שכבר נרשם עליה תשלום, וכל הכנסה
   בלי תשלומים נחשבה ככסף שכבר נכנס. שורה חודשית שנוצרת מחוזה שכירות
   ועדיין לא שולמה הייתה נספרת ב"התקבל" ואף נכנסת ליתרת הבנק — ניפוח
   של אלפי שקלים שלא התקבלו. הדגל awaitsPayment הופך אותה למעקב-חוב
   כבר מהרגע הראשון, בלי תלות בקיום תשלום. */
function incomeAwaits(i){ return !!(i&&i.awaitsPayment); }
function incomeTracked(i){ return incomeAwaits(i) || incomePays(i).length>0; }
function incomePaid(i){ return round2(incomePays(i).reduce(function(s,g){return s+(Number(g.amount)||0);},0)); }
function incomeDebt(i){ return round2((Number(i.amount)||0)-incomePaid(i)); }
/* ============================================================
   חלוקת שותפים ודמי ניהול — מזהים יציבים
   ------------------------------------------------------------
   עד כאן כל עריכת חלוקה מחקה את השורות (מחיקה קשה) ויצרה חדשות עם
   מזהה אקראי. במיזוג בין שני משתמשים זה היה אסון: המיזוג משווה לפי
   מזהה, ולכן השורות שהצד השני עוד החזיק "חזרו לחיים" בזמן שהחדשות
   שלי נוספו — ואותה הוצאה קיבלה 50%+50%+60%+40% = 200%.
   זו הסיבה ל"האחוזים משתבשים" ול"חלק מהנתונים לא נרשמים".

   הפתרון: המזהה נגזר מההוצאה ומהשותף, כך ששני משתמשים שעורכים את
   אותה חלוקה מייצרים את אותה שורה בדיוק והמיזוג מכריע ביניהן כרגיל.
   הסרת שותף היא מחיקה רכה (deleted:true) ולא הסרה מהמערך, כדי
   שהמיזוג יראה מחיקה מפורשת במקום "לא היה לי".
   ============================================================ */
function splitId(eId,pId){ return "sp_"+eId+"_"+pId; }
function feeId(eId,mId){ return "mf_"+eId+"_"+mId; }
/* כותב את חלוקת ההוצאה. rows = [{partnerId,percent}] */
function setExpenseSplits(eId,rows){
  var want={}; (rows||[]).forEach(function(r){ if(r&&r.partnerId) want[r.partnerId]=Number(r.percent)||0; });
  var byPartner={};
  (DB.expenseSplits||[]).forEach(function(x){
    if(x.expenseId===eId && x.partnerId) byPartner[x.partnerId]=x;   /* כולל מחוקות — כדי לשחזר במקום לשכפל */
  });
  Object.keys(want).forEach(function(pid){
    var ex=byPartner[pid];
    if(ex){ ex.percent=want[pid]; ex.deleted=false; }
    else DB.expenseSplits.push({id:splitId(eId,pid),expenseId:eId,partnerId:pid,percent:want[pid],deleted:false});
  });
  Object.keys(byPartner).forEach(function(pid){
    if(want[pid]===undefined) byPartner[pid].deleted=true;            /* הוסר מהחלוקה — מחיקה רכה */
  });
}
/* כותב את דמי הניהול של ההוצאה. rows = [{managerId,pctCurrent,...}] */
function setExpenseMgrFees(eId,rows){
  var want={}; (rows||[]).forEach(function(r){ if(r&&r.managerId) want[r.managerId]=r; });
  var byMgr={};
  (DB.expenseManagerFees||[]).forEach(function(x){
    if(x.expenseId===eId && x.managerId) byMgr[x.managerId]=x;
  });
  Object.keys(want).forEach(function(mid){
    var r=want[mid], ex=byMgr[mid];
    if(!ex){ ex={id:feeId(eId,mid),expenseId:eId,managerId:mid,deleted:false}; DB.expenseManagerFees.push(ex); }
    ex.pctCurrent=Number(r.pctCurrent)||0;
    ex.pctDeferred=Number(r.pctDeferred)||0;
    ex.deferredLabel=r.deferredLabel||"";
    ex.deferredReleased=!!r.deferredReleased;
    ex.deleted=false;
  });
  Object.keys(byMgr).forEach(function(mid){ if(!want[mid]) byMgr[mid].deleted=true; });
}
function expSplits(eId){ if(IX) return IX.splitByExp[eId]||IX_EMPTY;
  return active(DB.expenseSplits).filter(function(s){return s.expenseId===eId;}); }
function expPayments(eId){ if(IX) return IX.payByExp[eId]||IX_EMPTY;

function expMgrFees(eId){ if(IX) return IX.feeByExp[eId]||IX_EMPTY;
  return active(DB.expenseManagerFees).filter(function(f){return f.expenseId===eId;}); }
function partnerName(id){ var p=byId(DB.partners,id); return p?p.name:"—"; }
function managerName(id){ var m=byId(DB.managers,id); return m?m.name:"—"; }
function accountIsBank(accId){ if(!accId) return false; var a=byId(DB.accounts,accId); return !!(a&&a.isBank); }

// תשלומי ספק להוצאה (מה ששולם על ההוצאה עצמה)
function expensePaid(eId){
  if(IX && IX.paid[eId]!==undefined) return IX.paid[eId];
  var v=expensePaidCalc(eId);
  if(IX) IX.paid[eId]=v;
  return v;
}
function expensePaidCalc(eId){
  /* מכל: מה ששולם = סך תתי-השלבים (לתצוגה; בחישובי הכסף המכל אינו נספר) */
  if(isContainer(eId)) return round2(expenseChildren(eId).reduce(function(s,k){ return s+expensePaid(k.id); },0));
  return round2(expPayments(eId).filter(function(p){return p.recipientType!=="manager";})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
}
function expenseRemaining(eId){ var e=byId(DB.expenses,eId); return round2((e?Number(e.amount):0)-expensePaid(eId)); }
function expenseStatus(eId){ var e=byId(DB.expenses,eId); var paid=expensePaid(eId); var amt=e?Number(e.amount):0;
  if(paid<=0) return "unpaid";
  if(paid>amt+0.01) return "over";          // שולם ביתר — חריגה מאושרת
  if(paid>=amt-0.01) return "paid"; return "partial"; }

// דמי ניהול
function mgmtBase(e){
  var t=String(e.mgmtBaseType||"");
  /* "לפי מה ששולם" — רק תשלומים לספק; תשלומים למנהלים אינם בסיס לעצמם */
  var a=mgmtBaseIsPaid(e) ? supplierPaidOnExpense(e.id) : (Number(e.amount)||0);
  if(t==="net17"||t==="paidNet17") return a/1.17;
  if(t==="net18"||t==="paidNet18") return a/1.18;
  return a;
}
/* מה ששולם לספק על השלב (בלי תשלומי דמי ניהול למנהלים) */
function supplierPaidOnExpense(eId){
  return round2(expPayments(eId).filter(function(p){ return p.recipientType!=="manager"; })
    .reduce(function(s,p){ return s+(Number(p.amount)||0); },0));
}
function mgmtVatFactor(e){ return 1+(Number(e.mgmtVatRate)||0)/100; }
function mgrFeeLiveOnExpense(eId,mId){ // כולל מע"מ, רק חלק פעיל (נוכחי + דחוי ששוחרר)
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  var mg=byId(DB.managers,mId); if(!mg||mg.deleted) return 0;
  var f=expMgrFees(eId).find(function(x){return x.managerId===mId;}); if(!f) return 0;
  var base=mgmtBase(e); var live=(Number(f.pctCurrent)||0)/100 + (f.deferredReleased?(Number(f.pctDeferred)||0)/100:0);
  return round2(base*live*mgmtVatFactor(e));
}
function mgrFeeFullOnExpense(eId,mId){ // כולל מע"מ, נוכחי+דחוי (סופי)
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  var f=expMgrFees(eId).find(function(x){return x.managerId===mId;}); if(!f) return 0;
  var base=mgmtBase(e); var tot=((Number(f.pctCurrent)||0)+(Number(f.pctDeferred)||0))/100;
  return round2(base*tot*mgmtVatFactor(e));
}
function expenseMgmtCostLive(eId){ // סך דמי הניהול הפעילים של ההוצאה (עלות שמתחלקת בין השותפים)
  if(IX && IX.mgmt[eId]!==undefined) return IX.mgmt[eId];
  var v=expenseMgmtCostLiveCalc(eId);
  if(IX) IX.mgmt[eId]=v;
  return v;
}
function expenseMgmtCostLiveCalc(eId){
  if(isContainer(eId)) return round2(expenseChildren(eId).reduce(function(s,k){ return s+expenseMgmtCostLive(k.id); },0));
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  return round2(expMgrFees(eId).reduce(function(s,f){return s+mgrFeeLiveOnExpense(eId,f.managerId);},0));
}
/* סימון מצב דמי הניהול של שלב — שלושה מצבים:
   ✔ יש דמי ניהול · ✖ נקבע במפורש שאין · ריק = טרם סומן.
   ההבחנה בין "אין" ל"טרם סומן" נשענת על mgmtSet, שנרשם רק כשמישהו
   באמת בחר "עם / בלי". שורות ישנות שיובאו בלי שנשאלה השאלה
   נשארות ריקות — וכך אפשר לאתר בדיוק מה עוד לא הוכרע. */
function mgmtState(e,cont){
  if(cont) return "";                 // מכל — הסימון יושב בתתי-השלבים
  if(e.mgmtEnabled) return "yes";
  if(e.mgmtSet) return "no";

}
/* סכום דמי הניהול בשורת השלב:
     יש דמי ניהול      -> הסכום (גם ₪0 אם עדיין לא הוגדרו אחוזים)
     נקבע שאין         -> ₪0, כדי שיהיה ברור שזו הכרעה ולא חוסר נתונים
     טרם סומן          -> פס, כי באמת לא ידוע */
function mgmtAmountCell(e,cont,mg){
  if(cont) return mg?money(mg):'—';
  if(e.mgmtEnabled) return money(mg);
  if(e.mgmtSet) return money(0);
  return '—';
}
function mgmtMarkCell(e,cont){

  if(st==="yes") return '<span class="badge badge-ok" title="יש דמי ניהול">✔</span>';
  if(st==="no")  return '<span class="badge badge-danger" title="אין דמי ניהול">✖</span>';
  return '';
}
function mgrPaidOnExpense(eId,mId){
  return round2(expPayments(eId).filter(function(p){return p.recipientType==="manager"&&p.recipientManagerId===mId;})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
}

/* ---------- תשלום אוטומטי "שווה ערך" על דמי ניהול ----------
   הגדרה ברמת הפרויקט (a.autoMgmt = {partnerId,pct}): אחוז מדמי הניהול
   נרשם אוטומטית כתשלום למנהל ששולם ע"י השותף, באמצעי "שווה ערך".
   דוגמה: דמי ניהול 8,000 והגדרה של 3% → 240 ₪ נרשמים כמשולמים ע"י חיליק.
   הפונקציה אידמפוטנטית: יוצרת/מעדכנת/מסירה את התשלום האוטומטי לפי המצב,
   ונצמדת לתקרה — אוטומטי + ידני לעולם לא יעברו את מה שמגיע למנהל. */
function syncAutoMgmtPayments(eId){
  if(isContainer(eId)) return;   /* מכל: הכסף ודמי הניהול יושבים בתתי-השלבים */
  var e=byId(DB.expenses,eId); if(!e) return;
  var a=byId(DB.apartments,e.apartmentId); if(!a) return;
  var cfg=a.autoMgmt||null;
  var on = !e.deleted && e.mgmtEnabled && a.hasManagement &&
           cfg && cfg.partnerId && (Number(cfg.pct)||0)>0;
  var autos=DB.payments.filter(function(p){ return p.expenseId===eId && p.auto; });
  var handled={};
  if(on){
    expMgrFees(eId).forEach(function(f){
      var mg=byId(DB.managers,f.managerId); if(!mg||mg.deleted) return;
      var live=mgrFeeLiveOnExpense(eId,f.managerId);
      var target=round2(live*(Number(cfg.pct)||0)/100);
      // תשלומים ידניים קודמים — האוטומטי מצטמצם כדי לא לחרוג מהתקרה
      var manual=expPayments(eId).filter(function(p){
        return p.recipientType==="manager"&&p.recipientManagerId===f.managerId&&!p.auto; })
        .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
      if(target>round2(live-manual)) target=round2(live-manual);
      if(target<0) target=0;
      var ex=autos.find(function(p){ return p.recipientManagerId===f.managerId; });
      if(target<=0.009){
        if(ex && !ex.deleted){ ex.deleted=true; ex.deletedBy="autoMgmt"; }
      } else if(ex){
        ex.deleted=false; delete ex.deletedBy;
        ex.amount=target; ex.payerPartnerId=cfg.partnerId; ex.method="equiv";
        ex.invoiceStatus="none"; ex.hasInvoice=false;   // "שווה ערך" — לא צריך חשבונית
        ex.note=AUTO_MGMT_NOTE;
      } else {
        DB.payments.push({id:uid(),expenseId:eId,date:e.date||todayISO(),amount:target,
          accountId:null,payerPartnerId:cfg.partnerId,method:"equiv",
          recipientType:"manager",recipientManagerId:f.managerId,
          hasInvoice:false,invoiceLink:"",invoiceStatus:"none",
          note:AUTO_MGMT_NOTE,auto:true,deleted:false});
      }
      handled[f.managerId]=1;
    });
  }
  // אוטומטיים שכבר לא רלוונטיים (ההגדרה כובתה / דמי הניהול בוטלו / מנהל הוסר)
  autos.forEach(function(p){
    if((!on || !handled[p.recipientManagerId]) && !p.deleted){ p.deleted=true; p.deletedBy="autoMgmt"; }
  });
}
function syncAutoMgmtApartment(aptId){
  apLeafExpenses(aptId).forEach(function(e){ syncAutoMgmtPayments(e.id); });
}

// שותף — כמה אמור לשלם (חלקו בהוצאות + חלקו בדמי הניהול, לפי חלוקת ההוצאה)
function partnerPctInExpense(eId,pId){ return expSplits(eId).reduce(function(s,x){ return s+(x.partnerId===pId?(Number(x.percent)||0):0); },0); }
function partnerShouldPay(aptId,pId){
  return round2(apLeafExpenses(aptId).reduce(function(sum,e){
    var pct=partnerPctInExpense(e.id,pId)/100; if(!pct) return sum;
    return sum + pct*(Number(e.amount)||0) + pct*expenseMgmtCostLive(e.id);
  },0));
}
// שותף — כמה שילם בפועל (תשלומים ישירים שלו מחשבון שאינו בנק + הפקדותיו לבנק)
function partnerPaid(aptId,pId){
  var expIds={}; apLeafExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
  var direct=active(DB.payments).filter(function(p){
    return expIds[p.expenseId] && !accountIsBank(p.accountId) && p.payerPartnerId===pId;
  }).reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  var deps=apDeposits(aptId).filter(function(d){return d.partnerId===pId;}).reduce(function(s,d){return s+(Number(d.amount)||0);},0);
  /* הכנסה שנכנסה לבנק הזמני — חלקו של השותף בה נחשב כאילו הפקיד אותו */
  var inc=bankIncomeEntries(aptId).reduce(function(s,x){ return s+x.amount*incomePartnerPct(x.i,pId)/100; },0);
  return round2(direct+deps+inc);
}
/* ---------- משיכת רווח ----------
   שותף שמושך כסף מהפרוייקט. המשיכה יורדת מהיתרה שלו (הוא קיבל חזרה),
   ואם שולמה מבנק זמני — גם מיתרת הבנק. */
function apWithdrawals(aptId){
  return active(DB.withdrawals).filter(function(w){ return w.apartmentId===aptId; });
}
function partnerWithdrawn(aptId,pId){
  return round2(apWithdrawals(aptId).filter(function(w){ return w.partnerId===pId; })
    .reduce(function(s,w){ return s+(Number(w.amount)||0); },0));
}
function bankWithdrawals(aptId,bankId){
  return apWithdrawals(aptId).filter(function(w){
    if(!w.accountId || !accountIsBank(w.accountId)) return false;
    return bankId ? w.accountId===bankId : true;
  });
}
function partnerBalance(aptId,pId){ return round2(partnerPaid(aptId,pId)-partnerShouldPay(aptId,pId)-partnerWithdrawn(aptId,pId)); }
// קבוצת השותפים לדוחות = שותפי-הפרוייקט ∪ כל שותף שמופיע בחלוקת הוצאה (שלא ייעלם כסף מהדוח)
function apReportPartnerIds(aptId){
  var set={}, order=[];
  function add(pid){ if(pid && !set[pid]){ set[pid]=1; order.push(pid); } }
  apPartners(aptId).forEach(function(ap){ add(ap.partnerId); });
  var expIdSet={};
  apLeafExpenses(aptId).forEach(function(e){ expIdSet[e.id]=1; expSplits(e.id).forEach(function(s){ add(s.partnerId); }); });
  apDeposits(aptId).forEach(function(d){ add(d.partnerId); });           // מפקידים לבנק
  active(DB.payments).forEach(function(p){ if(expIdSet[p.expenseId] && !accountIsBank(p.accountId)) add(p.payerPartnerId); }); // משלמים ישירים
  return order;
}
function reportPartnerIds(aptId){
  /* כל שותפי הפרוייקט — הגבלת המשתמש היא ברמת הפרוייקט, לא ברמת השותף */
  return apReportPartnerIds(aptId);
}
function partnerDefaultPct(aptId,pId){ var r=apPartners(aptId).find(function(x){return x.partnerId===pId;}); return r?r.defaultPercent:null; }

// בנק
/* ---------- כמה בנקים זמניים באותו פרוייקט ----------
   בנק זמני הוא חשבון שסומן isBank. אפשר יותר מאחד, וכל תנועה (הפקדה,
   הכנסה, תשלום) משויכת לבנק מסוים. תנועה ישנה בלי שיוך נזקפת לבנק
   הראשון — כך נתונים שנוצרו כשהיה בנק אחד ממשיכים להתנהג בדיוק כמו קודם. */
/* לפי סדר היצירה ולא לפי א"ב — הבנק הראשון חייב להיות יציב, אחרת
   הוספת בנק ששמו מוקדם אלפביתית הייתה מעבירה אליו תנועות ישנות.
   בנק כללי (בלי שיוך לפרוייקט) מוצג רק כשאין לפרוייקט בנקים משלו,
   או כשיש בו תנועות של הפרוייקט הזה — אחרת הוא רעש בכל פרוייקט. */
function bankHasAptActivity(aptId,bankId){
  var dest="bank:"+bankId;
  if(apDeposits(aptId).some(function(d){ return d.accountId===bankId; })) return true;
  if(apWithdrawals(aptId).some(function(w){ return w.accountId===bankId; })) return true;
  var expIds={}; apLeafExpenses(aptId).forEach(function(e){ expIds[e.id]=1; });
  if(active(DB.payments).some(function(p){ return expIds[p.expenseId] && p.accountId===bankId; })) return true;
  return apIncome(aptId).some(function(i){
    if(i.receivedBy===dest) return true;
    return incomePays(i).some(function(g){ return g.receivedBy===dest; });
  });
}
function aptBankAccounts(aptId){
  var all=active(DB.accounts).filter(function(ac){
    return ac.isBank && (!ac.apartmentId || ac.apartmentId===aptId); });
  var own=all.filter(function(ac){ return ac.apartmentId===aptId; });
  if(!own.length) return all;
  return all.filter(function(ac){
    return ac.apartmentId===aptId || bankHasAptActivity(aptId,ac.id); });
}
/* פרוייקט שהבנק הזמני שלו הופעל לפני שהיו בכלל חשבונות בנק — הבנק היה
   דגל בלבד, בלי חשבון שאפשר לשייך אליו תנועות. יוצרים לו חשבון אחד,
   פעם אחת בלבד (bankAcctInit), כדי שיופיע בבוררים ובהתאמת הבנק.
   החישובים לא משתנים: תנועות ישנות ממילא נזקפות לבנק הראשון. */
function ensureBankAccount(a,db){
  db=db||DB;
  if(!a || a.deleted || !a.hasBank || a.bankAcctInit) return;
  var has=(db.accounts||[]).some(function(ac){
    return !ac.deleted && ac.isBank && (!ac.apartmentId || ac.apartmentId===a.id); });
  if(!has){
    db.accounts=db.accounts||[];
    db.accounts.push({id:uid(),apartmentId:a.id,name:"בנק זמני",isBank:true,partnerId:null,deleted:false});
  }
  a.bankAcctInit=true;
}
function primaryBankId(aptId){ var b=aptBankAccounts(aptId); return b.length?b[0].id:""; }
function bankName(accId){ var a=accId?byId(DB.accounts,accId):null; return a?a.name:"בנק זמני"; }
/* יעד "בנק" של הכנסה/תשלום: "bank" (ישן) או "bank:<accountId>" */
function isBankDest(v){ v=String(v||""); return v==="bank"||v.indexOf("bank:")===0; }
function bankIdOfDest(v,aptId){
  v=String(v||"");
  if(v.indexOf("bank:")===0){ var id=v.slice(5); if(byId(DB.accounts,id)) return id; }
  return primaryBankId(aptId);
}
function depositBankId(d,aptId){
  return (d.accountId && byId(DB.accounts,d.accountId)) ? d.accountId : primaryBankId(aptId);
}
/* אפשרויות "למי נכנס הכסף" — בנק לכל חשבון בנק בפרוייקט, ואז השותפים */
/* אותה רשימה לעדכון מרוכז — "ללא שינוי" במקום "לא צוין" */
/* ---------- פענוח טקסט חופשי ליעד "נכנס ל…" ----------
   נתונים שיובאו מאקסל נחתו לא פעם בהערה ("פאגי", "בנק זמני", שם שותף)
   במקום בשדה היעד. כאן מתרגמים את הטקסט ליעד אמיתי: בנק זמני של
   הפרוייקט או שותף, לפי השם. ההתאמה סלחנית לרווחים, למקפים ולקידומת
   "בנק", אבל לא מנחשת: טקסט שמתאים ליותר מיעד אחד נחשב לא-מזוהה. */
function destKeyNorm(t){
  return String(t||"").replace(/[\-–—_.]/g," ").replace(/\s+/g," ").trim().toLowerCase();
}
function destFromText(aptId,txt){
  var q=destKeyNorm(txt);
  if(!q) return null;
  var cands=[];
  aptBankAccounts(aptId).forEach(function(b){ cands.push({v:"bank:"+b.id,n:destKeyNorm(b.name)}); });
  if(aptHasBank(aptId) && !aptBankAccounts(aptId).length) cands.push({v:"bank",n:destKeyNorm("בנק זמני")});
  apPartners(aptId).forEach(function(p){ cands.push({v:p.partnerId,n:destKeyNorm(partnerName(p.partnerId))}); });
  var exact=cands.filter(function(c){ return c.n===q; });
  if(exact.length===1) return exact[0].v;
  if(exact.length>1) return null;
  /* התאמה חלקית — רק אם היא יחידה */
  var part=cands.filter(function(c){ return c.n && (c.n.indexOf(q)>=0 || q.indexOf(c.n)>=0); });
  return part.length===1 ? part[0].v : null;
}
function destOptionsBulk(aptId){
  return '<option value="">— ללא שינוי —</option><option value="__none">לא צוין</option>'+
    '<option value="__fromnote">📋 לפי מה שרשום בהערה</option>'+
    destOptions(aptId,"__never").replace('<option value="">— לא צוין —</option>',"");
}
function destOptions(aptId,sel){
  var h='<option value="">— לא צוין —</option>';
  var banks=aptBankAccounts(aptId);
  if(aptHasBank(aptId)){
    if(!banks.length) h+='<option value="bank"'+(sel==="bank"?" selected":"")+'>🏦 הבנק הזמני (קופה משותפת)</option>';
    else banks.forEach(function(b){
      var v="bank:"+b.id;
      /* ערך ישן "bank" נבחר מול הבנק הראשי */
      var on=(sel===v)||(sel==="bank"&&b.id===primaryBankId(aptId));
      h+='<option value="'+v+'"'+(on?" selected":"")+'>🏦 '+esc(b.name)+'</option>';
    });
  }
  apPartners(aptId).forEach(function(p){
    h+='<option value="'+p.partnerId+'"'+(sel===p.partnerId?" selected":"")+'>'+esc(partnerName(p.partnerId))+'</option>';
  });
  return h;
}
/* כסף מהכנסות שנכנס לבנק הזמני.
   בהזמנה עם מעקב תשלומים הכסף נכנס בפועל רק בתשלומים, ולכן היעד נקבע
   על כל תשלום בנפרד והסכום שנספר הוא מה ששולם — לא מחיר ההזמנה המלא.
   בהכנסה רגילה (בלי תשלומים) היעד יושב על ההכנסה עצמה, כמו תמיד. */
function bankIncomeEntries(aptId,bankId){
  var out=[];
  apIncomeCalc(aptId).forEach(function(i){
    if(incomeTracked(i)){
      incomePays(i).forEach(function(g){
        if(isBankDest(g.receivedBy))
          out.push({i:i,date:g.date||i.date,amount:Number(g.amount)||0,pay:g,bankId:bankIdOfDest(g.receivedBy,aptId)});
      });
    }else if(isBankDest(i.receivedBy))
      out.push({i:i,date:i.date,amount:Number(i.amount)||0,pay:null,bankId:bankIdOfDest(i.receivedBy,aptId)});
  });
  return bankId ? out.filter(function(x){ return x.bankId===bankId; }) : out;
}
function bankIncomes(aptId){ return apIncome(aptId).filter(function(i){ return isBankDest(i.receivedBy); }); }
/* הפקדות של בנק מסוים (בלי bankId — כל הבנקים) */
function bankDeposits(aptId,bankId){
  var deps=apDeposits(aptId);
  return bankId ? deps.filter(function(d){ return depositBankId(d,aptId)===bankId; }) : deps;
}
/* תשלומים שיצאו מבנק מסוים */
function bankOutPayments(aptId,bankId){
  var expIds={}; apLeafExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
  return active(DB.payments).filter(function(p){
    if(!expIds[p.expenseId] || !accountIsBank(p.accountId)) return false;
    return bankId ? p.accountId===bankId : true;
  });
}
/* יתרת בנק. בלי bankId — סך כל הבנקים הזמניים של הפרוייקט. */
function bankBalance(aptId,bankId){
  var deps=bankDeposits(aptId,bankId).reduce(function(s,d){return s+(Number(d.amount)||0);},0);
  /* הכנסה שסומנה "נכנסה לבנק הזמני" מגדילה את היתרה, כמו הפקדה —
     רק בלי שיוך לשותף, כי זה כסף של הפרויקט */
  var inc=bankIncomeEntries(aptId,bankId).reduce(function(s,x){return s+x.amount;},0);
  var out=bankOutPayments(aptId,bankId).reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  var wd=bankWithdrawals(aptId,bankId).reduce(function(s,w){return s+(Number(w.amount)||0);},0);
  return round2(deps+inc-out-wd);
}
/* ============================================================
   התאמת בנק — שורות מדף הבנק מול הזמנות שטרם שולמו
   ------------------------------------------------------------
   שורת בנק היא עובדה (נכנסו 10,000 ב-3/8), וההתאמה היא פרשנות.
   לכן השורה נשמרת כישות משלה, וההתאמות תלויות בה: אפשר לראות מה
   עדיין לא מוסבר, לבטל התאמה שגויה, ולפצל שורה אחת לכמה הזמנות.
   ההתאמה היא שיוצרת את תשלום ההזמנה — אין הזנה כפולה.
   ============================================================ */
/* רשימת הבנקים להתאמה — מוגדרת על ידי המשתמש, גלובלית: בנק אחד יכול
   לשרת כמה פרוייקטים, ואין לו קשר ל"בנק זמני" של אף פרוייקט. */
function stmtBanks(){ return active(DB.stmtBanks||[]); }
/* כמה תנועות משויכות לכל בנק — כדי לדעת מה מאבדים באיחוד */
function stmtBankUse(id){

}
/* שם מנורמל לזיהוי וריאציות: "יהב -012" ו-"יהב 012" הם אותו בנק.
   מסירים מקפים, נקודות ורווחים כפולים. */
function bankKeyNorm(n){
  return String(n||"").replace(/[\-–—_.]/g," ").replace(/\s+/g," ").trim().toLowerCase();
}
/* בנקים שלא נותרה בהם אף תנועה — בדרך כלל שאריות של איחוד או של
   הדבקה שגויה. מחיקה רכה, כך שניתן לשחזר מסל המחזור. */
function cleanEmptyStmtBanks(){

}
function openMergeStmtBanks(){

    (dupN?' <b>נמצאו '+dupN+' שמות שנראים כאותו בנק</b> — הם מסומנים מראש.':'')+'</div>'+
    '<div class="field"><label>לאחד לתוך</label><select id="mb-target">'+
      banks.map(function(b){ return '<option value="'+b.id+'">'+esc(b.name)+' ('+stmtBankUse(b.id)+' תנועות)</option>'; }).join("")+
    '</select></div>'+
    '<div class="section-title">מה לאחד</div>'+
    '<div class="table-wrap" style="max-height:300px"><table class="tbl"><thead><tr>'+
    '<th class="chk" style="width:30px"></th><th>בנק</th><th>תנועות</th></tr></thead><tbody>'+
    banks.map(function(b){
      var dup=groups[bankKeyNorm(b.name)].length>1;
      return '<tr'+(dup?' style="background:#fff7ed"':'')+'>'+
        '<td class="chk"><input type="checkbox" class="mb-x" value="'+b.id+'" style="width:auto"'+(dup?" checked":"")+'></td>'+
        '<td>'+esc(b.name)+(dup?' <span class="badge badge-warn badge-unit">נראה כפול</span>':'')+'</td>'+

    saveLabel:"אחד",onSave:function(){ return applyMergeStmtBanks(); }});
}
function applyMergeStmtBanks(){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var toId=val("mb-target");
  var target=byId(DB.stmtBanks,toId);
  if(!target){ toast("בחר בנק יעד","err"); return false; }
  var ids=[];
  document.querySelectorAll(".mb-x:checked").forEach(function(c){
    if(c.value!==toId) ids.push(c.value);
  });
  if(!ids.length){ toast("סמן לפחות בנק אחד לאיחוד (מלבד בנק היעד)","warn"); return false; }
  var moved=0;
  ids.forEach(function(id){
    active(DB.bankMoves).forEach(function(m){ if(m.stmtBankId===id){ m.stmtBankId=toId; moved++; } });
    var b=byId(DB.stmtBanks,id); if(b) b.deleted=true;
  });
  if(BQ && ids.indexOf(BQ.bank)>=0) BQ.bank=toId;   /* הסינון הצביע לבנק שאוחד */
  save();
  toast("אוחדו "+ids.length+" בנקים ל\""+target.name+"\" · הועברו "+moved+" תנועות","ok");
  rerender();
  return true;
}
function stmtBankName(id){ var b=id?byId(DB.stmtBanks,id):null; return b?b.name:""; }
function addStmtBank(name){
  name=String(name||"").trim(); if(!name) return null;
  var ex=stmtBanks().filter(function(b){ return normKey(b.name)===normKey(name); })[0];

/* ============================================================
   ביצועים במסך התאמת בנק

   2. כל שורה חיפשה את ההכנסה שהותאמה לה בסריקה לינארית על כל
      ההכנסות — אלפי סריקות בכל רינדור.
   3. כל 1500 השורות נבנו ל-DOM בבת אחת.

var BM_SEARCH_T=null;

function moveAllocated(m){ return round2(moveMatches(m).reduce(function(s,x){ return s+(Number(x.amount)||0); },0)); }
function moveRemaining(m){ return round2((Number(m.amount)||0)-moveAllocated(m)); }

/* הפרוייקט של השורה — נקבע רק בהתאמה (הבנק משרת כמה פרוייקטים) */

/* ---------- דירוג מועמדים ----------
   הזמנה עם חוב פתוח מקבלת ניקוד לפי: סכום זהה, שם האורח שמופיע
   בתיאור מהבנק, וקרבת תאריכים. הניקוד רק מסדר את הרשימה — הבחירה
   תמיד שלך. */
/* ---------- מאגר מועמדים מחושב מראש ----------
   ההתאמה המרוכזת קראה ל-moveCandidates לכל שורה, וכל קריאה חישבה
   מחדש את החוב של כל הכנסה (סריקת התשלומים שלה) ואת פירוק המילים.
   על 1500 שורות מול 500 הכנסות זה יצא מאות אלפי סריקות — והמסך
   נתקע לשניות. המאגר בונה את הנתונים היקרים פעם אחת. */
var _BMPOOL=null;
function bmPoolBuild(){
  _BMPOOL={all:[],byApt:{}};
  active(DB.apartments).filter(function(a){ return canSeeApartment(a.id); }).forEach(function(a){
    var arr=[];
    apIncome(a.id).forEach(function(i){
      var debt=incomeDebt(i);
      if(debt<=0.01) return;
      var e={i:i,debt:debt,
        words:String(i.description||"").split(/\s+/).map(normKey).filter(function(w){ return w.length>=3; }),
        dates:[i.date,stayStart(i),i.endDate].filter(Boolean).map(function(d){ return Date.parse(d); })};
      arr.push(e); _BMPOOL.all.push(e);
    });
    _BMPOOL.byApt[a.id]=arr;
  });
}
function bmPoolClear(){ _BMPOOL=null; }
function moveCandidates(m,aptId){
  var rem=moveRemaining(m);
  var desc=normKey(moveText(m));
  var out=[];
  var mDate=Date.parse(m.date);
  /* עם מאגר — משתמשים בו; בלעדיו (התאמה בודדת) — הדרך הישנה */
  if(_BMPOOL){
    var entries=aptId?(_BMPOOL.byApt[aptId]||[]):_BMPOOL.all;
    entries.forEach(function(e){
      var i=e.i, debt=e.debt;
      var score=0, why=[];
      if(Math.abs(debt-rem)<=0.01){ score+=100; why.push("סכום זהה לחוב"); }
      if(Math.abs((Number(i.amount)||0)-rem)<=0.01){ score+=70; why.push("סכום זהה למחיר"); }
      var hit=0;
      for(var w=0;w<e.words.length && hit<2;w++) if(desc.indexOf(e.words[w])>=0) hit++;
      if(hit){ score+=60*hit; why.push("השם מופיע בתיאור"); }
      var best=null;
      for(var d=0;d<e.dates.length;d++){
        var days=Math.abs(mDate-e.dates[d])/86400000;
        if(best===null||days<best) best=days;
      }
      if(best!==null){
        if(best<=3){ score+=30; why.push("תאריך קרוב"); }
        else if(best<=14) score+=15;
        else if(best<=45) score+=5;
      }
      out.push({inc:i,debt:debt,score:score,why:why,days:best});
    });
    return out.sort(function(x,y){ return y.score-x.score || Math.abs(x.debt-rem)-Math.abs(y.debt-rem); });
  }
  /* בלי פרוייקט — מחפשים בכל הפרוייקטים שהמשתמש רואה */
  var pool=aptId?apIncome(aptId)
    :active(DB.apartments).filter(function(a){ return canSeeApartment(a.id); })
      .reduce(function(arr,a){ return arr.concat(apIncome(a.id)); },[]);
  pool.forEach(function(i){
    var debt=incomeDebt(i);
    if(debt<=0.01) return;
    var score=0, why=[];
    if(Math.abs(debt-rem)<=0.01){ score+=100; why.push("סכום זהה לחוב"); }
    else if(rem<debt && Math.abs(rem-Math.round(rem))<0.01 && rem>0){ score+=25; }
    if(Math.abs((Number(i.amount)||0)-rem)<=0.01){ score+=70; why.push("סכום זהה למחיר"); }
    /* שם האורח בתוך התיאור מהבנק — הסימן הכי חזק בפועל */
    var words=String(i.description||"").split(/\s+/).filter(function(w){ return normKey(w).length>=3; });
    var hit=words.filter(function(w){ return desc.indexOf(normKey(w))>=0; });
    if(hit.length){ score+=60*Math.min(hit.length,2); why.push("השם מופיע בתיאור"); }
    /* קרבת תאריכים — לתאריך ההזמנה או לתקופת השהות */
    var refDates=[i.date,stayStart(i),i.endDate].filter(Boolean);
    var best=null;
    refDates.forEach(function(d){
      var days=Math.abs(Date.parse(m.date)-Date.parse(d))/86400000;
      if(best===null||days<best) best=days;
    });
    if(best!==null){
      if(best<=3){ score+=30; why.push("תאריך קרוב"); }
      else if(best<=14) score+=15;
      else if(best<=45) score+=5;
    }
    out.push({inc:i,debt:debt,score:score,why:why,days:best});
  });
  return out.sort(function(x,y){ return y.score-x.score || Math.abs(x.debt-rem)-Math.abs(y.debt-rem); });
}
/* התאמה בטוחה להתאמה אוטומטית: מועמד יחיד בולט עם סכום זהה */
function autoMatchPick(m,aptId){
  var c=moveCandidates(m,aptId);
  if(!c.length) return null;
  var top=c[0];
  if(top.score<100) return null;                      // חייב לפחות סכום זהה
  if(c.length>1 && c[1].score>=top.score-20) return null;  // שני מועמדים דומים — לא לנחש
  return top;
}
/* ביצוע התאמה: יוצר את תשלום ההזמנה וקושר אליו את שורת הבנק */
function applyMoveMatch(m,inc,amount){
  amount=round2(Number(amount)||0);
  if(amount<=0) return null;
  /* היעד לא נקבע כאן — הבנק שהודבק הוא חשבון אמיתי שמשרת כמה פרוייקטים,
     לא ה"בנק הזמני" של הפרוייקט. שם הבנק נשמר בהערת התשלום.
     (שורות ותיקות שקושרו לחשבון פרוייקט שומרות את היעד הישן.) */
  var bankNm=moveBankLabel(m);
  var srcTxt=[m.name,m.details,m.description].filter(Boolean).join(" · ");
  var g={id:uid(),date:m.date,amount:amount,method:"transfer",
    receivedBy:(!m.stmtBankId&&m.accountId)?("bank:"+m.accountId):"",
    invoices:"",sentToCpa:!!(m.date&&m.date<CPA_CUTOFF),
    note:("מדף הבנק"+(bankNm&&bankNm!=="—"?" "+bankNm:"")+(srcTxt?" · "+srcTxt:"")).slice(0,120),deleted:false};
  if(!inc.payments) inc.payments=[];
  inc.payments.push(g);
  m.matches=m.matches||[];
  m.matches.push({id:uid(),incomeId:inc.id,payId:g.id,amount:amount,deleted:false});
  if(!m.apartmentId) m.apartmentId=inc.apartmentId;
  return g;
}
/* ביטול התאמה — מוחק גם את התשלום שנוצר ממנה */
function undoMoveMatch(m,matchId){

/* לאן נכנסה ההכנסה — לתצוגה ולייצוא.
   בהזמנה עם תשלומים היעד נקבע על כל תשלום, ולכן מוצגים היעדים שלהם. */
function destName(v){
  if(!v) return "";

  if(v==="bank") return "בנק זמני";

function incomeDestName(i){

       שממתינה לתשלום הייתה מציגה עמודת יעד ריקה */
    if(seen.length) return seen.join(" · ");
  }
  return destName(i.receivedBy);
}
/* ---------- חלוקת הכנסה בין השותפים ----------
   שרשרת: חלוקה שנקבעה על ההכנסה עצמה ← ברירת המחדל שנקבעה לפרוייקט
   ← אחוזי השותפים הרגילים. הכנסה שנכנסה לבנק הזמני נזקפת לשותפים
   לפי החלוקה הזו — כאילו כל אחד הפקיד את חלקו. */

function managerReceivable(aptId,mId){ return round2(apLeafExpenses(aptId).reduce(function(s,e){return s+mgrFeeLiveOnExpense(e.id,mId);},0)); }
/* דחוי שטרם שוחרר = ההפרש בין הסופי לפעיל */

// סיכומי פרוייקט
function apartmentTotals(aptId){
  var exps=apLeafExpenses(aptId);
  var totalExpenses=exps.reduce(function(s,e){return s+(Number(e.amount)||0);},0);
  var totalMgmt=exps.reduce(function(s,e){return s+expenseMgmtCostLive(e.id);},0);
  var totalPaid=exps.reduce(function(s,e){return s+expensePaid(e.id);},0);
  var expIdSet={}; exps.forEach(function(e){expIdSet[e.id]=1;});
  var mgrPaidTot=active(DB.payments).filter(function(p){return expIdSet[p.expenseId]&&p.recipientType==="manager";})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  var income=apIncomeCalc(aptId).reduce(function(s,i){return s+(Number(i.amount)||0);},0);

    totalPaid:round2(totalPaid),mgrPaidTot:round2(mgrPaidTot),paidAll:round2(totalPaid+mgrPaidTot),
    remaining:round2(totalExpenses+totalMgmt-totalPaid-mgrPaidTot),
    income:round2(income),bank:bankBalance(aptId)};

/* ============================================================
   הרשאות
   ============================================================ */
function can(action){
  if(!CU) return false;
  if(CU.role==="admin") return true;
  if(CU.role==="editor") return action!=="manageUsers"&&action!=="settings";
  if(CU.role==="viewer"||CU.role==="partner"||CU.role==="mgmt") return action==="view";
  return false;
}
/* משתמש מסוג "דמי ניהול" — מנהל שמקבל דמי ניהול. רואה רק את השלבים
   שיש בהם דמי ניהול (וכמה), ורק את התשלומים למנהלים, בפרוייקטים
   שקושרו לו. אין לו גישה לחלוקת שותפים, תשלומי ספקים, בנק והכנסות. */
function isMgmtUser(){ return !!(CU && CU.role==="mgmt"); }
/* מסנן את ה-DB המקומי לנתוני דמי הניהול בלבד — תמונה נכונה מיד,
   וכהגנה נוספת מעבר לסינון בשרת. אידמפוטנטי. */
function clientScopeMgmt(){
  if(!isMgmtUser()||!DB) return;
  var okExp={};
  (DB.expenses||[]).forEach(function(e){
    if(!canSeeApartment(e.apartmentId)) return;
    if(e.mgmtEnabled) okExp[e.id]=1;
  });
  DB.expenses      = (DB.expenses||[]).filter(function(e){ return okExp[e.id]; });
  DB.payments      = (DB.payments||[]).filter(function(p){ return okExp[p.expenseId] && p.recipientType==="manager"; });
  DB.expenseManagerFees=(DB.expenseManagerFees||[]).filter(function(f){ return okExp[f.expenseId]; });
  DB.managers      = (DB.managers||[]).filter(function(m){ return canSeeApartment(m.apartmentId); });
  DB.apartments    = (DB.apartments||[]).filter(function(a){ return canSeeApartment(a.id); });
  /* לא רלוונטי לדמי ניהול — ולא אמור להיחשף */
  DB.expenseSplits=[]; DB.deposits=[]; DB.income=[]; DB.partners=[]; DB.apartmentPartners=[]; DB.accounts=[];
  DB.bankMoves=[]; DB.stmtBanks=[]; DB.withdrawals=[]; DB.incMgmtPays=[]; DB.recurring=[]; DB.rentals=[]; DB.sheets=[];
}
/* "פרוייקטים מורשים" חלות על כל תפקיד חוץ ממנהל. קודם הן נאכפו רק על
   תפקיד "שותף", כך שצופה שהוגבל לפרוייקט אחת ראה בפועל את כולן. */
function canSeeApartment(aptId){
  if(!CU) return false;
  if(CU.role==="admin") return true;
  var allowed=CU.allowedApartments||[];
  if(allowed.length) return allowed.indexOf(aptId)>=0;
  /* מדור קודם: משתמש ששויך פעם לשותף (partnerId) אך בלי פרוייקטים מפורשים —
     נעול עד שמנהל יקצה לו פרוייקטים. fail-closed: לא "כל הפרוייקטים" בטעות. */
  if(CU.partnerId) return false;
  return true;   // ריק לגמרי (ובלי שיוך ישן) = כל הפרוייקטים, בכוונת מנהל
}

/* ============================================================
