<meta charset="utf-8">
<title>ניהול דירות ושותפויות</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#eef0f7; --panel:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#e6e9f4;
  --brand:#4f46e5; --brand-d:#4338ca; --brand-l:#eef2ff;
  --ok:#059669; --warn:#d97706; --danger:#dc2626;
  --chip:#eef2ff; --shadow:0 1px 2px rgba(30,41,59,.06),0 4px 16px rgba(30,41,59,.06);
  --shadow-lg:0 8px 30px rgba(30,41,59,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Rubik","Heebo","Assistant","Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;
  background:var(--bg);
  background-image:radial-gradient(900px 340px at 85% -80px,rgba(79,70,229,.10),transparent 60%),
                   radial-gradient(700px 300px at 8% -60px,rgba(14,165,233,.08),transparent 55%);
  background-attachment:fixed;
  color:var(--ink);direction:rtl;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h2{font-weight:800;letter-spacing:-.01em}
h3{font-weight:700}
button{font-family:inherit}
::selection{background:#c7d2fe}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#c3c9de;border-radius:8px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#9aa3c4;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:9px 12px;
  border:1.5px solid #dde1f0;border-radius:10px;background:#fff;color:var(--ink);
  transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:#c4cbe8}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3.5px rgba(79,70,229,.13)}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.hidden{display:none!important}

/* ===== מסגרת עליונה ===== */
.topbar{position:sticky;top:0;z-index:30;color:#fff;display:flex;align-items:center;gap:12px;
  padding:11px 20px;
  background:linear-gradient(120deg,#1e1b4b 0%,#312e81 45%,#4338ca 100%);
  box-shadow:0 4px 20px rgba(30,27,75,.35)}
.topbar .logo{font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.topbar .logo::before{content:"\1F3E0";display:grid;place-items:center;width:34px;height:34px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:10px;font-size:17px}
.topbar .sp{flex:1}
.topbar select{width:auto;min-width:190px;background:rgba(255,255,255,.12);color:#fff;
  border-color:rgba(255,255,255,.28);font-weight:600}
.topbar select:focus{box-shadow:0 0 0 3.5px rgba(255,255,255,.18);border-color:rgba(255,255,255,.6)}
.topbar select option{color:#111}
.topbar .who{font-size:13px;opacity:.92;font-weight:500}
.topbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.topbar .btn:hover{background:rgba(255,255,255,.22);transform:none}

/* ===== ניווט ===== */
.nav{display:flex;gap:6px;flex-wrap:wrap;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  padding:9px 20px;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:20}
.nav-item{padding:7px 15px;border-radius:999px;cursor:pointer;font-weight:600;color:#475569;font-size:13.5px;
  transition:background .15s,color .15s,box-shadow .15s;user-select:none}
.nav-item:hover{background:var(--brand-l);color:var(--brand-d)}
.nav-item.active{background:linear-gradient(135deg,var(--brand),#6366f1);color:#fff;
  box-shadow:0 3px 10px rgba(79,70,229,.35)}
/* במסכים גדולים מנצלים את כל הרוחב — טבלת 46 הפרויקטים נכנסת בלי גלילה */
.content{max-width:1200px;margin:0 auto;padding:22px 18px 90px}
@media(min-width:1300px){ .content{max-width:96vw} }
@media(min-width:1700px){ .content{max-width:1780px} }
/* טבלאות רחבות: מרווחים וגופן צפופים יותר, וגלישת שורה בעמודת השם */
.tbl-compact table.tbl{font-size:12.5px}
.tbl-compact table.tbl th,.tbl-compact table.tbl td{padding:8px 8px}
.tbl-compact table.tbl td:first-child,.tbl-compact table.tbl th:first-child{white-space:normal;min-width:150px}
.tbl-compact table.tbl td:not(:first-child),.tbl-compact table.tbl th:not(:first-child){white-space:nowrap}

/* ===== לשוניות משנה ===== */
/* לשוניות הדירה נשארות גלויות בגלילה, מתחת לסרגל ולניווט */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:20px;
  position:sticky;top:99px;z-index:15;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);
  padding:6px 18px 0;margin-left:-18px;margin-right:-18px}
.tab{padding:9px 15px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;
  border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0;
  transition:color .15s,background .15s;user-select:none}
.tab:hover{color:var(--ink);background:rgba(79,70,229,.05)}
.tab.active{color:var(--brand-d);border-bottom-color:var(--brand)}

/* ===== כרטיסים ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
  box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px;color:#0f172a}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--brand),#38bdf8)}
.stat .label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.stat .value{font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.grid{display:grid;gap:14px}
.apt-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.apt-card{cursor:pointer;transition:transform .15s,box-shadow .15s;border-top:4px solid var(--brand)}
.apt-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}

/* ===== טבלאות ===== */
/* CSS כופה overflow-y:auto כשיש overflow-x:auto — ולכן כותרת sticky
   שמכוונת לגלילת העמוד נחתכת. הפתרון: הטבלה גוללת בתוך עצמה,
   והכותרת נצמדת לראש אזור הגלילה שלה. עובד תמיד, גם אופקית. */
.table-wrap{max-height:calc(100vh - 210px);overflow:auto;border:1px solid var(--line);
  border-radius:14px;background:#fff;box-shadow:var(--shadow)}
#upd-banner{position:fixed;bottom:16px;left:16px;z-index:900;background:var(--brand);color:#fff;
  padding:9px 13px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.22);font-size:13px;
  display:flex;align-items:center;gap:9px}
#upd-banner .btn{background:#fff;color:var(--brand);border:0}
/* שורת הכפתור "ייצוא לאקסל" שנתלית מעל כל טבלה */
.xl-bar{display:flex;justify-content:flex-start;margin:0 0 5px;line-height:1}
.xl-bar .btn{padding:3px 9px;font-size:11.5px;opacity:.62}
.xl-bar .btn:hover{opacity:1}
@media print{.xl-bar{display:none}}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;font-size:13.5px;
  font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{padding:10px 13px;text-align:right;white-space:nowrap}
table.tbl thead th{background:#eef1fa;font-weight:700;color:#3f4863;font-size:12px;
  letter-spacing:.02em;position:sticky;top:0;z-index:5;
  border-bottom:2px solid #d9deef;
  box-shadow:0 1px 0 #d9deef, 0 6px 12px -8px rgba(30,41,59,.35)}
.modal-body .table-wrap{max-height:340px}
/* שורת סינון העמודות — נדבקת מתחת לכותרות */
table.tbl thead tr.filter-row th,table.tbl thead tr.filter-row td{
  background:#f8f9fe;position:sticky;top:34px;z-index:4;padding:5px 6px;
  border-bottom:1px solid #dfe3f2;box-shadow:none}
table.tbl thead tr.filter-row input{border-color:#dde1f0;background:#fff}
.sort-mark{font-size:10px}
table.tbl tbody td{border-bottom:1px solid #f0f2fa}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:#f6f8ff}
/* שורת הסיכום נדבקת לתחתית אזור הגלילה — הסה"כ תמיד גלוי */
table.tbl tfoot td{font-weight:800;background:#eef1fa;border-top:2px solid #d9deef;
  position:sticky;bottom:0;z-index:4;
  box-shadow:0 -1px 0 #d9deef, 0 -6px 12px -8px rgba(30,41,59,.3)}

/* ===== כפתורים ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:10px;
  border:1.5px solid #dde1f0;background:#fff;color:#334155;cursor:pointer;font-weight:600;font-size:13.5px;
  transition:all .15s;user-select:none}
.btn:hover{background:#f6f7fd;border-color:#c4cbe8;transform:translateY(-1px);box-shadow:0 3px 10px rgba(30,41,59,.08)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,var(--brand),#6366f1);border-color:transparent;color:#fff;
  box-shadow:0 3px 12px rgba(79,70,229,.35)}
.btn-primary:hover{background:linear-gradient(135deg,var(--brand-d),#4f46e5);box-shadow:0 5px 16px rgba(79,70,229,.45)}
.btn-danger{background:#fff;border-color:#fecaca;color:var(--danger)}
.btn-danger:hover{background:#fef2f2;border-color:#fca5a5}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.btn-ghost:hover{background:var(--brand-l);color:var(--brand-d);box-shadow:none;transform:none}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:9px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}

/* ===== תגיות ===== */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;letter-spacing:.01em}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.badge-ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.badge-warn{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.badge-danger{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.badge-muted{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.badge-mgmt{background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;font-weight:600}
tr.mgmt-row>td{background:#f7f8ff}
.pill{background:var(--chip);color:var(--brand-d);padding:2.5px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;border:1px solid #dfe4ff}
.muted{color:var(--muted)}
.pos{color:var(--ok);font-weight:700}
.neg{color:var(--danger);font-weight:700}
.center{text-align:center}.right{text-align:left}
div.empty{text-align:center;color:var(--muted);padding:44px 14px;background:#fff;
  border:1.5px dashed #d3d8ec;border-radius:16px;font-size:14.5px}
td.empty{text-align:center;color:var(--muted);padding:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.field{margin-bottom:10px}

/* ===== מודלים ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;justify-content:center;padding:34px 14px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;
  box-shadow:0 24px 70px rgba(2,6,23,.45);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:920px}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;background:linear-gradient(180deg,#fafbff,#fff);border-radius:18px 18px 0 0}
.modal-header h3{margin:0;font-size:16.5px;font-weight:800}
.modal-body{padding:18px 20px;max-height:70vh;overflow:auto}
.modal-footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;
  justify-content:flex-start;background:#fafbff;border-radius:0 0 18px 18px}
.x{cursor:pointer;font-size:20px;color:var(--muted);line-height:1;background:#f1f3fb;border:none;
  width:32px;height:32px;border-radius:9px;transition:background .15s}
.x:hover{background:#e5e8f6;color:var(--ink)}

/* ===== מסך כניסה ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#1e1b4b,#312e81 40%,#4338ca 75%,#6366f1);
  background-size:200% 200%;animation:loginbg 14s ease infinite}
@keyframes loginbg{0%{background-position:0% 40%}50%{background-position:100% 60%}100%{background-position:0% 40%}}
.login-card{background:#fff;border-radius:22px;padding:36px 34px;width:100%;max-width:390px;
  box-shadow:0 30px 80px rgba(2,6,23,.5);text-align:center}
.login-icon{width:74px;height:74px;margin:0 auto 6px;display:grid;place-items:center;font-size:36px;
  background:linear-gradient(135deg,var(--brand),#38bdf8);border-radius:20px;
  box-shadow:0 10px 26px rgba(79,70,229,.4)}
.login-card h1{font-size:21px;margin:14px 0 4px;font-weight:800;letter-spacing:-.01em}
.login-card p{color:var(--muted);margin:0 0 22px;font-size:13.5px}

/* ===== טוסטים ===== */
#toasts{position:fixed;bottom:18px;left:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:rgba(17,24,39,.94);backdrop-filter:blur(6px);color:#fff;padding:12px 17px;
  border-radius:12px;box-shadow:0 10px 30px rgba(2,6,23,.35);font-weight:600;font-size:13.5px;
  animation:pop .18s ease;max-width:440px}
.toast.ok{background:rgba(4,120,87,.95)}
.toast.err{background:rgba(185,28,28,.95)}
.toast.warn{background:rgba(180,83,9,.95)}

/* ===== שונות ===== */
.split-row,.mgr-row{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:center;margin-bottom:6px}
.sumline{display:flex;justify-content:space-between;padding:8px 2px;font-weight:700;
  border-top:1px dashed var(--line);margin-top:6px}
.section-title{font-weight:800;margin:18px 0 10px;font-size:14.5px;color:#334155;
  display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:4px;height:17px;border-radius:3px;
  background:linear-gradient(180deg,var(--brand),#38bdf8)}
.hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}.content{padding:14px 10px 80px}
  .topbar{padding:9px 12px;gap:8px}.nav{padding:8px 10px;top:52px}}
@media print{.topbar,.nav,.toolbar,.no-print{display:none!important}.content{max-width:100%}
  body{background:#fff}.card,.table-wrap{box-shadow:none}}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
"use strict";
/* ============================================================
   מערכת ניהול דירות ושותפויות — קובץ עצמאי
   אחסון: localStorage (מקור אמת מקומי) + סנכרון אופציונלי ל-Google Sheets
   ============================================================ */

/* ---------- קבועים ---------- */
var LSKEY = "apartmentsCRM_v1";
/* אחסון על השרת (VPS) — מקור האמת. מוטמע בקוד כדי שכל מכשיר יתחבר אוטומטית */
/* ---- גוגל שיטס = מקור האמת ----
   הכתובת מוטמעת כדי שכל מכשיר יתחבר אוטומטית.
   האבטחה אינה מסתמכת על סודיות הכתובת אלא על אימות בצד השרת:
   כל בקשה חייבת קוד כניסה תקף, אחרת ה-Apps Script לא מחזיר ולא שומר דבר. */
var SHEETS_URL = "https://script.google.com/macros/s/AKfycbxkuppsmvwlUDhg5ZfZlp7Kz9TRtEJ8XRhc0ihdDO-W5uCH8mxGWHF-wsr2WyopmgbIuQ/exec";
function sheetsUrl(){ return SHEETS_URL; }

/* hash של קוד הכניסה — נשמר ל-session בלבד (נמחק בסגירת הדפדפן) */
var AUTH_KEY = "apartmentsCRM_auth";
var AUTH = "";
function getAuth(){ if(AUTH) return AUTH; try{ return sessionStorage.getItem(AUTH_KEY)||""; }catch(e){ return ""; } }
function setAuth(h){ AUTH=h||""; try{ if(h) sessionStorage.setItem(AUTH_KEY,h); else sessionStorage.removeItem(AUTH_KEY); }catch(e){} }

/* קריאה ל-Apps Script. אובייקט => POST, מחרוזת => GET עם query */
async function api(payload){
  try{
    var r;
    if(typeof payload==="string"){ r=await fetch(SHEETS_URL+"?"+payload,{cache:"no-store"}); }
    else{ r=await fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}); }
    return await r.json();
  }catch(e){ return {ok:false,error:"network"}; }
}
var SYNC="idle";
function syncBadgeHtml(){
  var m={idle:["⏳","מתחבר…"],saving:["🔄","שומר לשיטס…"],ok:["✅","מסונכרן לשיטס"],
         err:["⚠️","שגיאת סנכרון — מנסה שוב"],local:["💾","מקומי בלבד — לא מחובר"]};
  var x=m[SYNC]||m.idle;
  var clk=can("settings")?' style="cursor:pointer" title="לחץ להגדרות סנכרון" onclick="go(\'settings\',{stab:\'sheets\'})"':'';
  return '<span id="sync-badge" class="who"'+clk+'>'+x[0]+' '+esc(x[1])+'</span>';
}
function setSync(s){ SYNC=s; var el=document.getElementById("sync-badge"); if(el){ el.outerHTML=syncBadgeHtml(); } }
var CLASSIFICATIONS = {investment:"השקעה", ongoing:"שוטף", private:"פרטי"};
/* אמצעי תשלום: בסיס קבוע + אמצעים שהמשתמש מוסיף (נשמרים בנתונים) */
var METHODS_BASE = {transfer:"העברה", check:"צ׳ק", credit:"אשראי", cash:"מזומן", equiv:"שווה ערך", other:"אחר"};
var METHODS = METHODS_BASE;   // נבנה מחדש בכל טעינה ע"י refreshMethods()
function refreshMethods(){
  var m={}; Object.keys(METHODS_BASE).forEach(function(k){ m[k]=METHODS_BASE[k]; });
  var custom=(DB&&DB.settings&&DB.settings.paymentMethods)||{};
  Object.keys(custom).forEach(function(k){ if(custom[k]) m[k]=custom[k]; });

/* ============================================================
   שכבת אינדוקס לרינדור
   ------------------------------------------------------------
   כל שליפה כמו expPayments(eId) סרקה את כל מערך התשלומים מחדש,
   ורינדור אחד עושה אלפי שליפות כאלה — מה שהפך דוחות גדולים
   לעשרות מיליוני פעולות ולעיכוב של שניות.

   כאן נבנה אינדקס פעם אחת בתחילת כל רינדור ונמחק בסופו. רינדור
   אינו משנה נתונים, ולכן האינדקס מובטח עקבי לכל אורכו; בכל מקום
   אחר (שמירה, עריכה, ייבוא) IX ריק והשליפות מתבצעות ישירות מהנתונים
   בדיוק כמו קודם. זהו אך ורק זירוז — לא שינוי בהתנהגות.
   ============================================================ */
var IX=null;
var IX_EMPTY=[];
function ixGroup(arr,key){
  var m=Object.create(null);
  for(var i=0;i<arr.length;i++){
    var x=arr[i]; if(x.deleted) continue;
    var k=x[key]; if(k==null||k==="") continue;
    (m[k]||(m[k]=[])).push(x);
  }
  return m;
}
function ixBuild(){
  var ix={maps:new WeakMap(),actives:new WeakMap(),leaf:Object.create(null),
          paid:Object.create(null),mgmt:Object.create(null),outflow:Object.create(null)};
  ix.payByExp   = ixGroup(DB.payments||[],"expenseId");
  ix.splitByExp = ixGroup(DB.expenseSplits||[],"expenseId");
  ix.feeByExp   = ixGroup(DB.expenseManagerFees||[],"expenseId");
  ix.kidsByPar  = ixGroup(DB.expenses||[],"parentId");
  ix.expByApt   = ixGroup(DB.expenses||[],"apartmentId");
  ix.apByApt    = ixGroup(DB.apartmentPartners||[],"apartmentId");
  ix.mgrByApt   = ixGroup(DB.managers||[],"apartmentId");
  ix.accByApt   = ixGroup(DB.accounts||[],"apartmentId");
  ix.depByApt   = ixGroup(DB.deposits||[],"apartmentId");
  ix.incByApt   = ixGroup(DB.income||[],"apartmentId");
  return ix;
}
function ixIdMap(list){
  var m=IX.maps.get(list);
  if(!m){ m=new Map(); for(var i=0;i<list.length;i++) m.set(list[i].id,list[i]); IX.maps.set(list,m); }
  return m;
}
function ixActive(list){
  var a=IX.actives.get(list);
  if(!a){ a=list.filter(function(x){return !x.deleted;}); IX.actives.set(list,a); }
  return a;
}
/* עוטף רינדור: בונה אינדקס, מרנדר, ומוחק אותו בכל מקרה */
function withIndex(fn){
  var outer=IX;
  if(!outer) IX=ixBuild();
  try{ return fn(); }
  finally{ if(!outer) IX=null; }
}

function active(list){
  if(IX&&list) return ixActive(list);
  return (list||[]).filter(function(x){return !x.deleted;});
}
function byId(list,id){
  if(IX&&list) return ixIdMap(list).get(id);
  return (list||[]).find(function(x){return x.id===id;});
}

/* ---------- ביטול פעולה (Ctrl+Z) ----------
   לפני כל שמירה נשמר המצב הקודם. אין צורך לצלם מראש: ב-localStorage
   עדיין נמצא המצב שלפני השינוי ברגע שקוראים ל-save(). */
var UNDO=[], UNDO_MAX=30;
function undoCount(){ return UNDO.length; }
/* סימון "יש שינוי מקומי שטרם הגיע לשרת" — נשמר ב-localStorage (שורד רענון
   וסגירה), ומנוקה רק אחרי אישור שמירה מהשרת. בכניסה הבאה, אם הסימון קיים,
   המקומי נדחף לשרת במקום להימחק על ידו. */
function markDirty(){ try{ localStorage.setItem(LSKEY+"_dirty","1"); }catch(e){} }
function clearDirtyMark(){ try{ localStorage.removeItem(LSKEY+"_dirty"); }catch(e){} }
function hasDirtyMark(){ try{ return localStorage.getItem(LSKEY+"_dirty")==="1"; }catch(e){ return false; } }
function save(){
  /* שער מרכזי: אף כתיבה לא עוברת אצל משתמש ללא הרשאת עריכה.
     מכסה גם נתיבים שנקראים ישירות (קונסולה/קישור) ולא רק כפתורים מוסתרים.
     CU ריק = מסלולי אתחול/כניסה לפני שיש משתמש — מותר. */
  if(CU && !can("edit")){ toast("אין לך הרשאת עריכה","err"); return; }
  try{
    var prev=localStorage.getItem(LSKEY);
    if(prev){ UNDO.push(prev); if(UNDO.length>UNDO_MAX) UNDO.shift(); }
    /* מונה גרסאות: כל שמירה מעלה אותו, והשרת דוחה שמירה עם מונה נמוך
       מהשמור אצלו — כך עותק ישן ממכשיב אחר לא יכול לדרוס עבודה חדשה */
    DB.meta=DB.meta||{version:1}; DB.meta.rev=(Number(DB.meta.rev)||0)+1;
    localStorage.setItem(LSKEY, JSON.stringify(DB));
  }catch(e){ toast("שגיאת שמירה מקומית","err"); }
  markDirty();
  serverSave();   // כל שינוי נשמר גם בגוגל שיטס
}
function undo(){
  if(!UNDO.length){ toast("אין פעולה לביטול","warn"); return; }
  var prev=UNDO.pop();
  try{
    var newRev=(DB&&DB.meta&&Number(DB.meta.rev)||0)+1;   // הביטול הוא גרסה חדשה, לא חזרה למונה ישן
    DB=JSON.parse(prev);
    DB.meta=DB.meta||{version:1}; DB.meta.rev=newRev;
    localStorage.setItem(LSKEY,JSON.stringify(DB));
    markDirty();
    serverSave();                       // מסנכרן את המצב המוחזר גם לשיטס
    closeModal();
    toast("הפעולה בוטלה"+(UNDO.length?" · עוד "+UNDO.length+" לביטול":""),"ok");
    rerender();
  }catch(e){ toast("הביטול נכשל","err"); }
}

document.addEventListener("keydown",function(e){

function blankDB(){
  return {meta:{version:1,rev:0}, partners:[], apartments:[], apartmentPartners:[], managers:[],
    categories:[], expenses:[], expenseSplits:[], expenseManagerFees:[], accounts:[],
    payments:[], deposits:[], income:[], users:[], settings:{sheetsUrl:"", currency:"₪", paymentMethods:{}}};
}
function toNum(v){ var n=Number(v); return isFinite(n)?n:0; }
function toISO(v){ v=String(v==null?"":v).slice(0,10); return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:""; }
function normalizeDB(d){
  d.meta=d.meta||{version:1,rev:0}; if(d.meta.rev==null) d.meta.rev=0;
  d.settings=d.settings||{}; d.settings.paymentMethods=d.settings.paymentMethods||{};
  (d.expenses||[]).forEach(function(e){ e.amount=toNum(e.amount); e.date=toISO(e.date); e.mgmtVatRate=toNum(e.mgmtVatRate); });
  (d.expenseSplits||[]).forEach(function(s){ s.percent=toNum(s.percent); });
  (d.expenseManagerFees||[]).forEach(function(f){ f.pctCurrent=toNum(f.pctCurrent); f.pctDeferred=toNum(f.pctDeferred); });
  (d.apartmentPartners||[]).forEach(function(x){ x.defaultPercent=toNum(x.defaultPercent); });
  (d.managers||[]).forEach(function(m){ m.defaultFeePercent=toNum(m.defaultFeePercent); });
  (d.payments||[]).forEach(function(p){ p.amount=toNum(p.amount); p.date=toISO(p.date);
    if(p.invoiceStatus==null) p.invoiceStatus=p.hasInvoice?"has":"";
    if(p.hidden==null) p.hidden=false; });
  (d.expenses||[]).forEach(function(e){ if(e.hidden==null) e.hidden=false; });
  (d.apartments||[]).forEach(function(a){ (a.splitPresets||[]).forEach(function(p){ (p.rows||[]).forEach(function(r){ r.percent=toNum(r.percent); }); }); });
  (d.deposits||[]).forEach(function(x){ x.amount=toNum(x.amount); x.date=toISO(x.date); });
  (d.income||[]).forEach(function(x){ x.amount=toNum(x.amount); x.date=toISO(x.date);
    (x.split||[]).forEach(function(sp){ sp.percent=toNum(sp.percent); }); });
  (d.apartments||[]).forEach(function(a){ (a.incomeSplit||[]).forEach(function(sp){ sp.percent=toNum(sp.percent); }); });
  /* שלב שיש לו תתי-שלבים הוא מכל: הסכום שלו חייב להיות סך תתי-השלבים.
     נתונים שנוצרו לפני המודל הזה מיושרים כאן, כדי שלא תהיה ספירה כפולה. */
  var kidSum={}, hasKids={};
  (d.expenses||[]).forEach(function(e){
    if(e.deleted || !e.parentId) return;
    hasKids[e.parentId]=1;
    kidSum[e.parentId]=(kidSum[e.parentId]||0)+(Number(e.amount)||0);
  });
  (d.expenses||[]).forEach(function(e){
    if(hasKids[e.id]) e.amount=Math.round((kidSum[e.id]||0)*100)/100;
  });
  return d;
}

function expSplits(eId){ if(IX) return IX.splitByExp[eId]||IX_EMPTY;
  return active(DB.expenseSplits).filter(function(s){return s.expenseId===eId;}); }
function expPayments(eId){ if(IX) return IX.payByExp[eId]||IX_EMPTY;
  return active(DB.payments).filter(function(p){return p.expenseId===eId;}); }
function expMgrFees(eId){ if(IX) return IX.feeByExp[eId]||IX_EMPTY;
  return active(DB.expenseManagerFees).filter(function(f){return f.expenseId===eId;}); }
function partnerName(id){ var p=byId(DB.partners,id); return p?p.name:"—"; }
function managerName(id){ var m=byId(DB.managers,id); return m?m.name:"—"; }
function accountIsBank(accId){ if(!accId) return false; var a=byId(DB.accounts,accId); return !!(a&&a.isBank); }

// תשלומי ספק להוצאה (מה ששולם על ההוצאה עצמה)
function expensePaid(eId){
  if(IX && IX.paid[eId]!==undefined) return IX.paid[eId];
  var v=expensePaidCalc(eId);
  if(IX) IX.paid[eId]=v;
  return v;
}
function expensePaidCalc(eId){
  /* מכל: מה ששולם = סך תתי-השלבים (לתצוגה; בחישובי הכסף המכל אינו נספר) */
  if(isContainer(eId)) return round2(expenseChildren(eId).reduce(function(s,k){ return s+expensePaid(k.id); },0));
  return round2(expPayments(eId).filter(function(p){return p.recipientType!=="manager";})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
}
function expenseRemaining(eId){ var e=byId(DB.expenses,eId); return round2((e?Number(e.amount):0)-expensePaid(eId)); }
function expenseStatus(eId){ var e=byId(DB.expenses,eId); var paid=expensePaid(eId); var amt=e?Number(e.amount):0;
  if(paid<=0) return "unpaid";
  if(paid>amt+0.01) return "over";          // שולם ביתר — חריגה מאושרת
  if(paid>=amt-0.01) return "paid"; return "partial"; }

// דמי ניהול
function mgmtBase(e){ var a=Number(e.amount)||0; if(e.mgmtBaseType==="net17")return a/1.17; if(e.mgmtBaseType==="net18")return a/1.18; return a; }
function mgmtVatFactor(e){ return 1+(Number(e.mgmtVatRate)||0)/100; }
function mgrFeeLiveOnExpense(eId,mId){ // כולל מע"מ, רק חלק פעיל (נוכחי + דחוי ששוחרר)
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  var mg=byId(DB.managers,mId); if(!mg||mg.deleted) return 0;
  var f=expMgrFees(eId).find(function(x){return x.managerId===mId;}); if(!f) return 0;
  var base=mgmtBase(e); var live=(Number(f.pctCurrent)||0)/100 + (f.deferredReleased?(Number(f.pctDeferred)||0)/100:0);
  return round2(base*live*mgmtVatFactor(e));
}
function mgrFeeFullOnExpense(eId,mId){ // כולל מע"מ, נוכחי+דחוי (סופי)
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  var f=expMgrFees(eId).find(function(x){return x.managerId===mId;}); if(!f) return 0;
  var base=mgmtBase(e); var tot=((Number(f.pctCurrent)||0)+(Number(f.pctDeferred)||0))/100;
  return round2(base*tot*mgmtVatFactor(e));
}
function expenseMgmtCostLive(eId){ // סך דמי הניהול הפעילים של ההוצאה (עלות שמתחלקת בין השותפים)
  if(IX && IX.mgmt[eId]!==undefined) return IX.mgmt[eId];
  var v=expenseMgmtCostLiveCalc(eId);
  if(IX) IX.mgmt[eId]=v;
  return v;
}
function expenseMgmtCostLiveCalc(eId){
  if(isContainer(eId)) return round2(expenseChildren(eId).reduce(function(s,k){ return s+expenseMgmtCostLive(k.id); },0));
  var e=byId(DB.expenses,eId); if(!e||!e.mgmtEnabled) return 0;
  return round2(expMgrFees(eId).reduce(function(s,f){return s+mgrFeeLiveOnExpense(eId,f.managerId);},0));
}
function mgrPaidOnExpense(eId,mId){
  return round2(expPayments(eId).filter(function(p){return p.recipientType==="manager"&&p.recipientManagerId===mId;})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
}

/* ---------- תשלום אוטומטי "שווה ערך" על דמי ניהול ----------
   הגדרה ברמת הפרויקט (a.autoMgmt = {partnerId,pct}): אחוז מדמי הניהול
   נרשם אוטומטית כתשלום למנהל ששולם ע"י השותף, באמצעי "שווה ערך".
   דוגמה: דמי ניהול 8,000 והגדרה של 3% → 240 ₪ נרשמים כמשולמים ע"י חיליק.
   הפונקציה אידמפוטנטית: יוצרת/מעדכנת/מסירה את התשלום האוטומטי לפי המצב,
   ונצמדת לתקרה — אוטומטי + ידני לעולם לא יעברו את מה שמגיע למנהל. */
function syncAutoMgmtPayments(eId){
  if(isContainer(eId)) return;   /* מכל: הכסף ודמי הניהול יושבים בתתי-השלבים */
  var e=byId(DB.expenses,eId); if(!e) return;
  var a=byId(DB.apartments,e.apartmentId); if(!a) return;
  var cfg=a.autoMgmt||null;
  var on = !e.deleted && e.mgmtEnabled && a.hasManagement &&
           cfg && cfg.partnerId && (Number(cfg.pct)||0)>0;
  var autos=DB.payments.filter(function(p){ return p.expenseId===eId && p.auto; });
  var handled={};
  if(on){
    expMgrFees(eId).forEach(function(f){
      var mg=byId(DB.managers,f.managerId); if(!mg||mg.deleted) return;
      var live=mgrFeeLiveOnExpense(eId,f.managerId);
      var target=round2(live*(Number(cfg.pct)||0)/100);
      // תשלומים ידניים קודמים — האוטומטי מצטמצם כדי לא לחרוג מהתקרה
      var manual=expPayments(eId).filter(function(p){
        return p.recipientType==="manager"&&p.recipientManagerId===f.managerId&&!p.auto; })
        .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
      if(target>round2(live-manual)) target=round2(live-manual);
      if(target<0) target=0;
      var ex=autos.find(function(p){ return p.recipientManagerId===f.managerId; });
      if(target<=0.009){
        if(ex && !ex.deleted){ ex.deleted=true; ex.deletedBy="autoMgmt"; }
      } else if(ex){
        ex.deleted=false; delete ex.deletedBy;
        ex.amount=target; ex.payerPartnerId=cfg.partnerId; ex.method="equiv";
        ex.note="אוטומטי — שווה ערך ("+num(cfg.pct)+"% מדמי הניהול)";
      } else {
        DB.payments.push({id:uid(),expenseId:eId,date:e.date||todayISO(),amount:target,
          accountId:null,payerPartnerId:cfg.partnerId,method:"equiv",
          recipientType:"manager",recipientManagerId:f.managerId,
          hasInvoice:false,invoiceLink:"",
          note:"אוטומטי — שווה ערך ("+num(cfg.pct)+"% מדמי הניהול)",auto:true,deleted:false});
      }
      handled[f.managerId]=1;
    });
  }
  // אוטומטיים שכבר לא רלוונטיים (ההגדרה כובתה / דמי הניהול בוטלו / מנהל הוסר)
  autos.forEach(function(p){
    if((!on || !handled[p.recipientManagerId]) && !p.deleted){ p.deleted=true; p.deletedBy="autoMgmt"; }
  });
}
function syncAutoMgmtApartment(aptId){
  apLeafExpenses(aptId).forEach(function(e){ syncAutoMgmtPayments(e.id); });
}

// שותף — כמה אמור לשלם (חלקו בהוצאות + חלקו בדמי הניהול, לפי חלוקת ההוצאה)
function partnerPctInExpense(eId,pId){ return expSplits(eId).reduce(function(s,x){ return s+(x.partnerId===pId?(Number(x.percent)||0):0); },0); }
function partnerShouldPay(aptId,pId){
  return round2(apLeafExpenses(aptId).reduce(function(sum,e){
    var pct=partnerPctInExpense(e.id,pId)/100; if(!pct) return sum;
    return sum + pct*(Number(e.amount)||0) + pct*expenseMgmtCostLive(e.id);
  },0));
}
// שותף — כמה שילם בפועל (תשלומים ישירים שלו מחשבון שאינו בנק + הפקדותיו לבנק)
function partnerPaid(aptId,pId){
  var expIds={}; apLeafExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
  var direct=active(DB.payments).filter(function(p){
    return expIds[p.expenseId] && !accountIsBank(p.accountId) && p.payerPartnerId===pId;
  }).reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  var deps=apDeposits(aptId).filter(function(d){return d.partnerId===pId;}).reduce(function(s,d){return s+(Number(d.amount)||0);},0);
  /* הכנסה שנכנסה לבנק הזמני — חלקו של השותף בה נחשב כאילו הפקיד אותו */
  var inc=bankIncomes(aptId).reduce(function(s,i){ return s+(Number(i.amount)||0)*incomePartnerPct(i,pId)/100; },0);
  return round2(direct+deps+inc);
}
function partnerBalance(aptId,pId){ return round2(partnerPaid(aptId,pId)-partnerShouldPay(aptId,pId)); }
// קבוצת השותפים לדוחות = שותפי-הדירה ∪ כל שותף שמופיע בחלוקת הוצאה (שלא ייעלם כסף מהדוח)
function apReportPartnerIds(aptId){
  var set={}, order=[];
  function add(pid){ if(pid && !set[pid]){ set[pid]=1; order.push(pid); } }
  apPartners(aptId).forEach(function(ap){ add(ap.partnerId); });
  var expIdSet={};
  apLeafExpenses(aptId).forEach(function(e){ expIdSet[e.id]=1; expSplits(e.id).forEach(function(s){ add(s.partnerId); }); });
  apDeposits(aptId).forEach(function(d){ add(d.partnerId); });           // מפקידים לבנק
  active(DB.payments).forEach(function(p){ if(expIdSet[p.expenseId] && !accountIsBank(p.accountId)) add(p.payerPartnerId); }); // משלמים ישירים
  return order;
}
function reportPartnerIds(aptId){
  var ids=apReportPartnerIds(aptId);
  if(CU && CU.role==="partner" && CU.partnerId) ids=ids.filter(function(id){return id===CU.partnerId;});
  return ids;
}
function partnerDefaultPct(aptId,pId){ var r=apPartners(aptId).find(function(x){return x.partnerId===pId;}); return r?r.defaultPercent:null; }

// בנק
function bankIncomes(aptId){ return apIncome(aptId).filter(function(i){ return i.receivedBy==="bank"; }); }
function bankBalance(aptId){
  var deps=apDeposits(aptId).reduce(function(s,d){return s+(Number(d.amount)||0);},0);
  /* הכנסה שסומנה "נכנסה לבנק הזמני" מגדילה את היתרה, כמו הפקדה —
     רק בלי שיוך לשותף, כי זה כסף של הפרויקט */
  var inc=bankIncomes(aptId).reduce(function(s,i){return s+(Number(i.amount)||0);},0);
  var expIds={}; apLeafExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
  var out=active(DB.payments).filter(function(p){return expIds[p.expenseId]&&accountIsBank(p.accountId);})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  return round2(deps+inc-out);
}
/* לאן נכנסה ההכנסה — לתצוגה ולייצוא */
function incomeDestName(i){
  if(!i||!i.receivedBy) return "";
  return i.receivedBy==="bank" ? "בנק זמני" : partnerName(i.receivedBy);
}
/* ---------- חלוקת הכנסה בין השותפים ----------
   שרשרת: חלוקה שנקבעה על ההכנסה עצמה ← ברירת המחדל שנקבעה לדירה
   ← אחוזי השותפים הרגילים. הכנסה שנכנסה לבנק הזמני נזקפת לשותפים
   לפי החלוקה הזו — כאילו כל אחד הפקיד את חלקו. */
function apIncomeDefaultSplit(aptId){
  var a=byId(DB.apartments,aptId);
  if(a && a.incomeSplit && a.incomeSplit.length) return a.incomeSplit;
  return apPartners(aptId).map(function(p){ return {partnerId:p.partnerId,percent:Number(p.defaultPercent)||0}; });
}
function incomeSplitOf(i){
  if(i.split && i.split.length) return i.split;
  return apIncomeDefaultSplit(i.apartmentId);
}
function incomePartnerPct(i,pid){
  return incomeSplitOf(i).reduce(function(s,x){ return s+(x.partnerId===pid?(Number(x.percent)||0):0); },0);
}
function incomeSplitLabel(i){
  return incomeSplitOf(i).map(function(x){ return partnerName(x.partnerId)+" "+num(x.percent)+"%"; }).join(" · ");
}
// מנהל — מגיע/קיבל/יתרה
function managerReceivable(aptId,mId){ return round2(apLeafExpenses(aptId).reduce(function(s,e){return s+mgrFeeLiveOnExpense(e.id,mId);},0)); }
/* דחוי שטרם שוחרר = ההפרש בין הסופי לפעיל */
function managerDeferredPending(aptId,mId){
  return round2(apLeafExpenses(aptId).reduce(function(s,e){
    return s + (mgrFeeFullOnExpense(e.id,mId) - mgrFeeLiveOnExpense(e.id,mId)); },0));
}
function managerPaid(aptId,mId){
  var expIds={}; apLeafExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
  return round2(active(DB.payments).filter(function(p){return expIds[p.expenseId]&&p.recipientType==="manager"&&p.recipientManagerId===mId;})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
}
// סיכומי דירה
function apartmentTotals(aptId){
  var exps=apLeafExpenses(aptId);
  var totalExpenses=exps.reduce(function(s,e){return s+(Number(e.amount)||0);},0);
  var totalMgmt=exps.reduce(function(s,e){return s+expenseMgmtCostLive(e.id);},0);
  var totalPaid=exps.reduce(function(s,e){return s+expensePaid(e.id);},0);
  var expIdSet={}; exps.forEach(function(e){expIdSet[e.id]=1;});
  var mgrPaidTot=active(DB.payments).filter(function(p){return expIdSet[p.expenseId]&&p.recipientType==="manager";})
    .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
  var income=apIncome(aptId).reduce(function(s,i){return s+(Number(i.amount)||0);},0);
  return {totalExpenses:round2(totalExpenses),totalMgmt:round2(totalMgmt),totalCost:round2(totalExpenses+totalMgmt),
    totalPaid:round2(totalPaid),mgrPaidTot:round2(mgrPaidTot),paidAll:round2(totalPaid+mgrPaidTot),
    remaining:round2(totalExpenses+totalMgmt-totalPaid-mgrPaidTot),
    income:round2(income),bank:bankBalance(aptId)};
}

/* ============================================================
   הרשאות
   ============================================================ */
function can(action){
  if(!CU) return false;
  if(CU.role==="admin") return true;
  if(CU.role==="editor") return action!=="manageUsers"&&action!=="settings";
  if(CU.role==="viewer"||CU.role==="partner") return action==="view";
  return false;
}
/* "דירות מורשות" חלות על כל תפקיד חוץ ממנהל. קודם הן נאכפו רק על
   תפקיד "שותף", כך שצופה שהוגבל לדירה אחת ראה בפועל את כולן. */
function canSeeApartment(aptId){
  if(!CU) return false;
  if(CU.role==="admin") return true;
  if(!CU.allowedApartments||!CU.allowedApartments.length) return true;   // ריק = כל הדירות
  return CU.allowedApartments.indexOf(aptId)>=0;
}

/* ============================================================
   מודל / טוסט
   ============================================================ */
function toast(msg,type){
  var t=document.createElement("div"); t.className="toast "+(type||""); t.textContent=msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(function(){ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(function(){t.remove();},300); },2600);
}
var _modalOnSave=null;
function openModal(opt){
  _modalOnSave=opt.onSave||null;
  var root=document.getElementById("modal-root");
  root.innerHTML=''+
   '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal '+(opt.wide?"wide":"")+'">'+
     '<div class="modal-header"><h3>'+esc(opt.title||"")+'</h3><button class="x" onclick="closeModal()">&times;</button></div>'+
     '<div class="modal-body">'+(opt.bodyHtml||"")+'</div>'+
     '<div class="modal-footer">'+
       (opt.onSave?'<button class="btn btn-primary" onclick="modalSave()">'+esc(opt.saveLabel||"שמירה")+'</button>':'')+
       '<button class="btn" onclick="closeModal()">'+(opt.onSave?"ביטול":"סגירה")+'</button>'+
     '</div>'+
    '</div></div>';
  setTimeout(function(){ attachTableTools(root); attachExportButtons(root); },0);
}
function closeModal(){
  document.getElementById("modal-root").innerHTML=""; _modalOnSave=null;
  /* עדכון שהגיע בזמן שהמודאל היה פתוח — נטען עכשיו, כשאין מה לדרוס */
  if(typeof POLL!=="undefined" && POLL.pending) setTimeout(function(){ applyServerUpdate(); },200);
}
function modalSave(){ if(_modalOnSave){ var r=_modalOnSave(); if(r!==false) closeModal(); } else closeModal(); }
function val(id){ var el=document.getElementById(id); return el?el.value:""; }
function checked(id){ var el=document.getElementById(id); return el?el.checked:false; }
function confirmDelete(msg,cb){
  openModal({title:"אישור מחיקה",bodyHtml:'<p>'+esc(msg)+'</p><p class="hint">הפריט יעבור לסל המחזור וניתן לשחזר אותו.</p>',
    saveLabel:"העבר לסל מחזור",onSave:function(){ return cb(); }});
}
function softDelete(entity,id,msg){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  /* שלב-אב: תתי-השלבים הם הכסף האמיתי. מוחקים יחד איתו, בתיוג שמאפשר
     שחזור של כל הקבוצה בלחיצה אחת מסל המחזור. */
  var kidCount = (entity==="expenses") ? expenseChildren(id).length : 0;
  if(kidCount) msg=(msg||"למחוק פריט זה?")+" לשלב יש "+kidCount+" תתי-שלבים — הם יימחקו יחד איתו (ניתן לשחזר יחד מסל המחזור).";
  confirmDelete(msg||"למחוק פריט זה?",function(){
    var it=byId(DB[entity],id); if(!it) return;
    it.deleted=true;
    if(entity==="expenses"){
      var tag="expense:"+id;
      expenseChildren(id).forEach(function(k){ k.deleted=true; k.deletedBy=tag; });
      if(it.parentId) syncParentAmount(it.parentId);   // סכום האב נגזר מהתתי-שלבים
    }
    save(); toast("הועבר לסל המחזור","ok"); rerender();
  });
}

function go(view,params){ COLFILT={}; state.view=view; state.params=params||{}; window.scrollTo(0,0); rerender(); }
function currentApartment(){ return byId(DB.apartments, state.params.apartmentId); }
function rerender(){ renderApp(); }

  if(!CU){ renderLogin(); return; }
  var app=document.getElementById("app");
  app.innerHTML = topbarHtml() + navHtml() + '<div class="content" id="content"></div>';

function onApartmentPick(id){ if(id) go("apartment",{apartmentId:id,tab:"overview"}); else go("dashboard",{}); }
function navHtml(){
  var items=[["dashboard","🏠 כל הדירות"],["reports","📊 דוח שותפים כללי"],["mgmt","💼 דוח דמי ניהול"]];
  if(can("settings")) items.push(["settings","⚙️ הגדרות"]);
  if(can("edit")) items.push(["import","📥 ייבוא"]);

  return '<div class="nav">'+items.map(function(it){
    var act=(state.view===it[0])?" active":"";

async function createAdmin(){
  var name=val("lg-name").trim()||"מנהל"; var code=val("lg-code");
  if(!code){ toast("יש להזין קוד","err"); return; }
  var h=await hashCode(code);
  var u={id:uid(),name:name,code:h,role:"admin",allowedApartments:[],partnerId:null,active:true,deleted:false};
  if(!DB){ DB=blankDB(); seedIfEmpty(); }
  DB.users=[u];
  var j=await api({action:"bootstrap",data:DB});
  if(!j||!j.ok){ toast("ההקמה נכשלה"+((j&&j.error)?": "+j.error:""),"err"); return; }
  setAuth(h); CU=u; saveLocal(); setSync("ok");
  toast("ברוך הבא, "+name,"ok"); go("dashboard",{});
}
async function doLogin(){
  var hasUserField=!!document.getElementById("lg-user");
  var name=hasUserField?val("lg-user").trim():"";
  var code=val("lg-code");
  if(hasUserField && !name){ toast("יש להזין שם משתמש","err"); return; }
  if(!code){ toast("יש להזין קוד","err"); return; }
  var h=await hashCode(code);
  var j=await api({action:"login",codeHash:h});
  if(!j||!j.ok){ toast((j&&j.error==="network")?"אין חיבור לשרת":"שם המשתמש או קוד הכניסה שגויים","err"); return; }
  /* הקוד הוא המפתח בשרת; השם חייב להתאים למשתמש שהקוד שייך לו.
     ההתאמה סלחנית לרווחים (normKey) אבל לא לשם אחר. */
  if(name && j.user && normKey(String(j.user.name))!==normKey(name)){
    toast("שם המשתמש אינו תואם לקוד","err"); return;
  }
  setAuth(h); CU=j.user;
  var rec=await reconcileAfterAuth();
  if(rec===null){
    setAuth(""); CU=null;
    toast("לא הצלחתי לטעון את הנתונים מהשרת — נסה שוב בעוד רגע","err");
    return;
  }
  if(rec===false){ toast("האימות נכשל — נסה שוב","err"); return; }
  toast("ברוך הבא, "+CU.name,"ok"); go("dashboard",{});
}
function logout(){
  if(SAVEQ.timer){ clearTimeout(SAVEQ.timer); SAVEQ.timer=null; }
  if(hasUnsaved()){
    /* שולחים ניסיון אחרון עם ההרשאה הנוכחית לפני שהיא נמחקת.
       אם ייכשל — הסימון המקומי נשאר והכניסה הבאה תדחף את המקומי. */
    var h=getAuth();
    if(h){
      try{
        fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
          body:JSON.stringify({action:"save",codeHash:h,data:DB})})
          .then(function(r){return r.json();})
          .then(function(res){ if(res&&res.ok) clearDirtyMark(); }).catch(function(){});
      }catch(e){}
    }
  }
  SAVEQ.dirty=false; SAVEQ.inflight=false; SAVEQ.fails=0;
  /* מנקים את המטמון מהדיסק — כך שמי שניגש למחשב אחרי יציאה לא רואה
     שום נתון (וגם לא שרד hash של קוד כניסה). */
  try{ localStorage.removeItem(LSKEY); localStorage.removeItem(LSKEY+"_dirty"); localStorage.removeItem(LSKEY+"_stash"); }catch(e){}
  DB=blankDB(); UNDO.length=0;
  setAuth(""); CU=null; renderApp();
}
/* ---------- שחזור קוד כניסה במייל (דרך Apps Script) ---------- */
async function forgotCode(){
  /* הקוד נשלח למייל של המשתמש הספציפי — לכן חייבים לדעת מי מבקש */
  var name=(document.getElementById("lg-user")?val("lg-user").trim():"");
  if(!name){
    toast("הזן קודם את שם המשתמש למעלה — קוד השחזור יישלח למייל שמשויך לו","err");
    var el=document.getElementById("lg-user"); if(el) el.focus();
    return;
  }
  toast("שולח קוד שחזור למייל…","ok");
  var j=await api("action=requestReset&user="+encodeURIComponent(name));
  if(!j||!j.ok){
    var m={"user-not-found":"לא נמצא משתמש פעיל בשם הזה",
           "no-email":"למשתמש הזה לא משויך מייל — בקש מהמנהל לקבוע לך קוד חדש (הגדרות ← משתמשים)"};
    toast(m[j&&j.error]||("שליחת הקוד נכשלה"+((j&&j.error)?": "+j.error:"")),"err");
    return;
  }
  openResetCodeModal(j.sentTo||"");
}
function openResetCodeModal(sentTo){
  openModal({title:"שחזור קוד כניסה",bodyHtml:
    '<p class="muted">נשלח קוד בן 6 ספרות למייל'+(sentTo?" "+esc(sentTo):"")+'. הקוד תקף ל-15 דקות ולשימוש חד-פעמי.</p>'+
    '<div class="field"><label>הקוד מהמייל</label><input id="rs-code" inputmode="numeric" placeholder="6 ספרות"></div>'+
    '<div class="field"><label>קוד כניסה חדש</label><input id="rs-new" type="password" placeholder="בחר קוד חדש"></div>',

async function doResetCode(){
  var code=val("rs-code").trim(), nw=val("rs-new");
  if(!code||!nw){ toast("יש למלא את שני השדות","err"); return; }
  var v=await api("action=verifyReset&code="+encodeURIComponent(code));
  if(!v||!v.ok){
    var m={"bad-code":"קוד שגוי","expired":"הקוד פג תוקף — בקש קוד חדש","no-request":"לא נמצאה בקשת שחזור"};
    toast(m[v&&v.error]||"האימות נכשל","err"); return;
  }
  var h=await hashCode(nw);
  var s=await api({action:"setCode",resetToken:v.resetToken,codeHash:h});
  if(!s||!s.ok){
    toast(s&&s.error==="code-taken"
      ?"הקוד החדש כבר שייך למשתמש אחר — בחר קוד אחר"
      :"קביעת הקוד נכשלה"+((s&&s.error)?": "+s.error:""),"err");
    return;
  }
  closeModal(); setAuth(h);
  var j=await api({action:"login",codeHash:h});
  if(j&&j.ok){
    CU=j.user;
    await reconcileAfterAuth();
    toast("הקוד עודכן — ברוך הבא","ok"); go("dashboard",{});
  }else{
    setAuth(""); toast("הקוד עודכן — היכנס עם הקוד החדש","ok"); renderApp();
  }
}

  var G={cost:0,paid:0,rem:0,income:0,bank:0,mgmt:0,mgmtPaid:0,stages:0};
  var perApt=[];

    var t=apartmentTotals(a.id);

    G.bank+=(a.hasBank?t.bank:0); G.mgmt+=t.totalMgmt; G.mgmtPaid+=t.mgrPaidTot;

  });
  h+='<div class="section-title" style="margin-top:22px">סיכום כל הפרויקטים</div>'+
    '<div class="stat-grid">'+
    stat("סה\"כ עלות בכל הפרויקטים",money(G.cost))+
    stat("שולם בפועל",money(G.paid),"pos")+
    stat("נותר לתשלום",money(G.rem),G.rem>0.01?"neg":"pos")+
    stat("פרויקטים",num(all.length))+
    stat("שלבים",num(G.stages))+
    (G.mgmt>0.01?stat("דמי ניהול",money(G.mgmt)):"")+
    '</div>';
  h+='<div class="card"><h3>📊 התקדמות כוללת</h3>'+progressBar(G.paid,G.cost,"מתוך העלות הכוללת של כל הפרויקטים")+'</div>';

  var top=perApt.filter(function(r){return r.t.totalCost>0.01;})
    .sort(function(x,y){return y.t.totalCost-x.t.totalCost;}).slice(0,8);
  if(top.length){
    h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">'+
      '<div class="card"><h3>🏢 הפרויקטים הגדולים</h3>'+
        barChart(top.map(function(r,i){
          return {label:r.a.name,value:r.t.totalCost,color:chartColor(i),

        }))+'</div>'+
      '<div class="card"><h3>⚠️ החוב הגדול ביותר</h3>'+
        barChart(perApt.filter(function(r){return r.t.remaining>0.01;})
          .sort(function(x,y){return y.t.remaining-x.t.remaining;}).slice(0,8)
          .map(function(r){ return {label:r.a.name,value:r.t.remaining,color:"#ef4444"}; }))+'</div>'+

function aptGridHtml(){
  var all=active(DB.apartments).filter(function(a){return canSeeApartment(a.id);});
  var apts=all.filter(function(a){ return matches(Q.apts,a.name+" "+(a.notes||"")); });
  var cnt=document.getElementById("apt-count");
  if(cnt) cnt.innerHTML=countLine(apts.length,all.length,"דירות");
  if(!apts.length) return '<div class="empty">לא נמצאה דירה שמתאימה ל"'+esc(Q.apts)+'"</div>';

  // חישוב פעם אחת לכל דירה — משמש גם למיון וגם לתצוגה
  var rows=apts.map(function(a){ return {a:a, t:apartmentTotals(a.id)}; });
  var dir=APT_SORT.dir;
  rows.sort(function(x,y){
    var r;
    switch(APT_SORT.by){
      case "cost":   r=x.t.totalCost-y.t.totalCost; break;
      case "paid":   r=x.t.paidAll-y.t.paidAll; break;
      case "rem":    r=x.t.remaining-y.t.remaining; break;
      case "income": r=x.t.income-y.t.income; break;
      case "bank":   r=x.t.bank-y.t.bank; break;
      case "mgmt":     r=x.t.totalMgmt-y.t.totalMgmt; break;
      case "mgmtPaid": r=x.t.mgrPaidTot-y.t.mgrPaidTot; break;
      case "mgmtRem":  r=(x.t.totalMgmt-x.t.mgrPaidTot)-(y.t.totalMgmt-y.t.mgrPaidTot); break;
      case "stages": r=apExpenses(x.a.id).length-apExpenses(y.a.id).length; break;
      default:       r=String(x.a.name).localeCompare(String(y.a.name),"he");
    }
    return dir==="asc"? r : -r;
  });

  function th(key,label,alignLeft){
    var on=APT_SORT.by===key;
    return '<th style="cursor:pointer;white-space:nowrap'+(alignLeft?';text-align:left':'')+'" onclick="sortApts(\''+key+'\')">'+
      esc(label)+(on?'<span style="color:var(--brand)"> '+(dir==="asc"?"▲":"▼")+'</span>':'')+'</th>';
  }
  var tot={cost:0,paid:0,rem:0,income:0,bank:0,stages:0,mgmt:0,mgmtPaid:0,mgmtRem:0};
  var anyMgmt=rows.some(function(r){ return r.a.hasManagement; });
  var h='<div class="table-wrap"><table class="tbl"><thead><tr>'+
    th("name","שם הדירה / פרויקט")+
    th("stages","שלבים")+
    th("cost","עלות כוללת")+
    th("paid","שולם")+
    th("rem","נותר")+
    (anyMgmt?
      '<th style="background:#eef2ff">'+th("mgmt","דמי ניהול").replace(/^<th[^>]*>/,"").replace(/<\/th>$/,"")+'</th>'
      :'')+
    (anyMgmt?'<th style="background:#eef2ff;cursor:pointer;white-space:nowrap" onclick="sortApts(\'mgmtPaid\')">ניהול ששולם'+
      (APT_SORT.by==="mgmtPaid"?'<span style="color:var(--brand)"> '+(dir==="asc"?"▲":"▼")+'</span>':'')+'</th>':'')+
    (anyMgmt?'<th style="background:#eef2ff;cursor:pointer;white-space:nowrap" onclick="sortApts(\'mgmtRem\')">ניהול לתשלום'+
      (APT_SORT.by==="mgmtRem"?'<span style="color:var(--brand)"> '+(dir==="asc"?"▲":"▼")+'</span>':'')+'</th>':'')+
    th("income","הכנסות")+
    th("bank","יתרת בנק")+
    '<th style="white-space:nowrap">בנק</th><th style="white-space:nowrap">ניהול</th>'+
    '<th></th></tr></thead><tbody>';
  rows.forEach(function(r){
    var a=r.a, t=r.t, n=apExpenses(a.id).length;
    var mRem=round2(t.totalMgmt-t.mgrPaidTot);
    tot.cost+=t.totalCost; tot.paid+=t.paidAll; tot.rem+=t.remaining;
    tot.income+=t.income; tot.bank+=(a.hasBank?t.bank:0); tot.stages+=n;
    tot.mgmt+=t.totalMgmt; tot.mgmtPaid+=t.mgrPaidTot; tot.mgmtRem+=mRem;
    h+='<tr style="cursor:pointer" onclick="go(\'apartment\',{apartmentId:\''+a.id+'\',tab:\'overview\'})">'+
      '<td><b>'+esc(a.name)+'</b>'+
        (a.hasManagement?' <span class="pill">ניהול</span>':'')+
        (a.hasBank?' <span class="pill">בנק</span>':'')+
        (a.notes?'<div class="muted" data-xl-skip="1" style="font-size:12px">'+esc(a.notes)+'</div>':'')+'</td>'+
      '<td>'+n+'</td>'+
      '<td>'+money(t.totalCost)+'</td>'+
      '<td>'+money(t.paidAll)+'</td>'+
      '<td class="'+(t.remaining>0.01?"neg":"pos")+'">'+money(t.remaining)+'</td>'+
      (anyMgmt?'<td style="background:#f7f9ff">'+(a.hasManagement&&t.totalMgmt?money(t.totalMgmt):'<span class="muted">—</span>')+'</td>':'')+
      (anyMgmt?'<td style="background:#f7f9ff">'+(a.hasManagement&&t.mgrPaidTot?money(t.mgrPaidTot):'<span class="muted">—</span>')+'</td>':'')+
      (anyMgmt?'<td style="background:#f7f9ff" class="'+(mRem>0.01?"neg":"pos")+'">'+
        (a.hasManagement&&(t.totalMgmt||t.mgrPaidTot)?money(mRem):'<span class="muted">—</span>')+'</td>':'')+
      '<td>'+(t.income?money(t.income):'<span class="muted">—</span>')+'</td>'+
      '<td>'+(a.hasBank?money(t.bank):'<span class="muted">—</span>')+'</td>'+
      '<td class="center" onclick="event.stopPropagation()">'+
        (can("edit")?'<input type="checkbox" style="width:auto;cursor:pointer" '+(a.hasBank?"checked":"")+
          ' onchange="toggleAptFlag(\''+a.id+'\',\'hasBank\',this.checked)" title="בנק זמני">'
          :(a.hasBank?"✔️":"—"))+'</td>'+
      '<td class="center" onclick="event.stopPropagation()">'+
        (can("edit")?'<input type="checkbox" style="width:auto;cursor:pointer" '+(a.hasManagement?"checked":"")+
          ' onchange="toggleAptFlag(\''+a.id+'\',\'hasManagement\',this.checked)" title="דמי ניהול">'
          :(a.hasManagement?"✔️":"—"))+'</td>'+
      '<td class="right" style="white-space:nowrap" onclick="event.stopPropagation()">'+
        '<button class="btn btn-ghost btn-sm" onclick="go(\'apartment\',{apartmentId:\''+a.id+'\',tab:\'expenses\'})" title="הוצאות">📋</button>'+
        (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="editApartment(\''+a.id+'\')" title="עריכה">✏️</button>':'')+
      '</td></tr>';
  });
  h+='</tbody><tfoot><tr><td>סה"כ '+rows.length+' דירות</td><td>'+tot.stages+'</td>'+
    '<td>'+money(tot.cost)+'</td><td>'+money(tot.paid)+'</td>'+
    '<td class="'+(tot.rem>0.01?"neg":"pos")+'">'+money(tot.rem)+'</td>'+
    (anyMgmt?'<td style="background:#eef2ff">'+money(tot.mgmt)+'</td>':'')+
    (anyMgmt?'<td style="background:#eef2ff">'+money(tot.mgmtPaid)+'</td>':'')+
    (anyMgmt?'<td style="background:#eef2ff" class="'+(tot.mgmtRem>0.01?"neg":"pos")+'">'+money(tot.mgmtRem)+'</td>':'')+
    '<td>'+money(tot.income)+'</td><td>'+money(tot.bank)+'</td><td colspan="3"></td></tr></tfoot></table></div>';
  return h;
}
/* מתג מהיר מתוך הרשימה — בלי להיכנס לעריכת הדירה */
function toggleAptFlag(aptId,flag,val){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var a=byId(DB.apartments,aptId); if(!a) return;
  if(!val && flag==="hasBank"){
    var deps=apDeposits(aptId).length;
    var expIds={}; apLeafExpenses(aptId).forEach(function(e){expIds[e.id]=1;});
    var bankPays=active(DB.payments).filter(function(p){return expIds[p.expenseId]&&accountIsBank(p.accountId);}).length;
    if(deps||bankPays){
      if(!confirm('בדירה "'+a.name+'" יש '+deps+' הפקדות ו-'+bankPays+' תשלומים מהבנק.\n\n'+
        'כיבוי הבנק רק מסתיר את הלשונית — הנתונים נשמרים ויחזרו אם תדליק שוב.\n\nלכבות?')) { rerender(); return; }
    }
  }
  a[flag]=!!val; save();
  toast('"'+a.name+'" — '+(flag==="hasBank"?"בנק":"דמי ניהול")+(val?" הופעל":" כובה"),"ok");
  renderAptGrid();
}
/* פעולה מרוכזת על כל הדירות המוצגות (מכבד את החיפוש) */
function bulkAptFlags(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var shown=active(DB.apartments).filter(function(a){return canSeeApartment(a.id);})
    .filter(function(a){ return matches(Q.apts,a.name+" "+(a.notes||"")); });
  if(!shown.length){ toast("אין דירות מוצגות","warn"); return; }
  var withBank=shown.filter(function(a){return a.hasBank;}).length;
  var withMgmt=shown.filter(function(a){return a.hasManagement;}).length;
  openModal({title:"הפעלה/כיבוי מרוכז",bodyHtml:
    '<p class="muted">הפעולה תחול על <b>'+shown.length+' הדירות המוצגות</b> כרגע'+
    (Q.apts?' (לפי החיפוש "'+esc(Q.apts)+'")':'')+'.</p>'+
    '<div class="stat-grid" style="margin-bottom:14px">'+
      stat("עם בנק",withBank+" / "+shown.length)+
      stat("עם דמי ניהול",withMgmt+" / "+shown.length)+
    '</div>'+
    '<div class="section-title">בנק זמני</div>'+
    '<div class="toolbar">'+
      '<button class="btn btn-sm" onclick="applyBulkFlag(\'hasBank\',true)">✅ הפעל בכולן</button>'+
      '<button class="btn btn-danger btn-sm" onclick="applyBulkFlag(\'hasBank\',false)">🚫 כבה בכולן</button></div>'+
    '<div class="section-title">דמי ניהול</div>'+
    '<div class="toolbar">'+
      '<button class="btn btn-sm" onclick="applyBulkFlag(\'hasManagement\',true)">✅ הפעל בכולן</button>'+
      '<button class="btn btn-danger btn-sm" onclick="applyBulkFlag(\'hasManagement\',false)">🚫 כבה בכולן</button></div>'+
    '<div class="hint">כיבוי רק מסתיר את הלשונית ומוציא מהחישוב — שום נתון לא נמחק, והכל חוזר בהדלקה מחדש.</div>'});
}
function applyBulkFlag(flag,val){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var shown=active(DB.apartments).filter(function(a){return canSeeApartment(a.id);})
    .filter(function(a){ return matches(Q.apts,a.name+" "+(a.notes||"")); });
  var changed=shown.filter(function(a){ return !!a[flag]!==!!val; });
  if(!changed.length){ toast("כל הדירות המוצגות כבר במצב הזה","warn"); return; }
  var what=(flag==="hasBank"?"בנק":"דמי ניהול");
  if(!confirm((val?"להפעיל ":"לכבות ")+what+" ב-"+changed.length+" דירות?\n\nשום נתון לא נמחק — אפשר להחזיר בכל רגע (וגם Ctrl+Z).")) return;
  changed.forEach(function(a){ a[flag]=!!val; });
  save(); closeModal();
  toast(what+(val?" הופעל":" כובה")+" ב-"+changed.length+" דירות","ok");
  rerender();
}

function editApartment(id){

    '<div class="field"><label>שם / כתובת</label><input id="ap-name" value="'+esc(a.name)+'"></div>'+
    '<div class="field"><label>הערות</label><textarea id="ap-notes" rows="2">'+esc(a.notes||"")+'</textarea></div>'+
    '<div class="field"><label><input type="checkbox" id="ap-mgmt" '+(a.hasManagement?"checked":"")+' style="width:auto"> יש דמי ניהול בדירה זו</label></div>'+
    '<div class="field"><label><input type="checkbox" id="ap-bank" '+(a.hasBank?"checked":"")+' style="width:auto"> יש בנק זמני (קופה משותפת)</label></div>',

  var tab=state.params.tab||"overview";
  var tabs=[["overview","סקירה"],["expenses","הוצאות / שלבים"],["payments","תשלומים"],["partners","שותפים"]];
  tabs.push(["managers","דמי ניהול"]);   // תמיד נגיש — בפנים אפשר להפעיל
  if(a.hasBank) tabs.push(["bank","בנק זמני"]);
  tabs.push(["income","הכנסות"]);
  tabs.push(["reports","דוחות"]);
  var h='<div class="toolbar"><h2 style="margin:0">🏢 '+esc(a.name)+'</h2>'+
    (can("edit")?'<button class="btn btn-sm" onclick="editApartment(\''+a.id+'\')">✏️ עריכת דירה</button>':'')+
    '<div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-danger btn-sm" onclick="delApartment(\''+a.id+'\')">🗑️ מחק דירה + תנועות</button>':'')+'</div>';
  h+='<div class="tabs">'+tabs.map(function(t){ return '<div class="tab'+(tab===t[0]?" active":"")+'" onclick="go(\'apartment\',{apartmentId:\''+a.id+'\',tab:\''+t[0]+'\'})">'+t[1]+'</div>'; }).join("")+'</div>';
  h+='<div id="apt-body"></div>';

  var body=document.getElementById("apt-body");
  switch(tab){
    case "overview": body.innerHTML=viewApartmentOverview(a.id); break;

    case "income": body.innerHTML=viewIncome(a.id); break;
    case "reports": body.innerHTML=viewApartmentReports(a.id); break;

}
function viewApartmentOverview(aptId){
  var a=byId(DB.apartments,aptId); var t=apartmentTotals(aptId);
  var h='<div class="stat-grid">'+
    stat("עלות כוללת",money(t.totalCost))+
    stat("שולם בפועל",money(t.paidAll))+
    stat("נותר לתשלום",money(t.remaining),t.remaining>0?"neg":"pos")+
    stat("סה\"כ הכנסות",money(t.income))+
    (a.hasManagement?stat("דמי ניהול (פעיל)",money(t.totalMgmt)):"")+
    (a.hasBank?stat("יתרת בנק צפויה",money(t.bank)):"")+
    '</div>';

  /* ===== התקדמות התשלום ===== */
  h+='<div class="card"><h3>📊 התקדמות התשלום</h3>'+
    progressBar(t.paidAll,t.totalCost,"מתוך העלות הכוללת")+
    '<div class="stat-grid" style="margin:0">'+
      stat("שולם",money(t.paidAll),"pos")+
      stat("נותר",money(t.remaining),t.remaining>0.01?"neg":"pos")+
      (a.hasManagement?stat("מזה דמי ניהול",money(t.totalMgmt)):"")+
    '</div></div>';

  /* ===== סטטוס שלבים + פילוח סיווג ===== */
  var exps=apLeafExpenses(aptId);
  if(exps.length){
    var byStatus={paid:0,partial:0,unpaid:0,over:0};
    exps.forEach(function(e){ byStatus[expenseStatus(e.id)]+=Number(e.amount)||0; });
    var statusData=[
      {label:"שולם במלואו",value:byStatus.paid,color:"#10b981"},
      {label:"שולם חלקית",value:byStatus.partial,color:"#f59e0b"},
      {label:"לא שולם",value:byStatus.unpaid,color:"#ef4444"},
      {label:"שולם ביתר",value:byStatus.over,color:"#8b5cf6"}
    ].filter(function(d){return d.value>0.01;});
    var byCls={};
    exps.forEach(function(e){ var k=CLASSIFICATIONS[e.classification]||"אחר";
      byCls[k]=(byCls[k]||0)+(Number(e.amount)||0); });
    var clsData=Object.keys(byCls).map(function(k,i){ return {label:k,value:byCls[k],color:chartColor(i+1)}; })
      .sort(function(x,y){return y.value-x.value;});

    h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">'+
      '<div class="card"><h3>סטטוס השלבים</h3>'+donutChart(statusData,180)+'</div>'+
      '<div class="card"><h3>פילוח לפי סיווג</h3>'+donutChart(clsData,180)+'</div>'+
    '</div>';

    /* ===== 10 השלבים הגדולים ===== */
    var top=exps.slice().sort(function(x,y){return (y.amount||0)-(x.amount||0);}).slice(0,10)
      .map(function(e){
        var paid=expensePaid(e.id), rem=expenseRemaining(e.id);
        return {label:e.description, value:Number(e.amount)||0,
          color:rem<=0.01?"#10b981":(paid>0.01?"#f59e0b":"#94a3b8"),
          sub:"שולם "+money(paid)+" · נותר "+money(rem)};
      });
    h+='<div class="card"><h3>🏆 השלבים הגדולים ביותר</h3>'+barChart(top)+
      '<div class="hint">🟢 שולם · 🟡 חלקי · ⚪ טרם שולם</div></div>';

    /* ===== קצב התשלומים לפי חודש ===== */
    var pays=apAllPayments(aptId);
    if(pays.length>1){
      var byMonth={};
      pays.forEach(function(p){ var m=String(p.date||"").slice(0,7); if(!m) return;
        byMonth[m]=(byMonth[m]||0)+(Number(p.amount)||0); });
      var months=Object.keys(byMonth).sort().map(function(m){
        var pp=m.split("-");
        return {label:pp[1]+"/"+pp[0].slice(2), value:byMonth[m]};
      });
      if(months.length>1){
        h+='<div class="card"><h3>📈 קצב התשלומים לאורך זמן</h3>'+lineChart(months)+
          '<div class="hint">סך התשלומים שנרשמו בכל חודש</div></div>';
      }

  }

  /* ===== השוואת שותפים ===== */
  var pRows=reportPartnerIds(aptId).map(function(pid){
    return {label:partnerName(pid), a:partnerShouldPay(aptId,pid), b:partnerPaid(aptId,pid)};
  }).filter(function(r){ return r.a>0.01||r.b>0.01; });
  if(pRows.length){
    h+='<div class="card"><h3>👥 שותפים — אמור לשלם מול שילם</h3>'+groupedBars(pRows)+'</div>';
  }

  // כרטיסי שותפים
  h+='<div class="card"><h3>שותפים — לתשלום / שולם / יתרה</h3><div class="table-wrap"><table class="tbl"><thead><tr>'+
     '<th>שותף</th><th>% ברירת מחדל</th><th>אמור לשלם</th><th>שילם</th><th>יתרה</th></tr></thead><tbody>';
  reportPartnerIds(aptId).forEach(function(pid){
    var should=partnerShouldPay(aptId,pid), paid=partnerPaid(aptId,pid), bal=paid-should;
    var dp=partnerDefaultPct(aptId,pid);
    h+='<tr><td>'+esc(partnerName(pid))+'</td><td>'+(dp==null?"—":num(dp)+"%")+'</td>'+
      '<td>'+money(should)+'</td><td>'+money(paid)+'</td>'+
      '<td class="'+(bal<0?"neg":"pos")+'">'+money(bal)+(bal<0?" (חייב)":bal>0?" (זכאי)":"")+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}
function stat(label,value,cls){ return '<div class="stat"><div class="label">'+esc(label)+'</div><div class="value '+(cls||"")+'">'+value+'</div></div>'; }

/* ============================================================
   תרשימים — SVG מוטמע, בלי ספריות חיצוניות (עובד גם מאחורי סינון)
   ============================================================ */
var CHART_COLORS=["#4f46e5","#06b6d4","#f59e0b","#10b981","#ec4899","#8b5cf6","#ef4444","#14b8a6","#f97316","#6366f1"];
function chartColor(i){ return CHART_COLORS[i%CHART_COLORS.length]; }

/* מד התקדמות אופקי */
function progressBar(paid,total,label){
  var pct=total>0?Math.min(100,Math.max(0,paid/total*100)):0;
  var over=paid>total+0.01;
  return '<div style="margin-bottom:14px">'+
    '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">'+
      '<span class="muted">'+esc(label||"")+'</span>'+
      '<span style="font-weight:700">'+money(paid)+' <span class="muted">מתוך '+money(total)+'</span> · '+
        '<span style="color:'+(over?"#dc2626":"#4f46e5")+'">'+num(Math.round(pct))+'%</span></span>'+
    '</div>'+
    '<div style="height:11px;background:#eceffb;border-radius:99px;overflow:hidden">'+
      '<div style="height:100%;width:'+pct+'%;border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1);'+
        'background:'+(over?"linear-gradient(90deg,#f87171,#dc2626)":"linear-gradient(90deg,#4f46e5,#06b6d4)")+'"></div>'+
    '</div></div>';
}

/* תרשים טבעת (donut) */
function donutChart(data,size){
  size=size||190;
  var total=data.reduce(function(s,d){return s+(Number(d.value)||0);},0);
  if(total<=0) return '<div class="empty" style="padding:26px">אין נתונים להצגה</div>';
  var r=size/2-14, cx=size/2, cy=size/2, circ=2*Math.PI*r, off=0;
  var rings=data.map(function(d,i){
    var frac=(Number(d.value)||0)/total, len=circ*frac;
    var el='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(d.color||chartColor(i))+'" '+
      'stroke-width="20" stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-off)+'" '+
      'transform="rotate(-90 '+cx+' '+cy+')" style="transition:stroke-dasharray .6s"><title>'+
      esc(d.label)+': '+money(d.value)+'</title></circle>';
    off+=len; return el;
  }).join("");
  var legend=data.map(function(d,i){
    var pct=total>0?((Number(d.value)||0)/total*100):0;
    return '<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px">'+
      '<span style="width:11px;height:11px;border-radius:3px;background:'+(d.color||chartColor(i))+';flex:none"></span>'+
      '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.label)+'</span>'+
      '<b style="font-variant-numeric:tabular-nums">'+money(d.value)+'</b>'+
      '<span class="muted" style="width:44px;text-align:left">'+num(Math.round(pct))+'%</span></div>';
  }).join("");
  return '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">'+
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="flex:none">'+rings+
      '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="11" fill="#64748b">סה"כ</text>'+
      '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="15" font-weight="800" fill="#1e293b">'+money(total)+'</text>'+
    '</svg>'+
    '<div style="flex:1;min-width:210px">'+legend+'</div></div>';
}

/* תרשים עמודות אופקי */
function barChart(data,opt){
  opt=opt||{};
  if(!data.length) return '<div class="empty" style="padding:26px">אין נתונים להצגה</div>';
  var max=Math.max.apply(null,data.map(function(d){return Math.abs(Number(d.value)||0);}));
  if(max<=0) max=1;
  return '<div>'+data.map(function(d,i){
    var v=Number(d.value)||0, w=Math.abs(v)/max*100;
    var col=d.color||chartColor(i);
    return '<div style="margin-bottom:11px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">'+
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%">'+esc(d.label)+'</span>'+
        '<b style="font-variant-numeric:tabular-nums'+(v<0?';color:#dc2626':'')+'">'+money(v)+'</b></div>'+
      '<div style="height:9px;background:#eceffb;border-radius:99px;overflow:hidden">'+
        '<div style="height:100%;width:'+w+'%;border-radius:99px;background:'+col+';transition:width .5s"></div>'+
      '</div>'+
      (d.sub?'<div class="hint" style="margin-top:2px">'+esc(d.sub)+'</div>':'')+
    '</div>';
  }).join("")+'</div>';
}

/* עמודות מקובצות: אמור לשלם מול שילם */
function groupedBars(rows){
  if(!rows.length) return '<div class="empty" style="padding:26px">אין נתונים להצגה</div>';
  var max=Math.max.apply(null,rows.map(function(r){return Math.max(r.a||0,r.b||0);}));
  if(max<=0) max=1;
  return '<div>'+rows.map(function(r){
    return '<div style="margin-bottom:14px">'+
      '<div style="font-size:12.5px;font-weight:600;margin-bottom:5px">'+esc(r.label)+'</div>'+
      '<div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">'+
        '<span class="muted" style="width:66px;font-size:11.5px">אמור לשלם</span>'+
        '<div style="flex:1;height:9px;background:#eceffb;border-radius:99px;overflow:hidden">'+
          '<div style="height:100%;width:'+((r.a||0)/max*100)+'%;background:#4f46e5;border-radius:99px"></div></div>'+
        '<b style="width:92px;text-align:left;font-size:12px;font-variant-numeric:tabular-nums">'+money(r.a)+'</b></div>'+
      '<div style="display:flex;align-items:center;gap:7px">'+
        '<span class="muted" style="width:66px;font-size:11.5px">שילם</span>'+
        '<div style="flex:1;height:9px;background:#eceffb;border-radius:99px;overflow:hidden">'+
          '<div style="height:100%;width:'+((r.b||0)/max*100)+'%;background:#10b981;border-radius:99px"></div></div>'+
        '<b style="width:92px;text-align:left;font-size:12px;font-variant-numeric:tabular-nums">'+money(r.b)+'</b></div>'+
      '<div style="text-align:left;font-size:12px;margin-top:3px">יתרה: <b class="'+((r.b-r.a)<0?"neg":"pos")+'">'+money(r.b-r.a)+'</b></div>'+
    '</div>';
  }).join("")+'</div>';
}

/* גרף קו/שטח לפי חודשים */
function lineChart(points,opt){
  opt=opt||{};
  if(points.length<2) return '<div class="empty" style="padding:26px">צריך לפחות שני חודשים עם נתונים</div>';
  var W=640,H=190,pad=34;
  var max=Math.max.apply(null,points.map(function(p){return p.value;}));
  if(max<=0) max=1;
  var stepX=(W-pad*2)/(points.length-1);
  var xy=points.map(function(p,i){
    return {x:pad+i*stepX, y:H-pad-(p.value/max)*(H-pad*2), p:p};
  });
  var line=xy.map(function(c,i){ return (i?"L":"M")+c.x.toFixed(1)+" "+c.y.toFixed(1); }).join(" ");
  var area=line+" L"+xy[xy.length-1].x.toFixed(1)+" "+(H-pad)+" L"+xy[0].x.toFixed(1)+" "+(H-pad)+" Z";
  var dots=xy.map(function(c){
    return '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="3.5" fill="#fff" stroke="#4f46e5" stroke-width="2.5">'+
      '<title>'+esc(c.p.label)+': '+money(c.p.value)+'</title></circle>';
  }).join("");
  var labels=xy.map(function(c,i){
    if(points.length>8 && i%Math.ceil(points.length/8)!==0) return "";
    return '<text x="'+c.x.toFixed(1)+'" y="'+(H-pad+16)+'" text-anchor="middle" font-size="10" fill="#94a3b8">'+esc(c.p.label)+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
    '<defs><linearGradient id="lcg" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#4f46e5" stop-opacity=".28"/>'+
      '<stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/></linearGradient></defs>'+
    '<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#e2e8f0"/>'+
    '<line x1="'+pad+'" y1="'+pad+'" x2="'+(W-pad)+'" y2="'+pad+'" stroke="#f1f5f9" stroke-dasharray="3 4"/>'+
    '<text x="'+(pad-6)+'" y="'+(pad+4)+'" text-anchor="end" font-size="10" fill="#94a3b8">'+money(max)+'</text>'+
    '<path d="'+area+'" fill="url(#lcg)"/>'+
    '<path d="'+line+'" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+labels+'</svg>';
}
