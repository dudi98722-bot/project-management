/* ---- סנכרון גוגל שיטס (best-effort) ---- */
function pushToSheets(){ serverSave(); }
async function pullFromSheets(){
  if(!sheetsUrl()){ toast("לא הוגדר קישור לשיט","err"); return; }
  if(SAVEQ.inflight){ toast("שמירה לשרת בעיצומה — המתן רגע ונסה שוב","warn"); return; }
  if(hasUnsaved()||hasDirtyMark()){
    if(!confirm("יש שינויים מקומיים שטרם נשמרו לשרת.\n\nטעינה מהשיט תדרוס אותם לצמיתות. להמשיך בכל זאת?")) return;
  }
  if(SAVEQ.timer){ clearTimeout(SAVEQ.timer); SAVEQ.timer=null; }
  SAVEQ.dirty=false; SAVEQ.fails=0; clearDirtyMark();
  var res=await serverLoad();
  if(res.error){ toast("שגיאת חיבור לשיט","err"); return; }
  if(res.data && Array.isArray(res.data.apartments)){
    DB=normalizeDB(res.data); saveLocal(); UNDO.length=0;   // סטאק ישן = בסיס לא תקף אחרי משיכה
    toast("נטען מהשיט","ok"); rerender();
  }
  else toast("השיט ריק","warn");
}

/* ---- סנכרון מול גוגל שיטס (Apps Script) — מקור האמת ---- */
/* ---------- תור שמירה ----------
   כל שמירה שולחת את כל מסד הנתונים. כששולחים כמה בקשות במקביל הן אינן
   חוזרות בהכרח בסדר שנשלחו, ובקשה ישנה שמגיעה אחרונה דורסת שינויים
   חדשים — כך "חזרו" סימוני בנק שכובו. לכן: בקשה אחת בלבד בכל רגע,
   ותמיד עם המצב העדכני. שינויים שנעשו בזמן שליחה נשלחים מיד אחריה. */
var SAVEQ={inflight:false,dirty:false,timer:null,fails:0};
function serverSave(){
  if(!getAuth()){ setSync("local"); return; }
  SAVEQ.dirty=true;
  SAVEQ.fails=0;                       // עריכה חדשה מאפסת את מונה הכישלונות — ניסיון מיידי
  setSync("saving");
  if(SAVEQ.timer) return;
  SAVEQ.timer=setTimeout(function(){ SAVEQ.timer=null; flushSave(); },350);
}
function scheduleRetry(){
  /* לעולם לא מפסיקים לנסות — רק מאטים (עד 30 שניות בין ניסיונות).
     עצירה קשיחה אחרי N כישלונות השאירה שינויים תקועים לנצח. */
  var delay=Math.min(2000*Math.max(1,SAVEQ.fails), 30000);
  setSync(SAVEQ.fails>=3 ? "err" : "saving");
  setTimeout(flushSave, delay);
}
function flushSave(){
  if(SAVEQ.inflight || !SAVEQ.dirty) return;
  var h=getAuth(); if(!h){ setSync("local"); return; }
  SAVEQ.dirty=false; SAVEQ.inflight=true; setSync("saving");
  var payload=JSON.stringify({action:"save",codeHash:h,data:DB});   // תמונת מצב עדכנית
  fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:payload})
    .then(function(r){ return r.json(); })
    .then(function(j){
      SAVEQ.inflight=false;
      if(j&&j.ok){
        SAVEQ.fails=0;
        if(SAVEQ.dirty){ setSync("saving"); setTimeout(flushSave,0); }   // שינויים שנעשו בזמן השליחה
        else { clearDirtyMark(); setSync("ok"); }
        return;
      }
      SAVEQ.dirty=true;
      var err=j&&j.error;
      if(err==="stale-rev"){
        /* השרת מחזיק גרסה חדשה יותר (מכשיר אחר עבד בינתיים).
           לא דורסים אותה: שומרים את העותק שלנו בגיבוי חירום ומושכים את העדכני. */
        SAVEQ.dirty=false; setSync("err");
        stashLocalBackup("שינוי שנדחה — השרת התעדכן ממכשיר אחר");
        serverLoad().then(function(res){
          if(res.data && Array.isArray(res.data.apartments)){
            DB=normalizeDB(res.data); saveLocal(); UNDO.length=0; clearDirtyMark();
            setSync("ok"); rerender();
            toast("מכשיר אחר עדכן נתונים במקביל — נטענה הגרסה העדכנית. העותק שלך נשמר ב'גיבוי'","warn");
          }
        });
        return;
      }
      if(err==="unauthorized"||err==="forbidden"){
        /* קוד הכניסה כבר לא תקף (למשל אחרי איפוס ממכשיר אחר).
           אסור להמשיך לירות — עוצרים, והשינוי שמור מקומית ומסומן,
           כך שאחרי כניסה מחודשת הוא נדחף לשרת ולא נמחק. */
        setSync("err"); setAuth(""); CU=null;
        toast("החיבור לשרת פג — יש להתחבר מחדש. השינויים שלך שמורים ויסונכרנו אחרי הכניסה","err");
        renderApp(); return;
      }
      SAVEQ.fails++; scheduleRetry();
    })
    .catch(function(){
      SAVEQ.inflight=false; SAVEQ.fails++; SAVEQ.dirty=true;
      scheduleRetry();
    });
}
function hasUnsaved(){ return !!(SAVEQ.dirty||SAVEQ.inflight); }
window.addEventListener("online",function(){    // הרשת חזרה — מנסים מיד
  if(SAVEQ.dirty && !SAVEQ.inflight){ SAVEQ.fails=0; flushSave(); }
});
window.addEventListener("beforeunload",function(e){
  if(hasUnsaved()){ e.preventDefault(); e.returnValue=""; return ""; }
});
window.addEventListener("pagehide",function(){
  /* ניסיון אחרון לשלוח לפני סגירה. אם הוא נכשל (או שהנתונים גדולים מדי
     ל-keepalive) — הסימון המקומי נשאר, והכניסה הבאה תדחף את המקומי. */
  if(!hasUnsaved()) return;
  var h=getAuth(); if(!h) return;
  try{
    fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"save",codeHash:h,data:DB}),keepalive:true});
  }catch(e){}
});
async function serverLoad(){
  var h=getAuth();
  if(!h){ setSync("local"); return {error:true}; }
  var j=await api({action:"load",codeHash:h});
  if(j&&j.ok){ setSync("ok"); return {data:(j.data||null),user:j.user}; }
  setSync("err"); return {error:true,reason:(j&&j.error)};
}

/* ============================================================
   אתחול — השרת הוא מקור האמת; localStorage הוא מטמון מקומי
   ============================================================ */
/* סנכרון אחרי אימות: מושכים את השרת, משווים מוני גרסאות, ומחליטים —
   דוחפים את המקומי רק אם הוא באמת חדש יותר. דחיפה עיוורת של עותק ישן
   היא שמחקה תשלומים בעבר, ולכן ההשוואה כאן קריטית.
   מחזיר: true=להיכנס, false=אימות נכשל, null=אין רשת */
async function reconcileAfterAuth(){
  var res=await serverLoad();
  if(res.error){
    if(res.reason==="unauthorized"){ setAuth(""); CU=null; return false; }
    if(hasDirtyMark() && DB && Array.isArray(DB.apartments)) return true;   // אין רשת אבל יש עבודה מקומית — לא חוסמים
    return null;
  }
  if(res.user) CU=res.user;
  var srvRev=(res.data&&res.data.meta&&Number(res.data.meta.rev))||0;
  var locRev=(DB&&DB.meta&&Number(DB.meta.rev))||0;
  var localDirty=hasDirtyMark() && DB && Array.isArray(DB.apartments);
  if(localDirty && (res.data===null || locRev>=srvRev)){
    SAVEQ.dirty=true; flushSave();
    toast("נמצאו שינויים שטרם סונכרנו — נשלחים לשרת","warn");
    return true;
  }
  if(res.data && Array.isArray(res.data.apartments)){
    if(localDirty){
      stashLocalBackup("שינויים מקומיים ישנים — השרת היה מעודכן יותר בכניסה");
      toast("השרת הכיל גרסה חדשה יותר — נטענה. העותק המקומי נשמר ב'גיבוי'","warn");
    }
    DB=normalizeDB(res.data); saveLocal(); UNDO.length=0; clearDirtyMark();
  }
  return true;
}
async function boot(){
  var hadLocal=loadDB();
  if(!hadLocal||!DB){ DB=blankDB(); seedIfEmpty(); }
  if(getAuth()){                       // session פעיל
    var r=await reconcileAfterAuth();
    if(r===null){ CU=null; }           // אין רשת ואין עבודה מקומית — מסך כניסה עם האזהרה
    else if(r===false){ /* אומת כלא-תקף — כבר נוקה */ }
  }
  renderApp();
}
</script>
<script>
"use strict";
/* ============================================================
   מודולים
   ============================================================ */
/* ---------- חיפוש וסינון ---------- */
var Q={apts:"",exp:"",expStatus:"",expClass:"",quick:"",partners:"",cross:"",recycle:"",pay:"",payWho:"",paySrc:""};
/* כל מילה בשאילתה חייבת להופיע — מאפשר "עורך דין קופר" ו"קופר דין" כאחד */
function matches(q,text){
  q=String(q||"").trim().toLowerCase(); if(!q) return true;
  var t=String(text||"").toLowerCase();
  return q.split(/\s+/).every(function(w){ return t.indexOf(w)>=0; });
}
function searchBox(id,val,ph,handler){
  return '<input id="'+id+'" value="'+esc(val)+'" placeholder="🔍 '+esc(ph)+'" '+
    'oninput="'+handler+'" style="max-width:300px">';
}
/* ============================================================
   סינון ומיון לפי עמודה — כמו באקסל
   עובד על כל טבלה: מוסיף שורת שדות מתחת לכותרות, ומיון בלחיצה.
   פועל על ה-DOM בלבד, כך שהוא חל על כל דוח בלי שינוי בקוד שלו.
   ============================================================ */
function attachTableTools(root){
  var scope=root||document;
  scope.querySelectorAll("table.tbl").forEach(function(t){
    if(t.getAttribute("data-tools")) return;
    var head=t.tHead; if(!head||!head.rows.length) return;
    if(!t.tBodies.length||!t.tBodies[0].rows.length) return;
    if(t.tBodies[0].rows.length<3) return;            // טבלה קטנה — לא מעמיסים
    t.setAttribute("data-tools","1");
    var hr=head.rows[0], n=hr.cells.length;

    /* מיון בלחיצה על כותרת */
    Array.prototype.forEach.call(hr.cells,function(th,i){
      if(th.getAttribute("onclick")) return;          // לכותרת יש כבר מיון משלה
      if(!String(th.textContent||"").trim()) return;
      th.style.cursor="pointer";
      th.title="לחץ למיון";
      th.addEventListener("click",function(){ sortTableByCol(t,i); });
    });

    /* שורת סינון */
    var fr=head.insertRow(-1);
    fr.className="filter-row";
    for(var i=0;i<n;i++){
      var c=fr.insertCell(-1);
      var label=String(hr.cells[i]?hr.cells[i].textContent:"").replace(/[▲▼]/g,"").trim();
      if(!label){ c.innerHTML=""; continue; }
      c.innerHTML='<input class="col-f" data-col="'+i+'" placeholder="סנן…" '+
        'style="padding:4px 7px;font-size:11.5px;border-radius:7px;min-width:60px">';
    }
    fr.querySelectorAll(".col-f").forEach(function(inp){
      inp.addEventListener("input",function(){ applyColFilters(t); });
      inp.addEventListener("click",function(e){ e.stopPropagation(); });
    });
  });
}
function applyColFilters(t){
  var fr=t.querySelector("thead tr.filter-row"); if(!fr) return;
  var f=[];
  fr.querySelectorAll(".col-f").forEach(function(inp){
    var v=String(inp.value||"").trim();
    if(v) f.push({col:Number(inp.getAttribute("data-col")),q:v});
  });
  var body=t.tBodies[0], shown=0;
  Array.prototype.forEach.call(body.rows,function(tr){
    var vis=f.every(function(x){
      var cell=tr.cells[x.col];
      return cell ? matches(x.q, cell.innerText||cell.textContent||"") : false;
    });
    tr.style.display=vis?"":"none";
    if(vis) shown++;
  });
  /* שורת סיכום חיה של המסונן: מסכמת עמודות מספריות */
  var tf=t.tFoot;
  if(tf&&tf.rows.length){
    if(!tf.getAttribute("data-orig")) tf.setAttribute("data-orig",tf.innerHTML);
    if(!f.length){ tf.innerHTML=tf.getAttribute("data-orig"); }
    else{
      var n=t.tHead.rows[0].cells.length, sums=new Array(n).fill(null);
      Array.prototype.forEach.call(body.rows,function(tr){
        if(tr.style.display==="none") return;
        for(var i=0;i<n;i++){
          var cell=tr.cells[i]; if(!cell) continue;
          var txt=String(cell.innerText||"").replace(/[^\d.\-]/g,"");
          if(txt && /[\d]/.test(txt) && /[₪%]|^\s*-?[\d,.]+\s*$/.test(String(cell.innerText||""))){
            var v=parseFloat(txt);
            if(isFinite(v)) sums[i]=(sums[i]||0)+v;
          }
        }
      });
      var cells="";
      for(var i=0;i<n;i++){
        cells+= i===0 ? '<td>מסונן: '+shown+' שורות</td>'
                      : '<td>'+(sums[i]!=null?money(round2(sums[i])):"")+'</td>';
      }
      tf.innerHTML='<tr>'+cells+'</tr>';
    }
  }
}
function sortTableByCol(t,col){
  var body=t.tBodies[0]; if(!body) return;
  var dir=(t.getAttribute("data-sort-col")==String(col) && t.getAttribute("data-sort-dir")==="asc")?"desc":"asc";
  t.setAttribute("data-sort-col",col); t.setAttribute("data-sort-dir",dir);
  function keyOf(tr){
    var cell=tr.cells[col]; if(!cell) return "";
    var txt=String(cell.innerText||"").trim();
    var numTxt=txt.replace(/[^\d.\-]/g,"");
    var d=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(txt);
    if(d) return {n:Number(d[3]+d[2]+d[1])};
    if(numTxt && /^[₪\s\-]*[\d,.]+\s*%?$/.test(txt)){ var v=parseFloat(numTxt); if(isFinite(v)) return {n:v}; }
    return {s:txt};
  }
  var rows=Array.prototype.slice.call(body.rows);
  rows.sort(function(a,b){
    var ka=keyOf(a), kb=keyOf(b), r;
    if(ka.n!=null&&kb.n!=null) r=ka.n-kb.n;
    else r=String(ka.s||ka.n||"").localeCompare(String(kb.s||kb.n||""),"he");
    return dir==="asc"?r:-r;
  });
  rows.forEach(function(tr){ body.appendChild(tr); });
  /* חיווי כיוון על הכותרת */
  var hr=t.tHead.rows[0];
  Array.prototype.forEach.call(hr.cells,function(th,i){
    var mark=th.querySelector(".sort-mark");
    if(mark) mark.remove();
    if(i===col){
      var sp=document.createElement("span");
      sp.className="sort-mark"; sp.style.color="var(--brand)";
      sp.textContent=" "+(dir==="asc"?"▲":"▼");
      th.appendChild(sp);
    }
  });
}
function countLine(shown,total,what){
  if(shown===total) return '<span class="muted">'+total+' '+esc(what)+'</span>';
  return '<span class="pill">מציג '+shown+' מתוך '+total+'</span>';
}

function partnerOptions(sel){ return active(DB.partners).map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?" selected":"")+'>'+esc(p.name)+'</option>';}).join(""); }
function categoryOptions(sel){ return '<option value="">—</option>'+active(DB.categories).map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?" selected":"")+'>'+esc(c.name)+'</option>';}).join(""); }
function classOptions(sel){ return Object.keys(CLASSIFICATIONS).map(function(k){return '<option value="'+k+'"'+(k===sel?" selected":"")+'>'+CLASSIFICATIONS[k]+'</option>';}).join(""); }
/* חשבונות זמינים לדירה: של הדירה + חשבונות כלליים (apartmentId ריק).
   כך רשימת החשבונות משותפת לכל הפרויקטים ולא צריך להגדיר אותה מחדש בכל דירה. */
function availAccounts(aptId){
  return active(DB.accounts).filter(function(ac){ return !ac.apartmentId || ac.apartmentId===aptId; })
    .sort(function(a,b){ return (b.isBank?1:0)-(a.isBank?1:0) || String(a.name).localeCompare(String(b.name),"he"); });
}
function accountOptions(aptId,sel){
  return '<option value="">— ידני / ללא חשבון —</option>'+
    availAccounts(aptId).map(function(ac){
      return '<option value="'+ac.id+'"'+(ac.id===sel?" selected":"")+'>'+esc(ac.name)+(ac.isBank?" 🏦 (בנק זמני)":"")+'</option>'; }).join("")+
    '<option value="__new">➕ הוסף חשבון חדש…</option>';
}
/* נבחר "הוסף חשבון חדש" בבורר — פותח שדות במקום, בלי לצאת מהטופס */
function onPmAccountPick(){
  var sel=document.getElementById("pm-account"); if(!sel) return;
  var wrap=document.getElementById("pm-newacc");
  if(sel.value==="__new"){
    if(wrap) wrap.style.display="block";
    var nm=document.getElementById("pm-newacc-name"); if(nm) nm.focus();
  }else{
    if(wrap) wrap.style.display="none";
    onPmAccount();
  }
}
function addAccountInline(aptId){
  var nm=val("pm-newacc-name").trim();
  if(!nm){ toast("יש להזין שם חשבון","err"); return; }
  var isBank=checked("pm-newacc-bank");
  var scope=val("pm-newacc-scope");   // "" = כללי לכל הדירות
  var k=normKey(nm);
  var exist=availAccounts(aptId).find(function(a){ return normKey(a.name)===k; });
  var id;
  if(exist){ id=exist.id; toast("החשבון כבר קיים — נבחר","warn"); }
  else{
    id=uid();
    DB.accounts.push({id:id,apartmentId:(scope==="apt"?aptId:null),name:nm,isBank:isBank,partnerId:null,deleted:false});
    save(); toast('נוסף החשבון "'+nm+'"',"ok");
  }
  var sel=document.getElementById("pm-account");
  if(sel){ sel.innerHTML=accountOptions(aptId,id); sel.value=id; }
  var wrap=document.getElementById("pm-newacc"); if(wrap) wrap.style.display="none";
  var nmEl=document.getElementById("pm-newacc-name"); if(nmEl) nmEl.value="";
  onPmAccount();
}

/* ---------- שותפי דירה ---------- */
function modulePartners(aptId){
  var rows=apPartners(aptId); var sum=rows.reduce(function(s,r){return s+(Number(r.defaultPercent)||0);},0);
  var h='<div class="toolbar"><h3 style="margin:0">שותפי הדירה ואחוזי ברירת מחדל</h3><div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-primary btn-sm" onclick="addApartmentPartner(\''+aptId+'\')">➕ הוסף שותף</button>':'')+'</div>';
  h+='<div class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>שותף</th><th>% ברירת מחדל</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td>'+esc(partnerName(r.partnerId))+'</td><td>'+num(r.defaultPercent)+'%</td><td class="right">'+
      (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="editApPartner(\''+r.id+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="softDelete(\'apartmentPartners\',\''+r.id+'\',\'להסיר שותף זה מהדירה?\')">🗑️</button>':'')+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><td>סה"כ</td><td class="'+(Math.abs(sum-100)<0.01?"pos":"neg")+'">'+num(sum)+'%</td><td></td></tr></tfoot></table></div>';
  if(Math.abs(sum-100)>=0.01) h+='<div class="hint neg">שים לב: סכום האחוזים אינו 100%.</div>';
  h+='</div>';
  return h;
}
function addApartmentPartner(aptId){
  var inApt={}; apPartners(aptId).forEach(function(x){inApt[x.partnerId]=1;});
  var avail=active(DB.partners).filter(function(p){return !inApt[p.id];});
  openModal({title:"הוספת שותף לדירה",bodyHtml:
    '<div class="field"><label>בחר שותף קיים</label><select id="apn-existing"><option value="">— חדש —</option>'+
      avail.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join("")+'</select></div>'+
    '<div class="field"><label>או שם שותף חדש</label><input id="apn-new" placeholder="שם"></div>'+
    '<div class="field"><label>% ברירת מחדל</label><input id="apn-pct" type="number" step="0.01" value="0"></div>',
    onSave:function(){
      var pid=val("apn-existing"); var newName=val("apn-new").trim();
      if(!pid&&newName){ pid=uid(); DB.partners.push({id:pid,name:newName,phone:"",notes:"",deleted:false}); }
      if(!pid){ toast("בחר או הזן שותף","err"); return false; }
      DB.apartmentPartners.push({id:uid(),apartmentId:aptId,partnerId:pid,defaultPercent:Number(val("apn-pct"))||0,deleted:false});
      save(); toast("נוסף","ok"); rerender();
    }});
}
function editApPartner(id){
  var r=byId(DB.apartmentPartners,id);
  openModal({title:"עריכת אחוז ברירת מחדל — "+partnerName(r.partnerId),bodyHtml:
    '<div class="field"><label>% ברירת מחדל</label><input id="app-pct" type="number" step="0.01" value="'+esc(String(r.defaultPercent))+'"></div>',
    onSave:function(){ r.defaultPercent=Number(val("app-pct"))||0; save(); toast("נשמר","ok"); rerender(); }});
}

/* ---------- הוצאות ---------- */
function moduleExpenses(aptId){
  var exps=apExpenses(aptId);
  var h='<div class="toolbar"><h3 style="margin:0">הוצאות / שלבים</h3><div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-primary btn-sm" onclick="openExpenseEditor(null,\''+aptId+'\')">➕ הוצאה חדשה</button>':'')+
    (can("edit")&&exps.length?' <button class="btn btn-sm" onclick="openBulkMgmt(\''+aptId+'\')">💼 דמי ניהול מרוכז</button>':'')+
    (can("edit")&&exps.length?' <button class="btn btn-danger btn-sm" onclick="deleteApartmentExpenses(\''+aptId+'\')">🗑️ מחק הכל</button>':'')+'</div>';
  if(!exps.length) return h+'<div class="empty">אין הוצאות עדיין.</div>';
  h+='<div class="toolbar">'+
    searchBox("exp-q",Q.exp,"חיפוש לפי שם שלב / הערה…","Q.exp=this.value;renderExpTable()")+

      ['','unpaid','partial','paid'].map(function(v){
        var l={"":"כל הסטטוסים","unpaid":"לא שולם","partial":"שולם חלקית","paid":"שולם במלואו"}[v];
        return '<option value="'+v+'"'+(Q.expStatus===v?" selected":"")+'>'+l+'</option>'; }).join("")+
    '</select>'+
    '<select style="max-width:150px" onchange="Q.expClass=this.value;renderExpTable()">'+
      '<option value="">כל הסיווגים</option>'+
      Object.keys(CLASSIFICATIONS).map(function(k){
        return '<option value="'+k+'"'+(Q.expClass===k?" selected":"")+'>'+CLASSIFICATIONS[k]+'</option>'; }).join("")+
    '</select>'+
    ((Q.exp||Q.expStatus||Q.expClass)?'<button class="btn btn-ghost btn-sm" onclick="Q.exp=\'\';Q.expStatus=\'\';Q.expClass=\'\';rerender()">✕ נקה</button>':'')+
    '<div class="sp"></div><span id="exp-count"></span></div>';
  h+='<div id="exp-table">'+expTableHtml(aptId)+'</div>';

/* הדירה נלקחת מהמצב ולא מפרמטר משורשר לתוך מאפיין HTML —
   שרשור כזה שבר את הציטוט ובלם את כל הסינונים. */
function renderExpTable(aptId){
  aptId=aptId||state.params.apartmentId;
  var el=document.getElementById("exp-table"); if(el) el.innerHTML=expTableHtml(aptId);
}
/* ---------- תת-שלבים ----------
   שיוך הוא לתצוגה ולקיבוץ בלבד: כל תת-שלב הוא הוצאה מלאה עם סכום,
   חלוקה ותשלומים משלו, כך שאף חישוב כספי לא משתנה ואין ספירה כפולה. */
function expenseChildren(eId){
  return active(DB.expenses).filter(function(x){ return x.parentId===eId; });
}
function expenseParentOptions(aptId,selfId,sel){
  var opts=apExpenses(aptId).filter(function(e){
    if(e.id===selfId) return false;
    if(e.parentId) return false;          // רק רמה אחת של קינון
    return true;
  }).sort(function(x,y){ return String(x.description).localeCompare(String(y.description),"he"); });
  return '<option value="">— שלב עצמאי (ללא אב) —</option>'+
    opts.map(function(e){
      return '<option value="'+e.id+'"'+(e.id===sel?" selected":"")+'>'+esc(e.description)+'</option>'; }).join("");
}
/* הוספת תת-שלב מתוך שורת האב */
function addSubExpense(parentId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var p=byId(DB.expenses,parentId); if(!p) return;
  if(p.parentId){ toast("אפשר תת-שלב רק תחת שלב עצמאי","err"); return; }
  openExpenseEditor(null,p.apartmentId,parentId);
}
function filteredExpenses(aptId){
  return apExpenses(aptId).filter(function(e){
    if(!matches(Q.exp, e.description+" "+(e.note||""))) return false;
    if(Q.expStatus && expenseStatus(e.id)!==Q.expStatus) return false;
    if(Q.expClass && e.classification!==Q.expClass) return false;
    return true;
  });
}
function expTableHtml(aptId){
  var a=byId(DB.apartments,aptId);
  var all=apExpenses(aptId);
  var exps=filteredExpenses(aptId);
  var cnt=document.getElementById("exp-count");
  if(cnt) cnt.innerHTML=countLine(exps.length,all.length,"שלבים");
  if(!exps.length) return '<div class="empty">לא נמצא שלב שמתאים לסינון</div>';
  var h='<div class="table-wrap"><table class="tbl"><thead><tr><th>תאריך</th><th>תיאור</th><th>סיווג</th><th>סכום</th>'+
    (a.hasManagement?'<th>דמי ניהול</th>':'')+'<th>שולם</th><th>נותר</th><th>סטטוס</th><th></th></tr></thead><tbody>';

  /* שורת שלב — נעשה שימוש גם לאב וגם לתת-שלב */
  function rowFor(e,isChild){
    var st=expenseStatus(e.id), rem=expenseRemaining(e.id);
    var badge=st==="paid"?'<span class="badge badge-ok">שולם</span>'
      :st==="over"?'<span class="badge badge-warn">⚠️ ביתר</span>'
      :st==="partial"?'<span class="badge badge-warn">חלקי</span>':'<span class="badge badge-danger">לא שולם</span>';
    var kids=expenseChildren(e.id);
    return '<tr'+(isChild?' style="background:#fbfcff"':'')+'><td>'+dateHe(e.date)+'</td>'+
      '<td'+(isChild?' style="padding-right:26px"':'')+'>'+
        (isChild?'<span class="muted">↳ </span>':'')+
        '<b>'+esc(e.description)+'</b>'+(e.hasInvoice?' 📎':'')+
        (kids.length?' <span class="pill">'+kids.length+' תתי-שלבים</span>':'')+'</td>'+
      '<td>'+(CLASSIFICATIONS[e.classification]||"")+'</td>'+
      '<td>'+money(e.amount)+'</td>'+
      (a.hasManagement?'<td>'+(e.mgmtEnabled?money(expenseMgmtCostLive(e.id)):'—')+'</td>':'')+
      '<td>'+money(expensePaid(e.id))+'</td><td class="'+(Math.abs(rem)>0.01?"neg":"pos")+'">'+money(rem)+'</td><td>'+badge+'</td>'+
      '<td class="right" style="white-space:nowrap">'+
        '<button class="btn btn-ghost btn-sm" onclick="openPayments(\''+e.id+'\')" title="תשלומים">💳</button>'+
        (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openExpenseEditor(\''+e.id+'\',\''+aptId+'\')" title="עריכה">✏️</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="addSubExpense(\''+e.id+'\')" title="הוסף תת-שלב">➕</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="softDelete(\'expenses\',\''+e.id+'\',\'למחוק הוצאה זו?\')">🗑️</button>':'')+'</td></tr>';
  }
  /* סיכום קבוצה — אב + תתי-השלבים שלו */
  function groupSummary(e,kids){
    var amt=(Number(e.amount)||0), paid=expensePaid(e.id);
    kids.forEach(function(k){ amt+=(Number(k.amount)||0); paid+=expensePaid(k.id); });
    return '<tr style="background:#eef2ff"><td></td>'+
      '<td style="padding-right:26px"><b class="muted">סה"כ '+esc(e.description)+' (כולל תתי-השלבים)</b></td>'+
      '<td></td><td><b>'+money(amt)+'</b></td>'+
      (a.hasManagement?'<td></td>':'')+
      '<td><b>'+money(paid)+'</b></td><td class="'+((amt-paid)>0.01?"neg":"pos")+'"><b>'+money(amt-paid)+'</b></td>'+
      '<td colspan="2"></td></tr>';
  }

  /* קיבוץ: אב ואחריו תתי-השלבים שלו. תת-שלב שהאב שלו לא במסונן — מוצג לבד. */
  var shown={}; exps.forEach(function(e){ shown[e.id]=1; });
  var order=exps.slice().sort(function(x,y){return (x.date<y.date)?1:-1;});
  order.forEach(function(e){
    if(e.parentId && shown[e.parentId]) return;          // ייוצג תחת האב
    h+=rowFor(e,!!e.parentId);
    var kids=expenseChildren(e.id).filter(function(k){ return shown[k.id]; })
      .sort(function(x,y){return (x.date<y.date)?1:-1;});
    if(kids.length){
      kids.forEach(function(k){ h+=rowFor(k,true); });
      h+=groupSummary(e,kids);
    }
  });
  // סיכום — של השורות המוצגות אחרי הסינון
  var tot=exps.reduce(function(s,e){return s+(Number(e.amount)||0);},0);
  var totPaid=exps.reduce(function(s,e){return s+expensePaid(e.id);},0);
  var lbl=(exps.length===all.length)?'סה"כ':'סה"כ המסונן';
  h+='</tbody><tfoot><tr><td colspan="3">'+lbl+'</td><td>'+money(tot)+'</td>'+(a.hasManagement?'<td></td>':'')+'<td>'+money(totPaid)+'</td><td>'+money(tot-totPaid)+'</td><td colspan="2"></td></tr></tfoot></table></div>';
  return h;
}
/* ---------- דמי ניהול מרוכז: החלה על הרבה שלבים בבת אחת ---------- */
function openBulkMgmt(aptId){
  var a=byId(DB.apartments,aptId);
  if(!a.hasManagement){
    toast("דמי ניהול כבויים בדירה — הפעל בלשונית \"דמי ניהול\"","err");
    go("apartment",{apartmentId:aptId,tab:"managers"}); return;
  }
  var mgrs=apManagers(aptId);
  if(!mgrs.length){
    toast("אין מנהלים מוגדרים — הוסף אותם קודם","err");
    go("apartment",{apartmentId:aptId,tab:"managers"}); return;
  }
  var list=filteredExpenses(aptId).sort(function(x,y){return x.date<y.date?-1:1;});
  if(!list.length){ toast("אין שלבים להצגה לפי הסינון הנוכחי","warn"); return; }

  var body='<div class="hint">מוצגים '+list.length+' שלבים לפי הסינון הנוכחי במסך ההוצאות. '+
    'סנן/חפש שם לפני שנכנסים לכאן כדי לצמצם את הרשימה.</div>'+
    '<div class="section-title">ההגדרות שיוחלו</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>בסיס החישוב</label><select id="bm-base">'+
        Object.keys(BASE_TYPES).map(function(k){return '<option value="'+k+'"'+(k==="net18"?" selected":"")+'>'+BASE_TYPES[k]+'</option>';}).join("")+
      '</select></div>'+
      '<div class="field"><label>מע"מ על דמי הניהול</label><select id="bm-vat">'+
        [0,17,18].map(function(v){return '<option value="'+v+'"'+(v===18?" selected":"")+'>'+(v===0?"ללא":v+"%")+'</option>';}).join("")+
      '</select></div>'+
    '</div>'+
    mgrs.map(function(m){
      return '<div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px"><b>'+esc(m.name)+'</b>'+
        '<div class="form-grid" style="margin-top:8px">'+
        '<div class="field"><label>% נוכחי</label><input id="bm-cur-'+m.id+'" type="number" step="0.01" value="'+esc(String(m.defaultFeePercent))+'"></div>'+
        '<div class="field"><label>% דחוי</label><input id="bm-def-'+m.id+'" type="number" step="0.01" value="0"></div>'+
        '<div class="field full"><label>מתי ישוחרר הדחוי</label><input id="bm-lbl-'+m.id+'" value="בסיום הבנייה"></div>'+
        '</div></div>';
    }).join("")+
    '<div class="section-title">על אילו שלבים להחיל</div>'+
    '<div class="toolbar">'+
      '<button class="btn btn-sm" onclick="bulkMgmtSelectAll(true)">✔️ סמן הכל</button>'+
      '<button class="btn btn-sm" onclick="bulkMgmtSelectAll(false)">✕ נקה בחירה</button>'+
      '<div class="sp"></div><span id="bm-count" class="pill"></span></div>'+
    '<div class="table-wrap" style="max-height:300px;overflow:auto"><table class="tbl"><thead><tr>'+
      '<th></th><th>תאריך</th><th>שלב</th><th>סכום</th><th>דמי ניהול כיום</th></tr></thead><tbody>'+
      list.map(function(e){
        return '<tr><td><input type="checkbox" class="bm-x" value="'+e.id+'" checked onchange="bulkMgmtCount()" style="width:auto"></td>'+
          '<td>'+dateHe(e.date)+'</td><td><b>'+esc(e.description)+'</b></td><td>'+money(e.amount)+'</td>'+
          '<td>'+(e.mgmtEnabled?money(expenseMgmtCostLive(e.id)):'<span class="muted">—</span>')+'</td></tr>';
      }).join("")+
    '</tbody></table></div>'+
    '<div class="field" style="margin-top:12px"><label><input type="checkbox" id="bm-remove" style="width:auto" onchange="bulkMgmtToggleMode()"> '+
      '<b class="neg">להסיר</b> דמי ניהול מהשלבים המסומנים (במקום להחיל)</label></div>';

  openModal({title:"💼 דמי ניהול לכמה שלבים",wide:true,bodyHtml:body,
    saveLabel:"החל על המסומנים",onSave:function(){ return applyBulkMgmt(aptId); }});
  bulkMgmtCount();
}
function bulkMgmtSelectAll(v){
  document.querySelectorAll(".bm-x").forEach(function(c){ c.checked=v; });
  bulkMgmtCount();
}
function bulkMgmtCount(){
  var n=document.querySelectorAll(".bm-x:checked").length;
  var el=document.getElementById("bm-count"); if(el) el.textContent="נבחרו "+n;
}
function bulkMgmtToggleMode(){
  var rm=checked("bm-remove");
  ["bm-base","bm-vat"].forEach(function(id){ var el=document.getElementById(id); if(el) el.disabled=rm; });
  document.querySelectorAll('[id^="bm-cur-"],[id^="bm-def-"],[id^="bm-lbl-"]').forEach(function(el){ el.disabled=rm; });
}
function applyBulkMgmt(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var ids=Array.prototype.map.call(document.querySelectorAll(".bm-x:checked"),function(c){return c.value;});
  if(!ids.length){ toast("לא נבחר אף שלב","err"); return false; }
  var remove=checked("bm-remove");
  var mgrs=apManagers(aptId);
  if(remove){
    /* שלב שכבר שולם עליו למנהלים לא ניתן לכיבוי — אחרת התשלומים נספרים
       בלי צד עלות והמאזן נשבר. מדלגים עליו ומדווחים. */
    var blocked=[], okIds=[];
    ids.forEach(function(eid){
      var mPaid=expPayments(eid).filter(function(p){return p.recipientType==="manager"&&!p.auto;})
        .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
      if(mPaid>0.01) blocked.push(eid); else okIds.push(eid);
    });
    if(!okIds.length){
      toast("בכל השלבים שנבחרו כבר שולמו דמי ניהול — אי אפשר לבטל. מחק קודם את התשלומים למנהלים","err");
      return false;
    }
    if(!confirm("יוסרו דמי ניהול מ-"+okIds.length+" שלבים"+
      (blocked.length? "\n("+blocked.length+" שלבים ידולגו כי כבר שולם בהם למנהלים)":"")+
      "\n\nהנתונים הקיימים יישמרו ויחזרו אם תחיל שוב.")) return false;
    okIds.forEach(function(eid){ var e=byId(DB.expenses,eid); if(e) e.mgmtEnabled=false; syncAutoMgmtPayments(eid); });
    save();
    toast("דמי הניהול הוסרו מ-"+okIds.length+" שלבים"+(blocked.length?" · "+blocked.length+" דולגו (שולם בהם)":""),blocked.length?"warn":"ok");
    rerender(); return;
  }
  var base=val("bm-base")||"full", vat=Number(val("bm-vat")); if(isNaN(vat)) vat=18;
  var cfg=mgrs.map(function(m){
    return {id:m.id, cur:Number(val("bm-cur-"+m.id))||0, def:Number(val("bm-def-"+m.id))||0, lbl:val("bm-lbl-"+m.id)||"" };
  });
  if(!cfg.some(function(c){ return c.cur>0 || c.def>0; })){
    toast("כל האחוזים אפס — הזן אחוז לפחות למנהל אחד","err"); return false;
  }
  ids.forEach(function(eid){
    var e=byId(DB.expenses,eid); if(!e) return;
    e.mgmtEnabled=true; e.mgmtBaseType=base; e.mgmtVatRate=vat;
    DB.expenseManagerFees=DB.expenseManagerFees.filter(function(f){return f.expenseId!==eid;});
    cfg.forEach(function(c){
      DB.expenseManagerFees.push({id:uid(),expenseId:eid,managerId:c.id,
        pctCurrent:c.cur,pctDeferred:c.def,deferredLabel:c.lbl,deferredReleased:false,deleted:false});
    });
    syncAutoMgmtPayments(eid);
  });
  save();
  toast("דמי ניהול הוחלו על "+ids.length+" שלבים","ok");
  rerender();
}

function splitRowHtml(pid,pct){
  return '<div class="split-row"><select class="sp-partner">'+partnerOptions(pid)+'</select>'+
    '<input class="sp-pct" type="number" step="0.01" value="'+(pct||0)+'" oninput="updateSplitSum()">'+
    '<button class="btn btn-ghost btn-sm" onclick="this.closest(\'.split-row\').remove();updateSplitSum()">✕</button></div>';

function updateSplitSum(){
  var rows=document.querySelectorAll("#split-rows .split-row");
  var el=document.getElementById("split-sum"); if(!el) return;
  if(!rows.length){ el.textContent="ללא חלוקה"; el.className="muted"; return; }
  var sum=0; document.querySelectorAll("#split-rows .sp-pct").forEach(function(i){sum+=Number(i.value)||0;});
  el.textContent=num(sum)+"%"; el.className=Math.abs(sum-100)<0.01?"pos":"neg";

function addSplitRow(){ document.getElementById("split-rows").insertAdjacentHTML("beforeend",splitRowHtml("",0)); updateSplitSum(); }
function toggleMgmt(){

/* תצוגה חיה של חישוב דמי הניהול, מתעדכנת בכל הקלדה */
function updateMgmtPreview(){
  var box=document.getElementById("mgmt-preview"); if(!box) return;
  var rowsEls=document.querySelectorAll("#mgmt-rows [data-mgr]");
  if(!rowsEls.length){ box.innerHTML=""; return; }
  var amt=Number(val("ex-amount"))||0;
  var baseType=val("ex-base")||"full", vat=Number(val("ex-vat"))||0;
  var b = baseType==="net17" ? amt/1.17 : baseType==="net18" ? amt/1.18 : amt;
  var vf = 1+vat/100;
  var out=[], totLive=0, totFull=0;
  Array.prototype.forEach.call(rowsEls,function(el){
    var mid=el.getAttribute("data-mgr"), nm=el.getAttribute("data-name")||"";
    var cur=Number(val("mf-cur-"+mid))||0, def=Number(val("mf-def-"+mid))||0, rel=checked("mf-rel-"+mid);
    var curAmt=b*cur/100*vf, defAmt=b*def/100*vf;
    var live=curAmt+(rel?defAmt:0), full=curAmt+defAmt;
    totLive+=live; totFull+=full;
    out.push('<tr><td>'+esc(nm)+'</td><td>'+money(curAmt)+'</td><td>'+money(defAmt)+(rel?' <span class="badge badge-ok">שוחרר</span>':'')+
      '</td><td><b>'+money(live)+'</b></td><td>'+money(full)+'</td></tr>');
  });
  box.innerHTML='<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>מנהל</th><th>נוכחי</th><th>דחוי</th><th>לתשלום עכשיו</th><th>סה"כ בסוף</th></tr></thead><tbody>'+
    out.join("")+'</tbody><tfoot><tr><td>בסיס: '+money(b)+(vat?' · מע"מ '+vat+'%':' · ללא מע"מ')+
    '</td><td colspan="2"></td><td><b>'+money(totLive)+'</b></td><td>'+money(totFull)+'</td></tr></tfoot></table></div>'+
    '<div class="hint">כל הסכומים כוללים מע"מ. "לתשלום עכשיו" = הנוכחי + הדחוי אם שוחרר — וזה גם התקרה לתשלום למנהל.</div>';
}

function saveExpense(eId,aptId){
  var a=byId(DB.apartments,aptId);
  var desc=val("ex-desc").trim(); var amount=Number(val("ex-amount"))||0;
  if(!desc){ toast("יש להזין תיאור","err"); return false; }
  if(amount<=0){ toast("יש להזין סכום","err"); return false; }
  // חלוקה — איחוד שורות כפולות לאותו שותף + ולידציה
  var byP={}, order=[]; document.querySelectorAll("#split-rows .split-row").forEach(function(r){
    var pid=r.querySelector(".sp-partner").value; var pct=Number(r.querySelector(".sp-pct").value)||0;
    if(pid){ if(byP[pid]==null){byP[pid]=0;order.push(pid);} byP[pid]+=pct; }
  });
  var rows=order.map(function(pid){ return {partnerId:pid,percent:byP[pid]}; });
  /* חלוקה נדרשת רק בדירה שהוגדרו לה שותפים. דירה אישית
     (קרן השתלמות, קופת חיסכון...) נשמרת בלי חלוקה כלל. */
  if(!rows.length){
    if(apPartners(aptId).length){ toast("יש להוסיף לפחות שורת חלוקה אחת","err"); return false; }
  } else {
    var pctSum=rows.reduce(function(s,r){return s+r.percent;},0);
    if(Math.abs(pctSum-100)>0.01){ toast("סכום חלוקת השותפים חייב להיות 100% (כרגע "+num(pctSum)+"%)","err"); return false; }
  }
  if(eId){ var paidSoFar=expensePaid(eId);
    if(amount<paidSoFar-0.01){
      if(!confirm("סכום השלב החדש ("+money(amount)+") נמוך ממה שכבר שולם ("+money(paidSoFar)+").\n\nהשלב יסומן \"שולם ביתר\". להמשיך?")) return false;
    } }
  var e;
  if(eId){ e=byId(DB.expenses,eId); }
  else{ e={id:uid(),apartmentId:aptId,deleted:false}; DB.expenses.push(e); eId=e.id; }
  e.description=desc; e.amount=amount; e.date=val("ex-date")||todayISO();
  e.categoryId=(document.getElementById("ex-cat")?val("ex-cat"):(e.categoryId||""));
  e.classification=val("ex-class"); e.note=val("ex-note");
  /* שיוך לשלב-אב. חסימת קינון מעל רמה אחת ומניעת מעגל. */
  if(document.getElementById("ex-parent")){
    var pv=val("ex-parent")||"";
    if(pv===eId) pv="";
    var pe=pv?byId(DB.expenses,pv):null;
    if(pe && pe.parentId){ toast("אפשר תת-שלב רק תחת שלב עצמאי","err"); return false; }
    if(pv && expenseChildren(eId).length){ toast("לשלב הזה יש תתי-שלבים — לא ניתן לשייך אותו לאב","err"); return false; }
    e.parentId = pv || null;
  }
  e.hasInvoice=checked("ex-inv"); e.invoiceLink=val("ex-link");
  /* דמי ניהול — נוגעים בהם אך ורק כשהמקטע באמת הוצג על המסך.
     קודם: כל שמירה מחקה את דמי הניהול ובנתה מחדש רק אם התיבה סומנה,
     כך ששמירה ממצב שבו המקטע לא הוצג מחקה את הנתונים בשקט. */
  var mgmtShown = !!document.getElementById("ex-mgmt");
  if(mgmtShown){
    if(e.mgmtEnabled && !checked("ex-mgmt")){
      /* מבטלים דמי ניהול על הוצאה שכבר שולם עליה למנהלים? צד העלות היה
         מתאפס בעוד התשלומים ממשיכים להיספר — והמאזן נשבר. חוסמים. */
      /* תשלומים אוטומטיים ("שווה ערך") לא חוסמים — הם יוסרו בסנכרון */
      var mPaid=round2(expPayments(eId).filter(function(p){return p.recipientType==="manager"&&!p.auto;})
        .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
      if(mPaid>0.01){
        toast("אי אפשר לבטל דמי ניהול — כבר שולמו "+money(mPaid)+" למנהלים על שלב זה. מחק קודם את התשלומים אליהם","err");
        return false;
      }
    }
    e.mgmtEnabled = checked("ex-mgmt");
    e.mgmtBaseType = val("ex-base") || e.mgmtBaseType || "full";
    var vatRaw = val("ex-vat");
    if(vatRaw!==""){ var vn=Number(vatRaw); e.mgmtVatRate = isNaN(vn)?18:vn; }
    else if(e.mgmtVatRate==null){ e.mgmtVatRate = 18; }
  } else {
    if(e.mgmtEnabled==null) e.mgmtEnabled=false;
    if(e.mgmtBaseType==null) e.mgmtBaseType="full";
    if(e.mgmtVatRate==null) e.mgmtVatRate=18;
  }
  // rebuild splits
  DB.expenseSplits=DB.expenseSplits.filter(function(s){return s.expenseId!==eId;});
  rows.forEach(function(r){ DB.expenseSplits.push({id:uid(),expenseId:eId,partnerId:r.partnerId,percent:r.percent,deleted:false}); });
  // rebuild manager fees
  /* בונים מחדש רק כשיש ערכים חדשים על המסך. אם המקטע לא הוצג, או שדמי
     הניהול כבויים — משאירים את הרשומות הקיימות במקום למחוק אותן.
     הן ממילא אינן נספרות כל עוד mgmtEnabled כבוי, ואם יידלק שוב — הנתונים חוזרים. */
  if(mgmtShown && e.mgmtEnabled){
    DB.expenseManagerFees=DB.expenseManagerFees.filter(function(f){return f.expenseId!==eId;});
    apManagers(aptId).forEach(function(m){
      DB.expenseManagerFees.push({id:uid(),expenseId:eId,managerId:m.id,
        pctCurrent:Number(val("mf-cur-"+m.id))||0,pctDeferred:Number(val("mf-def-"+m.id))||0,
        deferredLabel:val("mf-lbl-"+m.id)||"",deferredReleased:checked("mf-rel-"+m.id),deleted:false});
    });
  }
  syncAutoMgmtPayments(eId);   // תשלום "שווה ערך" אוטומטי לפי הגדרת הפרויקט
  save(); toast("ההוצאה נשמרה","ok"); rerender();
}

/* ---------- לשונית תשלומים: כל תשלומי הדירה במקום אחד ---------- */

  return active(DB.payments).filter(function(p){ return expIds[p.expenseId]; });

    '<select style="max-width:170px" onchange="Q.paySrc=this.value;renderPayTable()">'+

        return '<option value="'+o[0]+'"'+(Q.paySrc===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+

    ((Q.pay||Q.payWho||Q.paySrc)?'<button class="btn btn-ghost btn-sm" onclick="Q.pay=\'\';Q.payWho=\'\';Q.paySrc=\'\';rerender()">✕ נקה</button>':'')+

function payTableHtml(aptId){
  var all=apAllPayments(aptId);
  var list=all.filter(function(p){
    var e=byId(DB.expenses,p.expenseId), acc=byId(DB.accounts,p.accountId);
    var txt=(e?e.description:"")+" "+(p.note||"")+" "+(acc?acc.name:"")+" "+
            (p.payerPartnerId?partnerName(p.payerPartnerId):"")+" "+
            (p.recipientType==="manager"?managerName(p.recipientManagerId):"");
    if(!matches(Q.pay,txt)) return false;
    if(Q.payWho && p.payerPartnerId!==Q.payWho) return false;
    if(Q.paySrc==="bank" && !accountIsBank(p.accountId)) return false;
    if(Q.paySrc==="direct" && (accountIsBank(p.accountId)||p.recipientType==="manager")) return false;
    if(Q.paySrc==="manager" && p.recipientType!=="manager") return false;
    return true;
  });
  var cnt=document.getElementById("pay-count");
  if(cnt) cnt.innerHTML=countLine(list.length,all.length,"תשלומים");
  if(!list.length) return '<div class="empty">לא נמצא תשלום שמתאים לסינון</div>';
  var tot=0;
  var h='<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>תאריך</th><th>עבור (שלב)</th><th>סכום</th><th>חשבון</th><th>מי שילם</th>'+
    '<th>מוטב</th><th>אמצעי</th><th>חשבונית</th><th>הערה</th><th></th></tr></thead><tbody>';
  list.sort(function(x,y){ return x.date<y.date?1:-1; }).forEach(function(p){
    var e=byId(DB.expenses,p.expenseId), acc=byId(DB.accounts,p.accountId);
    tot+=Number(p.amount)||0;
    var recip=p.recipientType==="manager"
      ? '<span class="pill">מנהל: '+esc(managerName(p.recipientManagerId))+'</span>' : 'ספק';
    h+='<tr><td>'+dateHe(p.date)+'</td>'+
      '<td><b>'+esc(e?e.description:"—")+'</b></td>'+
      '<td>'+money(p.amount)+'</td>'+
      '<td>'+esc(acc?acc.name:"ידני")+(acc&&acc.isBank?" 🏦":"")+'</td>'+
      '<td>'+(p.payerPartnerId?esc(partnerName(p.payerPartnerId)):(accountIsBank(p.accountId)?'<span class="muted">מהבנק</span>':"—"))+'</td>'+
      '<td>'+recip+'</td><td>'+(METHODS[p.method]||"")+(p.auto?' <span class="badge badge-muted">אוטו׳</span>':'')+'</td>'+
      '<td>'+(p.hasInvoice?"✔️":"")+'</td>'+
      '<td class="muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis">'+esc(p.note||"")+'</td>'+
      '<td class="right" style="white-space:nowrap">'+
        '<button class="btn btn-ghost btn-sm" onclick="openPayments(\''+p.expenseId+'\')" title="כל תשלומי השלב">💳</button>'+
        (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openPaymentEditor(\''+p.expenseId+'\',\''+p.id+'\')">✏️</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="delPayment(\''+p.id+'\',\''+p.expenseId+'\')">🗑️</button>':'')+'</td></tr>';
  });
  var lbl=(list.length===all.length)?'סה"כ':'סה"כ המסונן';
  h+='</tbody><tfoot><tr><td colspan="2">'+lbl+' ('+list.length+' תשלומים)</td><td>'+money(tot)+'</td>'+
    '<td colspan="7"></td></tr></tfoot></table></div>';
  return h;
}

    '<div class="form-grid">'+

      '<div class="field"><label>תיאור השלב</label><input id="qe-desc" placeholder="למשל: קבלן שלד תשלום ב׳" onkeydown="if(event.key===\'Enter\'){event.preventDefault();document.getElementById(\'qe-amount\').focus();}"></div>'+

      '<div class="field"><label>סיווג</label><select id="qe-class">'+classOptions("investment")+'</select></div>'+

    '</div>'+
    '<div id="qe-info"></div>'+
    '<div class="section-title">רישום תשלום עכשיו (אופציונלי)</div>'+
    '<div class="field"><label><input type="checkbox" id="qe-paynow" style="width:auto" onchange="toggleQuickPayNow()"> נרשם גם תשלום על השלב הזה</label></div>'+
    '<div id="qe-pay" style="display:none"></div>',

function renderQuickExpenseInfo(){
  var box=document.getElementById("qe-info"); if(!box) return;
  var aptId=val("qe-apt"); var a=byId(DB.apartments,aptId);
  var amt=Number(val("qe-amount"))||0;

    var sum=parts.reduce(function(s,p){return s+(Number(p.defaultPercent)||0);},0);

      '<div class="table-wrap"><table class="tbl"><thead><tr><th>שותף</th><th>אחוז</th><th>חלקו</th></tr></thead><tbody>'+
      parts.map(function(p){
        return '<tr><td>'+esc(partnerName(p.partnerId))+'</td><td>'+num(p.defaultPercent)+'%</td>'+
          '<td><b>'+money(amt*(Number(p.defaultPercent)||0)/100)+'</b></td></tr>'; }).join("")+
      '</tbody><tfoot><tr><td>סה"כ</td><td class="'+(Math.abs(sum-100)<0.01?"pos":"neg")+'">'+num(sum)+'%</td>'+
      '<td>'+money(amt)+'</td></tr></tfoot></table></div>'+
      (Math.abs(sum-100)>=0.01?'<div class="hint neg">שים לב: אחוזי ברירת המחדל בדירה אינם 100%.</div>':'')+
      '<div class="hint">אפשר לשנות את החלוקה אחרי השמירה, בעריכת השלב.</div>';

  }
  box.innerHTML=h;

function onQuickPayAccount(){
  var payer=document.getElementById("qe-pay-payer"); if(!payer) return;
  if(accountIsBank(val("qe-pay-account"))){ payer.value=""; payer.disabled=true; }
  else payer.disabled=false;

function saveQuickExpense(){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var aptId=val("qe-apt");
  var desc=val("qe-desc").trim();
  var amount=Number(val("qe-amount"))||0;
  if(!desc){ toast("יש להזין תיאור","err"); return false; }
  if(amount<=0){ toast("יש להזין סכום","err"); return false; }
  var date=val("qe-date")||todayISO();
  /* הגנה מכפילות — כמו בייבוא: אותה דירה + תיאור + סכום + תאריך */
  var dup=apExpenses(aptId).find(function(x){
    return normKey(x.description)===normKey(desc) && Math.abs((Number(x.amount)||0)-amount)<0.01 && x.date===date; });
  if(dup && !confirm('כבר קיים שלב "'+dup.description+'" באותו סכום ותאריך.\n\nלהוסיף בכל זאת?')) return false;

  var eid=uid();
  DB.expenses.push({id:eid,apartmentId:aptId,categoryId:"",classification:val("qe-class")||"investment",
    description:desc,amount:amount,date:date,note:val("qe-note")||"",
    hasInvoice:false,invoiceLink:"",mgmtEnabled:false,mgmtBaseType:"full",mgmtVatRate:18,deleted:false});
  apPartners(aptId).forEach(function(p){
    DB.expenseSplits.push({id:uid(),expenseId:eid,partnerId:p.partnerId,percent:p.defaultPercent,deleted:false});
  });

  var payMsg="";
  if(checked("qe-paynow")){
    var pAmt=Number(val("qe-pay-amount"))||0;
    if(pAmt>0){
      var accId=val("qe-pay-account")||null;
      var isBank=accountIsBank(accId);
      var payer=isBank?null:(val("qe-pay-payer")||null);
      if(!isBank && !payer && apPartners(aptId).length){
        toast("בחר מי שילם, או חשבון בנק — ההוצאה לא נשמרה","err");
        DB.expenses=DB.expenses.filter(function(x){return x.id!==eid;});
        DB.expenseSplits=DB.expenseSplits.filter(function(s){return s.expenseId!==eid;});
        return false;
      }
      if(pAmt>amount+0.01 && !confirm("התשלום ("+money(pAmt)+") גדול מסכום השלב ("+money(amount)+").\n\nהשלב יסומן \"שולם ביתר\". להמשיך?")){
        DB.expenses=DB.expenses.filter(function(x){return x.id!==eid;});
        DB.expenseSplits=DB.expenseSplits.filter(function(s){return s.expenseId!==eid;});
        return false;
      }
      DB.payments.push({id:uid(),expenseId:eid,date:date,amount:pAmt,accountId:accId,
        payerPartnerId:payer,method:val("qe-pay-method")||"transfer",
        recipientType:"supplier",recipientManagerId:null,
        hasInvoice:false,invoiceLink:"",note:"",deleted:false});
      payMsg=" · נרשם תשלום "+money(pAmt);
    }
  }
  save();
  toast('נוסף השלב "'+desc+'"'+payMsg,"ok");
  go("apartment",{apartmentId:aptId,tab:"expenses"});
}

function openQuickPay(){

function renderQuickPayList(){
  var aptId=val("qp-apt"); var box=document.getElementById("qp-list"); if(!box) return;
  var allOpen=apExpenses(aptId).filter(function(e){ return expenseRemaining(e.id)>0.01; });
  var open=allOpen.filter(function(e){ return matches(Q.quick, e.description+" "+(e.note||"")); })
    .sort(function(x,y){ return x.date<y.date?-1:1; });
  if(!allOpen.length){ box.innerHTML='<div class="empty">✅ כל השלבים בדירה זו שולמו במלואם</div>'; return; }

    '<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>תאריך</th><th>שלב</th><th>סכום</th><th>שולם</th><th>נותר</th><th></th></tr></thead><tbody>';

  open.forEach(function(e){
    var rem=expenseRemaining(e.id); tot+=rem;
    h+='<tr><td>'+dateHe(e.date)+'</td><td><b>'+esc(e.description)+'</b></td>'+
      '<td>'+money(e.amount)+'</td><td>'+money(expensePaid(e.id))+'</td>'+
      '<td class="neg">'+money(rem)+'</td>'+
      '<td class="right"><button class="btn btn-primary btn-sm" onclick="quickPayExpense(\''+e.id+'\')">💳 שלם</button></td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="4">סה"כ נותר בדירה</td><td class="neg">'+money(tot)+'</td><td></td></tr></tfoot></table></div>';

        '<div class="field" id="pm-mgr-wrap" style="display:'+(p&&p.recipientType==="manager"?"block":"none")+'"><label>מנהל</label><select id="pm-manager"><option value="">—</option>'+mgrs.map(function(m){return '<option value="'+m.id+'"'+(p&&p.recipientManagerId===m.id?" selected":"")+'>'+esc(m.name)+'</option>';}).join("")+'</select></div>'
      : '')+
    '<div class="field full"><label><input type="checkbox" id="pm-invoice" style="width:auto" '+(p&&p.hasInvoice?"checked":"")+'> יש חשבונית</label><input id="pm-link" placeholder="קישור לחשבונית (אופציונלי)" value="'+esc(p?p.invoiceLink:"")+'" style="margin-top:4px"></div>'+
    '<div class="field full"><label>הערה</label><input id="pm-note" value="'+esc(p?p.note:"")+'"></div>'+
    '</div>'+
    (partners.length?'<div class="hint">תשלום מחשבון בנק 🏦 יורד מיתרת הבנק ואינו משויך לשותף. תשלום מחשבון שותף נחשב לתרומה שלו.</div>':'');
  openModal({title:payId?"עריכת תשלום":"תשלום חדש",bodyHtml:body,saveLabel:"שמירה",onSave:function(){ return savePayment(eId,payId); }});
  onPmAccount();
}
function onPmAccount(){
  var sel=document.getElementById("pm-account"); if(!sel) return;
  var accId=sel.value; var acc=byId(DB.accounts,accId);
  var payer=document.getElementById("pm-payer");
  if(!payer) return;   // דירה בלי שותפים — אין שדה משלם
  if(acc&&acc.isBank){ payer.value=""; payer.disabled=true; }
  else{ payer.disabled=false; if(acc&&acc.partnerId&&!payer.value) payer.value=acc.partnerId; }
}
function onPmRecipient(){ document.getElementById("pm-mgr-wrap").style.display = val("pm-recipient")==="manager"?"block":"none"; }
function savePayment(eId,payId){
  var e=byId(DB.expenses,eId);
  var amount=Number(val("pm-amount"))||0; if(amount<=0){ toast("סכום לא תקין","err"); return false; }
  var accountId=val("pm-account")||null;
  if(accountId==="__new"){ toast("סיים להוסיף את החשבון או בחר אחר","err"); return false; }
  var isBank=accountIsBank(accountId);
  /* כשאין דמי ניהול על השלב בורר המוטב לא מוצג — ברירת המחדל היא הספק */
  var recipientType=val("pm-recipient")||"supplier";
  var recipientManagerId=recipientType==="manager"?(val("pm-manager")||null):null;
  if(recipientType==="manager"&&!recipientManagerId){ toast("בחר מנהל","err"); return false; }
  var payer=isBank?null:(val("pm-payer")||null);
  /* משלם נדרש רק בדירה שיש בה שותפים — בפרויקט אישי אין את מי לשייך */
  if(!isBank&&!payer&&apPartners(e.apartmentId).length){ toast("בחר מי שילם, או חשבון בנק","err"); return false; }
  // תקרות
  if(recipientType==="supplier"){
    var others=expPayments(eId).filter(function(x){return x.recipientType!=="manager"&&x.id!==payId;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);
    if(others+amount>Number(e.amount)+0.01){
      /* חריגה מהשלב מותרת — אבל רק באישור מפורש, שלא תקרה בטעות הקלדה */
      var over=round2(others+amount-Number(e.amount));
      if(!confirm("שים לב: סך התשלומים ("+money(others+amount)+") יחרוג מסכום השלב ("+money(e.amount)+") ב-"+money(over)+".\n\nהשלב יסומן \"שולם ביתר\". לאשר את התשלום?")) return false;
    }
  }else{
    var cap=mgrFeeLiveOnExpense(eId,recipientManagerId);
    /* האוטומטי ("שווה ערך") לא נספר כאן — הוא יצטמצם בסנכרון ויפנה מקום לידני */
    var othersM=expPayments(eId).filter(function(x){return x.recipientType==="manager"&&x.recipientManagerId===recipientManagerId&&x.id!==payId&&!x.auto;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);
    if(othersM+amount>cap+0.01){ toast("חורג ממה שמגיע למנהל ("+money(cap)+")","err"); return false; }
  }
  var obj={id:payId||uid(),expenseId:eId,date:val("pm-date")||todayISO(),amount:amount,accountId:accountId,
    payerPartnerId:payer,method:val("pm-method"),recipientType:recipientType,recipientManagerId:recipientManagerId,
    hasInvoice:checked("pm-invoice"),invoiceLink:val("pm-link"),note:val("pm-note"),deleted:false};
  if(payId){ Object.assign(byId(DB.payments,payId),obj); } else DB.payments.push(obj);
  syncAutoMgmtPayments(eId);   // ידני חדש מצמצם את האוטומטי בהתאם לתקרה
  save(); toast("התשלום נשמר","ok"); rerender(); openPayments(eId); return false;
}

/* ---------- דמי ניהול (ניהול + לי׳דג׳ר) ---------- */

function copyManagersFrom(aptId){
  var srcs=active(DB.apartments).filter(function(x){ return x.id!==aptId && apManagers(x.id).length; });
  if(!srcs.length){ toast("אין דירה אחרת עם מנהלים מוגדרים","warn"); return; }
  openModal({title:"העתקת מנהלים מדירה אחרת",bodyHtml:
    '<div class="field"><label>מאיזו דירה להעתיק?</label><select id="cm-src">'+
      srcs.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+' — '+apManagers(x.id).length+' מנהלים</option>';}).join("")+
    '</select></div><div class="hint">מנהל שכבר קיים כאן באותו שם לא יועתק שוב.</div>',
    saveLabel:"העתק",onSave:function(){
      var src=val("cm-src"), n=0;
      apManagers(src).forEach(function(m){
        if(apManagers(aptId).some(function(x){return String(x.name).trim()===String(m.name).trim();})) return;

    }});
}

    (can("edit")?'<div class="form-grid">'+

/* פתיחת תשלום למנהל עם המנהל והסכום שנותר ממולאים מראש */
function payManager(eId,mId){
  openPaymentEditor(eId,null);
  var rec=document.getElementById("pm-recipient");
  if(!rec || !Array.prototype.some.call(rec.options,function(o){return o.value==="manager";})){
    toast("דמי ניהול אינם מופעלים על ההוצאה הזאת","err"); closeModal(); return;
  }
  rec.value="manager"; onPmRecipient();
  var sel=document.getElementById("pm-manager"); if(sel) sel.value=mId;
  var due=round2(mgrFeeLiveOnExpense(eId,mId)-mgrPaidOnExpense(eId,mId));
  var amt=document.getElementById("pm-amount"); if(amt && due>0) amt.value=due;

/* ---------- תשלום מרוכז למנהל: סוגרים הרבה שלבים בבת אחת ---------- */
function openBulkPayMgr(aptId,mgrId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var m=byId(DB.managers,mgrId); if(!m) return;

            partners.map(function(ap){return '<option value="'+ap.partnerId+'">'+esc(partnerName(ap.partnerId))+'</option>';}).join("")+'</select></div>'
        : '')+

      '<div class="field full"><label>הערה (תיווסף לכל התשלומים)</label><input id="bp-note" value=""></div>'+
    '</div>'+
    '<div class="section-title">אילו שלבים לשלם</div>'+
    '<div class="toolbar"><button class="btn btn-sm" onclick="bulkPaySelAll(true)">✔️ סמן הכל</button>'+
      '<button class="btn btn-sm" onclick="bulkPaySelAll(false)">✕ נקה</button>'+
      '<div class="sp"></div><span id="bp-total" class="pill"></span></div>'+

function onBpAccount(){
  var payer=document.getElementById("bp-payer"); if(!payer) return;
  var isBank=accountIsBank(val("bp-account"));
  if(isBank){ payer.value=""; payer.disabled=true; } else payer.disabled=false;
}
function bulkPaySelAll(v){ document.querySelectorAll(".bp-x").forEach(function(c){c.checked=v;}); bulkPayTotal(); }
function bulkPayTotal(){
  var n=0,s=0;
  document.querySelectorAll(".bp-x:checked").forEach(function(c){ n++; s+=Number(c.getAttribute("data-rem"))||0; });
  var el=document.getElementById("bp-total");
  if(el) el.textContent="נבחרו "+n+" · סה\"כ "+money(round2(s));
}
function applyBulkPayMgr(aptId,mgrId){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var ids=Array.prototype.map.call(document.querySelectorAll(".bp-x:checked"),function(c){return c.value;});
  if(!ids.length){ toast("לא נבחר אף שלב","err"); return false; }
  var accountId=val("bp-account")||null;
  var isBank=accountIsBank(accountId);
  var payer=isBank?null:(val("bp-payer")||null);
  if(!isBank&&!payer&&apPartners(aptId).length){ toast("בחר מי שילם, או חשבון בנק","err"); return false; }
  var date=val("bp-date")||todayISO(), method=val("bp-method")||"transfer", note=val("bp-note")||"";
  var made=0, sum=0;
  ids.forEach(function(eid){
    /* מחשבים את הנותר מחדש ברגע הרישום — בטוח גם אם משהו השתנה בינתיים */
    var rem=round2(mgrFeeLiveOnExpense(eid,mgrId)-mgrPaidOnExpense(eid,mgrId));
    if(rem<=0.009) return;
    DB.payments.push({id:uid(),expenseId:eid,date:date,amount:rem,accountId:accountId,
      payerPartnerId:payer,method:method,recipientType:"manager",recipientManagerId:mgrId,
      hasInvoice:false,invoiceLink:"",note:note,deleted:false});
    syncAutoMgmtPayments(eid);
    made++; sum+=rem;
  });
  if(!made){ toast("לא נותר מה לשלם בשלבים שנבחרו","warn"); return false; }
  save();
  toast("נרשמו "+made+" תשלומים · "+money(round2(sum)),"ok");
  rerender();
}

function saveAutoMgmt(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var pid=val("am-partner"), pct=Number(val("am-pct"))||0;
  if(!pid){ toast("בחר שותף","err"); return; }
  if(pct<=0||pct>100){ toast("אחוז לא תקין","err"); return; }
  var a=byId(DB.apartments,aptId);
  a.autoMgmt={partnerId:pid,pct:pct};
  syncAutoMgmtApartment(aptId);
  save();
  var n=apExpenses(aptId).filter(function(e){return active(DB.payments).some(function(p){return p.expenseId===e.id&&p.auto;});}).length;
  toast("הופעל — נרשמו תשלומי שווה ערך על "+n+" שלבים","ok");
  rerender();
}
function disableAutoMgmt(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  if(!confirm("לכבות את התשלום האוטומטי?\n\nכל תשלומי השווה-ערך האוטומטיים יוסרו (לסל המחזור). תשלומים ידניים לא נפגעים.")) return;
  var a=byId(DB.apartments,aptId);
  a.autoMgmt=null;
  syncAutoMgmtApartment(aptId);
  save(); toast("כובה — האוטומטיים הוסרו","ok"); rerender();
}
function releaseDeferred(fid){
  var f=byId(DB.expenseManagerFees,fid); f.deferredReleased=true;
  syncAutoMgmtPayments(f.expenseId);   // הזכאות גדלה — האוטומטי מתעדכן

}

  h+='<div class="toolbar"><h3 style="margin:0">הפקדות שותפים</h3><div class="sp"></div>'+
    (can("edit")?'<button class="btn btn-primary btn-sm" onclick="editDeposit(null,\''+aptId+'\')">➕ הפקדה</button>':'')+'</div>';
  h+='<div class="table-wrap"><table class="tbl"><thead><tr><th>תאריך</th><th>שותף</th><th>סכום</th><th>הערה</th><th></th></tr></thead><tbody>';

      '<td class="right">'+(can("edit")?'<button class="btn btn-ghost btn-sm" onclick="editDeposit(\''+d.id+'\',\''+aptId+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="softDelete(\'deposits\',\''+d.id+'\',\'למחוק הפקדה?\')">🗑️</button>':'')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  // תשלומים מהבנק
  var expIds={}; apExpenses(aptId).forEach(function(e){expIds[e.id]=1;});

  h+='<div class="card" style="margin-top:16px"><h3>תשלומים שיצאו מהבנק</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>תאריך</th><th>עבור</th><th>סכום</th></tr></thead><tbody>';

    var e=byId(DB.expenses,p.expenseId);
    h+='<tr><td>'+dateHe(p.date)+'</td><td>'+esc(e?e.description:"—")+(p.recipientType==="manager"?" — דמי ניהול":"")+'</td><td>'+money(p.amount)+'</td></tr>';

/* ============================================================
   דוח "לפי מה ששולם בפועל" + התחשבנות בין השותפים
   שלב 1,000,000 שבו שולמו 500,000: שותף 25% חייב כרגע 125,000.
   ============================================================ */
function dueByPaidReportHtml(aptId){
  var pids=reportPartnerIds(aptId);
  if(!pids.length) return "";
  var exps=apExpenses(aptId);
  var totalCost=0,totalOut=0;
  exps.forEach(function(e){ totalCost+=(Number(e.amount)||0)+expenseMgmtCostLive(e.id); totalOut+=expenseOutflow(e.id); });
  if(totalOut<=0.01) return '<div class="card"><h3>⚖️ חובה לפי מה ששולם בפועל</h3>'+
    '<div class="empty">עדיין לא נרשמו תשלומים בפרויקט</div></div>';

  var bal={}, rows="", tDue=0,tPaid=0,tFull=0;
  pids.forEach(function(pid){
    var due=partnerDueByPaid(aptId,pid);       // חלקו במה שכבר יצא
    var paid=partnerPaid(aptId,pid);           // מה שהוא הכניס בפועל
    var full=partnerShouldPay(aptId,pid);      // חלקו בעלות המלאה
    bal[pid]=round2(paid-due);
    tDue+=due; tPaid+=paid; tFull+=full;
    var b=paid-due;
    rows+='<tr><td><b>'+esc(partnerName(pid))+'</b></td>'+
      '<td>'+(partnerDefaultPct(aptId,pid)!=null?num(partnerDefaultPct(aptId,pid))+"%":"—")+'</td>'+
      '<td>'+money(full)+'</td>'+
      '<td><b>'+money(due)+'</b></td>'+
      '<td>'+money(paid)+'</td>'+
      '<td class="'+(b<-0.01?"neg":"pos")+'"><b>'+money(b)+'</b>'+
        (b<-0.01?' <span class="badge badge-danger">חייב</span>':b>0.01?' <span class="badge badge-ok">זכאי</span>':'')+'</td>'+
      '<td>'+money(round2(full-due))+'</td></tr>';
  });

  var pct=totalCost>0?(totalOut/totalCost*100):0;
  var h='<div class="card"><h3>⚖️ חובה לפי מה ששולם בפועל</h3>'+
    '<div class="stat-grid">'+
      stat("עלות מלאה של הפרויקט",money(totalCost))+
      stat("שולם בפועל עד כה",money(totalOut),"pos")+
      stat("אחוז ההתקדמות",num(round2(pct))+"%")+
      stat("סך החובה לפי ששולם",money(tDue))+
    '</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr>'+
      '<th>שותף</th><th>% ברירת מחדל</th><th>חלקו בעלות המלאה</th>'+
      '<th>חייב כרגע (לפי ששולם)</th><th>הכניס בפועל</th><th>הפרש</th><th>יתרה לעתיד</th>'+
    '</tr></thead><tbody>'+rows+
    '</tbody><tfoot><tr><td colspan="2">סה"כ</td><td>'+money(tFull)+'</td><td>'+money(tDue)+'</td>'+
      '<td>'+money(tPaid)+'</td><td class="'+((tPaid-tDue)<-0.01?"neg":"pos")+'">'+money(tPaid-tDue)+'</td>'+
      '<td>'+money(round2(tFull-tDue))+'</td></tr></tfoot></table></div>'+
    '<div class="hint"><b>חייב כרגע</b> = לכל שלב, האחוז שלו × הסכום שכבר שולם באותו שלב. '+
    'זו החובה האמיתית היום, בניגוד ל"חלקו בעלות המלאה" שכולל גם שלבים שטרם שולמו. '+
    '<b>יתרה לעתיד</b> = מה שעוד יגיע לו לשלם כשיושלמו כל השלבים.</div>';

  /* התחשבנות: מי מעביר למי */
  var plan=settlementPlan(bal);
  h+='<div class="section-title">🤝 התחשבנות בין השותפים</div>';
  if(!plan.length){
    h+='<div class="hint pos">✅ כולם מאוזנים ביחס למה שכבר שולם — אין העברות נדרשות.</div>';
  }else{
    h+='<div class="table-wrap"><table class="tbl"><thead><tr>'+
      '<th>מעביר</th><th></th><th>מקבל</th><th>סכום</th></tr></thead><tbody>'+
      plan.map(function(x){
        return '<tr><td class="neg"><b>'+esc(partnerName(x.from))+'</b></td>'+
          '<td class="muted">←</td><td class="pos"><b>'+esc(partnerName(x.to))+'</b></td>'+
          '<td><b>'+money(x.amount)+'</b></td></tr>'; }).join("")+
      '</tbody><tfoot><tr><td colspan="3">סה"כ להעברה</td><td>'+
      money(round2(plan.reduce(function(s,x){return s+x.amount;},0)))+'</td></tr></tfoot></table></div>'+
      '<div class="hint">התוכנית מחושבת במינימום העברות: מי שהכניס פחות מחלקו מעביר למי שהכניס יותר.</div>';
  }

  /* מטריצת "מי שילם יותר ממי" */
  if(pids.length>1){
    h+='<div class="section-title">📊 השוואה בין כל שני שותפים</div>'+
      '<div class="table-wrap"><table class="tbl"><thead><tr><th>שותף</th>'+
      pids.map(function(p){return '<th>'+esc(partnerName(p))+'</th>';}).join("")+'</tr></thead><tbody>'+
      pids.map(function(a){
        return '<tr><td><b>'+esc(partnerName(a))+'</b></td>'+
          pids.map(function(b){
            if(a===b) return '<td class="muted">—</td>';
            var d=round2(bal[a]-bal[b]);
            return '<td class="'+(d>0.01?"pos":d<-0.01?"neg":"muted")+'">'+
              (Math.abs(d)<0.01?"שווה":(d>0?"+":"")+money(d))+'</td>';

  }

}

   דוח שותפים — כמה כל שותף אמור לשלם על כל שלב, לפי אחוזיו
   כולל את חלקו בדמי הניהול, כך שהסיכום תואם לדוח המשלמים.
   ============================================================ */
var PR={mode:"matrix",partner:"",q:""};
function renderPartnerReport(){
  var el=document.getElementById("partner-report");
  if(el) el.innerHTML=partnerReportHtml(state.params.apartmentId);
}
/* חלקו של שותף בשלב: אחוז × (סכום ההוצאה + דמי הניהול הפעילים) */
function partnerShareInExpense(eId,pid){
  var e=byId(DB.expenses,eId); if(!e) return 0;
  var pct=partnerPctInExpense(eId,pid)/100; if(!pct) return 0;
  return round2(pct*((Number(e.amount)||0)+expenseMgmtCostLive(eId)));
}
/* ============================================================
   חובה לפי מה ששולם בפועל
   ------------------------------------------------------------
   שלב של 1,000,000 שבו שולמו 500,000 בלבד: שותף עם 25% חייב
   כרגע 125,000 ולא 250,000. כך רואים מי מפגר מול מה שכבר יצא
   מהכיס בפועל, ולא מול העלות המלאה שעוד לא שולמה.
   ============================================================ */
function expenseOutflow(eId){          // כל הכסף שיצא על השלב: לספק ולמנהלים
  return round2(expPayments(eId).reduce(function(s,p){ return s+(Number(p.amount)||0); },0));
}
function partnerDueByPaid(aptId,pid){  // חלקו במה שכבר שולם
  return round2(apExpenses(aptId).reduce(function(s,e){
    var pct=partnerPctInExpense(e.id,pid)/100;
    return pct ? s+pct*expenseOutflow(e.id) : s;
  },0));
}
function partnerDueByPaidOnExpense(eId,pid){
  var pct=partnerPctInExpense(eId,pid)/100;
  return pct ? round2(pct*expenseOutflow(eId)) : 0;
}
/* התחשבנות בין שותפים: מי מעביר למי, במינימום העברות */
function settlementPlan(balances){
  var cred=[],deb=[];
  Object.keys(balances).forEach(function(pid){
    var v=round2(balances[pid]);
    if(v>0.01) cred.push({pid:pid,amt:v});        // שילם יותר — מגיע לו
    else if(v<-0.01) deb.push({pid:pid,amt:-v});  // שילם פחות — חייב
  });
  cred.sort(function(a,b){return b.amt-a.amt;});
  deb.sort(function(a,b){return b.amt-a.amt;});
  var out=[],i=0,j=0;
  while(i<deb.length && j<cred.length){
    var m=Math.min(deb[i].amt,cred[j].amt);
    if(m>0.01) out.push({from:deb[i].pid,to:cred[j].pid,amount:round2(m)});
    deb[i].amt=round2(deb[i].amt-m); cred[j].amt=round2(cred[j].amt-m);
    if(deb[i].amt<=0.01) i++;
    if(cred[j].amt<=0.01) j++;
  }
  return out;
}

/* כמה השותף שילם בפועל על השלב (תשלומיו הישירים, לא מהבנק) */
function partnerPaidOnExpense(eId,pid){
  return round2(expPayments(eId).filter(function(p){
    return p.payerPartnerId===pid && !accountIsBank(p.accountId);
  }).reduce(function(s,p){ return s+(Number(p.amount)||0); },0));
}

function copyPartnerReport(){
  var box=document.getElementById("partner-report");
  var tbl=box&&box.querySelector("table.tbl");
  if(!tbl){ toast("אין טבלה להעתקה","warn"); return; }
  var lines=[];
  tbl.querySelectorAll("tr").forEach(function(tr){
    var cells=[];
    tr.querySelectorAll("th,td").forEach(function(c){
      cells.push(String(c.innerText||"").replace(/\s+/g," ").trim());
    });
    if(cells.join("").trim()) lines.push(cells.join("\t"));
  });
  try{ navigator.clipboard.writeText(lines.join("\n")); toast("הדוח הועתק — אפשר להדביק באקסל","ok"); }
  catch(e){ toast("לא ניתן להעתיק בדפדפן הזה","err"); }
}

function renderPartnersTable(){
  var el=document.getElementById("pt-table"); if(el) el.innerHTML=partnersTableHtml();
}
function partnersTableHtml(){
  var all=active(DB.partners);
  var list=all.filter(function(p){ return matches(Q.partners, p.name+" "+(p.phone||"")+" "+(p.notes||"")); });
  var cnt=document.getElementById("pt-count");
  if(cnt) cnt.innerHTML=countLine(list.length,all.length,"שותפים");
  if(!list.length) return '<div class="empty">לא נמצא שותף שמתאים לחיפוש</div>';
  var h='<div class="table-wrap"><table class="tbl"><thead><tr><th>שם</th><th>טלפון</th><th>הערות</th><th></th></tr></thead><tbody>';
  list.forEach(function(p){
    h+='<tr><td>'+esc(p.name)+'</td><td>'+esc(p.phone||"")+'</td><td>'+esc(p.notes||"")+'</td>'+
      '<td class="right"><button class="btn btn-ghost btn-sm" onclick="editPartner(\''+p.id+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="softDelete(\'partners\',\''+p.id+'\',\'למחוק שותף?\')">🗑️</button></td></tr>';
  });
  return h+'</tbody></table></div>';
}
/* ---------- ניהול אמצעי תשלום ---------- */
function addPaymentMethod(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  openModal({title:"אמצעי תשלום חדש",bodyHtml:
    '<div class="field"><label>שם האמצעי</label><input id="pmth-name" placeholder="למשל: הוראת קבע, ביט, פייבוקס"></div>',
    onSave:function(){
      var nm=val("pmth-name").trim(); if(!nm){ toast("יש להזין שם","err"); return false; }
      refreshMethods();
      if(Object.keys(METHODS).some(function(k){ return normKey(METHODS[k])===normKey(nm); })){
        toast("האמצעי כבר קיים","err"); return false; }
      DB.settings=DB.settings||{}; DB.settings.paymentMethods=DB.settings.paymentMethods||{};
      var k=normKey(nm).replace(/[^\w֐-׿]+/g,"_").slice(0,30)||("m"+Date.now().toString(36));
      DB.settings.paymentMethods[k]=nm;
      save(); refreshMethods(); toast("נוסף","ok"); rerender();
    }});
}
function delPaymentMethod(k){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  if(METHODS_BASE[k]){ toast("אמצעי מובנה — לא ניתן למחוק","err"); return; }
  var used=active(DB.payments).filter(function(p){return p.method===k;}).length;
  if(used){ toast("האמצעי משמש ב-"+used+" תשלומים — לא ניתן למחוק","err"); return; }
  if(!confirm('למחוק את אמצעי התשלום "'+METHODS[k]+'"?')) return;
  delete DB.settings.paymentMethods[k];
  save(); refreshMethods(); toast("נמחק","ok"); rerender();
}

/* ---------- ניהול חשבונות ---------- */
function editAccount(id){
  var ac=id?byId(DB.accounts,id):{name:"",isBank:false,apartmentId:null};
  var apts=active(DB.apartments);
  openModal({title:id?"עריכת חשבון":"חשבון חדש",bodyHtml:
    '<div class="field"><label>שם החשבון</label><input id="ac-name" value="'+esc(ac.name)+'" placeholder="למשל: מרכנתיל / חשבון יונה"></div>'+
    '<div class="field"><label>שיוך</label><select id="ac-apt"><option value="">כללי — זמין בכל הפרויקטים</option>'+
      apts.map(function(a){return '<option value="'+a.id+'"'+(ac.apartmentId===a.id?" selected":"")+'>'+esc(a.name)+'</option>';}).join("")+
    '</select></div>'+
    '<div class="field"><label style="font-weight:400"><input type="checkbox" id="ac-bank" style="width:auto" '+(ac.isBank?"checked":"")+'> זהו <b>בנק זמני</b> (קופה משותפת)</label>'+
      '<div class="hint">תשלום מחשבון כזה יורד מיתרת הבנק ואינו נחשב תרומה של שותף מסוים</div></div>',
    onSave:function(){
      var nm=val("ac-name").trim(); if(!nm){ toast("יש להזין שם","err"); return false; }
      if(id){ ac.name=nm; ac.isBank=checked("ac-bank"); ac.apartmentId=val("ac-apt")||null; }
      else{
        var k=normKey(nm);
        if(active(DB.accounts).some(function(x){return normKey(x.name)===k && (x.apartmentId||null)===(val("ac-apt")||null);})){
          toast("כבר קיים חשבון בשם הזה","err"); return false;
        }
        DB.accounts.push({id:uid(),apartmentId:val("ac-apt")||null,name:nm,isBank:checked("ac-bank"),partnerId:null,deleted:false});
      }
      save(); toast("נשמר","ok"); rerender();
    }});
}
function delAccount(id){
  var used=active(DB.payments).filter(function(p){return p.accountId===id;}).length;
  var ac=byId(DB.accounts,id);
  if(used){ toast('אי אפשר למחוק — "'+ac.name+'" משמש ב-'+used+' תשלומים',"err"); return; }
  softDelete("accounts",id,'למחוק את החשבון "'+ac.name+'"?');
}
/* רשימת החשבונות שבשימוש בפועל אצל המשתמש */
function seedCommonAccounts(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var list=["פרטי","פאגי","הלואה מיוחדת","מרכנתיל","אשראי חיליק","משכנתא","מזרחי","אמריקה",
    "בנצי אמרי מנחם","לסידור","אמרי מנחם","חשבון יונה","יהב","סקיי גייט","חיליק","טריה",
    "סיבובי פאגי","שווה ערך","חול","דיסקונט","דיסקונט הרשי","חשבן אחר","פועלים","פרלמן יונה אמרי"];
  var added=0, skipped=0;
  list.forEach(function(nm){
    var k=normKey(nm);
    if(active(DB.accounts).some(function(x){ return normKey(x.name)===k && !x.apartmentId; })){ skipped++; return; }
    DB.accounts.push({id:uid(),apartmentId:null,name:nm,isBank:false,partnerId:null,deleted:false}); added++;
  });
  if(!added){ toast("כל החשבונות כבר קיימים","warn"); return; }
  save(); toast("נוספו "+added+" חשבונות"+(skipped?" · "+skipped+" כבר היו":""),"ok"); rerender();
}

      save(); toast("נשמר","ok"); rerender(); }});

/* ---------- מחיקה מרוכזת (רכה — הכל לסל המחזור) ---------- */
function deleteAllExpenses(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var exps=active(DB.expenses);
  if(!exps.length){ toast("אין הוצאות למחיקה","warn"); return; }
  var ids={}; exps.forEach(function(e){ ids[e.id]=1; });
  var pays=active(DB.payments).filter(function(p){return ids[p.expenseId];});
  if(!confirm("יימחקו "+exps.length+" הוצאות ו-"+pays.length+" תשלומים שלהן.\n\n"+
    "הכל עובר לסל המחזור וניתן לשחזר.\nהדירות, השותפים והאחוזים יישארו.\n\nלהמשיך?")) return;
  exps.forEach(function(e){ e.deleted=true; });
  pays.forEach(function(p){ p.deleted=true; });
  save(); toast("נמחקו "+exps.length+" הוצאות ו-"+pays.length+" תשלומים","ok"); rerender();
}
function deleteAllPayments(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var pays=active(DB.payments);
  if(!pays.length){ toast("אין תשלומים למחיקה","warn"); return; }
  if(!confirm("יימחקו "+pays.length+" תשלומים.\n\nהכל עובר לסל המחזור וניתן לשחזר.\n\nלהמשיך?")) return;
  pays.forEach(function(p){ p.deleted=true; });
  save(); toast("נמחקו "+pays.length+" תשלומים","ok"); rerender();
}
/* ---------- איחוד דירות כפולות ----------
   "הלפרין  17" (רווח כפול) ו"הלפרין 17" נוצרו כשתי דירות. המיזוג מעביר
   את כל התנועות לדירת היעד ומעביר את הכפולה לסל המחזור. */
function mergeApartments(srcId,dstId){
  if(srcId===dstId) return 0;
  var src=byId(DB.apartments,srcId), dst=byId(DB.apartments,dstId);
  if(!src||!dst) return 0;
  var moved=0;
  // הוצאות (החלוקות, דמי הניהול והתשלומים שלהן עוברים איתן דרך expenseId)
  active(DB.expenses).forEach(function(e){ if(e.apartmentId===srcId){ e.apartmentId=dstId; moved++; } });
  // שותפי דירה — לא מכפילים שותף שכבר קיים ביעד
  var dstP={}; apPartners(dstId).forEach(function(x){ dstP[x.partnerId]=1; });
  active(DB.apartmentPartners).forEach(function(x){
    if(x.apartmentId!==srcId) return;
    if(dstP[x.partnerId]){ x.deleted=true; x.deletedBy="merged:"+dstId; }
    else { x.apartmentId=dstId; dstP[x.partnerId]=1; }
  });
  // מנהלים — אותו שם ביעד: מפנים אליו את דמי הניהול והתשלומים
  active(DB.managers).forEach(function(m){
    if(m.apartmentId!==srcId) return;
    var twin=apManagers(dstId).find(function(t){ return normKey(t.name)===normKey(m.name); });
    if(twin){
      DB.expenseManagerFees.forEach(function(f){ if(f.managerId===m.id) f.managerId=twin.id; });
      DB.payments.forEach(function(p){ if(p.recipientManagerId===m.id) p.recipientManagerId=twin.id; });
      m.deleted=true; m.deletedBy="merged:"+dstId;
    } else m.apartmentId=dstId;
  });
  // חשבונות — אותו שם ביעד: מפנים אליו את התשלומים
  active(DB.accounts).forEach(function(ac){
    if(ac.apartmentId!==srcId) return;
    var twin=apAccounts(dstId).find(function(t){ return normKey(t.name)===normKey(ac.name); });
    if(twin){
      DB.payments.forEach(function(p){ if(p.accountId===ac.id) p.accountId=twin.id; });
      ac.deleted=true; ac.deletedBy="merged:"+dstId;
    } else ac.apartmentId=dstId;
  });
  active(DB.deposits).forEach(function(d){ if(d.apartmentId===srcId){ d.apartmentId=dstId; moved++; } });
  active(DB.income).forEach(function(i){ if(i.apartmentId===srcId){ i.apartmentId=dstId; moved++; } });
  if(src.hasBank) dst.hasBank=true;
  if(src.hasManagement) dst.hasManagement=true;
  if(src.notes && !dst.notes) dst.notes=src.notes;
  src.deleted=true; src.deletedBy="merged:"+dstId;
  return moved;
}

/* מפרסר טקסט מופרד שמכבד מרכאות — תא באקסל יכול להכיל ירידת שורה,
   ואז הוא מגיע עטוף במרכאות. פיצול נאיבי לפי \n שבר שורות כאלה לשתיים. */
function parseDelimited(raw,sep){
  var rows=[], row=[], field="", i=0, inQ=false;
  while(i<raw.length){
    var c=raw.charAt(i);
    if(inQ){
      if(c==='"'){
        if(raw.charAt(i+1)==='"'){ field+='"'; i+=2; continue; }
        inQ=false; i++; continue;
      }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c===sep){ row.push(field); field=""; i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ row.push(field); field=""; rows.push(row); row=[]; i++; continue; }
    field+=c; i++;
  }
  if(field!=="" || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); })
             .map(function(r){ return r.map(function(c){ return String(c).replace(/\s+/g," ").trim(); }); });
}
/* מפתח השוואה סלחני: מאחד גרשיים/אפוסטרופים, רווחים כפולים, ורישיות.
   באקסל אותו שם נכתב לפעמים עם ׳ ולפעמים עם ', או עם רווח כפול. */
function normKey(s){
  return String(s==null?"":s)
    .replace(/[‘’׳ʼ'`´]/g,"'")
    .replace(/[“”״"]/g,'"')
    .replace(/[‎‏‪-‮]/g,"")
    .replace(/\s+/g," ")
    .trim().toLowerCase();
}
function impNum(v){ var n=parseFloat(String(v==null?"":v).replace(/[^\d.\-]/g,"")); return isFinite(n)?n:0; }

    rd.readAsArrayBuffer(f);
  }else{
    rd.onload=function(){
      var txt=rd.result;
      // אקסל עברי שומר CSV ב-Windows-1255; אם רואים הרבה תווי החלפה — קוראים שוב בקידוד הנכון
