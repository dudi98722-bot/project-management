function toggleQuickMgmt(){
  var d=document.getElementById("qe-mgmt-details");
  if(d) d.style.display=checked("qe-mgmt")?"block":"none";
  updateQuickMgmtPreview();
}
function updateQuickMgmtPreview(){
  var el=document.getElementById("qe-mgmt-prev"); if(!el) return;
  if(!checked("qe-mgmt")){ el.innerHTML=""; return; }
  var amt=Number(val("qe-amount"))||0;
  var bt=val("qe-base")||"full";
  var base = bt==="net17" ? amt/1.17 : bt==="net18" ? amt/1.18 : amt;
  var vat=1+(Number(val("qe-vat"))||0)/100;
  var cur=0, def=0;
  apManagers(val("qe-apt")).forEach(function(m){
    cur+=base*(Number(val("qe-mf-cur-"+m.id))||0)/100*vat;
    def+=base*(Number(val("qe-mf-def-"+m.id))||0)/100*vat;
  });
  el.innerHTML=amt?('דמי ניהול פעילים: <b>'+money(round2(cur))+'</b>'+
    (def>0.005?' · דחוי (עד השחרור): <b>'+money(round2(def))+'</b>':'')):
    'הזן סכום להוצאה כדי לראות את דמי הניהול המחושבים';
}
/* בחירת שלב-אב בהוצאה מהירה. נבנית מחדש רק כשמחליפים דירה,
   כדי שהבחירה לא תתאפס בכל הקלדה בשדה הסכום. */
var _qeParentApt=null;
function renderQuickParent(aptId){
  var box=document.getElementById("qe-parent-box"); if(!box) return;
  if(_qeParentApt===aptId) return;
  _qeParentApt=aptId;
  var preset=(state.view==="apartment"&&state.params.quickParent)||"";
  box.innerHTML='<label>שייך לשלב-אב (תת-שלב)</label>'+
    '<select id="qe-parent" onchange="renderQuickExpenseInfo()">'+expenseParentOptions(aptId,null,preset)+'</select>'+
    '<div class="hint">בחר שלב קיים כדי שההוצאה הזו תהיה תת-שלב שלו — למשל "חשמל 6-22" תחת "חשמל". '+
    'סכום שלב-האב הוא תמיד סך תתי-השלבים שלו.</div>';
}
function renderQuickExpenseInfo(){ return withIndex(function(){ return renderQuickExpenseInfoInner(); }); }
function renderQuickExpenseInfoInner(){
  var box=document.getElementById("qe-info"); if(!box) return;
  var aptId=val("qe-apt"); var a=byId(DB.apartments,aptId);
  renderQuickParent(aptId);
  renderQuickMgmt(aptId);
  updateQuickMgmtPreview();
  var amt=Number(val("qe-amount"))||0;
  var parts=apPartners(aptId);
  var h="";
  if(!parts.length){
    h='<div class="hint">בדירה זו לא הוגדרו שותפים — ההוצאה תישמר <b>ללא חלוקה</b>.</div>';
  }else{
    var sum=parts.reduce(function(s,p){return s+(Number(p.defaultPercent)||0);},0);
    h='<div class="section-title">חלוקה לפי ברירת המחדל של הדירה</div>'+
      '<div class="table-wrap"><table class="tbl"><thead><tr><th>שותף</th><th>אחוז</th><th>חלקו</th></tr></thead><tbody>'+
      parts.map(function(p){
        return '<tr><td>'+esc(partnerName(p.partnerId))+'</td><td>'+num(p.defaultPercent)+'%</td>'+
          '<td><b>'+money(amt*(Number(p.defaultPercent)||0)/100)+'</b></td></tr>'; }).join("")+
      '</tbody><tfoot><tr><td>סה"כ</td><td class="'+(Math.abs(sum-100)<0.01?"pos":"neg")+'">'+num(sum)+'%</td>'+
      '<td>'+money(amt)+'</td></tr></tfoot></table></div>'+
      (Math.abs(sum-100)>=0.01?'<div class="hint neg">שים לב: אחוזי ברירת המחדל בדירה אינם 100%.</div>':'')+
      '<div class="hint">אפשר לשנות את החלוקה אחרי השמירה, בעריכת השלב.</div>';
  }
  box.innerHTML=h;
  if(checked("qe-paynow")) renderQuickPayNow(aptId);
}
function toggleQuickPayNow(){
  var w=document.getElementById("qe-pay"); if(!w) return;
  if(checked("qe-paynow")){ w.style.display="block"; renderQuickPayNow(true); }
  else w.style.display="none";
}
/* בלוק התשלום נבנה רק כשמשתנה הדירה — הקלדה בשדה הסכום לא מוחקת
   את החשבון, המשלם והאמצעי שכבר נבחרו. סכום התשלום ממשיך לעקוב אחרי
   סכום ההוצאה עד לרגע שבו המשתמש עורך אותו ידנית. */
var _qePayBuilt=false, _qePayApt=null, _qePayTouched=false;
function renderQuickPayNow(force){
  var w=document.getElementById("qe-pay"); if(!w) return;
  var aptId=val("qe-apt");
  var amt=Number(val("qe-amount"))||0;
  if(_qePayBuilt && _qePayApt===aptId && force!==true){
    var af=document.getElementById("qe-pay-amount");
    if(af && !_qePayTouched) af.value=amt||"";
    return;
  }
  _qePayBuilt=true; _qePayApt=aptId; _qePayTouched=false;
  var parts=apPartners(aptId);
  w.innerHTML='<div class="form-grid">'+
    '<div class="field"><label>סכום התשלום</label><input id="qe-pay-amount" type="number" step="0.01" oninput="_qePayTouched=true" value="'+(amt||"")+'"></div>'+
    '<div class="field"><label>מהחשבון</label><select id="qe-pay-account" onchange="onQuickPayAccount()">'+
      '<option value="">— ידני / ללא חשבון —</option>'+
      availAccounts(aptId).map(function(ac){
        return '<option value="'+ac.id+'">'+esc(ac.name)+(ac.isBank?" 🏦 (בנק זמני)":"")+'</option>'; }).join("")+
    '</select></div>'+
    (parts.length
      ? '<div class="field"><label>מי שילם</label><select id="qe-pay-payer"><option value="">—</option>'+
          parts.map(function(p){return '<option value="'+p.partnerId+'">'+esc(partnerName(p.partnerId))+'</option>';}).join("")+
        '</select></div>'
      : '')+
    '<div class="field"><label>אמצעי תשלום</label><select id="qe-pay-method" onchange="onMethodPick(\'qe-pay-method\')">'+methodOptions("transfer")+'</select></div>'+
  '</div>';
}
function onQuickPayAccount(){
  var payer=document.getElementById("qe-pay-payer"); if(!payer) return;
  if(accountIsBank(val("qe-pay-account"))){ payer.value=""; payer.disabled=true; }
  else payer.disabled=false;
}
function saveQuickExpense(){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var aptId=val("qe-apt");
  var desc=val("qe-desc").trim();
  var amount=Number(val("qe-amount"))||0;
  if(!desc){ toast("יש להזין תיאור","err"); return false; }
  if(amount<=0){ toast("יש להזין סכום","err"); return false; }
  var date=val("qe-date")||todayISO();
  /* הגנה מכפילות — כמו בייבוא: אותה דירה + תיאור + סכום + תאריך */
  var dup=apExpenses(aptId).find(function(x){
    return normKey(x.description)===normKey(desc) && Math.abs((Number(x.amount)||0)-amount)<0.01 && x.date===date; });
  if(dup && !confirm('כבר קיים שלב "'+dup.description+'" באותו סכום ותאריך.\n\nלהוסיף בכל זאת?')) return false;

  /* ---- כל הוולידציות והאישורים לפני שנוגעים ב-DB ----
     convertToContainer מפצל שלב קיים לאב+תת-שלב ומעביר אליו חלוקה,
     דמי ניהול ותשלומים. אם ולידציה מאוחרת הייתה נכשלת, הגלגול-אחור
     היה מסיר רק את ההוצאה החדשה והפיצול היה נשאר. */
  var qParent=val("qe-parent")||"";
  if(qParent==="__new") qParent="";
  if(qParent){
    var pe=byId(DB.expenses,qParent);
    if(!pe || pe.apartmentId!==aptId || pe.parentId){ toast("שלב-האב שנבחר אינו תקין","err"); return false; }
  }
  var payNow=checked("qe-paynow"), pAmt=0, accId=null, isBank=false, payer=null;
  if(payNow){
    pAmt=Number(val("qe-pay-amount"))||0;
    if(pAmt>0){
      accId=val("qe-pay-account")||null;
      isBank=accountIsBank(accId);
      payer=isBank?null:(val("qe-pay-payer")||null);
      if(!isBank && !payer && apPartners(aptId).length){
        toast("בחר מי שילם, או חשבון בנק — ההוצאה לא נשמרה","err"); return false;
      }
      if(pAmt>amount+0.01 && !confirm("התשלום ("+money(pAmt)+") גדול מסכום השלב ("+money(amount)+").\n\nהשלב יסומן \"שולם ביתר\". להמשיך?")) return false;
    }
  }
  /* מכאן והלאה משנים נתונים — אין עוד ביטולים */
  if(qParent && !convertToContainer(qParent)) return false;

  var mgmtOn = !!document.getElementById("qe-mgmt") && checked("qe-mgmt");
  var mgmtVatRaw = Number(val("qe-vat"));
  var eid=uid();
  DB.expenses.push({id:eid,apartmentId:aptId,categoryId:(val("qe-cat")==="__new"?"":val("qe-cat")||""),
    classification:val("qe-class")||"investment",
    description:desc,amount:amount,date:date,note:val("qe-note")||"",
    hasInvoice:false,invoiceLink:"",
    mgmtEnabled:mgmtOn,
    mgmtBaseType:mgmtOn?(val("qe-base")||"full"):"full",
    mgmtVatRate:mgmtOn?(isNaN(mgmtVatRaw)?18:mgmtVatRaw):18,
    parentId:qParent||null,deleted:false});
  apPartners(aptId).forEach(function(p){
    DB.expenseSplits.push({id:uid(),expenseId:eid,partnerId:p.partnerId,percent:p.defaultPercent,deleted:false});
  });
  if(mgmtOn){
    apManagers(aptId).forEach(function(m){
      DB.expenseManagerFees.push({id:uid(),expenseId:eid,managerId:m.id,
        pctCurrent:Number(val("qe-mf-cur-"+m.id))||0,
        pctDeferred:Number(val("qe-mf-def-"+m.id))||0,
        deferredLabel:val("qe-mf-lbl-"+m.id)||"",deferredReleased:false,deleted:false});
    });
    syncAutoMgmtPayments(eid);   // תשלום "שווה ערך" אוטומטי, אם מוגדר בפרויקט
  }

  var payMsg="";
  if(payNow){
    if(pAmt>0){
      DB.payments.push({id:uid(),expenseId:eid,date:date,amount:pAmt,accountId:accId,
        payerPartnerId:payer,method:val("qe-pay-method")||"transfer",
        recipientType:"supplier",recipientManagerId:null,
        hasInvoice:false,invoiceLink:"",note:"",deleted:false});
      payMsg=" · נרשם תשלום "+money(pAmt);
    }
  }
  if(qParent) syncParentAmount(qParent);   // סכום שלב-האב = סך תתי-השלבים
  save();
  toast('נוסף '+(qParent?'תת-השלב "'+desc+'" תחת "'+expDesc(qParent)+'"':'השלב "'+desc+'"')+payMsg,"ok");
  go("apartment",{apartmentId:aptId,tab:"expenses"});
}

/* ---------- תשלום מהיר: בחר דירה → בחר שלב שטרם שולם במלואו ---------- */
function openQuickPay(){
  var apts=active(DB.apartments).filter(function(a){return canSeeApartment(a.id);});
  if(!apts.length){ toast("אין דירות במערכת","err"); return; }
  var cur=state.params.apartmentId||apts[0].id;
  openModal({title:"💳 תשלום מהיר",wide:true,bodyHtml:
    '<div class="field"><label>בחר דירה</label><select id="qp-apt" onchange="renderQuickPayList()">'+
      apts.map(function(a){return '<option value="'+a.id+'"'+(a.id===cur?" selected":"")+'>'+esc(a.name)+'</option>';}).join("")+
    '</select></div>'+
    '<div class="field">'+searchBox("qp-q",Q.quick,"חיפוש שלב…","Q.quick=this.value;renderQuickPayList()")+'</div>'+
    '<div id="qp-list"></div>'});
  renderQuickPayList();
}
function renderQuickPayList(){ return withIndex(function(){ return renderQuickPayListInner(); }); }
function renderQuickPayListInner(){
  var aptId=val("qp-apt"); var box=document.getElementById("qp-list"); if(!box) return;
  var allOpen=apLeafExpenses(aptId).filter(function(e){ return expenseRemaining(e.id)>0.01; });
  var open=allOpen.filter(function(e){ return matches(Q.quick, e.description+" "+(e.note||"")); })
    .sort(function(x,y){ return x.date<y.date?-1:1; });
  if(!allOpen.length){ box.innerHTML='<div class="empty">✅ כל השלבים בדירה זו שולמו במלואם</div>'; return; }
  if(!open.length){ box.innerHTML='<div class="empty">לא נמצא שלב שמתאים לחיפוש</div>'; return; }
  var h='<div class="section-title">שלבים שטרם שולמו במלואם ('+open.length+
    (open.length!==allOpen.length?' מתוך '+allOpen.length:'')+')</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>תאריך</th><th>שלב</th><th>סכום</th><th>שולם</th><th>נותר</th><th></th></tr></thead><tbody>';
  var tot=0;
  open.forEach(function(e){
    var rem=expenseRemaining(e.id); tot+=rem;
    h+='<tr><td>'+dateHe(e.date)+'</td><td><b>'+esc(e.description)+'</b></td>'+
      '<td>'+money(e.amount)+'</td><td>'+money(expensePaid(e.id))+'</td>'+
      '<td class="neg">'+money(rem)+'</td>'+
      '<td class="right"><button class="btn btn-primary btn-sm" onclick="quickPayExpense(\''+e.id+'\')">💳 שלם</button></td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="4">סה"כ נותר בדירה</td><td class="neg">'+money(tot)+'</td><td></td></tr></tfoot></table></div>';
  box.innerHTML=h;
}
function quickPayExpense(eId){ openPaymentEditor(eId,null); }

function delPayment(pid,eId){
  var p=byId(DB.payments,pid);
  if(p&&p.auto){
    toast("זה תשלום אוטומטי (שווה ערך) — כדי לבטלו כבה את ההגדרה בלשונית דמי ניהול, או בטל את דמי הניהול על השלב","warn");
    return;
  }
  confirmDelete("למחוק תשלום זה?",function(){
    p.deleted=true;
    syncAutoMgmtPayments(eId);   // מחיקת ידני עשויה להחזיר מקום לאוטומטי
    save(); toast("נמחק","ok"); rerender(); openPayments(eId); return false;
  });
}
function openPaymentEditor(eId,payId){
  var e=byId(DB.expenses,eId); var aptId=e.apartmentId; var a=byId(DB.apartments,aptId);
  var p=payId?byId(DB.payments,payId):null;
  if(p&&p.auto){
    toast("זה תשלום אוטומטי (שווה ערך) — הסכום מחושב מההגדרה בלשונית דמי ניהול","warn");
    return;
  }
  var mgrs=apManagers(aptId);
  var partners=apPartners(aptId);
  var body='<div class="form-grid">'+
    '<div class="field"><label>תאריך</label><input id="pm-date" type="date" value="'+(p?esc(p.date):todayISO())+'"></div>'+
    '<div class="field"><label>סכום (₪)</label><input id="pm-amount" type="number" step="0.01" value="'+(p?esc(String(p.amount)):"")+'"></div>'+
    '<div class="field"><label>מהחשבון</label><select id="pm-account" onchange="onPmAccountPick()">'+accountOptions(aptId,p?p.accountId:"")+'</select></div>'+
    '<div class="field full" id="pm-newacc" style="display:none;background:#f7f9ff;border:1px solid var(--line);border-radius:10px;padding:10px">'+
      '<label>שם החשבון החדש</label>'+
      '<input id="pm-newacc-name" placeholder="למשל: מרכנתיל / חשבון יונה" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addAccountInline(\''+aptId+'\');}">'+
      '<div class="form-grid" style="margin-top:8px">'+
        '<div class="field"><label>שיוך</label><select id="pm-newacc-scope">'+
          '<option value="">כללי — זמין בכל הפרויקטים</option><option value="apt">רק בפרויקט הזה</option></select></div>'+
        '<div class="field"><label style="font-weight:400"><input type="checkbox" id="pm-newacc-bank" style="width:auto"> זהו <b>בנק זמני</b> (קופה משותפת)</label>'+
          '<div class="hint">תשלום מחשבון כזה יורד מיתרת הבנק ואינו משויך לשותף</div></div>'+
      '</div>'+
      '<button class="btn btn-primary btn-sm" style="margin-top:6px" onclick="addAccountInline(\''+aptId+'\')">➕ הוסף ובחר</button>'+
    '</div>'+
    /* "מי שילם" מוצג רק כשיש שותפים בדירה — בפרויקט אישי אין את מי לבחור */
    (partners.length
      ? '<div class="field"><label id="pm-payer-lbl">מי שילם (שותף)</label><select id="pm-payer"><option value="">—</option>'+partners.map(function(ap){return '<option value="'+ap.partnerId+'"'+(p&&p.payerPartnerId===ap.partnerId?" selected":"")+'>'+esc(partnerName(ap.partnerId))+'</option>';}).join("")+'</select></div>'
      : '')+
    '<div class="field"><label>אמצעי תשלום</label><select id="pm-method" onchange="onMethodPick(\'pm-method\')">'+methodOptions(p?p.method:"transfer")+'</select></div>'+
    /* בורר "מוטב" מוצג רק כשיש דמי ניהול על השלב — אחרת יש רק אפשרות אחת והוא רעש */
    (e.mgmtEnabled
      ? '<div class="field"><label>המוטב הוא</label><select id="pm-recipient" onchange="onPmRecipient()"><option value="supplier"'+(!p||p.recipientType==="supplier"?" selected":"")+'>הספק של השלב</option><option value="manager"'+(p&&p.recipientType==="manager"?" selected":"")+'>מנהל (דמי ניהול)</option></select></div>'+
        '<div class="field" id="pm-mgr-wrap" style="display:'+(p&&p.recipientType==="manager"?"block":"none")+'"><label>מנהל</label><select id="pm-manager"><option value="">—</option>'+mgrs.map(function(m){return '<option value="'+m.id+'"'+(p&&p.recipientManagerId===m.id?" selected":"")+'>'+esc(m.name)+'</option>';}).join("")+'</select></div>'
      : '')+
    '<div class="field full"><label>חשבונית</label><select id="pm-invoice-st">'+
      invoiceStatusOptions(p?payInvoiceStatus(p):"",false)+'</select>'+
      '<input id="pm-link" placeholder="קישור לחשבונית (אופציונלי)" value="'+esc(p?p.invoiceLink:"")+'" style="margin-top:4px"></div>'+
    (CU&&CU.role==="admin"?'<div class="field full" style="background:#fff7f7;border:1px solid #f0d0d0;border-radius:10px;padding:8px"><label><input type="checkbox" id="pm-hidden" style="width:auto" '+(p&&p.hidden?"checked":"")+'> 🔒 תשלום מוסתר משאר המשתמשים</label><div class="hint">רק מנהל יראה את התשלום הזה.</div></div>':'')+
    '<div class="field full"><label>הערה</label><input id="pm-note" value="'+esc(p?p.note:"")+'"></div>'+
    '</div>'+
    (partners.length?'<div class="hint">תשלום מחשבון בנק 🏦 יורד מיתרת הבנק ואינו משויך לשותף. תשלום מחשבון שותף נחשב לתרומה שלו.</div>':'');
  openModal({title:payId?"עריכת תשלום":"תשלום חדש",bodyHtml:body,saveLabel:"שמירה",onSave:function(){ return savePayment(eId,payId); }});
  onPmAccount();
}
function onPmAccount(){
  var sel=document.getElementById("pm-account"); if(!sel) return;
  var accId=sel.value; var acc=byId(DB.accounts,accId);
  var payer=document.getElementById("pm-payer");
  if(!payer) return;   // דירה בלי שותפים — אין שדה משלם
  if(acc&&acc.isBank){ payer.value=""; payer.disabled=true; }
  else{ payer.disabled=false; if(acc&&acc.partnerId&&!payer.value) payer.value=acc.partnerId; }
}
function onPmRecipient(){
  var isMgr=val("pm-recipient")==="manager";
  document.getElementById("pm-mgr-wrap").style.display = isMgr?"block":"none";
  /* מבהירים שגם בתשלום דמי ניהול צריך לציין מי מהשותפים הוציא את הכסף —
     אחרת התשלום לא נזקף לזכותו בדוח היתרות. */
  var lbl=document.getElementById("pm-payer-lbl");
  if(lbl) lbl.textContent = isMgr?"מי מהשותפים שילם את דמי הניהול":"מי שילם (שותף)";
}
function savePayment(eId,payId){
  var e=byId(DB.expenses,eId);
  if(isContainer(eId)){ toast("שלב-אב אינו מקבל תשלומים — רשום בתת-השלב","err"); return false; }
  var amount=Number(val("pm-amount"))||0; if(amount<=0){ toast("סכום לא תקין","err"); return false; }
  var accountId=val("pm-account")||null;
  if(accountId==="__new"){ toast("סיים להוסיף את החשבון או בחר אחר","err"); return false; }
  var isBank=accountIsBank(accountId);
  /* כשאין דמי ניהול על השלב בורר המוטב לא מוצג — ברירת המחדל היא הספק */
  var recipientType=val("pm-recipient")||"supplier";
  var recipientManagerId=recipientType==="manager"?(val("pm-manager")||null):null;
  if(recipientType==="manager"&&!recipientManagerId){ toast("בחר מנהל","err"); return false; }
  var payer=isBank?null:(val("pm-payer")||null);
  /* משלם נדרש רק בדירה שיש בה שותפים — בפרויקט אישי אין את מי לשייך */
  if(!isBank&&!payer&&apPartners(e.apartmentId).length){ toast("בחר מי שילם, או חשבון בנק","err"); return false; }
  // תקרות
  if(recipientType==="supplier"){
    var others=expPayments(eId).filter(function(x){return x.recipientType!=="manager"&&x.id!==payId;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);
    if(others+amount>Number(e.amount)+0.01){
      /* חריגה מהשלב מותרת — אבל רק באישור מפורש, שלא תקרה בטעות הקלדה */
      var over=round2(others+amount-Number(e.amount));
      if(!confirm("שים לב: סך התשלומים ("+money(others+amount)+") יחרוג מסכום השלב ("+money(e.amount)+") ב-"+money(over)+".\n\nהשלב יסומן \"שולם ביתר\". לאשר את התשלום?")) return false;
    }
  }else{
    var cap=mgrFeeLiveOnExpense(eId,recipientManagerId);
    /* האוטומטי ("שווה ערך") לא נספר כאן — הוא יצטמצם בסנכרון ויפנה מקום לידני */
    var othersM=expPayments(eId).filter(function(x){return x.recipientType==="manager"&&x.recipientManagerId===recipientManagerId&&x.id!==payId&&!x.auto;}).reduce(function(s,x){return s+(Number(x.amount)||0);},0);
    if(othersM+amount>cap+0.01){ toast("חורג ממה שמגיע למנהל ("+money(cap)+")","err"); return false; }
  }
  var obj={id:payId||uid(),expenseId:eId,date:val("pm-date")||todayISO(),amount:amount,accountId:accountId,
    payerPartnerId:payer,method:val("pm-method"),recipientType:recipientType,recipientManagerId:recipientManagerId,
    invoiceStatus:val("pm-invoice-st")||"",hasInvoice:(val("pm-invoice-st")==="has"),
    hidden:(CU&&CU.role==="admin"&&document.getElementById("pm-hidden"))?checked("pm-hidden"):(!!(payId&&byId(DB.payments,payId)&&byId(DB.payments,payId).hidden)),
    invoiceLink:val("pm-link"),note:val("pm-note"),deleted:false};
  if(payId){ Object.assign(byId(DB.payments,payId),obj); } else DB.payments.push(obj);
  syncAutoMgmtPayments(eId);   // ידני חדש מצמצם את האוטומטי בהתאם לתקרה
  save(); toast("התשלום נשמר","ok"); rerender(); openPayments(eId); return false;
}

/* ---------- דמי ניהול (ניהול + לי׳דג׳ר) ---------- */
function enableManagement(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var a=byId(DB.apartments,aptId); if(!a) return;
  a.hasManagement=true; save(); toast("דמי ניהול הופעלו בדירה","ok"); rerender();
}
function disableManagement(aptId){

/* העתקת המנהלים מדירה אחרת — כשאותם אנשים חוזרים בכמה פרויקטים */
function copyManagersFrom(aptId){
  var srcs=active(DB.apartments).filter(function(x){ return x.id!==aptId && apManagers(x.id).length; });
  if(!srcs.length){ toast("אין דירה אחרת עם מנהלים מוגדרים","warn"); return; }
  openModal({title:"העתקת מנהלים מדירה אחרת",bodyHtml:
    '<div class="field"><label>מאיזו דירה להעתיק?</label><select id="cm-src">'+
      srcs.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+' — '+apManagers(x.id).length+' מנהלים</option>';}).join("")+
    '</select></div><div class="hint">מנהל שכבר קיים כאן באותו שם לא יועתק שוב.</div>',
    saveLabel:"העתק",onSave:function(){
      var src=val("cm-src"), n=0;
      apManagers(src).forEach(function(m){
        if(apManagers(aptId).some(function(x){return String(x.name).trim()===String(m.name).trim();})) return;
        DB.managers.push({id:uid(),apartmentId:aptId,name:m.name,defaultFeePercent:m.defaultFeePercent,deleted:false}); n++;
      });
      if(!n){ toast("כל המנהלים כבר קיימים כאן","warn"); return false; }
      var a=byId(DB.apartments,aptId); if(a) a.hasManagement=true;
      save(); toast("הועתקו "+n+" מנהלים","ok"); rerender();
    }});
}

    (can("edit")?'<div class="form-grid">'+
      '<div class="field"><label>השותף שנזקף לזכותו</label><select id="am-partner"><option value="">—</option>'+
        apPartners(aptId).map(function(ap){return '<option value="'+ap.partnerId+'"'+(am&&am.partnerId===ap.partnerId?" selected":"")+'>'+esc(partnerName(ap.partnerId))+'</option>';}).join("")+

  // ליֹדג׳ר

  }
  return h;

function delManager(mId,aptId){
  var paid=managerPaid(aptId,mId);
  if(paid>0){ toast("לא ניתן למחוק מנהל שכבר קיבל תשלומים ("+money(paid)+"). מחק תחילה את התשלומים אליו.","err"); return; }
  confirmDelete("למחוק מנהל זה? דמי הניהול שלו יוסרו מכל ההוצאות.",function(){
    var m=byId(DB.managers,mId); if(!m) return;
    m.deleted=true;
    DB.expenseManagerFees.forEach(function(f){ if(f.managerId===mId) f.deleted=true; });
    save(); toast("הועבר לסל המחזור","ok"); rerender();
  });

/* פתיחת תשלום למנהל עם המנהל והסכום שנותר ממולאים מראש */
function payManager(eId,mId){
  openPaymentEditor(eId,null);
  var rec=document.getElementById("pm-recipient");
  if(!rec || !Array.prototype.some.call(rec.options,function(o){return o.value==="manager";})){
    toast("דמי ניהול אינם מופעלים על ההוצאה הזאת","err"); closeModal(); return;
  }
  rec.value="manager"; onPmRecipient();
  var sel=document.getElementById("pm-manager"); if(sel) sel.value=mId;
  var due=round2(mgrFeeLiveOnExpense(eId,mId)-mgrPaidOnExpense(eId,mId));
  var amt=document.getElementById("pm-amount"); if(amt && due>0) amt.value=due;
}
/* ---------- תשלום מרוכז למנהל: סוגרים הרבה שלבים בבת אחת ---------- */

    .sort(function(x,y){ return x.e.date<y.e.date?-1:1; });

      (partners.length
        ? '<div class="field"><label>מי שילם (שותף)</label><select id="bp-payer"><option value="">—</option>'+
            partners.map(function(ap){return '<option value="'+ap.partnerId+'">'+esc(partnerName(ap.partnerId))+'</option>';}).join("")+'</select></div>'
        : '')+
      '<div class="field"><label>אמצעי תשלום</label><select id="bp-method" onchange="onMethodPick(\'bp-method\')">'+methodOptions("transfer")+'</select></div>'+
      '<div class="field full"><label>הערה (תיווסף לכל התשלומים)</label><input id="bp-note" value=""></div>'+
    '</div>'+
    '<div class="section-title">אילו שלבים לשלם</div>'+
    '<div class="toolbar"><button class="btn btn-sm" onclick="bulkPaySelAll(true)">✔️ סמן הכל</button>'+
      '<button class="btn btn-sm" onclick="bulkPaySelAll(false)">✕ נקה</button>'+
      '<div class="sp"></div><span id="bp-total" class="pill"></span></div>'+
    '<div class="table-wrap" style="max-height:300px;overflow:auto"><table class="tbl"><thead><tr>'+
      '<th></th><th>תאריך</th><th>שלב</th><th>נותר לתשלום</th></tr></thead><tbody>'+
      open.map(function(r){
        return '<tr><td><input type="checkbox" class="bp-x" value="'+r.e.id+'" data-rem="'+r.rem+'" checked onchange="bulkPayTotal()" style="width:auto"></td>'+
          '<td>'+dateHe(r.e.date)+'</td><td><b>'+esc(r.e.description)+'</b></td>'+
          '<td class="neg">'+money(r.rem)+'</td></tr>';
      }).join("")+
    '</tbody></table></div>';
  openModal({title:"💳 תשלום מרוכז ל"+m.name,wide:true,bodyHtml:body,
    saveLabel:"רשום את התשלומים",onSave:function(){ return applyBulkPayMgr(aptId,mgrId); }});

function onBpAccount(){

function applyBulkPayMgr(aptId,mgrId){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var ids=Array.prototype.map.call(document.querySelectorAll(".bp-x:checked"),function(c){return c.value;});
  if(!ids.length){ toast("לא נבחר אף שלב","err"); return false; }
  var accountId=val("bp-account")||null;
  var isBank=accountIsBank(accountId);
  var payer=isBank?null:(val("bp-payer")||null);
  if(!isBank&&!payer&&apPartners(aptId).length){ toast("בחר מי שילם, או חשבון בנק","err"); return false; }
  var date=val("bp-date")||todayISO(), method=val("bp-method")||"transfer", note=val("bp-note")||"";
  var made=0, sum=0;
  ids.forEach(function(eid){
    /* מחשבים את הנותר מחדש ברגע הרישום — בטוח גם אם משהו השתנה בינתיים */
    var rem=round2(mgrFeeLiveOnExpense(eid,mgrId)-mgrPaidOnExpense(eid,mgrId));
    if(rem<=0.009) return;
    DB.payments.push({id:uid(),expenseId:eid,date:date,amount:rem,accountId:accountId,
      payerPartnerId:payer,method:method,recipientType:"manager",recipientManagerId:mgrId,
      hasInvoice:false,invoiceLink:"",note:note,deleted:false});
    syncAutoMgmtPayments(eid);
    made++; sum+=rem;
  });
  if(!made){ toast("לא נותר מה לשלם בשלבים שנבחרו","warn"); return false; }
  save();
  toast("נרשמו "+made+" תשלומים · "+money(round2(sum)),"ok");
  rerender();
}

      '<td class="right">'+(can("edit")?'<button class="btn btn-ghost btn-sm" onclick="editDeposit(\''+d.id+'\',\''+aptId+'\')">✏️</button> <button class="btn btn-ghost btn-sm" onclick="softDelete(\'deposits\',\''+d.id+'\',\'למחוק הפקדה?\')">🗑️</button>':'')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  // הכנסות שנכנסו לבנק — נרשמות בלשונית "הכנסות" ומוצגות כאן לשקיפות
  if(bankInc.length){
    h+='<div class="card" style="margin-top:16px"><h3>הכנסות שנכנסו לבנק</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>תאריך</th><th>תיאור</th><th>סכום</th><th>נזקף לשותפים</th></tr></thead><tbody>';

  h+='</tbody></table></div></div>';

var DIMP={grid:null,map:{date:-1,amount:-1,method:-1,from:-1,note:-1},aptId:null};

function onDepositPaste(){
  var txt=val("di-paste");
  if(!txt.trim()){ DIMP.grid=null; document.getElementById("di-map").innerHTML=""; return; }
  onDepositGrid(parseDelimited(txt, txt.indexOf("\t")>=0?"\t":","),"הדבקה");
}
function onDepositGrid(grid){
  grid=(grid||[]).filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); });
  if(!grid.length){ toast("לא נמצאו שורות","err"); return; }
  DIMP.grid=grid;
  var head=grid[0].map(function(c){ return String(c||"").trim(); });
  /* זיהוי אוטומטי לפי כותרות, עם נפילה לזיהוי לפי תוכן השורה הראשונה */
  function guess(hints){
    for(var i=0;i<head.length;i++){
      var h=normKey(head[i]);
      for(var k=0;k<hints.length;k++) if(h.indexOf(normKey(hints[k]))>=0) return i;
    }
    return -1;
  }
  var m={date:guess(["תאריך","date"]),amount:guess(["סכום","סך","amount","זכות","הפקדה"]),
         method:guess(["אמצעי","צורת","שיטת","method","סוג תשלום"]),
         from:guess(["מחשבון","חשבון","account"]),
         note:guess(["הער","פרט","תיאור","אסמכת","note"])};
  var hasHeader = (m.date>=0||m.amount>=0);
  if(!hasHeader){
    /* אין כותרות — מנחשים לפי התוכן: מה שנראה כתאריך ומה שנראה כמספר */
    var r0=grid[0];
    for(var i=0;i<r0.length;i++){
      var v=String(r0[i]||"").trim();
      if(m.date<0 && (/^\d{4}-\d{2}-\d{2}/.test(v)||/^\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}$/.test(v))) m.date=i;
      else if(m.amount<0 && impNum(v)>0) m.amount=i;
    }
  }
  DIMP.map=m; DIMP.hasHeader=hasHeader;
  renderDepositMap();
}
function renderDepositMap(){
  var box=document.getElementById("di-map"); if(!box||!DIMP.grid) return;
  var head=DIMP.grid[0].map(function(c,i){ return String(c||"").trim()||("עמודה "+(i+1)); });
  function sel(id,cur){
    return '<select id="'+id+'" onchange="DIMP.map.'+id.slice(3)+'=Number(this.value);renderDepositPreview()">'+
      '<option value="-1">— ללא —</option>'+
      head.map(function(h,i){ return '<option value="'+i+'"'+(i===cur?" selected":"")+'>'+esc(h)+'</option>'; }).join("")+
      '</select>';
  }
  box.innerHTML='<div class="section-title">התאמת עמודות</div>'+
    '<div class="field"><label><input type="checkbox" id="di-head" style="width:auto" '+
      (DIMP.hasHeader?"checked":"")+' onchange="DIMP.hasHeader=this.checked;renderDepositPreview()"> '+
      'השורה הראשונה היא שורת כותרות</label></div>'+

      '<div class="field"><label>תאריך ההפקדה</label>'+sel("di-date",DIMP.map.date)+'</div>'+
      '<div class="field"><label>סכום</label>'+sel("di-amount",DIMP.map.amount)+'</div>'+
      '<div class="field"><label>אמצעי תשלום</label>'+sel("di-method",DIMP.map.method)+'</div>'+
      '<div class="field"><label>מחשבון</label>'+sel("di-from",DIMP.map.from)+'</div>'+
      '<div class="field"><label>הערה</label>'+sel("di-note",DIMP.map.note)+'</div>'+
    '</div><div id="di-preview"></div>';
  renderDepositPreview();
}
function depositImportRows(){
  if(!DIMP.grid) return [];
  var m=DIMP.map;
  var rows=DIMP.hasHeader?DIMP.grid.slice(1):DIMP.grid;
  var outRows=[];
  rows.forEach(function(r,ix){
    var amt=m.amount>=0?impNum(r[m.amount]):0;
    if(!(amt>0.001)) return;                       // שורה בלי סכום אינה הפקדה
    outRows.push({
      idx:ix+1,
      date:m.date>=0?impDate(r[m.date]):todayISO(),
      amount:round2(amt),
      method:m.method>=0?impMethod(r[m.method]):"transfer",
      from:m.from>=0?String(r[m.from]||"").trim():"",
      note:m.note>=0?String(r[m.note]||"").trim():""
    });
  });
  return outRows;
}
/* טקסט חופשי של אמצעי תשלום → המפתח במערכת; לא מזוהה = נשמר כאמצעי חדש */
function impMethod(v){
  var s=String(v==null?"":v).trim(); if(!s) return "transfer";
  refreshMethods();
  var k=Object.keys(METHODS).find(function(x){ return normKey(METHODS[x])===normKey(s); });
  if(k) return k;
  var alias={"העברה בנקאית":"transfer","העברה":"transfer","זיכוי":"transfer","הו״ק":"transfer",
             "הוראת קבע":"transfer","שיק":"check","צק":"check","צ׳ק":"check","המחאה":"check",
             "כרטיס אשראי":"credit","אשראי":"credit","מזומן":"cash","שווה ערך":"equiv"};
  var ak=Object.keys(alias).find(function(x){ return normKey(x)===normKey(s); });
  if(ak) return alias[ak];
  return "other";
}
function renderDepositPreview(){
  var box=document.getElementById("di-preview"); if(!box) return;
  var rows=depositImportRows();
  if(!rows.length){ box.innerHTML='<div class="empty">לא זוהו שורות עם סכום — בדוק את התאמת העמודות</div>'; return; }
  var sum=round2(rows.reduce(function(s,r){ return s+r.amount; },0));
  refreshMethods();
  box.innerHTML='<div class="section-title">תצוגה מקדימה — '+rows.length+' הפקדות, סה"כ '+money(sum)+'</div>'+
    '<div class="table-wrap" style="max-height:220px"><table class="tbl"><thead><tr>'+
    '<th>תאריך</th><th>סכום</th><th>אמצעי</th><th>מחשבון</th><th>הערה</th></tr></thead><tbody>'+
    rows.slice(0,12).map(function(r){
      return '<tr><td>'+dateHe(r.date)+'</td><td>'+money(r.amount)+'</td>'+
        '<td>'+esc(METHODS[r.method]||r.method)+'</td><td>'+esc(r.from||"")+'</td><td>'+esc(r.note)+'</td></tr>';
    }).join("")+
    '</tbody></table></div>'+
    (rows.length>12?'<div class="hint">מוצגות 12 הראשונות מתוך '+rows.length+'</div>':'');
}
function applyDepositImport(){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var aptId=DIMP.aptId, pid=val("di-payer");
  if(!pid){ toast("בחר את השותף המפקיד","err"); return false; }
  var rows=depositImportRows();

  /* אותו שותף + תאריך + סכום = כנראה ייבוא חוזר של אותו קובץ */
  var dup=rows.filter(function(r){

      return d.partnerId===pid && d.date===r.date && Math.abs((Number(d.amount)||0)-r.amount)<0.01; });
  }).length;
  if(dup && !confirm(dup+" מתוך "+rows.length+" ההפקדות כבר קיימות (אותו שותף, תאריך וסכום).\n\nלהוסיף בכל זאת?")) return false;
  var sum=0;
  rows.forEach(function(r){
    DB.deposits.push({id:uid(),apartmentId:aptId,partnerId:pid,amount:r.amount,
      date:r.date,method:r.method,fromAccount:r.from,note:r.note,deleted:false});

  save();

}

  var rows=bdRows();
  var pctSum=rows.reduce(function(s,i){ return s+(Number(i.getAttribute("data-pct"))||0); },0);
  if(pctSum<=0){ toast("אין אחוזי ברירת מחדל בדירה — השתמש בפיצול שווה","warn"); return; }
  /* מחלקים לפי אחוזים ומיישרים את השארית באחרון, כדי שהסכום יסתדר בדיוק */
  var acc=0;
  rows.forEach(function(i,ix){
    var v = (ix===rows.length-1)
      ? round2(tot-acc)
      : round2(tot*(Number(i.getAttribute("data-pct"))||0)/pctSum);
    acc=round2(acc+v); i.value=v;
  });
  bdSum();
}
function bdEqual(){
  var tot=Number(val("bd-total"))||0;
  if(tot<=0){ toast("הזן סכום כולל","warn"); return; }
  var rows=bdRows(), acc=0;
  rows.forEach(function(i,ix){
    var v=(ix===rows.length-1)?round2(tot-acc):round2(tot/rows.length);
    acc=round2(acc+v); i.value=v;
  });
  bdSum();
}
function bdClear(){ bdRows().forEach(function(i){ i.value=""; }); var t=document.getElementById("bd-total"); if(t) t.value=""; bdSum(); }
function saveBulkDeposit(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var date=val("bd-date")||todayISO(), note=val("bd-note")||"";
  var fromAcc=val("bd-from")||"";

  var picked=bdRows().map(function(i){

  }).filter(function(x){ return x.amount>0.001; });
  if(!picked.length){ toast("לא הוזן סכום לאף שותף","err"); return false; }
  var sum=round2(picked.reduce(function(s,x){ return s+x.amount; },0));

  var dupN=picked.filter(function(x){

/* ============================================================
   דוח קטגוריות — לאן הלך הכסף בפרויקט
   נספרים רק עלים (שלב-אב הוא סיכום ולא הוצאה), כך שאין ספירה כפולה.
   ============================================================ */
function categoryBreakdown(aptId){
  var map={}, order=[];
  function slot(key,name){
    if(!map[key]){ map[key]={key:key,name:name,amount:0,mgmt:0,paid:0,count:0}; order.push(key); }
    return map[key];
  }
  apLeafExpenses(aptId).forEach(function(e){
    var key=e.categoryId||"__none";
    var s=slot(key, e.categoryId?(categoryName(e.categoryId)||"(קטגוריה שנמחקה)"):"ללא קטגוריה");
    s.amount+=Number(e.amount)||0;
    s.mgmt+=expenseMgmtCostLive(e.id);
    s.paid+=expensePaid(e.id);
    s.count++;
  });
  var rows=order.map(function(k){ return map[k]; });
  rows.forEach(function(r){ r.cost=round2(r.amount+r.mgmt); r.rem=round2(r.cost-r.paid);
    r.amount=round2(r.amount); r.mgmt=round2(r.mgmt); r.paid=round2(r.paid); });
  /* הגדולה למעלה, ו"ללא קטגוריה" תמיד אחרונה כדי שלא תסתיר את התמונה */
  rows.sort(function(x,y){
    if((x.key==="__none")!==(y.key==="__none")) return x.key==="__none"?1:-1;
    return y.cost-x.cost;
  });
  return rows;
}
function categoryReportHtml(aptId){
  var a=byId(DB.apartments,aptId);
  var rows=categoryBreakdown(aptId);
  if(!rows.length) return "";
  var total=rows.reduce(function(s,r){return s+r.cost;},0);
  var tagged=rows.filter(function(r){return r.key!=="__none";});
  var h='<div class="card"><h3>🗂️ לפי קטגוריה — '+esc(a.name)+'</h3>';
  if(!tagged.length){
    return h+'<div class="empty">עדיין לא שויכה קטגוריה לאף שלב.<br>'+
      '<span class="hint">פתח שלב לעריכה ובחר קטגוריה (חשמל, אדריכל, ריצוף…), '+
      'או הוסף קטגוריות בהגדרות → סוגי הוצאה.</span></div></div>';
  }
  h+='<div class="table-wrap"><table class="tbl"><thead><tr><th>קטגוריה</th><th>שלבים</th>'+
    '<th>סכום</th>'+(a.hasManagement?'<th>דמי ניהול</th>':'')+'<th>עלות כוללת</th>'+
    '<th>שולם</th><th>נותר</th><th>% מהפרויקט</th><th data-xl-skip="1">התפלגות</th></tr></thead><tbody>';
  var t={amount:0,mgmt:0,cost:0,paid:0,rem:0,count:0};
  rows.forEach(function(r){
    var pct=total>0?(r.cost/total*100):0;
    t.amount+=r.amount; t.mgmt+=r.mgmt; t.cost+=r.cost; t.paid+=r.paid; t.rem+=r.rem; t.count+=r.count;
    h+='<tr'+(r.key==="__none"?' class="muted"':'')+'><td><b>'+esc(r.name)+'</b></td>'+
      '<td>'+r.count+'</td><td>'+money(r.amount)+'</td>'+
      (a.hasManagement?'<td>'+money(r.mgmt)+'</td>':'')+
      '<td><b>'+money(r.cost)+'</b></td><td>'+money(r.paid)+'</td>'+
      '<td class="'+(r.rem>0.01?"neg":"pos")+'">'+money(r.rem)+'</td>'+
      '<td>'+num(round2(pct))+'%</td>'+
      '<td data-xl-skip="1" style="min-width:120px"><div style="background:#eef1f8;border-radius:6px;height:9px;overflow:hidden">'+
        '<div style="background:var(--brand);height:9px;width:'+Math.max(1,Math.min(100,pct)).toFixed(1)+'%"></div></div></td></tr>';
  });
  h+='</tbody><tfoot><tr><td>סה"כ</td><td>'+t.count+'</td><td>'+money(t.amount)+'</td>'+
    (a.hasManagement?'<td>'+money(t.mgmt)+'</td>':'')+
    '<td>'+money(t.cost)+'</td><td>'+money(t.paid)+'</td><td>'+money(t.rem)+'</td>'+
    '<td>100%</td><td></td></tr></tfoot></table></div>';
  var none=rows.filter(function(r){return r.key==="__none";})[0];
  if(none && none.count) h+='<div class="hint" style="margin-top:8px">'+none.count+
    ' שלבים עדיין בלי קטגוריה ('+money(none.cost)+'). שייך אותם כדי שהדוח יהיה מלא.</div>';
  return h+'</div>';
}

    var b=paid-due;

    '<b>יתרה לעתיד</b> = מה שעוד יגיע לו לשלם כשיושלמו כל השלבים.</div>';

  /* התחשבנות: מי מעביר למי */
  var plan=settlementPlan(bal);

/* ============================================================
   דוח שותפים — כמה כל שותף אמור לשלם על כל שלב, לפי אחוזיו
   כולל את חלקו בדמי הניהול, כך שהסיכום תואם לדוח המשלמים.
   ============================================================ */
var PR={mode:"matrix",partner:"",q:""};
function renderPartnerReport(){ return withIndex(function(){ return renderPartnerReportInner(); }); }
function renderPartnerReportInner(){
  var el=document.getElementById("partner-report");
  if(el) el.innerHTML=partnerReportHtml(state.params.apartmentId);
}
/* חלקו של שותף בשלב: אחוז × (סכום ההוצאה + דמי הניהול הפעילים) */
function partnerShareInExpense(eId,pid){
  var e=byId(DB.expenses,eId); if(!e) return 0;
  var pct=partnerPctInExpense(eId,pid)/100; if(!pct) return 0;
  return round2(pct*((Number(e.amount)||0)+expenseMgmtCostLive(eId)));
}
/* ============================================================
   חובה לפי מה ששולם בפועל
   ------------------------------------------------------------
   שלב של 1,000,000 שבו שולמו 500,000 בלבד: שותף עם 25% חייב
   כרגע 125,000 ולא 250,000. כך רואים מי מפגר מול מה שכבר יצא
   מהכיס בפועל, ולא מול העלות המלאה שעוד לא שולמה.
   ============================================================ */
function expenseOutflow(eId){          // כל הכסף שיצא על השלב: לספק ולמנהלים
  if(IX && IX.outflow[eId]!==undefined) return IX.outflow[eId];
  var v = isContainer(eId)
    ? round2(expenseChildren(eId).reduce(function(s,k){ return s+expenseOutflow(k.id); },0))
    : round2(expPayments(eId).reduce(function(s,p){ return s+(Number(p.amount)||0); },0));
  if(IX) IX.outflow[eId]=v;
  return v;
}
function partnerDueByPaid(aptId,pid){  // חלקו במה שכבר שולם
  return round2(apLeafExpenses(aptId).reduce(function(s,e){
    var pct=partnerPctInExpense(e.id,pid)/100;
    return pct ? s+pct*expenseOutflow(e.id) : s;
  },0));
}
function partnerDueByPaidOnExpense(eId,pid){
  var pct=partnerPctInExpense(eId,pid)/100;
  return pct ? round2(pct*expenseOutflow(eId)) : 0;
}
/* התחשבנות בין שותפים: מי מעביר למי, במינימום העברות */
function settlementPlan(balances){
  var cred=[],deb=[];
  Object.keys(balances).forEach(function(pid){
    var v=round2(balances[pid]);
    if(v>0.01) cred.push({pid:pid,amt:v});        // שילם יותר — מגיע לו
    else if(v<-0.01) deb.push({pid:pid,amt:-v});  // שילם פחות — חייב
  });
  cred.sort(function(a,b){return b.amt-a.amt;});
  deb.sort(function(a,b){return b.amt-a.amt;});
  var out=[],i=0,j=0;
  while(i<deb.length && j<cred.length){
    var m=Math.min(deb[i].amt,cred[j].amt);
    if(m>0.01) out.push({from:deb[i].pid,to:cred[j].pid,amount:round2(m)});
    deb[i].amt=round2(deb[i].amt-m); cred[j].amt=round2(cred[j].amt-m);
    if(deb[i].amt<=0.01) i++;
    if(cred[j].amt<=0.01) j++;
  }
  return out;
}

/* כמה השותף שילם בפועל על השלב (תשלומיו הישירים, לא מהבנק) */
function partnerPaidOnExpense(eId,pid){
  return round2(expPayments(eId).filter(function(p){
    return p.payerPartnerId===pid && !accountIsBank(p.accountId);
  }).reduce(function(s,p){ return s+(Number(p.amount)||0); },0));
}

function copyPartnerReport(){
  var box=document.getElementById("partner-report");
  var tbl=box&&box.querySelector("table.tbl");
  if(!tbl){ toast("אין טבלה להעתקה","warn"); return; }
  var lines=[];
  tbl.querySelectorAll("tr").forEach(function(tr){
    var cells=[];
    tr.querySelectorAll("th,td").forEach(function(c){
      cells.push(String(c.innerText||"").replace(/\s+/g," ").trim());
    });
    if(cells.join("").trim()) lines.push(cells.join("\t"));
  });
  try{ navigator.clipboard.writeText(lines.join("\n")); toast("הדוח הועתק — אפשר להדביק באקסל","ok"); }
  catch(e){ toast("לא ניתן להעתיק בדפדפן הזה","err"); }
}

  }
  return h;
}

/* ---------- ניהול אמצעי תשלום ---------- */
function addPaymentMethod(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  openModal({title:"אמצעי תשלום חדש",bodyHtml:
    '<div class="field"><label>שם האמצעי</label><input id="pmth-name" placeholder="למשל: הוראת קבע, ביט, פייבוקס"></div>',
    onSave:function(){
      var nm=val("pmth-name").trim(); if(!nm){ toast("יש להזין שם","err"); return false; }
      refreshMethods();
      if(Object.keys(METHODS).some(function(k){ return normKey(METHODS[k])===normKey(nm); })){
        toast("האמצעי כבר קיים","err"); return false; }
      DB.settings=DB.settings||{}; DB.settings.paymentMethods=DB.settings.paymentMethods||{};
      var k=normKey(nm).replace(/[^\w֐-׿]+/g,"_").slice(0,30)||("m"+Date.now().toString(36));
      DB.settings.paymentMethods[k]=nm;
      save(); refreshMethods(); toast("נוסף","ok"); rerender();
    }});
}
function delPaymentMethod(k){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  if(METHODS_BASE[k]){ toast("אמצעי מובנה — לא ניתן למחוק","err"); return; }
  var used=active(DB.payments).filter(function(p){return p.method===k;}).length;
  if(used){ toast("האמצעי משמש ב-"+used+" תשלומים — לא ניתן למחוק","err"); return; }
  if(!confirm('למחוק את אמצעי התשלום "'+METHODS[k]+'"?')) return;
  delete DB.settings.paymentMethods[k];
  save(); refreshMethods(); toast("נמחק","ok"); rerender();
}

  var ac=id?byId(DB.accounts,id):{name:"",isBank:false,apartmentId:null};
  var apts=active(DB.apartments);
  openModal({title:id?"עריכת חשבון":"חשבון חדש",bodyHtml:
    '<div class="field"><label>שם החשבון</label><input id="ac-name" value="'+esc(ac.name)+'" placeholder="למשל: מרכנתיל / חשבון יונה"></div>'+
    '<div class="field"><label>שיוך</label><select id="ac-apt"><option value="">כללי — זמין בכל הפרויקטים</option>'+
      apts.map(function(a){return '<option value="'+a.id+'"'+(ac.apartmentId===a.id?" selected":"")+'>'+esc(a.name)+'</option>';}).join("")+
    '</select></div>'+
    '<div class="field"><label style="font-weight:400"><input type="checkbox" id="ac-bank" style="width:auto" '+(ac.isBank?"checked":"")+'> זהו <b>בנק זמני</b> (קופה משותפת)</label>'+
      '<div class="hint">תשלום מחשבון כזה יורד מיתרת הבנק ואינו נחשב תרומה של שותף מסוים</div></div>',
    onSave:function(){
      var nm=val("ac-name").trim(); if(!nm){ toast("יש להזין שם","err"); return false; }
      if(id){ ac.name=nm; ac.isBank=checked("ac-bank"); ac.apartmentId=val("ac-apt")||null; }
      else{
        var k=normKey(nm);
        if(active(DB.accounts).some(function(x){return normKey(x.name)===k && (x.apartmentId||null)===(val("ac-apt")||null);})){
          toast("כבר קיים חשבון בשם הזה","err"); return false;
        }
        DB.accounts.push({id:uid(),apartmentId:val("ac-apt")||null,name:nm,isBank:checked("ac-bank"),partnerId:null,deleted:false});
      }
      save(); toast("נשמר","ok"); rerender();
    }});
}
function delAccount(id){
  var used=active(DB.payments).filter(function(p){return p.accountId===id;}).length;
  var ac=byId(DB.accounts,id);
  if(used){ toast('אי אפשר למחוק — "'+ac.name+'" משמש ב-'+used+' תשלומים',"err"); return; }
  softDelete("accounts",id,'למחוק את החשבון "'+ac.name+'"?');
}

  var list=["פרטי","פאגי","הלואה מיוחדת","מרכנתיל","אשראי חיליק","משכנתא","מזרחי","אמריקה",
    "בנצי אמרי מנחם","לסידור","אמרי מנחם","חשבון יונה","יהב","סקיי גייט","חיליק","טריה",
    "סיבובי פאגי","שווה ערך","חול","דיסקונט","דיסקונט הרשי","חשבן אחר","פועלים","פרלמן יונה אמרי"];
  var added=0, skipped=0;
  list.forEach(function(nm){

/* ---------- איחוד דירות כפולות ----------
   "הלפרין  17" (רווח כפול) ו"הלפרין 17" נוצרו כשתי דירות. המיזוג מעביר
   את כל התנועות לדירת היעד ומעביר את הכפולה לסל המחזור. */
function mergeApartments(srcId,dstId){
  if(srcId===dstId) return 0;
  var src=byId(DB.apartments,srcId), dst=byId(DB.apartments,dstId);
  if(!src||!dst) return 0;
  var moved=0;
  // הוצאות (החלוקות, דמי הניהול והתשלומים שלהן עוברים איתן דרך expenseId)
  active(DB.expenses).forEach(function(e){ if(e.apartmentId===srcId){ e.apartmentId=dstId; moved++; } });
  // שותפי דירה — לא מכפילים שותף שכבר קיים ביעד
  var dstP={}; apPartners(dstId).forEach(function(x){ dstP[x.partnerId]=1; });
  active(DB.apartmentPartners).forEach(function(x){
    if(x.apartmentId!==srcId) return;
    if(dstP[x.partnerId]){ x.deleted=true; x.deletedBy="merged:"+dstId; }
    else { x.apartmentId=dstId; dstP[x.partnerId]=1; }
  });
  // מנהלים — אותו שם ביעד: מפנים אליו את דמי הניהול והתשלומים
  active(DB.managers).forEach(function(m){
    if(m.apartmentId!==srcId) return;
    var twin=apManagers(dstId).find(function(t){ return normKey(t.name)===normKey(m.name); });
    if(twin){
      DB.expenseManagerFees.forEach(function(f){ if(f.managerId===m.id) f.managerId=twin.id; });
      DB.payments.forEach(function(p){ if(p.recipientManagerId===m.id) p.recipientManagerId=twin.id; });
      m.deleted=true; m.deletedBy="merged:"+dstId;
    } else m.apartmentId=dstId;
  });
  // חשבונות — אותו שם ביעד: מפנים אליו את התשלומים
  active(DB.accounts).forEach(function(ac){
    if(ac.apartmentId!==srcId) return;
    var twin=apAccounts(dstId).find(function(t){ return normKey(t.name)===normKey(ac.name); });
    if(twin){
      DB.payments.forEach(function(p){ if(p.accountId===ac.id) p.accountId=twin.id; });
      ac.deleted=true; ac.deletedBy="merged:"+dstId;
    } else ac.apartmentId=dstId;
  });
  active(DB.deposits).forEach(function(d){ if(d.apartmentId===srcId){ d.apartmentId=dstId; moved++; } });
  active(DB.income).forEach(function(i){ if(i.apartmentId===srcId){ i.apartmentId=dstId; moved++; } });
  if(src.hasBank) dst.hasBank=true;
  if(src.hasManagement) dst.hasManagement=true;
  if(src.notes && !dst.notes) dst.notes=src.notes;
  src.deleted=true; src.deletedBy="merged:"+dstId;
  return moved;
}
function openMergeTool(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var apts=active(DB.apartments);
  // קבוצות של שמות זהים-בפועל
  var byKey={};
  apts.forEach(function(a){ var k=normKey(a.name); (byKey[k]=byKey[k]||[]).push(a); });
  var groups=Object.keys(byKey).map(function(k){return byKey[k];}).filter(function(g){return g.length>1;});
  window._mergeGroups=groups;
  function aptLine(a,gi){
    var n=apExpenses(a.id).length, pay=apAllPayments(a.id).length;
    var best=window._mergeGroups[gi].reduce(function(m,x){ return apExpenses(x.id).length>apExpenses(m.id).length?x:m; });
    return '<label style="display:flex;gap:8px;align-items:center;font-weight:400;padding:4px 0">'+
      '<input type="radio" name="mg-'+gi+'" value="'+a.id+'" style="width:auto" '+(a.id===best.id?"checked":"")+'>'+
      '<span><b>'+esc(a.name)+'</b>'+(/\s{2,}/.test(a.name)?' <span class="badge badge-warn">רווח כפול</span>':'')+
      ' <span class="muted">— '+n+' שלבים · '+pay+' תשלומים</span></span></label>';
  }
  var body= groups.length
    ? '<p class="muted">נמצאו '+groups.length+' קבוצות של דירות עם אותו שם בפועל (הבדל של רווחים/גרשיים). '+
      'בחר בכל קבוצה את הדירה <b>שתישאר</b> — כל השאר ימוזגו לתוכה.</p>'+
      groups.map(function(g,gi){
        return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px">'+
          g.map(function(a){return aptLine(a,gi);}).join("")+
          '<button class="btn btn-primary btn-sm" style="margin-top:6px" onclick="mergeGroup('+gi+')">🔀 מזג את הקבוצה</button></div>';
      }).join("")
    : '<p class="pos">✅ לא נמצאו דירות כפולות לפי שם.</p>';
  body+='<div class="section-title">מיזוג ידני</div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>דירה למיזוג (תיעלם)</label><select id="mg-src">'+
        apts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label>לתוך (תישאר)</label><select id="mg-dst">'+
        apts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join("")+'</select></div>'+
    '</div>'+
    '<button class="btn btn-sm" onclick="manualMerge()">🔀 מזג ידנית</button>'+
    '<div class="hint">המיזוג מעביר הכל: שלבים, תשלומים, שותפים, מנהלים, חשבונות, הפקדות והכנסות. הדירה שמוזגה עוברת לסל המחזור.</div>';
  openModal({title:"🔀 איחוד דירות כפולות",wide:true,bodyHtml:body});
}
function mergeGroup(gi){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var g=window._mergeGroups[gi]; if(!g) return;
  var sel=document.querySelector('input[name="mg-'+gi+'"]:checked');
  if(!sel){ toast("בחר את הדירה שתישאר","err"); return; }
  var dstId=sel.value;
  var srcs=g.filter(function(a){return a.id!==dstId;});
  if(!confirm(srcs.length+' דירות ימוזגו לתוך "'+byId(DB.apartments,dstId).name+'".\n\nכל התנועות עוברות, והכפולות עוברות לסל המחזור. אפשר לבטל ב-Ctrl+Z.\n\nלהמשיך?')) return;
  srcs.forEach(function(a){ mergeApartments(a.id,dstId); });
  save(); toast("מוזגו "+srcs.length+" דירות","ok");
  closeModal(); openMergeTool(); rerender();
}
function manualMerge(){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var s=val("mg-src"), d=val("mg-dst");
  if(s===d){ toast("בחר שתי דירות שונות","err"); return; }
  var sa=byId(DB.apartments,s), da=byId(DB.apartments,d);
  if(!confirm('"'+sa.name+'" תמוזג לתוך "'+da.name+'" ותעבור לסל המחזור.\n\nלהמשיך?')) return;
  mergeApartments(s,d);
  save(); toast("מוזג","ok"); closeModal(); openMergeTool(); rerender();
}

/* מחיקת דירה שלמה: הדירה + כל התנועות שלה, בתיוג שמאפשר שחזור יחד */
function delApartment(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var a=byId(DB.apartments,aptId); if(!a) return;
  var exps=apExpenses(aptId), eids={}; exps.forEach(function(e){ eids[e.id]=1; });
  var pays=active(DB.payments).filter(function(p){return eids[p.expenseId];});
  var splits=active(DB.expenseSplits).filter(function(s){return eids[s.expenseId];});
  var fees=active(DB.expenseManagerFees).filter(function(f){return eids[f.expenseId];});
  var deps=apDeposits(aptId), inc=apIncome(aptId);
  var mgrs=apManagers(aptId), accs=apAccounts(aptId), aps=apPartners(aptId);
  if(!confirm('למחוק את הדירה "'+a.name+'" וכל התנועות שלה?\n\n'+
    "• "+exps.length+" הוצאות\n• "+pays.length+" תשלומים\n• "+deps.length+" הפקדות\n• "+inc.length+" הכנסות\n"+
    "• "+aps.length+" שותפים בדירה\n• "+mgrs.length+" מנהלים\n• "+accs.length+" חשבונות\n\n"+
    "הכל עובר לסל המחזור, וניתן לשחזר את הדירה עם כל התנועות בלחיצה אחת.\n\nלהמשיך?")) return;
  var tag="apt:"+aptId;
  function kill(arr){ arr.forEach(function(x){ x.deleted=true; x.deletedBy=tag; }); }
  kill(exps); kill(pays); kill(splits); kill(fees); kill(deps); kill(inc); kill(mgrs); kill(accs); kill(aps);
  a.deleted=true;
  save();
  toast('"'+a.name+'" וכל התנועות שלה הועברו לסל המחזור',"ok");
  go("dashboard",{});
}

async function saveUser(id,u){
  var name=val("us-name").trim(); if(!name){ toast("שם חסר","err"); return; }
  var email=val("us-email").trim();
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast("כתובת המייל אינה תקינה","err"); return; }
  var apts=Array.prototype.slice.call(document.querySelectorAll(".u-apt:checked")).map(function(c){return c.value;});
  var code=val("us-code"); var pid=val("us-partner")||null;
  var role=val("us-role");
  /* הקוד הוא הזהות — אין שם משתמש בכניסה. שני משתמשים עם אותו קוד
     היו נכנסים שניהם לחשבון הראשון שמתאים, וזה נראה כמו "הכניסה
     לא עובדת". חוסמים מראש. */
  if(code){
    var h=await hashCode(code);
    var clash=active(DB.users).find(function(x){ return x.code===h && x.id!==id; });
    if(clash){ toast('הקוד הזה כבר שייך למשתמש "'+clash.name+'" — בחר קוד אחר',"err"); return; }
  }
  if(id){
    u.name=name; u.email=email; u.role=role; u.allowedApartments=apts; u.partnerId=pid; u.active=checked("us-active");
    if(code) u.code=await hashCode(code);
  }
  else{
    if(!code){ toast("יש להזין קוד","err"); return; }

/* מפרסר טקסט מופרד שמכבד מרכאות — תא באקסל יכול להכיל ירידת שורה,
   ואז הוא מגיע עטוף במרכאות. פיצול נאיבי לפי \n שבר שורות כאלה לשתיים. */
function parseDelimited(raw,sep){
  var rows=[], row=[], field="", i=0, inQ=false;
  while(i<raw.length){
    var c=raw.charAt(i);
    if(inQ){
      if(c==='"'){
        if(raw.charAt(i+1)==='"'){ field+='"'; i+=2; continue; }
        inQ=false; i++; continue;
      }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c===sep){ row.push(field); field=""; i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ row.push(field); field=""; rows.push(row); row=[]; i++; continue; }
    field+=c; i++;
  }
  if(field!=="" || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); })
             .map(function(r){ return r.map(function(c){ return String(c).replace(/\s+/g," ").trim(); }); });
}
/* מפתח השוואה סלחני: מאחד גרשיים/אפוסטרופים, רווחים כפולים, ורישיות.
   באקסל אותו שם נכתב לפעמים עם ׳ ולפעמים עם ', או עם רווח כפול. */
function normKey(s){
  return String(s==null?"":s)
    .replace(/[‘’׳ʼ'`´]/g,"'")
    .replace(/[“”״"]/g,'"')
    .replace(/[‎‏‪-‮]/g,"")
    .replace(/\s+/g," ")
    .trim().toLowerCase();
}
function impNum(v){ var n=parseFloat(String(v==null?"":v).replace(/[^\d.\-]/g,"")); return isFinite(n)?n:0; }

/* קורא xlsx או CSV ומחזיר רשת תאים ל-onGrid. בלי onGrid — ההתנהגות

function readSheetFile(inp,onGrid,nameElId){

    if(nameEl) nameEl.textContent=""; return;
  }
  var rd=new FileReader();
  rd.onerror=function(){ toast("שגיאה בקריאת הקובץ","err"); if(nameEl) nameEl.textContent=""; };
  if(isXlsx){
    rd.onload=function(){ parseXlsx(rd.result,f.name,onGrid,nameEl).catch(function(e){
      toast("קריאת ה-xlsx נכשלה: "+e.message,"err"); if(nameEl) nameEl.textContent=""; }); };
    rd.readAsArrayBuffer(f);

    rd.onload=function(){

      // אקסל עברי שומר CSV ב-Windows-1255; אם רואים הרבה תווי החלפה — קוראים שוב בקידוד הנכון
      function done(t){
        if(onGrid){
          var g=parseDelimited(t, t.indexOf("	")>=0?"	":",");
          if(nameEl) nameEl.textContent="✅ "+f.name+" ("+g.length+" שורות)";
          onGrid(g,f.name);
        } else fileTextToTextarea(t,f.name);

        var rd2=new FileReader();
        rd2.onload=function(){ done(rd2.result); };
        rd2.readAsText(f,"windows-1255"); return;
      }
      done(txt);
    };
    rd.readAsText(f,"utf-8");
  }
}

/* ---------- ZIP: איתור הרשומות ופריסתן ---------- */
async function unzipAll(buf){
  var u8=new Uint8Array(buf), dv=new DataView(buf);
  // End Of Central Directory — סורקים מהסוף
  var eocd=-1;
  for(var i=u8.length-22;i>=Math.max(0,u8.length-70000);i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error("קובץ ZIP לא תקין");
  var count=dv.getUint16(eocd+10,true), cdOfs=dv.getUint32(eocd+16,true);
  var out={}, p=cdOfs;
  for(var n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    var method=dv.getUint16(p+10,true);
    var csize=dv.getUint32(p+20,true);
    var nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    var lho=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    // הכותרת המקומית קובעת איפה הדאטה מתחיל
    var lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
    var dataStart=lho+30+lnlen+lelen;
    var raw=u8.subarray(dataStart,dataStart+csize);
    if(method===0){ out[name]=raw; }
    else if(method===8){
      var ds=new DecompressionStream("deflate-raw");
      var stream=new Blob([raw]).stream().pipeThrough(ds);
      out[name]=new Uint8Array(await new Response(stream).arrayBuffer());
    }
    p+=46+nlen+elen+clen;
  }
  return out;
}
function xmlOf(bytes){ return new DOMParser().parseFromString(new TextDecoder("utf-8").decode(bytes),"application/xml"); }
function colToIdx(ref){ // "BC12" -> 54
  var m=/^([A-Z]+)/.exec(ref); if(!m) return 0;
  var c=0; for(var i=0;i<m[1].length;i++) c=c*26+(m[1].charCodeAt(i)-64);
  return c-1;
}

/* ---------- XLSX → רשת תאים ---------- */
async function parseXlsx(buf,fname,onGrid,nameEl){
  var files=await unzipAll(buf);
  // מחרוזות משותפות
  var shared=[];
  if(files["xl/sharedStrings.xml"]){
    var sst=xmlOf(files["xl/sharedStrings.xml"]);
    Array.prototype.forEach.call(sst.getElementsByTagName("si"),function(si){
      var s=""; Array.prototype.forEach.call(si.getElementsByTagName("t"),function(t){ s+=t.textContent; });
      shared.push(s);
    });
  }
  // שמות גיליונות
  var sheets=[];
  if(files["xl/workbook.xml"]){
    var wb=xmlOf(files["xl/workbook.xml"]);
    var rels={};
    if(files["xl/_rels/workbook.xml.rels"]){
      Array.prototype.forEach.call(xmlOf(files["xl/_rels/workbook.xml.rels"]).getElementsByTagName("Relationship"),function(r){
        rels[r.getAttribute("Id")]="xl/"+r.getAttribute("Target").replace(/^\//,"").replace(/^xl\//,"");
      });
    }
    Array.prototype.forEach.call(wb.getElementsByTagName("sheet"),function(s){
      var rid=s.getAttribute("r:id")||s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
      var path=rels[rid]||("xl/worksheets/sheet"+(sheets.length+1)+".xml");
      if(files[path]) sheets.push({name:s.getAttribute("name")||("גיליון "+(sheets.length+1)),path:path});
    });
  }
  if(!sheets.length){
    Object.keys(files).forEach(function(k){
      if(/^xl\/worksheets\/sheet\d+\.xml$/.test(k)) sheets.push({name:k.replace(/^.*\//,""),path:k});
    });
  }
  if(!sheets.length) throw new Error("לא נמצאו גיליונות בקובץ");

  function sheetToGrid(path){
    var doc=xmlOf(files[path]), rows=[];
    Array.prototype.forEach.call(doc.getElementsByTagName("row"),function(rowEl){
      var cells=[];
      Array.prototype.forEach.call(rowEl.getElementsByTagName("c"),function(c){
        var idx=colToIdx(c.getAttribute("r")||"");
        var t=c.getAttribute("t")||"";
        var v="";
        if(t==="inlineStr"){
          var is=c.getElementsByTagName("is")[0];
          if(is){ Array.prototype.forEach.call(is.getElementsByTagName("t"),function(tt){ v+=tt.textContent; }); }
        }else{
          var vEl=c.getElementsByTagName("v")[0];
          if(vEl){ v=vEl.textContent; if(t==="s") v=shared[Number(v)]!=null?shared[Number(v)]:""; }
        }
        cells[idx]=v;
      });
      for(var i=0;i<cells.length;i++) if(cells[i]==null) cells[i]="";
      rows.push(cells);
    });
    return rows;
  }

  function deliver(grid,label){
    if(onGrid){
      grid=grid.filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); });
      if(nameEl) nameEl.textContent="✅ "+label+" ("+grid.length+" שורות)";
      onGrid(grid,label);
    } else xlsxGridToTextarea(grid,label);
  }
  if(sheets.length===1){ deliver(sheetToGrid(sheets[0].path),fname+" · "+sheets[0].name); return; }
  // כמה גיליונות — נותנים לבחור
  openModal({title:"באיזה גיליון להשתמש?",bodyHtml:
    '<div class="field"><label>הקובץ מכיל '+sheets.length+' גיליונות</label><select id="xl-sheet">'+
      sheets.map(function(s,i){return '<option value="'+i+'">'+esc(s.name)+'</option>';}).join("")+
    '</select></div>',
    saveLabel:"טען גיליון",onSave:function(){
      var s=sheets[Number(val("xl-sheet"))||0];
      deliver(sheetToGrid(s.path),fname+" · "+s.name);
    }});
}
function xlsxGridToTextarea(grid,label){

  if(!grid.length){ toast("הגיליון ריק","err"); return; }
  var tsv=grid.map(function(r){
    return r.map(function(c){
      c=String(c==null?"":c);
      if(/[\t\n\r"]/.test(c)) c='"'+c.replace(/"/g,'""')+'"';
      return c;

  }).join("\n");

  var nameEl=document.getElementById("im-file-name");

  toast("נטענו "+grid.length+" שורות מהקובץ","ok");
  parseImport();

function impDate(v){
  var s=String(v==null?"":v).trim(); if(!s) return todayISO();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  // מספר סידורי של אקסל (ימים מ-30/12/1899) — כך מגיעים תאריכים מקובץ xlsx
  if(/^\d+(\.\d+)?$/.test(s)){
    var n=parseFloat(s);
    if(n>=15000 && n<=80000){
      var d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);
      return d.toISOString().slice(0,10);
    }
  }
  var p=s.split(/[\/.\-]/);
  if(p.length===3){ var y=p[2].length===4?p[2]:("20"+p[2]);
    return y+"-"+String(p[1]).trim().padStart(2,"0")+"-"+String(p[0]).trim().padStart(2,"0"); }
  return todayISO();
}
