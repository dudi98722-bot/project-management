/* ---------- המרת טבלה שעל המסך לגיליון ---------- */
function xlParse(txt){
  /* סימני כיווניות נמחקים ולא מוחלפים ברווח, אחרת נוצר רווח מדומה
     שלא היה על המסך ומחרוזות "₪‎-1,234" לא מזוהות כמספר. */
  var s=String(txt==null?"":txt).replace(/[‎‏‪-‮]/g,"").replace(/ /g," ").trim();
  if(!s) return "";
  var d=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if(d) return {t:"d",v:d[3]+"-"+("0"+d[2]).slice(-2)+"-"+("0"+d[1]).slice(-2)};
  /* הערה בסוגריים אחרי הסכום ("₪-1,234 (חייב)") — הערך הוא המספר */
  var body=s.replace(/\s*\([^()]*\)\s*$/,"").trim()||s;
  var isMoney=/₪/.test(body), isPct=/%\s*$/.test(body);
  var core=body.replace(/₪/g,"").replace(/%/g,"").replace(/,/g,"").trim();
  if(core && /^-?\d+(\.\d+)?$/.test(core)){
    /* מחרוזת ספרות שאינה ערך מספרי — טלפון, ת"ז, מספר חשבון — נשארת
       טקסט: אפס מוביל היה נמחק, ומספר ארוך היה מאבד דיוק. */
    var digits=core.replace(/^-/,"").replace(".","");
    var looksId = (!isMoney && !isPct) && (/^0\d/.test(core) || digits.length>15);
    var n=parseFloat(core);
    if(!looksId && isFinite(n)) return {t:isMoney?"money":(isPct?"pct":"n"),v:n};
    if(looksId) return s;
  }
  /* תא רב-שורתי שבשורתו הראשונה מספר והשאר הערת תצוגה — לוקחים את המספר */
  if(s.indexOf("\n")>0){
    var first=xlParse(s.split("\n")[0]);
    if(first && typeof first==="object" && first.t!=="d") return first;
  }
  return s;
}
/* פורש שורה לפי colspan, כך שעמודות נשארות מיושרות */
function xlRowCells(tr,n){
  var out=new Array(n).fill(null), i=0;
  Array.prototype.forEach.call(tr.cells,function(c){
    var span=Math.max(1,Number(c.getAttribute("colspan"))||1);
    if(i<n) out[i]=c;
    i+=span;
  });
  return out;
}
/* טקסט התא לצורך ייצוא. אלמנטים עם data-xl-skip הם הערות תצוגה
   ("סך תתי-השלבים", תגיות מונה) ולא חלק מהערך — מסירים אותם. */
function cellText(c){
  if(!c) return "";
  var t;
  if(c.querySelector && c.querySelector("[data-xl-skip]")){
    var cl=c.cloneNode(true);
    cl.querySelectorAll("[data-xl-skip]").forEach(function(x){ x.remove(); });
    t=cl.textContent||"";
  } else t=c.innerText||c.textContent||"";
  t=String(t).replace(/[▲▼]/g,"").trim();
  /* תא שכל תוכנו תיבת סימון — הערך שעל המסך הוא המצב שלה */
  if(!t){
    var cb=c.querySelector&&c.querySelector('input[type="checkbox"]');
    if(cb) return cb.checked?"כן":"לא";
  }
  return t;
}
/* עמודות שלא מיוצאות: עמודת פעולות (רק כפתורים/פקדים או ריקה),
   או עמודה שהכותרת שלה מסומנת data-xl-skip (גרף, פס התפלגות וכד'). */
function xlSkipCols(hr,rows,n){
  var skip=new Array(n).fill(false);
  for(var i=0;i<n;i++){
    if(hr&&hr[i]&&hr[i].hasAttribute&&hr[i].hasAttribute("data-xl-skip")){ skip[i]=true; continue; }
    var any=false, onlyCtl=true;
    rows.forEach(function(r){
      var c=r[i]; if(!c) return;
      var t=cellText(c); if(!t) return;
      any=true;
      var clone=c.cloneNode(true);
      clone.querySelectorAll("button,input,select,textarea").forEach(function(x){ x.remove(); });
      if(String(clone.textContent||"").trim()) onlyCtl=false;
    });
    var head=hr?cellText(hr[i]):"";
    if(!head && (!any || onlyCtl)) skip[i]=true;
  }
  return skip;
}
function tableToSheet(t,name){
  var head=t.tHead, bodyEl=t.tBodies[0];
  var hr0=head&&head.rows.length?head.rows[0]:null;
  var n=0;
  if(hr0) Array.prototype.forEach.call(hr0.cells,function(c){ n+=Math.max(1,Number(c.getAttribute("colspan"))||1); });
  if(!n && bodyEl&&bodyEl.rows.length) n=bodyEl.rows[0].cells.length;
  if(!n) return {name:name,rows:[]};

  var hr=hr0?xlRowCells(hr0,n):null;
  /* רק שורות שנראות על המסך — כך שהייצוא מכבד את הסינון הפעיל */
  var visible=[];
  if(bodyEl) Array.prototype.forEach.call(bodyEl.rows,function(tr){
    if(tr.style.display==="none") return;
    if(tr.querySelector("td.empty")) return;
    visible.push(xlRowCells(tr,n));
  });
  var skip=xlSkipCols(hr,visible,n);
  function pack(cells,raw){
    var out=[];
    for(var i=0;i<n;i++){ if(skip[i]) continue; out.push(raw?cellText(cells[i]):xlParse(cellText(cells[i]))); }
    return out;
  }
  var rows=[];
  rows.push(hr?pack(hr,true):[]);
  visible.forEach(function(r){ rows.push(pack(r,false)); });
  var foot=[];
  if(t.tFoot) Array.prototype.forEach.call(t.tFoot.rows,function(tr){ foot.push(pack(xlRowCells(tr,n),false)); });
  return {name:name,rows:rows,foot:foot};
}
function exportTableEl(t,filename,sheetName){
  var sh=tableToSheet(t,sheetName||"נתונים");
  if(sh.rows.length<2){ toast("אין שורות לייצוא","warn"); return; }
  saveXlsx([sh],filename||"טבלה");
}
/* כפתור ייצוא לכל טבלה על המסך */
var _xlSeq=0, _xlReg={};
function attachExportButtons(root){
  if(!canDownload()) return;   /* צופה — אין טעם בכפתור שיידחה בשער ההורדות */
  var scope=root||document;
  /* טבלה שנדרסה ברינדור חלקי כבר לא ב-DOM. בלי הניקוי הזה המפה
     הייתה גדלה בלי גבול ומחזיקה טבלאות מנותקות בזיכרון. */
  Object.keys(_xlReg).forEach(function(k){
    if(!document.body.contains(_xlReg[k])) delete _xlReg[k];
  });
  scope.querySelectorAll("table.tbl").forEach(function(t){
    if(t.getAttribute("data-xl")) return;
    if(!t.tBodies.length||!t.tBodies[0].rows.length) return;
    if(t.tBodies[0].rows.length===1&&t.tBodies[0].rows[0].querySelector("td.empty")) return;
    var id="xl"+(++_xlSeq); t.setAttribute("data-xl",id); _xlReg[id]=t;
    var title=xlTitleFor(t);
    var bar=document.createElement("div");
    bar.className="xl-bar";
    bar.innerHTML='<button class="btn btn-ghost btn-sm" onclick="exportById(\''+id+'\')" '+
      'title="ייצוא הטבלה לאקסל (מכבד את הסינון הפעיל)">⬇️ אקסל</button>';
    var wrap=t.closest(".table-wrap")||t;
    wrap.parentNode.insertBefore(bar,wrap);
  });
}
function xlTitleFor(t){
  var box=t.closest(".card")||t.closest(".modal")||null;
  var h=box?box.querySelector("h3,h4,.section-title"):null;
  var s=h?String(h.innerText||h.textContent||"").trim():"";
  /* מחלקת תווים עם אימוג'י מתפרקת ליחידות UTF-16 ומשאירה חצי סורוגייט,
     שהופך ל-"�" בשם הגיליון ובשם הקובץ. עובדים ברמת נקודת קוד. */
  s=Array.from(s).filter(function(ch){
    var cp=ch.codePointAt(0);
    if(cp===0xFE0F||cp===0x200D||cp===0x20E3) return false;
    if(cp>=0x2190&&cp<=0x27BF) return false;
    if(cp>=0x2B00&&cp<=0x2BFF) return false;
    if(cp>=0x1F000&&cp<=0x1FAFF) return false;
    return true;
  }).join("").replace(/\s+/g," ").trim();
  return s.slice(0,40)||"טבלה";
}
/* רינדור חלקי (חיפוש, סינון, מיון, בורר שותף…) דורס innerHTML של מכולה
   פנימית ומוחק איתו את שורת הכפתור ואת שורת הסינון. במקום לזכור לקרוא
   לזה מתוך כל פונקציית רינדור — משקיפים על ה-DOM ומחזירים את הכלים
   לכל טבלה חדשה, כך שגם כל טבלה עתידית מכוסה מאליה. */
var _toolsPending=false;
function scheduleTableTools(){
  if(_toolsPending) return;
  _toolsPending=true;
  setTimeout(function(){
    _toolsPending=false;
    try{ attachTableTools(document); attachExportButtons(document); }catch(e){}
  },60);
}
/* כל בורר שיש בו אופציית "הוסף חדש…" זוכר את ערכו לפני השינוי, כדי
   שביטול ה-prompt יחזיר את הבחירה במקום למחוק אותה. */
function watchSelects(){
  ["focusin","change"].forEach(function(ev){
    document.addEventListener(ev,function(e){
      var el=e.target;
      if(el&&el.tagName==="SELECT"&&el.value!=="__new") el.setAttribute("data-prev",el.value);
    },true);
  });
}
function watchTables(){
  if(!window.MutationObserver) return;
  new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      var ad=muts[i].addedNodes;
      for(var j=0;j<ad.length;j++){
        var n=ad[j];
        if(n.nodeType!==1) continue;
        if((n.matches&&n.matches("table.tbl"))||(n.querySelector&&n.querySelector("table.tbl"))){
          scheduleTableTools(); return;
        }
      }
    }
  }).observe(document.body,{childList:true,subtree:true});
}
function exportById(id){

  });

}

/* תאי החלוקה בשורת השלב. שלב בלי חלוקה משלו מציג את ברירת המחדל של
   הפרוייקט, בסוגריים, כדי שיהיה ברור שזו לא חלוקה שנקבעה עליו.
   למכל אין חלוקה — היא יושבת בתתי-השלבים. */
function splitCellsFor(e,cont,spCols){
  if(!spCols.length) return "";
  if(cont) return spCols.map(function(){ return '<td class="muted">—</td>'; }).join("")+'<td class="muted">—</td>';
  var own={}, hasOwn=false;
  expSplits(e.id).forEach(function(x){ own[x.partnerId]=Number(x.percent)||0; hasOwn=true; });
  var sum=0;
  var cells=spCols.map(function(ap){
    var pct = hasOwn ? (own[ap.partnerId]||0) : (Number(ap.defaultPercent)||0);
    sum+=pct;
    if(!pct) return '<td class="muted">—</td>';
    return '<td'+(hasOwn?'':' class="muted" title="ברירת המחדל של הפרוייקט"')+'>'+
      num(pct)+'%'+(hasOwn?'':' *')+'</td>';
  }).join("");
  return cells+'<td class="'+(Math.abs(sum-100)<0.01?"pos":"neg")+'"><b>'+num(sum)+'%</b></td>';
}

/* ---------- תת-שלבים ----------
   שלב שיש לו תתי-שלבים הוא "מכל": הסכום שלו נגזר מסך תתי-השלבים
   (חשמל = 15,000 כשמתוכו 7,500 ל-5/22 ו-7,500 ל-6/22), והוא עצמו
   אינו נספר בחישובים — תתי-השלבים הם ההוצאות האמיתיות, ולכן אין
   ספירה כפולה. הכסף, החלוקה והתשלומים יושבים בתתי-השלבים. */
function expenseChildren(eId){
  if(IX) return IX.kidsByPar[eId]||IX_EMPTY;
  return active(DB.expenses).filter(function(x){ return x.parentId===eId; });
}
function isContainer(eId){ return expenseChildren(eId).length>0; }
/* ההוצאות שנספרות בכסף: הכל חוץ ממכלים */
function apLeafExpensesRaw(aptId){
  if(IX){ var c=IX.leaf[aptId];
    if(!c){ c=IX.leaf[aptId]=apExpenses(aptId).filter(function(e){ return !isContainer(e.id); }); }
    return c; }
  return apExpenses(aptId).filter(function(e){ return !isContainer(e.id); });
}
function apLeafExpenses(aptId){ return repFilter(apLeafExpensesRaw(aptId)); }
/* סכום המכל = סך תתי-השלבים. נקרא אחרי כל שינוי בתת-שלב.
   גם כשנמחק תת-השלב האחרון הסכום מתאפס: אחרת השלב היה חוזר להיספר
   כשלב רגיל, עם סכום של בנים שכבר לא קיימים — וללא חלוקת שותפים,
   כך שהעלות הכוללת הייתה גדלה בלי שאף שותף מחויב בה. */
function syncParentAmount(pid){
  var p=byId(DB.expenses,pid); if(!p) return;
  var kids=expenseChildren(pid);
  if(!kids.length){
    /* מאפסים רק כשזה מכל לשעבר — בלי חלוקה ובלי תשלומים משלו —
       כדי שקריאה שגויה לא תמחק סכום של שלב אמיתי. */
    if(!expSplits(pid).length && !expPayments(pid).length) p.amount=0;
    return;
  }
  p.amount=round2(kids.reduce(function(s,k){return s+(Number(k.amount)||0);},0));
}
function syncAllParents(aptId){
  apExpenses(aptId).forEach(function(e){ if(isContainer(e.id)) syncParentAmount(e.id); });
}
/* הפיכת שלב קיים למכל: אם יש בו כסף/תשלומים/חלוקה — מעבירים אותם
   לתת-שלב ראשון, כדי ששום דבר לא ייעלם כשהאב הופך לסיכום. */
function convertToContainer(pid,silent){
  var p=byId(DB.expenses,pid); if(!p) return true;
  if(isContainer(pid)) return true;                     // כבר מכל
  var pays=expPayments(pid);
  var hasMoney=(Number(p.amount)||0)>0.01 || pays.length;
  if(!hasMoney){ return true; }
  if(!silent && !confirm('"'+p.description+'" יהפוך לשלב-אב שמסכם את תתי-השלבים.\n\n'+
    'הסכום הקיים ('+money(p.amount)+')'+(pays.length?' ו-'+pays.length+' התשלומים שלו':'')+
    ' יועברו לתת-שלב ראשון, כדי שלא ייעלמו.\n\nלהמשיך?')) return false;
  var cid=uid();
  DB.expenses.push({id:cid,apartmentId:p.apartmentId,categoryId:p.categoryId||"",
    classification:p.classification,description:p.description,amount:p.amount,date:p.date,
    note:p.note||"",hasInvoice:p.hasInvoice,invoiceLink:p.invoiceLink||"",
    mgmtEnabled:p.mgmtEnabled,mgmtBaseType:p.mgmtBaseType,mgmtVatRate:p.mgmtVatRate,
    parentId:pid,deleted:false});
  /* מעבירים חלוקה, דמי ניהול ותשלומים לתת-השלב */
  DB.expenseSplits.forEach(function(s){ if(s.expenseId===pid) s.expenseId=cid; });
  DB.expenseManagerFees.forEach(function(f){ if(f.expenseId===pid) f.expenseId=cid; });
  DB.payments.forEach(function(x){ if(x.expenseId===pid) x.expenseId=cid; });
  p.mgmtEnabled=false; p.hasInvoice=false; p.invoiceLink="";
  syncParentAmount(pid);
  return true;
}
function expenseParentOptions(aptId,selfId,sel){
  var opts=apExpenses(aptId).filter(function(e){
    if(e.id===selfId) return false;
    if(e.parentId) return false;          // רק רמה אחת של קינון
    return true;
  }).sort(function(x,y){ return String(x.description).localeCompare(String(y.description),"he"); });
  return '<option value="">— שלב עצמאי (ללא אב) —</option>'+
    opts.map(function(e){
      return '<option value="'+e.id+'"'+(e.id===sel?" selected":"")+'>'+esc(e.description)+'</option>'; }).join("");
}
/* הוספת תת-שלב מתוך שורת האב */
function addSubExpense(parentId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var p=byId(DB.expenses,parentId); if(!p) return;
  if(p.parentId){ toast("אפשר תת-שלב רק תחת שלב עצמאי","err"); return; }
  /* מרגע שיש תת-שלב, השלב הופך למכל שמסכם אותם. כסף שכבר רשום עליו
     עובר לתת-שלב ראשון כדי שלא ייעלם. */
  var wasLeaf=!isContainer(parentId);
  if(!convertToContainer(parentId)) return;
  if(wasLeaf && isContainer(parentId)){ save(); toast("הכסף שהיה על השלב הועבר לתת-שלב ראשון","ok"); }
  openExpenseEditor(null,p.apartmentId,parentId);
}
function filteredExpenses(aptId){
  return apExpenses(aptId).filter(function(e){
    if(!matches(Q.exp, e.description+" "+(e.note||""))) return false;
    if(Q.expStatus && expenseStatus(e.id)!==Q.expStatus) return false;
    if(Q.expClass && e.classification!==Q.expClass) return false;
    /* סינון קטגוריה — שלב-אב לא נופל בסינון: הוא מוצג אם תת-שלב שלו עובר */
    if(Q.expCat){
      var isCont=expenseChildren(e.id).length>0;
      if(!isCont){
        if(Q.expCat==="__none"){ if(e.categoryId&&categoryName(e.categoryId)) return false; }
        else if(e.categoryId!==Q.expCat) return false;
      }else if(!expenseChildren(e.id).some(function(k){
        return Q.expCat==="__none" ? !(k.categoryId&&categoryName(k.categoryId)) : k.categoryId===Q.expCat; })) return false;
    }
    return true;
  });
}
function expTableHtml(aptId){
  var a=byId(DB.apartments,aptId);
  var all=apExpenses(aptId);
  var exps=filteredExpenses(aptId);
  var cnt=document.getElementById("exp-count");
  if(cnt) cnt.innerHTML=countLine(exps.length,all.length,"שלבים");
  if(!exps.length) return '<div class="empty">לא נמצא שלב שמתאים לסינון</div>';
  var selC=can("edit");
  /* עמודות חלוקת השותפים — מתג אחד שפותח אותן לכל השורות בבת אחת,
     במקום הצצה נפרדת לכל שורה. השותפים נכנסים בסוף השורה (בעברית —
     בצד שמאל), אחרי כפתורי הפעולה. */
  var spCols=(Q.expSplit==="1") ? apPartners(aptId) : [];
  var h='<div class="table-wrap"><table class="tbl"><thead><tr>'+
    (selC?'<th class="chk" data-xl-skip="1" style="width:30px"><input type="checkbox" title="סמן הכל" style="width:auto" onclick="ebAll(this.checked)"></th>':'')+
    '<th>תאריך</th><th>תיאור</th><th>קטגוריה</th><th>סיווג</th><th>סכום</th>'+
    (a.hasManagement?'<th title="✔ יש דמי ניהול · ✖ אין · ריק = טרם סומן">דמי ניהול?</th><th>דמי ניהול</th>':'')+
    '<th>שולם</th><th>נותר</th><th>סטטוס</th><th></th>'+
    spCols.map(function(ap){

    (spCols.length?'<th>סה"כ %</th>':'')+
    '</tr></thead><tbody>';

  /* שורת שלב — נעשה שימוש גם לאב וגם לתת-שלב */
  function rowFor(e,isChild){
    var st=expenseStatus(e.id), rem=expenseRemaining(e.id);
    var badge=st==="paid"?'<span class="badge badge-ok">שולם</span>'
      :st==="over"?'<span class="badge badge-warn">⚠️ ביתר</span>'
      :st==="partial"?'<span class="badge badge-warn">חלקי</span>':'<span class="badge badge-danger">לא שולם</span>';
    var kids=expenseChildren(e.id), cont=kids.length>0;
    var mg=expenseMgmtCostLive(e.id);
    return '<tr data-eid="'+e.id+'"'+(isChild?' data-parent="'+e.parentId+'"':'')+
      (isChild?' style="background:#fbfcff"':(cont?' style="background:#f5f8ff"':''))+'>'+
      (selC?'<td class="chk">'+(cont?'':'<input type="checkbox" class="eb-x" value="'+e.id+'" style="width:auto" onchange="ebCount()">')+'</td>':'')+
      '<td>'+dateHe(e.date)+'</td>'+
      '<td'+(isChild?' style="padding-right:26px"':'')+'>'+
        (isChild?'<span class="muted">↳ </span>':'')+
        '<b>'+esc(e.description)+'</b>'+(e.hidden?' <span class="badge badge-danger" title="מוסתר משאר המשתמשים">🔒 מוסתר</span>':'')+
        (e.noReport?' <span class="badge badge-muted badge-unit" title="לא נספר בדוחות">🚫 לא בדוח</span>':'')+
        (!e.noReport&&e.noFreilich?' <span class="badge badge-muted badge-unit" title="לא נספר בדוח לפרייליך">🚫 פרייליך</span>':'')+(e.hasInvoice?' 📎':'')+
        (cont?' <span class="pill" data-xl-skip="1">'+kids.length+' תתי-שלבים</span>':'')+'</td>'+
      /* לשלב-אב אין קטגוריה משלו — הקטגוריות יושבות בתתי-השלבים */
      '<td>'+(cont?'<span class="muted">—</span>':esc(categoryName(e.categoryId)||""))+'</td>'+
      '<td>'+(CLASSIFICATIONS[e.classification]||"")+'</td>'+
      '<td><b>'+money(e.amount)+'</b>'+(cont?'<div class="muted" data-xl-skip="1" style="font-size:11px">סך תתי-השלבים</div>':'')+'</td>'+
      (a.hasManagement?'<td>'+mgmtMarkCell(e,cont)+'</td><td>'+mgmtAmountCell(e,cont,mg)+'</td>':'')+
      '<td>'+money(expensePaid(e.id))+'</td><td class="'+(Math.abs(rem)>0.01?"neg":"pos")+'">'+money(rem)+'</td><td>'+badge+'</td>'+
      '<td class="right" style="white-space:nowrap">'+
        /* למכל אין תשלומים משלו — הכסף יושב בתתי-השלבים */
        (cont?'':'<button class="btn btn-ghost btn-sm" onclick="openPayments(\''+e.id+'\')" title="תשלומים">💳</button>')+
        (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openExpenseEditor(\''+e.id+'\',\''+aptId+'\')" title="עריכה">✏️</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="softDelete(\'expenses\',\''+e.id+'\',\'למחוק הוצאה זו?\')">🗑️</button>':'')+'</td>'+
      splitCellsFor(e,cont,spCols)+'</tr>';
  }

  /* קיבוץ: אב ואחריו תתי-השלבים שלו. תת-שלב שהאב שלו לא במסונן — מוצג לבד.
     שורת האב היא כבר הסיכום (סכום, שולם ונותר מגולגלים), ולכן היא נספרת
     פעם אחת בסיכום התחתון והתתי-שלבים שמתחתיה לא נספרים שוב. */
  var shown={}; exps.forEach(function(e){ shown[e.id]=1; });
  var order=exps.slice().sort(function(x,y){return (x.date<y.date)?1:-1;});
  var tot=0, totPaid=0;
  order.forEach(function(e){
    if(e.parentId && shown[e.parentId]) return;          // ייוצג תחת האב
    h+=rowFor(e,!!e.parentId);
    tot+=(Number(e.amount)||0); totPaid+=expensePaid(e.id);
    expenseChildren(e.id).filter(function(k){ return shown[k.id]; })
      .sort(function(x,y){return (x.date<y.date)?1:-1;})
      .forEach(function(k){ h+=rowFor(k,true); });
  });
  var lbl=(exps.length===all.length)?'סה"כ':'סה"כ המסונן';
  h+='</tbody><tfoot><tr><td colspan="'+(selC?5:4)+'">'+lbl+'</td><td>'+money(tot)+'</td>'+(a.hasManagement?'<td></td><td></td>':'')+'<td>'+money(totPaid)+'</td><td>'+money(tot-totPaid)+'</td><td colspan="2"></td></tr></tfoot></table></div>';
  return h;
}

function onEbCatMode(){

  w.style.display=(val("eb-cat-mode")==="set")?"block":"none";
}
/* מציגים את שדות האחוזים רק כשנבחר "אחוזים שאזין כאן" */
function onEbSplitMode(){
  var w=document.getElementById("eb-split-custom"); if(!w) return;
  w.style.display=(val("eb-split")==="__custom")?"block":"none";
}
function applyBulkExpEdit(aptId,ids){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  /* קריאה ישירה מהאלמנט: val()||"__keep" בלע את האפשרות "ללא קטגוריה"
     (ערך ריק) והפך אותה ל"ללא שינוי" — כלומר ניקוי קטגוריה בעדכון
     המרוכז מעולם לא עבד. */
  var _ebc=document.getElementById("eb-cat-mode");
  var catMode=_ebc?_ebc.value:"__keep";
  var cat=catMode==="__keep"?"__keep":(catMode===""?"":pickCategoryId("eb-cat"));
  if(catMode==="set" && !cat){ toast("הקלד קטגוריה, או בחר \"ללא שינוי\"","err"); return false; }
  var cls=val("eb-class"), date=val("eb-date");
  var mg=document.getElementById("eb-mgmt")?val("eb-mgmt"):"__keep";
  var hid=document.getElementById("eb-hidden")?val("eb-hidden"):"__keep";
  var rep=document.getElementById("eb-inrep")?val("eb-inrep"):"__keep";
  var frl=document.getElementById("eb-frl")?val("eb-frl"):"__keep";
  var splitMode=document.getElementById("eb-split")?val("eb-split"):"__keep";
  if(cat==="__keep" && cls==="__keep" && !date && mg==="__keep" && hid==="__keep" && rep==="__keep" && frl==="__keep" && splitMode==="__keep"){
    toast("לא נבחר מה לעדכן","warn"); return false;
  }
  var mgrs=apManagers(aptId);
  if(mg==="on" && !mgrs.length){ toast("אין מנהלים מוגדרים בפרוייקט — הוסף אותם קודם בלשונית \"דמי ניהול\"","err"); return false; }
  /* בונים את שורות החלוקה פעם אחת — אותה חלוקה לכל השלבים שסומנו */
  var splitRows=null;
  if(splitMode!=="__keep"){
    if(splitMode==="__custom"){
      splitRows=[]; var sum=0;
      document.querySelectorAll(".eb-sp").forEach(function(inp){
        var pc=Number(inp.value)||0; sum+=pc;
        if(pc>0) splitRows.push({partnerId:inp.getAttribute("data-p"),percent:pc});
      });
      if(!splitRows.length){ toast("הזן אחוזים לשותפים, או בחר \"ללא שינוי\" בחלוקה","err"); return false; }
      if(Math.abs(sum-100)>0.01){ toast("החלוקה חייבת להסתכם ל-100% (כרגע "+num(sum)+"%)","err"); return false; }
    }else{
      splitRows=splitPresetRows(aptId,splitMode==="__default"?"__default":splitMode);
      if(!splitRows.length){ toast("לחלוקה שנבחרה אין שורות — בדוק את השותפים","err"); return false; }
    }
  }
  var n=0;
  ids.forEach(function(id){
    var e=byId(DB.expenses,id); if(!e||e.deleted || isContainer(e.id)) return;
    if(cat!=="__keep") e.categoryId=cat;
    if(cls!=="__keep") e.classification=cls;
    if(date) e.date=date;
    if(splitRows) setExpenseSplits(id,splitRows);
    if(mg==="on"){
      /* לא מספיק לסמן דגל — צריך גם ליצור את רשומות דמי הניהול לכל מנהל
         לפי ברירת המחדל שלו, אחרת החישוב יוצא 0 עד עריכה ידנית של השורה. */
      e.mgmtEnabled=true; e.mgmtSet=true;
      if(e.mgmtBaseType==null) e.mgmtBaseType="full";
      if(e.mgmtVatRate==null) e.mgmtVatRate=18;
      var have={}; expMgrFees(e.id).forEach(function(f){ have[f.managerId]=1; });
      mgrs.forEach(function(m){
        if(!have[m.id]) DB.expenseManagerFees.push({id:uid(),expenseId:e.id,managerId:m.id,
          pctCurrent:Number(m.defaultFeePercent)||0,pctDeferred:0,deferredLabel:"",deferredReleased:false,deleted:false});
      });
      syncAutoMgmtPayments(e.id);   // תשלום "שווה ערך" אוטומטי אם מוגדר בפרויקט
    } else if(mg==="off"){ e.mgmtEnabled=false; e.mgmtSet=true; }
    if(CU&&CU.role==="admin"){ if(hid==="on") e.hidden=true; else if(hid==="off") e.hidden=false; }
    if(rep==="on") e.noReport=false; else if(rep==="off") e.noReport=true;
    if(frl==="on") e.noFreilich=false; else if(frl==="off") e.noFreilich=true;
    n++;
  });
  save(); toast("עודכנו "+n+" שלבים","ok"); rerender();
  return true;
}

/* ============================================================
   חלוקות שמורות — ברירות מחדל נוספות בשם, לכל פרוייקט
   נשמרות על אובייקט הפרוייקט (a.splitPresets), כדי לרכב על מנגנון
   הסינון והמיזוג בשרת בלי טבלה חדשה.
   ============================================================ */
function apSplitPresets(aptId){ var a=byId(DB.apartments,aptId); return (a&&a.splitPresets)||[]; }
function splitPresetRows(aptId,presetId){
  if(presetId==="__default"||!presetId)
    return apPartners(aptId).map(function(p){ return {partnerId:p.partnerId,percent:Number(p.defaultPercent)||0}; });
  var p=apSplitPresets(aptId).filter(function(x){ return x.id===presetId; })[0];
  return p?p.rows.map(function(r){return {partnerId:r.partnerId,percent:Number(r.percent)||0};}):[];
}

function saveSplitPreset(aptId,id){
  var name=val("sp-name").trim(); if(!name){ toast("יש להזין שם לחלוקה","err"); return false; }
  var byP={}, order=[];
  document.querySelectorAll("#sp-rows .split-row").forEach(function(r){
    var pid=r.querySelector(".sp-partner").value; var pct=Number(r.querySelector(".sp-pct").value)||0;
    if(pid){ if(byP[pid]==null){byP[pid]=0;order.push(pid);} byP[pid]+=pct; }
  });
  var rows=order.map(function(pid){ return {partnerId:pid,percent:byP[pid]}; });
  if(!rows.length){ toast("הוסף לפחות שותף אחד","err"); return false; }
  var sum=rows.reduce(function(s,r){return s+r.percent;},0);
  if(Math.abs(sum-100)>0.01){ toast("סכום החלוקה חייב להיות 100% (כרגע "+num(sum)+"%)","err"); return false; }
  var a=byId(DB.apartments,aptId); a.splitPresets=a.splitPresets||[];
  if(id){ var p=a.splitPresets.filter(function(x){return x.id===id;})[0]; if(p){ p.name=name; p.rows=rows; } }
  else a.splitPresets.push({id:uid(),name:name,rows:rows});
  save(); toast("נשמר","ok"); rerender();
}
function delSplitPreset(aptId,id){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  var a=byId(DB.apartments,aptId); if(!a||!a.splitPresets) return;
  var p=a.splitPresets.filter(function(x){return x.id===id;})[0];
  if(!confirm('למחוק את החלוקה "'+(p?p.name:"")+'"?')) return;
  a.splitPresets=a.splitPresets.filter(function(x){return x.id!==id;});
  save(); toast("נמחק","ok"); rerender();
}

  });
  h+='</tbody><tfoot><tr><td colspan="3">סה"כ ('+rows.length+' תנועות)'+(depTot?' · מזה הפקדות '+money(depTot):'')+'</td><td>'+money(round2(tot+depTot))+'</td><td colspan="3"></td></tr></tfoot></table></div>';

/* שורת הסינון של הטבלה מסתירה שורות ויזואלית בלבד (display:none) —
   התיבות שלהן נשארות מסומנות. פעולה מרוכזת חייבת לחול רק על מה
   שנראה על המסך, אחרת סינון ל-3 שלבים היה משנה את כל 47. */
function bmVisibleBoxes(sel){ return visibleBoxes(sel||".bm-x"); }
/* שורת הסינון מסתירה שורות ויזואלית בלבד — פעולה מרוכזת חלה רק על
   מה שנראה על המסך, אחרת סינון היה משנה גם את מה שלא רואים. */
function visibleBoxes(sel){
  return Array.prototype.filter.call(document.querySelectorAll(sel),function(c){
    var tr=c.closest("tr");
    return !tr || tr.style.display!=="none";
  });
}
function bulkMgmtSelectAll(v){
  bmVisibleBoxes().forEach(function(c){ c.checked=v; });
  bulkMgmtCount();
}
function bulkMgmtCount(){
  var n=bmVisibleBoxes(".bm-x:checked").length;
  var hidden=document.querySelectorAll(".bm-x:checked").length-n;
  var el=document.getElementById("bm-count");
  if(el) el.textContent="נבחרו "+n+(hidden?" (מוסתרים בסינון: "+hidden+" — לא ישתנו)":"");
}
function bulkMgmtToggleMode(){
  var rm=checked("bm-remove");
  ["bm-base","bm-vat"].forEach(function(id){ var el=document.getElementById(id); if(el) el.disabled=rm; });
  document.querySelectorAll('[id^="bm-cur-"],[id^="bm-def-"],[id^="bm-lbl-"]').forEach(function(el){ el.disabled=rm; });
}
function applyBulkMgmt(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var ids=bmVisibleBoxes(".bm-x:checked").map(function(c){return c.value;})
    .filter(function(id){ return !isContainer(id); });      // מכל אינו נושא דמי ניהול
  if(!ids.length){ toast("לא נבחר אף שלב","err"); return false; }
  var remove=checked("bm-remove");
  var mgrs=apManagers(aptId);
  if(remove){
    /* שלב שכבר שולם עליו למנהלים לא ניתן לכיבוי — אחרת התשלומים נספרים
       בלי צד עלות והמאזן נשבר. מדלגים עליו ומדווחים. */
    var blocked=[], okIds=[];
    ids.forEach(function(eid){
      var mPaid=expPayments(eid).filter(function(p){return p.recipientType==="manager"&&!p.auto;})
        .reduce(function(s,p){return s+(Number(p.amount)||0);},0);
      if(mPaid>0.01) blocked.push(eid); else okIds.push(eid);
    });
    if(!okIds.length){
      toast("בכל השלבים שנבחרו כבר שולמו דמי ניהול — אי אפשר לבטל. מחק קודם את התשלומים למנהלים","err");
      return false;
    }
    if(!confirm("יוסרו דמי ניהול מ-"+okIds.length+" שלבים"+
      (blocked.length? "\n("+blocked.length+" שלבים ידולגו כי כבר שולם בהם למנהלים)":"")+
      "\n\nהנתונים הקיימים יישמרו ויחזרו אם תחיל שוב.")) return false;
    okIds.forEach(function(eid){ var e=byId(DB.expenses,eid); if(e){ e.mgmtEnabled=false; e.mgmtSet=true; } syncAutoMgmtPayments(eid); });
    save();
    toast("דמי הניהול הוסרו מ-"+okIds.length+" שלבים"+(blocked.length?" · "+blocked.length+" דולגו (שולם בהם)":""),blocked.length?"warn":"ok");
    rerender(); return;
  }
  var base=val("bm-base")||"full", vat=Number(val("bm-vat")); if(isNaN(vat)) vat=18;
  var cfg=mgrs.map(function(m){
    return {id:m.id, cur:Number(val("bm-cur-"+m.id))||0, def:Number(val("bm-def-"+m.id))||0, lbl:val("bm-lbl-"+m.id)||"" };
  });
  if(!cfg.some(function(c){ return c.cur>0 || c.def>0; })){
    toast("כל האחוזים אפס — הזן אחוז לפחות למנהל אחד","err"); return false;
  }
  ids.forEach(function(eid){
    var e=byId(DB.expenses,eid); if(!e) return;
    e.mgmtEnabled=true; e.mgmtSet=true; e.mgmtBaseType=base; e.mgmtVatRate=vat;
    setExpenseMgrFees(eid, cfg.map(function(c){
      return {managerId:c.id,pctCurrent:c.cur,pctDeferred:c.def,deferredLabel:c.lbl,deferredReleased:false};
    }));
    syncAutoMgmtPayments(eid);
  });
  save();
  toast("דמי ניהול הוחלו על "+ids.length+" שלבים","ok");
  rerender();
}

/* תצוגה חיה של חישוב דמי הניהול, מתעדכנת בכל הקלדה */
function updateMgmtPreview(){
  var box=document.getElementById("mgmt-preview"); if(!box) return;
  var rowsEls=document.querySelectorAll("#mgmt-rows [data-mgr]");
  if(!rowsEls.length){ box.innerHTML=""; return; }
  var amt=Number(val("ex-amount"))||0;
  var baseType=val("ex-base")||"full", vat=Number(val("ex-vat"))||0;
  var b = baseType==="net17" ? amt/1.17 : baseType==="net18" ? amt/1.18 : amt;
  var vf = 1+vat/100;
  var out=[], totLive=0, totFull=0;
  Array.prototype.forEach.call(rowsEls,function(el){
    var mid=el.getAttribute("data-mgr"), nm=el.getAttribute("data-name")||"";
    var cur=Number(val("mf-cur-"+mid))||0, def=Number(val("mf-def-"+mid))||0, rel=checked("mf-rel-"+mid);
    var curAmt=b*cur/100*vf, defAmt=b*def/100*vf;
    var live=curAmt+(rel?defAmt:0), full=curAmt+defAmt;
    totLive+=live; totFull+=full;
    out.push('<tr><td>'+esc(nm)+'</td><td>'+money(curAmt)+'</td><td>'+money(defAmt)+(rel?' <span class="badge badge-ok">שוחרר</span>':'')+
      '</td><td><b>'+money(live)+'</b></td><td>'+money(full)+'</td></tr>');
  });
  box.innerHTML='<div class="table-wrap"><table class="tbl"><thead><tr>'+
    '<th>מנהל</th><th>נוכחי</th><th>דחוי</th><th>לתשלום עכשיו</th><th>סה"כ בסוף</th></tr></thead><tbody>'+
    out.join("")+'</tbody><tfoot><tr><td>בסיס: '+money(b)+(vat?' · מע"מ '+vat+'%':' · ללא מע"מ')+
    '</td><td colspan="2"></td><td><b>'+money(totLive)+'</b></td><td>'+money(totFull)+'</td></tr></tfoot></table></div>'+
    '<div class="hint">כל הסכומים כוללים מע"מ. "לתשלום עכשיו" = הנוכחי + הדחוי אם שוחרר — וזה גם התקרה לתשלום למנהל.</div>';
}

    '<div class="section-title">חלוקת שותפים <span class="hint">(מאותחל מברירת המחדל, ניתן לשנות)</span></div>'+

    (!splits.length && !apPartners(aptId).length

    '<div id="split-rows">'+splits.map(function(s){return splitRowHtml(s[0],s[1]);}).join("")+'</div>'+

  // דמי ניהול

        '<div class="field"><label>מע"מ על דמי הניהול</label><select id="ex-vat" onchange="updateMgmtPreview()">'+[0,17,18].map(function(v){return '<option value="'+v+'"'+((e?e.mgmtVatRate:18)==v?" selected":"")+'>'+(v===0?"ללא":v+"%")+'</option>';}).join("")+'</select></div>'+
      '</div>'+
      '<div id="mgmt-rows">'+
      (mgrs.length ? mgrs.map(function(m){
        var f=e?expMgrFees(eId).find(function(x){return x.managerId===m.id;}):null;
        var cur=f?f.pctCurrent:m.defaultFeePercent, def=f?f.pctDeferred:0, lbl=f?f.deferredLabel:"בסיום הבנייה", rel=f?f.deferredReleased:false;
        return '<div data-mgr="'+m.id+'" data-name="'+esc(m.name)+'" style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px">'+

        (eId ? '<button class="btn btn-primary btn-sm" onclick="addManagerFromExpense(\''+aptId+'\',\''+eId+'\')">➕ הוסף מנהל עכשיו</button>'

function saveExpense(eId,aptId){
  var a=byId(DB.apartments,aptId);
  var desc=val("ex-desc").trim(); var amount=Number(val("ex-amount"))||0;
  if(!desc){ toast("יש להזין תיאור","err"); return false; }
  /* שלב-אב (מכל): הסכום שלו נגזר מסך תתי-השלבים ואינו נערך ידנית */
  var isCont = !!(eId && isContainer(eId));
  if(isCont) amount=round2(expenseChildren(eId).reduce(function(s,k){return s+(Number(k.amount)||0);},0));
  else if(amount<=0){ toast("יש להזין סכום","err"); return false; }
  /* דמי ניהול — בחירה מפורשת חובה: עם / בלי (לפני יצירת רשומת ההוצאה) */
  var mgmtSel=document.getElementById("ex-mgmt");
  if(mgmtSel && mgmtSel.value===""){ toast("יש לבחור: עם דמי ניהול או בלי דמי ניהול","err"); return false; }
  // חלוקה — איחוד שורות כפולות לאותו שותף + ולידציה
  var byP={}, order=[]; document.querySelectorAll("#split-rows .split-row").forEach(function(r){
    var pid=r.querySelector(".sp-partner").value; var pct=Number(r.querySelector(".sp-pct").value)||0;
    if(pid){ if(byP[pid]==null){byP[pid]=0;order.push(pid);} byP[pid]+=pct; }
  });
  var rows=order.map(function(pid){ return {partnerId:pid,percent:byP[pid]}; });
  /* חלוקה נדרשת רק בפרוייקט שהוגדרו לה שותפים. פרוייקט אישי
     (קרן השתלמות, קופת חיסכון...) נשמרת בלי חלוקה כלל. */
  if(isCont){
    /* מכל: אין לו חלוקה משלו — היא יושבת בתתי-השלבים */
  } else if(!rows.length){
    if(apPartners(aptId).length){ toast("יש להוסיף לפחות שורת חלוקה אחת","err"); return false; }
  } else {
    var pctSum=rows.reduce(function(s,r){return s+r.percent;},0);
    if(Math.abs(pctSum-100)>0.01){ toast("סכום חלוקת השותפים חייב להיות 100% (כרגע "+num(pctSum)+"%)","err"); return false; }
  }
  if(eId){ var paidSoFar=expensePaid(eId);
    if(amount<paidSoFar-0.01){
      if(!confirm("סכום השלב החדש ("+money(amount)+") נמוך ממה שכבר שולם ("+money(paidSoFar)+").\n\nהשלב יסומן \"שולם ביתר\". להמשיך?")) return false;
    } }

  /* ---- שיוך לשלב-אב ----
     כל הוולידציות והאישורים רצים כאן, *לפני* שנוגעים ב-DB. אחרת ביטול
     ה-confirm של "יהפוך לשלב-אב" היה משאיר הוצאה חצי-שמורה בלי חלוקה,
     שנספרת בעלות אבל לא מחויבת לאף שותף. */
  var hasParentField = !!document.getElementById("ex-parent");
  var oldParent = eId ? (byId(DB.expenses,eId).parentId||null) : null;
  var pv = null;
  if(hasParentField){
    pv = val("ex-parent")||"";
    if(pv==="__new") pv="";
    if(eId && pv===eId) pv="";
    var pe = pv?byId(DB.expenses,pv):null;
    if(pv && !pe){ toast("שלב-האב שנבחר אינו קיים","err"); return false; }
    if(pe && pe.apartmentId!==aptId){ toast("שלב-האב שייך לפרוייקט אחר","err"); return false; }
    if(pe && pe.parentId){ toast("אפשר תת-שלב רק תחת שלב עצמאי","err"); return false; }
    if(pv && eId && expenseChildren(eId).length){ toast("לשלב הזה יש תתי-שלבים — לא ניתן לשייך אותו לאב","err"); return false; }
    /* אב שיש עליו כסף משלו הופך למכל — הכסף שלו עובר לתת-שלב ראשון.
       זו הפעולה הראשונה שמשנה נתונים, ומכאן והלאה אין עוד ביטולים. */
    if(pv && pv!==oldParent && !convertToContainer(pv)) return false;
  }

  var e;
  if(eId){ e=byId(DB.expenses,eId); }
  else{ e={id:uid(),apartmentId:aptId,deleted:false}; DB.expenses.push(e); eId=e.id; }
  e.description=desc; e.amount=amount; e.date=val("ex-date")||todayISO();
  if(document.getElementById("ex-cat")) e.categoryId=pickCategoryId("ex-cat");
  else e.categoryId=e.categoryId||"";
  e.classification=val("ex-class"); e.note=val("ex-note");
  if(hasParentField) e.parentId = pv || null;
  e.hasInvoice=checked("ex-inv"); e.invoiceLink=val("ex-link");
  if(document.getElementById("ex-inrep")) e.noReport=!checked("ex-inrep");
  if(document.getElementById("ex-frl")) e.noFreilich=checked("ex-frl");
  if(CU&&CU.role==="admin"&&document.getElementById("ex-hidden")) e.hidden=checked("ex-hidden");
  else if(e.hidden==null) e.hidden=false;
  /* דמי ניהול — נוגעים בהם אך ורק כשהמקטע באמת הוצג על המסך.
     קודם: כל שמירה מחקה את דמי הניהול ובנתה מחדש רק אם התיבה סומנה,
     כך ששמירה ממצב שבו המקטע לא הוצג מחקה את הנתונים בשקט. */
  var mgmtShown = !!document.getElementById("ex-mgmt");
  if(mgmtShown){
    if(e.mgmtEnabled && val("ex-mgmt")!=="on"){
      /* מבטלים דמי ניהול על הוצאה שכבר שולם עליה למנהלים? צד העלות היה
         מתאפס בעוד התשלומים ממשיכים להיספר — והמאזן נשבר. חוסמים. */
      /* תשלומים אוטומטיים ("שווה ערך") לא חוסמים — הם יוסרו בסנכרון */
      var mPaid=round2(expPayments(eId).filter(function(p){return p.recipientType==="manager"&&!p.auto;})
        .reduce(function(s,p){return s+(Number(p.amount)||0);},0));
      if(mPaid>0.01){
        toast("אי אפשר לבטל דמי ניהול — כבר שולמו "+money(mPaid)+" למנהלים על שלב זה. מחק קודם את התשלומים אליהם","err");
        return false;
      }
    }
    e.mgmtEnabled = (val("ex-mgmt")==="on");
    e.mgmtSet = true;                 // נבחר במפורש "עם / בלי"
    e.mgmtBaseType = val("ex-base") || e.mgmtBaseType || "full";
    var vatRaw = val("ex-vat");
    if(vatRaw!==""){ var vn=Number(vatRaw); e.mgmtVatRate = isNaN(vn)?18:vn; }
    else if(e.mgmtVatRate==null){ e.mgmtVatRate = 18; }
  } else {
    if(e.mgmtEnabled==null) e.mgmtEnabled=false;
    if(e.mgmtBaseType==null) e.mgmtBaseType="full";
    if(e.mgmtVatRate==null) e.mgmtVatRate=18;
  }
  // rebuild splits — למכל אין חלוקה משלו, לא נוגעים בה
  if(!isCont){
    setExpenseSplits(eId,rows);
  }
  // rebuild manager fees
  /* בונים מחדש רק כשיש ערכים חדשים על המסך. אם המקטע לא הוצג, או שדמי
     הניהול כבויים — משאירים את הרשומות הקיימות במקום למחוק אותן.
     הן ממילא אינן נספרות כל עוד mgmtEnabled כבוי, ואם יידלק שוב — הנתונים חוזרים. */
  if(mgmtShown && e.mgmtEnabled){
    setExpenseMgrFees(eId, apManagers(aptId).map(function(m){
      return {managerId:m.id,
        pctCurrent:Number(val("mf-cur-"+m.id))||0,pctDeferred:Number(val("mf-def-"+m.id))||0,
        deferredLabel:val("mf-lbl-"+m.id)||"",deferredReleased:checked("mf-rel-"+m.id)};
    }));
  }
  syncAutoMgmtPayments(eId);   // תשלום "שווה ערך" אוטומטי לפי הגדרת הפרויקט
  /* סכום המכל נגזר מתתי-השלבים — מסנכרנים את האב הישן ואת החדש */
  if(oldParent && oldParent!==e.parentId) syncParentAmount(oldParent);
  if(e.parentId) syncParentAmount(e.parentId);
  save(); toast("ההוצאה נשמרה","ok"); rerender();
}

  return active(DB.payments).filter(function(p){ return expIds[p.expenseId]; });

        return '<option value="'+o[0]+'"'+(Q.payInv===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+

    '<select style="max-width:150px" onchange="Q.payCpa=this.value;renderPayTable()">'+
      [["","רו\"ח — הכל"],["sent","✔ נשלח לרו\"ח"],["not","טרם נשלח לרו\"ח"]].map(function(o){
        return '<option value="'+o[0]+'"'+(Q.payCpa===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+
    '</select>'+
    '<select style="max-width:160px" onchange="Q.payCat=this.value;renderPayTable()">'+
      '<option value="">כל הקטגוריות</option>'+
      '<option value="__none"'+(Q.payCat==="__none"?" selected":"")+'>ללא קטגוריה</option>'+
      catsSorted().map(function(c){
        return '<option value="'+c.id+'"'+(Q.payCat===c.id?" selected":"")+'>'+esc(c.name)+'</option>'; }).join("")+

    (can("edit")?'<button class="btn btn-sm" onclick="openNoteImport(\''+aptId+'\')">📝 ייבוא הערות מאקסל</button>':'')+

/* ---------- ייבוא הערות לתשלומים מאקסל ----------
   מעלים קובץ שבו כל שורה מזוהה לפי פרוייקט + תיאור השלב + סכום +
   תאריך, ומעדכנים ממנו את שדה ההערה. לא נוצר ולא נמחק שום תשלום —
   רק ההערה מתעדכנת, ורק בשורות שהותאמו בוודאות (התאמה יחידה). */
var NIMP={grid:null,hasHeader:true,aptId:null,map:{apt:-1,desc:-1,amount:-1,date:-1,note:-1},mode:"replace"};
function openNoteImport(aptId){
  if(!can("edit")){ toast("אין הרשאה","err"); return; }
  NIMP={grid:null,hasHeader:true,aptId:aptId,map:{apt:-1,desc:-1,amount:-1,date:-1,note:-1},mode:"replace"};
  openModal({title:"📝 ייבוא הערות לתשלומים",wide:true,bodyHtml:
    '<div class="hint">כל שורה בקובץ מותאמת לתשלום קיים לפי <b>פרוייקט + תיאור השלב + סכום + תאריך</b>, '+

function onNoteGrid(grid){
  grid=(grid||[]).filter(function(r){ return r.some(function(c){ return String(c).trim()!==""; }); });
  if(!grid.length){ toast("לא נמצאו שורות","err"); return; }
  NIMP.grid=grid;
  var head=grid[0].map(function(c){ return String(c||"").trim(); });
  function guess(hints){
    for(var i=0;i<head.length;i++){
      var hh=normKey(head[i]);
      for(var k=0;k<hints.length;k++) if(hh.indexOf(normKey(hints[k]))>=0) return i;
    }
    return -1;
  }
  NIMP.map={apt:guess(["פרוייקט","פרויקט","דירה","project"]),
            desc:guess(["תיאור","שלב","עבור","פירוט","description"]),
            amount:guess(["סכום","סך","amount","תשלום"]),
            date:guess(["תאריך","date"]),
            note:guess(["הער","note","remark"])};
  NIMP.hasHeader = (NIMP.map.amount>=0||NIMP.map.date>=0||NIMP.map.note>=0);
  renderNoteMap();
}

      '<div class="field"><label>הערה <span class="hint">(מה שיוכנס)</span></label>'+sel("note",NIMP.map.note)+'</div>'+

/* מתאים כל שורה בקובץ לתשלומים במערכת. מחזיר לכל שורה את רשימת
   ההתאמות — כדי שנוכל להבחין בין "לא נמצא" ל"נמצא יותר מאחד". */
function noteImportMatches(){
  if(!NIMP.grid) return [];
  var m=NIMP.map;
  var rows=NIMP.hasHeader?NIMP.grid.slice(1):NIMP.grid;
  /* מאגר התשלומים לחיפוש: כל הפרוייקטים אם יש עמודת פרוייקט, אחרת הנוכחי */
  var pool=[];
  var apts = m.apt>=0 ? active(DB.apartments).filter(function(a){ return canSeeApartment(a.id); })
                      : [byId(DB.apartments,NIMP.aptId)].filter(Boolean);
  apts.forEach(function(a){
    apAllPayments(a.id).forEach(function(p){
      var e=byId(DB.expenses,p.expenseId);
      pool.push({p:p,aptKey:normKey(a.name),descKey:normKey(e?e.description:""),
                 amount:round2(Number(p.amount)||0),date:p.date});
    });
  });
  return rows.map(function(r,ix){
    var note=m.note>=0?String(r[m.note]==null?"":r[m.note]).trim():"";
    var aptKey=m.apt>=0?normKey(r[m.apt]):null;
    var descKey=m.desc>=0?normKey(r[m.desc]):null;
    var amount=m.amount>=0?round2(impNum(r[m.amount])):null;
    var date=m.date>=0?impDate(r[m.date]):null;
    var hits=pool.filter(function(x){
      if(aptKey!=null && aptKey!=="" && x.aptKey!==aptKey) return false;
      if(descKey!=null && descKey!=="" && x.descKey!==descKey) return false;
      if(amount!=null && Math.abs(x.amount-amount)>0.01) return false;
      if(date && x.date!==date) return false;
      return true;
    });
    return {idx:ix+1,note:note,hits:hits,
            label:[m.desc>=0?String(r[m.desc]||""):"",amount!=null?money(amount):"",date?dateHe(date):""].filter(Boolean).join(" · ")};
  }).filter(function(x){ return x.note!==""; });   // שורה בלי הערה — אין מה לייבא
}
function renderNotePreview(){
  var box=document.getElementById("ni-preview"); if(!box) return;
  var m=NIMP.map;
  if(m.note<0){ box.innerHTML='<div class="empty">בחר את עמודת ההערה</div>'; return; }
  var keys=[m.desc>=0,m.amount>=0,m.date>=0].filter(Boolean).length;
  if(keys<2){ box.innerHTML='<div class="hint neg">בחר לפחות שניים מבין: תיאור השלב, סכום, תאריך — אחרת ההתאמה לא בטוחה.</div>'; return; }
  var res=noteImportMatches();
  if(!res.length){ box.innerHTML='<div class="empty">לא נמצאו שורות עם הערה</div>'; return; }
  var one=res.filter(function(x){ return x.hits.length===1; });
  var none=res.filter(function(x){ return x.hits.length===0; });
  var many=res.filter(function(x){ return x.hits.length>1; });
  var h='<div class="section-title">תצוגה מקדימה</div>'+
    '<div class="stat-grid">'+
      stat("יעודכנו",String(one.length),"pos")+
      stat("לא נמצאה התאמה",String(none.length),none.length?"neg":"")+
      stat("יותר מהתאמה אחת",String(many.length),many.length?"neg":"")+
    '</div>';
  if(one.length){
    h+='<div class="table-wrap" style="max-height:200px"><table class="tbl"><thead><tr>'+
      '<th>שורה בקובץ</th><th>התשלום שזוהה</th><th>הערה שתיכנס</th></tr></thead><tbody>'+
      one.slice(0,12).map(function(x){
        var e=byId(DB.expenses,x.hits[0].p.expenseId);
        return '<tr><td class="muted">'+x.idx+'</td><td>'+esc(e?e.description:"—")+' · '+money(x.hits[0].amount)+' · '+dateHe(x.hits[0].date)+'</td><td>'+esc(x.note)+'</td></tr>';
      }).join("")+'</tbody></table></div>'+
      (one.length>12?'<div class="hint">מוצגות 12 מתוך '+one.length+'</div>':'');
  }
  if(none.length){
    h+='<div class="section-title">לא נמצאה התאמה ('+none.length+') — לא יעודכנו</div>'+
      '<div class="table-wrap" style="max-height:150px"><table class="tbl"><thead><tr><th>שורה</th><th>מה חיפשנו</th><th>הערה</th></tr></thead><tbody>'+
      none.slice(0,10).map(function(x){ return '<tr><td class="muted">'+x.idx+'</td><td>'+esc(x.label)+'</td><td>'+esc(x.note)+'</td></tr>'; }).join("")+
      '</tbody></table></div>'+(none.length>10?'<div class="hint">מוצגות 10 מתוך '+none.length+'</div>':'');
  }
  if(many.length){
    h+='<div class="section-title neg">יותר מהתאמה אחת ('+many.length+') — לא יעודכנו</div>'+
      '<div class="hint">כמה תשלומים תואמים לאותה שורה. הוסף עמודת תאריך/סכום/פרוייקט כדי לדייק.</div>'+
      '<div class="table-wrap" style="max-height:150px"><table class="tbl"><thead><tr><th>שורה</th><th>מה חיפשנו</th><th>כמה נמצאו</th></tr></thead><tbody>'+
      many.slice(0,10).map(function(x){ return '<tr><td class="muted">'+x.idx+'</td><td>'+esc(x.label)+'</td><td>'+x.hits.length+'</td></tr>'; }).join("")+
      '</tbody></table></div>';
  }
  box.innerHTML=h;
}
function applyNoteImport(){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  if(NIMP.map.note<0){ toast("בחר את עמודת ההערה","err"); return false; }
  var keys=[NIMP.map.desc>=0,NIMP.map.amount>=0,NIMP.map.date>=0].filter(Boolean).length;
  if(keys<2){ toast("בחר לפחות שני שדות זיהוי (תיאור / סכום / תאריך)","err"); return false; }
  var res=noteImportMatches();
  var one=res.filter(function(x){ return x.hits.length===1; });
  if(!one.length){ toast("אף שורה לא הותאמה לתשלום קיים","err"); return false; }
  var skipped=res.length-one.length;
  if(skipped && !confirm(one.length+" הערות יעודכנו.\n"+skipped+" שורות לא הותאמו ויידלגו.\n\nלהמשיך?")) return false;
  var n=0;
  one.forEach(function(x){
    var p=x.hits[0].p, old=String(p.note||"").trim();
    if(NIMP.mode==="keep" && old) return;
    p.note = NIMP.mode==="append" && old ? (old+" | "+x.note) : x.note;
    n++;
  });
  save(); toast("עודכנו "+n+" הערות"+(skipped?" ("+skipped+" דולגו)":""),"ok"); rerender();
  return true;
}

function applyBulkPayEdit(aptId,ids){
  if(!can("edit")){ toast("אין הרשאה","err"); return false; }
  var acc=val("pb-account"), payer=document.getElementById("pb-payer")?val("pb-payer"):"";
  var method=val("pb-method"), date=val("pb-date");
  var invSt=val("pb-inv")||"__keep";
  var noteMode=val("pb-note-mode")||"keep", noteTxt=val("pb-note").trim();
  var cpaSel=val("pb-cpa")||"__keep";
  /* העברה לשלב אחר — שם שהוקלד חייב להתפענח לשלב אמיתי */
  var moveTo="";
  if(document.getElementById("pb-moveto") && String(val("pb-moveto")||"").trim()){
    var mvId=pickId("pb-moveto");
    if(!mvId){ toast("שלב היעד לא זוהה — בחר מהרשימה","err"); return false; }
    var mvE=byId(DB.expenses,mvId);
    if(!mvE||mvE.deleted||isContainer(mvId)){ toast("שלב היעד אינו תקין","err"); return false; }
    moveTo=mvId;
  }
  if(!acc && !payer && !method && !date && invSt==="__keep" && noteMode==="keep" && cpaSel==="__keep" && !moveTo){ toast("לא נבחר מה לעדכן","warn"); return false; }
  if((noteMode==="set"||noteMode==="append") && !noteTxt){
    toast("כתוב את ההערה שתיכנס, או בחר \"ללא שינוי\" בשדה ההערה","err"); return false; }

  var accId = acc==="__none" ? null : (acc||undefined);
  var isBankTarget = accId ? accountIsBank(accId) : false;

  var n=0, skippedAuto=0, overpaid=[], movedN=0, skippedMgr=0, touched={};
  ids.forEach(function(id){
    var p=byId(DB.payments,id); if(!p||p.deleted) return;
    /* תשלום "שווה ערך" אוטומטי נגזר מהגדרת הפרויקט — שינוי ידני שלו
       היה נמחק בסנכרון הבא ומבלבל יותר משעוזר. */
    if(p.auto){ skippedAuto++; return; }
    if(moveTo && p.expenseId!==moveTo){
      /* תשלום למנהל תלוי בהגדרת דמי ניהול על השלב — לא עובר לשלב בלעדיה */
      if(p.recipientType==="manager" && !(byId(DB.expenses,moveTo)||{}).mgmtEnabled){ skippedMgr++; }
      else { touched[p.expenseId]=1; touched[moveTo]=1; p.expenseId=moveTo; movedN++; }
    }
    if(accId!==undefined){ p.accountId=accId; }
    if(payer){ p.payerPartnerId = (payer==="__none")?null:payer; }
    if(accId!==undefined && isBankTarget) p.payerPartnerId=null;   // מהבנק — לא משויך לשותף
    if(method) p.method=method;
    if(date) p.date=date;
    if(invSt!=="__keep"){ p.invoiceStatus=invSt; p.hasInvoice=(invSt==="has"); }
    if(cpaSel!=="__keep") p.sentToCpa=(cpaSel==="1");
    if(noteMode==="set") p.note=noteTxt;
    else if(noteMode==="append"){ var old=String(p.note||"").trim(); p.note = old ? (old+" | "+noteTxt) : noteTxt; }
    else if(noteMode==="clear") p.note="";
    n++;
  });
  if(!n){ toast(skippedAuto?"כל התשלומים שנבחרו הם אוטומטיים — לא שונה דבר":"לא עודכן דבר","warn"); return false; }
  Object.keys(touched).forEach(function(k){ syncAutoMgmtPayments(k); });
  save();
  toast("עודכנו "+n+" תשלומים"+
    (movedN?" · "+movedN+" הועברו לשלב אחר":"")+
    (skippedMgr?" · "+skippedMgr+" תשלומי מנהל לא הועברו (אין דמי ניהול בשלב היעד)":"")+
    (skippedAuto?" ("+skippedAuto+" אוטומטיים דולגו)":""),"ok");
  rerender();
  return true;
}

function renderPayTableInner(aptId){

function payTableHtml(aptId){
  var all=apAllPayments(aptId);
  var list=all.filter(function(p){
    var e=byId(DB.expenses,p.expenseId), acc=byId(DB.accounts,p.accountId);
    var txt=(e?e.description:"")+" "+(p.note||"")+" "+(acc?acc.name:"")+" "+
            (p.payerPartnerId?partnerName(p.payerPartnerId):"")+" "+
            (p.recipientType==="manager"?managerName(p.recipientManagerId):"");
    if(!matches(Q.pay,txt)) return false;
    if(Q.payWho && p.payerPartnerId!==Q.payWho) return false;
    if(Q.paySrc==="bank" && !accountIsBank(p.accountId)) return false;
    if(Q.paySrc==="direct" && (accountIsBank(p.accountId)||p.recipientType==="manager")) return false;
    if(Q.paySrc==="manager" && p.recipientType!=="manager") return false;
    if(Q.payInv){
      var ist=payInvoiceStatus(p);
      if(Q.payInv==="unset" ? !!ist : ist!==Q.payInv) return false;
    }
    if(Q.payCpa==="sent" && !paySentCpa(p)) return false;
    if(Q.payCpa==="not" && paySentCpa(p)) return false;
    if(Q.payCat){
      var pe=byId(DB.expenses,p.expenseId);
      var cid=pe?pe.categoryId:"";
      if(Q.payCat==="__none"){ if(cid&&categoryName(cid)) return false; }
      else if(cid!==Q.payCat) return false;
    }
    return true;
  });
  var cnt=document.getElementById("pay-count");
  if(cnt) cnt.innerHTML=countLine(list.length,all.length,"תשלומים");
  if(!list.length) return '<div class="empty">לא נמצא תשלום שמתאים לסינון</div>';
  var tot=0;
  var sel=can("edit");
  var h='<div class="table-wrap"><table class="tbl"><thead><tr>'+
    (sel?'<th class="chk" data-xl-skip="1" style="width:30px"><input type="checkbox" title="סמן הכל" style="width:auto" onclick="pbAll(this.checked)"></th>':'')+
    '<th>תאריך</th><th>עבור (שלב)</th><th>קטגוריה</th><th>סכום</th><th>חשבון</th><th>מי שילם</th>'+
    '<th>מוטב</th><th>אמצעי</th><th>חשבונית</th><th>נשלח לרו"ח</th><th>הערה</th><th></th></tr></thead><tbody>';
  /* תשלומי דמי ניהול בסוף הרשימה — הם נגזרת של השלבים ולא תשלום
     לספק, ועירוב שלהם בין השורות הקשה על קריאת התשלומים עצמם.
     בתוך כל קבוצה: החדש למעלה. מיון בלחיצה על כותרת עדיין גובר. */
  list.sort(function(x,y){
    var mx=x.recipientType==="manager"?1:0, my=y.recipientType==="manager"?1:0;
    if(mx!==my) return mx-my;
    return x.date<y.date?1:-1;
  }).forEach(function(p){
    var e=byId(DB.expenses,p.expenseId), acc=byId(DB.accounts,p.accountId);
    tot+=Number(p.amount)||0;
    var isMgr=p.recipientType==="manager";
    var recip=isMgr
      ? '<span class="badge badge-mgmt">🧾 דמי ניהול</span> '+esc(managerName(p.recipientManagerId)) : 'ספק';
    h+='<tr'+(isMgr?' class="mgmt-row"':'')+'>'+
      (sel?'<td class="chk"><input type="checkbox" class="pb-x" value="'+p.id+'" style="width:auto" onchange="pbCount()"></td>':'')+
      '<td>'+dateHe(p.date)+'</td>'+
      '<td><b>'+esc(e?e.description:"—")+'</b>'+(p.hidden?' <span class="badge badge-danger" title="תשלום מוסתר">🔒</span>':'')+'</td>'+
      '<td>'+esc((e&&categoryName(e.categoryId))||"—")+'</td>'+
      '<td>'+money(p.amount)+'</td>'+
      '<td>'+payAccountCell(p)+'</td>'+
      '<td>'+(p.payerPartnerId?esc(partnerName(p.payerPartnerId)):(accountIsBank(p.accountId)?'<span class="muted">מהבנק</span>':"—"))+'</td>'+
      '<td>'+recip+'</td><td>'+payMethodCell(p)+'</td>'+
      '<td>'+invoiceCellHtml(p)+'</td><td>'+cpaCellHtml(p,true)+'</td>'+
      noteCell(p.note)+
      '<td class="right" style="white-space:nowrap">'+
        '<button class="btn btn-ghost btn-sm" onclick="openPayments(\''+p.expenseId+'\')" title="כל תשלומי השלב">💳</button>'+
        (can("edit")?'<button class="btn btn-ghost btn-sm" onclick="openPaymentEditor(\''+p.expenseId+'\',\''+p.id+'\')">✏️</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="delPayment(\''+p.id+'\',\''+p.expenseId+'\')">🗑️</button>':'')+'</td></tr>';
  });
  var lbl=(list.length===all.length)?'סה"כ':'סה"כ המסונן';
  h+='</tbody><tfoot><tr><td colspan="'+(sel?4:3)+'">'+lbl+' ('+list.length+' תשלומים)</td><td>'+money(tot)+'</td>'+
    '<td colspan="8"></td></tr></tfoot></table></div>';
  return h;
}

function updateQuickMgmtPreview(){
  var el=document.getElementById("qe-mgmt-prev"); if(!el) return;
  if(val("qe-mgmt")!=="on"){ el.innerHTML=""; return; }
  var amt=Number(val("qe-amount"))||0;
  var bt=val("qe-base")||"full";
  var base = bt==="net17" ? amt/1.17 : bt==="net18" ? amt/1.18 : amt;
  var vat=1+(Number(val("qe-vat"))||0)/100;
  var cur=0, def=0;
  apManagers(pickId("qe-apt")).forEach(function(m){
    cur+=base*(Number(val("qe-mf-cur-"+m.id))||0)/100*vat;
    def+=base*(Number(val("qe-mf-def-"+m.id))||0)/100*vat;
  });
  el.innerHTML=amt?('דמי ניהול פעילים: <b>'+money(round2(cur))+'</b>'+
    (def>0.005?' · דחוי (עד השחרור): <b>'+money(round2(def))+'</b>':'')):
    'הזן סכום להוצאה כדי לראות את דמי הניהול המחושבים';
}

function saveQuickExpense(){

  if(!aptId){ toast(aptId===null?"שם הפרוייקט לא זוהה — בחר מהרשימה":"בחר פרוייקט","err"); return false; }
  var desc=val("qe-desc").trim();
  var amount=Number(val("qe-amount"))||0;
  if(!desc){ toast("יש להזין תיאור","err"); return false; }
  if(amount<=0){ toast("יש להזין סכום","err"); return false; }

  var qMgmtSel=document.getElementById("qe-mgmt");
  if(qMgmtSel && qMgmtSel.value===""){ toast("יש לבחור: עם דמי ניהול או בלי דמי ניהול","err"); return false; }
  var date=val("qe-date")||todayISO();
  /* הגנה מכפילות — כמו בייבוא: אותו פרוייקט + תיאור + סכום + תאריך */
  var dup=apExpenses(aptId).find(function(x){
    return normKey(x.description)===normKey(desc) && Math.abs((Number(x.amount)||0)-amount)<0.01 && x.date===date; });
  if(dup && !confirm('כבר קיים שלב "'+dup.description+'" באותו סכום ותאריך.\n\nלהוסיף בכל זאת?')) return false;

  /* ---- כל הוולידציות והאישורים לפני שנוגעים ב-DB ----
     convertToContainer מפצל שלב קיים לאב+תת-שלב ומעביר אליו חלוקה,
     דמי ניהול ותשלומים. אם ולידציה מאוחרת הייתה נכשלת, הגלגול-אחור
     היה מסיר רק את ההוצאה החדשה והפיצול היה נשאר. */
  var qParent=val("qe-parent")||"";
  if(qParent==="__new") qParent="";
  if(qParent){
    var pe=byId(DB.expenses,qParent);
    if(!pe || pe.apartmentId!==aptId || pe.parentId){ toast("שלב-האב שנבחר אינו תקין","err"); return false; }
  }
  var payNow=checked("qe-paynow"), pAmt=0, accId=null, isBank=false, payer=null;
  if(payNow){
    pAmt=Number(val("qe-pay-amount"))||0;
    if(pAmt>0){
      accId=val("qe-pay-account")||null;
      isBank=accountIsBank(accId);
      payer=isBank?null:(val("qe-pay-payer")||null);
      if(!isBank && !payer && apPartners(aptId).length){
        toast("בחר מי שילם, או חשבון בנק — ההוצאה לא נשמרה","err"); return false;
      }
      if(pAmt>amount+0.01 && !confirm("התשלום ("+money(pAmt)+") גדול מסכום השלב ("+money(amount)+").\n\nהשלב יסומן \"שולם ביתר\". להמשיך?")) return false;
    }
  }
  /* מכאן והלאה משנים נתונים — אין עוד ביטולים */
  if(qParent && !convertToContainer(qParent)) return false;

  var mgmtOn = !!document.getElementById("qe-mgmt") && val("qe-mgmt")==="on";
  var mgmtVatRaw = Number(val("qe-vat"));
  var eid=uid();
  DB.expenses.push({id:eid,apartmentId:aptId,categoryId:pickCategoryId("qe-cat"),
    classification:val("qe-class")||"investment",
    description:desc,amount:amount,date:date,note:val("qe-note")||"",
    hasInvoice:false,invoiceLink:"",
    mgmtEnabled:mgmtOn, mgmtSet:!!document.getElementById("qe-mgmt"),
    mgmtBaseType:mgmtOn?(val("qe-base")||"full"):"full",
    mgmtVatRate:mgmtOn?(isNaN(mgmtVatRaw)?18:mgmtVatRaw):18,
    parentId:qParent||null,deleted:false});
  apPartners(aptId).forEach(function(p){
    DB.expenseSplits.push({id:splitId(eid,p.partnerId),expenseId:eid,partnerId:p.partnerId,percent:p.defaultPercent,deleted:false});
  });
  if(mgmtOn){
    apManagers(aptId).forEach(function(m){
      DB.expenseManagerFees.push({id:uid(),expenseId:eid,managerId:m.id,
        pctCurrent:Number(val("qe-mf-cur-"+m.id))||0,
        pctDeferred:Number(val("qe-mf-def-"+m.id))||0,
        deferredLabel:val("qe-mf-lbl-"+m.id)||"",deferredReleased:false,deleted:false});
    });
    syncAutoMgmtPayments(eid);   // תשלום "שווה ערך" אוטומטי, אם מוגדר בפרויקט
  }

  var payMsg="";
  if(payNow){
    if(pAmt>0){
      DB.payments.push({id:uid(),expenseId:eid,date:date,amount:pAmt,accountId:accId,
        payerPartnerId:payer,method:val("qe-pay-method")||"transfer",
        recipientType:"supplier",recipientManagerId:null,
        hasInvoice:false,invoiceLink:"",note:"",deleted:false});
      payMsg=" · נרשם תשלום "+money(pAmt);
    }
  }
  if(qParent) syncParentAmount(qParent);   // סכום שלב-האב = סך תתי-השלבים
  save();
  toast('נוסף '+(qParent?'תת-השלב "'+desc+'" תחת "'+expDesc(qParent)+'"':'השלב "'+desc+'"')+payMsg,"ok");
  go("apartment",{apartmentId:aptId,tab:"expenses"});
}

  });
