<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>נוכחות ויזניץ — דיווח שעות ל-3 עמותות</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕐</text></svg>">
<script src="xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#1e3a8a; --brand2:#3b82f6; --ok:#059669; --warn:#d97706; --bad:#dc2626;
  --kupat:#1d4ed8; --apiryon:#059669; --ezrat:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,'Noto Sans Hebrew',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);border-color:transparent}
label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn-primary{background:var(--brand);color:#fff}
.btn-blue{background:var(--brand2);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-warn{background:var(--warn);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.btn-ghost{background:#eef2f7;color:var(--ink)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn-big{font-size:19px;padding:16px 20px;border-radius:14px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.grid{display:grid;gap:14px}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
h2{font-size:19px;margin-bottom:4px}
h3{font-size:16px}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

/* ---------- header ---------- */
header{background:linear-gradient(120deg,#1e3a8a,#312e81 60%,#4c1d95);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .logo{font-size:26px}
header h1{font-size:19px;font-weight:800}
header .sub{font-size:12px;opacity:.75}
header .grow{flex:1}
#syncDot{width:10px;height:10px;border-radius:50%;background:#94a3b8;display:inline-block}
#syncDot.on{background:#34d399}#syncDot.err{background:#f87171}
#syncTxt{font-size:12px;opacity:.85}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:13px}
.hbtn:hover{background:rgba(255,255,255,.25)}

/* ---------- nav ---------- */
nav{background:#fff;border-bottom:1px solid var(--line);padding:0 14px;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:none;padding:12px 15px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
main{max-width:1250px;margin:0 auto;padding:18px 14px 60px}

/* ---------- login ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#4c1d95);padding:16px}
.login-card{background:#fff;border-radius:20px;padding:34px 30px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card .big{font-size:44px;text-align:center}
.login-card h1{text-align:center;font-size:21px;margin:6px 0 2px}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.fld{margin-bottom:12px}

/* ---------- amuta cards / clock ---------- */
.amuta-card{border-radius:16px;border:1px solid var(--line);background:#fff;overflow:hidden}
.amuta-card .top{padding:12px 16px;color:#fff;font-weight:800;font-size:15.5px;display:flex;justify-content:space-between;align-items:center}
.amuta-card .body{padding:16px}
.clock-status{font-size:14px;margin-bottom:12px}
.clock-timer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.banner{border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;margin-bottom:14px}
.banner.warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.banner.info{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
th{background:#f8fafc;font-weight:700;color:#334155;padding:8px 9px;border-bottom:2px solid var(--line);white-space:nowrap;text-align:right}
td{padding:7px 9px;border-bottom:1px solid #f1f5f9;white-space:nowrap;text-align:right}
tr:hover td{background:#f8fafc}
tr.shabbat td{background:#eef2ff}
tr.holiday td{background:#fef9c3}
tr.total td{background:#f1f5f9;font-weight:800;border-top:2px solid var(--line)}
td.num,th.num{font-variant-numeric:tabular-nums}
.open-punch{color:var(--ok);font-weight:700}

/* ---------- report table (accountant) ---------- */
.rep table{font-size:12px}
.rep th{font-size:11.5px}
.rep .grp{background:#e0e7ff;color:#312e81;text-align:center;font-size:12.5px}

/* ---------- stats / dashboard ---------- */
.stat{border-radius:14px;padding:14px 16px;color:#fff}
.stat .n{font-size:26px;font-weight:800}
.stat .l{font-size:12.5px;opacity:.85}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar-row .nm{width:130px;font-size:13px;font-weight:600}
.bar-row .bar{flex:1;background:#eef2f7;height:22px;border-radius:99px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:99px;display:flex;align-items:center;justify-content:flex-end;color:#fff;font-size:11px;font-weight:700;padding-left:8px;min-width:fit-content}
.bar-row .val{width:90px;font-size:12.5px;font-weight:700;text-align:left}
.prog{background:#eef2f7;border-radius:99px;height:8px;overflow:hidden;margin-top:5px}
.prog>div{height:100%;border-radius:99px}

/* ---------- modal ---------- */
#modalBack{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
#modalBack.show{display:flex}
#modalBox{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:640px;box-shadow:0 25px 70px rgba(0,0,0,.35)}
#modalBox h2{margin-bottom:14px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frm .full{grid-column:1/-1}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.term-box{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.term-box.off .term-fields{display:none}
.term-box .th{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.term-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}

@media(max-width:760px){
  .frm{grid-template-columns:1fr}
  .term-fields{grid-template-columns:1fr 1fr}
  main{padding:12px 8px 60px}
}
@media print{ body{background:#fff} header,nav,.no-print{display:none!important} main{max-width:none;padding:0} .card{border:none;box-shadow:none;padding:0} }
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="big">🕐</div>
    <h1>נוכחות ויזניץ</h1>
    <div class="sub">דיווח שעות נוכחות — קופת גמ"ח · אפריון · עזרת נישואין</div>
    <div id="loginBody"></div>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="appScreen" hidden>
  <header>
    <span class="logo">🕐</span>
    <div>
      <h1 id="hdrTitle">נוכחות ויזניץ</h1>
      <div class="sub" id="hdrDate"></div>
    </div>
    <div class="grow"></div>
    <span id="syncDot"></span><span id="syncTxt"></span>
    <span style="font-size:14px;font-weight:700" id="hdrUser"></span>
    <button class="hbtn" onclick="openPassModal()" title="שינוי סיסמה">🔑</button>
    <button class="hbtn" onclick="logout()">יציאה</button>
  </header>
  <nav id="navBar"></nav>
  <main id="mainArea"></main>
</div>

<!-- ==================== MODAL ==================== -->
<div id="modalBack" onclick="if(event.target===this)closeModal()">
  <div id="modalBox"></div>
</div>

<script>
/* ============================================================
   נוכחות ויזניץ — מערכת דיווח שעות ל-3 עמותות
   Backend: Google Sheets דרך Apps Script (attendance_sheets.gs)
   ============================================================ */

/* ==================== עמותות ==================== */
const AMUTOT = [
  {id:'kupat',   short:'קופת גמ"ח',    full:'קופת גמ"ח הכללית נוע"מ (ע"ר)',                        color:'var(--kupat)',   hex:'#1d4ed8', icon:'🏦'},
  {id:'apiryon', short:'אפריון',        full:'אפריון מרכז החסד והעזרה (ע"ר)',                        color:'var(--apiryon)', hex:'#059669', icon:'🤝'},
  {id:'ezrat',   short:'עזרת נישואין',  full:'מפעל עזרת נישואין לתלמידי ישיבת ויזניץ ב"ב (ע"ר)',   color:'var(--ezrat)',   hex:'#7c3aed', icon:'💍'},
];
const amuta = id => AMUTOT.find(a=>a.id===id) || {short:id,full:id,color:'#64748b',hex:'#64748b',icon:'🏢'};
const REC_TYPES = {work:'עבודה', sick:'מחלה', vacation:'חופשה', holiday:'חג', absence:'העדרות'};

/* ==================== לוח עברי (מנוע מאומת) ==================== */
const HEBREW_EPOCH=-1373427;
function gregorianLeap(y){return (y%4===0&&y%100!==0)||y%400===0}
function rdFromGregorian(y,m,d){let rd=365*(y-1)+Math.floor((y-1)/4)-Math.floor((y-1)/100)+Math.floor((y-1)/400)+Math.floor((367*m-362)/12);if(m>2)rd+=gregorianLeap(y)?-1:-2;return rd+d}
function gregorianFromRd(rd){let d0=rd-1;const n400=Math.floor(d0/146097);d0%=146097;const n100=Math.floor(d0/36524);d0%=36524;const n4=Math.floor(d0/1461);d0%=1461;const n1=Math.floor(d0/365);let year=400*n400+100*n100+4*n4+n1;if(n100!==4&&n1!==4)year+=1;const priorDays=rd-rdFromGregorian(year,1,1);const correction=rd<rdFromGregorian(year,3,1)?0:(gregorianLeap(year)?1:2);const month=Math.floor((12*(priorDays+correction)+373)/367);const day=rd-rdFromGregorian(year,month,1)+1;return{y:year,m:month,d:day}}
function hebrewLeap(y){return((7*y+1)%19)<7}
function hebrewElapsedDays(y){const me=Math.floor((235*y-234)/19);const pe=12084+13753*me;let days=me*29+Math.floor(pe/25920);if(((3*(days+1))%7)<3)days+=1;return days}
function hebrewYearDelay(y){const c0=hebrewElapsedDays(y-1),c1=hebrewElapsedDays(y),c2=hebrewElapsedDays(y+1);if(c2-c1===356)return 2;if(c1-c0===382)return 1;return 0}
function hebrewNewYearRd(y){return HEBREW_EPOCH+hebrewElapsedDays(y)+hebrewYearDelay(y)}
function hebrewYearDays(y){return hebrewNewYearRd(y+1)-hebrewNewYearRd(y)}
function longCheshvan(y){return hebrewYearDays(y)%10===5}
function shortKislev(y){return hebrewYearDays(y)%10===3}
function hebrewMonthsInYear(y){return hebrewLeap(y)?13:12}
function hebrewMonthDays(y,m){if(m===2||m===4||m===6||m===10||m===13)return 29;if(m===12&&!hebrewLeap(y))return 29;if(m===8&&!longCheshvan(y))return 29;if(m===9&&shortKislev(y))return 29;return 30}
function rdFromHebrew(y,m,d){let rd=hebrewNewYearRd(y)+d-1;if(m<7){for(let mm=7;mm<=hebrewMonthsInYear(y);mm++)rd+=hebrewMonthDays(y,mm);for(let mm=1;mm<m;mm++)rd+=hebrewMonthDays(y,mm)}else{for(let mm=7;mm<m;mm++)rd+=hebrewMonthDays(y,mm)}return rd}
function hebrewFromRd(rd){const approx=Math.floor((rd-HEBREW_EPOCH)*98496/35975351)+1;let y=approx-1;while(hebrewNewYearRd(y+1)<=rd)y++;const start=(rd<rdFromHebrew(y,1,1))?7:1;let m=start;while(rd>rdFromHebrew(y,m,hebrewMonthDays(y,m)))m++;const d=rd-rdFromHebrew(y,m,1)+1;return{y,m,d}}
const MONTH_NAMES={1:'ניסן',2:'אייר',3:'סיוון',4:'תמוז',5:'אב',6:'אלול',7:'תשרי',8:'חשוון',9:'כסלו',10:'טבת',11:'שבט'};
function hebMonthName(m,leap){if(m===12)return leap?'אדר א׳':'אדר';if(m===13)return'אדר ב׳';return MONTH_NAMES[m]}
function gematriya(n){const vals=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];let s='',x=n;while(x>0){if(x===15){s+='טו';break}if(x===16){s+='טז';break}for(const[v,l]of vals){if(x>=v){s+=l;x-=v;break}}}return s.length>1?s.slice(0,-1)+'״'+s.slice(-1):s+'׳'}
function hebYearStr(y){return gematriya(Math.floor(y/1000))==='ה׳'?gematriya(y%1000):gematriya(y%1000)}
function fmtHebFull(h){return `${gematriya(h.d)} ${hebMonthName(h.m,hebrewLeap(h.y))} ${hebYearStr(h.y)}`}
function fmtHebShort(h){return `${gematriya(h.d)} ${hebMonthName(h.m,hebrewLeap(h.y))}`}
function rdOfDateStr(ds){const[y,m,d]=ds.split('-').map(Number);return rdFromGregorian(y,m,d)}
function hebOfDateStr(ds){return hebrewFromRd(rdOfDateStr(ds))}
const WEEKDAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

/* ==================== SHA-256 (ללא תלות ברשת) ==================== */
function sha256(ascii){function rightRotate(v,a){return(v>>>a)|(v<<(32-a))}
ascii=unescape(encodeURIComponent(ascii));
var mathPow=Math.pow,maxWord=mathPow(2,32),lengthProperty='length',i,j,result='',words=[],asciiBitLength=ascii[lengthProperty]*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k[lengthProperty],isComposite={};
for(var candidate=2;primeCounter<64;candidate++){if(!isComposite[candidate]){for(i=0;i<313;i+=candidate){isComposite[i]=candidate}hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0}}
ascii+='\x80';while(ascii[lengthProperty]%64-56)ascii+='\x00';
for(i=0;i<ascii[lengthProperty];i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8}
words[words[lengthProperty]]=((asciiBitLength/maxWord)|0);words[words[lengthProperty]]=(asciiBitLength);
for(j=0;j<words[lengthProperty];){var w=words.slice(j,j+=16),oldHash=hash;hash=hash.slice(0,8);
for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2];var a=hash[0],e=hash[4];var temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
hash=[(temp1+temp2)|0].concat(hash);hash[4]=(hash[4]+temp1)|0}
for(i=0;i<8;i++){hash[i]=(hash[i]+oldHash[i])|0}}
for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}}
return result}

/* ==================== state + sync ==================== */
const LS_STATE='att_state_v1', LS_URL='att_gs_url', LS_SESSION='att_session_v1';
const DEFAULT_GS_URL='https://script.google.com/macros/s/AKfycbyEAzI2fqk4wqfTMzALvjndiRk5BZefuNc9G_qyyxg2GfFHgHQph8-ezxSGRAb-Wi6tbg/exec';   // Apps Script של המשתמש
let GS_URL = localStorage.getItem(LS_URL) || DEFAULT_GS_URL;
const qsGs = new URLSearchParams(location.search).get('gs');
if(qsGs){GS_URL=qsGs;localStorage.setItem(LS_URL,qsGs)}

let state={users:[],terms:[],records:[],extras:[],holidays:[],settings:{}};
try{const raw=localStorage.getItem(LS_STATE);if(raw)state=Object.assign(state,JSON.parse(raw))}catch(e){}
let me=null, currentTab='clock', pollTimer=null, tickTimer=null, modalOpen=false, serverLoaded=false;

function saveLocal(){try{localStorage.setItem(LS_STATE,JSON.stringify(state))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setSync(cls,txt){const d=document.getElementById('syncDot'),t=document.getElementById('syncTxt');if(d){d.className=cls;t.textContent=txt}}

function apiGet(params){
  if(!GS_URL) return Promise.resolve(null);
  const q=Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  return fetch(GS_URL+'?'+q).then(r=>r.json()).then(j=>{setSync('on','מסונכרן');return j}).catch(e=>{setSync('err','שגיאת רשת');return null});
}
function normalizeSettings(rows){const o={};(rows||[]).forEach(r=>o[r.key]=r.value);return o}
function serverLoad(silent){
  if(!GS_URL){setSync('','מקומי (ללא שרת)');return Promise.resolve(false)}
  return apiGet({action:'load',t:Date.now()}).then(j=>{
    if(!j||j.status==='error'){if(!silent)alert('שגיאה בטעינה מהשרת: '+(j&&j.message||'אין תקשורת'));return false}
    state.users=j.users||[];state.terms=j.terms||[];state.records=j.records||[];
    state.extras=j.extras||[];state.holidays=j.holidays||[];state.settings=normalizeSettings(j.settings);
    serverLoaded=true;saveLocal();return true;
  });
}
function upsert(sheet,obj){ // עדכון מקומי מיידי + שליחה לשרת
  const arr=state[sheet];const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0)arr[i]=obj;else arr.push(obj);
  saveLocal();
  return apiGet({action:'upsert',sheet,data:JSON.stringify(obj)});
}
function delItem(sheet,id){
  state[sheet]=state[sheet].filter(x=>x.id!==id);saveLocal();
  return apiGet({action:'del',sheet,id});
}
function setSetting(key,value){
  state.settings[key]=String(value);saveLocal();
  return apiGet({action:'setSetting',key,value});
}
function batchOps(ops){ // ops=[{op:'upsert',sheet,data:{...}} | {op:'del',sheet,id}]
  ops.forEach(o=>{
    if(o.op==='upsert'){const arr=state[o.sheet];const i=arr.findIndex(x=>x.id===o.data.id);if(i>=0)arr[i]=o.data;else arr.push(o.data)}
    else state[o.sheet]=state[o.sheet].filter(x=>x.id!==o.id);
  });
  saveLocal();
  return apiGet({action:'batch',ops:JSON.stringify(ops)});
}
function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  if(!GS_URL)return;
  pollTimer=setInterval(()=>{if(!modalOpen)serverLoad(true).then(ok=>{if(ok&&!modalOpen)render()})},15000);
}

/* ==================== date/time helpers ==================== */
function todayStr(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function nowHM(){const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}
function curYM(){return todayStr().slice(0,7)}
function toMin(t){if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m}
function hoursOf(rec){if(!rec.tin||!rec.tout)return 0;let mins=toMin(rec.tout)-toMin(rec.tin);if(mins<0)mins+=1440;return mins/60}
function fmtH(h){if(!h)return '0';const r=Math.round(h*100)/100;return (''+r).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'')}
function fmtDMY(ds){const[y,m,d]=ds.split('-');return `${d}/${m}/${y.slice(2)}`}
function weekdayOf(ds){const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).getDay()}
function isShabbat(ds){return weekdayOf(ds)===6}
function holidayOf(ds){return state.holidays.find(h=>h.date===ds)}
function monthDaysCount(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()}
function ymLabel(ym){const[y,m]=ym.split('-');const names=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];return names[+m-1]+' '+y}
function workdaysInMonth(ym,daysPerWeek){ // ימי עבודה תיאורטיים בחודש (ללא שבת/שישי לפי 5/6, בניכוי חגים)
  const n=monthDaysCount(ym);let c=0;
  for(let d=1;d<=n;d++){const ds=ym+'-'+String(d).padStart(2,'0');const w=weekdayOf(ds);
    const isWorkday=(+daysPerWeek===6)?(w<=5):(w<=4);
    if(isWorkday&&!holidayOf(ds))c++;}
  return c;
}

/* דיווח מאוחד: עובד ב-2+ עמותות שמחתים פעם אחת והשעות מתפצלות לפי אחוזים.
   הקונפיג נשמר ב-settings תחת split_<userId> = {"on":1,"pcts":{"kupat":60,"apiryon":40}} */
function getSplit(userId){
  try{
    const v=JSON.parse(state.settings['split_'+userId]||'null');
    if(v&&v.on&&v.pcts)return v;
  }catch(e){}
  return null;
}
function splitAmutot(userId){ // העמותות שמשתתפות בפיצול, לפי סדר קבוע
  const sp=getSplit(userId);if(!sp)return[];
  const ids=termsOf(userId).map(t=>t.amutaId);
  return AMUTOT.map(a=>a.id).filter(id=>ids.includes(id)&&(+sp.pcts[id]||0)>0);
}

/* חישוב חודשי לעובד בעמותה — בסיס לדוח הרו"ח */
function calcMonth(userId,amutaId,ym){
  const recs=recsOf(userId,amutaId,ym);
  const work=recs.filter(r=>r.type==='work'&&r.tin&&r.tout);
  const byDay={};work.forEach(r=>{byDay[r.date]=(byDay[r.date]||0)+hoursOf(r)});
  const days=Object.keys(byDay).length;
  const hours=Object.values(byDay).reduce((a,b)=>a+b,0);
  const otOn=state.settings.otEnabled==='1';
  const base=parseFloat(state.settings.otBase)||8.6, span=parseFloat(state.settings.ot125)||2;
  let h100=0,h125=0,h150=0;
  if(otOn){Object.values(byDay).forEach(h=>{h100+=Math.min(h,base);h125+=Math.min(Math.max(h-base,0),span);h150+=Math.max(h-base-span,0)})}
  else h100=hours;
  const cnt=t=>recs.filter(r=>r.type===t&&!r.tin).length;
  const absRecs=recs.filter(r=>r.type==='absence');
  const absDays=absRecs.filter(r=>!r.tin).length;
  const absHours=absRecs.filter(r=>r.tin&&r.tout).reduce((a,r)=>a+hoursOf(r),0);
  return {days,hours,h100,h125,h150,sick:cnt('sick'),vacation:cnt('vacation'),holiday:cnt('holiday'),absDays,absHours,openCount:recs.filter(r=>r.type==='work'&&r.tin&&!r.tout).length};
}
function extrasStr(userId,amutaId,ym){
  return state.extras.filter(x=>x.userId===userId&&x.amutaId===amutaId&&x.month===ym)
    .map(x=>x.label+(x.amount?': '+x.amount:'')+(x.note?' ('+x.note+')':'')).join(' | ');
}

/* ==================== תצוגת חודש מלא (כרטיס עובד) ==================== */
const DAY_LETTERS=['א','ב','ג','ד','ה','ו','ש'];
function monthGridHTML(userId,amutaId,ym,editable){
  const n=monthDaysCount(ym);
  let rows='',totH=0,workDays=0;const cnt={sick:0,vacation:0,holiday:0,absence:0};
  for(let d=1;d<=n;d++){
    const ds=ym+'-'+String(d).padStart(2,'0');
    const recs=state.records.filter(r=>r.userId===userId&&(!amutaId||r.amutaId===amutaId)&&r.date===ds)
      .sort((a,b)=>String(a.tin).localeCompare(String(b.tin)));
    const hol=holidayOf(ds), shab=isShabbat(ds);
    const cls=shab?'shabbat':(hol?'holiday':'');
    const dateCells=`<td class="num">${fmtDMY(ds)}</td><td><b>${DAY_LETTERS[weekdayOf(ds)]}</b></td><td class="muted" style="font-size:11.5px">${fmtHebShort(hebOfDateStr(ds))}</td>`;
    const blank=`<td></td><td></td><td></td>`;
    if(!recs.length){
      rows+=`<tr class="${cls}">${dateCells}${amutaId?'':'<td></td>'}<td></td><td></td><td></td><td class="muted">${hol?esc(hol.name):(shab?'שבת':'')}</td><td></td>${editable?'<td></td>':''}</tr>`;
      continue;
    }
    let dayH=0,hadWork=false;
    recs.forEach((r,i)=>{
      const h=(r.tin&&r.tout)?hoursOf(r):0;dayH+=h;
      if(r.type==='work'&&r.tin)hadWork=true;
      if(cnt[r.type]!==undefined&&!r.tin)cnt[r.type]++;
      rows+=`<tr class="${cls}">${i===0?dateCells:blank}
        ${amutaId?'':`<td><span class="tag" style="background:${amuta(r.amutaId).hex}22;color:${amuta(r.amutaId).hex}">${esc(amuta(r.amutaId).short)}</span></td>`}
        <td class="num">${r.tin||'—'}</td>
        <td class="num">${r.tout||(r.type==='work'&&r.tin?'<span class="open-punch">פתוח ▶</span>':'—')}</td>
        <td class="num"><b>${h?fmtH(h):''}</b></td>
        <td>${r.type!=='work'?(REC_TYPES[r.type]||r.type):(hol?esc(hol.name):'')}</td>
        <td style="white-space:normal;max-width:180px">${esc(r.note||'')}</td>
        ${editable?`<td><button class="btn btn-ghost btn-sm" onclick="openRecModal('${r.id}')">✎</button></td>`:''}</tr>`;
    });
    totH+=dayH;if(hadWork)workDays++;
  }
  const cntTxt=['sick','vacation','holiday'].filter(k=>cnt[k]).map(k=>REC_TYPES[k]+': '+cnt[k]).join(' · ');
  rows+=`<tr class="total"><td colspan="3">סה"כ</td>${amutaId?'':'<td></td>'}
    <td class="num" colspan="2">${workDays} ימי עבודה</td>
    <td class="num">${fmtH(totH)} שעות</td>
    <td colspan="2">${cntTxt}</td>${editable?'<td></td>':''}</tr>`;
  return `<div class="tbl-wrap"><table><thead><tr>
    <th>תאריך</th><th>יום</th><th>עברי</th>${amutaId?'':'<th>עמותה</th>'}<th>כניסה</th><th>יציאה</th><th>סה"כ</th><th>סוג</th><th>הערה</th>${editable?'<th></th>':''}
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* שכר: שעתי = תעריף×שעות. חודשי = ברוטו קבוע (לא יורד כשעובד פחות) —
   אבל מחשבים "כמה יוצא לשעה" = ברוטו ÷ שעות שדווחו באותו חודש */
function payOf(tm,c,ym){
  const rate=parseFloat(tm.rate)||0;
  if(!rate)return null;
  if(tm.empType==='monthly'){
    return {pay:rate, perHour:c.hours?rate/c.hours:null};
  }
  return {pay:rate*c.hours, perHour:rate};
}
function fmtShekel(p){return '₪'+Math.round(p).toLocaleString('he-IL')}
function fmtShekelDec(p){return '₪'+(Math.round(p*10)/10).toLocaleString('he-IL')}

function updateTimers(){
  document.querySelectorAll('[id^="timer-"]').forEach(el=>{
    const [ds,tm]=el.dataset.in.split('T');
    const start=new Date(ds+'T'+tm+':00');
    let mins=Math.max(0,Math.round((Date.now()-start)/60000));
    el.textContent=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
  });
}
function punchIn(amutaId){
  const others=anyOpenPunches(me.id).filter(r=>r.amutaId!==amutaId&&r.date===todayStr());
  if(others.length){
    const o=others[0];
    if(confirm(`אתה עדיין מוחתם ב"${amuta(o.amutaId).short}" מ-${o.tin}. לסגור שם עכשיו (${nowHM()}) ולהיכנס כאן?`)){
      o.tout=nowHM();o.by=me.name;o.ts=new Date().toISOString();upsert('records',o);
    } else return;
  }
  if(openPunch(me.id,amutaId)){alert('כבר קיים שעון פתוח בעמותה זו');return}
  const noteEl=document.getElementById('note-'+amutaId);
  const rec={id:uid(),userId:me.id,amutaId,date:todayStr(),tin:nowHM(),tout:'',type:'work',note:noteEl?noteEl.value.trim():'',src:'clock',by:me.name,ts:new Date().toISOString()};
  upsert('records',rec);render();
}
function punchOut(amutaId){
  const op=openPunch(me.id,amutaId);
  if(!op){alert('לא נמצא שעון פתוח');return}
  if(op.date!==todayStr()&&!confirm('השעון נפתח ב-'+fmtDMY(op.date)+' — לסגור אותו בשעה הנוכחית? (עדיף לתקן ידנית)'))return;
  const noteEl=document.getElementById('note-'+amutaId);
  op.tout=nowHM();if(noteEl&&noteEl.value.trim())op.note=noteEl.value.trim();
  op.by=me.name;op.ts=new Date().toISOString();
  upsert('records',op);render();
}
function minToHM(mins){mins=((Math.round(mins)%1440)+1440)%1440;return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')}
function punchInUnified(){
  const spIds=splitAmutot(me.id),sp=getSplit(me.id);
  if(anyOpenPunches(me.id).some(r=>spIds.includes(r.amutaId))){alert('כבר קיים שעון פתוח');return}
  // נפתח בעמותה עם האחוז הגבוה — ביציאה יתפצל בין כולן
  const primary=[...spIds].sort((a,b)=>(+sp.pcts[b]||0)-(+sp.pcts[a]||0))[0];
  const noteEl=document.getElementById('note-unified');
  const rec={id:uid(),userId:me.id,amutaId:primary,date:todayStr(),tin:nowHM(),tout:'',type:'work',note:noteEl?noteEl.value.trim():'',src:'clock',by:me.name,ts:new Date().toISOString()};
  upsert('records',rec);render();
}
function punchOutUnified(){
  const spIds=splitAmutot(me.id),sp=getSplit(me.id);
  const op=anyOpenPunches(me.id).find(r=>spIds.includes(r.amutaId));
  if(!op){alert('לא נמצא שעון פתוח');return}
  if(op.date!==todayStr()&&!confirm('השעון נפתח ב-'+fmtDMY(op.date)+' — לסגור אותו בשעה הנוכחית?'))return;
  const tout=nowHM();
  let total=toMin(tout)-toMin(op.tin);if(total<0)total+=1440;
  const noteEl=document.getElementById('note-unified');
  const note=(noteEl&&noteEl.value.trim())||op.note||'';
  const ts=new Date().toISOString();
  const sum=spIds.reduce((s,id)=>s+(+sp.pcts[id]||0),0)||100;
  // פיצול רציף: כל עמותה מקבלת מקטע זמן לפי האחוז שלה; האחרונה סוגרת בדיוק בשעת היציאה
  const ops=[];let start=toMin(op.tin);
  spIds.forEach((aid,i)=>{
    const isLast=i===spIds.length-1;
    const segEnd=isLast?toMin(op.tin)+total:start+Math.round(total*(+sp.pcts[aid]||0)/sum);
    const rec=(i===0)?op:{id:uid(),userId:me.id,date:op.date,type:'work',src:'clock'};
    rec.amutaId=aid;rec.tin=minToHM(start);rec.tout=minToHM(segEnd);
    rec.note=note+(spIds.length>1?' [מאוחד '+(+sp.pcts[aid])+'%]':'');
    rec.by=me.name;rec.ts=ts;
    ops.push({op:'upsert',sheet:'records',data:rec});
    start=segEnd;
  });
  batchOps(ops);render();
}
function reportDay(){
  const amutaId=document.getElementById('dayAmuta').value, date=document.getElementById('dayDate').value,
        type=document.getElementById('dayType').value, note=document.getElementById('dayNote').value.trim();
  if(!date){alert('בחר תאריך');return}

  upsert('records',{id:uid(),userId:me.id,amutaId,date,tin:'',tout:'',type,note,src:'manual',by:me.name,ts:new Date().toISOString()});
  alert('הדיווח נשלח ✓');render();
}

        <div><label>תחילת עבודה</label><input type="date" id="tf-${a.id}-startDate" value="${tm?esc(tm.startDate||''):''}"></div>
        <div><label>הפסקת עבודה</label><input type="date" id="tf-${a.id}-endDate" value="${tm?esc(tm.endDate||''):''}"></div>

      ${u&&u.id!==me.id?`<button class="btn btn-bad" style="margin-inline-start:auto" onclick="deleteEmp('${u.id}')">🗑 מחיקה</button>`:''}

function spPrefill(){ // סימון "דיווח מאוחד" ממלא אוטומטית חלוקה שווה לעמותות המסומנות
  if(!document.getElementById('emSplitOn').checked)return;
  const ids=AMUTOT.map(a=>a.id).filter(id=>document.getElementById('tbc-'+id).checked);
  if(ids.length<2){alert('סמן קודם ✔ ליד 2 עמותות לפחות (בקטע שיוך לעמותות למעלה)');document.getElementById('emSplitOn').checked=false;return}
  const hasVal=ids.some(id=>+document.getElementById('sp-'+id).value>0);
  if(hasVal)return;
  const base=Math.floor(100/ids.length);
  ids.forEach((id,i)=>{document.getElementById('sp-'+id).value=(i===0)?(100-base*(ids.length-1)):base});
}
function saveEmp(userId){
  const name=document.getElementById('emName').value.trim(),un=document.getElementById('emUser').value.trim();
  if(!name||!un){alert('חסר שם / שם משתמש');return}
  const dupe=state.users.find(x=>String(x.username).toLowerCase()===un.toLowerCase()&&x.id!==userId);
  if(dupe){alert('שם המשתמש כבר קיים');return}
  const u=userId?userById(userId):{id:uid(),hash:''};
  u.name=name;u.username=un;
  const pw=document.getElementById('emPass').value;
  if(pw)u.hash=hashPass(pw);
  if(!u.hash){alert('חובה להגדיר סיסמה לעובד חדש');return}
  u.role=document.getElementById('emRole').value;
  u.canEdit=document.getElementById('emCanEdit').value;
  u.active=document.getElementById('emActive').value;
  const ops=[{op:'upsert',sheet:'users',data:u}];
  AMUTOT.forEach(a=>{
    const on=document.getElementById('tbc-'+a.id).checked;
    const ex=termOf(u.id,a.id);
    if(on){
      const tm=ex||{id:uid(),userId:u.id,amutaId:a.id};
      ['empNum','empType','rate','daysPerWeek','quotaDays','quotaHours','travel','startDate','endDate','endReason'].forEach(f=>{
        tm[f]=document.getElementById(`tf-${a.id}-${f}`).value.trim();
      });
      ops.push({op:'upsert',sheet:'terms',data:tm});
    } else if(ex){
      ops.push({op:'del',sheet:'terms',id:ex.id});
    }
  });
  batchOps(ops);
  // דיווח מאוחד — נשמר ב-settings, לא דורש שינוי בגיליון.
  // אחוזים תקינים מספיקים גם אם שכחו לסמן את התיבה (עם אישור).
  const spOn=document.getElementById('emSplitOn').checked;
  const pcts={};let sum=0,cnt=0;
  AMUTOT.forEach(a=>{
    if(!document.getElementById('tbc-'+a.id).checked)return;
    const v=+document.getElementById('sp-'+a.id).value||0;
    if(v>0){pcts[a.id]=v;sum+=v;cnt++}
  });
  const valid=cnt>=2&&sum===100;
  let enable=spOn&&valid;
  if(!spOn&&valid&&confirm('מילאת אחוזי חלוקה לדיווח מאוחד אבל התיבה לא סומנה — להפעיל את הדיווח המאוחד ('+Object.values(pcts).join('/')+')?'))enable=true;
  if(spOn&&!valid){
    alert('דיווח מאוחד לא הופעל: יש למלא אחוזים ל-2 עמותות מסומנות לפחות, בסכום של בדיוק 100 (כרגע: '+sum+'). שאר פרטי העובד נשמרו.');
  } else {
    setSetting('split_'+u.id,enable?JSON.stringify({on:1,pcts}):'');
  }
  if(me.id===u.id)me=u;
  closeModal();render();
}
function deleteEmp(userId){
  const u=userById(userId);
  if(!confirm('למחוק את '+u.name+'? (הדיווחים ההיסטוריים יישארו). עדיף בדרך כלל לסמן "לא פעיל".'))return;
  const ops=[{op:'del',sheet:'users',id:userId}];
  termsOf(userId).forEach(tm=>ops.push({op:'del',sheet:'terms',id:tm.id}));
  batchOps(ops);closeModal();render();
}

/* ==================== דוח חודשי (פורמט רו"ח) ==================== */
let repYM=curYM(), repAmuta='ezrat', repView='clean';
/* תצוגה מסודרת: טבלה נקייה פר עמותה + שכר בפועל (כולל ברוטו חודשי יחסי) */
function cleanTableFor(aid,ym){
  const a=amuta(aid);
  const terms=state.terms.filter(tm=>tm.amutaId===aid).filter(tm=>{
    const u=userById(tm.userId);if(!u)return false;
    if(u.active!=='0')return true;
    return recsOf(tm.userId,aid,ym).length>0;
  }).sort((x,y)=>((+x.empNum||999)-(+y.empNum||999)));
  let totH=0,totD=0,totPay=0,anyPay=false;
  const rows=terms.map(tm=>{
    const u=userById(tm.userId),c=calcMonth(tm.userId,aid,ym),p=payOf(tm,c,ym);
    const qh=parseFloat(tm.quotaHours)||0;
    const qd=tm.empType==='monthly'?(parseFloat(tm.quotaDays)||workdaysInMonth(ym,tm.daysPerWeek||'5')):0;
    const pct=qh?Math.round(c.hours/qh*100):(qd?Math.round(c.days/qd*100):null);
    totH+=c.hours;totD+=c.days;if(p){totPay+=p.pay;anyPay=true}
    return `<tr>
      <td><b>${esc(u.name)}</b></td><td class="num">${esc(tm.empNum||'')}</td>
      <td>${tm.empType==='monthly'?'ברוטו חודשי':'שעתי'}</td>
      <td class="num">${tm.rate?fmtShekel(+tm.rate):''}</td>
      <td class="num">${c.days}</td>
      <td class="num"><b>${fmtH(c.hours)}</b></td>
      <td class="num">${qh?fmtH(qh)+' ש׳':(qd?qd+' ימים':'—')}</td>
      <td style="min-width:120px">${pct!==null?`<div style="display:flex;gap:6px;align-items:center"><span class="num" style="width:40px;font-weight:700">${pct}%</span><div class="prog" style="flex:1;margin-top:0"><div style="width:${Math.min(100,pct)}%;background:${pct>=100?'var(--ok)':a.hex}"></div></div></div>`:'—'}</td>
      <td class="num">${c.sick||''}</td><td class="num">${c.vacation||''}</td><td class="num">${c.holiday||''}</td>
      <td class="num"><b>${p?fmtShekel(p.pay):'—'}</b></td>
      <td class="num">${p&&p.perHour?'<b>'+fmtShekelDec(p.perHour)+'</b>':'—'}</td>
    </tr>`;
  }).join('');
  return `<div class="card" style="margin-bottom:16px">
    <h3 style="color:${a.hex};margin-bottom:10px">${a.icon} ${esc(a.short)} — ${ymLabel(ym)}</h3>
    <div class="tbl-wrap"><table><thead><tr>
      <th>עובד</th><th>מס'</th><th>היקף</th><th>תעריף</th><th>ימי עבודה</th><th>שעות</th><th>תקן</th><th>% מהתקן</th><th>מחלה</th><th>חופשה</th><th>חג</th><th>שכר</th><th>₪ לשעה בפועל</th>
    </tr></thead><tbody>
      ${rows||'<tr><td colspan="13" class="muted">אין עובדים / דיווחים בחודש זה</td></tr>'}
      ${rows?`<tr class="total"><td>סה"כ</td><td></td><td></td><td></td><td class="num">${totD}</td><td class="num">${fmtH(totH)}</td><td></td><td></td><td></td><td></td><td></td><td class="num">${anyPay?fmtShekel(totPay):''}</td><td class="num">${anyPay&&totH?fmtShekelDec(totPay/totH):''}</td></tr>`:''}
    </tbody></table></div>
    <p class="muted" style="font-size:12px;margin-top:8px">💡 "שכר": שעתי = תעריף × שעות · ברוטו חודשי = המשכורת הקבועה (לא משתנה). "₪ לשעה בפועל": לעובד חודשי — הברוטו חלקי השעות שדווחו החודש; לעובד שעתי — התעריף שלו.</p>
  </div>`;
}
const REP_HEADERS=['שם','היקף המשרה חודשי / שעתי','תעריף לשעה/חודש','ימי עבודה בשבוע 5/6','מס עובד','ימי עבודה בפועל','מתוך ימי עבודה בחודש (לעובד חודשי)','שעות עבודה בפועל','מתוך שעות עבודה בחודש (לעובד חודשי)','שעות בשיעור 100%','שעות בשיעור 125%','שעות בשיעור 150%','נסיעות','ימי חופשה','ימי מחלה','ימי חג','העדרויות-ימים','העדרויות-שעות','תאריך הפסקת עבודה','סיבת הפסקת עבודה','הערות/ שעות בתעריף מיוחד'];
function repRowsFor(amutaId,ym){
  const terms=state.terms.filter(tm=>tm.amutaId===amutaId).filter(tm=>{
    const u=userById(tm.userId);if(!u)return false;
    if(u.active!=='0')return true;
    return recsOf(tm.userId,amutaId,ym).length>0; // לא פעיל אבל עבד בחודש הזה
  }).sort((a,b)=>((+a.empNum||999)-(+b.empNum||999)));
  return terms.map(tm=>{
    const u=userById(tm.userId), c=calcMonth(tm.userId,amutaId,ym);
    const quotaD=tm.quotaDays||workdaysInMonth(ym,tm.daysPerWeek||'5');
    const quotaH=tm.quotaHours||'';
    const endInMonth=tm.endDate&&tm.endDate.startsWith(ym);
    return {
      name:u.name, empType:tm.empType==='monthly'?'חודשי':'שעתי', rate:tm.rate||'', dpw:tm.daysPerWeek||'5', empNum:tm.empNum||'',
      days:c.days, quotaD:tm.empType==='monthly'?quotaD:'', hours:fmtH(c.hours), quotaH:tm.empType==='monthly'?quotaH:'',
      h100:fmtH(c.h100), h125:c.h125?fmtH(c.h125):'', h150:c.h150?fmtH(c.h150):'',
      travel:tm.travel||'', vac:c.vacation||'', sick:c.sick||'', hol:c.holiday||'',
      absD:c.absDays||'', absH:c.absHours?fmtH(c.absHours):'',
      endDate:endInMonth?fmtDMY(tm.endDate):'', endReason:endInMonth?(tm.endReason||''):'',
      notes:extrasStr(tm.userId,amutaId,ym)
    };
  });
}
function repRowArr(r){return [r.name,r.empType,r.rate,r.dpw,r.empNum,r.days,r.quotaD,r.hours,r.quotaH,r.h100,r.h125,r.h150,r.travel,r.vac,r.sick,r.hol,r.absD,r.absH,r.endDate,r.endReason,r.notes]}
function renderReport(){
  const tabs=AMUTOT.map(a=>`<button class="btn ${repAmuta===a.id?'btn-primary':'btn-ghost'}" onclick="repAmuta='${a.id}';render()" style="${repAmuta===a.id?'background:'+a.hex:''}">${a.icon} ${esc(a.short)}</button>`).join('')
    +`<button class="btn ${repAmuta==='all'?'btn-primary':'btn-ghost'}" onclick="repAmuta='all';render()">📊 מרוכז</button>`;
  let html=`<div class="card no-print" style="margin-bottom:14px"><div class="flex">
    <div><label>חודש</label><input type="month" value="${repYM}" onchange="repYM=this.value;render()"></div>
    <div class="flex" style="align-self:flex-end">${tabs}</div>
    <div class="flex" style="align-self:flex-end;margin-inline-start:auto">
      <button class="btn ${repView==='clean'?'btn-blue':'btn-ghost'}" onclick="repView='clean';render()">📊 תצוגה מסודרת</button>
      <button class="btn ${repView==='acc'?'btn-blue':'btn-ghost'}" onclick="repView='acc';render()">📄 פורמט רו"ח</button>
      <button class="btn btn-ok" onclick="exportReport()">⬇️ ייצוא אקסל</button>
      <button class="btn btn-ghost" onclick="window.print()">🖨 הדפסה</button>
    </div>

  const list=repAmuta==='all'?AMUTOT.map(a=>a.id):[repAmuta];

    html+=`<div class="card rep" style="margin-bottom:16px">
      <h3 style="color:${a.hex};margin-bottom:10px">${a.icon} ${esc(a.short)} — טבלת נתוני שכר ${ymLabel(repYM)} <span class="muted" style="font-size:12px;font-weight:400">(${esc(a.full)})</span></h3>
      <div class="tbl-wrap"><table>
        <thead>
          <tr><th></th><th colspan="3" class="grp">נתונים קבועים</th><th colspan="8" class="grp">נתוני שעות וימים</th><th colspan="9" class="grp">רכיבי שכר</th></tr>

          ${rows.length?`<tr class="total"><td>סה"כ</td><td></td><td></td><td></td><td></td>
            <td class="num">${rows.reduce((s,r)=>s+(+r.days||0),0)}</td><td></td>

function exportReport(){
  const list=repAmuta==='all'?AMUTOT.map(a=>a.id):[repAmuta];
  const[gy,gm]=repYM.split('-');
  const mmyy=gm+'-'+gy.slice(2);
  if(typeof XLSX!=='undefined'){
    const wb=XLSX.utils.book_new();
    wb.Workbook={Views:[{RTL:true}]};
    list.forEach(aid=>{
      const a=amuta(aid), rows=repRowsFor(aid,repYM);
      const aoa=[];
      aoa.push(['',a.short+'- טבלת נתוני שכר']);
      const grp=new Array(21).fill('');grp[1]='נתונים קבועים';grp[4]='נתוני שעות וימים';grp[12]='רכיבי שכר';
      aoa.push(grp);
      aoa.push(REP_HEADERS);
      rows.forEach(r=>aoa.push(repRowArr(r).map(v=>{const n=parseFloat(v);return v!==''&&!isNaN(n)&&/^[\d.]+$/.test(String(v))?n:v})));
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      ws['!merges']=[
        {s:{r:0,c:1},e:{r:0,c:8}},
        {s:{r:1,c:1},e:{r:1,c:3}},
        {s:{r:1,c:4},e:{r:1,c:11}},
        {s:{r:1,c:12},e:{r:1,c:20}}
      ];
      ws['!cols']=[{wch:20},{wch:12},{wch:11},{wch:9},{wch:8},{wch:10},{wch:12},{wch:10},{wch:12},{wch:9},{wch:9},{wch:9},{wch:9},{wch:8},{wch:8},{wch:8},{wch:10},{wch:10},{wch:12},{wch:14},{wch:24}];
      XLSX.utils.book_append_sheet(wb,ws,a.short.replace(/["\\\/\[\]\*\?:]/g,'').slice(0,30));
    });
    XLSX.writeFile(wb,(list.length>1?'דוח נוכחות מרוכז':amuta(list[0]).short)+' '+mmyy+'.xlsx');
  } else {
    // fallback ללא ספרייה — קובץ xls בפורמט HTML
    let html='<html dir="rtl" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>';
    list.forEach(aid=>{
      const a=amuta(aid), rows=repRowsFor(aid,repYM);
      html+=`<table border="1"><tr><td></td><td colspan="8" style="font-weight:bold">${esc(a.short)}- טבלת נתוני שכר</td></tr>
        <tr><td></td><td colspan="3" style="background:#e0e7ff">נתונים קבועים</td><td colspan="8" style="background:#e0e7ff">נתוני שעות וימים</td><td colspan="9" style="background:#e0e7ff">רכיבי שכר</td></tr>
        <tr>${REP_HEADERS.map(h=>`<td style="font-weight:bold;background:#f1f5f9">${h}</td>`).join('')}</tr>
        ${rows.map(r=>`<tr>${repRowArr(r).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table><br>`;
    });
    html+='</body></html>';
    const blob=new Blob(['﻿'+html],{type:'application/vnd.ms-excel'});
    const aEl=document.createElement('a');aEl.href=URL.createObjectURL(blob);
    aEl.download=(list.length>1?'דוח נוכחות מרוכז':amuta(list[0]).short)+' '+mmyy+'.xls';aEl.click();
  }
}

/* ==================== הגדרות (מנהל) ==================== */
function renderSettings(){
  const s=state.settings;
  const hebNow=hebrewFromRd(rdFromGregorian(...todayStr().split('-').map(Number))).y;
  const hols=[...state.holidays].sort((a,b)=>a.date.localeCompare(b.date));
  const extras=[...state.extras].sort((a,b)=>b.month.localeCompare(a.month));
  return `
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">

    <div class="card">
      <h3>🔗 חיבור לשרת (Google Sheets)</h3>
      <p class="muted" style="font-size:13px;margin:8px 0">הנתונים נשמרים בגיליון Google דרך Apps Script. כל המכשירים מסתנכרנים אוטומטית.</p>
      <label>כתובת /exec</label>
      <input id="setGsUrl" dir="ltr" value="${esc(GS_URL)}" placeholder="https://script.google.com/macros/s/.../exec">
      <div class="flex" style="margin-top:10px">
        <button class="btn btn-primary btn-sm" onclick="saveGsUrl()">שמור והתחבר</button>
        <span class="muted" style="font-size:12px">${GS_URL?(serverLoaded?'✓ מחובר ומסונכרן':'ממתין לחיבור...'):'⚠ עובד מקומית בלבד'}</span>
      </div>
    </div>

    <div class="card">
      <h3>⏱ שעות נוספות (פיצול 100/125/150)</h3>
      <div class="flex" style="margin-top:10px">
        <div><label>פיצול אוטומטי</label><select id="setOt"><option value="0" ${s.otEnabled!=='1'?'selected':''}>כבוי — הכל ב-100%</option><option value="1" ${s.otEnabled==='1'?'selected':''}>פעיל</option></select></div>
        <div><label>שעות בסיס ליום (100%)</label><input type="number" step="0.1" id="setOtBase" value="${esc(s.otBase||'8.6')}"></div>
        <div><label>שעות ב-125%</label><input type="number" step="0.1" id="setOt125" value="${esc(s.ot125||'2')}"></div>
      </div>
      <button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="saveOt()">שמור</button>
    </div>

    <div class="card" style="grid-column:1/-1">
      <h3>🎉 חגים וימי שבתון</h3>
      <p class="muted" style="font-size:13px;margin:8px 0">תאריכים המסומנים כחג מסומנים בטבלאות ומנוכים מתקן ימי העבודה. אפשר לטעון אוטומטית את מועדי ישראל לפי הלוח העברי.</p>
      <div class="flex">
        <div><label>שנה עברית</label><select id="holYear">${[hebNow-1,hebNow,hebNow+1].map(y=>`<option value="${y}" ${y===hebNow?'selected':''}>${hebYearStr(y)}</option>`).join('')}</select></div>
        <div><label>כולל חול המועד</label><select id="holChm"><option value="1">כן</option><option value="0">לא</option></select></div>
        <div style="align-self:flex-end"><button class="btn btn-blue btn-sm" onclick="loadJewishHolidays()">📥 טען מועדי ישראל</button></div>
        <div style="border-right:1px solid var(--line);padding-right:14px" class="flex">
          <div><label>תאריך</label><input type="date" id="holDate"></div>
          <div><label>שם</label><input id="holName" placeholder="ערב חג / פורים..."></div>
          <div style="align-self:flex-end"><button class="btn btn-ok btn-sm" onclick="addHoliday()">➕ הוסף ידני</button></div>
        </div>
      </div>
      <div class="flex" style="margin-top:12px;gap:6px">
        ${hols.map(h=>`<span class="tag" style="background:#fef9c3;color:#854d0e;font-size:12px">${fmtDMY(h.date)} ${esc(h.name||'')} <a href="#" onclick="delItem('holidays','${h.id}');render();return false" style="color:#b45309">✕</a></span>`).join('')||'<span class="muted">אין חגים מוגדרים</span>'}
      </div>
      <hr class="sep">
      <h3 style="font-size:14px">סימון "יום חג" לכל העובדים</h3>
      <p class="muted" style="font-size:12.5px;margin:6px 0">יוצר רשומת "חג" לכל העובדים הפעילים בעמותה בתאריך שנבחר (לעמודת "ימי חג" בדוח).</p>
      <div class="flex">
        <div><label>תאריך</label><input type="date" id="hdDate"></div>
        <div><label>עמותה</label><select id="hdAmuta"><option value="all">כל העמותות</option>${AMUTOT.map(a=>`<option value="${a.id}">${esc(a.short)}</option>`).join('')}</select></div>
        <div style="align-self:flex-end"><button class="btn btn-warn btn-sm" onclick="markHolidayDay()">🎉 סמן יום חג לעובדים</button></div>
      </div>
    </div>

    <div class="card" style="grid-column:1/-1">
      <h3>💰 תוספות שכר (הבראה, בונוס, ימי חג בתשלום...)</h3>
      <p class="muted" style="font-size:13px;margin:8px 0">התוספות מופיעות בעמודת ההערות בדוח החודשי לרו"ח.</p>
      <div class="flex">
        <div><label>עובד</label><select id="exUser">${activeUsers().map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div>
        <div><label>עמותה</label><select id="exAmuta">${AMUTOT.map(a=>`<option value="${a.id}">${esc(a.short)}</option>`).join('')}</select></div>
        <div><label>חודש</label><input type="month" id="exMonth" value="${curYM()}"></div>
        <div><label>סוג</label><input id="exLabel" placeholder="הבראה / בונוס..." list="exTypes"><datalist id="exTypes"><option value="הבראה"><option value="בונוס"><option value="ימי חג בתשלום"><option value="שעות בתעריף מיוחד"></datalist></div>
        <div><label>סכום/כמות</label><input id="exAmount" type="number"></div>
        <div style="flex:1"><label>הערה</label><input id="exNote"></div>
        <div style="align-self:flex-end"><button class="btn btn-ok btn-sm" onclick="addExtra()">➕ הוסף</button></div>
      </div>
      ${extras.length?`<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>חודש</th><th>עובד</th><th>עמותה</th><th>סוג</th><th>סכום</th><th>הערה</th><th></th></tr></thead><tbody>
        ${extras.map(x=>`<tr><td>${esc(x.month)}</td><td>${esc((userById(x.userId)||{}).name||'?')}</td><td>${esc(amuta(x.amutaId).short)}</td><td>${esc(x.label)}</td><td class="num">${esc(x.amount||'')}</td><td>${esc(x.note||'')}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="delItem('extras','${x.id}');render()">🗑</button></td></tr>`).join('')}
      </tbody></table></div>`:''}
    </div>

    <div class="card">
      <h3>💾 גיבוי</h3>
      <div class="flex" style="margin-top:10px">
        <button class="btn btn-ghost btn-sm" onclick="backupJson()">⬇️ הורד גיבוי JSON</button>
      </div>
      <p class="muted" style="font-size:12px;margin-top:8px">הנתונים שמורים בגיליון Google — הגיבוי הוא שכבת ביטחון נוספת.</p>
    </div>
  </div>`;
}
function saveGsUrl(){
  const url=document.getElementById('setGsUrl').value.trim();
  GS_URL=url;
  if(url)localStorage.setItem(LS_URL,url);else localStorage.removeItem(LS_URL);
  if(url)serverLoad(false).then(ok=>{if(ok){startPolling();render();alert('מחובר ✓')}});
  else{setSync('','מקומי (ללא שרת)');render()}
}
function saveOt(){
  setSetting('otEnabled',document.getElementById('setOt').value);
  setSetting('otBase',document.getElementById('setOtBase').value||'8.6');
  setSetting('ot125',document.getElementById('setOt125').value||'2');
  alert('נשמר ✓');
}
function addHoliday(){
  const d=document.getElementById('holDate').value,n=document.getElementById('holName').value.trim();
  if(!d){alert('בחר תאריך');return}
  if(holidayOf(d)){alert('התאריך כבר מסומן כחג');return}
  upsert('holidays',{id:uid(),date:d,name:n||'חג'});render();
}
function loadJewishHolidays(){
  const y=+document.getElementById('holYear').value;
  const chm=document.getElementById('holChm').value==='1';
  const items=[
    [7,1,'א׳ ראש השנה'],[7,2,'ב׳ ראש השנה'],[7,10,'יום כיפור'],[7,15,'א׳ סוכות'],[7,22,'שמיני עצרת/שמח"ת'],
    [1,15,'א׳ פסח'],[1,21,'שביעי של פסח'],[3,6,'שבועות']
  ];
  if(chm){
    for(let d=16;d<=21;d++)items.push([7,d,d===21?'הושענא רבה':'חוה"מ סוכות']);
    for(let d=16;d<=20;d++)items.push([1,d,'חוה"מ פסח']);
  }
  const ops=[];
  items.forEach(([m,d,name])=>{
    const g=gregorianFromRd(rdFromHebrew(y,m,d));
    const ds=g.y+'-'+String(g.m).padStart(2,'0')+'-'+String(g.d).padStart(2,'0');
    if(!holidayOf(ds))ops.push({op:'upsert',sheet:'holidays',data:{id:uid(),date:ds,name}});
  });
  if(!ops.length){alert('כל המועדים כבר קיימים');return}
  batchOps(ops);render();
  alert('נוספו '+ops.length+' מועדים לשנת '+hebYearStr(y)+' ✓');
}
function markHolidayDay(){
  const d=document.getElementById('hdDate').value, aid=document.getElementById('hdAmuta').value;
  if(!d){alert('בחר תאריך');return}
  const list=aid==='all'?AMUTOT.map(a=>a.id):[aid];
  const ops=[];
  list.forEach(amutaId=>{
    state.terms.filter(tm=>tm.amutaId===amutaId).forEach(tm=>{
      const u=userById(tm.userId);if(!u||u.active==='0')return;
      const dup=state.records.find(r=>r.userId===tm.userId&&r.amutaId===amutaId&&r.date===d&&r.type==='holiday');
      if(!dup)ops.push({op:'upsert',sheet:'records',data:{id:uid(),userId:tm.userId,amutaId,date:d,tin:'',tout:'',type:'holiday',note:holidayOf(d)?holidayOf(d).name:'יום חג',src:'manual',by:me.name,ts:new Date().toISOString()}});
    });
  });
  if(!ops.length){alert('כבר מסומן לכל העובדים');return}
  batchOps(ops);alert('סומן יום חג ל-'+ops.length+' עובדים ✓');render();
}
function addExtra(){
  const x={id:uid(),userId:document.getElementById('exUser').value,amutaId:document.getElementById('exAmuta').value,
    month:document.getElementById('exMonth').value,label:document.getElementById('exLabel').value.trim(),
    amount:document.getElementById('exAmount').value,note:document.getElementById('exNote').value.trim()};
  if(!x.label){alert('הזן סוג תוספת');return}
  upsert('extras',x);render();
}
function backupJson(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='attendance-backup-'+todayStr()+'.json';a.click();
}

/* ==================== modal infra ==================== */
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalBack').classList.add('show');modalOpen=true}
function closeModal(){document.getElementById('modalBack').classList.remove('show');modalOpen=false}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen)closeModal()});

/* ==================== boot ==================== */
(function boot(){
  const proceed=()=>{
    const s=session();
    const u=s&&userById(s.uid);
    if(u&&u.active!=='0')enterApp(u);else renderLogin();
  };
  proceed(); // כניסה מיידית מהמטמון המקומי
  if(GS_URL)serverLoad(true).then(ok=>{
    if(!ok)return;
    const s=session();
    const u=s&&userById(s.uid);
    if(me){
      if(!u||u.active==='0'){logout();return}
      me=u;
      if(!modalOpen)render();
    } else proceed();
  });
})();
</script>
